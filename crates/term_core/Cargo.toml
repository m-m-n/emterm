[package]
name = "term_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ANSI parser + terminal grid + Unicode processing core for eMterm (pure Rust)."
repository = "https://github.com/m-m-n/emterm"
license = "MIT"

[lib]
name = "term_core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
unicode-width = "0.2"

# NOTE: deliberately no wasm-bindgen / js-sys / web-sys / serde-wasm-bindgen.
# Anything that previously crossed the JS boundary now goes through the
# TerminalCallbacks trait (see callbacks.rs).

# Test-only: cross-check the mux transport constants in mux_apc_extractor.rs
# against their cross-crate SSOT (mux_ipc::protocol). mux_ipc does NOT depend on
# term_core, so this dev-dependency creates no cycle, and it does not enter the
# production dependency graph of any downstream consumer (wasm / CLI builds).
[dev-dependencies]
mux_ipc = { path = "../mux_ipc" }
