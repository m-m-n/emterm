schema_version: 1
feature: wasm-sgr-edit-scroll
scale: standard
created: 2026-02-15

project:
  components:
    main:
      language: rust
      build_command: "cd wasm && wasm-pack build --target web --out-dir pkg"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml && cargo test --manifest-path wasm/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
    frontend:
      language: typescript
      build_command: "bun run build"
      test_command: "bun test"
      format_command: "bun run typecheck"

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: f78560bcd796332f166e5edc1e0cccc6db6b6f0d
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: f78560bcd796332f166e5edc1e0cccc6db6b6f0d
  - id: implement
    status: completed
    completed_at_commit: f78560bcd796332f166e5edc1e0cccc6db6b6f0d
  - id: check
    status: pending
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: pending
  - id: review
    status: pending

