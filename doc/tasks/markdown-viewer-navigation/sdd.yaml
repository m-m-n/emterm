    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 1c6eaf1d2f74e14200499f1b0e1c1def75acb686
  - id: implement
    status: completed
    completed_at_commit: 1c6eaf1d2f74e14200499f1b0e1c1def75acb686
  - id: check
    status: completed
    completed_at_commit: 1c6eaf1d2f74e14200499f1b0e1c1def75acb686
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 1c6eaf1d2f74e14200499f1b0e1c1def75acb686
  - id: review
    status: completed
    completed_at_commit: 1c6eaf1d2f74e14200499f1b0e1c1def75acb686

