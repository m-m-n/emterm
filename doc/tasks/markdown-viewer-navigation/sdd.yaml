schema_version: 1
feature: markdown-viewer-navigation
scale: standard
created: 2026-04-08

project:
  components:
    main:
      language: rust
      build_command: "bun tauri build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'cargo test --manifest-path src-tauri/Cargo.toml'"
      format_command: ""
      e2e_test_command: "./scripts/run-e2e-docker.sh"
    frontend:
      language: typescript
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'bun test'"
      format_command: ""
    wasm:
      language: rust
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'cd wasm && cargo test'"

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: 1c6eaf1d2f74e14200499f1b0e1c1def75acb686
