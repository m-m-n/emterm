        scenario: Individual OSC begin/chunk/end generators produce correct format
        type: unit
        requirement: NFR3
      - id: test2-2
        scenario: Streaming read for small file produces correct sequence
        type: unit
        requirement: FR1
      - id: test2-3
        scenario: Streaming read for multi-chunk file has correct chunk count
        type: unit
        requirement: FR1
      - id: test2-4
        scenario: Empty file produces begin + end, no chunks
        type: unit
        requirement: FR1
      - id: test2-5
        scenario: stdin mode still works
        type: integration
        requirement: FR1
      - id: test2-6
        scenario: CLI output for known file matches expected format
        type: integration
        requirement: NFR3

  - id: phase-3
    name: Frontend Streaming Session
    goal: Modify frontend to invoke streaming backend commands per chunk instead of accumulating in memory
    effort: medium
    status: completed
    depends_on: [phase-1]
    blocks: []
    files_to_create: []
    files_to_modify:
      - path: src/download/session.ts
        change: Remove chunk accumulation, call streaming IPC, remove MAX_DOWNLOAD_SIZE
      - path: src/download/session.test.ts
        change: Update tests for new streaming flow with mocked IPC
    tasks:
      - id: t3-1
        title: Modify DownloadSession interface
        description: Remove chunks Map, add handleId and nextSeq counter.
        requirements: [FR3, NFR1]
      - id: t3-2
        title: Make handleBegin async
        description: Invoke start_download_file, handle cancel/confirm, store handle ID.
        requirements: [FR3, NFR4]
      - id: t3-3
        title: Make handleChunk async
        description: Invoke append_download_chunk instead of storing in Map. Validate seq with counter.
        requirements: [FR3, NFR1]
      - id: t3-4
        title: Simplify handleEnd
        description: Invoke finish_download_file instead of joining chunks.
        requirements: [FR3]
      - id: t3-5
        title: Update discardSession
        description: Invoke cancel_download_file if handle ID exists.
        requirements: [FR6]
      - id: t3-6
        title: Remove MAX_DOWNLOAD_SIZE
        description: Remove constant and all size-limit checks.
        requirements: [FR4]
      - id: t3-7
