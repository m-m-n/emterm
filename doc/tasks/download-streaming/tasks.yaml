        requirement: FR3
      - id: test3-4
        scenario: Session timeout triggers cancel_download_file
        type: unit
        requirement: FR6
      - id: test3-5
        scenario: Progress calculation without chunk accumulation
        type: unit
        requirement: NFR4
      - id: test3-6
        scenario: Multiple concurrent sessions
