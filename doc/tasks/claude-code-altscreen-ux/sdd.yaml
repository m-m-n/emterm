schema_version: 1
feature: claude-code-altscreen-ux
created: 2026-06-26

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target-host cargo build --release --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: ""
    term_core:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path crates/term_core/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path crates/term_core/Cargo.toml --lib"
      format_command: "cargo fmt --manifest-path crates/term_core/Cargo.toml"
      e2e_test_command: ""
    web:
      language: typescript
      build_command: "bun run build:viewer && bun run build:settings"
      test_command: "bun test"
      format_command: ""
      e2e_test_command: ""
      typecheck_command: "bun run typecheck"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: b29f83c99a1681e65ecc620b6f17b376f11f774c
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks.yaml]
    status: completed
    completed_at_commit: b29f83c99a1681e65ecc620b6f17b376f11f774c
  - id: verify-plan
    status: completed
    completed_at_commit: b29f83c99a1681e65ecc620b6f17b376f11f774c
  - id: implement
    status: completed
    completed_at_commit: b29f83c99a1681e65ecc620b6f17b376f11f774c
  - id: check
    status: completed
    completed_at_commit: b29f83c99a1681e65ecc620b6f17b376f11f774c
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: b29f83c99a1681e65ecc620b6f17b376f11f774c

