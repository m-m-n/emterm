schema_version: 1
feature: mux-feature-cleanup
scale: standard
created: 2026-04-20

project:
  components:
    main:
      language: rust+typescript
      build_command: "bun tauri build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'cargo test --manifest-path src-tauri/Cargo.toml && bun test && bun run typecheck'"
      format_command: ""
      e2e_test_command: "./scripts/run-e2e-docker.sh"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: 1b8fb6d53e180c2f454edf750fe3d0c4ff680de2
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 1b8fb6d53e180c2f454edf750fe3d0c4ff680de2
  - id: implement
    status: completed
    completed_at_commit: 1b8fb6d53e180c2f454edf750fe3d0c4ff680de2
  - id: check
    status: completed
    completed_at_commit: 1b8fb6d53e180c2f454edf750fe3d0c4ff680de2
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 1b8fb6d53e180c2f454edf750fe3d0c4ff680de2
  - id: review
    status: completed
    completed_at_commit: 1b8fb6d53e180c2f454edf750fe3d0c4ff680de2

