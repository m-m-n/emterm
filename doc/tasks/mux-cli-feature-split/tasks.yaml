schema_version: 1
feature: mux-cli-feature-split

tasks:
  - id: cargo-toml-reshape
    title: "Remove `mux` feature and promote mux deps to always-built in Cargo.toml"
    status: completed
    files:
      - src-tauri/Cargo.toml
    summary: |
      Drop the `mux = [...]` feature block. Remove `"mux"` from the
      `gui = [...]` list. Move tokio / tokio-util / futures / chrono /
      anyhow / hostname / vt100 / portable-pty / term_core / mux_ipc
      out of the `optional = true` dep entries into the always-built
      `[dependencies]` section.

  - id: lib-rs-gate-removal
    title: "Remove `#[cfg(feature = \"mux\")]` from mux/pty/scroll/wakeup/self_exec module declarations"
    status: completed
    files:
      - src-tauri/src/lib.rs
    summary: |
      The above modules become unconditional. Only `mux::tmux_import`
      keeps its GUI gate (handled by tmux-import-gui-gate task).

  - id: main-rs-dispatch-flip
    title: "Drop the mux feature gate around `if sub == \"mux\"` in main.rs"
    status: completed
    files:
      - src-tauri/src/main.rs
    summary: |
      Remove both the `#[cfg(feature = "mux")]` and
      `#[cfg(not(feature = "mux"))]` arms, leaving an unconditional
      dispatch to `emterm::mux::cli::run`. Restore `mux` to the
      GUI-only `use` list so `run_gui` can use the unqualified path.

  - id: tmux-import-gui-gate
    title: "Keep `mux::tmux_import` and its call sites on `feature = gui`"
    status: completed
    files:
      - src-tauri/src/mux/mod.rs
      - src-tauri/src/mux/cli.rs
    summary: |
      No changes from the prior commit — this task records that the
      GUI gate is intentionally preserved because `tmux_import`
      depends on the GUI-only `settings_store`.

  - id: viewer-kinds-ssot
    title: "Retain viewer_kinds.rs SSOT and viewer/mod.rs `pub use` re-export"
    status: completed
    files:
      - src-tauri/src/viewer_kinds.rs
      - src-tauri/src/viewer/mod.rs
      - src-tauri/src/mux/scrollback_filter.rs
    summary: |
      Kept from the prior commit — needed so `mux::scrollback_filter`
      can reach the constant in the CLI build without enabling `gui`.

  - id: prefix-test-rewrite
    title: "Retain mux::prefix test calls to parse_prefix_key (drop crate::settings::parse_mux_action_chord)"
    status: completed
    files:
      - src-tauri/src/mux/prefix.rs
    summary: |
      Kept from the prior commit — lets
      `cargo test --no-default-features --lib` run without enabling
      the `settings` module.

  - id: revert-makefile
    title: "Remove `mux-build` / `mux-dpkg` Makefile targets"
    status: completed
    files:
      - Makefile
    summary: |
      Delete the two new PHONY entries and their recipes. Update the
      `cli-build` / `cli-dpkg` help strings so users understand the
      CLI build now ships with mux.

  - id: revert-build-dpkg-script
    title: "Drop `EMTERM_MUX_ONLY` branch, `HEADLESS` var, 3-way Conflicts/Replaces from build-dpkg.sh; rewrite emterm-cli Description"
    status: completed
    files:
      - scripts/build-dpkg.sh
    summary: |
      Restore the two-mode (default GUI / `EMTERM_CLI_ONLY=1`) shape.
      Remove every `MUX_ONLY` / `HEADLESS` reference. Remove the
      Conflicts/Replaces lines from both remaining stanzas. Rewrite the
      `emterm-cli` Description body to list the mux subcommands
      alongside the existing image / markdown / json / yaml entries.
