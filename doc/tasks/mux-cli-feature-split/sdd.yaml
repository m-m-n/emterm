    status: completed
    completed_at_commit: aed66c97adce0518e53ad1741208abd30103f46a
  - id: verify-plan
    status: completed
    completed_at_commit: aed66c97adce0518e53ad1741208abd30103f46a
  - id: implement
    status: completed
    completed_at_commit: aed66c97adce0518e53ad1741208abd30103f46a
  - id: check
    status: completed
    completed_at_commit: aed66c97adce0518e53ad1741208abd30103f46a
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: aed66c97adce0518e53ad1741208abd30103f46a

