    tests: []
  NFR1:
    title: セキュリティ (入力検証 / argv 配列渡し / argv フラグ密輸防止 / ペーストインジェクション防止 / 鍵認証のみ)
    status: ok
    tasks: [validation, remote-path-helpers, service-tests]
    tests: [TS-6, TS-15, TS-16]
  NFR2:
    title: アーキテクチャ (移植元 Tauri 非依存維持 / crossbeam channel)
    status: ok
    tasks: [register-module]
    tests: []
  NFR3:
    title: 応答性 (バックグラウンドスレッド / UI 非ブロック)
    status: ok
    tasks: [start-cancel, confirm-logic]
    tests: []
  NFR4:
    title: wall-clock 不使用 (AtomicU64 採番 / egui フレーム時刻)
    status: ok
    tasks: [service-struct, app-wiring]
    tests: [TS-10]
  NFR5:
    title: クロスプラットフォーム (sftp バイナリ検出 Unix/Windows)
