# Tasks derived from IMPLEMENTATION.md (Phase 4-G redesign).
# Used by sdd.update-spec for impact analysis (sdd.yaml.requirements.{ID}.tasks references these IDs).
#
# Redesign note: 前 Phase 4-G の自前 XIM / Wayland / IMM32 タスク (ime-x11-*, ime-wayland-*,
# ime-windows-*, ime-perf-*) は本ファイルで削除されている。winit 移行に伴う新 phase 4-G-1..4
# のタスクで置き換える。

phases:
  - id: phase-4-g-1
    name: "Cleanup: 自前 XIM / Wayland / IMM32 backend 削除"
    estimated_effort: small
    tasks:
      - id: ime-cleanup-delete-files
        title: "Delete native-poc/src/ime/{x11,wayland,windows}.rs"
        status: completed
        files:
          - native-poc/src/ime/x11.rs
          - native-poc/src/ime/wayland.rs
          - native-poc/src/ime/windows.rs
      - id: ime-cleanup-mod-rs
        title: "Remove pub mod x11/wayland/windows from native-poc/src/ime/mod.rs (keep backend/null/preedit/commit re-exports)"
        status: completed
        files:
          - native-poc/src/ime/mod.rs
      - id: ime-cleanup-cargo-deps
        title: "Remove x11-dl / wayland-client / wayland-protocols / windows crates from native-poc/Cargo.toml"
        status: completed
        files:
          - native-poc/Cargo.toml
      - id: ime-cleanup-factory-stub
        title: "Reduce build_backend in ime/backend.rs to env+settings check then return Unavailable → NullBackend until winit bridge lands in 4-G-3"
        status: completed
        files:
          - native-poc/src/ime/backend.rs
      - id: ime-cleanup-build-green
        title: "cargo build --workspace + cargo test --workspace + cargo fmt --all green after deletions; ~33 unit + 2 integration tests removed (TS-x11/wayland/windows + TS-backend-int)"
        status: completed
        files: []

  - id: phase-4-g-2
    name: "winit 0.30.9 migration (windowing only, no IME wiring yet)"
    estimated_effort: large
    tasks:
      - id: ime-winit-cargo
        title: "Cargo.toml: remove tao = 0.34, add winit = 0.30.9 (default-features=false, features=[rwh_06, x11, wayland])"
        status: completed
        files:
          - native-poc/Cargo.toml
      - id: ime-winit-event-loop
        title: "main.rs: tao::EventLoop → winit::EventLoop (ApplicationHandler trait pattern chosen)"
        status: completed
        files:
          - native-poc/src/main.rs
      - id: ime-winit-window-host-rewrite
        title: "window_host.rs: rewrite tao API → winit API (Window/Event/WindowEvent/KeyEvent/ElementState/Key, wgpu surface via raw-window-handle 0.6, drop ReceivedImeText handler — Ime::Commit will replace in 4-G-3)"
        status: completed
        files:
          - native-poc/src/window_host.rs
      - id: ime-winit-key-to-bytes
        title: "Rename tao_key_to_bytes → winit_key_to_bytes; rewrite against winit::keyboard::{Key, NamedKey, ModifiersState}; use KeyEvent::text fast path for plain printable input"
        status: completed
        files:
          - native-poc/src/window_host.rs
      - id: ime-winit-app-types
        title: "Replace tao::event::KeyEvent references in app.rs and ime/backend.rs — none required: RawKeyEvent is platform-neutral and app.rs holds no tao types"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/ime/backend.rs
      - id: ime-winit-wgpu-surface
        title: "Verify wgpu::Instance::create_surface(&window) works via raw-window-handle 0.6 with Arc<Window>"
        status: completed
        files: []
      - id: ime-winit-build-green
        title: "cargo build --workspace + cargo test --workspace green; 323 unit tests pass after migration"
        status: completed
        files: []

  - id: phase-4-g-3
    name: "winit IME bridge + Ghostty state machine"
    estimated_effort: medium
    tasks:
      - id: ime-bridge-create
        title: "Create native-poc/src/ime/winit_bridge.rs implementing ImeBackend trait + im_composing state machine + BridgeWindow abstraction"
        status: completed
        files:
          - native-poc/src/ime/winit_bridge.rs
      - id: ime-bridge-mod-rs
        title: "Add pub mod winit_bridge to native-poc/src/ime/mod.rs"
        status: completed
        files:
          - native-poc/src/ime/mod.rs
      - id: ime-bridge-factory
        title: "backend.rs: new build_backend_with_window(Arc<Window>, settings, env) entry resolves env > settings > WinitImeBridge::init(window) → NullBackend on init failure"
        status: completed
        files:
          - native-poc/src/ime/backend.rs
      - id: ime-bridge-window-host-ime-wiring
        title: "window_host.rs: route WindowEvent::Ime(ime) → App::pass_winit_ime; pass both Pressed/Released KeyboardInput through dispatch_key_event_via_ime; build_backend_with_window at startup"
        status: completed
        files:
          - native-poc/src/window_host.rs
      - id: ime-bridge-app-dispatch-release
        title: "app.rs: add pass_winit_ime helper that forwards winit::event::Ime to ImeBackend::on_winit_ime (default no-op for NullBackend / MockBackend)"
        status: completed
        files:
          - native-poc/src/app.rs
      - id: ime-bridge-tests
        title: "Unit tests TS-winit-1..7 (Enabled/Preedit/Commit/Disabled mapping, state machine idempotency, modifier release, cursor rect dedup); +4 lifecycle tests"
        status: completed
        files:
          - native-poc/src/ime/winit_bridge.rs
      - id: ime-bridge-int-tests
        title: "Integration markers TS-winit-int-1 (#[ignore] Xvfb attach) / TS-winit-int-2 (#[cfg(windows)] host-deferred)"
        status: completed
        files:
          - native-poc/src/ime/winit_bridge.rs

  - id: phase-4-g-4
    name: "Manual gate re-execution via winit + perf + docs"
    estimated_effort: medium
    tasks:
      - id: ime-redesign-manual-x11
        title: "TS-manual-ime-x11 + TS-manual-ime-x11-ibus + TS-manual-ime-imserver-restart + TS-manual-ime-mux on Linux X11 + fcitx5 / IBus host"
        status: deferred
        notes: |
          Host-deferred (winit X11 native IME path). Requires Linux X11 host
          with fcitx5 and IBus installed. Phase 1 fcitx5 acceptance criteria
          (doc/tasks/ime-input-support/SPEC.md US1-US5) recorded as part of
          TS-manual-ime-x11 (NFR8). Recorded in VERIFICATION_RESULT.md at
          sdd.6-verify time.
        files: []
      - id: ime-redesign-manual-wayland
        title: "TS-manual-ime-wayland on KDE Plasma 6 (KWin) + Sway with fcitx5-wayland — winit native Wayland path"
        status: deferred
        notes: |
          Host-deferred. Requires Wayland session with fcitx5-wayland.
          KDE Plasma 6 and Sway must-pass, GNOME best-effort. winit handles
          zwp_text_input_v3 natively.
        files: []
      - id: ime-redesign-manual-windows
        title: "TS-manual-ime-windows on Windows 10/11 with MS-IME + Google IME (winit IMM32 path)"
        status: deferred
        notes: |
          Host-deferred. Requires Windows host. Candidate window position best
          effort (not gating). Cross-build cargo build --target x86_64-pc-windows-msvc
          via GitHub Actions windows-latest runner.
        files: []
      - id: ime-redesign-manual-fallback
        title: "TS-manual-ime-fallback on any host with EMTERM_NATIVE_IME=0"
        status: deferred
        notes: |
          Host-deferred. Quick check that winit `WindowEvent::Ime` becomes
          no-op at the bridge boundary and plain ASCII input still reaches
          the PTY.
        files: []
      - id: ime-redesign-perf-gates
        title: "TS-perf-3 (preedit <30 ms), TS-perf-4 (commit <5 ms), TS-perf-regression (IME-OFF +10% vs Phase 4 baseline) on Linux X11 release host with EMTERM_IME_PERF=1"
        status: deferred
        notes: |
          Host-deferred. Release host execution required. Baseline values from
          doc/tasks/mux-tabs-windows-ime/VERIFICATION_RESULT.md are referenced
          for TS-perf-regression comparison. winit migration is part of the
          regression measurement.
        files: []
      - id: ime-redesign-readme-update
        title: "Update native-poc/README.md Phase 4-G feature matrix to reflect winit 採択方針"
        status: completed
        files:
          - native-poc/README.md
      - id: ime-redesign-final-gates
        title: "cargo fmt --all -- --check + cargo build/test --workspace green across redesigned tree (clippy -D warnings deferred — pre-existing forward-staged warnings outside Phase 4-G scope)"
        status: completed
        files: []
