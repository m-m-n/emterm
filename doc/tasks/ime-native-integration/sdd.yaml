schema_version: 1
feature: ime-native-integration
created: 2026-05-13

project:
  components:
    main:
      language: rust
      # Workspace-wide. Phase 4-G (redesigned) extends `native-poc/` only;
      # legacy `src-tauri/` must keep compiling and testing as in Phase 4.
      build_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo build --workspace\""
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo test --workspace\""
      format_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo fmt --all\""
      # Legacy E2E is preexisting regression gate only; Phase 4-G verifies its
      # own scope via cargo test --workspace + manual IME host gates.
      e2e_test_command: "./scripts/run-e2e-docker.sh"

# ============================================================================
# REDESIGN NOTE (2026-05-14)
# ============================================================================
# 前 Phase 4-G (tao 0.34 + 自前 XIM / Wayland / IMM32 backend) は実機で動作
# しないことが判明した。具体的には:
#  - tao 0.34 が XKB keycode を公開しないため自前 X11 backend が
#    XmbLookupString に 0 chars しか返さない (英数字すら PTY 不達)
#  - tao 0.34 は IME を意図的にサポートしない (winit 0.27 系から fork
#    した時点で platform_impl/linux/x11/ime/ を削除済み)
#  - WezTerm / Alacritty / Ghostty の参考実装は揃って「自前 XIM をやめて
#    toolkit に任せろ」で結論一致
#
# 採択方針: 戦略 A (winit 0.30.9 移行)
#  - tao 0.34 を捨てて winit 0.30.9 に乗り換え
#  - winit WindowEvent::Ime { Enabled, Preedit, Commit, Disabled } で
#    X11/Wayland/Windows 統合カバー
#  - 自前 ime::{x11, wayland, windows} は完全削除
#  - Phase 4-E 不変契約 (preedit.rs / commit.rs / App::on_ime_*) は維持
#  - 新規 ime::winit_bridge で Ghostty 由来のステートマシン
#    (im_composing + in_keyevent) を実装
#
# Workflow status: redesign に伴い create-spec / create-plan / verify-plan /
# implement / check は needs_update、verify は pending に倒す。VERIFICATION_RESULT.md
# は historical record として残すが、本 SDD では superseded 扱い。
# ============================================================================

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: needs_update
    completed_at_commit: "9f290ab28a4d683bf92465417dd8955dc168eaf2"
    notes: |
      [REDESIGNED 2026-05-14] SPEC.md を winit 0.30 採択方針に書き換え。
      旧 FR1 (XIM client) / FR2 (zwp_text_input_v3) / FR3 (IMM32) を削除、
      新 FR11 (winit Ime → ImeEvent 変換) / FR12 (Ghostty state machine) /
      FR13 (tao → winit migration) を追加。FR4-FR10 は保持 (微修正)。
      要件定義書.md にも redesign 経緯を追記予定。
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks.yaml]
    status: needs_update
    completed_at_commit: "9f290ab28a4d683bf92465417dd8955dc168eaf2"
    notes: |
      [REDESIGNED 2026-05-14] IMPLEMENTATION.md を 4 phase 構成
      (4-G-1 cleanup / 4-G-2 winit migration / 4-G-3 winit IME bridge /
      4-G-4 manual gate) に書き換え。VERIFICATION.md / tasks.yaml も
      同期して更新。テスト ID 体系を TS-x11/wayland/windows 削除 +
      TS-winit-1..7 / TS-winit-int-1..2 追加に再編。
  - id: verify-plan
    status: needs_update
    completed_at_commit: "9f290ab28a4d683bf92465417dd8955dc168eaf2"
    notes: |
      旧 verify-plan で検証した整合性は redesign で無効化。
      新 SPEC.md / IMPLEMENTATION.md / VERIFICATION.md / tasks.yaml の
      整合性は次の sdd.3-verify-plan 実行で再確認する。
      以前の整合性 finding (raw-window-handle direct dep / RawKeyEvent::mods 型 /
      ImeSettings Phase 7 委譲) は redesign 後の文書にも継承済み。
  - id: implement
    status: completed
    completed_at_commit: "e90adc5"
    notes: |
      Phase 4-G redesign 完了 (2026-05-14)。4 commits:
        - 15370ce refactor(ime-native-integration): remove self-built XIM clients (Phase 4-G-1 cleanup)
            ime/{x11,wayland,windows}.rs 削除 + x11-dl / wayland-* / windows
            crates dep 削除。build_platform_backend を Err(Unavailable) →
            NullBackend に縮約。約 1500 行削除 + 旧 33 件のテスト削除。
        - 58392a1 refactor(native-poc): migrate from tao 0.34 to winit 0.30.9 (Phase 4-G-2)
            tao 0.34 → winit 0.30.9 (features=["rwh_06","x11","wayland",
            "wayland-dlopen"], default-features=false)。EventLoop::run
            closure → ApplicationHandler trait。winit_key_to_bytes は
            KeyEvent::text を fast path にして素の英数字を PTY に届ける。
            Pressed/Released 両方を dispatch_key_event_via_ime に通す。
        - f3c42c4 feat(native-poc): add winit IME bridge with Ghostty state machine (Phase 4-G-3)
            ime/winit_bridge.rs 新規 + ImeBackend trait に
            on_winit_ime(default no-op) 追加。WinitImeBridge は im_composing
            ステートマシン + set_ime_cursor_area dedup を持ち、
            WindowEvent::Ime { Enabled / Preedit / Commit / Disabled } を
            ImeEvent に変換。build_backend_with_window(Arc<Window>, settings, env)
            factory entry を新設。+ TS-winit-1..7 + lifecycle 5 件 +
            integration markers TS-winit-int-1/2。335 unit tests pass。
        - e90adc5 docs(ime-native-integration): redefine manual gates for winit (Phase 4-G-4)
            README.md / tasks.yaml / mux-tabs-windows-ime cross-task notes
            を winit 採択方針に更新。manual gates (TS-manual-ime-*) と perf
            gates (TS-perf-3..) は host-deferred。

      自動検証:
        - cargo build --workspace: green (Linux Docker)
        - cargo test --workspace: 1985+ pass / 0 fail / 4 ignored
        - cargo fmt --all -- --check: clean
        - native-poc 335 unit tests (was 351 before redesign; net -16:
          deleted 31 X11/Wayland/Windows tests + 2 integration, added
          12 winit_bridge tests + 2 integration markers)

      Phase 4-E 不変契約: ime/preedit.rs / ime/commit.rs / App::on_ime_* /
      render/cursor.rs::draw_cursor_with_preedit は変更なし。

      残作業 (Phase 4-G-4 host-deferred): TS-manual-ime-x11 /
      x11-ibus / wayland / windows / fallback / imserver-restart / mux,
      TS-perf-3 / TS-perf-4 / TS-perf-regression は sdd.6-verify で
      VERIFICATION_RESULT.md に記録。

      旧 Phase 4-G-A〜E の notes は historical record として保持:

      旧 Phase 4-G-A (29daa51): ImeBackend trait + ImeEvent + KeyDispatchResult
        + ImeInitError + RawKeyEvent + NullBackend (passthrough) + factory
        + App plumbing (ime_backend slot, pump_ime, dispatch_key_event_via_ime,
        notify_cursor_rect_if_changed, notify_ime_focus, ime_is_null) +
        window_host wiring. 27 unit tests landed (TS-backend-1..5, TS-cursor-1,
        TS-focus-1, TS-fallback-1..3, TS-settings-1, TS-route-1..2 等)。
        [維持予定] FR4 / FR5 / FR6 (state machine 部分のみ rewrite) / FR7 / FR8 /
                  FR9 / FR10 の trait + backbone はそのまま使う

      旧 Phase 4-G-B (393224d): Linux X11 XIM backend (x11-dl 2 dynamic loading,
        XOpenIM / XCreateIC / XSetICFocus / XUnsetICFocus / XSetICValues
        spotLocation / XFilterEvent / XmbLookupString direct commit, 11 unit
        tests TS-x11-1/2).
        [削除予定] 4-G-1 で ime/x11.rs を削除、x11-dl 依存も削除

      旧 Phase 4-G-C (e69d7b2): Linux Wayland zwp_text_input_v3 scaffold
        (crossbeam_channel + PumpThread + factory probe RawDisplayHandle::Wayland,
        init returns Unavailable scaffold). 10 unit tests TS-wayland-1/2.
        [削除予定] 4-G-1 で ime/wayland.rs を削除、wayland-client / wayland-protocols
                   依存も削除

      旧 Phase 4-G-D (fbcfe02): Windows IMM32 backend cfg(windows)
        (SetWindowSubclass + WM_IME_{START,END}COMPOSITION + GCS_COMPSTR/RESULTSTR +
        ImmGetCompositionStringW + portable utf16_to_utf8 helper +
        ImmSetCompositionWindow(CFS_POINT) + RemoveWindowSubclass Drop).
        10 unit tests TS-windows-1/2/3 (Linux CI で portable helper を試験).
        [削除予定] 4-G-1 で ime/windows.rs を削除、windows 0.58 依存も削除

      旧 Phase 4-G-E (d50ecff): EMTERM_IME_PERF=1 env toggle で warn-log
        instrumentation (App::on_ime_preedit / on_ime_commit、AtomicU8 cache).
        README.md に旧 feature matrix。
        [部分維持] EMTERM_IME_PERF=1 計測ロジックは TS-perf-3 / TS-perf-4 で再利用
                   (4-G-4 で winit 経路での実測)
        [更新予定] README.md は 4-G-4 で winit 採択方針に書き換え

      旧 deferred manual gates (TS-manual-ime-x11 / x11-ibus / wayland / windows /
      fallback / imserver-restart / mux / TS-perf-3..regression / TS-backend-int-1/2)
      は 4-G-4 で winit 経路として再定義し再実施。
  - id: check
    status: needs_update
    completed_at_commit: "dbfb25b9e5ebdd3b08e9647fb29d5e04485282b6"
    notes: |
      [SUPERSEDED 2026-05-14] 旧 check (dbfb25b) は historical record。
      旧 quick check で確認した 2011 passed / 0 failed / 4 ignored の
      テスト数は redesign で約 1985 件 (backbone 12 + winit 7 = +19、
      旧 X11/Wayland/Windows -33) に変動予定。次の sdd.5-check 実行で
      新数値を記録。

      旧 check notes (historical):
        - cargo build --workspace: PASS (13 warnings forward-staged)
        - cargo test --workspace: 2011 passed / 0 failed / 4 ignored
        - cargo fmt --all: PASS
        - cargo clippy on Phase 4-G ime/ subtree: clean
        - Dead code 検出: must-remove なし

      Optional cleanups (旧 verify からの引継ぎ):
        1. backend.rs:31 ImeEvent::FocusOut の #[allow(dead_code)] は
           misleading (app.rs:204 で match されている)
        2. settings.rs:187 Settings::ime の #[allow(dead_code)] // Phase 7
           は misleading (window_host:782 / backend:148 で読まれている)
      これらは redesign 後の新コードで再評価する。
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: pending
    notes: |
      [PENDING 2026-05-14] 旧 VERIFICATION_RESULT.md (dbfb25b) は historical record
      として残るが、本 SDD では superseded。redesign 後の 4-G-1..4 phase 実装後に
      新 VERIFICATION_RESULT.md を生成する (旧結果と区別するため別 appendix を
      追加するか、別ファイルにするかは sdd.6-verify で判断)。

      旧 verify が host-deferred として残した manual gates:
        - 2 integration (TS-backend-int-1 X11+xvfb / TS-backend-int-2 Windows HWND)
          → 4-G-1 で削除、4-G-3 で TS-winit-int-1/2 に置換
        - 7 manual IME (x11 / x11-ibus / wayland / windows / fallback /
          imserver-restart / mux)
          → 4-G-4 で winit 経路として再実施
        - 3 perf (TS-perf-3 / TS-perf-4 / TS-perf-regression)
          → 4-G-4 で再実施 (winit 移行込みで baseline 比較)

