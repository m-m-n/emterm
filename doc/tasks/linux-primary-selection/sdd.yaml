schema_version: 1
feature: linux-primary-selection
scale: standard
created: 2026-04-12

project:
  components:
    frontend:
      language: typescript
      build_command: "bun run typecheck"
      test_command: "bun test"
      format_command: "bun run typecheck"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"
    backend:
      language: rust
      build_command: "cargo build --manifest-path src-tauri/Cargo.toml"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: 3b6928a974827ba201b099ccf8510ef7727b0fe6
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 3b6928a974827ba201b099ccf8510ef7727b0fe6
  - id: implement
    status: completed
    completed_at_commit: 3b6928a974827ba201b099ccf8510ef7727b0fe6
  - id: check
    status: completed
    completed_at_commit: 3b6928a974827ba201b099ccf8510ef7727b0fe6
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 3b6928a974827ba201b099ccf8510ef7727b0fe6
  - id: review
    status: completed
    completed_at_commit: 3b6928a974827ba201b099ccf8510ef7727b0fe6

requirements:
