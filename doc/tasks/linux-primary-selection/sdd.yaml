    title: "PRIMARY read Tauri command (Linux only, empty elsewhere)"
    status: ok
    tasks:
      - "Phase 1: clipboard_read_primary command + registration"
    tests:
      - TS-26
      - TS-28
      - E2E-2
  FR3:
