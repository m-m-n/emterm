schema_version: 1
feature: mux-protocol-redesign
scale: standard
created: 2026-03-28

project:
  components:
    main:
      language: rust
      build_command: "cargo build --manifest-path src-tauri/Cargo.toml"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh"
    frontend:
      language: typescript
      build_command: "bun run build"
      test_command: "bun test"
      format_command: ""

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: 20ff9da632c04e863c2f336c1ecbeb32751df841
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 20ff9da632c04e863c2f336c1ecbeb32751df841
  - id: implement
    status: completed
    completed_at_commit: 20ff9da632c04e863c2f336c1ecbeb32751df841
    note: "Phase 1 (handshake removal) completed. Phase 2-5 tracked separately."
  - id: check
    status: completed
    completed_at_commit: 20ff9da632c04e863c2f336c1ecbeb32751df841
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 20ff9da632c04e863c2f336c1ecbeb32751df841
  - id: review
    status: completed
    completed_at_commit: 20ff9da632c04e863c2f336c1ecbeb32751df841

