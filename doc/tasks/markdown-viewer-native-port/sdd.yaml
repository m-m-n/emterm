schema_version: 1
feature: markdown-viewer-native-port
created: 2026-06-08

project:
  components:
    native-poc:
      language: rust
      # native-poc has its own target dirs per `.claude/rules/native-poc-build-location.md`.
      # Run cargo from the project root with --manifest-path (do NOT `cd native-poc`).
      build_command: "CARGO_TARGET_DIR=native-poc/target cargo check --manifest-path native-poc/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=native-poc/target cargo test --manifest-path native-poc/Cargo.toml --bin emterm-native-poc"
      format_command: "cargo fmt --manifest-path native-poc/Cargo.toml"
      e2e_test_command: ""
    viewer-bundle:
      language: typescript
      # Dedicated standalone viewer bundle reusing src/markdown (import only; src/ unchanged).
      # Exact script name finalized in sdd.2; placeholder below.
      build_command: "bun run build:viewer"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"bun test src/markdown && bun run typecheck\""
      format_command: "bun run format"
      e2e_test_command: ""

