    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: 26b38e13ff0231041fe6f492a4023113ec8b3003
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 26b38e13ff0231041fe6f492a4023113ec8b3003
  - id: verify-plan
    status: completed
    completed_at_commit: 26b38e13ff0231041fe6f492a4023113ec8b3003
  - id: implement
    status: completed
    completed_at_commit: 26b38e13ff0231041fe6f492a4023113ec8b3003
  - id: check
    status: completed
    completed_at_commit: 26b38e13ff0231041fe6f492a4023113ec8b3003
