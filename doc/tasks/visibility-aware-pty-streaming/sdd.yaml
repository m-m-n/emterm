schema_version: 1
feature: visibility-aware-pty-streaming
created: 2026-05-04

project:
  components:
    main:
      language: rust
      build_command: "bun tauri build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo test --manifest-path src-tauri/Cargo.toml\""
      format_command: ""
      e2e_test_command: "./scripts/run-e2e-docker.sh test"
    frontend:
      language: typescript
      build_command: "bun run build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"bun test\""
      format_command: ""
      e2e_test_command: "./scripts/run-e2e-docker.sh test"
    wasm:
      language: rust
      build_command: "bun run build:wasm"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cd wasm && cargo test\""
      format_command: ""
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: b4f7cd26c1fcd0eb06cc4326db29b0f9440a4b90
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: b4f7cd26c1fcd0eb06cc4326db29b0f9440a4b90
  - id: verify-plan
    status: completed
    completed_at_commit: b4f7cd26c1fcd0eb06cc4326db29b0f9440a4b90
  - id: implement
    status: completed
    completed_at_commit: b4f7cd26c1fcd0eb06cc4326db29b0f9440a4b90
  - id: check
    status: completed
    completed_at_commit: b4f7cd26c1fcd0eb06cc4326db29b0f9440a4b90
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: b4f7cd26c1fcd0eb06cc4326db29b0f9440a4b90

