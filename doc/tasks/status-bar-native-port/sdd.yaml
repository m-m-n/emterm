schema_version: 1
feature: status-bar-native-port
created: 2026-05-22

project:
  components:
    native-poc:
      language: rust
      # native-poc has its own target dirs per `.claude/rules/native-poc-build-location.md`.
      # Quick checks use ./target; release goes to ./target-host.
      build_command: "cd native-poc && CARGO_TARGET_DIR=./target cargo check"
      test_command: "cd native-poc && CARGO_TARGET_DIR=./target cargo test --bin emterm-native-poc"
      format_command: "cd native-poc && cargo fmt"
      e2e_test_command: ""
    legacy-tauri:
      language: rust+typescript
      build_command: "bun tauri build"
      # Prefer Docker per CLAUDE.md to avoid corrupting host config/caches.
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo test --manifest-path src-tauri/Cargo.toml && bun test && bun run typecheck\""
      format_command: "bun run format"
      e2e_test_command: "./scripts/run-e2e-docker.sh"

workflow:
  - id: create-spec
    artifacts:
      - SPEC.md
      - 要件定義書.md
    status: completed
    completed_at_commit: b1056917bd9ec0191d9c833fa8316901b53a99aa
  - id: create-plan
    artifacts:
      - IMPLEMENTATION.md
      - VERIFICATION.md
      - tasks.yaml
    status: completed
    completed_at_commit: b1056917bd9ec0191d9c833fa8316901b53a99aa
  - id: verify-plan
    status: completed
    completed_at_commit: b1056917bd9ec0191d9c833fa8316901b53a99aa
  - id: implement
