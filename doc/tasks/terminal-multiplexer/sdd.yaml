schema_version: 1
feature: terminal-multiplexer
scale: full
created: 2026-03-20

project:
  components:
    main:
      language: rust
      build_command: "bun tauri build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'cargo test --manifest-path src-tauri/Cargo.toml'"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh"
    frontend:
      language: typescript
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'bun test'"
      format_command: ""
    wasm:
      language: rust
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'cd wasm && cargo test'"
      format_command: "cargo fmt --manifest-path wasm/Cargo.toml"

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: f58b80401266dd4c5c49d7facadc2a5bf3a43173
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: f58b80401266dd4c5c49d7facadc2a5bf3a43173
  - id: verify-plan
    status: completed
    completed_at_commit: f58b80401266dd4c5c49d7facadc2a5bf3a43173
  - id: implement
    status: in_progress
  - id: check
    status: not_started
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: not_started
  - id: review
    status: not_started

requirements:
  FR1:
    title: Daemon Process
    status: ok
    tasks: [Phase1]
    tests: [TS-08, TS-11, TS-13, TS-14]
  FR2:
    title: IPC Protocol
    status: ok
    tasks: [Phase1]
    tests: [TS-01, TS-09, TS-10]
  FR3:
    title: Session Management
    status: ok
    note: "Multi-session supported. Per-client active session tracking, Attach handler for session switching, session-scoped reattach."
    tasks: [Phase1]
    tests: [TS-11, TS-25]
  FR4:
    title: OSC Signaling
    status: ok
    tasks: [Phase2]
    tests: [TS-05, TS-15]
  FR5:
    title: GUI Mode Switching
    status: ok
    tasks: [Phase2]
    tests: [TS-15, TS-19]
  FR6:
    title: Detach/Reattach
    status: ok
    note: "Daemon-side ring buffer replay implemented. Frontend grid swap on reattach."
    tasks: [Phase0, Phase2]
    tests: [TS-04, TS-15, TS-23, TS-24]
  FR7:
    title: Pane Layout
    status: ok
    note: "Complete: split/close/resize/next-pane/prev-pane/drag-resize/zoom-toggle all implemented."
    tasks: [Phase3]
    tests: [TS-02, TS-16, TS-22]
  FR8:
    title: Window Management
    status: ok
    note: "Complete: CRUD, sub-tabs, expand/compact CSS transition animation."
    tasks: [Phase4]
    tests: [TS-17]
  FR9:
    title: Status Bar
    status: not_started
    note: "Removed from mux. Planned as eMterm application-level feature."
    tasks: [Phase5]
    tests: []
  FR10:
    title: Copy Mode
    status: ok
    note: "Copy mode wired: prefix+[ enters, vi/emacs keybinds route, yank copies to clipboard, prefix+] pastes. Scrollback search not yet implemented."
    tasks: [Phase6]
    tests: [TS-18]
  FR11:
    title: tmux.conf Conversion
    status: ok
    tasks: [Phase7]
    tests: [TS-07]
  FR12:
    title: Prefix Key
    status: ok
    tasks: [Phase3]
    tests: [TS-06]
  FR13:
    title: Flow Control
    status: partial
    note: "Bounded channel exists. Backpressure chain not fully tested under high throughput."
    tasks: [Phase1]
    tests: [TS-12]
  FR14:
    title: Environment Variables
    status: ok
    tasks: [Phase0]
    tests: [TS-20, TS-21]
  FR15:
    title: WASM Instance Management
    status: ok
    note: "Per-pane WasmGrid swap for window switching + per-pane Canvas/TerminalState/Renderer for split panes implemented."
    tasks: [Phase2, Phase3]
    tests: [TS-04]
  NFR1:
    title: Performance
    status: partial
    note: "Grid swap is fast. Snapshot serialization removed. No performance benchmarks run yet."
    tasks: [Phase1, Phase2]
    tests: [TS-27, TS-28, TS-29]
  NFR2:
    title: Security
    status: ok
    tasks: [Phase2]
    tests: [TS-05]
  NFR3:
    title: Reliability
    status: partial
    note: "Daemon crash recovery not implemented. No graceful shutdown of pane PTYs."
    tasks: [Phase2]
    tests: [TS-19, TS-24, TS-25]
  NFR4:
    title: Compatibility
    status: partial
    note: "Linux only. Windows mux not implemented."
    tasks: [Phase1]
    tests: []
  NFR5:
    title: Resource Usage
    status: partial
    note: "Ring buffer cap exists. No resource limit enforcement tested."
    tasks: [Phase1, Phase2]
    tests: [TS-03, TS-23]
