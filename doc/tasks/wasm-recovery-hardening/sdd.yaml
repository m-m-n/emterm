schema_version: 1
feature: wasm-recovery-hardening
created: 2026-06-02

project:
  components:
    main:
      language: typescript
      build_command: "bun run build:wasm"
      test_command: "bun test"
      format_command: "bun run typecheck"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"
    wasm:
      language: rust
      build_command: "cargo build --manifest-path wasm/Cargo.toml"
      test_command: "cargo test --manifest-path wasm/Cargo.toml"
      format_command: "cargo fmt --manifest-path wasm/Cargo.toml"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: bc712579c6a4d06662dad59dea13356d8df999ad
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: bc712579c6a4d06662dad59dea13356d8df999ad
  - id: verify-plan
    status: completed
    completed_at_commit: bc712579c6a4d06662dad59dea13356d8df999ad
  - id: implement
    status: completed
    completed_at_commit: bc712579c6a4d06662dad59dea13356d8df999ad
  - id: check
    status: completed
    completed_at_commit: bc712579c6a4d06662dad59dea13356d8df999ad
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: bc712579c6a4d06662dad59dea13356d8df999ad

