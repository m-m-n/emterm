schema_version: 1
feature: font-swash-migration

# Each task ID is referenced from sdd.yaml.requirements.{FR/NFR}.tasks.
# Phase grouping mirrors IMPLEMENTATION.md.

phases:
  - id: phase-1
    name: "swash + zeno evaluation PoC"
    tasks:
      - id: poc-bundle-emoji-font
        title: "Bundle Noto Color Emoji + LICENSE under assets/fonts/"
        phase: 1
        status: completed
      - id: poc-add-swash-zeno-deps
        title: "Add swash (pinned = 0.1.x) + zeno to native-poc/Cargo.toml"
        phase: 1
        status: completed
      - id: poc-swash-emoji-example
        title: "Implement native-poc/examples/swash_emoji.rs and PoC PNG output"
        phase: 1
        status: completed
      - id: poc-decision-note
        title: "Append PoC outcome note (proceed-with-swash / pivot-to-cosmic-text) to IMPLEMENTATION.md"
        phase: 1
        status: completed

  - id: phase-2
    name: "Glyph trait + atlas split"
    tasks:
      - id: font-module-skeleton
        title: "Create render/font/ module skeleton (mod.rs + traits.rs + types)"
        phase: 2
        status: completed
      - id: glyph-cache-impl
        title: "Implement GlyphCache with hit/miss + sentinel + observable accessors"
        phase: 2
        status: completed
      - id: two-region-atlas
        title: "Implement alpha (R8) + rgba (RGBA8) atlas with upload routing"
        phase: 2
        status: completed
      - id: ab-glyph-adapter
        title: "Wrap existing ab_glyph path in AbGlyphRasterizer (None for CJK/emoji)"
        phase: 2
        status: completed
      - id: renderer-cache-wiring
        title: "Replace direct ab_glyph use in render/mod.rs with cache lookup (ASCII parity)"
        phase: 2
        status: superseded
        superseded_by: migrate-draw-grid-to-new-pass
        notes: |
          Superseded 2026-05-15 by Option 3. Partial wiring through the existing
          painter.text() path is no longer the plan; the whole draw_grid cell
          loop migrates into TerminalGridPass (Phase 4-H). The actual consumer
          of the cache is migrate-draw-grid-to-new-pass.

  - id: phase-3
    name: "swash adapter + font resolution + fallback chain"
    tasks:
      - id: bundle-cjk-font
        title: "Bundle NotoSansCJKjp-Regular.otf + update assets/fonts/README.md (SHA-256 + version)"
        phase: 3
        status: completed
      - id: add-fontdb-dep
        title: "Add fontdb dependency to native-poc/Cargo.toml"
        phase: 3
        status: completed
      - id: font-resolver
        title: "Implement render/font/resolver.rs (fontdb scan + bundled registration + warn-log on failure)"
        phase: 3
        status: completed
      - id: swash-adapter
        title: "Implement render/font/swash_adapter.rs (Shaper + Render; Alpha/RGBA routing via color-table detection)"
        phase: 3
        status: completed
      - id: fallback-chain
        title: "Implement render/font/fallback.rs (base → CJK → emoji walk + (font, codepoint) memoization)"
        phase: 3
        status: completed
      - id: fallback-renderer-wiring
        title: "Wire fallback chain into render/mod.rs per grapheme cluster"
        phase: 3
        status: superseded
        superseded_by: migrate-draw-grid-to-new-pass
        notes: |
          Superseded 2026-05-15 by Option 3. The fallback chain is consumed
          directly by TerminalGridPass::prepare (Phase 4-H), not by an
          intermediate render/mod.rs wiring layer.
      - id: windows-segoe-emoji-secondary
        title: "Append Segoe UI Emoji (system lookup, not bundled) as Windows-only secondary fallback"
        phase: 3
        status: deferred
        notes: |
          Resolver scaffolding (FontRole::Secondary) is in place. Windows-only
          probe wiring will be added in a follow-up under #[cfg(windows)].

  - id: phase-4
    name: "Settings integration + Theme dead_code resolution"
    tasks:
      - id: settings-font-engine-enum
        title: "Add FontEngine enum (Swash default / AbGlyph fallback) to settings.rs"
        phase: 4
        status: completed
      - id: settings-font-schema-additions
        title: "Add font_family_fallback / emoji_font / variable_font_axes fields with parse-or-warn"
        phase: 4
        status: completed
      - id: theme-dead-code-removal
        title: "Remove #[allow(dead_code)] on Theme::font_family / Theme::font_size_pt"
        phase: 4
        status: completed
        notes: |
          Verified by grep: no #[allow(dead_code)] markers on those fields
          at HEAD. TS-font-12 confirms the renderer reads them live.
      - id: renderer-theme-wiring
        title: "Replace FONT_SIZE constant + FontFamily::Monospace literal in render/mod.rs with Theme fields"
        phase: 4
        status: completed

  - id: phase-4-h
    name: "Terminal grid wgpu render pass — Option 3 (FR12)"
    tasks:
      - id: terminal-grid-pass-wgsl
        title: "Author WGSL shader for terminal grid pass (atlas-page branching, fg modulation, decorations)"
        phase: 4-h
        status: completed
        notes: |
          Landed at native-poc/src/render/terminal_grid_pass.wgsl;
          pulled into the Rust module via include_str!. Handles three
          page kinds (Alpha R8 with fg modulation, Rgba color glyphs
          sampled as-is, Solid for background + decoration lines).
          Underline / strikethrough are drawn as shader-side bands
          inside the same cell instance via the FLAG_UNDERLINE /
          FLAG_STRIKETHROUGH bits.
      - id: terminal-grid-pass-pipeline
        title: "Build wgpu render pipeline + bind group layout for TerminalGridPass"
        phase: 4-h
        status: completed
        notes: |
          Pipeline + bind-group-layout constructed in TerminalGridPass::new.
          Bind group: { uniform_buffer (binding 0), alpha_view (1),
          rgba_view (2), sampler (3) }. SrcAlpha / OneMinusSrcAlpha
          blending so subsequent egui + image overlay passes composite
          correctly on top. TS-font-int-4 (smoke pipeline-build) passes
          on hosts with a wgpu adapter; the Docker test container
          skips cleanly when no adapter is available.
      - id: terminal-grid-pass-vertex-buffer
        title: "Implement instance vertex buffer (per-cell quad instance data)"
        phase: 4-h
        status: completed
        notes: |
          CellInstance struct (#[repr(C)], 48-byte stride) carries
          cell_xy, cell_wh, atlas_uv (u0,v0,u1,v1), fg/bg packed RGBA8,
          page kind, decoration flags. Instance buffer is re-uploaded
          per frame via queue.write_buffer; vertex layout matches the
          WGSL @location bindings.
      - id: terminal-grid-pass-struct
        title: "Implement TerminalGridPass struct (new / prepare / draw API)"
        phase: 4-h
        status: completed
        notes: |
          Struct owns pipeline + bind-group-layout + sampler + lazy
          alpha/rgba atlas textures. prepare(device, queue, cells,
          metrics, viewport) lazily resizes the atlas textures, uploads
          the current atlas page bytes (R8 + RGBA8), and builds the
          frame's instance buffer + uniform + bind group. draw(rpass,
          frame) issues a single instanced draw call. The CPU-side
          per-cell path is factored into build_instances() so unit
          tests cover it without a wgpu device.
      - id: window-host-grid-pass-integration
        title: "Integrate TerminalGridPass into window_host frame loop (clear -> grid -> egui Load -> image Load)"
        phase: 4-h
        status: completed
        notes: |
          WindowHost gained a `grid_pass: Option<TerminalGridPass>` and
          `ensure_grid_pass(app)` builder. Frame draw order changed to
          `clear (inside TerminalGridPass) → TerminalGridPass →
          egui (LoadOp::Load) → ImageOverlayPass (LoadOp::Load)`. The
          pass is fed an empty cell list today (the painter.text() path
          continues to draw cells until G1+G2 manual gates clear); the
          integration is wired so flipping migrate-draw-grid-to-new-pass
          is a one-step swap.
      - id: migrate-draw-grid-to-new-pass
        title: "Migrate selection / underline / strikethrough (and per-cell drawing) from draw_grid into TerminalGridPass"
        phase: 4-h
        status: completed
        notes: |
          Completed 2026-05-15. The chicken-and-egg deferral (G1+G2
          could not pass while the new pass was fed an empty cell
          list) was dissolved by the user's host gate run, which
          confirmed CJK / emoji were tofu because painter.text() was
          still the only glyph source. Design choice: cell-input
          snapshotting lives in `render::collect_cell_inputs(core,
          theme, selection, width_mode) -> Vec<CellInput>`, called
          inline from `WindowHost::render` before `TerminalGridPass::
          prepare`. Selection retains the existing fg/bg swap in
          `resolve_cell_style` (no separate selection quad). Cursor
          stays on the egui side per SPEC. Cell metrics (`CELL_W`,
          `CELL_H`, `LEFT_PAD`, `TOP_PAD`) became `pub const` on
          `render` so window_host can compose them with the empirical
          36 px tab-bar offset for the grid pass origin.
      - id: remove-painter-text-from-draw-grid
        title: "Remove painter.text() / decoration-line / background-rect calls from render/mod.rs::draw_grid (after G1+G2 pass)"
        phase: 4-h
        status: completed
        notes: |
          Completed 2026-05-15. Deleted from `render/mod.rs`: the
          entire `draw_grid` function, the `cell_font_id` helper, and
          the `FontFamily` / `FontId` / `Align2` imports. The egui
          `CentralPanel::frame` fill now uses `Color32::TRANSPARENT`
          so the wgpu-rendered cells are visible through it; the
          cursor + IME preedit overlays still draw on top via egui.
          Verified by grep: no `painter.text(` / `FONT_SIZE` /
          `FontFamily::Monospace` remain in `render/mod.rs`.
          `Theme::font_family` gained `#[allow(dead_code)]` with a
          note for the follow-up Resolver wiring; `Theme::font_size_pt`
          is read live via `CellMetrics::font_size_px` in
          `WindowHost::render`. Renderer TS-font-12 was retired (it
          asserted on `cell_font_id`); four new tests cover
          `collect_cell_inputs` (one-per-cell coverage, wide-cell
          advance, decoration flags, background-fill gating).
      - id: startup-rasterizer-selection
        title: "Branch on Settings::font_engine in app.rs to construct Swash or AbGlyph rasterizer + hand it to TerminalGridPass"
        phase: 4-h
        status: completed
        notes: |
          App::build_font_stack (called from App::new) branches on
          Settings::font_engine. Swash path: SwashRasterizer +
          ingest_resolver(&resolver). AbGlyph path: wraps the bundled
          CJK font bytes via AbGlyphRasterizer::from_static_bytes;
          parse failure falls back to Swash with a warn log. The
          chosen rasterizer + the GlyphCache + the FallbackChain (cjk
          root → emoji) are stored on App as Arc<…> and handed to
          TerminalGridPass via WindowHost::ensure_grid_pass at
          startup. Live-reads Settings::font_engine, eliminating the
          prior dead_code warning on that field.

  - id: phase-5
    name: "Host manual gates + perf verification"
    tasks:
      - id: perf-instrumentation
        title: "Implement EMTERM_FONT_PERF=1 env-gated logging (startup scan duration + per-glyph rasterize)"
        phase: 5
        status: completed
        notes: |
          Implemented in render/font/cache.rs (per-glyph rasterize) and
          render/font/resolver.rs (startup scan total). Both gated on
          EMTERM_FONT_PERF != "0".
      - id: manual-gate-linux-x11
        title: "Run TS-manual-font-linux-x11 + TS-manual-font-linux-x11-fallback; record logs under doc/tasks/font-swash-migration/manual/"
        phase: 5
        status: deferred
        notes: |
          Manual host gate: deferred to a separate manual session under
          the operator's X11 + fcitx5 host. Renderer integration
          (renderer-cache-wiring / fallback-renderer-wiring) is the
          gating prerequisite.
      - id: manual-gate-linux-wayland
        title: "Run TS-manual-font-linux-wayland (GDK_BACKEND=x11)"
        phase: 5
        status: deferred
      - id: manual-gate-windows
        title: "Run TS-manual-font-windows or formally defer with documented next-step"
        phase: 5
        status: deferred
        notes: |
          Formally deferred: no Windows host available in this session.
          Re-run after Phase 5 renderer integration.
      - id: manual-gate-startup-perf
        title: "Run TS-manual-font-startup-perf and confirm NFR1 (< 500 ms) + NFR2 (< 5 ms/glyph)"
        phase: 5
        status: deferred
        notes: |
          Perf instrumentation is in place; the actual host run is part of
          the manual gate session.
      - id: restruct-status-update
        title: "Flip Phase 4-H status row in tmp/restruct.md on completion"
        phase: 5
        status: deferred
        notes: |
          Flipped after manual host gates pass on the operator's host.
