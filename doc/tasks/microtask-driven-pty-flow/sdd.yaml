schema_version: 1
feature: microtask-driven-pty-flow
created: 2026-05-08

project:
  components:
    frontend:
      language: typescript
      build_command: "bun run build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"bun test\""
      format_command: "bun run typecheck"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"
    backend:
      language: rust
      build_command: "cargo build --manifest-path src-tauri/Cargo.toml"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo test --manifest-path src-tauri/Cargo.toml\""
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: ea075e1207489e7b73288de277ee97a6d45f5514
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: ea075e1207489e7b73288de277ee97a6d45f5514
  - id: verify-plan
    status: completed
    completed_at_commit: ea075e1207489e7b73288de277ee97a6d45f5514
  - id: implement
    status: completed
    completed_at_commit: ea075e1207489e7b73288de277ee97a6d45f5514
  - id: check
    status: completed
    completed_at_commit: ea075e1207489e7b73288de277ee97a6d45f5514
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: ea075e1207489e7b73288de277ee97a6d45f5514

