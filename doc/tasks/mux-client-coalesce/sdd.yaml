schema_version: 1
feature: mux-client-coalesce
title: "mux client coalesce (phase1)"
scale: Standard
created: "2026-06-21"

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo build --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --release --test mux_throughput --manifest-path src-tauri/Cargo.toml -- --ignored --nocapture"

