requirements:
  FR1:
    title: "Coalesce consecutive active-pane PtyOutput inner payloads into a single parse"
    status: ok
    tasks: [implement-coalesce-loop, add-coalesce-test]
    tests: [TS-1, TS-2]
  FR2:
    title: "Flush coalesce buffer before handling control messages (ordering)"
    status: ok
    tasks: [implement-coalesce-loop, preserve-edgecases]
    tests: [TS-5, TS-7]
  FR3:
    title: "Run take_response / drain_marks / inner image APC drain once per batch"
    status: ok
    tasks: [implement-coalesce-loop, regression-lib-suite]
    tests: [TS-2, TS-6, TS-7]
  FR4:
    title: "Exclude non-active-pane PtyOutput from coalesce (drop as before)"
    status: ok
    tasks: [preserve-edgecases]
    tests: [TS-4]
  FR5:
    title: "Keep legacy per-frame path (live_queue) while pending_switch is active"
    status: ok
    tasks: [preserve-edgecases]
    tests: [TS-6]
  NFR1:
    title: "Performance: reduce per-pump parse count; improve E2E throughput, reduce frame count"
    status: ok
    tasks: [e2e-measure]
    tests: [TS-9]
  NFR2:
    title: "Correctness preservation: coalesced output byte-equivalent to per-frame (split==concatenated)"
    status: ok
    tasks: [implement-coalesce-loop, regression-lib-suite]
    tests: [TS-2]
  NFR3:
    title: "Scope isolation: no daemon / bridge / transport / WebView (src/) changes"
    status: ok
    tasks: [implement-coalesce-loop]
    tests: []  # verified by `git diff --stat` review, not an automated test
