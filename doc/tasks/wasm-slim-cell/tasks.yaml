    requirements: [NFR1]
    tests: [M-01, M-02, M-03]
    effort: large
    depends_on: [T5.5]
    notes: "Record observations under tmp/. Compare slope vs pre-change baseline; pass if RSS slope reduced by >= 30%."
    status: deferred

  T5.8:
    phase: P5
    title: "Fill VERIFICATION.md observed values + finalize Verification Summary"
    requirements: [NFR1, NFR2, NFR3, NFR4, NFR5]
    tests: []
    effort: small
    files: [doc/tasks/wasm-slim-cell/VERIFICATION.md]
    depends_on: [T5.2, T5.3, T5.5, T5.7]
    status: completed

