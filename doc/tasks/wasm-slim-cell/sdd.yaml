schema_version: 1
feature: wasm-slim-cell
scale: standard
created: 2026-04-26

project:
  components:
    main:
      language: rust
      build_command: "bun tauri build"
      test_command: 'docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c "cargo test --manifest-path src-tauri/Cargo.toml && cd wasm && cargo test"'
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: 59b83635a5857f4296000219f36f50cc5fe4ef6c
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks.yaml]
    status: completed
    completed_at_commit: 59b83635a5857f4296000219f36f50cc5fe4ef6c
  - id: implement
    status: completed
    completed_at_commit: 59b83635a5857f4296000219f36f50cc5fe4ef6c
  - id: check
    status: completed
    completed_at_commit: 59b83635a5857f4296000219f36f50cc5fe4ef6c
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 59b83635a5857f4296000219f36f50cc5fe4ef6c
  - id: review
    status: completed
    completed_at_commit: 59b83635a5857f4296000219f36f50cc5fe4ef6c

