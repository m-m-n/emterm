schema_version: 1
feature: mux-transport-parser-isolation

tasks:
  - id: termcore-extractor
    status: completed
    phase: 1
    title: term_core public transport extractor
    summary: >-
      Add an independent transport extractor in term_core that drives its own
      Parser over a byte stream and surfaces only APC / OSC frames (discarding
      Print/CSI/Esc), preserving parser state across calls so split frames
      reassemble. Export it from the crate.
    files_create:
      - crates/term_core/src/mux_apc_extractor.rs
    files_modify:
      - crates/term_core/src/lib.rs
    tests:
      - TS-1
      - TS-2
      - TS-3
    depends_on: []
    effort: medium

  - id: pump-routing
    status: completed
    phase: 2
    title: Route pump outer parse through the extractor when mux established
    summary: >-
      Give Tab its own extractor; in pump, when mux_session_name.is_some(),
      feed coalesced PTS bytes to the extractor and route frames into the
      existing partition_apc_for_mux -> apply_mux_message path, leaving
      Tab::core driven only by inner content. Pre-mux branch unchanged.
    files_create: []
    files_modify:
      - src-tauri/src/tabs.rs
    tests:
      - TS-4
      - TS-9
    depends_on:
      - termcore-extractor
    effort: medium

  - id: lifecycle
    status: completed
    phase: 3
    title: Handshake switch, detach restoration, Welcome duplication
    summary: >-
      Engage the extractor on the first pump after Welcome sets
      mux_session_name; reset it and revert to Tab::core on detach; keep state
      consistent under the known double-Welcome delivery.
    files_create: []
    files_modify:
      - src-tauri/src/tabs.rs
    tests:
      - TS-5
      - TS-6
      - TS-7
    depends_on:
      - pump-routing
    effort: small

  - id: remove-diag
    status: completed
    phase: 4
    title: Remove DIAG diagnostics
    summary: >-
      Remove the temporary DIAG logs in tabs.rs (PtyOutput arm,
      drain_and_decode_images, reset_frame_for_replay), remove the
      parser_mid_sequence() accessor in terminal_core.rs, and restore the
      original simple warn in mux/apc.rs try_decode_emterm_mux.
    files_create: []
    files_modify:
      - crates/term_core/src/terminal_core.rs
      - src-tauri/src/tabs.rs
      - src-tauri/src/mux/apc.rs
    tests:
      - TS-8
    depends_on:
      - pump-routing
      - lifecycle
    effort: small

  - id: detach-tail-reroute
    status: completed
    phase: 5
    title: Re-route post-Detached tail bytes within a coalesced buffer (finding ④, FR5)
    summary: >-
      Fix the in-pump detach transition: when a single coalesced PTS buffer
      holds [... Detached frame][post-detach shell bytes], the bytes after the
      Detached frame are currently swallowed by the extractor (which discards
      non-APC bytes) because routing is decided once per pump. Have the extractor
      report per-frame end offsets; in process_combined, after an applied mux
      message clears mux_session_name, route combined[tail..] through the pre-mux
      self.core path so the post-detach shell prompt renders.
    files_create: []
    files_modify:
      - crates/term_core/src/mux_apc_extractor.rs
      - src-tauri/src/tabs.rs
    tests:
      - TS-11
    depends_on:
      - pump-routing
      - lifecycle
    effort: medium

  - id: protocol-decouple
    status: completed
    phase: 6
    title: Decouple mux protocol knowledge from term_core (finding ⑤, NFR5)
    summary: >-
      term_core must embed no mux application-protocol constants. Change
      MuxApcExtractor::new() to new(osc_param, prefix) injected from
      mux_ipc::protocol via tabs.rs; remove the MUX_OSC_PARAM/MUX_PREFIX consts
      and drift_* tests. Move OSC 9999 emterm-mux recognition out of
      term_core::handle_osc_internal (drop the prefix check + fire_apc_callback;
      map 9999 to a new action-type like 777/1337) to the app-layer on_osc in
      callbacks.rs, which checks APC_PREFIX and routes to the pending_apc sink so
      a pre-mux Windows-ConPTY OSC 9999 Welcome still establishes mux.
    files_create: []
    files_modify:
      - crates/term_core/src/mux_apc_extractor.rs
      - crates/term_core/src/osc_handler.rs
      - src-tauri/src/tabs.rs
      - src-tauri/src/callbacks.rs
    tests:
      - TS-12
      - TS-13
    depends_on:
      - termcore-extractor
      - pump-routing
    effort: medium
