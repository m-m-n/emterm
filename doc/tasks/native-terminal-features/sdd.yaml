# Open Questions — all resolved during plan (IMPLEMENTATION.md > Resolved Open Questions).
open_questions:
  OQ1:
    title: src-tauri/src/image/ と src-tauri/src/ansi/{apc,dcs}.rs の workspace 内再配置方針
    resolution_required_by: create-plan
    resolution: "Option (a): new crates/term_images/ shared crate; both src-tauri and native-poc depend on it by path. tauri::* references are absent from moved files (grep-verified)."
  OQ2:
    title: OSC 52 clipboard 許可ポリシーの移植方式
    resolution_required_by: create-plan
    resolution: "Mirror legacy fields: settings.clipboard_read_osc52 (bool, default true) + settings.clipboard_max_size_osc52 (u32, default 10485760 = 10 MB). Names and defaults match the existing src-tauri/src/commands/config/settings.rs so a single settings.json is honored by both builds. 'ask' (interactive prompt) deferred to Phase 5+."
  OQ3:
    title: OSC 9 notification rate-limiting と連携 crate
    resolution_required_by: create-plan
    resolution: "notify-rust 4.x with in-process dedupe of identical (title, body) within a 1 s window."
  OQ4:
    title: term_core の dirty-row API シグネチャと per-row 粒度の有無
    resolution_required_by: create-plan
    resolution: "Existing is_row_dirty(row) / get_dirty_rows() / clear_dirty() in terminal_modes.rs is sufficient; no term_core change required."
  OQ5:
    title: wgpu テクスチャ format と premultiplied-alpha の現行 WebView 版整合
    resolution_required_by: create-plan
    resolution: "Rgba8UnormSrgb, un-premultiplied source bytes; BlendState (SrcAlpha, OneMinusSrcAlpha) matches WebView canvas source-over."
  OQ6:
    title: DECSCUSR / OSC 22 / DECTCEM の term_core 側 getter 整備状況
    resolution_required_by: create-plan
    resolution: "Existing get_cursor_style / get_cursor_blink / get_cursor_visible / get_cursor_fg / get_cursor_bg in terminal_cursor.rs is sufficient; no term_core change required."
  OQ7:
    title: iTerm2 OSC 1337 で Phase 3 必須なサブセットの有無
    resolution_required_by: create-plan
    resolution: "None. OSC 1337 is log-only in Phase 3; Kitty Graphics Protocol is the canonical image path."
