schema_version: 1
feature: font-bundle-redesign
created: 2026-06-24

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target-host cargo build --release --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cd e2e-tests && bun run test\""

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: "43660899e264569b4a204e342fbfec7198c0d779"
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: "43660899e264569b4a204e342fbfec7198c0d779"
  - id: verify-plan
    status: completed
    completed_at_commit: "43660899e264569b4a204e342fbfec7198c0d779"
  - id: implement
    status: completed
    completed_at_commit: "43660899e264569b4a204e342fbfec7198c0d779"
  - id: check
    status: completed
    completed_at_commit: "43660899e264569b4a204e342fbfec7198c0d779"
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: "43660899e264569b4a204e342fbfec7198c0d779"

