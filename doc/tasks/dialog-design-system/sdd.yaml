schema_version: 1
feature: dialog-design-system
created: 2026-06-26

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target-host cargo build --release --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: ""
    webview:
      language: typescript
      build_command: "bun run build:viewer && bun run build:settings"
      test_command: "bun test"
      format_command: "bunx biome format --write src-tauri/web-shared src-tauri/viewer/web src-tauri/settings/web"
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: 0b0c8a23f130968c7368271b85dd231f5f70c3f6
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks.yaml]
    status: completed
  - id: verify-plan
    status: completed
  - id: implement
    status: completed
  - id: check
    status: completed
    completed_at_commit: 0b0c8a23f130968c7368271b85dd231f5f70c3f6
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 0b0c8a23f130968c7368271b85dd231f5f70c3f6

