open_questions:
  Q1:
    summary: "WebView helper API: bare body container vs. addInput()/addSelect() factories"
    default_if_unresolved: "Body container only; caller composes form elements"
    status: assumed
    resolution: "Body container only; caller composes form elements (locked in IMPLEMENTATION.md §Resolved Open Questions)"
  Q2:
    summary: "Keep backward-compat CSS aliases (.profile-editor-*) during migration?"
    default_if_unresolved: "Drop fully in this task; complete rename in one PR"
    status: assumed
    resolution: "Drop fully in this task; one-pass rename to .dialog-* (locked in IMPLEMENTATION.md §Resolved Open Questions)"
  Q3:
    summary: "profile_selector.rs full migration to Dialog builder vs. shared constants only"
    default_if_unresolved: "Shared constants only; bespoke render kept (list-row IS confirmation)"
    status: assumed
    resolution: "Shared constants only; bespoke render kept (locked in IMPLEMENTATION.md §Resolved Open Questions + Phase 7)"
  Q4:
    summary: "Tab reaches primary button on destructive-confirm?"
    default_if_unresolved: "Yes (Tab cycles), but Enter never triggers primary"
    status: assumed
    resolution: "Yes: Tab cycles through both buttons; Enter is bound to Cancel regardless (locked in IMPLEMENTATION.md §Resolved Open Questions)"
  Q5:
    summary: "Light-theme hex values for error-container/on-error-container/surface-variant per preset"
    default_if_unresolved: "Use MD3 baseline reference values; finalize table in IMPLEMENTATION.md"
    status: assumed
    resolution: "Resolved in IMPLEMENTATION.md §FR6 — MD3 baseline error palette + per-preset surface-variant mirroring ui-theme-presets.ts"
