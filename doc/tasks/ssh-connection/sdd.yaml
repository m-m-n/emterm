schema_version: 1
feature: ssh-connection
scale: standard
created: 2026-03-05

project:
  components:
    main:
      language: rust
      build_command: "bun tauri build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'cargo test --manifest-path src-tauri/Cargo.toml'"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh"
    frontend:
      language: typescript
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'bun test'"
      format_command: ""
      typecheck_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c 'bun run typecheck'"

