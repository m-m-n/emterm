schema_version: 1
feature: wasm-c0-csi-handlers
scale: full
created: 2026-02-15

project:
  components:
    main:
      language: rust
      build_command: "cd wasm && wasm-pack build --target web --out-dir pkg"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml && cargo test --manifest-path wasm/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
    frontend:
      language: typescript
      build_command: "bun run build"
      test_command: "bun test"
      format_command: "bun run typecheck"

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: eb28bd5f3efe5e47875034a0fe91d28c17d95321
