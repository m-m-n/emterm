schema_version: 1
feature: binary-mismatch-restart-toast
created: 2026-06-20

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml --check"
      e2e_test_command: ""
      # CLI-only feature gate check (must stay compiling):
      # CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features

workflow:
