    completed_at_commit: 7702fed006ff763a8c273190c06d0f9efb2d6c3c
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 7702fed006ff763a8c273190c06d0f9efb2d6c3c
  - id: verify-plan
    status: completed
    completed_at_commit: 7702fed006ff763a8c273190c06d0f9efb2d6c3c
  - id: implement
    status: completed
    completed_at_commit: 7702fed006ff763a8c273190c06d0f9efb2d6c3c
  - id: check
    status: completed
    completed_at_commit: 7702fed006ff763a8c273190c06d0f9efb2d6c3c
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 7702fed006ff763a8c273190c06d0f9efb2d6c3c

