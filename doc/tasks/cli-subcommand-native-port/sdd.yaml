schema_version: 1
feature: cli-subcommand-native-port
created: 2026-06-16

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=native-poc/target-host cargo build --release --manifest-path native-poc/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=native-poc/target cargo test --manifest-path native-poc/Cargo.toml"
      format_command: "cargo fmt --manifest-path native-poc/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"

