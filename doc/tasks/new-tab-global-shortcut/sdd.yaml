schema_version: 1
feature: new-tab-global-shortcut
created: 2026-05-10

project:
  components:
    main:
      language: rust+typescript
      build_command: "bun tauri build"
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo test --manifest-path src-tauri/Cargo.toml && bun test && bun run typecheck\""
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml && bun x prettier --write 'src/**/*.{ts,json}'"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: e6bb1061f919ce59438b36bc8f63e4f717866f2b
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: e6bb1061f919ce59438b36bc8f63e4f717866f2b
  - id: verify-plan
    status: completed
    completed_at_commit: e6bb1061f919ce59438b36bc8f63e4f717866f2b
  - id: implement
    status: completed
    completed_at_commit: e6bb1061f919ce59438b36bc8f63e4f717866f2b
  - id: check
    status: completed
    completed_at_commit: e6bb1061f919ce59438b36bc8f63e4f717866f2b
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: e6bb1061f919ce59438b36bc8f63e4f717866f2b

