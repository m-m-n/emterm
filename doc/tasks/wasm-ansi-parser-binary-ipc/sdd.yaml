schema_version: 1
feature: wasm-ansi-parser-binary-ipc
scale: full
created: 2026-02-16

project:
  components:
    main:
      language: rust
      build_command: "cd wasm && wasm-pack build --target web --out-dir pkg"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
    frontend:
      language: typescript
      build_command: "bun build src/index.html --outdir dist --minify"
      test_command: "bun test"
      format_command: "bun run typecheck"

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: 81de0f092d0987a3a2a4e6d3aec13016550dbed3
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 81de0f092d0987a3a2a4e6d3aec13016550dbed3
  - id: verify-plan
    status: completed
    completed_at_commit: 81de0f092d0987a3a2a4e6d3aec13016550dbed3
  - id: implement
    status: completed
    completed_at_commit: 81de0f092d0987a3a2a4e6d3aec13016550dbed3
  - id: check
    status: completed
    completed_at_commit: 81de0f092d0987a3a2a4e6d3aec13016550dbed3
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: pending
  - id: review
    status: pending

