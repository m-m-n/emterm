        files: []
      - id: gate-perf
        title: "TS-perf-1, TS-perf-2 measurements"
        status: deferred_manual
        notes: "Harness scaffolded at native-poc/src/mux/perf_tests.rs behind #[ignore]; the test bodies compile + run under Docker but the actual <50 ms (TS-perf-1) / <5 ms (TS-perf-2) acceptance values require host execution to record reproducible numbers. Activate with `cargo test -p emterm-native-poc -- --ignored snapshot_apply_ prefix_round_trip_`."
        files:
