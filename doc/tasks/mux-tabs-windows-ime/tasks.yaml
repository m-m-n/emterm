# Tasks derived from IMPLEMENTATION.md.
# Used by sdd.update-spec for impact analysis (sdd.yaml.requirements.{ID}.tasks references these IDs).

phases:
  - id: phase-4-a
    name: "mux_ipc crate extraction (protocol-only)"
    estimated_effort: small
    tasks:
      - id: mux-ipc-carve-crate
        title: "Create crates/mux_ipc/ manifest + lib.rs (pub mod protocol)"
        status: completed
        files:
          - crates/mux_ipc/Cargo.toml
          - crates/mux_ipc/src/lib.rs
      - id: mux-ipc-workspace-member
        title: "Register mux_ipc as workspace member + add src-tauri path dep"
        status: completed
        files:
          - Cargo.toml
          - src-tauri/Cargo.toml
      - id: mux-ipc-git-mv
        title: "git mv protocol.rs from src-tauri to crates/mux_ipc (codec/connection stay)"
        status: completed
        files:
          - crates/mux_ipc/src/protocol.rs
      - id: mux-ipc-shim
        title: "src-tauri/src/mux/ipc/protocol.rs becomes 1-line pub use mux_ipc::protocol::* shim"
        status: completed
        files:
          - src-tauri/src/mux/ipc/protocol.rs
      - id: mux-ipc-verify
        title: "Workspace build + test + clippy after move"
        status: completed
        files: []

  - id: phase-4-b
    name: "tab bar widget + central keybinds"
    estimated_effort: medium
    tasks:
      - id: tab-define-app-action
        title: "Define AppAction + TabEvent enums"
        status: completed
        files:
          - native-poc/src/ui/mod.rs
      - id: tab-bar-widget
        title: "Implement egui tab bar (new/close/switch/title)"
        status: completed
        files:
          - native-poc/src/ui/tab_bar.rs
      - id: tab-keybinds-dispatch
        title: "Implement keybinds dispatch table (Ctrl+Shift+T/W, Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+1..9)"
        status: completed
        files:
          - native-poc/src/ui/keybinds.rs
      - id: tab-wire-app-loop
        title: "Wire tab bar + keybinds into app loop"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/tabs.rs
          - native-poc/src/window_host.rs
          - native-poc/src/render/mod.rs
      - id: tab-unit-tests
        title: "Unit tests TS-tab-1/2/3, TS-kb-1"
        status: completed
        files: []

  - id: phase-4-c
    name: "mux client + prefix state machine"
    estimated_effort: large
    tasks:
      - id: mux-wire-framing
        title: "Sync wire framing (4-byte BE length + bincode body, MAX_FRAME_LENGTH enforcement)"
        status: completed
        files:
          - native-poc/src/mux/wire.rs
          - native-poc/src/mux/mod.rs
      - id: mux-osc777-parser
        title: "OSC 777 parser with socket / session_id validation"
        status: completed
        files:
          - native-poc/src/mux/osc777.rs
          - native-poc/src/callbacks.rs
      - id: mux-client-wrapper
        title: "Mux Client wrapper (blocking UnixStream + connect/send/try_recv/shutdown)"
        status: completed
        files:
          - native-poc/src/mux/client.rs
          - native-poc/src/mux/mod.rs
          - native-poc/Cargo.toml
      - id: mux-prefix-latch
        title: "Prefix-key state machine with timeout + double-press passthrough"
        status: completed
        files:
          - native-poc/src/mux/prefix.rs
      - id: mux-pty-pause-ring
        title: "Native PTY pause flag + 256 KB ring buffer + resume replay"
        status: completed
        files:
          - native-poc/src/pty/mod.rs
          - native-poc/src/pty/ring.rs
          - native-poc/src/tabs.rs
      - id: mux-tab-integration
        title: "Tab gains mux_client field; app routes Snapshot via term_core reset_and_replay"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/tabs.rs
      - id: mux-settings-prefix-key
        title: "settings.mux.prefix_key field"
        status: completed
        files:
          - native-poc/src/settings.rs
      - id: mux-mock-daemon
        title: "cfg(test) in-memory mock daemon"
        status: completed
        files:
          - native-poc/src/mux/mock.rs
      - id: mux-tests
        title: "TS-wire-1/2, TS-osc777-1/2/3, TS-prefix-1/2/3, TS-mux-int-1..4"
        status: completed
        files: []

  - id: phase-4-d
    name: "status bar (egui)"
    estimated_effort: small
    tasks:
      - id: status-settings-extension
        title: "settings.statusbar.enabled + position (with validation warn)"
        status: completed
        files:
          - native-poc/src/settings.rs
      - id: status-state-plumbing
        title: "Per-tab StatusBarState updated by Mux Client RX path"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/tabs.rs
      - id: status-bar-widget
        title: "egui top/bottom panel widget"
        status: completed
        files:
          - native-poc/src/ui/status_bar.rs
          - native-poc/src/ui/mod.rs
      - id: status-idle-repaint
        title: "1 Hz repaint scheduling for idle clock-only updates"
        status: completed
        files:
          - native-poc/src/render/mod.rs
      - id: status-tests
        title: "TS-status-1/2/3, TS-settings-1"
        status: completed
        files: []

  - id: phase-4-e
    name: "Windows MS-IME + Linux fcitx5 parity"
    estimated_effort: medium
    tasks:
      - id: ime-preedit-state
        title: "Preedit state struct + sanitization (C0/C1 drop)"
        status: completed
        files:
          - native-poc/src/ime/preedit.rs
          - native-poc/src/ime/mod.rs
      - id: ime-commit-path
        title: "Commit dispatch writes sanitized bytes to active PTY"
        status: completed
        files:
          - native-poc/src/ime/commit.rs
      - id: ime-cursor-renderer
        title: "Cursor renderer extension for preedit underline overlay"
        status: completed
        files:
          - native-poc/src/render/cursor.rs
      - id: ime-app-routing
        title: "Route egui::Event::Ime to ime module"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/tabs.rs
          - native-poc/src/window_host.rs
          - native-poc/src/render/mod.rs
          - native-poc/src/main.rs
      - id: ime-tests
        title: "TS-ime-1/2/3"
        status: completed
        files: []
      # Manual host gates — deferred to host execution. The auto agent
      # cannot drive a real fcitx5 / MS-IME session inside Docker.
      - id: ime-manual-linux
        title: "Manual TS-manual-ime-linux (fcitx5 parity)"
        status: deferred_manual
        notes: "Requires host execution under a real fcitx5 session; not runnable from Docker / sub-agent."
        files: []
      - id: ime-manual-windows
        title: "Manual TS-manual-ime-windows (preedit + commit)"
        status: deferred_manual
        notes: "Requires Windows host with MS-IME enabled; not runnable from Docker / sub-agent. cfg(windows) compile-only smoke covers Event::Ime variant shape."
        files: []

  - id: phase-4-f
    name: "long-run stability + final gates"
    estimated_effort: medium
    tasks:
      - id: gate-fmt-clippy
        title: "cargo fmt + clippy sweep across native-poc + mux_ipc"
        status: completed
        notes: "Clippy baseline 19 -> 14 (-5). Mechanical fixes: derivable_impls (ScrollPosition), manual_is_multiple_of (blink), while_let_loop (theme palette), match_single_binding (font_id), missing_safety_doc (Pod/Zeroable). Remaining 14 are forward-staged dead code (Theme, ImagePlacement, ImageLayerState, OverlayPipeline, Tab::drain_osc, Selection::new, AmbiguousWidthMode::Wide, CellStyle bold/italic) + arc_with_non_send_sync (preexisting Phase 3 forward-staged item, explicitly out of Phase 4 scope)."
        files: []
      - id: gate-readme
        title: "native-poc/README.md Phase 4 feature matrix"
        status: completed
        files:
          - native-poc/README.md
      - id: gate-soak
        title: "Manual TS-manual-soak (12 h Claude Code under mux)"
        status: deferred_manual
        notes: "Requires host execution under a real desktop session for 12 h with hourly RSS sampling. Not runnable from Docker / sub-agent."
        files: []
      - id: gate-perf
        title: "TS-perf-1, TS-perf-2 measurements"
        status: deferred_manual
        notes: "Harness scaffolded at native-poc/src/mux/perf_tests.rs behind #[ignore]; the test bodies compile + run under Docker but the actual <50 ms (TS-perf-1) / <5 ms (TS-perf-2) acceptance values require host execution to record reproducible numbers. Activate with `cargo test -p emterm-native-poc -- --ignored snapshot_apply_ prefix_round_trip_`."
        files:
          - native-poc/src/mux/perf_tests.rs
          - native-poc/src/mux/mod.rs
      - id: gate-final-build-test
        title: "Final cargo build/test/clippy/fmt clean"
        status: completed
        notes: "cargo fmt --all --check: clean. cargo build --workspace: PASS. cargo test --workspace: 1940 passed / 0 failed / 9 ignored (identical to Phase 4-E baseline plus the 2 new #[ignore] perf tests). cargo clippy -p emterm-native-poc -p mux_ipc --no-deps: 14 warnings (<= Phase 4-E baseline 19)."
        files: []
