  - id: phase-4-e
    name: "Windows MS-IME + Linux fcitx5 parity"
    estimated_effort: medium
    tasks:
      - id: ime-preedit-state
        title: "Preedit state struct + sanitization (C0/C1 drop)"
        status: completed
        files:
          - native-poc/src/ime/preedit.rs
          - native-poc/src/ime/mod.rs
      - id: ime-commit-path
        title: "Commit dispatch writes sanitized bytes to active PTY"
        status: completed
        files:
          - native-poc/src/ime/commit.rs
      - id: ime-cursor-renderer
        title: "Cursor renderer extension for preedit underline overlay"
        status: completed
        files:
          - native-poc/src/render/cursor.rs
      - id: ime-app-routing
        title: "Route egui::Event::Ime to ime module"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/tabs.rs
          - native-poc/src/window_host.rs
          - native-poc/src/render/mod.rs
          - native-poc/src/main.rs
      - id: ime-tests
        title: "TS-ime-1/2/3"
        status: completed
        files: []
      # Manual host gates — downgraded 2026-05-13 to N/A under tao 0.34.
      - id: ime-manual-linux
        title: "Manual TS-manual-ime-linux (fcitx5 parity) — N/A: tao 0.34 limitation"
        status: not_applicable
        notes: |
          tao 0.34 has no XIM integration, so fcitx5 / IBus on X11 / Wayland
          cannot deliver preedit / commit events to native-poc. Auto-scope
          wiring stays in tree; production IME requires WebView hybrid
          fallback or a tao replacement.
        files: []
      - id: ime-manual-windows
        title: "Manual TS-manual-ime-windows (preedit + commit) — N/A: tao 0.34 limitation"
        status: not_applicable
        notes: |
          tao 0.34 does not surface IMM32 / TSF preedit text or expose
          `ImmSetCompositionWindow`. Auto-scope wiring stays in tree;
          production IME requires WebView hybrid fallback or a tao replacement.
        files: []
      - id: ime-linux-double-input-fix
        title: "Fix Linux double-input regression (KeyboardInput Character vs ReceivedImeText)"
        status: completed
        notes: |
          2026-05-13 (commit 3fcc7ef). On X11 / Wayland tao 0.34 fires
          ReceivedImeText for every printable keystroke; the KeyboardInput
          path was also encoding TaoKey::Character, causing each ASCII key to
          be written twice to the PTY. Fix gates the Character branch on
          Ctrl/Alt being held — those chords are not surfaced as
          ReceivedImeText and must continue to be encoded there.
        files:
          - native-poc/src/window_host.rs

  - id: phase-4-f
