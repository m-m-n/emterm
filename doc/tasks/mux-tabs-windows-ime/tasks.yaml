  - id: phase-4-c
    name: "mux integration via APC inband protocol (redesigned 2026-05-13)"
    estimated_effort: medium
    notes: |
      The original Phase 4-C landed a direct UnixStream client + OSC 777 attach
      trigger. That misread the legacy mux spec — the real protocol runs as
      APC `ESC _ emterm-mux;<base64> ESC \` inside the bridge CLI's PTY. The
      redesigned scope decodes those APCs and routes the resulting MuxMessage
      into the active tab; native-poc never opens the daemon socket itself.
    tasks:
      - id: mux-apc-decoder
        title: "APC payload decoder (try_decode_emterm_mux)"
        status: completed
        files:
          - native-poc/src/mux/apc.rs
          - native-poc/src/mux/mod.rs
      - id: mux-prefix-latch
        title: "Prefix-key state machine (forward-staged under the redesign)"
        status: completed
        files:
          - native-poc/src/mux/prefix.rs
      - id: mux-tab-integration
        title: "Tab::apply_mux_message + App::on_mux_message + APC partition in Tab::pump"
        status: completed
        files:
          - native-poc/src/app.rs
          - native-poc/src/tabs.rs
          - native-poc/src/callbacks.rs
      - id: mux-settings-prefix-key
        title: "settings.mux.prefix_key field"
        status: completed
        files:
          - native-poc/src/settings.rs
      - id: mux-tests
        title: "TS-apc-1..4, TS-prefix-1/2/3, TS-mux-msg-1/2"
        status: completed
        files: []
      - id: mux-removed-modules
        title: "Removed by redesign: wire.rs, client.rs, osc777.rs, mock.rs, perf_tests.rs"
        status: completed
        notes: "Tracked here so impact-analysis tooling still sees the historical scope."
        files: []

