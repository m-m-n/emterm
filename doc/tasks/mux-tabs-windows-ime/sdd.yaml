schema_version: 1
feature: mux-tabs-windows-ime
created: 2026-05-13

project:
  components:
    main:
      language: rust
      # Workspace-wide. Phase 4 introduces `crates/mux_ipc/` and extends `native-poc/`,
      # but legacy `src-tauri/` must keep compiling and testing until Phase 7.
      build_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo build --workspace\""
      test_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo test --workspace\""
      format_command: "docker compose -f docker-compose.e2e.yml run --rm --no-deps build sh -c \"cargo fmt --all\""
      # Legacy E2E is preexisting regression gate only; Phase 4 verifies its own scope via cargo test --workspace.
      e2e_test_command: "./scripts/run-e2e-docker.sh"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: "72b748a9594d9e7577e99e0b45facef7af6ee2f1"
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks.yaml]
    status: completed
    completed_at_commit: "72b748a9594d9e7577e99e0b45facef7af6ee2f1"
  - id: verify-plan
    status: completed
    completed_at_commit: "72b748a9594d9e7577e99e0b45facef7af6ee2f1"
    notes: |
      整合性検証で 1 件の critical issue を検出 + 修正:
        FR3 (mux_ipc extraction) — 当初案は codec.rs / connection.rs もまとめて
        crates/mux_ipc に move する計画だったが、connection.rs は server-side
        accept loop で `crate::mux::session::*` に依存しており、移動すると src-tauri
        の mux runtime 全体を crate 横断で巻き込む不整合が発生する。
        修正: protocol.rs のみを抽出 (pure serde 型)、codec/connection は
        src-tauri に残置。native-poc は std blocking UnixStream + 自前の wire.rs
        (4-byte BE 長さ + bincode body, MAX_FRAME_LENGTH 強制) を実装。
        この修正に伴い SPEC.md / IMPLEMENTATION.md / VERIFICATION.md / tasks.yaml /
        sdd.yaml requirements を整合更新済 (TS-wire-1/2 追加, TS-tab-3 追加,
        TS-osc777-3 / TS-prefix-3 / TS-status-3 を SPEC に明示)。
      他に minor issues は無し、設計レビューで blocking 問題なし。
  - id: implement
    status: in_progress
  - id: check
    status: pending
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: pending

