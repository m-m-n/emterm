      - TS-tab-2
      - TS-tab-3
  FR2:
    title: Tab keybinds (Ctrl+Shift+T/W, Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+1..9)
    status: ok
    tasks:
      - tab-keybinds-dispatch
      - tab-wire-app-loop
      - tab-unit-tests
    tests:
      - TS-kb-1
  FR3:
    title: Extract crates/mux_ipc/ from src-tauri/src/mux/ipc/protocol.rs (scope-limited; codec/connection stay)
    status: ok
    tasks:
      - mux-ipc-carve-crate
      - mux-ipc-workspace-member
      - mux-ipc-git-mv
      - mux-ipc-shim
      - mux-ipc-verify
    tests:
      - TS-mux-1
  FR4:
    title: mux attach via APC inband protocol (bridge CLI runs inside PTY)
    status: ok
    tasks:
      - mux-apc-decoder
      - mux-tab-integration
      - mux-tests
    tests:
      - TS-apc-1
      - TS-apc-2
      - TS-apc-3
      - TS-apc-4
      - TS-mux-msg-1
      - TS-mux-msg-2
    notes: |
      Redesigned 2026-05-13. The legacy `emterm mux` CLI runs as a bridge inside
      a regular PTY and emits `ESC _ emterm-mux;<base64(frame_body)> ESC \` APC
      sequences. native-poc decodes them via `mux::apc::try_decode_emterm_mux`
      and routes through `App::on_mux_message` → `Tab::apply_mux_message`.
      native-poc never opens the daemon Unix socket itself.
  FR5:
    title: mux detach
    status: deferred
    tasks: []
    tests: []
    notes: |
      Phase 4-C redesign (2026-05-13): detach keystroke (`Ctrl+B d`) is written
      to the PTY as ordinary bytes; the bridge CLI consumes it on stdin like
      tmux. The legacy GUI did not expose per-window detach via OSC either.
      Deferred to Phase 5+ if dedicated GUI-side detach intercept is needed.
  FR6:
    title: mux window switch
    status: deferred
    tasks: []
    tests: []
    notes: |
      Phase 4-C redesign: window-switch keystrokes (`Ctrl+B n/p/<digit>`) flow
      through PTY to the bridge CLI; daemon reactions return as APC `Snapshot`
      frames. Deferred to Phase 5+ for GUI-side intercept.
  FR7:
    title: Native PTY pause/resume during mux (256 KB ring buffer)
    status: deferred
    tasks: []
    tests: []
    notes: |
      Phase 4-C redesign: the bridge CLI shares the same PTY native-poc renders,
      so there is no second stream to pause. `Tab::pause_native_pty` /
      `resume_native_pty` + `pty::ring` stay in tree under `#[allow(dead_code)]`
      for a future "freeze native output while mux owns the screen" affordance.
  FR8:
    title: Prefix key handling (Latch state machine + settings; current behavior is passthrough)
    status: ok
    tasks:
      - mux-prefix-latch
      - mux-settings-prefix-key
      - mux-tests
    tests:
      - TS-prefix-1
      - TS-prefix-2
      - TS-prefix-3
      - TS-settings-1
    notes: |
      Phase 4-C redesign: `mux::prefix::Latch` is implemented and unit-tested,
      but the keybinds dispatch passes the chord through to the PTY (bridge CLI
      consumes it). The Latch is forward-staged for a future GUI-side intercept.
  FR9:
    title: Status bar widget (egui) — session/window/clock from StatusUpdateMsg
    status: ok
    tasks:
      - status-state-plumbing
      - status-bar-widget
      - status-idle-repaint
      - status-tests
    tests:
      - TS-status-1
      - TS-status-2
  FR10:
    title: Status bar settings (enabled, position top/bottom)
    status: ok
    tasks:
      - status-settings-extension
      - status-tests
    tests:
      - TS-status-3
      - TS-settings-1
  FR11:
    title: IME preedit overlay via egui Ime event (auto-scope wired; manual gates N/A)
    status: ok
    tasks:
      - ime-preedit-state
      - ime-cursor-renderer
      - ime-app-routing
      - ime-tests
    tests:
      - TS-ime-1
      - TS-ime-3
    notes: |
      Auto-scope (preedit state + sanitize + cursor renderer + App routing) is
      implemented and unit-tested. **Manual gates `TS-manual-ime-linux` /
      `TS-manual-ime-windows` are N/A under tao 0.34**: no XIM integration on
      Linux (fcitx5 / IBus can't reach native-poc) and no IMM32/TSF preedit
      surfacing on Windows. Production IME requires a WebView hybrid fallback
      or a tao replacement.

      **2026-05-14 cross-task update**: Phase 4-G
      (`doc/tasks/ime-native-integration/`) lands the native IME backends
      (X11 XIM auto, Wayland scaffold, Windows IMM32 cfg(windows)) without
      replacing tao. The Phase 4 manual gates `TS-manual-ime-linux` and
      `TS-manual-ime-windows` are completed by Phase 4-G's TS-manual-ime-x11
      / x11-ibus / windows. The actual `status: deferred → ok` flip on this
      SDD lives in a separate PR (informational note only here).

      **2026-05-14 second redesign**: Phase 4-G was further redesigned the
      same day after the self-built XIM client was found broken (tao 0.34
      hashes XKB keycodes; `XmbLookupString` always returned 0 chars). The
      redesign migrates the windowing layer to **winit 0.30.9** and replaces
      `ime/{x11,wayland,windows}.rs` with a single `WinitImeBridge` that
      forwards `WindowEvent::Ime { Enabled, Preedit, Commit, Disabled }`
      into the unchanged Phase 4-E plumbing. The Phase 4 limitation cited
      above ("no XIM integration on Linux") is resolved via winit's native
      IME path, not by self-built clients.
  FR12:
    title: IME commit → PTY write (no bracketed wrap; auto-scope wired; manual gates N/A)
    status: ok
    tasks:
      - ime-commit-path
      - ime-app-routing
      - ime-tests
    tests:
      - TS-ime-2
    notes: |
      Auto-scope (`ime::commit::write_commit` + `App::on_ime_commit` ↔
      `WindowEvent::ReceivedImeText`) is implemented and unit-tested. Manual
      gate N/A under tao 0.34 (same limitation as FR11). On Linux X11 tao 0.34
      also fires `ReceivedImeText` for every printable keystroke; commit
      `3fcc7ef` gates the `KeyboardInput` Character branch on Ctrl/Alt to
      prevent the resulting double-input.

      **2026-05-14 cross-task update**: Phase 4-G
      (`doc/tasks/ime-native-integration/`) routes commit events from the
      native IME backends (X11 XmbLookupString direct commit, Windows
      `WM_IME_COMPOSITION` `GCS_RESULTSTR`) through the unchanged Phase 4-E
      `ime::commit::write_commit` path. `WindowEvent::ReceivedImeText` is
      gated on `App::ime_is_null()` so a real backend's pump-fed commit
      doesn't double-deliver with the fallback path. Real-host commit
      verification is covered by Phase 4-G's TS-manual-ime-windows.

      **2026-05-14 second redesign**: post-winit-migration the
      `WindowEvent::ReceivedImeText` variant no longer exists. Plain
      printable input now arrives via `KeyEvent::text` (handled by
      `winit_key_to_bytes`); composition results arrive via
      `WindowEvent::Ime::Commit`, which `WinitImeBridge` translates to
      `ImeEvent::Commit` → `App::on_ime_commit` → `write_commit`. The
      `App::ime_is_null()` gating becomes a no-op because the bridge
      itself swallows IME events under NullBackend.
  FR13:
    title: settings.json additions (mux.prefix_key, statusbar.enabled, statusbar.position)
    status: ok
    tasks:
      - mux-settings-prefix-key
      - status-settings-extension
    tests:
      - TS-settings-1
  NFR1:
    title: Performance (snapshot < 200 ms, prefix detect < 5 ms, tab switch < 1 frame)
    status: ok
    tasks:
      - gate-perf
    tests:
      - TS-perf-1
      - TS-perf-2
  NFR2:
    title: 12h Claude Code session stability under mux (no crash, no screen loss, RSS < 50 MB/h)
    status: ok
    tasks:
      - gate-soak
    tests: []
    notes: "Manual TS-manual-soak only; no automated TS-ID. Recorded in VERIFICATION_RESULT.md."
  NFR3:
    title: Linux fcitx5 IME parity with Phase 1
    status: deferred
    tasks: []
    tests: []
    notes: |
      **N/A under tao 0.34** (2026-05-13). tao 0.34 does not integrate with XIM,
      so fcitx5 / IBus on X11 / Wayland cannot deliver preedit / commit events
      to the native-poc window. Phase 1 acceptance does not apply because the
      Phase 1 WebView build received IME events via WebKitGTK's native pipeline,
      which tao 0.34 does not replicate. Re-evaluate when WebView hybrid
      fallback or tao replacement lands.

      **2026-05-14 cross-task update**: Phase 4-G
      (`doc/tasks/ime-native-integration/`) lands a native XIM client on top
      of tao 0.34 (`ime/x11.rs` via `x11-dl`) without replacing tao. The Phase
      4-G NFR8 manual gate (`TS-manual-ime-x11` against the Phase 1 fcitx5
      acceptance criteria) is the replacement for this deferred entry. The
      `status: deferred → ok` flip on this SDD lives in a separate PR
      (informational note only here).

      **2026-05-14 second redesign**: the self-built XIM client was removed
      after it was found inoperative (tao XKB keycode opacity → 0-char
      XmbLookupString). The redesigned Phase 4-G migrates to **winit 0.30.9**
      and delegates X11 / Wayland / Windows IME to winit's native pipeline
      (which is the same library route WezTerm / Alacritty / Ghostty
      converged on). The NFR8 fcitx5 parity gate now runs against the winit
      path.
  NFR4:
    title: Workspace compatibility (src-tauri build/test green through Phase 4)
    status: ok
    tasks:
      - mux-ipc-verify
      - gate-final-build-test
    tests: []
    notes: "Build/test gates per sub-phase boundary; no dedicated TS-ID."
  NFR5:
    title: Module layout (crates/mux_ipc, native-poc/src/{mux,ime,ui/status_bar})
    status: ok
    tasks:
      - mux-ipc-git-mv
      - mux-client-wrapper
      - ime-preedit-state
      - status-bar-widget
    tests: []
    notes: "Validated by File Structure Verification in VERIFICATION.md."
  NFR6:
    title: Logging (prefix detect / attach / detach / window switch / snapshot apply)
    status: ok
    tasks:
      - mux-client-wrapper
      - mux-prefix-latch
      - mux-tab-integration
    tests: []
    notes: "Validated by manual log inspection during TS-manual-mux-1 and TS-manual-soak."
