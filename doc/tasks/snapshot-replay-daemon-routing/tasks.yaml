schema_version: 1
feature: snapshot-replay-daemon-routing

# Tasks are derived from IMPLEMENTATION.md phases. Each task id is referenced
# by sdd.yaml.requirements.{ID}.tasks. Phase 6 (instrumentation revert) is
# intentionally excluded — it runs after sdd.6-verify, outside the implement
# phase.

tasks:
