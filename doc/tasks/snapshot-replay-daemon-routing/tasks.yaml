    title: "Phase 1: Add ChunkKind discriminator to PtyOutputChunk"
    files:
      - src-tauri/src/mux/session/pane.rs
    requirements:
      - FR1
    estimated_effort: small
    status: completed

  - id: phase2-drain-dispatch
    title: "Phase 2: Drain-side dispatch by ChunkKind + kind-aware merge"
    files:
      - src-tauri/src/mux/ipc/connection.rs
      - crates/mux_ipc/src/protocol.rs
    requirements:
      - FR1
      - FR5
      - NFR2
