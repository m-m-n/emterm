    depends_on:
      - phase1-chunk-kind
    status: completed

  - id: phase3-handler-switch
    title: "Phase 3: handle_request_pane_snapshot uses snapshot(...) constructor"
    files:
      - src-tauri/src/mux/ipc/handlers.rs
    requirements:
      - FR1
      - FR3
      - FR5
    estimated_effort: small
    depends_on:
      - phase1-chunk-kind
      - phase2-drain-dispatch
    status: completed

  - id: phase4-new-tests
    title: "Phase 4: Add TS-2 and TS-3 unit tests; review/update existing ordering tests for msg_type drift"
    files:
      - src-tauri/src/mux/ipc/handlers.rs
      - src-tauri/src/mux/ipc/connection.rs
