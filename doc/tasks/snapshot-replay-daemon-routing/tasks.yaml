    files: []
    requirements:
      - NFR1
      - NFR3
      - NFR4
      - NFR5
      - FR2
      - FR4
    estimated_effort: medium
    depends_on:
      - phase4-new-tests
    status: in_progress
    notes: |
      sdd.4-implement covers cargo test + CLI-only check (both green).
      make win-build, make build, and the TS-7/NFR1 production measurement
      are deferred to sdd.5-check / sdd.6-verify per the implement-skill
      hand-off (Phase 5 was scoped down in the implement step).
