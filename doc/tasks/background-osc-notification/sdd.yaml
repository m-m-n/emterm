schema_version: 1
feature: background-osc-notification
created: 2026-06-03

project:
  components:
    backend:
      language: rust
      build_command: "cargo build --manifest-path src-tauri/Cargo.toml"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
      e2e_test_command: "./scripts/run-e2e-docker.sh test"
    frontend:
      language: typescript
      build_command: "bun run typecheck"
      test_command: "bun test"
      format_command: ""
      e2e_test_command: "./scripts/run-e2e-docker.sh test"

workflow:
  - id: create-spec
    artifacts: [SPEC.md, 要件定義書.md]
    status: completed
    completed_at_commit: 4c8d057983efbab0dffb1e6e2b0e2fe85c1b890c
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 4c8d057983efbab0dffb1e6e2b0e2fe85c1b890c
  - id: verify-plan
    status: completed
    completed_at_commit: 4c8d057983efbab0dffb1e6e2b0e2fe85c1b890c
  - id: implement
    status: completed
    completed_at_commit: 4c8d057983efbab0dffb1e6e2b0e2fe85c1b890c
  - id: check
    status: completed
    completed_at_commit: 4c8d057983efbab0dffb1e6e2b0e2fe85c1b890c
  - id: verify
    artifacts: [VERIFICATION_RESULT.md]
    status: completed
    completed_at_commit: 4c8d057983efbab0dffb1e6e2b0e2fe85c1b890c

