    status: assumed
    assumption: "Qualitative: cargo build -p term_core not noticeably slower than the previous wasm/ build."
    tasks: []
    tests:
      - TS-11
    notes: "Captured during Phase 7 with at least two samples on the same machine. No dedicated task; informal."
  NFR3:
