    status: assumed
    assumption: "Trait methods mirror the existing wasm/src/callbacks.rs 1:1; exact list finalized during implementation by grepping js_sys::Function uses."
    tasks:
      - capture-baseline-pkg-and-exports
      - design-terminal-callbacks-trait
