  FR5:
    title: fetch-fonts.sh update with pinned Noto-COLRv1
    status: ok
    resolution: |
      `googlefonts/noto-emoji` の v2.051 tag (既存 NotoColorEmoji と同 tag) に
      `fonts/Noto-COLRv1.ttf` が存在することを planning フェーズで確認済み。
      pin 値:
        URL    = https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/Noto-COLRv1.ttf
        SHA256 = 0ae57fe58645638523ba35f388d93739d292539a9acb84df5700c81b1e1a28d2
        size   = 4,991,984 bytes (~4.76 MiB)
        family = "Noto Color Emoji" (CBDT 版と同じ — 既存 by_family テスト影響なし)
    tasks:
      - pin-noto-colrv1-font-source
      - update-bundled-fonts-readme
    tests:
      - TS-15
      - TS-20
  FR6:
    title: Monochrome fallback preserved when COLRv1 path returns None
    status: ok
    tasks:
      - add-raster-colrv1-branch
    tests:
      - TS-17
  FR7:
    title: Path-selection logging (info on fallback + warn_once on degradation)
    status: ok
    resolution: |
      `info` ログは swash_adapter::raster の fallback パスで発行
      (`colrv1: fallback for gid={gid}, size_px={size_px} (no paint graph)`)。
      hit-path は `debug` (release では drop)。
      tiny-skia 0.11 の表現力不足に起因する劣化描画イベントは OnceLock
      ベースの warn_once ログで通知する: SweepGradient → first-stop solid
      fallback、RadialGradient r0 > 0 → r0 drop (c0 focal は保持)、
      HSL family CompositeMode → SourceOver fallback (mode ごとに 1 回)、
      Pixmap/Mask alloc 失敗 (push_layer / push_clip_*) → sub-tree 空描画。
    tasks:
      - add-routing-logs
      - implement-warn-once-degradation-logs
    tests:
      - TS-15
      - TS-17
      - TS-21
  FR8:
    title: Pixmap sizing uses base cell height with 1px padding + bbox-fit
    status: ok
    resolution: |
      `rasterize` の 4 番目の引数 `target_cell_h_px` (= base text font の
      `ascent + descent` を `size_px` でスケールした値) で Pixmap を正方化:
      `dim = max(1, ceil(target_cell_h_px))` (`> 0` のとき)、または
      `dim = max(1, ceil(size_px))` (legacy fallback, テスト用)。
      内側 `(dim - 2) × (dim - 2)` に 1 px padding 込みで絵文字を描画。
      `dim < 4` のとき padding 省略 (inner エリアを正に保つため)。
      bbox-fit scaling: `ColorGlyph::bounding_box` で実 bbox を取得し、
      `scale = inner / max(bbox_w, bbox_h)` で uniform スケール + centering。
      ClipBox 不在時は EM box (0, 0, upem, upem) を fallback。
      `advance` は `dim` に pin (wide-cell renderer の `sx = cell_w/advance`
      が 1.0 に解決される)。`bearing.1` は swash_adapter::raster が
      base ascent (px) で上書きしてビットマップ top をセル top に揃える。
    tasks:
      - implement-rasterize-entry-point
      - add-raster-colrv1-branch
      - add-set-base-font-trait-and-call-site
    tests:
      - TS-14
      - TS-14b
      - TS-14c
      - TS-15
