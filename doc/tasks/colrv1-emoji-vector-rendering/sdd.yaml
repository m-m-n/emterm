requirements:
  FR1:
    title: COLRv1 paint graph rasterization (skrifa + tiny-skia)
    status: ok
    resolution: |
      実装は 4-param signature:
      `rasterize(font_bytes, glyph_id, size_px, target_cell_h_px) -> Option<RasterizedColorGlyph>`
      に拡張済み。`target_cell_h_px > 0` で base text font の cell height
      ベースで Pixmap を正方化し、`<= 0.0` でレガシー `ceil(size_px)`
      fallback (隔離テスト用)。pixmap sizing 詳細は FR8 を参照。
      SweepGradient / RadialGradient (r0 > 0) は tiny-skia 0.11 の制約で
      partial 対応 (FR7 の warn_once ログで通知)。
    tasks:
      - scaffold-colrv1-painter-module
      - implement-tiny-skia-color-painter
      - implement-rasterize-entry-point
    tests:
      - TS-7
      - TS-8
      - TS-9
      - TS-10
      - TS-14
      - TS-15
  FR2:
    title: Font path routing via is_colrv1_emoji flag
    status: ok
    resolution: |
      skrifa 0.20 の COLR API 形状を確認済み (planning フェーズ):
      `MetadataProvider::color_glyphs() -> ColorGlyphCollection` →
      `ColorGlyphCollection::get_with_format(GlyphId, ColorGlyphFormat::ColrV1) -> Option<ColorGlyph>` →
      `ColorGlyph::paint(LocationRef, &mut impl ColorPainter)`。
      probe は (1) FontRef::new(bytes), (2) COLR table version == 1,
      (3) cmap covers U+1F600 の3段ガードで `true`/`false` を返す。
      routing は SwashFont.is_colrv1_emoji フラグ (ingest 時にキャッシュ) を
      SwashRasterizer::raster で評価して colrv1_painter::rasterize へ分岐。
      base text font の cell height / ascent 解決のために
      GlyphRasterizer trait に default no-op の
      `set_base_font(&self, _font: FontId)` を追加。
      SwashRasterizer は impl override で Inner.base_font にキャッシュ、
      App::build_font_stack が構築直後に rasterizer.set_base_font(base_id)
      を 1 回呼ぶ集約配線とした。
    tasks:
      - implement-is-colrv1-emoji-probe
      - extend-swashfont-with-colrv1-flag
      - add-raster-colrv1-branch
      - add-set-base-font-trait-and-call-site
    tests:
      - TS-4
      - TS-5
      - TS-6
      - TS-15
      - TS-16
  FR3:
    title: Premultiplied to straight alpha conversion
    status: ok
    tasks:
      - implement-un-premultiply-helper
    tests:
      - TS-1
      - TS-2
      - TS-3
