    artifacts: [IMPLEMENTATION.md, VERIFICATION.md]
    status: completed
    completed_at_commit: 610ae6a6194ce67fa33921b30e1407d577954ff3
  - id: verify-plan
    status: completed
    completed_at_commit: 610ae6a6194ce67fa33921b30e1407d577954ff3
  - id: implement
    status: completed
  - id: check
    status: completed
    completed_at_commit: 610ae6a6194ce67fa33921b30e1407d577954ff3
  - id: verify
