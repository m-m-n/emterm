schema_version: 1
feature: wasm-esc-ring-buffer
scale: full
created: 2026-02-15

project:
  components:
    main:
      language: rust
      build_command: "cd wasm && wasm-pack build --target web --out-dir pkg"
      test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml"
    frontend:
      language: typescript
      build_command: "bun build src/index.html --outdir dist --minify"
      test_command: "bun test"
      format_command: "bun run typecheck"

workflow:
  - id: create-spec
    artifacts: [SPEC.md]
    status: completed
    completed_at_commit: 610ae6a6194ce67fa33921b30e1407d577954ff3
