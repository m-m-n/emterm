schema_version: 1
feature: worktree-font-bootstrap
created: 2026-09-22
base_branch: main
goal: |
  worktree で src-tauri/assets/fonts/ が空のため build.rs が panic しテストが一切走らない

  種別: バグ
  指示メモ: em-workflow review 実行中に観測。回避策はメインツリーからフォントをコピー

  ## 現象 (必須)
  `git worktree add` で作った新しい作業ツリーでは `src-tauri/assets/fonts/` が空になる
  （gitignore 済みで git 追跡されていないため）。この状態で
  `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib`
  を実行すると build.rs がフォント不在で panic し、テストが 1 件も走らない。
  ## 再現手順 (必須)
  1. `git worktree add -b tmp/probe <path> main` で新しい worktree を作る
  2. その worktree で上記の cargo test を実行する
  3. build.rs が panic し、テストが 1 件も実行されないことを確認する
  ## 期待する挙動 (必須)
  新しい worktree でもテストが走ること。少なくとも、build.rs がフォント不在時に
  「`bash scripts/fetch-fonts.sh` を実行せよ」と読み手が次の手を取れる形で停止すること。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `src-tauri/build.rs` — フォント不在時に panic する箇所
  - `src-tauri/assets/fonts/` — gitignore 済みの取得先
  - `scripts/fetch-fonts.sh`
  ## 実害・発生条件 (任意)
  worktree を作って作業するすべての経路で起きる。em-workflow はタスクごとに worktree を
  作るため、実装エージェントが毎回この壁に当たる。今回は実装エージェントがメインツリーの
  `src-tauri/assets/fonts/` を worktree 側へコピーして回避した（git 管理外の場所なので
  差分には現れない）。回避策を知らない場合、build.rs の panic がタスク自体の失敗と
  誤診される。
  出典: em-workflow の benign-edit-test-token-rewrite / task0001 実装中に観測。
