    file: scripts/verify-font-bootstrap.sh
    line: 342
    title: "3シナリオの worktree と target ディレクトリが同時に存在し、Rust キャッシュも効かない"
    description: >-
      3 つのシナリオは順に実行されるが、worktree の削除は trap EXIT の cleanup() だけで
      行われるため、最後まで 3 本の worktree とそれぞれの src-tauri/target が同時にディスク上に
      残る。中身は GUI 既定フィーチャの wgpu/winit/wry スタックで、cargo check 2 本 +
      cargo test --lib 1 本の debug 成果物なので、ピーク使用量が ubuntu-latest ランナーの
      ルート FS 空き容量に対して無視できない。加えて ci.yml の Swatinem/rust-cache@v2
      (workspaces: src-tauri) が復元/保存するのは $GITHUB_WORKSPACE/src-tauri/target だけで、
      シナリオのビルド先は $SCRATCH_ROOT/<name>/src-tauri/target (mktemp -d 配下) なので
      コンパイル成果物のキャッシュが 1 バイトも効かない。結果として毎 push / PR で GUI スタックを
      3 回コールドビルドし、timeout-minutes: 60 に対する余裕も読みにくい。
    suggestion: >-
      各シナリオ関数が verdict を記録した直後にその worktree を個別に remove して
      CREATED_WORKTREES から外し、ピーク時のディスク占有を 1 本分に抑える。あわせて
      rust-cache ステップを外すか、3 シナリオ共通の CARGO_TARGET_DIR をキャッシュ対象パス配下に
      置いて依存クレートのビルドを 1 回で済ませるかを選ぶ。
    sources: [claude:evaluator]
    confidence: 60
