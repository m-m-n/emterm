    file: scripts/verify-font-bootstrap.sh
    line: 208
    title: "un-fetched シナリオが「ビルド停止」と「テスト失敗」を区別せず、CI が偽陽性で赤くなる"
    description: >-
      scenario_unfetched は executed=$(count_executed_tests ...) を先に計算しているのに、
      判定は status -ne 0 を先に見て "the build script stopped the build (exit $status),
      0 tests executed" と固定文言で報告する。ライブラリテストが実際に走ったうえで 1 件
      落ちた場合 (status=101, executed>0) も、この分岐に入って事実と違う診断が出る。
      SPEC の AC1/FR6 が要求しているのは「実行テスト件数が非ゼロであること」であって
      全テストの成功ではないので、この gate は AC1 より厳しい方に逸脱している。さらに
      このプロジェクトは cargo test --lib を既定の並列度で回すと非決定的に落ちるテストを
      抱えている (src-tauri/src/tabs/tests 配下の replay 系、src-tauri/src/tmux_sockets.rs
      の discover_returns_only_the_live_socket) ため、ci.yml で新設した必須ジョブが
      font-bootstrap とは無関係な理由で間欠的に赤くなり、しかも原因がフォント取得だと
      誤って表示される。
    suggestion: >-
      executed -eq 0 の判定を status -ne 0 より先に置いて、(a) executed=0 かつ status!=0 なら
      「ビルドが止まった」、(b) executed>0 かつ status!=0 なら「テストは実行されたが失敗した」と
      文言を分ける。AC1 に忠実にするなら (b) は un-fetched シナリオの PASS 条件を満たす扱いに
      するか、少なくとも --test-threads=1 を付けて既知のフレーク源を潰す。
    sources: [claude:evaluator]
    confidence: 80
    resolution: unresolved
    resolution_reason: >-
