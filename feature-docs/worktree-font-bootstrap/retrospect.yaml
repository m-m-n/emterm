lessons_candidates:
  - >-
    3 タスクすべてが `test-docs/worktree-font-bootstrap/taskNNNN.tests.yaml` を
    追加したが、どの task の `files` にも宣言が無かった。tdd-testing スキルが生成する
    テストドキュメントは実質的に必ず生まれる成果物なので、プランナー側で既定の
    宣言対象に含めるか、file_prediction_misses の対象外にするかの判断が要る。
  - >-
    review round 1 の残存 2 件はいずれも severity medium で、Phase R4 の自動修正
    候補ゲートが critical/high に機械的に限定されているため手付かずのまま completed に
    到達した。うち a7b9b3b29c8ec135 は「新設 CI ジョブが無関係な理由で間欠的に赤くなり、
    原因がフォント取得だと誤診断される」という、マージ後に運用コストを生む種類の欠陥。
    medium でも CI の信頼性に関わるものは自動修正の対象に含めるか、少なくとも完了ゲートで
    可視化する余地がある。
  - >-
    verify の TS8 は文言と実測が食い違ったまま PASS になった（SPEC.md assumption a7 が
    「fetch 後に最大 1 回の追加実行がありうる」と先に書いていたため）。VERIFICATION.md の
    シナリオ文言が SPEC の assumption と同期していないと、verify が毎回 Codex 相談を
    必要とする。計画フェーズで assumption → シナリオ文言の写しを取る規律が要る。
  - >-
    TS7（feature ブランチでの実際の CI 実行）は push と PR 作成の後にしか観測できず、
    verify フェーズの中では構造的に未実行にしかならない。CI ジョブ新設を伴う feature では
    「verify では観測不能」であることを計画時点で明示しておくと、未実行が失敗と
    誤読されない。
  - >-
    このフィーチャは 3 回の Codex 相談（create-spec の target-behavior 他、review の
    medium 処理、verify の TS8 判定）で判断を確定させた。いずれも batch の
    unlisted-gate fallback ではなく明示的な相談で、結論と根拠が batch-audit.yaml に
    残っている。無人実行の判断根拠としてこの形式は機能した。
