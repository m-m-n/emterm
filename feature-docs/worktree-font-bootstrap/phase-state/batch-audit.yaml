      許容してマージする判断とは別物。今回は --once で次回起動まで区切れるので、B/C で
      自動修正の機械的ゲートを独断で越えるより、明示的な別タスクで修正する方が品質と
      手順の両方を守れる。finding 2 は後続対応に回し、finding 1 を PR マージ前に解消する
