  - question_id: implement.orphan-retry-shape
    packet_id: null
    answered_at: "2026-09-12T20:03:30+09:00"
    source: codex-consultation
    answer_mode: single_select
    selected_option_ids: ["B"]
    freeform: >-
      Option B (clean re-attempt): fast-forward the stale task branch to the
      current integration tip and recreate its worktree there, rather than
      re-launching on the orphaned worktree as-is.
    normalized_answer: >-
      Clean re-attempt from the current integration tip.
    resolution_note: >-
      gate: user-instructed consultation. The previous launch of task0001 was
      orphaned (its launching session 01a08690-823a-750e-a15a-bd0abce5b0d3 died
      before the implementer reported); orphan recovery appended a failed event
      and the batch auto-retry (implement.failed-task, 1 of 1) had to choose
      between (A) reusing the orphaned worktree as-is at branch point f52c13ec,
      two commits behind integration, and (B) a clean re-attempt from the
      current tip. codex_consulted: true, answered (codex-cli 0.154.0,
      read-only sandbox). Codex chose B, reasoning that the task branch carried
      zero commits beyond its branch point so nothing was lost; that B starts
      from the integrated state; that AC-8's change-set enumeration is correct
      under either option only if it is anchored on the merge base rather than
      a stale branch point, and that under B the anchor must be updated to the
      new tip; and that B removes the risk of inheriting uncommitted or
      untracked state left by the dead session. Codex's stated residual risk —
      unsaved work could exist even with zero commits — was checked and
      excluded before removal: `git status --porcelain` in the orphaned
      worktree was empty. Adopted B. The AC-8 anchoring caveat was passed to
      the implementer in its launch prompt. Option A was not chosen because it
      offered no advantage once the worktree was confirmed to hold no work.
      fallback_provider: not needed. opus_escalation: not run.
      Note on execution: the branch was retired by fast-forwarding it to the
      integration tip (provably an ancestor) rather than by a force delete, so
      no unreachable commit was created.
  - question_id: review.medium-finding-disposition
    packet_id: null
    answered_at: "2026-09-12T20:16:10+09:00"
    source: codex-consultation
    answer_mode: single_select
    selected_option_ids: ["A"]
    freeform: >-
      Option A (follow the protocol): do not auto-fix the medium finding,
      record it as `unresolved` in round1.yaml, and complete the review step
      because residual_critical_high == 0.
    normalized_answer: >-
      Keep the mechanical auto-fix gate; record unresolved; complete the step.
    resolution_note: >-
      gate: user-instructed consultation. Review round 1 produced exactly one
      finding (stable_id 13ce1dd741623d9b, severity medium): the AC-8
      red_reason of this feature's own generated record
      test-docs/ac7-red-reason-scope/task0001.tests.yaml claims a fixed-string
      search of its own text for single-file phrasings "returns no match",
      while `grep -Fn "only one file"` on that file returns line 101 and
      `grep -Fn "lists only"` returns lines 43, 47 and 101 — the record quotes
      the searched needles inline. The tension: the evaluator returned
      `recommended_action: auto_fix`, but Phase R4's auto-fix candidate gate
      admits only severity critical/high, and Phase R3b states
      `recommended_action` is advice and never a decision. Options put to
      Codex: (A) follow the protocol — no auto-fix, record `unresolved`,
      complete the step; (B) adopt the evaluator's advice and bypass the gate,
      on the grounds that the finding reproduces inside this feature's own
      artifact the very defect class (SPEC NFR4) the feature exists to remove,
      so leaving it repeats the history that created this task.
      codex_consulted: true, answered (model gpt-5.6-sol). Codex chose A on
      three grounds: an unattended orchestrator bypassing a written mechanical
      gate at its own discretion destroys the determinism and auditability of
      the decision; the impact stays inside documentation and touches neither
      code behavior nor the completion gate, so `medium` is the correct
      severity and no escalation to `high` is warranted; and recording the
      finding as `unresolved` is not a repair but is this protocol's formal
      hand-off to human review, which is preferable to auto-applying an edit no
      reviewer approved. Adopted A. Option B was not chosen for those reasons.
      The finding is persisted in full in reviews/round1.yaml and travels with
      the PR, so the human evaluator sees it. fallback_provider: not needed.
      opus_escalation: not run.
      Follow-up filed (2026-09-12, verify turn): the finding was raised as a
      separate Notion task via the notion-task-dispatch CLI -
      https://app.notion.com/p/AC-8-red_reason-3d93509ec8ee819fa42ed9668536eada
      (type bug, status not started). Do not file it again on a later turn.
  - question_id: verify.preexisting-format-drift-disposition
    packet_id: null
    answered_at: "2026-09-12T20:22:40+09:00"
    source: codex-consultation
    answer_mode: single_select
    selected_option_ids: ["A"]
    freeform: >-
      Option A: record the biome format error as a non-blocking pre-existing
      condition in the verify result and set verify.status = completed.
    normalized_answer: >-
      Non-blocking pre-existing condition; verify completes; no failed_item.
    resolution_note: >-
      gate: user-instructed consultation. VERIFICATION.md's Code Quality
      section expects `bunx biome format .` to report no changes, but the
      command exits non-zero with exactly one error on
      src-tauri/web-shared/settings/types.ts. That file is byte-identical to
      base branch `main`
      (`diff <(git show main:src-tauri/web-shared/settings/types.ts)
      src-tauri/web-shared/settings/types.ts` is empty), so the drift is
      pre-existing and lies entirely outside this feature's change set, which
      contains only test-docs/ac2-red-reason-accuracy/task0001.tests.yaml and
      test-docs/ac7-red-reason-scope/task0001.tests.yaml. Options put to
      Codex: (A) record it as a non-blocking pre-existing condition and
      complete verify; (B) record it as a verify failed_item, which in batch
      mode would trigger an automatic rework round that must edit a
      TypeScript file outside the Declared Change Set — something SPEC FR6
      forbids (the edit is confined to one folded scalar).
      codex_consulted: true, answered (model gpt-5.6-sol). Codex chose A on
      four grounds: the verify gate exists to detect regressions and the
      byte-identical diff against main proves this is not one; option B would
      force scope creep into a file the SPEC forbids touching, with no safety
      benefit; the failure must still be visible in the record rather than
      silently dropped, so the command, its exit status, the target file and
      the main-identical evidence are written into the verify result; and a
      careful reviewer expects change-set verification and whole-repo
      formatting to stay separated rather than conflated into one status.
      Adopted A. Option B was not chosen for those reasons.
      fallback_provider: not needed. opus_escalation: not run.
