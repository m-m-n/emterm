schema_version: 1
feature: ac7-red-reason-scope
created: 2026-09-09
base_branch: main
goal: |
  AC-7 red_reason が変更セット全体について実態と食い違う主張をしている

  ## 現象（必須）
  `test-docs/ac2-red-reason-accuracy/task0001.tests.yaml:96` の AC-7 エントリの `red_reason` が、`git status --porcelain` の結果として「変更セットには `test-docs/ac7-red-confirmed-unobserved/task0001.tests.yaml` の 1 ファイルしか無い」と全変更セットに対する主張として記述されている。
  しかし実際のタスクコミットの stat には 2 パスが含まれる。対象レコードに加えて、implement フェーズが必ず生成する `test-docs/ac2-red-reason-accuracy/task0001.tests.yaml` があるため。記録された観測は AC-7 を記述どおりには成立させていない。
  この記述は実行した瞬間（レコードファイル書き込み前）には真だったと推測されるが、全変更セットに対する主張としてスコープされている。

  ## 再現手順（必須）
  1. ブランチ `em-workflow/ac2-red-reason-accuracy/integration`（PR https://github.com/m-m-n/emterm/pull/57 ）を checkout する
  2. `test-docs/ac2-red-reason-accuracy/task0001.tests.yaml` の AC-7 エントリ（96 行付近）の `red_reason` を読む
  3. `git show 7aea1260 --stat` でタスクコミットの変更パスを確認する
  4. `feature-docs/ac2-red-reason-accuracy/tasks/task0001.md:151-154` の AC-7 と、SPEC の Success Criteria、および Declared Change Set の `test-docs/{feature}/**` を読む

  ## 期待する挙動（必須）
  AC-7 の `red_reason` が実際に行った検査とそのスコープを記述している。すなわち「変更セットは対象 YAML と、このタスク自身のワークフロー生成テストレコード（`test-docs/ac2-red-reason-accuracy/task0001.tests.yaml`、SPEC の Declared Change Set 項目 `test-docs/{feature}/**` に含まれる）であり、その一覧に Rust ファイルも TypeScript ファイルも無い」という趣旨になっている。全変更セットに対して「1 ファイルのみ」と述べない。

  ## 完了の定義（必須）
  - [ ] AC-7 の `red_reason` が実際の変更セット（2 パス）を正しく記述している
  - [ ] 「Rust / TypeScript ファイルが無い」という本来の検査意図は保持されている
  - [ ] 編集は当該 folded scalar 1 箇所に限定されている
  - [ ] ファイルが YAML として parse できる

  ## 該当箇所（任意）
  `test-docs/ac2-red-reason-accuracy/task0001.tests.yaml:96`（AC-7 エントリ、`red_reason`）
  根本原因は計画側にもある。タスク計画の AC-7 と SPEC の Success Criteria の該当項目は、implement フェーズが常に `test-docs/{feature}/task0001.tests.yaml` を生成する以上、文字どおりには充足不能。SPEC 自身の Declared Change Set はこれを明示的に許容している。AC-7 の書き方を見直すか、SPEC 側の記述を合わせるかの判断が要る。

  ## 実害・発生条件（任意）
  これは feature `ac2-red-reason-accuracy` がまさに閉じようとしていた record/reality gap と同じクラスの問題（SPEC BO-1 / NFR4）。`taskNNNN.tests.yaml` は後続タスクが失敗の帰属先を判断するための機械可読レコードなので、根拠テキストが実態と乖離していると誤った前提を渡す。
  由来: PR #57 の feature `ac2-red-reason-accuracy` review round 1。stable_id `38b373af929abc3d`（comprehensive 観点、confidence high）。severity medium のため auto-fix ゲート（critical/high のみ）の対象外で `unresolved` のまま残した。

  ## Notion タスク
  https://www.notion.so/3d23509ec8ee81efa9e0d50dc4bdb3af

