tasks:
  task0001:
    title: "Confirm and fix replay coordinate drift behind post-switch render corruption"
    plan: tasks/task0001.md
    files:
      - src-tauri/src/mux/scrollback_buffer.rs
      - src-tauri/src/mux/scrollback_filter.rs
      - src-tauri/src/mux/snapshot_bytes.rs
      - src-tauri/src/mux/session/pane.rs
      - src-tauri/src/mux/daemon.rs
      - src-tauri/src/mux/ipc/handlers.rs
      - src-tauri/src/mux/ipc/reattach.rs
      - src-tauri/src/mux/ipc/pty_spawn.rs
      - src-tauri/src/tabs.rs
      - src-tauri/src/app.rs
      - crates/term_core/src/terminal_core.rs
      - crates/term_core/src/ring_buffer.rs
    skills: [backend-impl]
    domains: [input-handling, ui, concurrency]
    complexity: high
    requirements: [FR1, FR2, FR3, NFR1, NFR2, NFR3]
    status: merged
    notes: "Investigation verdict: same root cause as PROBE D (resize-interleaved scrollback replay coordinate drift). Fix centralized in TerminalCore::replay_with_resize_markers; daemon.rs/handlers.rs/tabs.rs/app.rs/ring_buffer.rs left unmodified (predicted but unnecessary). Known limitation: marker inside >=64KiB off-thread snapshot payload can under-report evicted_total/scrollback_length (grid/cursor correctness unaffected)."
    branch: em-workflow/mux-render-corruption/task0001
  task0002:
    title: "Harden the resize-marker protocol (review round 1 rework)"
    plan: tasks/task0002.md
    files:
      - src-tauri/src/mux/scrollback_filter.rs
