    status: merged
    branch: em-workflow/mux-render-corruption/task0005
    notes: "review round 4 の residual high からの rework。D3''(NFR1) は MAX_DIM_MARKERS=16 の daemon 側上限 + segment 数を考慮した off-thread dispatch で対応（term_core 側の per-segment reflow コスト削減ではない）。意図的にスコープダウンした 2 件: (a) D6''/AC-8 は共有関数 fits_single_snapshot_frame で全 producer が検査する形にしたが、reattach の oversize フォールバックは segment-blind な PtyOutput chunking のまま（真の多フレーム配送はクライアント側再組み立てプロトコルが必要）、(b) SnapshotSegment 名前付き型リファクタ(cefa30b5ebd33f5c)は見送り。途中で implementer が未コミットのまま停止し、SendMessage で再開して完了。Deviations: src-tauri/src/mux/{cli.rs,daemon.rs} の legacy-daemon テスト fixture が FAKE_LEGACY_VERSION=1 をハードコードしており PROTOCOL_VERSION bump で hang したため PREVIOUS_PROTOCOL_VERSION 由来に修正"

