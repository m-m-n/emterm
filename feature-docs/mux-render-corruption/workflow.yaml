    status: merged
    branch: em-workflow/mux-render-corruption/task0003
    notes: "review round 2 の residual critical/high からの rework。マーカーの権威を dim_markers サイドチャネルへ移し偽装クラスを根絶する方針をユーザーが選択。設計判断: RESIZE_MARKER_MAX_COLS/ROWS を 2000→4096 に引き上げ（共有 SSOT 化に伴う）、D7 は REATTACH_CHUNK_SIZE を MAX_FRAME_LENGTH 由来に変える範囲に留めた（chunked-snapshot 副プロトコルは Candidate C 同様スコープ外）。handlers.rs は変更不要だった"

