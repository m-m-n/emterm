    notes: "review round 3 の residual critical/high からの rework。寸法を snapshot の別フィールドで運び replay のバイト走査を廃する方針をユーザーが選択。round 3 findings のうち 981230284d7d3273（resize storm の entry 数 bound）のみ未クローズ: 安全でないバイトしきい値 coalescing を正しさのため撤回した結果、1 ステップの再描画が 8 KiB を超える storm で dim_markers が無制限に増える経路が再び開いた。真の修正は resize 適用層でのデバウンスが必要と判断し、doc コメントと回帰テストで観測可能な形に留めた。Deviations: crates/term_core/src/{bench.rs,ring_buffer.rs} が API 変更に伴う機械的シグネチャ修正で expected_files 外"

