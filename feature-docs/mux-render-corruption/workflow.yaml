      - src-tauri/src/mux/daemon.rs
      - src-tauri/src/tabs.rs
      - crates/term_core/src/terminal_core.rs
    skills: [backend-impl]
    domains: [input-handling, ui, concurrency, api-contract]
    complexity: high
    requirements: [FR2, FR3, NFR1, NFR2, NFR3]
    status: merged
    branch: em-workflow/mux-render-corruption/task0002
    notes: "review round 1 の residual critical/high からの rework（findings 0c18ff55032328ab / 81947e02402b5ace / 83bed291fb779f52 / 6ff208bbc674189c / 20b2bed0aaf48f94 / 1698d9b52a89e241 / 4005fe364386682d / 7aef70ff81703b90 / abeda9cc206cf018）。Deviations: crates/term_core/src/snapshot.rs（新 diagnostic field の struct literal 追加）と src-tauri/src/mux/ipc/handlers.rs（コメント文言のみ）が expected_files 外"

