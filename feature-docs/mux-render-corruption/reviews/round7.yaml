  - stable_id: a4f4e36fef377d05
    severity: medium
    category: performance
    file: crates/term_core/src/terminal_core.rs
    line: 1112
    title: "The byte-only prefix gate still permits costly near-all-prefix replays"
    description: >-
      64 KiB の inclusive gate は 65,536 バイトの prefix + 4,096 バイトの target サイズ suffix でも
      engage するため、payload の約 94% が非 bypass で処理され、その後 tabs.rs の
      scrollback restore でもう一度処理される。prefix に最大 24 個の非空 segment を含む
      現実的な resize storm があるとコストが高い（tabs.rs 自身が「segment reflow コストは
      バイト数ではなく蓄積コアサイズに依存する」と認めている）。
      新しい bench は約 200 KiB prefix / 40 segments としきい値から十分離れた形しか試しておらず、
      この境界ケースを覆っていない。
    suggestion: >-
      suffix が prefix を実質的に支配することも要求し、prefix の reflow コストを bound する
      （suffix_len >= split_at + prefix の segment / 累積セル上限）。
      daemon cap の 24 segment・64 KiB prefix・4 KiB suffix で split しないことを
      assert する回帰アームを追加する。
    sources: [codex:performance]
    confidence: 50
    resolution: unresolved
    resolution_reason: "round 8 rework へ回送。7c70216c5a5d5c24 と同じ gate の話なのでまとめて扱う"

