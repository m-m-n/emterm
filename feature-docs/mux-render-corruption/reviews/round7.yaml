findings:
  - stable_id: 01f91fe698ceb287
    severity: high
    category: spec
    file: src-tauri/src/mux/scrollback_buffer.rs
    line: 402
    title: "FR2 未達（継続）: cap が 2 件以上 evict すると replay は依然として行を混ぜ、形状によっては未修正より悪い"
    description: >-
      round 7 の D1'''' 修正（capped_head_dims = 直近に evict した 1 件の寸法を position 0 に使う）は
      eviction がちょうど 1 件の場合しか成立しない。enforce_dim_marker_cap は marker が増えるたび
      1 件ずつ pop するので、MAX_DIM_MARKERS(24) を N 件超えるドラッグでは N 件 evict され、
      head gap は「evict された全 marker がカバーしていた複合区間」になる。そこに最後に evict した
      1 件の寸法を当てると、gap の大部分（= retained window の最も古い = 最も大きい部分）が
      storm 中の寸法で replay される。
      レビュアーによる実測（実 ScrollbackRingBuffer + term_core、100% 決定的。
      apt fixture 120x47→48 を phase 0 とし resize storm を付与、target 120x47、ring は wrap）:
      |storm|marker数|eviction|未修正|full|round6|round7現行|
      |47/48|25|1|3|0|1|**0**|
      |47/48|28|4|3|0|3|1|
      |47/48|32|8|3|0|3|3|
      |47/48|52|28|3|0|3|**13**|
      |30/31|28|4|8|0|7|7|
      |30/31|32|8|8|0|7|**9**|
      |30/31|52|28|16|0|7|**19**|
      要点: eviction=1 では full と完全一致（修正は有効）。round 6 で報告された
      28 marker/4 eviction は 7 → 7 で一切改善していない。eviction 8 以上では現行が
      未修正を上回り round 6 実装よりも悪い。MT-3 が想定する連続ドラッグ（数十回 resize）は
      まさにこの破綻域。
      検証側の齟齬: 新 TS-7 は storm_steps を eviction ちょうど 1 に絞っており破綻域に
      構造的に到達できない（テスト doc も「several evicted entries は accepted precision loss」と明記）。
      eviction=1 では round 6 実装だと落ちること（弁別性）は確認済みだが、
      VERIFICATION.md の FR2 カバレッジ行が TS-7 を根拠に挙げているのは成立していない。
    suggestion: >-
      レビュアーが実測で検証した最小修正 (a): **evict が 2 件以上のときは head segment を
      合成しない**（gap を無属性のまま残し、core の現在 = target 寸法で replay させる）。
      生存 marker は真の position のまま維持する。上表の全ケースで 0 混線・full uncapped
      attribution と一致した。1 eviction のときだけ現行の capped_head_dims を使えば
      TS-7 の既存アサーションもそのまま通る。実装上は read_segments が evict 件数を持ち、
      >= 2 のとき head を push しないこと、および build_snapshot_bytes_with_layout の
      「先頭 segment は必ず offset 0」前提を「先頭が 0 でない segment 列も clear_prefix 分だけ
      一律シフトして通す」に緩めることが必要。
      代替 (b)（最古 evict の寸法を使う）は実測で 47/48 storm 3 / 30/31 storm 8 混線と
      (a) に劣ったので、採るなら再測定すること。
      テスト側 (c): TS-7 を eviction 件数 1 / 4 / 28 でパラメタライズし、各件数で
      capped_mixed <= no_segments_mixed（未修正より悪くしない）を追加でアサートすること。
      現行テストは capped == full を先にアサートしているため混線数比較が恒真になっている。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "round 8 rework へ回送。修正案は実測検証済み"

