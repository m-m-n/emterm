  - stable_id: 1cd7b5e593f3b901
    severity: medium
    category: security
    file: crates/mux_ipc/src/protocol.rs
    line: 156
    title: "Unbounded segment count enables memory and reflow denial of service"
    description: >-
      wire の count に上限が無い。count.min(4096) は初期 Vec 容量を制限するだけで、
      ループはフレーム内の全 segment を push する（codec 上限内で約 200 万エントリ）。
      64 KiB 未満の content に 1 バイトずつ寸法の異なる segment を並べると、
      同期 replay 経路が選ばれたまま UI スレッドで数万回のフルリフローが走る。
    suggestion: >-
      allocation 前に厳格な最大 segment 数を定義・強制し、テーブル長を
      checked arithmetic で検証する。同期 replay の選択にも segment 数を織り込む。
    sources: [codex:security, codex:performance, codex:architecture]
    confidence: 100
    resolution: unresolved
    resolution_reason: "round 5 rework へ回送"

  - stable_id: fdfd391ba97167de
    severity: high
    category: architecture
    file: crates/mux_ipc/src/protocol.rs
    line: 32
    title: "Snapshot/SnapshotRestore のペイロード形式を変えたのに PROTOCOL_VERSION を据え置いている"
    description: >-
      既存メッセージ Snapshot / SnapshotRestore の payload が EMSNAP2 エンベロープに
      非互換変更されたのに PROTOCOL_VERSION は 2 のまま。PROTOCOL_VERSION の doc は
      前回の bump について「No existing message's encoded bytes changed」（追加だけでも
      bump した）と明記し、「there is no silent compatibility shim between protocol
      versions」とも書いている。今回は既存メッセージのバイト列が変わり、かつ
      decode 側のマジック sniff という silent shim をバージョン交渉を経ずに入れている。
      縮退が定義されているのは「旧 daemon → 新 GUI」の一方向のみで、逆向き
      （新 daemon → 旧 GUI）は version=2 同士でハンドシェイクが通り、旧 GUI は
      EMSNAP2 ヘッダと segment テーブルをそのまま端末内容として描画する。
      mux は SSH 越しで版ズレを前提とした設計で、PREVIOUS_PROTOCOL_VERSION +
      recover_from_legacy_daemon という復旧機構があるのに、それを起動する唯一の
      スイッチを回していない。
    suggestion: >-
      PROTOCOL_VERSION を 3 に bump し、doc に変更内容を追記。固定値テストも更新する。
      bump しない判断なら、その根拠を doc に明示し、マジック sniff が意図的な shim である
      ことを「no silent compatibility shim」記述と矛盾しない形に直す。
    sources: [claude:architecture, codex:architecture]
    confidence: 95
    resolution: unresolved
    resolution_reason: "round 5 rework へ回送"

