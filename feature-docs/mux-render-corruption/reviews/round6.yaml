    title: "D1''' の prefix 区間で OSC 133 B マークのコマンド文字列が失われる（fold ラベルが空/別行になる）"
    description: >-
      bypass_b_mark_texts への行テキスト捕捉は push_pending_prompt_mark の
      `if self.scrollback_bypass && kind == b'B'` でゲートされている。round 6 の split では
      prefix を bypass OFF で replay するため、prefix 中の B マークはこの側テーブルに入らない。
      さらに prefix の実 scrollback は直後の restore_bypass_invariant_after_reflow で
      drain+release され、viewport に残っていた行も suffix の bypass 下で捨てられる。
      結果 tabs.rs の fallback extract_line_text が suffix 由来の無関係な viewport 行か
      空文字を返す。round 6 で入った退行（rounds 1-5 では k>0 なら全ドレイン非 bypass、
      k==0 なら全区間 bypass だったのでどちらの穴も無かった）。
      発火条件は「pane spawn と GUI の最初の Resize の間にシェル出力があり OSC 133 B を含む」
      = ordinary switch の典型形。影響は fold のコマンドラベルのみ。
      付随: bypass_split の閾値は suffix 側しか見ておらず prefix 長を見ていないため、
      prefix 2 MiB / suffix 4 KiB のような利得ゼロの形でも split が engage する。
    suggestion: >-
      B マークテキストの捕捉条件を「bypass 中」から「snapshot replay 中」に広げる、
      または restore_bypass_invariant_after_reflow の直前に prefix の実 scrollback /
      viewport から B テキストを回収して bypass_b_mark_texts に投入する。
      あわせて bypass_split の gate に prefix 側の上限を加える。
