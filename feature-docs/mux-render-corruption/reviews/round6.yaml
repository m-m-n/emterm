  - stable_id: 004fe3021b5d0c15
    severity: medium
    category: spec
    file: crates/term_core/src/terminal_core.rs
    line: 1077
    title: "NFR1: resize storm 形状の切替が segment-free 比 30-40 倍（8ms → 332ms）に劣化"
    description: >-
      レビュアーが release で再実行した実測（VERIFICATION.md の表と整合）:
      segment-free 8.15ms / ordinary switch 1.58ms / 1 seg differing 282.9ms /
      6 segs storm 235.3ms / 24 segs storm(cap) 332.3ms。
      通常切替は round 5 の退行（170-220ms）が解消されており AC-4 も満たす。
      残る問題は storm 形状: prefix/suffix split は「target と一致する末尾 run」が
      BYPASS_SUFFIX_MIN_BYTES(4096) 以上ある場合しか効かないため、ドラッグ直後に
      切り替えるケースは whole-drain non-bypass に落ちて 235-332ms を払う。
      本 feature 導入前はどの形状でも segment-free 相当の ~8ms だった。
      VERIFICATION.md は「1-second NFR1 ceiling」と述べているが SPEC NFR1 に
      1 秒という閾値は無く、判定基準が SPEC より緩い方向に書き換えられている。
    suggestion: >-
      (a) SPEC NFR1 に対する合意済みの許容値を SPEC 側に明示し、VERIFICATION.md の
      判定基準を SPEC 由来にする。(b) storm 形状でも bypass を効かせる
      （閾値を下げるだけでは足りず、中間 segment の resize が全 scrollback reflow を
      要求している点がコストの本体）。(c) 最低限 MT-2/MT-3 でこの形状の体感を
      明示的に評価対象にする。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "round 7 rework へ回送。SPEC 側の許容値明示が最小コストの解"

  - stable_id: 02bb52aaff9638e5
    severity: medium
    category: security
    file: crates/mux_ipc/src/protocol.rs
    line: 166
    title: "Per-segment limits still permit replay resource exhaustion"
    description: >-
      デコーダは最大 64 個の非空 segment を受け入れ、各々が最大 1,000,000 セルを
      宣言できる。悪意ある mux ピアは小さく妥当な snapshot で最大 64 回の大きな
      grid 確保 / reflow（約 6400 万セル分の仕事）を強制できる。8 未満なら
      tabs.rs で同期 replay されるため UI を stall させられ、それ以上でも
      CPU 消費が off-thread に移るだけで拒否はされない。
    suggestion: >-
      typed decode 中に非空 segment 範囲の累積 replay コスト予算を計算し、
      超過する payload を拒否する。同期 / off-thread の判定にも寸法由来のコストを含める。
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
    resolution_reason: "round 7 rework へ回送"

  - stable_id: 6cefb1dd16c126b6
    severity: medium
    category: architecture
    file: crates/mux_ipc/src/protocol.rs
    line: 328
    title: "Snapshot dimension policy has drifted between producer and decoder"
    description: >-
      round 6 のデコーダは MAX_SEGMENT_CELLS を超える segment を拒否するが、
      MuxPane::new / MuxPane::resize は各軸を clamp_resize_dims で検証するだけで
      4096x4096 までの積を記録する。2000x600 のような寸法は daemon に受理され
      PTY に適用され snapshot にエンコードされるが、同じプロトコルのクライアントが
      Malformed として捨てる。public encoder が、対になる decoder が拒否する
      payload を作れる状態。
    suggestion: >-
      積の制約を共有の検証済み寸法 / segment 契約の一部にする。
      pane 作成や PTY resize の前に適用し、同じ validator を snapshot の
      エンコードとデコードで再利用する。
    sources: [codex:architecture]
    confidence: 50
    resolution: unresolved
    resolution_reason: "round 7 rework へ回送"

  - stable_id: e519916efd5fdc42
    severity: medium
    category: performance
    file: crates/term_core/src/terminal_core.rs
    line: 1077
    title: "Late stable suffixes can nearly double full snapshot replay work"
    description: >-
      split は stable target suffix が 4 KiB あるだけで有効になり、prefix のコストを
      考慮しない。0.95-2 MiB の retained window の大半に寸法変更が散在し、末尾に
      target サイズの小さな再描画が >= 4 KiB ある形では、1st pass が payload のほぼ全体に
      対してフル圧縮と reflow を行い、その populate した prefix scrollback を捨てて
      scrollback_populated: false を報告し、tabs.rs が payload 全体の 2nd pass 非 bypass
      replay を起動する。旧来の高い初回 swap レイテンシを保ったまま、ほぼ全ての
      高コスト処理を背景で繰り返す。どちらの bench もこの hybrid を捕まえない。
    suggestion: >-
      split の gate を suffix サイズだけでなく prefix コストにも掛ける
      （小さい絶対 prefix、または payload を支配する suffix を要求する）。
      そうでなければ既存の whole-drain 非 bypass 結果を保持し 2nd pass をスキップする。
      大きな multi-segment prefix + 4-8 KiB target-size suffix の bench を追加する。
    sources: [codex:performance]
    confidence: 50
    resolution: unresolved
    resolution_reason: "round 7 rework へ回送。0bed3c30e41e2389 の付随指摘（prefix 長を見ない gate）と同根"

