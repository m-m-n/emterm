headline: >-
  **security は初めて findings ゼロ**。claude:security が forgery クラスの production 経路が
  一切残っていないこと、wire 入力検証が全項目で機能していること、prefix/suffix split に
  panic / DoS 経路が無いことを明示的に確認した（codex:security も cumulative cost の
  medium 1 件のみ）。NFR1 の通常切替も 170-220ms → 1.58ms に回復した。
  一方で **FR2 は依然未達で、しかも特定条件では未修正時より悪い**:
  cap 発火（>24 resize）時に retained window 先頭の寸法が失われ、実測で混線行が
  full attribution 0 / 未修正 3 / 現行 7 になる。修正自体は小さく特定済み。

findings:
  - stable_id: bb3353636b0206cb
    severity: high
    category: spec
    file: src-tauri/src/mux/scrollback_buffer.rs
    line: 359
    title: "FR2 未達: cap 発火時に retained window 先頭の寸法が失われ、replay が未修正時より多く行を混ぜる"
    description: >-
      enforce_dim_marker_cap は overflow 時に常に front を pop するため、
      retained window 先頭を記述しているエントリ自体が捨てられる。その結果
      read_segments の head が None になり、fallback が「最も古い生き残りマーカーの寸法」を
      position 0 に割り当てる。cap で消えた寸法下で生成された先行コンテンツ全体が、
      storm 中の寸法で replay される。
      実測（レビュアーが term_core を直接叩いて再現、100% 決定的）:
      apt fixture(120x47→48) を phase 0 とし 26 回の resize marker を付けて計 28 マーカーに
      すると、cap 後の head は (offset 0, 120x30) になり、120x47 へ replay した結果:
      full(cap なし)=混線行 0 / 現行 cap 済み=混線行 7 / segment 一切なし(修正前)=混線行 3。
      つまり 24 回を超える resize 列では本 feature の修正が「未修正より悪い」結果を出す。
      トリガーは VERIFICATION.md MT-3 が明示的に想定しているドラッグ操作そのもの。
      doc の「precision is lost only in that single oldest span」は、その span が
      cap で消えた全マーカー分に膨らむ点を過小評価している。
    suggestion: >-
      cap が front を pop するとき、その寸法を capped_head_dims 等へ退避し、
      read_segments の head が None のときは「最後に pop されたエントリの寸法」を
      position 0 に使う。最後に pop されたエントリは最古の生存マーカーの直前の span を
      記述しているので、head 隣接 span の帰属が正しくなる。
      代替: overflow 時に front ではなく dim_markers[1]（内部 span）を落とし、
      retained window 先頭を記述するエントリは常に残す。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "round 7 rework へ回送。修正は小さく特定済み"

