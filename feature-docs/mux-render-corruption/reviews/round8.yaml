    title: "FR2 未達: cap eviction 2 件以上で行混線が残る（実測で裁定）"
    description: >-
      SPEC FR2 は「without mixing content from distinct lines」という絶対要件だが、
      dim_markers の cap eviction が 2 件以上の領域で満たされていない。
      216 形状のスイープ（row ペア 6 種 × target 3 種 × eviction 1..12）の結果:
      - 現行が未修正(segments=[])より悪い形状: **0/216**（round 7 の退行は解消）
      - 現行が未修正と同値＝改善ゼロの形状: **86/216**（全て evict>=2）
      - full uncapped attribution は **全 216 形状で 0 混線**
      - 現行 vs round 7 実装（evict>=2, 198 形状）: 現行が良い 27 / round 7 が良い 28 / 同値 143
        → round 8 の変更は混線数では純改善ではなく、確実な利得は
        「round 7 が持っていた『未修正より悪い』ケースの解消」
      **残件の唯一の原因は本 feature が導入した MAX_DIM_MARKERS = 24**。
      cap スイープ（rows 47/48, target 47, marker 26/32/52 の混線数）:
      cap 24 → 3/3/3 / cap 32 → 0/0/3 / cap 48 → 0/0/3 / **cap 62 → 0/0/0**。
      さらに NFR1 ベンチを release 実行した結果、通常切替は 1.57ms（segment-free 8.23ms）で
      MAX_DIM_MARKERS に依存せず（prefix/suffix split の効果）、cap が効くのは storm 経路のみ
      （6 segs 234ms / 24 segs 338ms）。つまり NFR1 はもはや 24 という値を強制していない。
      MT-3（連続ドラッグ = 数十回 resize）はまさにこの破綻域で、本 feature が解こうとしている
      症状そのものが 1〜13 行残る。
    suggestion: >-
      (a) 推奨・実測済み: MAX_DIM_MARKERS を wire 予算いっぱい
      （MAX_SEGMENTS 64 − head 1 − screen 1 = 62）まで引き上げる。cap 62 は全 storm で混線 0。
      付随して MAX_DAEMON_SNAPSHOT_SEGMENTS が 64 になり PRODUCER_SEGMENT_CELL_BUDGET が
      8,000,000/64 = 125,000 cells に下がるので、実運用寸法（例 300x100 = 30,000）に対して
      十分かを確認し、不足なら MAX_CUMULATIVE_SEGMENT_CELLS を producer 側上限から
      逆算して引き上げること。NFR1 は storm 経路のみ悪化（24 segs 338ms → 62 segs で
      500〜600ms 程度の外挿）で、通常切替 1.57ms は不変。
      (b) 超長ドラッグ向けの構造的策: enforce_dim_marker_cap の犠牲者選択を
      「常に最古」から「削っても失うものが最も少ないエントリ」に変える
      （現行が最古を落とすのは retained window で最も大きく検出対象を最も多く抱える区間を
      捨てる最悪の選択で、86/216 形状で改善ゼロなのはこれが原因）。
      (c) (a)(b) を採らないなら SPEC FR2 に許容条件を明記して合意し直すこと。
      現状は SPEC が絶対要件・VERIFICATION が「accepted precision loss」・
      コード doc が「full と一致」と三者バラバラ。
