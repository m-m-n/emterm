    title: "wire-domain clamp が client 側で Tab::resize にしか入っておらず、他の寸法決定経路が素通りする"
    description: >-
      D3''''' の主張は「client と daemon が同じ純関数を同じ入力に適用するので一致する」だが、
      clamp が入ったのは Tab::resize の 1 経路のみ。
      (1) App::set_grid_size は clamp 前の値を self.cell_size に保存したまま tab.resize を呼ぶため、
      Tab::resize が rows を縮めても App 側にフィードバックが無く、App.cell_size と core.rows() が
      食い違う（renderer / hit-testing / window_host::grid_size は App 側の値を使う）。
      (2) Tab::spawn_shell の TerminalCore::new は clamp しない。最初の Tab::resize より前に
      Welcome / PaneCreated が着くと、未 clamp のまま ResizeMsg に載る。daemon 側は必ず
      clamp を通すので、round 7 finding 1d1b6b6297e3b6a0 が閉じたはずの状態が残る。
      (3) Tab::resize は mux 非接続のローカル tab にも共通なので、mux ワイヤ由来の定数が
      mux と無関係な端末のグリッドまで縛る。
      到達性は低いが、round 8 で budget が 1,000,000 → 307,692 と 3.25 倍厳しくなり、
      かつ client 側にも適用されたので round 7 以前より発火しやすくなっている。
      codex:architecture も独立に同じ指摘。
    suggestion: >-
      (a) Tab::spawn_shell の core 生成と ResizeMsg 送出でも clamp を通し、client 側の
      「寸法を決める点」を 1 箇所に揃える（最低限これは必要）。
      (b) Tab::resize が clamp 後の実寸を返し App::set_grid_size がその値で cell_size を更新する。
      (c) clamp を mux 経路だけに寄せて非 mux tab をワイヤ定数から解放する。
