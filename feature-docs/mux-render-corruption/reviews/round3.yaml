      今回の read で取得した dims が前回以前の read 由来バイトにも一括適用される。
    suggestion: >-
      dims.set() を master.resize() の前（scrollback ロック保持区間内）へ移す。
      pending については feed が「その batch を構成する最古の read の dims」を返すよう拡張する。
