      判定して除去 → 残った P + "999;999\a" が完全な偽装 marker になる。
      タイミング依存もレースも無い決定的な経路。
    suggestion: >-
      除去が新たな marker を作りうる以上 1 パスでは閉じない。不動点まで反復するか、
      完全な marker ではなく RESIZE_MARKER_PREFIX の出現そのものを（これも不動点まで）
