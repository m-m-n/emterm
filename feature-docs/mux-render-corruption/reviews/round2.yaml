    title: "MuxPane::resize の scrollback ロック保持は片側の順序しか保証せず、resize 直前に read 済みのバイトが marker の後ろに入る窓が残る"
    description: >-
      ロック保持が閉じるのは「SIGWINCH 後のバイトが marker より前に記録される」方向だけ。
      master.resize() の直前に read し終えた resize 前のバイトが、ロック解放待ちの間に
      marker より後ろへ追記される窓は残る。むしろロックを ioctl に跨いで持つことで
      この順序が確定的に起きやすくなる。その 1 read 分（最大 64 KiB の旧 dims 出力）は
      replay 時に新しい dims で解釈され、まさに本 feature が潰そうとしている
      座標ドリフトを起こす。実装コメントはこの片側性を反映していない。
    suggestion: >-
      reader スレッド側で read 完了時の pane dims を持ち回り、scrollback 追記時に
      記録済み dims と食い違っていたら追記前に marker を書く。踏み込まない場合は
      最低限コメントを片側保証である旨に修正し、残存窓を既知の制約として明記する。
    sources: [claude:comprehensive]
    confidence: 65
