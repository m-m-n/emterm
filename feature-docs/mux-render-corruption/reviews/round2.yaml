    title: "NFR1: リサイズマーカーが ring に蓄積し、切り替えのたびにマーカー数ぶんの全 scrollback reflow が走る"
    description: >-
      rework の coalescing はマーカーが「バイト無しで連続」する場合しか畳めないが、
      実際の SIGWINCH では TUI が各中間サイズで再描画バイトを出すためマーカー間はほぼ常に
      非空になり coalescing が効かない。N 本のマーカーは N 回の全 scrollback reflow になり、
      そのマーカー群が ring に残っている間の毎回の switch / reattach で繰り返し支払われる。
      NFR1 の妥当性を示す計測も上限も diff に無い。
    suggestion: >-
      write_resize_marker 側で、直前のマーカー以降に実バイトがほぼ書かれていない場合は
      既存マーカーを新寸法で置き換える。またはクライアント側でリサイズ送出をデバウンスする。
      最低限、マーカー本数を変えた所要時間の計測を残す。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "round 3 rework へ回送"

