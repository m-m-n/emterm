    title: "偽造 resize マーカーが ScrollbackWriteFilter の pending 溢れ経路で strip を素通りしリングに到達する"
    description: >-
      round 1 の critical 0c18ff55032328ab に対する rework（write-path strip 分離）は
      「replay が見る resize マーカーは必ず daemon 由来」という不変条件を確立したと
      文書化しているが、成立していない。ScrollbackWriteFilter::feed は pending が
      SCROLLBACK_FILTER_PENDING_CAP (512 KiB) を超えると strip を一切通さず
      生バイトをそのまま返し、呼び出し元がそれをリングへ write する。
      子プロセスが未終端 OSC 導入子 → 512 KiB の詰め物 → 末尾に偽造マーカー、
      という順で出力するだけで偽造マーカーがリングに入る。生フラッシュされた
      512 KiB には約 1.7 万個のマーカーを詰め込め、1 バイト挟めば coalescing も
      効かずマーカー数ぶんの全 reflow が切替のたびに走る。
    suggestion: >-
      escape hatch でも strip を通す（完全形のマーカーは 1 パスで除去できる。cap の目的は
      メモリ上限であって CPU 節約ではない）。より堅牢には、pane ごとのランダム nonce を
      マーカー本体に含め、replay 側は現在の pane の nonce と一致するマーカーのみ解釈する。
    sources: [claude:security, codex:security, codex:architecture]
    confidence: 100
    resolution: unresolved
    resolution_reason: "round 3 rework へ回送（round 1 critical の修正が不完全だった）"

