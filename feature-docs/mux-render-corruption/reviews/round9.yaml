headline: >-
  **round 10 の resize_same_width 書き換えは独立検証で等価性が確認された**
  （ランダム 4600 ケースで参照実装と差分ゼロ）。高さのみのドラッグは
  4.5-4.7 秒 → 164ms に解消し、bench の hard assertion も復活した。
  ただし **幅が変わるドラッグ（左右エッジ / 角）は未対応で、実測 2.2〜7.8 秒**。
  安価パスは同一幅限定で、幅変化は原理的に再ラップが要るため同じ手が使えない。
  feature 導入前は同ペイロード 8.7ms だったので、これは本 feature が持ち込んだ退行。
  MT-3 の文言自体が「drag a mux window's edge」で縦方向に限定していない点にも注意。

