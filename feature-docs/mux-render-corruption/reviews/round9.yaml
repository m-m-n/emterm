  - stable_id: 0ed98a8281258910
    severity: medium
    category: comprehensive
    file: src-tauri/src/mux/scrollback_buffer.rs
    line: 1196
    title: "dim_markers_stays_capped_when_window_pruning_and_count_cap_both_fire が enforce_dim_marker_cap を一度も踏まない"
    description: >-
      テストは marker_count = 40 を「well above MAX_DIM_MARKERS」として両機構の
      同時発火を検証すると宣言しているが、MAX_DIM_MARKERS は現在 62 なので 40 は超えない。
      さらに構造上 capacity = (marker_count/2) * chunk_len なので prune が先に効いて
      dim_markers は 21 件で頭打ちになり、cap の while ループは一度も真にならない
      （シミュレーション: cap_evictions = 0 / prune_evictions = 19 / max_len = 21）。
      cap 側の eviction は capped_head_dims を通じて read_segments の head 合成可否を
      左右する（round 7-8 で critical/high が繰り返し出た箇所）ので、
      そこのリグレッションガードが実質失われている。
    suggestion: >-
      二相構成にする。第1相で MAX_DIM_MARKERS + 10 回、各マーカー後に 1 バイトだけ書く
      （count cap が発火）→ 第2相で capacity + 1 バイトを一括で書いてからマーカーを 1 本
      記録する（prune が発火）。あわせて marker_count を定数相対にし、
      dim_markers_cap_eviction_count を観測できる cfg(test) アクセサを足して
      「cap が実際に発火したこと」を前提としてアサートする。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: "次の rework へ回送"

