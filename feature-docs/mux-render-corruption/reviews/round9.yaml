    title: "NFR1 未達: 幅が変わる resize storm の切替が実測 2.2〜7.8 秒（round 10 の安価パスは同一幅限定）"
    description: >-
      レビュアーが自前ハーネスで実測して裁定した。
      【round 10 の主張は再現】リポジトリの bench を release 実行:
      62 segs storm（同一幅）= 164.6ms / 163.7ms、ordinary switch = 1.38ms
      （MuxPane::new の実 spawn 寸法 80x24 に差し替えても 1.76ms）。
      hard assertion も復活済み。同一幅に限れば NFR1 は満たされる。
      【未測定だった幅可変形状】同じ 0.95MiB / 62 segs で cols も交互に変えるだけ:
      |形状|0.95MiB|2MiB（daemon の DEFAULT_SCROLLBACK_CAPACITY）|
      |同一幅|163ms|353ms|
      |幅+高さ可変|**6.20s**|**7.44s**|
      MT-3 に最も近い形（2MiB 履歴の pane 末尾でドラッグ、1 ステップ小さな redraw）:
      |ドラッグ|16 steps|32 steps|62 steps|
      |高さのみ|345ms|346ms|341ms|
      |横/角（cols も変化）|**2.16s**|**4.09s**|**7.76s**|
      feature 導入前（base a8d4bed）は ReplaySegment 自体が無く replay は単一寸法の 1 パスで
      同ペイロード 8.7ms だったので、これは本 feature が持ち込んだ退行。
      round 9 が NFR1 未達と判定した同一幅 4.5-4.7 秒より悪い。
      【scope 制限が spec と整合しない理由】
      (1) SPEC FR3 が「including a scenario where the scrollback contains lines produced at
      different terminal widths」と幅可変を明示的にスコープに入れている。テスト側は
      differing_dimensions_recording_matches_live_feed_fingerprint（cols 100↔40）で
      これを満たしているのに、NFR1 の測定だけがその形状を外している。
      (2) MT-3 の本文は「drag a mux window's edge to resize it repeatedly」で縦方向に
      限定していない。VERIFICATION.md が MT-3 を「a vertical/height drag」と読み替えているのは
      自身の手動テスト文言の狭め。
      MAX_DIM_MARKERS を 62 に上げた round 9 の判断がこの形状のコストを直接増幅している。
    suggestion: >-
      (a) 幅変化を含む resize でも安価にする（保持 scrollback の再ラップを次回参照時まで
      遅延させる / 論理行キャッシュを持つ）。同一幅パスの「行数デルタ境界だけ触る」原理は
      cols 変化には使えないので別設計が要る。
      (b) replay 側で段数を束ねる（同一 cols が連続する区間を 1 回の reflow にまとめる、
      または prefix/suffix split を「最後の cols 変化以降」に一般化して、それ以前の
      幅変化区間は 1 回の full reflow に畳む）。
      (c) daemon 側で cols が変わるマーカーだけ別枠に制限し、幅可変 storm の段数を
      4-8 程度に絞る。FR2 の混線とのトレードオフを実測して決める。
      (d) どれも採らないなら SPEC NFR1 に「幅が変わる連続 resize 直後の切替は最大数秒
      かかりうる」ことを明記してユーザーと再合意し、bench に幅可変アームを informational で
