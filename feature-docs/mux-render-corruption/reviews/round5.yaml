  - stable_id: 986a3881b2b97a16
    severity: high
    category: spec
    file: src-tauri/src/mux/scrollback_buffer.rs
    line: 106
    title: "FR2: MAX_DIM_MARKERS=16 の併合が offset を連鎖的に 0 まで引き戻し、保持ウィンドウ全体に座標ドリフトを再導入する"
    description: >-
      enforce_dim_marker_cap は overflow するたびに最古エントリを pop し、その後継の
      offset を捨てたエントリの offset まで引き戻す。これが繰り返されるため offset が
      連鎖し、N > 16 回の resize 後には最古の生存エントリの offset が最初のエントリ
      （offset 0 = MuxPane::new の初期マーカー）まで引きずられる一方、その dims は
      resize ステップ N-15 のものになる。結果、offset 0 からそのステップまでの全バイトが
      単一の中間ドラッグサイズで replay される — ドラッグの場合それはドラッグ前の
      scrollback 全体（最大 2 MiB の保持ウィンドウ）＋最初の N-16 回分の再描画。
      これは SPEC が閉じる対象として名指ししている PROBE D の座標ドリフト機構そのもの。
      MAX_DIM_MARKERS の doc は「精度が失われるのは最古の 1 span だけ」と正当化するが、
      span の *数* としては正しくても *バイト量* としては正しくない。
      閾値 16 は現実的な操作で超える: VERIFICATION.md の MT-3 自身が
      「dozens of grid-size changes」と書いており、テストも 40 / 50 ステップを模している。
      cap 併合 *後* の replay 忠実性を検証するテストは存在しない。
      なお replay コストは 16 → 239ms、24 → 295ms だが 30 → 2.08s なので、
      単純に cap を上げて 40 ステップのドラッグを覆う選択肢は無い。
    suggestion: >-
      (a) 併合を count-aware でなく content-aware にする（バイト長が最小の隣接 span 対、
      または寸法が最も近い対を併合する）。(b) head を落とすとき、その span が後継より
      大きければ *落とすエントリの* 寸法を併合 span に残す。(c) cap を最大 ~24 に上げる
      （295ms、2.08s の崖の手前）— 部分的緩和。いずれの場合も、>MAX_DIM_MARKERS 回の
      resize を実際の再描画バイト込みで流し、read_segments → build_snapshot_bytes →
      reset_and_replay_segments を通して cross-line mixing ゼロを assert する
      回帰テストを追加すること。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "round 6 rework へ回送。round 5 の NFR1 対策が FR2 を壊した"

  - stable_id: abb36fa1ad4c89ea
    severity: high
    category: spec
    file: crates/term_core/src/terminal_core.rs
    line: 1027
    title: "NFR1: bypass 降格が通常のウィンドウ切替を約 25 倍遅くし、追加された bench はそれを測れない"
    description: >-
      integration worktree での実測（release、term_core、0.95 MiB payload、100x30、
      scrollback 10000、build_from_snapshot）:
      0 segments = 7.1ms / 1 segment（dims が target と一致）= 7.1ms /
      1 segment（dims が異なる）= 219.7ms / 2 segments 80x24→100x30 = 166.5ms /
      16 segments（daemon cap）= 239.2ms / bypass off = 137.1ms。
      コストを支配しているのは segment 数ではなく D5'' の bypass 降格
      （4 → 16 segments は 215 → 239ms しか動かないが、1-equal → 1-differing で
      7 → 220ms）。しかもこれは resize storm ではなく **通常の切替**で発火する:
      MuxPane::new が daemon のハードコード 80x24 spawn サイズを head マーカーとして
      記録し、GUI の最初の Resize が 2 本目を記録する。prune_dim_markers が head を
      落とすのはリングが 2 本目を超えて evict した後（約 2 MiB の出力後）なので、
      それまで全 snapshot が GUI グリッドと異なる head セグメントを積む。
      変更前は 1st pass が約 7ms で swap し、約 137ms の非 bypass 再構築は
      背景の 2nd pass で走っていた。今はそのコストが swap の *前* に来て
      2nd pass はスキップされるため、ユーザーは切替画面が出るまで約 170-220ms 待つ。
      唯一の NFR1 自動証跡である bench.rs の
      segment_bounded_replay_bench_950kib_stays_bounded_at_the_daemon_cap は
      #[ignore] 付きで通常スイートに乗らず、比較する 2 アーム（4 と 16 segments）が
      どちらも既に降格コストを払っているため ratio 1.09 を測っているだけで、
      1 秒の上限に近づくことすらない。
    suggestion: >-
      実際に動いた軸を測る bench アームを足す（0-segment / head-dims-equal-target と
      1 つの differing segment の比較）。そのうえで NFR1 を明示的に判定する:
      (a) 約 200ms を受容して MT-2/MT-3 で実測値込みのサインオフを得る（VERIFICATION.md に
      数値を記録して bench でなく計測で判定する）、または (b) 降格の影響範囲を狭める
      — 例えば「唯一の寸法差が head セグメントで、それが reset 直後の空コアに適用され、
      暗黙の最終 restore-to-target が no-op になる」という極めて一般的な形
      （[(0, 80x24)] → target 80x24）では降格しない。
      bench を検証フローで実行可能にする（#[ignore] を外すか VERIFICATION.md に
      --include-ignored を書く）。
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: "round 6 rework へ回送。round 5 の D5'' 対応が NFR1 を悪化させた"

