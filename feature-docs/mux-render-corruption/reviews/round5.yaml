  - stable_id: 58db33c799bedf87
    severity: medium
    category: comprehensive
    file: crates/term_core/src/terminal_core.rs
    line: 846
    title: "replay_segments が wire 由来 segment の offset を検証せず、payload を無言で捨てる"
    description: >-
      round 5 の D1'' は「decoded segment は untrusted」という理由で cols/rows に
      clamp_resize_dims を適用したが、同じ経路の offset には一切の検証がない。
      segments[0].offset > 0 の frame では bytes[0..offset] が一度も replay に渡らず
      無言で消える（clear prefix + scrollback 先頭が丸ごと欠落）。offset が非昇順だと
      end < start で区間が丸ごと捨てられる。MAX_SEGMENTS は個数だけを縛る。
      .min(bytes.len()) があるので panic はせず、必ず「静かに内容が消える」形で現れる。
      producer 側は先頭を 0 に強制し debug_assert も置いているが release では効かず、
      消費側は dims をクランプしたばかりなのに offset だけ非対称に無防備。
    suggestion: >-
      decode_snapshot_payload_typed の upfront validation に offset 条件を追加し、
      先頭が 0 でない / 非単調 / content 長超過の table を Malformed として弾く
      （round 5 の「壊れた envelope は content として扱わない」方針と一貫する）。
      あるいは replay_segments 側で先頭バイトを捨てないよう補正する。
    sources: [claude:comprehensive, codex:architecture]
    confidence: 95
    resolution: unresolved
    resolution_reason: "round 6 rework へ回送"

  - stable_id: fd379025e1900e9f
    severity: medium
    category: comprehensive
    file: src-tauri/src/mux/ipc/pty_spawn.rs
    line: 380
    title: "pending_started_dims が新しい pending run に更新されず、2 回目以降の持ち越しで古い dims に誤帰属する"
    description: >-
      D7'' の修正は pending が空になったときだけ pending_started_dims を None に戻す。
      partial drain（boundary > 0 かつ drain 後も pending が残る）の場合、残ったバイトは
      必ず今回の chunk 由来なのに pending_started_dims は古い run の dims のまま。
      read1@A → read2@B（partial drain、B 由来の tail が残る）→ read3@C の flush が
      B と C の内容を A に帰属させる。round 4 finding が塞ごうとした誤帰属そのもので、
      修正前（常に current_dims）より遠い dims を選ぶ分だけ悪化しうる。
      連続する read が続けて未終端シーケンスで終わり、その間に resize が入ると発生する。
    suggestion: "partial drain で持ち越しがあった場合は pending_started_dims を current_dims に更新する"
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: "round 6 rework へ回送"

  - stable_id: bfebad60b3862d3e
    severity: medium
    category: security
    file: crates/mux_ipc/src/protocol.rs
    line: 156
    title: "The segment-count limit remains large enough for replay DoS"
    description: >-
      デコーダは 4096 セグメントを受け入れるが、daemon の producer は 16 で上限を
      かけている。非空セグメントごとにフルリフローが走るため、0.95 MiB snapshot で
      80 セグメントが約 5.35 秒という自前の実測に照らすと、数千の交互寸法セグメントを
      持つコンパクトな有効フレームで replay ワーカーを長時間占有できる。
      off-thread に回しても攻撃者制御の CPU 仕事量は bound されない。
    suggestion: >-
      producer の正当な上限（MAX_DIM_MARKERS）と揃えた共有定数で、それを超える
      structured payload を拒否する。各リフロー前に cancellation もチェックする
      （ただし cancellation を主たる仕事量 bound にしない）。
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
    resolution_reason: "round 6 rework へ回送"

