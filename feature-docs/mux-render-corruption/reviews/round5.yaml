headline: >-
  rounds 1-3 の marker 偽装クラスは round 4 以降も再現していない（本ラウンドでも
  codex:security が構造面での再発なしを確認）。codex:performance は findings ゼロ。
  一方で **round 5 自身の 2 つの修正が FR2 / NFR1 の退行を新たに作った**:
  MAX_DIM_MARKERS の併合が offset を連鎖的に 0 まで引き戻して保持ウィンドウ全体を
  単一の中間寸法で replay させ（PROBE D ドリフトの再導入）、bypass 降格が
  通常のウィンドウ切替を 7ms → 170-220ms に悪化させている。
  どちらも「replay が寸法変更ごとに全 scrollback を content-preserving reflow する」
  という 1 点の帰結で、round 4 finding 6c650908ea8e95e9 の suggestion (a)
  （中間セグメントの resize で scrollback を再ラップしない）を採れば同時に解ける。

findings:
  - stable_id: 1227fc04fb9368d0
    severity: high
    category: security
    file: crates/term_core/src/terminal_core.rs
    line: 1673
    title: "Dimension clamp still permits memory-exhaustion snapshots"
    description: >-
      wire 由来の segment 寸法は 4096x4096 に clamp されたうえで
      TerminalCore::resize に渡る。reflow は rows * cols の 32 バイトセルを
      フラットに確保するため、1 セグメントで新グリッドだけで 512 MiB を要求でき、
      旧グリッドと中間 reflow データも生きたまま残る。悪意ある IPC ピアからの
      1 つの妥当な snapshot で GUI をメモリ枯渇させられる。
    suggestion: >-
      replay 前に checked な総セル数 / バイト予算を検証し、超過する snapshot 全体を
      拒否する。現実的な寸法上限をもっと低くし、fallible allocation を使う。
      敵対的な値を「別の危険なサイズ」に clamp するだけにしない。
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
    resolution_reason: "round 6 rework へ回送"

