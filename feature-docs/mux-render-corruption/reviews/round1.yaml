  - stable_id: 81947e02402b5ace
    severity: high
    category: architecture
    file: src-tauri/src/mux/scrollback_buffer.rs
    line: 54
    title: "The byte ring cannot preserve the resize protocol's required state"
    description: >-
      ScrollbackRingBuffer は 2 MiB 固定の生バイトリングで、満杯後はシーケンス境界を
      無視して最古バイトを上書きする。MuxPane::new の初期マーカーは pane が 2 MiB 出力した
      時点で evict され、「最も古い retained セグメントの前には必ずマーカーがある」という
      不変条件が崩れる。長寿命 pane（= 報告された症状が出る母集団）では常にこの状態で、
      retained 範囲内に resize が無ければ先頭セグメントは修正前と同じ座標 drift を起こす。
      副次的に、切断点がマーカー途中に落ちると残骸が可視テキストとして replay されうる。
    suggestion: >-
      scrollback を record-aware にし、最古 retained バイト時点で有効な寸法を保持する。
      あるいは snapshot 組み立て（build_snapshot_bytes / build_resume_snapshot_bytes）の
      先頭へその寸法のマーカーを必ず prepend する。リングを一周させたうえで resize を跨ぐ
      recording の回帰テストも追加する。
    sources: [codex:architecture, claude:comprehensive, claude:spec]
    confidence: 100
    resolution: unresolved
    resolution_reason: "rework へ回送"

