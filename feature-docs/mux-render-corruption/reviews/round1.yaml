  - stable_id: 0c18ff55032328ab
    severity: critical
    category: security
    file: crates/term_core/src/terminal_core.rs
    line: 695
    title: "子プロセスが偽装できる in-band resize マーカーを replay が無検証で信頼し、無制限な次元でプロセスを abort させられる"
    description: >-
      resize マーカー `ESC]777;emterm;resize;<cols>;<rows>BEL` は daemon が書くものと
      子プロセスが printf で出すものが完全に同一。ScrollbackWriteFilter が剥がすのは
      viewer 系 kind のみで resize は意図的に KEEP されるため、子プロセス由来のマーカーが
      scrollback に残り snapshot 経由で replay に届く。replay 側は上限を持たず u16 全域を
      TerminalCore::resize に渡すので、65535x65535 を出力してからウィンドウ切替すると
      数十 GB の確保要求で allocator abort によりターミナルプロセスが即死する。
      hostile なファイルの cat / リモートログの tail から一行で到達可能。
    suggestion: >-
      (a) 出所の分離: ScrollbackWriteFilter::feed が呼ぶ strip 関数を snapshot 時の
      strip_replayable_rich_content と分け、書き込みフィルタ側だけ resize kind も除去する。
      daemon 自身のマーカーは MuxPane::new / MuxPane::resize からフィルタを通さず
      リングへ直接書かれるので、この分離だけで「replay が信じるマーカー = daemon が書いたもの」
      という不変条件が成立する。(b) デコーダ側の防御的上限（loop 1 で適用済み）。
    sources: [claude:security, codex:security, claude:comprehensive, codex:spec]
    confidence: 100
    resolution: unresolved
    resolution_reason: "多層防御の (b) のみ loop 1 で適用。本丸の (a) 書き込み経路 strip 分離は複数ファイルにまたがるため rework へ回送"

