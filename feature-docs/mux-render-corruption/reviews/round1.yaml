    file: crates/term_core/src/terminal_core.rs
    line: 809
    title: "bypass 中の mid-drain resize は evicted_total の過少報告に留まらず、2nd-pass merge の行重複を招く"
    description: >-
      resize → resize_reflow → repopulate_ring_from_lines は bypass 非対応なので、
      行数が縮む向きのマーカーでは scrollback_slim に行が積まれ、disable_snapshot_bypass は
      それを消さない。2nd-pass の merge_scrollback_from はこの残留行を「swap 後のライブ
      drain 分」とみなすため、行の重複・順序崩れ・再構築行のドロップを招きうる。
      evicted_total は drain_marks 経由で apply_replay_reconcile の evicted_baseline に
      なり、プロンプト/フォールドマークと選択の絶対行マッピングの基準になるため、
      「会計値が少しずれるだけ」より影響範囲は広い。
    suggestion: >-
      resize_reflow を bypass 対応にする、または bypass 中の mid-drain resize 後に
      scrollback_slim を drain して不変条件を復元する。少なくとも resize_reflow 入口に
      debug_assert! を置き、bypass 中の内容変更経路が増えたときテストで落ちるようにする。
      64 KiB 超 + 行数が縮むマーカー + merge_scrollback_from を通した結合テストも追加する。
    sources: [claude:comprehensive, claude:architecture, codex:architecture]
    confidence: 100
    resolution: unresolved
    resolution_reason: "rework へ回送"

