    resolution_note: "gate: create-spec.requirement-clarification; batch-policies.yaml action=codex_consultation, record_as_assumption=true. Codex (litellm/vertex-glm-5.2, fallback entry 2) answered NO_NEW_TEST: the removed arm is unreachable so no runtime test distinguishes before/after, the LiveQueueOutcome exhaustiveness check is the real net, and the surrounding replay tests are documented as parallel-nondeterministic. The Opus escalation independently reached no_new_test and additionally verified that both proposed tests already exist verbatim in src-tauri/src/tabs/tests/replay.rs (ts3_live_output_queued_during_pending_switch:234, offthread_live_queue_cap_falls_back_to_sync:258). Options not chosen: add_overflow_path_test, add_queue_ordering_test - both would duplicate existing coverage."
