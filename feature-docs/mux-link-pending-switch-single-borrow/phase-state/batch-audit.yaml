    timeout. fallback_provider_answered: yes (litellm/muse-spark Standard tier), which agreed: the harness
    SSOT ban dominates over the protocol''s consent-based carve-out, because the SSOT''s line is drawn
    on ''is this payload donated for training'', not on repository visibility, and a working diff can
    carry unpushed content not covered by the public/MIT status. opus_escalation: not run. Minimum-side-effect
    option: (2), since it sends strictly less data into a training pipeline.'
