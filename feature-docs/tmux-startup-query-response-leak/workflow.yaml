tasks:
  task0001:
    title: Root-cause and fix the tmux-startup device-query response leak
    plan: tasks/task0001.md
    files:
      - crates/term_core/src/csi_device.rs
      - crates/term_core/src/terminal_core.rs
      - crates/term_core/src/snapshot.rs
      - src-tauri/src/tabs.rs
      - src-tauri/src/mux/scrollback_filter.rs
      - src-tauri/src/mux/session/pane.rs
      - src-tauri/src/mux/ipc/pty_spawn.rs
      - src-tauri/src/mux/snapshot_bytes.rs
    skills: [backend-impl]
    domains: [input-handling, concurrency, external-io]
    complexity: high
    requirements: [FR1, FR2, FR3, FR4, FR5, FR6, NFR1, NFR2, NFR3, NFR4]
    status: merged
    notes: >
      Merged at aa58eef14feaf230af9430a528be0dfeff323659, 0 conflict retries,
      tests pass. Deviation: also touched src-tauri/src/callbacks.rs (not in
      the planner's predicted files) — that file holds the other half of the
      duplicate-delivery mechanism.
    branch: em-workflow/tmux-startup-query-response-leak/task0001

  task0002:
    title: Ordered multi-response drain — deliver every device-query response in a multi-query chunk exactly once
    plan: tasks/task0002.md
    files:
      - crates/term_core/src/csi_device.rs
      - crates/term_core/src/terminal_core.rs
      - crates/term_core/src/csi_dispatch.rs
      - crates/term_core/src/callbacks.rs
      - crates/term_core/src/snapshot.rs
      - src-tauri/src/callbacks.rs
      - src-tauri/src/tabs.rs
    skills: [backend-impl]
    domains: [input-handling, api-contract, external-io, concurrency]
    complexity: high
    requirements: [FR2, FR3, FR4, FR5]
    status: merged
    notes: >
      Merged at f78ef408d79575ab31d05f25b82d055bcd3d30f3, 0 conflict retries,
      tests pass. Replaced term_core's single-slot response_buffer/response_len
      with an ordered append-only response_queue that take_response() drains
      wholesale, and removed TerminalCallbacks::on_device_response /
      fire_device_response_callback entirely (D5 option a). Deviations: also
      touched crates/term_core/src/apc_handler.rs (9 mechanical assertion
      updates for the renamed field) and crates/term_core/src/esc_handler.rs
      (removed a now-invalid test-double impl) — both forced by the trait and
      field changes this task makes.
    branch: em-workflow/tmux-startup-query-response-leak/task0002
    provenance:
      source: review
      review_round: 1
      source_ids: [9ef6b54302b083b3, c6092a0fdcb3b4a5, 49bc2b33fa3b053c, 1133c5337fb5458c, b3b78df745f37e0d, fc006b4380d032ae]
  task0003:
    title: Discard replay-generated device responses in the off-thread core-swap path
    plan: tasks/task0003.md
    files:
      - src-tauri/src/tabs.rs
    skills: [backend-impl]
    domains: [concurrency, external-io]
    complexity: high
    requirements: [FR1, FR2, FR3]
    status: merged
    notes: >
      Merged at 8b9abcd5cf1a3a38554dcb8623b0ff22d3ea94f7, 0 conflict retries,
      tests pass. Implementer reports finding 8bebc1e532a1b597 is a false
      positive against the current codebase: term_core's
      build_from_snapshot_inner already drains the response buffer before
      returning SnapshotReplay (commit 4380805c, 2026-06-24), which covered
      BOTH the synchronous and off-thread paths. The swap-site discard was
      implemented anyway per the task plan / IMPLEMENTATION.md D5 as
      defense-in-depth, asserting the invariant explicitly at the tabs.rs
      call site instead of depending on term_core internals — relevant given
      task0002's concurrent take_response rework. AC-1 could not be
      red-confirmed for this reason.
    branch: em-workflow/tmux-startup-query-response-leak/task0003
    provenance:
      source: review
      review_round: 1
      source_ids: [8bebc1e532a1b597]

