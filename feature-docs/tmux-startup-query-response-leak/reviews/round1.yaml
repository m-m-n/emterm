    title: >
      複数デバイスクエリが1チャンクに来ると最後の1件以外の応答が完全に消える
      （本修正による退行）
    description: >
      term_core の応答バッファは単一スロットで、write_response
      (crates/term_core/src/csi_device.rs:177-182) は追記ではなく上書き。
      process_pty_data_fully はチャンク全体を回し切るだけで途中で応答を吸い
      出さないため、1回の parse に複数クエリが含まれると take_response() は
      最後の1件しか返さない。修正前はコールバック経路
      (fire_device_response_callback -> NativeCallbackState::device_responses
      -> process_combined の drain) が応答ごとに1件ずつ積んで全件を配送して
      いたため、本修正は「全件配送 + 最後の1件だけ二重配送」を「最後の1件
      だけ配送、それ以外は無配送」に置き換えている。Tab::pump は 12ms /
      1MiB まで PTY チャンクを coalesce するので、tmux 起動時のクエリ
      バーストというまさに本タスクの対象シナリオで確定的に発生する。
      追加された回帰テストは全ケースが 1 タブ 1 クエリのためこの経路を
      カバーしていない。
    suggestion: >
      (a) 推奨: term_core 側の応答保持を単一スロットからキュー/追記バッファ
      に変える。write_response を追記にし、take_response() が保留中の全応答を
      発生順に返す。(b) 代替: コールバック経路を「収集」として残し、3つの
      write-back サイトが take_response() の代わりにそのキューを drain して
      write_device_response で配送する。いずれの場合も「1回の
      process_combined に複数クエリのバーストを渡し、各応答がちょうど1回ずつ
      outbound に現れる」回帰テストを追加すること。
    sources: [claude:comprehensive]
    confidence: 80
    resolution: unresolved
    resolution_reason: >
      R4 でこのサイトは conflict 分類（同一 same_site に 3 件、prose 処方が
