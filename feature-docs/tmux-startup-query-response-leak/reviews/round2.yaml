    description: >
      Vertex spec reviewer claimed the D5 discard in apply_offthread_swap runs
      AFTER the worker-built core is installed (`*live = new_core;` then
      `let _ = live.take_response();`), so a leak could occur "if any code path
      accesses the response between the assignment and the discard".
    suggestion: >
      Move the discard before installing the worker-built core:
      `let _ = new_core.take_response(); *live = new_core;`.
    sources: [vertex:spec]
    confidence: 50
    resolution: declined
    resolution_reason: >
      Verified false positive by the orchestrator against tabs.rs:1241-1277.
      Both statements execute inside a single block that holds one
      `MutexGuard` (`let mut live = self.core.lock();`) continuously from
      before the assignment until after the discard and the pending-resize
      apply. No other thread or code path can observe the intermediate state
      the finding requires. The reporting reviewer itself flagged the premise
