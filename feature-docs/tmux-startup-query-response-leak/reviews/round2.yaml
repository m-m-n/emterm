  - stable_id: 7b3e5c81a90d4f2e
    severity: medium
    category: security
    file: crates/term_core/src/csi_device.rs
    line: 178
    line_end: 180
    title: >
      Unbounded device-response store allows amplification from untrusted
      terminal output, pressuring shell stdin and dropping key input
    description: >
      task0002 replaced the fixed `response_buffer: [u8; 64]` (single slot,
      max 64 bytes per parse) with an unbounded `response_queue: Vec<u8>`;
      `write_response` appends with no cap. The bytes are driven by PTY output,
      i.e. untrusted attacker-controllable data under the standard terminal
      threat model (cat of a malicious file, curl output, output from a
      compromised SSH host). DA1 amplifies 3 bytes of query into 13 bytes of
      reply (~4.3x). With `COALESCE_CAP = 1 MiB` per `process_pty_data_fully`,
      one frame can yield ~4.5 MiB returned as a single `Vec<u8>` from
      `take_response()` and handed to `Tab::write` -> `PtyHandle::write`;
      the mux path adds another ~1.33x via APC/base64. The PTY input channel
      is `bounded::<Vec<u8>>(256)` — bounded by message COUNT, not bytes — and
      `writer_loop` uses a blocking `write_all`, so real keystrokes arriving
      while the writer is blocked are silently dropped via failed `try_send`.
      No arbitrary bytes or newlines reach the shell, so this is availability
      only, not command injection. No production parse site currently skips
      the drain, so accumulation is bounded to one parse.
    suggestion: >
      Add a pending-byte cap in `write_response` and drop the excess rather
      than amplifying it, e.g.
      `const MAX_PENDING_RESPONSE_BYTES: usize = 4096;` and return 0 when
      `self.response_queue.len() + data.len()` would exceed it. Legitimate
      traffic is a handful of replies per chunk (~70 bytes for the 7-response
      AC-1 case), so the ordering guarantee is unaffected. A one-shot
      `log::warn!` on hitting the cap aids investigation.
    sources: [claude:security]
    confidence: 75
    resolution: unresolved
    resolution_reason: >
      Medium severity — outside the auto-fix candidate gate (critical/high
      only). Not blocking review completion.

  - stable_id: 2f8d61b4c07a9e53
    severity: medium
    category: performance
    file: crates/term_core/src/csi_device.rs
    line: 177
    line_end: 180
    title: >
      Removing the response_queue cap lets the PTY input queue grow to
      hundreds of MB under sustained device-query floods
    description: >
      Same root cause as the security finding at this site, scored from the
      resource-consumption angle. The pending store went from a fixed 64-byte
      bound to O(parse chunk size). The plain-tab path
      (`Tab::pump` -> `process_combined` -> `process_outer_via_core`) does not
      gate on `payload_has_device_query`, so it feeds up to 1 MiB + 16 KiB per
      call regardless of content, producing ~4.5 MB `Vec` allocations
      (including doubling reallocation and memcpy). Because `input_tx` is
      bounded by message count (256) and `writer_loop` blocks on `write_all`,
      up to ~1.1 GB can accumulate before `try_send` starts failing, versus a
      16 KB ceiling before this change. Trigger requires a producer that emits
      device queries without reading stdin; normal loads (tmux startup,
      PSReadLine CPR) stay in the KB range.
    suggestion: >
      Restore a byte cap on the pending store — preferred: a soft limit in
      `write_response` (e.g. 64 KiB), which preserves task0002's multi-query
      ordering property for realistic bursts. Alternative: bound
      `PtySession::input_tx` by bytes instead of message count, which touches
      the whole PTY backpressure design. Either way, update the
      `response_queue` doc in `terminal_core.rs`, which currently justifies
      the bound by deferring to the embedder's coalesce cap.
    sources: [claude:performance]
    confidence: 75
    resolution: unresolved
    resolution_reason: >
      Medium severity — outside the auto-fix candidate gate. Same underlying
      fix as the security finding at this site.

  - stable_id: 9c4a2e6d13b785f0
    severity: medium
    category: spec
    file: crates/term_core/src/terminal_core.rs
    line: 1706
    title: >
      RIS mid-chunk silently drops already-synthesized device responses
      (FR2 exactly-once becomes zero times)
    description: >
      `TerminalCore::reset()` — the sole RIS (`ESC c`) implementation path via
      `esc_handler.rs esc_full_reset()` — calls `self.response_queue.clear()`.
      Since task0002, synthesized replies are only handed to the PTY by the
      post-parse `take_response()` poll, so a chunk containing `ESC [ c`
      (or `ESC [ 5n` / `ESC [ 18t` / `ESC [ ?2026$p`) followed by `ESC c`
      loses the earlier reply entirely — delivered zero times, violating
      SPEC FR2 "delivered exactly once". Before task0001/task0002 the plain-tab
      path fired `on_device_response` at dispatch time, stashing a copy in
      `NativeCallbackState::device_responses` ahead of the RIS, so the reply
      survived. Real terminals (xterm et al.) write the reply to the pty at
      dispatch time and do not retract it on RIS. The mux path is unaffected.
      Also touches NFR3 (non-tmux sessions behave exactly as before).
    suggestion: >
      Drop the `self.response_queue.clear();` line from `reset()` to match
      real-terminal semantics. Replay/snapshot discard does not depend on this
      side effect — it is already explicit at
      `tabs.rs::reset_frame_for_replay` (`let _ = c.take_response();`),
      `TerminalCore::build_from_snapshot_inner`, and
      `tabs.rs::apply_offthread_swap`. Add regression tests: in `csi_device.rs`
      assert `process_pty_data_fully(b"\x1b[c\x1bc")` still yields the DA1
      reply from `take_response()`, and in `tabs.rs` assert
      `process_combined(b"\x1b[c\x1bc")` puts the DA1 reply in
      `test_outbound_writes()` exactly once.
    sources: [claude:spec]
    confidence: 60
    resolution: unresolved
    resolution_reason: >
      Medium severity — outside the auto-fix candidate gate (critical/high
      only) and category spec is excluded from auto-fix by protocol. The RIS
      clear site was confirmed present at terminal_core.rs:1706. Carried to
