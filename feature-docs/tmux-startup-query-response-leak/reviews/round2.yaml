  - stable_id: 6e1b83f2a5c04d97
    severity: medium
    category: architecture
    file: src-tauri/src/tabs.rs
    line: 830
    line_end: 831
    title: >
      resume_native_pty parses without a paired take_response — the one site
      not satisfying the sole-delivery-route contract
    description: >
      task0002's `take_response` doc declares the contract that the embedder's
      write-back sites drain after every parse, making it the sole PTY
      delivery route. Of the production parse sites, `process_outer_via_core`,
      `apply_active_pane_output` and `apply_queued_live_output` drain and
      deliver; `reset_frame_for_replay` and `apply_offthread_swap` drain and
      discard. `Tab::resume_native_pty`'s `c.process_pty_data_fully(&drained)`
      is the only one that neither delivers nor discards, so replies generated
      from ring-buffer device queries linger in `response_queue` and are
      delivered late by an unrelated later live parse — precisely the
      out-of-context delivery this feature removed. The function is currently
      `#[allow(dead_code)]` with zero callers, so there is no live defect, but
      its doc states it is retained for a future "freeze native output while
      mux renders" use, where re-enabling would silently break the invariant.
    suggestion: >
      Pair the parse with a drain: either (a) deliver, mirroring
      `apply_active_pane_output` (`let device_response = c.take_response();
      drop(c); if !device_response.is_empty() {
      self.write_device_response(device_response); }`), or (b) discard with a
      rationale comment, mirroring `reset_frame_for_replay` /
      `apply_offthread_swap` (`let _ = c.take_response();`). Consider also
      enforcing the contract in term_core itself rather than in doc prose —
      e.g. a cap on `response_queue` with a `log::warn!` on overflow, or a
      debug assertion that catches a missed drain.
    sources: [claude:architecture]
    confidence: 60
    resolution: unresolved
    resolution_reason: >
      Medium severity — outside the auto-fix candidate gate. Dead code today
      (`#[allow(dead_code)]`, zero callers), so no live defect.

  - stable_id: 5d09a7c4e2b16f38
    severity: medium
    category: architecture
    file: crates/term_core/src/csi_device.rs
    line: 38
    line_end: 50
    title: >
      get_response_len / get_response_bytes kept their signatures while their
      meaning changed, leaving pub non-draining read paths with no production
      callers
    description: >
      task0002 changed `get_response_len` from "length of the most recent
      reply" to "total bytes since the last drain" and `get_response_bytes`
      from "the most recent reply" to "all replies concatenated since the last
      drain", but both stayed `pub` with identical signatures (`u32` /
      `Vec<u8>`), so code written against the old semantics compiles fine and
      silently receives different data — which actually happened in-tree for
      `test_xtwinops_cell_size_after_buffer_switch_defaults`. `get_response_ptr`
      was deleted in the same change for having no production callers plus raw
      pointer risk; grep shows these two likewise have zero production callers
      (only tests, in both crates). The result is that the documented
      "take_response is the single delivery channel" invariant is enforced by
      prose alone while two pub non-destructive readers of the same bytes stay
      exposed — the same shape as the exactly-once violation that needed two
      rework rounds in round 1.
    suggestion: >
      term_core is a workspace-internal crate with no external consumers, so
      narrow both to `pub(crate)` (or `#[cfg(test)]` to match actual usage) and
      let visibility enforce "only take_response's return value reaches the
      PTY". If visibility cannot be reduced, at minimum add
      `#[doc(hidden)]` + `#[deprecated(note = "use take_response; this peek
      does not drain")]` so old-semantics callers surface at build time.
    sources: [claude:architecture]
    confidence: 60
    resolution: unresolved
    resolution_reason: >
      Medium severity — outside the auto-fix candidate gate. API-hygiene
      hardening, no live defect.

  - stable_id: 8a37f0d5c9e2b641
    severity: medium
    category: comprehensive
    file: src-tauri/src/tabs.rs
    line: 514
    title: >
      outbound_write_log does not distinguish delivery route, so the mux tests
      do not actually verify PtyInput-frame delivery
    description: >
      task0001's `outbound_write_log: Mutex<Vec<Vec<u8>>>` records only payload
      bytes, with no marker for whether an entry came from `Tab::write` (raw
      PTY write) or `Tab::send_control` (mux `PtyInput` frame) — `send_control`
      pushes `msg.payload` pre-encoding and `write` pushes raw bytes, so for
      device responses the two are byte-identical in the log. Consequently the
      doc comments on
      `mux_pane_every_response_type_delivered_exactly_once_and_absent_from_grid`
      (tabs.rs:6662) and
      `mux_pane_multi_query_chunk_delivers_all_responses_in_order_exactly_once`
      (tabs.rs:6691) claim delivery "as a PtyInput frame via send_control, not
      a raw write", but the assertion only counts occurrences. If
      `write_device_response`'s mux branch regressed into a single raw
      `Tab::write` — the exact leak class this feature fixed — the count stays
      1 and the tests stay green. The "exactly once" half of the invariant is
      guarded; the "via mux routing" half is not. No live defect; this is a
      regression-detection coverage gap.
    suggestion: >
      Make `outbound_write_log` route-aware: define
      `enum OutboundRoute { Raw, Control(MessageType) }` under `#[cfg(test)]`
      and change the field to `Mutex<Vec<(OutboundRoute, Vec<u8>)>>`, pushing
      `(Raw, bytes.clone())` from `Tab::write` and
      `(Control(msg.msg_type), msg.payload.clone())` from `Tab::send_control`.
      Keep `test_outbound_writes()` payload-only and add
      `test_outbound_writes_routed()` to minimize churn. Then require
      `matches!(route, OutboundRoute::Control(MessageType::PtyInput))` in the
      mux tests and `OutboundRoute::Raw` in the plain-tab tests, so both a
      swap-to-raw-write and a wrong-conversion-to-PtyInput turn the tests red.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: >
      Medium severity — outside the auto-fix candidate gate. Test-coverage
      hardening, no live defect.

