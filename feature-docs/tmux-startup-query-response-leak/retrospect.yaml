lessons_candidates:
  - >
    Cross-model reviewer availability was fragile this round: the codex
    provider returned `rate_limited` for security and the R2b vertex fallback
    then hit a 600 s read timeout, so the security perspective ran
    Claude-only despite `cross_validation: true`. Worth noting whether a
    second fallback tier (or a retry) is wanted when every provider in a
    perspective's chain fails for transient reasons.
  - >
    Two of the three declined findings across both rounds came from reviewers
    treating `#[cfg(test)]`-gated instrumentation as production hot-path code.
    A `reviewer:performance` entry in feature-docs/LESSONS.md recording this
    false-positive pattern would suppress the re-litigation cost.
  - >
    Round 2's four surviving medium findings converge on one theme: the
    "take_response is the sole PTY delivery route" invariant introduced by
    task0002 is enforced by doc prose only. Concretely — an unbounded
    `response_queue` with no byte cap (security + performance flagged the same
    site), a parse site (`resume_native_pty`) with no paired drain, two `pub`
    non-draining peek accessors, and `reset()` clearing the queue mid-chunk so
    an RIS after a query drops the reply entirely (FR2 exactly-once becomes
    zero times). None met the critical/high auto-fix gate, so all are carried
    to the human evaluator; the RIS one is the only claimed live defect.
  - >
    The integration worktree could not build until the gitignored bundled
    fonts were copied in from the main working tree (build.rs hard-fails on a
    missing assets/fonts/Noto-COLRv1.ttf). Every fresh em-workflow worktree in
    this project will hit this. Worth either a worktree-setup step that runs
    `bash scripts/fetch-fonts.sh`, or symlinking assets/fonts from the main
    tree at worktree creation.
