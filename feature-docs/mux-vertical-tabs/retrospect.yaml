lessons_candidates:
  - >-
    並行タスクが同一 struct（MuxSettings）へ別々にフィールドを追加すると、
    git のテキストマージが非重複 hunk として黙って両方取り込み、重複
    フィールドのコンパイルエラーになる（merge-task.sh は exit 0）。
    task0003 と task0005 の双方が task0001 の契約フィールドのスタンドイン
    を作って踏んだ。プランナーが「同一 struct への追加は1タスクに集約」
    または「スタンドイン禁止・コンパイルゲートは cfg で逃がす」等の
    規約を検討する余地がある。
  - >-
    integration worktree での検証には環境準備が2つ必要だった:
    (1) gitignored フォント資産のコピー（build.rs が無いと panic）、
    (2) bun.lock が git 管理外のため、素の bun install が新しい
    happy-dom (20.11.0) を解決して既存 viewer テストが2件壊れる。
    main tree の bun.lock をコピーして --frozen-lockfile で揃えるのが正。
  - >-
    tabs.rs の既知 flaky セット（off-thread replay timing 6件 +
    welcome_without_windows_leaves_group_none）は --test-threads=1 でも
    サンドボックス CPU 競合下で落ちる。ベースライン比較（git stash）で
    既存性を確認する運用が3タスクで独立に機能した。
  - >-
    「mux タブのみ表示のサイドバー」×「全タブ共有 grid」の組合せで
    タブ切替 resize が構造的に発生する点は、spec 作成時に既存
    アーキテクチャ制約（共有 cell_size）を洗い出せていれば事前に
    決められた。UI 面積を変える機能の spec では「grid/viewport への
    影響」を必須確認項目にする価値がある。
