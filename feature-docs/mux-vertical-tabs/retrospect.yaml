lessons_candidates:
  - >-
    「サイドバーを左→右に移す」という一見小さな UI 変更が、CentralPanel の
    右端に依存する別コンポーネント（右端スクロールバーのクリック抑止ガード）
    を巻き込んで high 級リグレッションになった。egui SidePanel は
    CentralPanel を縮めるが、winit 生イベントを幾何で手動ガードしている
    箇所（top/bottom strip / scrollbar）はその縮小を自動追従しない。
    「ウィンドウの右端」を絶対座標で参照している全ガードは、サイドバーの
    inset を反映する必要がある。geometry を触る変更では
    「絶対 window 端に依存する hit-test の棚卸し」をレビュー観点に加える
    価値がある。
  - >-
    right-edge 配置は left-edge より geometry がシンプルになった（x-origin
    項が全廃され width-only inset に）。ただし副作用として、以前 x-origin に
    inset を足していたヘルパー mux_sidebar_x_inset が dead API 化し、名前
    （x_inset）が実挙動（width-only）と矛盾する medium が残った。配置変更で
    「不要になった旧経路のヘルパー」を消し忘れやすい。
  - >-
    2回目の develop 差分再実行では、workflow.yaml の後段 step
    (implement/review/verify/retrospect) を pending に戻し、追加タスク
    (task0006) を tasks に足し、要件マッピングを更新する手当てが必要だった。
    upstream 3 step (spec/design/plan) は「変更した内容を反映して completed
    のまま commit を現行 HEAD に更新」で回せた。差分再実行のための
    workflow.yaml 手当ては手動で、定型化の余地がある。
  - >-
    integration worktree の検証環境準備（gitignored フォント + 非追跡
    bun.lock の happy-dom ピン揃え）は round 1 と同じ手当てが再び必要だった。
    develop 再実行でも同じ落とし穴を踏むので、verify 前の環境準備は
    チェックリスト化する価値がある。
  - >-
    round 3 でも同じ環境準備 2 点（fetch-fonts.sh + bun.lock ピン揃え）を
    三たび踏んだ。integration worktree 作成直後に機械的に流す前処理として
    完全に定型化できることが確定した。
  - >-
    レビュアーが最初の報告後に自主継続して指摘を取り下げるケースがあった
    （負の高さ edge case → 最小ウィンドウ制約で非到達と自己判定）。同一
    task-id から複数回の完了通知が来る場合、最後の構造化出力を正とする
    運用で問題なかった。
  - >-
    task0007 の実機バグ（カード背景が右/下で潰れる）はユニットテストを
    すり抜けた。原因はテストフックが「計算した rect」を記録していて
    「実際に描かれる rect」を見ていなかったこと。egui の Frame::show は
    コンテンツ実寸で背景を描くため、意図した rect と実描画は別物になり得る。
    描画系のテストは意図値でなく実描画値（paint rect）を捕捉するのが正。
    round 4 で test-catches-bug 検証（修正を戻してテストが落ちることの確認）
    まで行う運用が有効だった。
  - >-
    実機スクショ付きのバグ報告 → 修正ラウンドは、デザイン変更ラウンド
    （DESIGN.md 更新あり）と違い create-spec/design を触らず create-plan
    からのリセットで回せた。モックが正でコードが誤りのケースは
    「実装バグ修正タスク」として plan に直行するのが最短だった。
