    file: src-tauri/src/window_host.rs
    line: 3903
    title: "Wheel events are swallowed on visible sidebar padding"
    description: >-
      point_in_sidebar treats the entire painted panel/card as the wheel
      target, but draw_rows lives inside a content rect shrunk 8 px
      horizontally / 12 px vertically. A wheel over the visible padding
      strips is forwarded to egui (where no ScrollArea is hovered) while
      the early return also skips the terminal scroll — the event does
      nothing. codex:spec only; claude:spec and claude:comprehensive
      reviewed the same boundary and did not flag it (before this round,
      a wheel over the padding scrolled the TERMINAL, which the bug
      report called wrong — dead padding is the conservative middle
      ground, but scrolling the list would be friendlier).
    suggestion: >-
      Extend the ScrollArea's wheel-sensitive viewport to the full
      sidebar/card and move the padding inside its content, with
      regression cases for wheel events over every padding edge in both
      placement modes.
    sources: [codex:spec]
