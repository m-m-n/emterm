      - src-tauri/src/ui/mux_sidebar.rs
    skills: [design-impl]
    domains: [ui]
    complexity: low
    requirements: [FR5, NFR3]
    status: merged
    notes: "Fetched gitignored font assets via scripts/fetch-fonts.sh inside the worktree to unblock build.rs. Only pre-existing tabs.rs flaky set observed (baseline-confirmed via stash)"
    branch: em-workflow/mux-vertical-tabs/task0007

  task0008:
    title: "Fix overlay card paint geometry (right/bottom padding)"
    plan: tasks/task0008.md
    files:
      - src-tauri/src/ui/mux_sidebar.rs
    skills: [design-impl]
    domains: [ui]
    complexity: low
    requirements: [FR5, NFR3]
    status: merged
    notes: "Root cause: egui 0.29 Frame::show paints the content's actual bounding box, so the manually padded row rect collapsed the painted background. Fixed via Frame::begin/Prepared with the card rect pinned as content min size; test hook now captures the actual paint rect. Test-catches-bug verified by reverting the pin"
    branch: em-workflow/mux-vertical-tabs/task0008

  task0009:
    title: "Overlay card follows window resize"
    plan: tasks/task0009.md
    files:
      - src-tauri/src/ui/mux_sidebar.rs
    skills: [design-impl]
    domains: [ui]
    complexity: low
    requirements: [FR2, FR5]
    status: merged
    notes: "Root cause: egui Area caches per-id size after the first sizing pass and set_min_size is grow-only, so the card never shrank. Fixed by pinning the frame+rows to a fresh Ui built from the per-frame rect (allocate_new_ui), authoritative in both directions. Shrink-direction tests failed red before the fix"
    branch: em-workflow/mux-vertical-tabs/task0009

  task0010:
    title: "Route wheel scroll over the sidebar to the list"
    plan: tasks/task0010.md
    files:
      - src-tauri/src/window_host.rs
      - src-tauri/src/ui/mux_sidebar.rs
      - src-tauri/src/app.rs
    skills: [frontend-impl]
    domains: [ui, input-handling]
    complexity: medium
    requirements: [FR2, NFR2]
    status: merged
    notes: "app.rs in expected_files was untouched (mux_sidebar_visibility() already existed as the plan anticipated). Hit-region helpers extracted from the draw path so paint and hit-test share one derivation; winit MouseWheel guard forwards to egui before the terminal scroll path"
    branch: em-workflow/mux-vertical-tabs/task0010

