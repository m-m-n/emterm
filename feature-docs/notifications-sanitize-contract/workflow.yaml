schema_version: 1
feature: notifications-sanitize-contract
created: '2026-09-25'
base_branch: main
goal: |
  # notifications モジュールのサニタイズ契約を一本化する

  ## やりたいこと（必須）
  `notifications` モジュールの本文ビルダー 2 種で分裂しているサニタイズ契約を一本化する。
  ## 背景・なぜ（必須）
  PR https://github.com/m-m-n/emterm/pull/31 で `agent_notification_body` は「呼び出し側は生の `tab_title` を渡してよい（内部で `sanitize_title` する）」契約になったが、同一モジュールの兄弟関数 `notification_body(sanitized_title: &str, ...)` は逆に「呼び出し側がサニタイズ済みを渡す」契約のまま残っている（実際 `src-tauri/src/app/mod.rs:1224` が `sanitize_title(&tab.title)` をキャプチャ時に呼んでいる）。
  結果として「OS 通知本文に制御バイト / CSI を出さない」という同一の不変条件が、モジュール内で 2 つの相反する規約で守られる状態になった。区別は引数名とドキュメントだけで、型では強制されていない。
  具体的な失敗経路は PR #31 が直したバグそのもの。新しい呼び出し側が `notification_body(&tab.title, ...)` のように生タイトルを渡すと、エスケープがそのまま OS 通知へ漏れる。`AgentTransition::name` はさらに別レイヤ（`agent_status::sanitize_name` のパース時サニタイズ）に依存しており、同一関数の 2 引数が別々の信頼契約を持つ形にもなっている。
  加えて PR #31 で追加した doc コメントは「both existing call sites and any future one の single choke point」と書いているが、choke point になったのはエージェント通知経路だけで、タブアクティビティ経路は依然として呼び出し側責務。読み手に「notifications モジュールが全経路でサニタイズする」と誤読させうる。
  現時点で実バグは無い。
  - 該当箇所: `src-tauri/src/notifications.rs:164`（`notification_body`）、`src-tauri/src/notifications.rs:352`（doc コメント）、`src-tauri/src/app/mod.rs:1224`（呼び出し元）
  - 検出元: PR https://github.com/m-m-n/emterm/pull/31 のレビュー round1、finding `6d2232a64f62dbdf`（severity medium / category architecture / confidence 60）
  - 記録: `feature-docs/agent-notification-sanitize-title/reviews/round1.yaml`
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] `notifications` モジュールの本文ビルダーが単一のサニタイズ規約に従う
  - [ ] 生タイトルを誤って渡す新規呼び出し側が、レビューではなく仕組みで検知される
  - [ ] `agent_notification_body` の doc コメントの「single choke point」の記述を、実際の適用範囲に合わせて書き直す
  - [ ] `cargo test --manifest-path src-tauri/Cargo.toml --lib` が通る
  ## スコープ外（任意）
  - 通知の発火条件・レート制限・ディスパッチの変更
  - `sanitize_title` の挙動変更
  ## 制約・前提（任意）
  - 案は 2 つある。(a) `notification_body` 側も内部で `sanitize_title` を呼び、引数名を `title` に変える。`sanitize_title` は冪等（CSI 除去 → 制御文字除去 → 100 文字 take）なので `app/mod.rs:1224` の早期サニタイズはサイズ抑制の最適化としてそのまま残せる。(b) `sanitize_title` だけが生成できる `SanitizedTitle` newtype を導入し、両ビルダーがそれを受け取る。呼び出し側で生 `String` を渡すとコンパイルエラーになるため同種のバグが再発しない。
  - PR #31 が main にマージされた後の状態を前提に着手すること。
