  - stable_id: afa7e833c3f394a8
    severity: medium
    category: security
    file: src-tauri/src/notifications.rs
    line: 378
    title: "sanitize_title は markup メタ文字 (< & >) を残すため D-Bus 通知 body にマークアップ注入できる"
    description: >-
      sanitize_title が落とすのは CSI シーケンス・C0/DEL/C1 制御文字・100 文字超過分だけで、
      `<` `&` `>` はそのまま通過する。生成された body は NotifyRustSink 経由で notify_rust の
      .body() にエスケープなしで渡り、org.freedesktop.Notifications 仕様では body-markup
      capability を広告するサーバ (GNOME Shell / Plasma / dunst markup=full 等) で HTML
      サブセット (<b> <i> <u> <a href> <img src>) として解釈される。ターミナル内の任意プロセスが
      OSC 0/2 でタイトルにリンクタグを仕込むだけで、デスクトップ通知にフィッシングリンクを
      注入できる。既存の tab-activity 経路も同じ sanitize_title を使うため同性質の穴を共有しており、
      本 diff で新規に生まれた欠陥ではない (制御文字を落とす分、変更前より露出は減っている)。
      本タスクのスコープ (既存 sanitize_title を通す) の外側にある残存ギャップ。
    suggestion: >-
      sanitize_title の末尾で markup メタ文字をエスケープする (`&` → `&amp;`, `<` → `&lt;`,
      `>` → `&gt;`)、または送出側 NotifyRustSink::send で .body() 直前にエスケープする。
      body-markup を広告しないサーバでは `&amp;` が生で見えるため、notify_rust の
      get_capabilities() で "body-markup" を確認できたときだけエスケープするのが正確。
      エスケープは 100 文字トランケートより後に行い、エンティティが途中で切られないようにする。
    sources: [claude:security, codex:security]
    confidence: 95
