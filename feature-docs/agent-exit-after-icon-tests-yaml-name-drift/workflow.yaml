  ## 現象 (必須)

  `test-docs/agent-exit-after-icon/task0006.tests.yaml` の AC-2 の `tests` に、存在しないテスト名 `mux::upgrade::tests::rewrite_handoff_file_overwrites_an_already_written_handoff_file_in_place` が残っている。現行の関数名は `rewrite_handoff_file_replaces_an_already_written_handoff_file_at_the_same_path`（`src-tauri/src/mux/upgrade/tests.rs:1640`）。`.claude/rules/test-docs-records.md` の解決確認（`--lib -- --list` に各名前が出ること）を満たさない。

  em-workflow mux-upgrade-exited-pane-revision の review round 1 で medium として残った指摘（stable_id 285abe531173477d）。古い名前は 2275bc93 で追加され、ccfc1d65 で関数名だけが変わった。

  ## 再現手順 (必須)

  1. `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --list` を実行する

  2. 出力に `mux::upgrade::tests::rewrite_handoff_file_overwrites_an_already_written_handoff_file_in_place: test` が無い

  ## 期待する挙動 (必須)

  AC-2 の該当行が `mux::upgrade::tests::rewrite_handoff_file_replaces_an_already_written_handoff_file_at_the_same_path` になっている。`red_reason` は変更しない。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `test-docs/agent-exit-after-icon/task0006.tests.yaml:51`

