    は XID_Continue に含まれるが Alphabetic ではないため false になり、`super::agent_status\u{0301}::X` が許可される。rustc は別モジュール
    `agent_statuś` として解決するので、SPEC FR2 の境界の定義にも反する。自己テストの文字 (é, 日本, １) ではこの穴を検出できない。非 ASCII 名のモジュールは #[path]
    かインラインでしか宣言できず (E0754)、現実の編集で起きる可能性は極めて低い。`cargo check --no-default-features` は失敗するので影響は ac8 テスト単体での検出漏れにとどまる。'
  suggestion: 許可条件を肯定形で書いて fail-closed にする。直後が空、`::`、または明示した終端文字 (`;` `,` `)` `}` 空白など) のときだけ許可する。`use
    super::agent_status\u{0301}::X;` を拒否する自己テストを追加する。
