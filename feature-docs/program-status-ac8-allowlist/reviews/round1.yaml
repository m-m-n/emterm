  title: use 行の判定が空白の書き方の揺れで外れ、規則 B をすり抜ける
  description: 'ac8_use_path は、`use ` (半角空白1つ) と、`pub` の直後に来る `(` しか認識しない。`pub (crate) use winit::event::Event;`、`use\twinit::event::Event;`、`use`
    だけの行で改行する形、`#[cfg(...)] use winit::...;` のように属性と同じ行に書く形は use 行として扱われず、crate::／super:: も含まないため違反なしになる。どれも
    rustfmt が正規の形に直す書き方で普段の編集では現れにくい。不変条件の最終的な防壁は `cargo check --no-default-features` で、こちらは失敗する。影響は ac8
    テスト単体での検出漏れにとどまる。'
  suggestion: '`use`・`pub`・可視性指定のあとは空白類 1 文字以上で判定する。strip_prefix("use") のあとに char::is_whitespace を要求し、`pub`
    のあとは trim_start してから `(` を見る。`pub (crate) use winit::event::Event;` と `use\twinit::event::Event;`
    を拒否する自己テストを追加する。'
