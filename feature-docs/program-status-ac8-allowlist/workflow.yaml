schema_version: 1
feature: program-status-ac8-allowlist
created: '2026-10-11'
base_branch: main
goal: |
  # program_status の ac8 ガードを super:: import に対応させる

  Notion: https://www.notion.so/3f53509ec8ee81e9a884c13a4e0e27e1

  ## やりたいこと (必須)
  `program_status` の ac8 ガードテストが、`super::` 経由のプロジェクト内依存も検出できるようにし、テストの主張を実態に合わせる。
  ## 背景・なぜ (必須)
  em-workflow pane-state-rank-unify の review round 1 で medium として見送った指摘（stable_id `3b85e79896a0cf72`）。
  `src-tauri/src/program_status.rs:28` に `use super::agent_status::AgentState;` が追加された。`program_status` はクレート直下のモジュールなので `super::` は `crate::` と同じものを指し、他のプロジェクトモジュールへの依存になる。一方、テスト `program_status::tests::ac8_the_module_uses_only_always_built_crates` は `crate::` という文字列だけを拒否するため、この import は素通りする。拒否時のメッセージ "the module must not reach into other project modules" は、もう実態と合っていない。
  依存そのものは pane-state-rank-unify の SPEC が求めたもので、`agent_status` は gui gate なしで常にビルドされるため、ビルド構成に依存しない性質は保たれている。pane-state-rank-unify では SPEC NFR3（既存テストを変えない）によりテストを直せなかった。
  コードは統合ブランチ `em-workflow/pane-state-rank-unify/integration` 上にある。
  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] ac8 の検査が `crate::` の文字列チェックではなく、明示的な許可リスト（`super::agent_status`）で判定している
  - [ ] ac8 の失敗メッセージが、実際に守っている不変条件（gui feature 非依存）を述べている
  ## スコープ外 (任意)
  \<今回やらないこと。あれば\>
  ## 制約・前提 (任意)
  \<触ってほしくない箇所 / 使う技術 / 互換性など。あれば\>
