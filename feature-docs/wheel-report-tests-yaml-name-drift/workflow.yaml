schema_version: 1
feature: wheel-report-tests-yaml-name-drift
created: 2026-09-20
base_branch: main
goal: |
  task0001.tests.yaml が存在しないテスト名を参照している (AC-7 の証跡切れ)

  ## やりたいこと (必須)
  `test-docs/wheel-report-fraction-accum/task0001.tests.yaml:62` が指す存在しないテスト名を、実在するテスト名に直す。

  ## 背景・なぜ (必須)
  task0001.tests.yaml が AC-7 の受け入れ証跡として挙げる `window_host::tests::decide_wheel_event_detects_reactivation_observed_only_by_an_owner_recorded_release` は HEAD に定義が無い。task0002 で同テストが `decide_wheel_event_reactivation_after_an_owner_recorded_release_accumulates_from_zero`（`src-tauri/src/window_host/tests.rs:3223`）に付け替えられたが、task0001 側の yaml が追随していない。
  このため AC-7 の証跡を名前で再実行すると `0 tests run` になり、受け入れ条件の証明が黙って失われる。同ファイルの 57 / 67 / 74 行の red_reason 本文にも同種のドリフトがある。
  PR #73（`em-workflow/wheel-report-fraction-accum/integration`）のレビュー round 2 で検出。stable_id `12606d425b38d819` / severity medium。

  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] task0001.tests.yaml が参照する全テスト名が `src-tauri/src` に実在する定義に解決する
  - [ ] 57 / 67 / 74 行の red_reason 本文も現在の実装に合わせて更新されている

  ## スコープ外 (任意)
  テスト自体の追加・削除。

  ## 制約・前提 (任意)
  PR #73 がマージされた後に着手する。
parent_branch: em-workflow/wheel-report-tests-yaml-name-drift/integration

