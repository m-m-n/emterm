schema_version: 1
feature: mux-write-filter-overflow-lone-esc
created: '2026-10-03'
base_branch: main
goal: 'Notion: https://www.notion.so/3ee3509ec8ee818f8984d20bd6b4064b


  # mux: 書き込みフィルタの上限超過書き出しが lone ESC で終わると次回読み取りの [6n が実行可能な CPR 照会としてリングに入る


  ## 現象

  書き込みフィルタの保留上限（512 KiB、`src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:38`）を超えた一括書き出し（`write_filter.rs:445`）の末尾が
  lone ESC だと、書き出し済みストリームは escape 状態なのに、引き継ぐ CSI 分類は none になる（`src-tauri/src/mux/scrollback_filter.rs:121`
  で Escape は CSI 状態として報告されない）。次の読み取りの `[6n` がそのまま実行可能な CPR 照会としてリングに入る。snapshot 時の strip では除去される。

  ## 再現手順

  1. mux の pane に、保留上限を超える保留列を末尾 `ESC` で終わる形で出力する

  2. 次のチャンクで `[6n` を出力する

  3. リングに `ESC[6n` が実行可能な形で残る

  ## 期待する挙動

  上限超過の書き出し経路でも、クライアントが開始していない照会をリングで成立させない。

  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所

  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:38`（保留上限）

  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:445`（上限超過時の一括書き出し）

  - `src-tauri/src/mux/scrollback_filter.rs:121`（strip の状態報告で Escape が CSI 状態にならない）

  ## 実害・発生条件

  feature mux-strip-concat-query-closure の create-plan で範囲外と判断した残件（Codex 相談済み）。元タスク: https://www.notion.so/3ee3509ec8ee819dbd44c62cbb6ae184
  。上限超過が必要なため通常利用での到達は限られるが、大きな未完了列で到達しうる。

  '
