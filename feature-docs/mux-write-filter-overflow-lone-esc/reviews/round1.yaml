    file: src-tauri/src/mux/ipc/pty_spawn/write_filter.rs
    line: 560
    title: "開いた文字列本体の中で終わるオーバーフロー run の保留 ESC をカットで捨てると文字列が閉じられず、リプレイ一致が後退する"
    description: "term_core の osc_string（crates/term_core/src/parser/osc.rs:10-33）は BEL と ESC 以外のバイトをすべて本体として飲み込む。osc_escape（同 41-55）は ST 以外のバイトが来ると Unterminated として閉じる。書き込み状態モデルは文字列本体を Ground と数えるため、変更後は保留した ESC をカットや fallback closing で捨てると closure_for(Ground) となり何も書かない（overflow_lone_esc_the_fallback_closing_follows_the_written_state が closing [] を固定）。リングには開いた ESC] が残り、カット後のメインバッファの平文はリプレイ時に次の ESC か BEL まで OSC 本体に吸い込まれる。BEL が先に来れば吸い込んだ文字列で OSC が完了する。変更前は ESC を書いて Escape を持ち越し、カットで CAN を書いていたので OSC は Unterminated として閉じ、クライアントと一致していた。この ending に限りカット時のリプレイ一致が後退している。AC-5 の view_after_a_cut 比較は 'after plain text' の ending しか対象にしていないため検出されない。この後退は IMPLEMENTATION.md の Risk Assessment（Likelihood Low / Impact Low、表示のみ）と Open Questions に意図的な受け入れとして記録済みで、NFR2 の参照フィードとも一致する。根本原因は、オーバーフローで生のまま書いた開いた文字列本体を書き込み状態モデルが Ground に畳むこと（本体が平文で終わる ending にも以前から同じ制約がある）。発生条件は狭く（512KiB 超の未終端文字列、キャップを越える read が ESC で終わる、次の read が画面切替）、影響は表示だけ。"
    suggestion: "後続 feature で、オーバーフローで生のまま書いた開いた文字列本体を書き込み状態（または別フラグ）に持たせ、カットのたびに閉じる（保留 ESC の ending と平文本体の ending の両方が直る）。この feature 内で直すなら、フラッシュが開いた OSC/DCS/APC 本体の中で終わったことを O(1) フラグで持ち、保留 ESC を捨てるときに限り ESC + ESCAPE_CLOSING を書く（SPEC FR4・NFR2・テストの closing [] も合わせて変更が必要）。いずれも AC-5 に 'inside an open string body' の view_after_a_cut 比較を追加する。"
    sources: ["claude:comprehensive"]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium severity — outside the auto-fix candidate gate; intentionally accepted in IMPLEMENTATION.md Risk Assessment / Open Questions; filed as a follow-up task"
