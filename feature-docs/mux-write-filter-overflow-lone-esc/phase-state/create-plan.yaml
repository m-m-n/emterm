    normalized_answer: 開いた OSC/DCS/APC 文字列本文の末尾 ESC も FR1 どおり保留する (IMPLEMENTATION.md
      D3 のまま、計画変更なし)
    resolution_note: 'gate: create-plan.open-string-trailing-esc (unlisted, planner
      の非ブロッキング未解決事項); options: A) FR1 どおり保留 (planner の選択) / B) 文字列本文内の末尾 ESC は保留せず従来どおり書き出す
      / C) 切断時に文字列を閉じる処理を追加; codex_consulted: true (1 turn); opus_escalation: false;
      chose A. Codex: B は FR1 の定義 (書くと WrittenState::Escape になる末尾 ESC) に反する (SPEC.md:35,
      scrollback_filter.rs:63)。さらに term_core の OSC/DCS/APC は ESC の次が \ 以外なら文字列を終えてそのバイトを
      escape() に渡すため、B では文字列内 ESC + 次読み取りの [6n が CPR 照会として成立し漏出が残る (osc.rs:47, dcs.rs:28,
      apc.rs:28, csi_device.rs:13)。A の切断後に文字列が開いたまま残る表示回帰は、既存の『開いた文字列の上限超過後に切断』と同じ扱い
      (round4_designator_cut.rs:632)。C は文字列状態の追加が必要で FR4 と範囲の見直しになる。task0001 AC-5
      で挙動を固定する'
