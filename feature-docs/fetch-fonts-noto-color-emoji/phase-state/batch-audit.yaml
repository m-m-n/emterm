      repository-layout explanation (the crate is a workspace member, so cargo
      maintains a single root lockfile and never reads/writes the declared
      stale `src-tauri/Cargo.lock`) rather than naming an AC-n of task0001's
      plan or a requirement id registered in workflow.yaml. Evidence part 3
