answers:
  fix-approach:
    packet_id: create-spec-q0001
    answered_at: "2026-09-20T22:31:49+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [remove_example]
    freeform: null
    normalized_answer: >-
      Delete src-tauri/examples/swash_emoji.rs together with its [[example]]
      block in src-tauri/Cargo.toml and the png dev-dependency that exists
      solely for it.
    resolution_note: >-
      gate: create-spec.requirement-clarification; policy action:
      codex_consultation (references/batch-policies.yaml); harness entry:
      codex (run_codex_exec.sh readonly, exit 0); turns: 1 of 5 for this
      question (settled at turn 1, explicitly frozen at turn 2).
      Options considered: fetch_notocoloremoji, repoint_colrv1,
      runtime_load_skip, remove_example.
      Codex chose remove_example and the orchestrator's independent mapping
      judgement adopted it. Reasoning: the example is the FR1 gate of the
      COMPLETED font-swash-migration and verifies CBDT bitmap strikes
      (Source::ColorBitmap(StrikeWith::BestFit)); doc/SPECIFICATION.md:124-131
      records that Noto-COLRv1.ttf replaced NotoColorEmoji.ttf outright and
      that color emoji now rasterize through a skrifa+tiny-skia COLRv1 paint
      graph, so the example's subject no longer exists in the product.
      Rejected fetch_notocoloremoji: re-incurs the ~5 MiB the COLRv1 migration
      deliberately shed (SPECIFICATION.md:131) on every developer machine and
      CI run, purely to compile a retired PoC. Rejected repoint_colrv1: swash
      cannot rasterize COLRv1, so the example would no longer demonstrate what
      it exists to demonstrate. Rejected runtime_load_skip: leaves an example
      that silently skips and therefore verifies nothing.
      Recorded as an assumption per the policy's record_as_assumption: true.
  regression-check:
    packet_id: create-spec-q0001
    answered_at: "2026-09-20T22:31:49+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [asset_manifest_test]
    freeform: null
    normalized_answer: >-
      Add a consistency test asserting that every font path embedded via
      include_bytes! under src-tauri/ is declared as a fetch_one entry in
      scripts/fetch-fonts.sh and listed in src-tauri/assets/fonts/README.md's
      inventory table. No new CI job.
    resolution_note: >-
      gate: create-spec.requirement-clarification; policy action:
      codex_consultation; harness entry: codex (exit 0); turns: 2 of 5.
      Options considered: ci_full_cargo_test, ci_cargo_check_examples,
      asset_manifest_test, fix_only_no_check.
      Turn 1: Codex chose asset_manifest_test against requirements-analyst's
      tentative ci_full_cargo_test. Turn 2: the orchestrator pushed back with
      three arguments for CI (a regex scan can miss a computed or macro-built
      path, the bug report itself proposes a CI cargo test, and the project has
      zero Rust CI coverage today) and two against it; Codex held
      asset_manifest_test. Converged, so the consultation stopped at turn 2.
      Orchestrator's independent mapping judgement adopted it, grounded on new
      evidence gathered between turns: src-tauri/src/render/font/resolver.rs
      embeds exactly seven fonts via include_bytes! and they correspond 1:1 to
      the seven scripts/fetch-fonts.sh fetches, so the invariant has seven live
      subjects in PRODUCTION code even after swash_emoji.rs is deleted, and it
      is precisely the invariant the COLRv1 migration violated. The test needs
      no GTK3/WebKitGTK, no network and no new CI infrastructure, and runs
      inside the existing cargo test surface.
      Rejected ci_full_cargo_test and ci_cargo_check_examples: both require a
      brand-new CI Rust job with GTK3/WebKitGTK dev packages plus cargo and
      font caching -- large, slow, separately-maintained infrastructure whose
      failure modes are unrelated to this bug. Standing Rust CI is worth doing
      but belongs in its own task. Rejected fix_only_no_check: the definition
      of done requires a recurrence-detecting test.
      Accepted limitation, carried into the spec: the check verifies a textual
      invariant, not an actual compile.
      Recorded as an assumption per the policy's record_as_assumption: true.
