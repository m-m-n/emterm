      in bold_raster_probe.rs and m_placement_probe.rs in the spec as a known
      follow-up; do not change those files here.
    resolution_note: >-
      gate: create-spec.requirement-clarification; policy action:
      codex_consultation; harness entry: codex (exit 0); turns: 2 of 5.
      Options considered: in_scope_repoint, out_of_scope_record,
      out_of_scope_ignore.
      Turn 1: Codex chose in_scope_repoint, diverging from
      requirements-analyst's out_of_scope_record. Turn 2: the orchestrator
      pushed back (the reported bug, its repro steps and its definition of done
      are all strictly about the cargo test COMPILE failure; the hardcoded
      Inconsolata paths are a runtime-only defect in two ad-hoc local probes
      that compile fine; widening a bug fix beyond the report is the
      requester's call and enlarges review surface and regression risk; and
      out_of_scope_record loses nothing because the defect is still written
      down) and Codex moved to out_of_scope_record. Converged at turn 2.
      Orchestrator's independent mapping judgement adopted it.
      Rejected out_of_scope_ignore: it would drop a real finding silently.
      Follow-up to be filed separately: both probes read
      /home/sakura/workspace/Inconsolata/fonts/otf/Inconsolata-{Regular,Bold}.otf
      although both fonts are already fetched into src-tauri/assets/fonts/, and
      their run instructions still reference the removed native-poc/ layout.
      Recorded as an assumption per the policy's record_as_assumption: true.
