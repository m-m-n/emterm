goal: '# エージェント状態ラッチ: 別画面の OSC 133 A が通常画面の A を消費し、ラッチの自動解除がずれる


  Notion: <redacted-notion-url>


  ## 現象 (必須)

  エージェント状態ラッチの `reconcile_latch_feed` は、OSC 133 `A`（プロンプト開始候補）を種類だけで前から突き合わせる。同じ処理単位に「別画面の A → 別画面を出る → OSC 777 等の報告 → 通常画面の A」が並ぶと、別画面の A が通常画面の A として消費され、報告より後ろの本当の通常画面の A が無視される。ラッチの自動解除の時点がずれる。

  OSC 7501 側の同型不具合は em-workflow osc7501-alt-screen-prompt-mark で修正済み（PR https://github.com/m-m-n/emterm/pull/132 ）。そこではラッチ側を範囲外とした（SPEC A4）。

  ## 再現手順 (必須)

  1. 通常タブで、別画面に入って OSC 133 `A` を出し、別画面を出てからエージェント状態の報告（Set）を行い、通常画面の OSC 133 `A` を出す出力を一度に入力する

  2. 最後の通常画面の A で解除されるはずのラッチが残る

  ## 期待する挙動 (必須)

  別画面で発生した A を突き合わせから除外し、報告より後ろの通常画面の A でラッチが解除される。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある（Set / Clear を挟む順序を含む）

  ## 該当箇所 (任意)

  - `src-tauri/src/agent_status_model.rs:181`（`reconcile_latch_feed`）

  - `src-tauri/src/callbacks.rs:1232`（`handle_semantic_prompt` — 別画面の OSC 133 はラッチ feed に残している）

  ## 実害・発生条件 (任意)

  別画面と通常画面の A と報告が 1 回の出力処理単位にまとまったときだけ起きる。

  '
