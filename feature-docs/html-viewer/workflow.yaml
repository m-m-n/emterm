schema_version: 1
feature: html-viewer
created: 2026-07-05
base_branch: main
parent_branch: em-workflow/html-viewer/integration

project:
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: ""
      e2e_test_command: ""
    cli:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features"
      test_command: ""
      format_command: ""
      e2e_test_command: ""
    web:
      language: typescript
      build_command: "bun run build:viewer"
      test_command: "bun run typecheck && bun test"
      format_command: ""
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: da3448ca438cb5f7c0351b6e26492135fefe2c4d
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: completed
    completed_at_commit: da3448ca438cb5f7c0351b6e26492135fefe2c4d
  - id: implement
    status: completed
    base_commit: da3448ca438cb5f7c0351b6e26492135fefe2c4d
    completed_at_commit: 574191fc12c686dc2f585441fbc5693ca0dab688
  - id: review
    status: completed
    completed_at_commit: 4415fda7acea9defe5357f1cdb22f65d2ddca1c6
  - id: verify
    status: completed
    result: pass
    failed_items:
      - "note: tabs::tests (10件, 非決定) は既知の並列/mux(EMTERM_MUX=1)由来flaky。html-viewer変更ファイルと無関係で回帰ではない。--test-threads=1でも失敗数が変動(2→4)する非決定性で確認"
    manual_pending:
      - "M-1..M-5: GUI実機シナリオ(ウィンドウ表示/JS実行/外部リソース遮断/相対パス/リンク外部委譲)は自動化不可のためユーザー手動確認"
  - id: retrospect
    status: completed

