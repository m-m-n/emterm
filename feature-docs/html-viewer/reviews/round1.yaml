    severity: high
    category: security
    file: src-tauri/src/viewer/html_window.rs
    line: 199
    title: "Script-initiated http(s) navigation is auto-opened in external browser"
    description: >-
      handle_navigation / handle_new_window hand any http(s) target to the OS
      browser without a user gesture, so a document's own JS (location=, window.open,
      meta-refresh) can force-navigate / beacon out. wry cannot distinguish click
      from script-initiated navigation. Flagged by claude:security, codex:security.
    suggestion: "Limit external-open to user-gesture navigation, or drop http(s) auto-open."
    sources: [claude:security, codex:security]
    confidence: 95
    resolution: deferred
    resolution_reason: >-
      User decision: keep FR6 (http(s) links open externally). CSP hardening in this
      round closed the form/base/connect exfiltration vectors; the residual
      location-assignment auto-navigation is accepted for the AI-generated-HTML review
      use case. wry cannot separate click from script navigation without sacrificing
      FR6 link-click behavior.
