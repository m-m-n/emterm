schema_version: 1
feature: osc133-mark-token-exact-match
created: '2026-10-11'
base_branch: main
goal: '# OSC 133 の不正トークン（133;AB 等）が OSC 7501 の A 候補として後続の正規 A を消費する


  Notion: https://www.notion.so/3f53509ec8ee8160a179d8708cf2e2c1


  ## 現象

  `handle_semantic_prompt` は OSC 133 のマーク種別を payload の先頭 1 バイトで判定する。一方 term_core の `parse_osc133_mark` は先頭トークンの完全一致で判定する。そのため `133;Ax` や `133;AB` のような不正トークンは term_core のライブマークにはならないのに、OSC 7501 の突き合わせ feed へ A 候補として入り、後続の正規の A を消費しうる。

  em-workflow osc7501-alt-screen-prompt-mark（PR https://github.com/m-m-n/emterm/pull/132 ）の計画・レビューで見つかった範囲外の残件。差分前からの挙動。


  ## 再現手順

  1. 通常タブに `\x1b]133;AB\x07\x1b]7501;id=job:state=working\x07\x1b]133;A\x07` を一度に入力する

  2. 最後の正規の A で消えるはずの job の記録が残る


  ## 期待する挙動

  マーク種別の判定を term_core と同じ基準（先頭トークン完全一致）に揃え、不正トークンを A 候補として扱わない。


  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所

  - `src-tauri/src/callbacks.rs:1232`（`handle_semantic_prompt`）


  ## 実害・発生条件

  不正な OSC 133 を出すプログラムがあるときだけ起きる。通常のシェル出力では起きない。

  '
