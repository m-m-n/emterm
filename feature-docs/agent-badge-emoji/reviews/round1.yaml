    title: "BadgePresentation が単一バリアント化し、判定パイプラインが素通し + fallback_filled が二重の真実源になっている"
    description: |
      Circle バリアントの削除で BadgePresentation は Emoji { cluster, fallback_filled } の1バリアントのみとなり、
      「表示種別を判定する enum」という型の役割が消えた。resolve_badge_render_mode の match は分岐の実体を失い、
      実質 bool 分岐の素通しになっている。paint_agent_badge は irrefutable let で分解しており、型が情報を
      持たないことに暗黙依存している。より実害があるのは fallback_filled で、これは agent_badge_filled(agg) の
      派生値をパイプラインに詰め替えたもの。塗り分け(fill/ring)の SSOT が agent_badge_filled と
      プレゼンテーション値の2箇所に割れる。BadgePresentation / BadgeRenderMode / badge_presentation /
      resolve_badge_render_mode の crate 内参照は tab_bar.rs 内に限られるため、外部呼び出し側の破壊は無い。
    suggestion: |
      (a) enum をやめて構造体化する:
          pub struct BadgePresentation { pub cluster: &'static str, pub fallback_filled: bool }
      (b) 派生値の詰め替えをやめる: BadgePresentation は cluster のみを保持し、
          resolve_badge_render_mode(presentation, agg, texture_available) のように Aggregated を受けて
          内部で agent_badge_filled(agg) を呼ぶ。
