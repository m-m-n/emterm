      BLOCKED_BADGE_EMOJI_SEEN = U+2754 の使用色は #FFFFFF / #E0E0E0 / #BDBDBD のみで、暗いストロークが
      一切ない。タブバー／mux サイドバーの下地は明色テーマで md3::surface_container() = #F3EDF7 なので、
      コントラスト比は約 1.1〜1.6:1 にしかならず、12px スロットでは「バッジ無し」と区別が付かない。
      本変更前の blocked+seen は agent_state_color(Blocked) = on_error_container（明色テーマで #410E0B）
      のリングで、同じ下地に対して約 14:1 だった。実測した他クラスタは問題ない
      （❓ #CC3333/#F44336、✅ #689F38/#7CB342、💤 #176BC6）。working の ⚡（#FFE567 系）も明色テーマでは
      同じ untinted-blit の弱点を持つが、これは本 diff 以前からの既存挙動。
    suggestion: |
      (a) blocked+seen だけはフォールバック円（agent_state_color の theme-aware なリング）を描く経路を残す
          — FR1 の「seen で ❔」とは矛盾するので要件側の再確認が必要。
      (b) 既読 blocked を明色テーマでも視認できる別クラスタに差し替える。
      (c) ❔ のまま維持するなら、明色テーマで既読 blocked が視認しづらいことを SPEC の Assumptions に明記し、
          意図された挙動として合意しておく。
