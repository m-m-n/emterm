findings:
  - stable_id: sc-heredoc-delimiter-collision
    severity: high
    category: security
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 29
    title: "Heredoc delimiter collision gives arbitrary command execution"
    description: >
      The quoted-delimiter heredoc that became mux-send's primary --stdin form ends as soon as a
      body line equals the delimiter. The delimiter `EOF` is published in the skill itself, and
      the skill explicitly accepts file contents, pane output, and logs as untrusted sources, so
      an attacker only has to place a bare `EOF` line followed by commands in the text. The
      mitigation as written offers "pick a delimiter unlikely to collide" as an ALTERNATIVE to
      checking the text, so an agent that follows the instruction correctly is still exploitable.
      Codex supplied a refinement that leaves no error trace: `safe\nEOF\ntouch PWNED\n: <<'EOF'`
      opens a second heredoc to swallow the generated closing delimiter.
      Orchestrator verification: reproduced directly — a bash heredoc with an `EOF` line in the
      body executed the following line and created /tmp/HEREDOC-PWNED.
      This is a regression introduced by the round-2 fix for sc-mux-send-unreachable; the form it
      replaced (`printf '%s' "$TEXT" | ...`) did not have this failure mode.
    suggestion: >
      Do not patch the wording. Remove the class: write the bytes to a file the model itself
      created and redirect, `emterm mux send --pane <id> --stdin < '<file>'`. Untrusted bytes then
      never enter the command line, so no delimiter, quoting, or escaping rule applies to them.
    sources: [claude:security, codex:security, codex:spec]
    confidence: 95
    resolution: unresolved
  - stable_id: cm-heredoc-trailing-newline-executes
    severity: high
    category: comprehensive
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 29
    title: "Heredoc appends a trailing newline, so sent text is executed in the destination pane"
    description: >
      A heredoc always terminates its body with a newline. `emterm mux send --stdin` reads stdin
      with `read_to_end` and forwards the bytes verbatim as typed input (verified in
      src-tauri/src/mux/cli.rs `execute_mux_send`; there is no trailing-newline stripping). In a
      pane running a shell that trailing newline is an Enter, so the text is committed and run.
      The form it replaced, `printf '%s' "$TEXT"`, appended nothing — this is a behavioural change
      smuggled in with a security rework. The skill's own adversarial examples now assert the
      opposite of the truth: example 1 says the pane "receives the literal characters `; rm -rf ~`
      as typed input", and example 3 calls `first line\nrm -rf /` "Safe … passes the text verbatim,
      including the newline". Under the recommended form both are executed.
      skills.test.ts AC-6 pins the heredoc shape, so fixing this requires updating the test too.
    suggestion: >
      The file-redirection form proposed for sc-heredoc-delimiter-collision also fixes this: the
      model writes the file with exactly the bytes it intends, so whether a trailing newline is
      sent becomes an explicit choice rather than an artifact. Whichever form is chosen, rewrite
      adversarial examples 1 and 3 to state that the destination pane executes what it receives,
      and say plainly that sending untrusted text to a pane running a shell is an action needing
      user consent.
    sources: [claude:comprehensive, claude:security]
    confidence: 80
    resolution: unresolved
  - stable_id: sc-tilde-outside-quotes-invariant
    severity: medium
    category: security
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 33
    title: "`~` rule states no invariant for what may leave the quotes; `~user` generalises into command substitution"
    description: >
      The documented form `emterm markdown -- "$HOME"'/notes.md'` is itself safe: `"$HOME"` is a
      literal the model writes and the untrusted remainder stays single-quoted. But it is the only
      place where anything sits outside the single quotes, and no invariant constrains that
      exception. The text says "expand only the `~`/`$HOME` segment" and is silent on the
      `~user/...` tilde-prefix form. Applying the natural generalisation to an untrusted path
      `~$(touch PWNED)/notes.md` yields `emterm markdown -- ~$(touch PWNED)'/notes.md'`, where the
      command substitution sits outside the quotes and executes. Identical wording is in all four
      display skills; skills.test.ts AC-1 only matches `"$HOME"'/...'` so the generalisation is
      not caught.
    suggestion: >
      Simplest fix is to delete the exception rather than qualify it: require the model to resolve
      `~` to an absolute path itself before quoting, and state that no byte derived from an
      untrusted path may appear outside the single quotes — one invariant, no special case. If the
      `"$HOME"` form is kept, add that invariant explicitly and say `~user` forms are not expanded.
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
  - stable_id: cm-posttooluse-overwrites-blocked
    severity: medium
    category: comprehensive
    file: plugins/emterm/hooks/hooks.json
    line: 16
    title: "Unmatched PostToolUse->working can clear `blocked` while a permission dialog is still open"
    description: >
      `PostToolUse` has no matcher, so it fires on every tool completion. Claude Code runs
      independent tool calls in parallel, so a tool finishing while another call's permission
      dialog is still on screen reports `working` and clears the `blocked` badge before the user
      has answered — defeating the feature's main purpose. This is an interaction introduced by
      round 1's cm-no-blocked-recovery fix.
      Confidence caveat from the reviewer: whether Claude Code actually schedules other tools
      during a permission prompt was NOT measured; only the absence of any suppression in
      hooks.json was confirmed. Current tests check hooks.json's static shape only and cover no
      ordering at all.
    suggestion: >
      Options: add a matcher narrowing PostToolUse; give eMterm's agent-status a priority rule so
      `blocked` survives until the next UserPromptSubmit / Stop / StopFailure (cleanest, but
      touches src-tauri which is out of scope for this feature); or accept it, record the
      behaviour in SPEC as an intentional precedence rule, and note it in the README known
      limitations. Whichever is chosen, add a test that states the expected precedence rather than
      just the event set.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
