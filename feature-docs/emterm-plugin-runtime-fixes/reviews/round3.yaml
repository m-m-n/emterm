meta:
  pattern: >
    Rounds 1-3 show a consistent shape: every round's security-guidance rewrite introduces the
    next round's findings. Round 1 mandated an argv-array invocation the agent cannot perform;
    round 2 replaced it with Bash-first quoting that broke `~` and left mux-send behind; round 3's
    mux-send heredoc introduced two highs, one of them exploitable by an agent that follows the
    instructions correctly. Prose-level hardening is not converging.
    This is the substance of round 2's sc-prose-escaping-fallible, which was declined as not
    implementable and disclosed as a residual risk. The declination was right about the argv
    remedy being unavailable, but wrong to conclude that prose was therefore the only option:
    `--stdin < '<file>'` keeps untrusted bytes out of the command line entirely and is available
    today. Round 4 should prefer removing the injection class over describing it more carefully.
