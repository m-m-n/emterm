  - stable_id: sp-ts8-contradicts-fr3
    severity: medium
    category: spec
    file: feature-docs/emterm-plugin-runtime-fixes/SPEC.md
    line: 186
    title: "TS-8 forbids any reference to `emterm` in a script FR3 requires to contain that literal"
    description: >
      TS-8 requires notify-status.sh to contain "no reference to /dev/tty, emterm, bun, eval, or
      backticks", while FR3 requires the same script to emit the literal payload
      `emterm;agent-status;`. The two cannot both hold. The test resolves it by stripping the
      payload before asserting, i.e. it verifies "does not invoke the emterm binary" — a different
      claim from the one TS-8 makes. The task0001 implementer flagged this contradiction in its
      completion report and it was not acted on.
    suggestion: >
      Reword TS-8 to what is actually verified: no `/dev/tty`, `bun`, `eval`, or backticks, and no
      invocation of the emterm binary, with the FR3 payload literal as the sole permitted
      occurrence of the string. The test needs no change.
    sources: [claude:spec]
    confidence: 65
    resolution: unresolved
  - stable_id: sp-fr3-raw-esc-byte
    severity: medium
    category: spec
    file: feature-docs/emterm-plugin-runtime-fixes/SPEC.md
    line: 66
    title: "FR3's JSON-escaping clause contains a raw ESC byte and is self-referential"
    description: >
      FR3's closing sentence reads "The JSON MUST escape the two control bytes as `<raw 0x1B>`",
      pinning nothing — it says to escape ESC as ESC, and a raw control byte cannot appear in a
      JSON string at all. The implementation uses `\u001b`, which satisfies FR3's intent and the
      canonical byte sequence, but no clause actually backs that choice.
      Orchestrator verification: confirmed — SPEC.md line 66 holds a literal 0x1B
      (`grep -P '[\x00-\x08\x0b-\x1f]'` matches exactly one line; `cat -A` shows `^[`). It is the
      only raw control byte in the file.
    suggestion: >
      Replace with a control-byte-free statement: escape each ESC (0x1B) as `\u001b` and the
      trailing backslash as `\\`.
    sources: [claude:spec]
    confidence: 65
    resolution: unresolved
