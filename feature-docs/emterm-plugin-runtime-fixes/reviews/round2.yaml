  - stable_id: sp-fr7-contradicts-impl
    severity: high
    category: spec
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 27
    title: "FR7 mandates no-shell argv invocation; all four display skills now do the opposite"
    description: >
      SPEC FR7 still reads "MUST document that the file path is passed as a single argv element
      through a no-shell invocation, and MUST NOT instruct the model to interpolate the path into
      a shell command string". The round-1 fix did precisely the opposite — it made the
      Bash-first `emterm <sub> [opts] -- '<path>'` form the primary MUST and demoted argv-array
      to an optional alternative — because a Claude Code skill can only reach emterm through the
      Bash tool. SPEC's Security Considerations ("extends the argv-based invocation requirement
      from mux-send ... closing the last documented shell-string-interpolation path") and TS-10
      carry the same stale wording, and skills.test.ts now pins the Bash-first form, so FR7 is
      permanently unmet as written. FR4 and the Wire-format duplication paragraph were amended
      this round; FR7 was not. Detected independently by spec/claude and spec/codex.
    suggestion: >
      Amend FR7 (not the implementation): require the single-quoted path after `--` as the
      primary form, require the `'\''` escaping rule, forbid a bare unquoted path, and allow an
      argv-array invocation as an equally safe alternative where one exists. Update the Security
      Considerations bullet and TS-10 to match, and drop the "mirrors mux-send" claim unless
      mux-send is also reworked (see sc-mux-send-unreachable).
    sources: [claude:spec, codex:spec]
