  - stable_id: cm-tilde-expansion-broken
    severity: medium
    category: comprehensive
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 27
    title: "Mandatory single-quoting breaks ~ expansion; ~/path always fails"
    description: >
      All four display skills now require the path to be single-quoted. Tilde expansion does not
      happen inside single quotes, so `emterm markdown -- '~/notes.md'` passes the literal string
      `~/notes.md` to clap, which has no expansion logic. Verified empirically during review:
      `emterm markdown ~/tilde-poc.md` exits 0 while `emterm markdown -- '~/tilde-poc.md'` exits
      2 (file not found). The pre-change bare form let the shell expand `~`, so this is a
      functional regression introduced by the security hardening, with no note in any of the four
      files to explain the failure.
    suggestion: >
      Add a bullet to the Argument-injection safety section of all four display skills covering
      tilde paths: resolve `~` to an absolute path before quoting, or expand only the `~` segment
      and quote the rest, e.g. `emterm markdown -- "$HOME"'/notes.md'`. Add a regression
      assertion in skills.test.ts.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
