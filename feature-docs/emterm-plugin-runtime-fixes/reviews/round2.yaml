  - stable_id: sc-doublequote-not-taught
    severity: medium
    category: security
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 27
    title: "Adversarial examples only use a ';' payload, which double quotes also defeat"
    description: >
      Each display skill's sole adversarial example is `report.md; touch PWNED`. That payload is
      neutralised by double quotes just as well as by single quotes, so the example does not
      discriminate between the required form and the common near-miss. The unsafe side shows only
      a bare unquoted path. The axis the model learns is therefore "quote it", not "single-quote
      it" — and `$(...)`, backticks, and `${...}` DO expand inside double quotes. The threat model
      already includes this payload class: notify-status.test.ts uses `$(id)` as an injection
      case. skills.test.ts's assertion only looks for the `touch PWNED` example, so the gap is
      not covered by tests either.
    suggestion: >
      In all four display skills, state explicitly that double quotes are insufficient because
      `$(...)`, backticks, and `${...}` still expand inside them, and add a second adversarial
      example using a command-substitution payload contrasting the single-quoted safe form with
      the double-quoted unsafe form. Extend the skills.test.ts assertion to require both the
      double-quote warning and a `$(`-or-backtick example.
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
  - stable_id: sc-mux-send-unreachable
    severity: medium
    category: security
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 24
    title: "mux-send still carries the unreachable argv-array primary MUST that was withdrawn elsewhere"
    description: >
      Round 1 established that "assemble the invocation as an argv array" names an execution path
      a Claude Code skill cannot reach, and the four display skills were rewritten accordingly.
      mux-send — the file those skills were told to mirror — was outside that task's scope and
      still makes the same unreachable instruction its primary MUST. mux-send is the higher-value
      target of the five (it types into a live PTY, so injection there is command execution in
      the destination pane). Its recommended safe form
      `printf '%s' "$TEXT" | emterm mux send --pane <id> --stdin` is also circular for a Bash-only
      caller: assigning untrusted text into `$TEXT` is itself the step that needs escaping.
    suggestion: >
      Apply the same Bash-first rework to mux-send. A quoted-delimiter heredoc avoids the
      variable-assignment problem entirely for --stdin, and the --text path should follow the
      display skills' single-quote plus `'\''` rule. Extend the skills.test.ts hardening
      assertions to cover mux-send.
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
