findings:
  - stable_id: sc-stagefile-unspecified
    severity: high
    category: security
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 33
    title: "The staging file's creation step is unspecified, so the injection point moved upstream rather than closing"
    description: >
      Round 4 made `emterm mux send --pane <id> --stdin < '<file>'` the required form for untrusted
      text, on the stated grounds that nothing derived from the text enters the command line. That
      is true of the send command only. The skill never says HOW to create the file. The model's
      realistic options are the Write tool (argv-based, no shell) or the Bash tool — and via Bash,
      `cat > f <<'EOF' ... EOF`, `printf '%s' '<text>' > f`, or an interpolated variable redirect
      all put the whole untrusted blob back on a shell command line. The heredoc route reproduces
      sc-heredoc-delimiter-collision exactly, one step upstream. File bodies are arbitrary-length
      and arbitrary-byte, so this is a worse surface than the path was.
      The skill's own text pushes toward that outcome: it forbids assigning untrusted text into a
      shell variable, and calls heredocs "never used for untrusted text in this skill" in a context
      readable as being about `--stdin` supply only — while never mentioning the Write tool at all.
      Root cause is the task0007 plan, which said "write the file with exactly the bytes it intends"
      without specifying the write mechanism.
      Three reviewers reached this independently (security/claude high, comprehensive/claude high,
      security/codex medium), which is why it is recorded at the higher severity.
    suggestion: >
      Require a non-shell write: the file MUST be created with the Write tool, whose content is a
      parameter rather than shell text. State that Bash-based creation (heredoc, printf, echo,
      variable redirect) is forbidden for untrusted text, and narrow the "nothing derived from the
      text enters the command line" claim to say it holds provided the file was written without a
      shell. Extend the adversarial example that rejects heredocs so it covers file creation, not
      just `--stdin` supply.
    sources: [claude:security, claude:comprehensive, codex:security]
