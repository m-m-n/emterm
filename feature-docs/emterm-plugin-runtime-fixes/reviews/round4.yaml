  - stable_id: cm-stopfailure-noop
    severity: high
    category: comprehensive
    file: plugins/emterm/hooks/hooks.json
    line: 40
    title: "StopFailure output is ignored by Claude Code, so the StopFailure hook cannot report idle"
    description: >
      The hooks documentation states in two places that StopFailure's "Output and exit code are
      ignored" (the event table and the exit-code table). notify-status.sh's only transport is the
      `terminalSequence` field of its stdout JSON, so the StopFailure entry added in round 2 is a
      complete no-op. When a turn ends on an API error the badge stays `working` until the next
      UserPromptSubmit — `Stop` does not fire, since StopFailure runs instead of it. That is the
      exact condition cm-stopfailure-unwired was supposed to fix.
      Worse, README now asserts "Five hooks … StopFailure → idle" as fact, and both skills.test.ts
      (README-to-hooks.json consistency) and notify-status.test.ts (exact event set) pin that claim,
      so documentation and tests jointly guarantee behaviour the platform says cannot happen.
      Orchestrator verification: confirmed against the hooks documentation.
      Provenance: the task0003 plan explicitly flagged this risk and deferred it to a live M-1
      check, then shipped the wiring and the README claim before that check was ever run — the same
      pattern as the original `/dev/tty` decision this whole feature exists to undo.
    suggestion: >
      Preferred: remove the StopFailure entry, revert README and both test files to a four-hook
      set, and record "a turn ending on an API error leaves the badge on `working` until the next
      prompt" as a known limitation. Alternative: keep it only if a live run proves terminalSequence
      is honoured on StopFailure despite the documentation — that is an M-1 step, not a static one.
      Either way hooks.json, README, and both test files must move together or the
      README-to-hooks.json consistency assertion fails.
    sources: [claude:comprehensive]
    confidence: 80
    resolution: unresolved
  - stable_id: cm-posttooluse-failure-unwired
    severity: medium
    category: comprehensive
    file: plugins/emterm/hooks/hooks.json
    line: 16
    title: "PostToolUse fires only on success, so `blocked` does not clear when a tool fails or permission is denied"
    description: >
      The documentation says PostToolUse "Runs immediately after a tool completes successfully";
      failures fire the separate PostToolUseFailure event, and permission denials fire neither
      (PreToolUse only). So of the three outcomes after a permission prompt sets `blocked`, only one
      recovers: approve-and-succeed. Approve-then-fail (a non-zero Bash exit, routine in practice)
      and deny both leave the badge on `blocked` until the next successful tool call or Stop.
      Round 2's cm-no-blocked-recovery fix therefore covers only the happy path.
      Orchestrator verification: confirmed against the hooks documentation.
    suggestion: >
      Wire PostToolUseFailure to `working` alongside PostToolUse, and update README's hook list plus
      both test files' event sets in the same change. The permission-denied case has no event to
      hook, so record that one as a known limitation.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
  - stable_id: sc-redirect-path-unruled
    severity: medium
    category: security
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 43
    title: "The redirect target path is described as model-chosen rather than required to be, and has no quoting rule"
    description: >
      The path in `--stdin < '<file>'` is the one shell-interpreted token in the form, and the skill
      only observes that it is "the file path, which you chose" — a statement of assumption, not a
      requirement. A request like "send the contents of ~/notes/draft.txt to pane 2" makes that path
      caller-derived, and mux-send carries neither of the rules the display skills adopted for
      exactly this: no `'\''` rule for the redirect path (it exists only for `--text`), and no
      resolve-`~`-first rule (so a `~` path is passed literally inside single quotes and always
      fails). Codex's concrete case: a path `/tmp/in'; touch PWNED; #` closes the quote and executes.
    suggestion: >
      Make it a requirement: the redirect target MUST be a path the model chose itself — absolute,
      under a temp directory, no `~`, no bytes derived from untrusted input. If a caller-supplied
      path must be redirected instead, apply the display skills' rules verbatim (resolve `~`,
      single-quote the whole path, splice embedded quotes as `'\''`). Add a regression assertion.
    sources: [claude:security, codex:security]
    confidence: 80
    resolution: unresolved
  - stable_id: sc-invariant-contradicts-escape
    severity: medium
    category: security
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 41
    title: "The `no byte outside the quotes, no exception` invariant contradicts the `'\\''` rule two bullets later"
    description: >
      The display skills state the invariant as absolute: "one invariant with no special case: no
      byte derived from an untrusted path ever appears outside the single quotes". But the `'\''`
      splice documented shortly after places a path-derived byte — the quote itself, as a
      backslash-escaped character — outside the quotes. A model given a path containing `'` cannot
      satisfy both statements, and one way to resolve the conflict is to reach for double quotes,
      which the same file explicitly forbids because command substitution expands inside them.
      This is an internal contradiction in the rule, not imprecision in its wording, and the same
      text is duplicated across all four display skills.
    suggestion: >
      Restate the invariant so the splice is part of it rather than an exception to it: every byte
      of the path is either inside a single-quoted span or is part of the fixed four-character
      `'\''` splice, and nothing else path-derived appears outside the quotes. Place the `~` bullet
      and the splice bullet adjacent so neither reads as contradicting the other in isolation, and
      update the skills.test.ts assertion that pins the old wording.
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
  - stable_id: sc-consent-vs-invoke-as-is
    severity: medium
    category: security
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 100
    title: "The closing `Invoke the command as-is` cancels the consent requirement added this round"
    description: >
      Round 4 added that the destination pane executes what it receives and that sending untrusted
      text to a shell pane "needs the user's consent, the same as running a shell command directly".
      The file's last line is still the unconditional "Invoke the command as-is and report the
      result back to the user." A model reads the closing line as the operative instruction, so the
      consent requirement is decorative. The skill also never says how consent is obtained, what is
      shown, or what to do when it is refused. skills.test.ts only asserts the consent phrase
      exists, so the contradiction is invisible to tests.
    suggestion: >
      Make the closing line conditional — show the user the exact bytes and get explicit approval
      before sending when the text is untrusted and the pane runs a shell — and add an assertion
      that the closing instruction is not the unconditional form.
    sources: [claude:security, claude:comprehensive]
    confidence: 80
    resolution: unresolved
  - stable_id: cm-heredoc-guard-too-narrow
    severity: medium
    category: comprehensive
    file: plugins/emterm/skills/skills.test.ts
    line: 251
    title: "The heredoc regression guard matches `<<'` only, letting the more dangerous unquoted heredoc through"
    description: >
      The guard added to prevent the heredoc from returning asserts the file does not contain the
      two characters that open a QUOTED delimiter, while its comment claims it blocks a
      quoted-delimiter heredoc "or any other delimiter". An unquoted `cat <<EOF` passes the
      assertion, and it is strictly more dangerous than the form that was removed: besides the same
      delimiter-collision termination, an unquoted heredoc also expands command substitution,
      backticks, and parameter expansion inside the body. The guard is narrower than the invariant
      it advertises. mux-send currently contains no heredoc of either kind, so widening it is safe.
    suggestion: >
      Widen both assertions to reject the bare heredoc operator regardless of delimiter quoting, and
      align the comment. Prose that needs to mention heredocs should use the word rather than the
      operator.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
