meta:
  pattern_shift: >
    Rounds 1-3 all had the same shape — each round's security-prose rewrite produced the next
    round's findings. Round 4's results are different in kind, and split three ways:
      1. UNVERIFIED PLATFORM ASSUMPTIONS (cm-stopfailure-noop, cm-posttooluse-failure-unwired).
         Both are real behavioural bugs, and both trace to hook events being wired on a reading of
         the documentation without a live check. cm-stopfailure-noop is the sharper case: the
         task0003 plan flagged the exact risk, deferred it to M-1, and then shipped the wiring plus
         a README claim before M-1 was ever run — structurally the same mistake as the original
         `/dev/tty` decision this feature exists to undo.
      2. THE STRUCTURAL FIX APPLIED INCOMPLETELY (sc-stagefile-unspecified, sc-redirect-path-unruled).
         Removing the heredoc was right, but the task0007 plan specified the destination of the
         untrusted bytes without specifying how they get there, so the injection point moved one
         step upstream instead of closing. The direction held — the `~` exception and the heredoc
         are genuinely gone and stayed gone — but the boundary was drawn on one side only.
      3. PRECISION IN PROSE, TESTS, AND SPEC (the remaining eight). Several are original
         create-spec wording (absolute phrasing in SC-4 and NFR3) rather than anything a later round
         introduced, and several are guards that advertise more coverage than they implement.
  recommendation: >
    Category 1 cannot be settled by more static review: whether terminalSequence is honoured on
    StopFailure, and whether the badge actually recovers after each of the three post-permission
    outcomes, are live-behaviour questions. M-1 has existed since the first VERIFICATION.md and has
    never been run; the feature's central claim rests on it. Fix categories 2 and 3, resolve
    cm-stopfailure-noop by removing the entry (the documentation is explicit) or by proving it with
    a live run, then execute M-1 before opening another review round.
