lessons_candidates:
  - >
    Four review rounds, 33 findings, and rounds 1-3 all had the same shape: each round's rewrite of
    the skills' security prose produced the next round's findings. Round 1 mandated an argv-array
    invocation the agent cannot perform; round 2 replaced it with Bash-first quoting that broke `~`
    and left mux-send behind; round 3's mux-send heredoc introduced two highs, one exploitable by an
    agent following the instructions correctly. The treadmill only stopped in round 4, when the fix
    stopped describing the hazard and removed the construct that had one.
  - >
    The strongest single lesson: when a rule's safety depends on a model applying it correctly,
    prefer a form with no rule to apply. `--stdin < '<file>'` beat three rounds of increasingly
    careful quoting guidance because it keeps untrusted bytes off the command line entirely. But the
    same round showed the corollary — a structural boundary only works if BOTH sides are specified.
    The task0007 plan named where the bytes should end up and not how they get there, so the
    injection point moved one step upstream (sc-stagefile-unspecified) instead of closing.
  - >
    Two highs came from wiring hook events on a reading of the documentation without a live check.
    cm-stopfailure-noop is the sharp case: the task0003 plan explicitly flagged the risk, deferred it
    to the M-1 live check, then shipped both the wiring AND a README sentence asserting it worked —
    before M-1 ever ran. That is structurally the same mistake as the original `/dev/tty` decision
    this entire feature exists to undo. Rule worth extracting: a claim the platform documents as
    impossible must not ship pending verification; remove it, and reinstate on evidence.
  - >
    The pre-spec POC was the one thing that clearly worked. Verifying the terminalSequence transport
    BEFORE freezing SPEC.md is why the core design never had to be revisited across four rounds,
    while everything specified without a live check did. Worth making a create-spec rule: any
    requirement resting on unverified platform behaviour is measured before the spec freezes, not
    deferred to a manual scenario.
  - >
    Doc drift kept appearing at task boundaries. README was task0002's while hooks.json was
    task0003's, so "Three hooks" survived a five-hook change with nothing spanning them
    (cm-readme-hook-drift). task0005 wrote a truthful sentence about mux-send that task0006 then made
    false (sp-mux-send-unspecified). The durable fix was structural: task0005's AC-6 derives the
    expected event names from hooks.json at test time, so the two cannot drift again. Prefer
    cross-artifact assertions over splitting related documents across parallel tasks.
  - >
    Several guards advertised more coverage than they implemented: the heredoc guard matched only the
    quoted-delimiter form while its comment claimed any heredoc (the unquoted form is more dangerous);
    the Notification matcher test claimed to cover the type namespace but listed seven of eight;
    VERIFICATION.md credited TS-8 with a command-substitution check TS-8 did not contain. A guard
    whose comment overstates it is worse than no guard, because it stops anyone looking again.
  - >
    Operational: an implementer ran `pkill -f "/usr/bin/emterm"` to tidy a helper, matched the user's
    own eMterm hosting the session, killed its own ancestor, and destroyed two in-flight agents' work.
    The user wrote ~/.claude/rules/process-termination.md in response and no later agent ran a kill
    of any kind. Also learned: `emterm --version` launches the GUI rather than printing a version —
    worth an eMterm-side issue, and worth remembering that "harmless-looking probe" is a category,
    not a guarantee.
  - >
    Writing about control characters is itself a trap. The round-3 review record became unparseable
    YAML because a raw 0x1B was written into the very finding describing a raw 0x1B in SPEC.md. Same
    class of error, one layer up, within minutes of documenting it.
