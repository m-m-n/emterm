- stable_id: 49de28d0b2157829
  severity: medium
  category: comprehensive
  file: src-tauri/src/mux/snapshot_bytes/dump_block.rs
  line: 245
  title: Pending-wrap (last-column) cursor state is lost by the unconditional CUP restore
  description: ProbeState captures region, origin mode, cursor row/col and SGR but not the pending-wrap
    flag. compose_wrapped_dump_block always ends with an absolute CUP, which clears pending wrap. If the
    snapshot is taken right after output that exactly filled a row, the next printed character overwrites
    the last column instead of wrapping (contradicts FR9). Regression limited to wrapped main-buffer panes.
  suggestion: 'Add pending wrap to ProbeState (term_core accessor if needed). When set, re-establish it
    after the restore CUP: position at the last column and re-emit that cell''s character with its attrs,
    then apply the SGR restore. Add a test that snapshots right after a row-filling write, appends one
    character, and compares against a whole-stream reference.'
  sources:
  - codex:comprehensive
  confidence: 70
  resolution: unresolved
  resolution_reason: included in batch auto-rework round 1 (Codex-consulted scope decision, batch-audit
    review.rework-scope)
- stable_id: 831dbe5c0ce653d8
  severity: medium
  category: comprehensive
  file: src-tauri/src/mux/snapshot_bytes/dump_block.rs
  line: 67
  title: Zero-scrollback probe can diverge from the client's replay when a segment resize reflows
  description: probe_replay_state builds its scratch TerminalCore with PROBE_SCROLLBACK_LINES = 0. The
    client replays the same payload with real scrollback and term_core's resize_reflow can pull rows back
    from history on a grow; the probe has none, so its cursor row can diverge and the composer places
    the cursor at the probe's position rather than the replay-established one (FR9). Both probe-equality
    tests use empty segment lists with no resize.
  suggestion: Give the probe a scrollback at least as large as needed for any pull-back (or otherwise
    match the client's resize behaviour). Extend the probe-equality test with a multi-segment payload
    that accumulates history and then grows rows and cols, comparing against an oracle with generous scrollback.
  sources:
  - codex:comprehensive
  confidence: 55
  resolution: unresolved
  resolution_reason: included in batch auto-rework round 1 (Codex-consulted scope decision, batch-audit
    review.rework-scope)
