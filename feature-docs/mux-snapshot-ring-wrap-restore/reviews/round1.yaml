  file: src-tauri/src/mux/ipc/pty_spawn/tests.rs
  line: 955
  title: 'AC5/TS3 apt+resize+wrap scenario not exercised: no mid-run resize and no snapshot while the
    scroll region is active'
  description: SPEC AC5/TS3 require an apt-style stream with a mid-run resize (ring and shadow resized
    at the resize point), forced past ring capacity, snapshotted while apt's DECSTBM region is still active,
    and repeated with a snapshot taken after apt's stop sequence. The test apt_style_recording_past_a_wrapped_ring_restores_the_shadow_parsers_screen_faithfully
    calls synth_apt_bytes_with_midrun_resize(cols, rows, rows), so the resize is a same-dims no-op, and
    the single snapshot is taken after the stop sequence. The region-active snapshot (the core FR8 case)
    is never taken with the apt fixture. task0001.tests.yaml AC-5 red_reason discloses the narrowing.
  suggestion: Add a synth variant that stops before apt's stop sequence and snapshot while the region
    is active; keep the after-stop snapshot as a second case. Use rows_a != rows_b with ring and shadow
    resized at the segment boundary. Keep the client-vs-shadow row equality and client_mixed == shadow_mixed
    assertions for both snapshots.
  sources:
  - litellm:muse-spark:spec
  confidence: 90
  resolution: unresolved
  resolution_reason: batch auto-rework round 1 (rework-planner dispatched)
