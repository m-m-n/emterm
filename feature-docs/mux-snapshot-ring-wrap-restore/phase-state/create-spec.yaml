answers:
  requirement.fix-approach:
    packet_id: create-spec-q0001
    answered_at: '2026-09-23T18:50:00+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - plan_a
    freeform: 'Codex (run_codex_exec.sh readonly, 1 turn) chose plan_a. Reasons: the evicted header cannot
      be recovered from the remaining history, only from the daemon vt100 screen (scrollback_buffer.rs:223,
      snapshot_bytes.rs:235); the trigger total_written > capacity keeps non-wrapped bytes identical (scrollback_buffer.rs:221);
      the dump goes after the history replay with a current_dims DimSegment at its start (snapshot_bytes.rs:248,
      :283), within the existing 64-segment budget (session/pane/mod.rs:171). Refinement: contents_formatted()
      emits clear+CRLF and no scroll region (vt100 grid.rs:221, term.rs:374), so a DECSTBM left by the
      replay could distort the dump; drawing the dump under a full-screen region / absolute origin and
      then restoring the replayed region, origin mode and cursor reduces that (term_core csi_scroll.rs:20,
      csi_cursor.rs:16). Residual: cells already trashed inside the daemon vt100 are not repaired, so
      the 22cea6f leak path reopens for wrapped panes until clear(); DimSegment does not restore lost
      rows or daemon cells; hot-upgrade handoff loses the wrap fact and the main-buffer screen, so plan
      A alone does not cover it. Existing apt/wrap tests pass an empty dump and so do not prove safety;
      add screen-comparison tests for header restore, apt+resize+wrap, and continued output after restore.
      Rejected: plan_b removes the 22cea6f protection for every non-wrapped pane; plan_c only delays the
      loss.'
    normalized_answer: 'Adopt plan A: only when a main-buffer pane''s ring has evicted bytes (total_written
      > capacity), append the daemon vt100 contents_formatted() dump after the stripped scrollback, positioned
      by a trailing current_dims segment, at every snapshot assembly site. Non-wrapped panes stay byte-identical.
      The dump is drawn so that a scroll region / origin mode left by the replay does not distort it,
      and the replayed region, origin mode and cursor state are restored afterwards. The residual apt-debris
      risk for wrapped panes and the hot-upgrade gap are recorded as known limits.'
    resolution_note: 'gate: create-spec.requirement-clarification; policy action codex_consultation (batch-policies.yaml);
      codex_consulted: true; harness: codex; turns: 1; Codex CHOICE plan_a mapped by the orchestrator
      to option plan_a. Options not chosen: plan_b (always dump), plan_c (bigger ring). Recorded as an
      assumption per record_as_assumption: true.'
