assumptions:
- assumption_id: A1
  statement: Plan A is adopted (requirement.fix-approach answer, batch Codex consultation). The dump is
    added only for main-buffer panes whose ring has evicted bytes; plan B (always dump) and plan C (larger
    ring) are rejected.
  reversible: true
- assumption_id: A2
  statement: The dump is drawn so that a scroll region / origin mode left by the scrollback replay does
    not distort it, and the replay-established region, origin mode and cursor state are restored afterwards
    (Codex refinement, FR8/FR9).
  reversible: true
- assumption_id: A3
  statement: 'Verified fact: vt100 0.16.2 contents_formatted() emits cursor visibility, SGR reset, ESC[H
    ESC[J, then rows joined by CRLF / CUP / cursor-forward, then a final cursor position and SGR. It emits
    no DECSTBM, DECOM or autowrap state (vt100 grid.rs:217-252, term.rs:9-13, 372-383). In some end-of-row
    cursor cases it also emits ESC 7 / ESC 8 (grid.rs:439-442).'
  reversible: true
- assumption_id: A4
  statement: 'Verified fact: in term_core, a line feed at scroll_region_bottom scrolls the region instead
    of moving down (terminal_core.rs:922-935), and CUP / ESC[H are region-relative under DECOM (csi_cursor.rs:16-30).
    The FR8 distortion is therefore real whenever the replay ends with a narrowed region or DECOM on.
    For top (no DECSTBM) it does not trigger.'
  reversible: true
- assumption_id: A5
  statement: 'Verified fact: term_core DECSTBM homes the cursor (csi_scroll.rs:20-39), and restore_cursor
    consumes the single saved-cursor slot (terminal_cursor.rs:108-127, take()). Restoring the region therefore
    has to be followed by re-establishing the cursor, and ESC 7 / ESC 8 used by the snapshot itself would
    clobber the application''s saved slot.'
  reversible: true
- assumption_id: A6
  statement: 'Verified fact: vt100 0.16.2 Screen has no public accessor for the scroll region or origin
    mode (public API: size, cursor_position, alternate_screen, hide_cursor, input modes, attrs). How the
    replay-established region / origin mode is known when restoring it is a planning decision.'
  reversible: true
- assumption_id: A7
  statement: 'Known limit (NFR6): cells already trashed inside the daemon vt100 are not repaired, so apt
    debris can reappear for wrapped panes until clear().'
  reversible: true
- assumption_id: A8
  statement: 'Known limit (NFR7): the hot-upgrade handoff loses the wrap fact and the main-buffer screen;
    that path is out of scope.'
  reversible: true
- assumption_id: A9
  statement: Existing apt / wrap tests pass an empty screen slice to build_snapshot_bytes, so they do
    not by themselves demonstrate safety of the dump; TS3/TS4 supply that evidence.
  reversible: true
