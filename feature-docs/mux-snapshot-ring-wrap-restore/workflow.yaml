schema_version: 1
feature: mux-snapshot-ring-wrap-restore
created: 2026-09-23
base_branch: main
goal: 'Notion task 3e23509ec8ee81dbb1c4dbf69d8c26bc —

  mux: snapshot が scrollback リング一周後に画面上部を復元できず top の列見出しが消える


  指示メモ: まず再現テストから着手する。修正方針は未決で、案A（リング一周時のみ daemon vt100 グリッドダンプを併用）が有力。apt 進捗バー残骸の既知課題と関わるため慎重に。


  ## 現象 (必須)

  eMterm の mux タブで `top` を長時間（13 分程度以上）表示したあとタブを切り替えて戻ると、列見出し行 `    PID USER      PR  NI    VIRT    RES    SHR
  S  %CPU  %MEM     TIME+ COMMAND` が消えたまま復帰しない。

  原因の連鎖:

  1. top は列見出し行を初回 1 回しか描画しない。実測で 6 フレーム描画させても `ESC[7m    PID USER...` の出力は 1 回のみで、以降はプロセス行だけを更新する。一度失われても
  top 自身は書き直さない

  2. main-buffer pane の snapshot は daemon の scrollback 生バイトの再生だけで組み立てられ、daemon vt100 の `contents_formatted()`
  ダンプは意図的に省略されている（apt 進捗バー残骸の対策）

  3. その scrollback は 2 MiB のリングバッファで、あふれた古いバイトは上書きされる

  4. top の出力量は実測 2579 バイト/フレーム（80x24 相当）。1 秒間隔なら 2 MiB を約 813 秒、およそ 13 分で使い切る。画面が広いほど短くなる

  5. リングが一周すると、先頭にあった唯一の列見出し行が消滅する。以降タブ切り替えで snapshot を再生しても、その行を含まない履歴が再生される

  alt-screen の TUI（htop 等）は `contents_formatted()` ダンプが載るため影響を受けない。mux を介さない通常タブは snapshot 再生自体が無いため発生しない。

  ## 再現手順 (必須)

  1. eMterm の mux タブで `top` を起動する

  2. 13 分以上放置する（ウィンドウが広いほど短時間で足りる）

  3. 別のタブへ切り替えてから top のタブへ戻る

  4. 列見出し行が消えていることを確認する

  ## 期待する挙動 (必須)

  タブを切り替えて戻っても、pane の可視領域が切り替え前と同じ内容で復元されること。特に、再描画しないアプリケーションが一度だけ出力した行が失われないこと。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  着手順序: まず再現テスト（リングが一周したあとの snapshot に当該行が含まれないことを固定するテスト）を用意してから修正に入る。

  ## 該当箇所 (任意)

  - `src-tauri/src/mux/snapshot_bytes.rs:39` — main-buffer 分岐が scrollback 生バイトのみで可視領域を復元する前提

  - `src-tauri/src/mux/scrollback_buffer.rs:22` — `DEFAULT_SCROLLBACK_CAPACITY = 2 * 1024 * 1024`

  - `src-tauri/src/mux/session/pane/mod.rs` — snapshot 組み立て

  ## 実害・発生条件 (任意)

  発生条件: mux の main-buffer pane で再描画頻度の低い行を持つアプリを長時間動かし、リングが一周したあとにタブ切り替え・reattach・可視復帰のいずれかが起きること。

  実害: 画面の一部が欠落したまま復帰不能になる。top の列見出しのように、その行を再描画しないアプリでは永久に戻らない。

  修正方針の候補（未決）:

  - 案 A: リングが一周している（`total_written > capacity`）ときだけ daemon vt100 のグリッドダンプを併用する

  - 案 B: main-buffer でも常にグリッドダンプを併用する（apt 進捗バー残骸の再発リスクが高い）

  - 案 C: scrollback 容量を増やす（発生までの時間が延びるだけで解決しない）

  修正方針は apt 進捗バー残骸の既知課題と正面から関わるため、再現テストを先に固定する。

  '
