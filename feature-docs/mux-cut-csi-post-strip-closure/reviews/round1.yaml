findings:
  - stable_id: a879a02de382209f
    severity: medium
    category: security
    file: src-tauri/src/mux/ipc/pty_spawn/write_filter.rs
    line: 554
    title: "strip が除去した構文の直前に書いた ESC（WrittenState::Escape）が引き継がれず、カット時の閉鎖が読み取りの分割位置で変わる"
    description: "strip_pty_output_for_scrollback_write_with_csi_state（scrollback_filter.rs:280）は strip の終端状態を `state.csi()` で Option<CsiPhase> に縮めるため、WrittenState::Escape は None になる。Escape になるのは、strip が ESC を書いた直後の構文を除去した場合（例: `ESC` + `ESC]777;emterm;markdown;…BEL`、`ESC` + `ESC[6n`、Kitty APC、SIXEL）。その None が self.csi に入り（write_filter.rs:554）、次の呼び出しの strip は Ground から始まる。呼び出し1 `ESC ESC]777;emterm;markdown;begin;id=x BEL`（カット無し）→ `ESC` を書き csi_phase() は None。呼び出し2 `[6`＋末尾カット → `[6` を書き DEL を書かない。リングとスナップショットは `ESC[6` で終わり、後続の `n` で CPR が出る。同じバイト列を 1 回で渡すと Some(Param) になりカットは DEL を書く。AC-3 / FR1 / FR2 がこの入力で成り立たず、カット経路で NFR3/TM-1 にかかる。また、その呼び出しの直後がカットだとリングは単独の ESC で終わり、閉じられない。旧来の scan ベースの状態にも同じ欠落があった。post_strip_cut_csi.rs の分割不変性コーパスに `ESC ESC`+対象の入力が無い。"
    suggestion: "strip の終端状態を Ground / Escape / Csi(phase) を区別できる形で ScrollbackWriteFilter に持たせ、state form はそれを受け取って返す。書かれたストリームが Escape で終わる位置でカットするときの閉鎖バイトを決めて書くか、DECISIONS.md の残件として明記する。分割不変性コーパスに `ESC ESC`+各保持対象（+`[6`）と、カット・フォールバック閉鎖のケースを加える。"
    sources: [claude:evaluator]
    confidence: 75
    resolution: unresolved
    resolution_reason: "medium のため auto-fix 対象外（R4 候補ゲートは critical/high のみ）。evaluator 単独起点。別タスクとして起票する"
