- id: A-1
  statement: 'Fix approach pass_client_capacity: the replaying tab''s own capacity is sent to the daemon
    through a new additive control message, and the probe runs at that capacity. The alternative approaches
    were not chosen: client-side restore would need a snapshot-shape change the ticket forbids, and a
    documented limit only cannot meet DoD item 1.'
  source: answer fix-approach (create-spec-q0001, Codex consultation)
  reversible: true
- id: A-2
  statement: 'Protocol compatibility avoid_bump_preferred: only a new message type is added, and PROTOCOL_VERSION
    stays 3. Unreported maps to the legacy 10,000, kept separate from an explicit 0. Mixed old/new combinations
    keep working without a guaranteed fix. No response is required from the peer.'
  source: answer protocol-compat (create-spec-q0001)
  reversible: true
- id: A-3
  statement: 'Large capacities cap_with_fallback, refined: the u32 is validated before allocation, probe_capacity
    = min(reported, 10,000), and above the cap the probe runs at 10,000 with the dump kept. The fix is
    guaranteed for 0..=10,000. Above 10,000 the residual mismatch is a documented limit, and lock-hold
    time is left to follow-up 3b5bbd839c74d67b.'
  source: answer large-capacity-cost (create-spec-q0001)
  reversible: true
- id: A-4
  statement: 'The design step is skipped: there is no UI or visual change.'
  source: answer design-step (create-spec-q0001, batch decision table decide_autonomously)
  reversible: true
- id: A-5
  statement: A tab's scrollback capacity is fixed when its TerminalCore is constructed. TerminalCore has
    scrollback_capacity() and no setter, and the off-thread replay builds its replacement core at the
    same capacity. So one report per attach, plus a re-send on bridge reconnect, is enough, and a later
    settings change affects only new tabs.
  source: 'code: crates/term_core/src/terminal_core.rs:402, src-tauri/src/tabs/replay.rs:303-325'
  reversible: true
- id: A-6
  statement: A malformed capacity payload (not exactly one u32) is ignored without changing the connection's
    value and without closing the connection. This follows from the answered 'validated before any allocation'
    rule.
  source: derived from answer large-capacity-cost
  reversible: true
- id: A-7
  statement: 'Constraint from the ticket: the snapshot byte shape is not changed, because of the known
    apt progress-bar residue issue.'
  source: task_description 制約・前提
  reversible: true
- id: A-8
  statement: 'Out of scope: the probe''s scratch core always uses the default scroll_region_scrollback_enabled
    = true, while the client seeds that flag from settings (settings/mod.rs:148). That is a separate possible
    probe/client divergence and is not addressed by this capacity-only fix.'
  source: 'code: dump_block.rs:109, settings/mod.rs:142-148'
  reversible: true
