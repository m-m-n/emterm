schema_version: 1
feature: inherited-pty-drop-fd-tiocgptn
created: '2026-10-30'
base_branch: main
goal: |
  # inherited_pty の drop 後 fd 比較テストを PTY master を区別できる識別子（TIOCGPTN 等）に置き換える

  種別: バグ

  ## 現象
  `mux::inherited_pty::tests::dropping_the_adapter_closes_the_owned_descriptor` が `--lib` 全体の実行で間欠的に失敗する。失敗は `src-tauri/src/mux/inherited_pty.rs:474:27` の `assert_ne!(rdev, original_rdev)` で、両辺とも 1282（`/dev/ptmx` の 5:2）。

  テストは drop 後の `dup_fd` を `stat_rdev`（`st_rdev`）で比較しているが、`st_rdev` はすべての PTY master とその複製で 5:2 になる。drop で解放された fd 番号が、同じプロセス内の別テストの PTY master（または複製）に再利用されると、「閉じていない」場合と区別できない。`inherited_pty.rs:466-471` のコメントが仮定する「再利用された記述子は別のデバイスを指す」は成り立たない。

  ## 再現手順
  1. 無変更のテストバイナリで対象テストを単体実行し、drop の直後に外部から `/dev/ptmx` を 1 つ開く注入を行う
  2. `inherited_pty.rs:474:27` で `left: 1282` `right: 1282` の失敗が再現する（`/dev/null` の注入では成功する）

  自然な失敗は `--lib` 全体で約 25 回に 1 回。

  ## 期待する挙動
  drop 後の fd 番号が別の PTY master に再利用されても、テストは「元の記述子が閉じた」ことを正しく判定し、間欠的に失敗しない。

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所
  - `src-tauri/src/mux/inherited_pty.rs:257-273`（`stat_rdev`）、`:456-479`（対象テスト）
  - コメント `inherited_pty.rs:260-265`、`:466-471`
  - `stat_rdev` の呼び出しはこのテスト内の `:461` と `:472` だけ

  修正方針の候補:
  - 比較の識別子を `ioctl(TIOCGPTN)` に置き換える。master と複製は同じ pts 番号、別の pair の master は別の番号を返し、slave・通常ファイル・`/dev/null`・pipe・socket・閉じた番号では失敗する。「drop 後に `dup_fd` で `TIOCGPTN` が失敗するか、元と異なる番号を返す」で閉じたことを確認できる見込み（Rust のテストでの実装と安定性は未検証）
  - 同じ変更で、失敗メッセージに fd 番号と取得した識別子を出す

  根拠: em-workflow の feature `inherited-pty-drop-fd-flake-investigation` の `INVESTIGATION.md` 3.2 / 3.3 / 3.4 / 4.2 / 5 / 10。

  ## 実害・発生条件
  `--lib` 全体の実行でこのテストが間欠的に失敗し、無関係な変更の検証結果が読めなくなる。
