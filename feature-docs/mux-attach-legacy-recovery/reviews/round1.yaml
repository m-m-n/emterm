    description: "cli.rs テストの FAKE_LEGACY_VERSION = 1 はリテラル固定なのに、テスト対象の recover_from_legacy_daemon はリトライ時に PREVIOUS_PROTOCOL_VERSION（= PROTOCOL_VERSION - 1、現在 1）を送る。PROTOCOL_VERSION の bump（2→3）が起きると PREVIOUS は 2 になり、fake daemon は 2 番目の Hello も reject して listener.accept() で永久ブロック。テストは結果検証の前に legacy.join() するため、cargo test が assert 失敗ではなく無期限ハングになる。AC-2 テストの server.join() も同じ形。"
    suggestion: "(a) FAKE_LEGACY_VERSION を PREVIOUS_PROTOCOL_VERSION 参照にして版数 bump に自動追従させる。(b) 両テストで result の検証を join() より前に移し、壊れたときは panic で落ちるようにする。"
