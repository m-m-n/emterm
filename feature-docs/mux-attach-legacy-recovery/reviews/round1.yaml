    title: "attach 経路が cleanup_stale_socket を踏まないため、クラッシュ残骸ソケットで AC-3 のメッセージが出ない"
    description: "resolve_attach_socket_with は ensure_daemon_running のゲート（cleanup_stale_socket → 存在チェック → recovery probe → spawn）から cleanup_stale_socket だけを落としている。daemon が SIGKILL / クラッシュで落ちた場合、Unix では AF_UNIX ソケットファイル、Windows では marker ファイルが残るため sock_path.exists() は true になり、そのまま recover_from_legacy_daemon に入って connect_daemon が ECONNREFUSED で落ちる。結果ユーザーが見るのは生の接続エラーで、AC-3 の「No mux sessions to attach to…」は socket ファイルが物理的に無いときしか出ない。attach 側は残骸ファイルを消さないので次に emterm mux を叩くまでその状態が残る。cleanup_stale_socket は pub かつまさにこの用途で存在しており、ロジックが 2 箇所に分かれてドリフトしている状態。"
    suggestion: "resolve_attach_socket_with の冒頭（存在チェックの前）で daemon::cleanup_stale_socket(sock_path) を呼び、ensure_daemon_running と同じ前処理を通す（unified diff は auto-fix 候補外のため round 記録では省略、レビュアー出力参照）。"
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
