  file: src-tauri/src/mux/ipc/pty_spawn/write_filter.rs
  line: 1814
  title: 同じ読み取りの中で、検出の後に来る複合DECSETがclient_altに反映されない
  description: scan() は複合形を、条件 `self.client_alt != self.shadow_alt` が成り立つときだけ扱う。走査中の shadow_alt は複合形では更新されない。M1（\x1b[?1047h）の後に、1回の読み取りで `\x1b[?1;1049l\x1b[?1;1049h\x1b]133;A\x07` を受けた場合、C1l で検出が起きて client_alt=false になり shadow_alt(false) と一致するため、続く C1h は無視される。検出した読み取りは事後照合を飛ばすので [0..28] を返し OSC 133;A がライブになる。さらに client_alt=false / shadow_alt=true の誤った食い違いが残り、次の読み取りの印も [0..8] になる。通常タブは代替画面にいるので印を無視する。C1l と C1h を別々の読み取りにすると事後照合の adopt で正しく戻るため、読み込み境界で結果が変わり FR6 に反する。
  suggestion: '一度検出した読み取りでは、以降の複合形も食い違いの有無によらず client 側の向きを反映する（例: 条件を `parse.names_a_screen_mode() && (detected || self.client_alt != self.shadow_alt)` にする）。M1/M2 の後に複合形を2つ続けて1回の読み取りに入れる行を、トラッカーの単体テストと SC-1y の行（デーモン側と通常タブ側）に追加する。'
  reproduction: null
