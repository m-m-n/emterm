  title: 検出した読み取りが複合形より後に始まった引き継ぎ状態まで消し、読み込み境界で結果が変わる
  description: 'advance() の検出分岐は `self.carry = TrackerCarry::Nothing` を無条件に実行する。前の読み取りの引き継ぎは scan() 冒頭で取り出し済みなので、ここで消えるのは複合形より後に始まった引き継ぎ（指示子待ち、切り替えの途中状態、CSI の解析状態）だけになる。例: M1 の後の読み取りが `\x1b[?1;1047h\x1b(` で終わり、次が `\x1bc\x1b]133;A\x07` の場合、指示子待ちが消えるため ESC c を RIS として扱い [2..10] を返す。term_core では ESC が指示子として消費され代替画面に残る。M1 の後に `\x1b[?1;1049l\x1b[?10` | `47h` + 印と分割した場合も、途中状態が消えて ?1047h を見落とし事後照合でも直らない。テスト altmismatch_ac4_a_detection_read_applies_later_switches_and_clears_the_carry はこの消去を正しい挙動として固定している。FR6 に反する。'
  suggestion: 検出分岐では、走査が複合形より後で記録した carry を残す。SPEC FR4/FR5 の「adopt のときに引き継ぎ状態を消す」は検出時には複合形以前の状態に限る形に文言を揃える。上のテストの期待値を更新し、複合形の後で読み取りを ESC ( / ESC / ESC [?10 で分割する回帰テストを追加する。
