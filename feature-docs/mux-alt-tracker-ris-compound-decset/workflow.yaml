feature: mux-alt-tracker-ris-compound-decset
created: '2026-10-11'
base_branch: main
goal: |
  # mux: AltSpanTracker が client_alt / shadow_alt の食い違い状態で RIS と未対応の複合 DECSET を検知できず、OSC 133 の live 判定が通常タブとずれる

  Notion task: <redacted-notion-url> (種別: バグ)

  ## 現象 (必須)
  mux ペインの `AltSpanTracker`（em-workflow mux-osc-abort-altscreen-split-read で追加）が、`client_alt` と `shadow_alt` が食い違った状態で、トラッカーが扱わない形の画面切り替えを検知できない。その結果、OSC 133 マークの live 判定が通常タブとずれ、OSC 7501 の working / blocked / idle の記録が通常タブと mux ペインで食い違う。
  em-workflow mux-osc-abort-altscreen-split-read の review round 1 で medium として残った指摘 2 件（stable_id 4aef749bee51a717、b019b1bb35b07fc6）。原因が同じため 1 件にまとめた。
  1. RIS（`ESC c`）を扱わない（4aef749bee51a717）: `?1047h` の後、または `ESC [?1049h ESC ( ESC [?1049l` の後（client_alt=true / shadow_alt=false）に RIS を受けると、client_alt が true のまま残り、以後メイン画面の OSC 133 マークを捨て続ける。term_core の RIS は `TerminalCore::reset` で代替画面を抜けるため、通常タブはメイン画面に戻る。変更前に対する退行。
  2. 未対応の複合 DECSET（b019b1bb35b07fc6）: `ESC ( ESC [?1049h` の後（client_alt=false / shadow_alt=true）に `ESC [?1;1049h` で代替画面に入っても、パーサーとの照合が一致してフォールバックに入らず、代替画面上の OSC 133;A がライブとして渡る。SPEC A3（未対応の形は従来のフォールバック）に反する。
  ## 再現手順 (必須)
  1. RIS: mux ペインで `\x1b[?1047h` → `\x1bc` → OSC 7501 の working 報告 → `\x1b]133;A\x07` を順に渡す。通常タブは記録表が空、mux は working が残る（RIS の後に報告を置かないと Reset 項目が記録表を消して差が隠れる）
  2. 複合 DECSET: `drive_reads` で `seed_root_working` を指定し、`\x1b(\x1b[?1049h` と `\x1b[?1;1049h\x1b]133;A\x07` を別々の読み取りとして渡す。通常タブは working が残るが、mux は PromptStart で working が消える
  （どちらもコード読みで確認。実行は未実施）
  ## 期待する挙動 (必須)
  食い違い状態でも、通常タブの一括処理と同じ記録表になる。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:1688`（scan が `ESC c` を Other として 1 バイト進めるだけ）
  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:1581`（advance のパーサー照合）
  対処案: scan で designator スロット以外の `ESC c` を RIS として扱い client_alt / shadow_alt を false に戻す（`ESC ( ESC c` は RIS にしない、読み込み境界での分割も扱う）。食い違い状態では引数列に 47 / 1047 / 1049 を含む未対応の DEC private mode set / reset を検出し、A3 の保守的フォールバックを返してパーサー状態を adopt する。tracker corpus と SC-1x デーモン行に回帰テストを追加する。
  ## 実害・発生条件 (任意)
  食い違い状態（`?1047` の使用、または designator スロットの切り替え）と、RIS または複合 DECSET の組み合わせが必要。ペイン内のプログラム自身が出すバイト列なので信頼境界は越えない。

  ## 追加指示
  - 完了後 integration ブランチを remote へ push し gh pr create で base_branch への PR を作成。integration ブランチはローカル・リモートとも残す（自動マージしない）
  - 不明点は Codex に相談して比較的良い案を採用し、その議論内容を Notion に記録する
