schema_version: 1
feature: mux-rate-limit-key-pane-identity
created: 2026-09-09
base_branch: main
goal: |
  通知レート制限キーが daemon 由来の可変文字列に依存しており、同一 scope 内の衝突とバケット回避が残る

  ## 現象（必須）
  通知レート制限キーは学習済みの `public_pane_id` を含む `muxpub:<scope>:<learned>` になっている。
  `learned` は mux daemon（信頼境界の向こう側）が完全に制御する可変文字列なので、名前空間で包んでも
  以下が残る。
  1. **同一 scope 内の衝突** — 同じ mux 接続の 2 つの pane に対して daemon が同一の `public_pane_id`
  を返すと、両 pane が同一のレート制限バケットを共有する。最も現実的なのは空文字列のケースで、
  doc 自身が "An empty learned string still takes this branch" と認めているとおり、空 id を送る
  daemon では当該接続の全 pane が `muxpub:<scope>:` という単一キーに潰れる。片方の Blocked / Done
  通知が他方の直近通知で抑止され、片方の pane クローズ時の discard が他方の限流状態まで消す。
  2. **ローテーションによる限流回避** — 取り込み経路は更新のたびに学習済み ID を上書きするため、
  悪意ある mux peer が 1 つの pane の `public_pane_id` を回すたびに新しいバケットを得られ、
  pane ごとの通知上限を回避できる。
  3. **`HashMap` 残留** — 発火済みキーは剪定されない `HashMap` に残り続ける。pane クローズ時に
  discard されるのは「現在マップされているキー」だけなので、旧キーはどの discard サイトからも
  参照されない。daemon 再起動＋再接続で incarnation が変わると、生存中の pane でも同じことが起きる。

  PR https://github.com/m-m-n/emterm/pull/55 の review round 1 で検出された medium finding 2 件
  （`0810c3130449c0dc` comprehensive / `0247047963c1c329` security）。

  ## 再現手順（必須）
  1. 改変した（あるいは侵害された）mux daemon を用意し、`AgentStatusUpdate` の `public_pane_id` に
  空文字列を入れて返すようにする
  2. その daemon に attach し、同一接続内に 2 つの pane を開く
  3. pane A でエージェント通知を発火させる
  4. 直後に pane B で Blocked / Done 遷移を起こし、通知が抑止されることを確認する
  5. pane A を閉じ、pane B の限流状態まで消えることを確認する
  6. 別途、daemon が pane A の `public_pane_id` を更新のたびに変える構成にすると、
  pane ごとの通知上限を無制限に回避できることを確認する

  ## 期待する挙動（必須）
  レート制限キーの同一性を daemon 由来の可変文字列に依存させない。
  導出元マップ `mux_public_pane_ids` は既に `(scope, pane_id)` でキーされているため、
  学習済み文字列は `(scope, pane_id)` 以上の同一性の情報量を足していない。
  想定される修正方針は 2 つ。
  - **(a)** mux pane のキーを learned id に依存させず常に `mux:<scope>:<pane_id>` にする。
  キーは完全にコード所有・単射になり、上記 3 つの問題が同時に消える
  - **(b)** learned id を残すなら wire pane_id を learned の前に入れて
  `muxpub:<scope>:<pane_id>:<learned>` とし、1 接続内の 2 pane が決してエイリアスしないようにする。
  併せて、受理した ID が変わったときに旧限流エントリを削除する

  ## 完了の定義（必須）
  - [ ] 再現手順で現象が起きない
  - [ ] 「同一 scope・異なる pane_id で daemon が同じ learned id（および空文字列）を返しても
  導出キーが異なる」ケースのテストがある
  - [ ] 「daemon が `public_pane_id` をローテーションしても新しいバケットを得られない」
  ケースのテストがある

  ## 該当箇所（任意）
  - `src-tauri/src/app/agent_status.rs:119-122` — learned-id ブランチのキー導出
  - `src-tauri/src/app/agent_status.rs:321-322` — 更新のたびに学習済み ID を上書きする取り込み経路
  - `src-tauri/src/app/mod.rs` — `App::agent_notification_rate_limiter`（剪定されない `HashMap`）

  ## 実害・発生条件（任意）
  発生条件: 改変された、あるいは侵害された mux daemon に attach すること。
  信頼できる自分のサーバーだけに接続している限りは発生しない。
  PR #55 で予約形（`tab:` / `mux:`）との衝突は塞がれているため、残っているのは
  同一 scope 内に限定された影響とメモリ増加。

  ## Notion タスク
  https://www.notion.so/3d23509ec8ee8146a981dc9f00d11f89

