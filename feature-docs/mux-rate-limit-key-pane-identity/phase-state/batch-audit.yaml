      - VERIFICATION.md の Verification Summary 自身が MV-1 を "MV-1 supplements AC-9"
        と位置づけており、AC-9 の主たる検証手段は TS-4

      採用した判定に伴う注記（verify step の manual_items_note に記録）:
      MV-1 / MV-2 / MV-3 はいずれも無人実行のため未実施。MV-1 の対象 UI サーフェスと
