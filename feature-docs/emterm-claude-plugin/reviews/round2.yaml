findings:
  - stable_id: sc-display-shell-inject
    severity: medium
    category: security
    file: plugins/emterm/skills/display-markdown/SKILL.md
    line: 8
    title: "Display skills can interpolate malicious file names into shell commands"
    description: "display-markdown/json/yaml/image SKILL.md all direct the model to substitute <file> directly into a shell-form command without requiring argv-based execution or shell escaping. A contributor-controlled file named 'report.md; touch PWNED' executes the appended command when rendered. Same class of issue as sc-mux-send-shell-inject that was fixed for the mux skills; the display skills were not similarly hardened. Applies to all 4 display SKILL.md files."
    suggestion: "Update all four display skills to require passing the path as a single argv element through a no-shell subprocess API. If a shell is unavoidable, require standard shell escaping and an end-of-options delimiter where supported."
    sources: [codex:security]
    confidence: 50
    resolution: declined
    resolution_reason: "SPEC v0.1.0 scope. The mux-send hardening pattern applies but requires the same wording pass across four files. Tracked as a follow-up: schedule for a v0.1.1 or v0.2.0 hardening pass. Impact is bounded — the attacker must control the file path AND the user must invoke the skill on that path, and the exposure is comparable to any shell one-liner touching an untrusted path. Not a v0.1.0 blocker."
  - stable_id: pf-sigkill-not-escalated
    severity: medium
    category: performance
    file: plugins/emterm/hooks/scripts/notify-status.ts
    line: 163
    title: "Timed-out child process is not forcibly reaped, can leak processes/fds"
    description: "After SIGTERM on timeout, proc.killed becomes true when the signal is sent (not when the child actually exits), so the grace-period SIGKILL escalation never fires for a child that ignores SIGTERM. Additionally run() resolves on timeout and the caller exits shortly after, potentially preempting the grace-timer callback. A wedged emterm ignoring SIGTERM would leak a process and its pipe."
    suggestion: "Escalate based on proc.exited settling, not proc.killed. Race proc.exited against the grace timer; unconditionally SIGKILL if the timer wins, then await proc.exited before run() resolves."
    sources: [codex:performance]
    confidence: 50
    resolution: declined
    resolution_reason: "SPEC v0.1.0 scope. Impact is bounded — only triggers when emterm both hangs AND ignores SIGTERM, which is uncommon. Under normal SIGTERM-honoring behavior the code works correctly. Track as follow-up for hardening."
  - stable_id: pf-writesync-blocks-tty
    severity: medium
    category: performance
    file: plugins/emterm/hooks/scripts/notify-status.ts
    line: 188
    title: "Blocking writeSync to /dev/tty can stall the hook past its internal deadline"
    description: "The internal timeout is canceled before the tty write, and writeSync on a blocking /dev/tty fd can block until the OS-level PTY queue drains. If the terminal is stalled or its output queue is full, this can hang until Claude Code's outer 3s hook timeout kills the process."
    suggestion: "Open /dev/tty with O_NONBLOCK and treat EAGAIN/short writes as silent best-effort failure (drop since the status update is stale by the time it could be retried)."
    sources: [codex:performance]
    confidence: 50
    resolution: declined
    resolution_reason: "SPEC v0.1.0 scope. Stall is bounded by outer 3s hook timeout, and the OSC payload is ~30 bytes which almost never triggers backpressure on a working /dev/tty. Track as follow-up hardening."
