    description: "SPEC NFR3 states every plugin path must remain relative to ${CLAUDE_PLUGIN_ROOT}, with nothing under '../' or outside the plugin directory because external references are not preserved in the plugin cache. This test traverses four parent directories to read repository-root files."
    suggestion: "Keep plugin-contained tests rooted within plugins/emterm/, and move repository-level marketplace assertions to a test outside the plugin directory (or accept as a repo-level test that runs only in-tree)."
