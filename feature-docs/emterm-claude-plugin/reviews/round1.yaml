findings:
  - stable_id: sp-hang-timeout-fr4
    severity: high
    category: spec
    file: plugins/emterm/hooks/scripts/notify-status.ts
    line: 90
    title: "A hung emterm process cannot degrade to exit 0"
    description: "SPEC FR4 requires timeouts to result in exit 0, but the real spawn awaits the child's exit indefinitely without an internal deadline. If emterm hangs, Claude Code's 3s hook timeout kills the script before run() can return 0, violating the required silent failure semantics."
    suggestion: "Apply an internal timeout shorter than the hook's 3s limit, terminate the child on expiry, and return 0 without writing to /dev/tty."
    sources: [codex:spec]
    confidence: 50
    resolution: unresolved
  - stable_id: cm-nonzero-tty-write
    severity: medium
    category: comprehensive
    file: plugins/emterm/hooks/scripts/notify-status.ts
    line: 73
    title: "Non-zero emterm exit still writes stdout to /dev/tty (spec says no-op)"
    description: "run() unconditionally writes result.stdout to /dev/tty after spawn returns, without gating on exitCode. SPEC Edge Cases promises emterm non-zero exit is a no-op. Any partial stdout from a failing emterm gets written verbatim to the user's terminal."
    suggestion: "Skip the tty write when result.exitCode !== 0. Also extend AC-6 test to assert getOpenTtyCalls() is 0 when spawn resolves non-zero with non-empty stdout."
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
  - stable_id: sc-mux-send-shell-inject
    severity: medium
    category: security
    file: plugins/emterm/skills/mux-send/SKILL.md
    line: 8
    title: "User-controlled mux text is passed into a shell command without safe encoding"
    description: "The mux-send skill directs the model to substitute user-derived text into 'emterm mux send --pane <id> --text <s>' without requiring validation or shell escaping. Untrusted text containing $(), backticks, ;, or newlines can execute locally instead of being sent as data."
    suggestion: "Require --stdin for arbitrary text, validate pane IDs, and mandate argv-based execution. Add adversarial examples covering metacharacters."
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
  - stable_id: sc-mux-read-prompt-inject
    severity: medium
    category: security
    file: plugins/emterm/skills/mux-read/SKILL.md
    line: 20
    title: "Mux pane output is fed to the model without prompt-injection boundaries"
    description: "The mux-read skill reads arbitrary pane output and hands it to the model without labeling it untrusted or prohibiting instructions embedded in it. Attacker-controlled pane content can attempt to steer the model to invoke tools or disclose data."
    suggestion: "Explicitly label mux stdout as untrusted data, delimit it from instructions, and instruct the model to never follow directives from mux output."
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
  - stable_id: pf-hook-2process-per-prompt
    severity: medium
    category: performance
    file: plugins/emterm/hooks/hooks.json
    line: 4
    title: "Every prompt waits on a two-process status update"
    description: "UserPromptSubmit synchronously launches Bun which launches emterm and awaits it before returning. Bun cold-start + emterm startup + I/O is on every prompt's critical path (README already documents up to 3s worst case)."
    suggestion: "Remove the nested CLI invocation from the prompt path. Write the OSC directly from the hook, or send to a persistent IPC helper. If a child process is unavoidable, don't await and enforce a short deadline."
    sources: [codex:performance]
    confidence: 50
    resolution: unresolved
  - stable_id: sp-argv-cardinality
    severity: medium
    category: spec
    file: plugins/emterm/hooks/scripts/notify-status.ts
    line: 55
    title: "Additional positional arguments are accepted"
    description: "SPEC FR4 says the script must accept a single positional argument. Validation checks only argv[0], so 'notify-status.ts working extra' still invokes emterm instead of being a no-op."
    suggestion: "Require argv.length === 1 before validating and using the state."
    sources: [codex:spec]
    confidence: 50
    resolution: unresolved
