  - "Fresh worktrees break the src-tauri build: gitignored bundled fonts (src-tauri/assets/fonts/) are absent so build.rs panics. Both the implementer (task worktree) and the orchestrator (integration worktree, verify phase) had to symlink the 7 font binaries from the main tree. A planner/protocol-level pre-step (or make fetch-fonts equivalent) for this repo would avoid rediscovering it every wave."
