findings:
  - stable_id: arch-osc-wiring-ssot
    severity: medium
    category: architecture
    file: src-tauri/src/tabs.rs
    line: 881
    title: "Live-core wiring contract duplicated between Tab::new and apply_offthread_swap with no shared SSOT"
    description: >-
      The app-param OSC registration a live tab core must carry is hardcoded
      at two sites: Tab::new (tabs.rs:454) and apply_offthread_swap
      (tabs.rs:881), both literally
      register_osc_app_param(MUX_OSC_PARAM, OSC_MUX_INBAND). Nothing at
      compile time or test time forces the two lists to stay in sync — if a
      second app-param registration is later added in Tab::new without
      mirroring it in the swap path, the swapped-in core silently loses it on
      every >64KB off-thread window switch, reintroducing the bug class this
      task fixes. Codex additionally notes Tab::new seeds cursor blink/style
      defaults (tabs.rs:438,443) that the swap path does not replay — though
      the comprehensive reviewer verified those ARE carried by the snapshot
      itself (snapshot.rs:296-299), so the concrete drift risk is the
      registration list, and the broader suggestion is a single live-core
      wiring/promotion helper.
    suggestion: >-
      Extract the live-core app-layer wiring into a single helper (e.g. a
      function performing every register_osc_app_param call) called from both
      Tab::new and apply_offthread_swap; or at minimum add a test asserting
      the swapped-in core's registered app-params equal a freshly-built
      core's, so drift fails a test instead of silently regressing.
    sources: [claude:architecture, codex:architecture]
    confidence: 95
    resolution: unresolved
    resolution_reason: "medium — auto-fix gate is critical/high only; left for discretionary follow-up"
  - stable_id: spec-ts6-sync-test-gap
    severity: medium
    category: spec
    file: src-tauri/src/tabs.rs
    line: 6211
    title: "TS-6 synchronous replay callback-preservation regression test not added"
    description: >-
      SPEC TS-6 requires a regression scenario that synchronous replay
      (< 64 KB) keeps callbacks. The added tests cover the off-thread
      transplant (TS-1..TS-5, TS-7) but no new sub-threshold test asserts
      callbacks still fire after a synchronous replay; existing sub-threshold
      tests only assert routing/no-pending-switch. NFR1 is behaviorally
      satisfied (sync path untouched, verified by reviewers), but the
      explicit TS-6 test artifact is missing.
    suggestion: >-
      Add a unit test that feeds a <64 KB snapshot through the synchronous
      replay path, then sends callback-driven output (e.g. OSC title change)
      and asserts the pre-existing callback wiring still fires.
    sources: [codex:spec]
    confidence: 50
