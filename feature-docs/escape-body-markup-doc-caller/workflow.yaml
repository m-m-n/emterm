goal: '# escape_body_markup の doc コメントに古い「sole caller」記述が残っている


  Notion: https://www.notion.so/3e63509ec8ee81449cdfe16c1a363c02 (種別: 改善)


  ## やりたいこと (必須)

  `src-tauri/src/callbacks.rs` の `escape_body_markup` の doc コメントを実態に合わせて更新する。

  ## 背景・なぜ (必須)

  `escape_body_markup` の doc コメントに「sole caller (`NotifyRustSink::send`)」という記述が残っているが、通知ワーカースレッド化と PR https://github.com/m-m-n/emterm/pull/98
  以降の呼び出し関係と合っていない。

  - 検出元: em-workflow feature `notification-capability-query-skip` の review round1 評価者メモ（medium 未満のため finding
  化されていない）

  - 記録: `feature-docs/notification-capability-query-skip/reviews/round1.yaml`、`feature-docs/notification-capability-query-skip/retrospect.yaml`

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] `escape_body_markup` の doc コメントが実際の呼び出し元を正しく述べている

  - [ ] `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` が通る

  ## スコープ外 (任意)

  - エスケープ処理の内容変更

  ## 制約・前提 (任意)

  - PR https://github.com/m-m-n/emterm/pull/98 がマージされた後の状態を前提に着手すること

  '
