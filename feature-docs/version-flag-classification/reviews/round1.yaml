    file: src-tauri/src/arg_dispatch.rs
    line: 172
    title: "ヘルプが約束する --version の挙動と実装が位置依存でずれる"
    description: >-
      usage の Options に追加された行は "--version              Print version and
      exit" と書かれているが、実際にバージョンを印字して exit するのは main.rs の
      早期処理が見る第 1 引数位置のときだけ。それ以外の位置では classify が Proceed
      を返し、run_gui は target=None のエントリを読み飛ばすため、何も印字せず処理が
      続く。例: `emterm --settings --version` は設定ウィンドウを開き、
      `emterm foo --version` はフル端末 GUI を起動する。本変更前は両者とも
      unrecognized argument で exit 2 だったので、「エラーで気付ける」状態から
      「黙って別の動作をする」状態へ変わっている。位置依存そのものは SPEC の
      Assumption A1 で明示的に許容した決定だが、ヘルプ文言案 A3 は
      "Print the version" であり、実装文言の "and exit" のほうが強い約束をしている。
    suggestion: >-
      (a) 挙動を約束に合わせる: Classification に Version バリアントを足し、classify
      が --help 優先の走査中に --version を検出したら Version を返して main.rs 側で
      印字・exit 0 する。または (b) 約束を挙動に合わせる: usage の文言を位置依存だと
      分かる表現に直し、A1 を確認済みの決定として明示する。
    sources: [claude:comprehensive]
    confidence: 80
    resolution: unresolved
    resolution_reason: "severity medium — auto-fix ゲート (critical/high) の対象外。人間の評価に委ねる"
