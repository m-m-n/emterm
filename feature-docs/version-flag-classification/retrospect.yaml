    pass/fail を決めると恒常的に fail になるため、VERIFICATION.md に known-flaky
    除外を明記して個別判定した。プロジェクト側の恒久対処（#[ignore] 化など）が
    無い限り、以後の feature でも同じ判定が必要になる。
  - >-
    レビューで medium 3 件（うち 2 件は architecture 観点の SSOT 二重管理指摘）が
    出たが、auto-fix ゲートが critical/high 限定のため未解決のまま完了した。
    「本 feature が直した drift と同種の再発を防ぐ不変条件テストが無い」という
    指摘は、バグ修正 feature では特に拾う価値がある可能性がある。
