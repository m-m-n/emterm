  - stable_id: 8a413aacdea1392a
    severity: high
    category: spec
    file: src-tauri/src/mux/scrollback_filter.rs
    line: 288
    title: "Unbounded CSI parameter parsing can panic or misclassify oversized parameters"
    description: >-
      `first_param = first_param * 10 + u32::from(b - b'0')` accumulates the
      first CSI parameter with non-saturating u32 arithmetic over untrusted
      PTY scrollback bytes. SPEC FR1 / "CSI recognition rules" mandate
      mirroring term_core's ParamParser::get_first_or_zero, which saturates
      (saturating_mul/saturating_add) and clamps at MAX_PARAM_VALUE = 9999
      (crates/term_core/src/parser_params.rs:56-59). A parameter with >= 10
      decimal digits (e.g. `ESC[9999999999n`) overflows: under
      overflow-checked builds (default cargo test / debug) this panics —
      violating SPEC "Security Considerations: must never panic on arbitrary
      bytes" — and in release it wraps silently, which can misclassify an
      oversized parameter (e.g. wrap to 5) and strip a CSI term_core would
      not answer.
    suggestion: >-
      Mirror term_core's saturating/clamped accumulation:
      `first_param = first_param.saturating_mul(10).saturating_add(u32::from(b - b'0'));`
      (optionally clamp to 9999 to match MAX_PARAM_VALUE). Add a keep-set
      test with an overflow-length param (e.g. `ESC[99999999999n`).
    sources: [claude:spec, codex:spec]
    confidence: 100
    resolution: fixed
    resolution_reason: "task0002 で saturating 化+回帰テスト追加、round 2 で保持確認"
