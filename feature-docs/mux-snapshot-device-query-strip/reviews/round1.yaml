  - stable_id: a723f48f748c0dd2
    severity: medium
    category: security
    file: src-tauri/src/mux/scrollback_filter.rs
    line: 343
    title: "DA/DECRPM strip predicate is stricter than term_core, leaving a replay response-injection gap"
    description: >-
      term_core dispatches on (intermediates.first(), final_byte) and
      truncates intermediates to MAX_CSI_INTERMEDIATES=2, ignoring extras.
      The filter is stricter on two arms: DA requires intermediates.is_empty()
      (so `ESC[?1!c`, `ESC[> c` are answered by term_core but KEPT by the
      filter), and DECRPM requires intermediates == [b'$'] exactly (so
      `ESC[?2026$$p`, `ESC[?2026$ p` are answered but KEPT). Any program can
      plant such a malformed-but-accepted query in scrollback; the next
      replay injects the stale response into shell stdin. Impact bounded
      (term_core-generated, newline-free responses, no attacker-controlled
      content), but it is a concrete completeness gap in the exact control
      this diff adds. The `n` / `t` arms are unaffected.
    suggestion: >-
      Relax the two arms to match term_core: for DA, with private marker
      `?`/`>` answer regardless of trailing intermediates; bare form keeps
      requiring empty intermediates; `<`/`=` never strip. For DECRPM, check
      only the first remaining intermediate equals `$`. Add regression cases
      for `ESC[?1!c`, `ESC[> c`, `ESC[?2026$$p`.
    sources: [claude:security, codex:security]
    confidence: 95
    resolution: fixed
    resolution_reason: "task0002 で DA/DECRPM 判定を term_core dispatch に合わせて緩和+回帰テスト追加、round 2 で保持確認"
  - stable_id: b476af92c46063c4
    severity: medium
    category: performance
    file: src-tauri/src/mux/scrollback_filter.rs
    line: 268
    title: "CSI scanner buffers unbounded data before knowing the sequence will be stripped"
    description: >-
      `scan_csi_device_query` collects `intermediates` and embedded C0 bytes
      into Vecs while scanning every CSI candidate. For a preserved or
      unterminated CSI with a large intermediate run (e.g. `ESC[` followed by
      a long 0x20..0x2F run) the snapshot path allocates transient memory
      proportional to that segment only to return None and drop it. Common
      traffic (SGR, cursor motion) never pushes, so the Vecs stay
      non-allocating; the regression is limited to pathological runs.
    suggestion: >-
      Track scalar intermediate state (empty / only-dollar / other) instead
      of buffering, and defer collecting embedded C0 bytes until a final byte
      proves the CSI is a strippable query (bounded second pass).
    sources: [codex:performance]
    confidence: 50
    resolution: declined
    resolution_reason: >-
      ユーザー判断で却下(2026-07-07)。一時確保は1つの CSI 候補長に有界で、
      通常トラフィック(SGR/カーソル移動)は push が発生せず非アロケート。
      病的入力限定の一時肥大に対し、スカラー状態化+二段パースの複雑度増は
      見合わないと判断。
