lessons_candidates:
  - >-
    The create-spec phase caught that an acceptance criterion supplied in the
    task description was unsatisfiable by construction (the deletion branches
    can never fire on the scroll path, so "removing them turns the test red"
    could not hold). Detecting this before planning, and restating the criterion
    against the reachable mechanism instead, avoided handing the implementer an
    impossible requirement. The signal was requirements-analyst reading the
    source rather than accepting the task text at face value.
  - >-
    Writing an acceptance criterion as a whole-command gate ("cargo fmt --check
    is clean") makes a feature accountable for pre-existing repository state it
    did not cause. It cost one full verify + rework cycle here. The rework was
    ultimately the right outcome (the drift was small and in test code), but the
    criterion's wording is what forced the detour rather than a deliberate
    decision to clean it up.
  - >-
    The comprehensive reviewer found that the NEW test has the same shape of
    weakness the feature exists to fix: it cannot observe row-scoping, so an
    overflow-table-wide clear() regression would keep it green. Worth noting
    that a feature correcting a vacuous test can reintroduce a narrower version
    of the same gap, and that the SPEC's enumerated assertion list is what
    bounded it.
