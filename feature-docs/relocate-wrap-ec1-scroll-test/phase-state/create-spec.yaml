    freeform: null
    normalized_answer: >-
      Skip the design step; skipped_reason: test-only change inside the
      pure-Rust term_core crate with no UI surface, no visual artifact and no
      public API change.
    resolution_note: >-
      batch: gate create-spec.design-step -> batch-policies.yaml
      option_id decide_autonomously (a policy directive naming a decision
      procedure, in the same idiom as create-spec.design-system's
      top_candidate_or_none, not a literal packet option). The orchestrator
      decided autonomously and selected the packet option `skip`, matching
      requirements-analyst's design_step_recommendation.
assumptions:
  a1:
    statement: >-
      "The deletion branch is actually executed" means the branch at
      print_handler.rs:493/518 evaluates its remove(...) and that removal is
      observable, not merely that the guard expression is reached.
    impact: high
    reversible: true
    recorded_via: create-spec.requirement-clarification (record_as_assumption)
  a2:
    statement: >-
      The full-screen scroll path (no DECSTBM scroll region) is the path EC1
      is meant to cover; the scroll-region path via shift_rows_up is a
      distinct clearing site and out of scope.
    impact: medium
    reversible: true
    recorded_via: create-spec.requirement-clarification (record_as_assumption)
