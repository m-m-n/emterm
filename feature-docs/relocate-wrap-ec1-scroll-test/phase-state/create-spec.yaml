    freeform: null
    normalized_answer: 'Skip the design step; skipped_reason: test-only change inside the pure-Rust term_core
      crate with no UI surface, no visual artifact and no public API change.'
    resolution_note: 'batch: gate create-spec.design-step -> batch-policies.yaml option_id decide_autonomously
