  ec1.approach:
    packet_id: create-spec-q0001
    answered_at: "2026-08-15T21:34:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [b_split]
    freeform: null
    normalized_answer: >-
      Rename the existing EC1 test to a pure no-panic claim with a corrected
      comment, and add a separate test that pins ring_push_blank's
      eviction-time overflow clearing independently (no relocation involved).
    resolution_note: >-
      batch: gate create-spec.requirement-clarification -> action
      codex_consultation. Codex (readonly, 1 turn) suggested b_split; the
      orchestrator judged that it maps onto the packet option b_split, which
      also matches requirements-analyst's own recommendation. Rationale:
      approach (a) alone leaves the test green when either mechanism is
      broken in isolation.
  ec1.deletion-branch-red-criterion:
    packet_id: create-spec-q0001
    answered_at: "2026-08-15T21:34:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [retarget_eviction]
    freeform: null
    normalized_answer: >-
      Restate the red-on-removal criterion so the scroll-path test goes red
      when ring_push_blank's overflow_clear_row / overflow_ridx_clear_row
      calls are removed. The relocation deletion branches stay pinned by the
      existing TS1 on the no-scroll path.
    resolution_note: >-
      batch: gate create-spec.requirement-clarification -> action
      codex_consultation. Codex suggested retarget_eviction; the orchestrator
      judged the mapping onto that packet option. The literal criterion is
      unsatisfiable on the scroll path because both scroll implementations
      clear the recycled row's overflow keys before the relocated writes run.
  design.step:
    packet_id: create-spec-q0001
    answered_at: "2026-08-15T21:34:00+09:00"
    source: batch-decision-table
