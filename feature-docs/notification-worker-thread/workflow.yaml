schema_version: 1
feature: notification-worker-thread
created: 2026-09-14
base_branch: main
goal: |
  デスクトップ通知の同期 D-Bus 呼び出しをワーカースレッドへ逃がす

  ## やりたいこと（必須）
  デスクトップ通知の送出を専用ワーカースレッドへ逃がし、同期 D-Bus 呼び出しが winit イベントループを塞がないようにする。

  ## 背景・なぜ（必須）
  `App::notify` → `NotifyRustSink::send` → `notify_rust::Notification::show()` は Linux で同期 D-Bus RPC を呼び出しスレッドで実行し、この経路は winit イベントループの `about_to_wait` から走る。active-window-agent-notification（PR: https://github.com/m-m-n/emterm/pull/29 ）で可視ペイン通知を既定 ON にしたことで、ユーザーが操作中のフレームでも同期ラウンドトリップが発生するようになった。
  発火頻度はペインあたり 30 秒の rate limit で上限が付くため critical/high ではないが、hot path のブロッキング I/O として修正価値がある。
  - 該当箇所: `src-tauri/src/app/agent_status.rs:191`
  - レビュー finding: `4f3d5c66b7ca025e`（severity medium / category performance / confidence 60）
  - 記録: `feature-docs/active-window-agent-notification/reviews/round1.yaml`

  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] `NotifyRustSink::send` を専用ワーカースレッド + bounded channel で非同期化する
  - [ ] チャネル満杯時は drop する（既存の「抑止された通知は捨てる」方針と一致）
  - [ ] `NotificationSink` トレイト境界を変えない
  - [ ] `TestSink` を使う既存テストがそのまま通る
  - [ ] `cargo test --lib` が通る

  ## スコープ外（任意）
  - 通知本文のサニタイズ（別タスク）
  - 通知の発火条件・rate limit の変更

  ## 制約・前提（任意）
  - 本 finding は `em-workflow/active-window-agent-notification/integration` ブランチ（PR #29、main 未マージ）に対するレビューで検出された。着手時点の main の状態を確認すること。
  - ワーカースレッドのライフサイクル（アプリ終了時の join / detach）を明示的に決めること。
parent_branch: em-workflow/notification-worker-thread/integration

