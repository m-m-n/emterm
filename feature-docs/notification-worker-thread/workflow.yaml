      their own — the two diffs reported inside `callbacks.rs` / `callbacks/tests.rs`
      sit in pre-existing osc-color-query-response code, and the rest of the drift is
      project-wide and pre-existing (VERIFICATION.md's Code Quality note limits
      formatting to feature-touched changes). Static TS9: (a) the `NotificationSink`
      trait declaration is byte-identical to `main`, (b) `send` performs only
      `queue.try_submit`, (c) the dispatch call carries no cfg branching, (d) no new
      process-global once-only initialization, (e) no producer call site changed —
      the only production edit outside `callbacks.rs` is the single `NotifyRustSink::new()`
