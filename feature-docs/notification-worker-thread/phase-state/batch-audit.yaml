records:
  - question_id: create-plan.open-question.shutdown-join-deadline
    packet_id: null
    answered_at: "2026-09-14T23:02:10+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [deadline_200ms]
    freeform: null
    normalized_answer: "Keep the bounded shutdown join deadline at the planned named constant of at most 200 ms, detaching past the deadline."
    resolution_note: >-
      user-instructed Codex consultation (not a gate). Codex CLI native provider hit its
      usage limit, so the consultation ran through the same Codex CLI harness routed via the
      local LiteLLM proxy (muse-spark, Meta Standard tier, read-only sandbox). Options weighed:
      200 ms (plan), 50 ms, 500 ms-1 s. Codex recommended 200 ms and the orchestrator adopted it,
      so IMPLEMENTATION.md D2 is unchanged. Rationale: on a normal exit the worker is parked in
      recv() and joins immediately once the sender drops, so the deadline is not actually paid;
      the 327 #[test] functions in files calling App::new() drop the sink before ever sending,
      and CI has no D-Bus peer to block on, so there is no serial accumulation across the suite.
      50 ms only lowers the delivery rate of the last in-flight notification without shortening
      test time; 500 ms-1 s adds perceptible exit latency without a matching delivery gain,
      because a local D-Bus peer is either fast or wedged, with little in between.
  - question_id: create-plan.task-decomposition
    packet_id: null
    answered_at: "2026-09-14T23:02:10+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [single_task]
    freeform: null
    normalized_answer: "Keep the plan at a single task (task0001) rather than splitting the enqueue side from the worker/shutdown side."
    resolution_note: >-
      user-instructed Codex consultation (not a gate). Same LiteLLM-routed Codex harness as above.
      Options weighed: one task (plan) vs two tasks (enqueue/drop-observability, worker/shutdown).
      Codex recommended one task and the orchestrator adopted it, so the workflow patch is unchanged.
      Rationale: the queue, the worker and Drop are internal state of one struct and cannot be cut
      apart - either half alone is a sender with no receiver or a worker with no producer. Both
      halves would edit the same callbacks.rs, which collides under em-workflow's parallel worktrees,
      and the real change is one replacement in callbacks.rs plus a single line in app/mod.rs plus
      tests, which is reviewable as one unit.
  - question_id: verify.test-command-substitution
    packet_id: null
    answered_at: "2026-09-14T23:52:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [substitute_lib_and_integration_tests]
    freeform: null
    normalized_answer: >-
      Substitute the pre-approved `--lib` and `--test cli_subcommands` commands for
      VERIFICATION.md's prescribed bare `cargo test`, treat Test Verification as satisfied,
      and record the examples-compilation breakage as a pre-existing environment defect
      rather than a failure of this feature.
    resolution_note: >-
      Unlisted-gate fallback (references/batch-mode.md). VERIFICATION.md prescribes
      `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml`,
      which fails to COMPILE for a reason unrelated to this feature: `cargo test` also builds
      `examples/`, and `src-tauri/examples/swash_emoji.rs:22` does
      `include_bytes!("../assets/fonts/NotoColorEmoji.ttf")`, a file `scripts/fetch-fonts.sh`
      never downloads (it fetches Noto-COLRv1.ttf, NotoEmoji-Regular.ttf and others). The
      fonts directory is gitignored (`*.ttf`), and the identical `include_bytes!` line is
      present on `main`, so the breakage is pre-existing and feature-independent.
      Options weighed: (1) record verify as FAILED; (2) substitute the pre-approved
      `--lib` + `--test cli_subcommands` commands and file the examples gap separately;
      (3) fix the examples breakage inside this feature branch.
      Codex was consulted twice. The native Codex CLI provider was unavailable (usage limit,
      resets 2026-09-19), so the consultation ran through the same Codex CLI harness routed
      via the local LiteLLM proxy (muse-spark, read-only sandbox) that this feature's earlier
      create-plan consultations used. Codex recommended option 2 and the orchestrator adopted
      it — this also coincides with the minimum-side-effect option. Rationale: option 1 would
      misattribute an environment gap to the feature and destroy the signal fidelity of a
      FAILED verdict; option 3 would let an unattended verify phase silently widen into
      unrelated repository repairs, violating scope discipline. Option 2 keeps both, at the
      cost of one follow-up item recorded in the run report.
      Evidence gathered under the substitution: `cargo check` (gui) pass,
      `cargo check --no-default-features` pass (TS7), `cargo test --lib -- --test-threads=1`
      3347 passed / 0 failed / 3 ignored (including all six new
      `callbacks::tests::worker_thread::*` tests, TS1-TS4/TS8, plus the TS5/TS6 regression
      suites), `cargo test --test cli_subcommands` 26 passed / 0 failed.
