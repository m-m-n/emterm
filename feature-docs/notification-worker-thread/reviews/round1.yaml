findings:
  - stable_id: 83dd237ffa3f8306
    coupling_id: e47961e366ade6ee
    severity: medium
    category: comprehensive
    file: src-tauri/src/callbacks.rs
    line: 273
    title: "try_submit treats Disconnected as \"queue saturated\", so a dead worker silently drops every later notification under a misleading warning"
    description: |
      NotifyQueue::try_submit matches self.tx.try_send(...) with a single Err(_) arm, so
      TrySendError::Full (transient) and TrySendError::Disconnected (the worker's Receiver was
      dropped) are indistinguishable. The only way to reach Disconnected is a panic inside
      notify_worker (callbacks.rs:299-340) - the error paths of get_capabilities() and
      Notification::show() are both handled, so this requires a panic from inside notify-rust
      itself; likelihood is low. The consequence is permanent: armed is only re-set to true on a
      successful try_send (line 270), so after the single LOG_NOTIFY_QUEUE_SATURATED warn fires,
      armed stays false for the rest of the process and every subsequent notification is dropped
      with no record. D1's per-episode suppression is designed for a condition that drains; it is
      applied unchanged to a condition that never does. The emitted warn also misdiagnoses the
      failure - it names queue saturation when the worker is gone. SPEC has no requirement covering
      worker death, so this is a robustness gap rather than a spec violation.
    suggestion: |
      Split the error arm on crossbeam_channel::TrySendError::{Full, Disconnected}. Keep the current
      D1 episode arming for Full. For Disconnected, emit a distinct log::error! under its own
      constant (e.g. LOG_NOTIFY_WORKER_DEAD) suppressed by a separate flag that the episode re-arm
      never touches, so the permanent condition is diagnosable exactly once and is never mislabelled
      as saturation. Adding a SubmitOutcome::WorkerGone variant makes it directly testable
      (construct the queue, drop the receiver, call try_submit) with no D-Bus involvement, matching
      NFR4.
    sources: [claude:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity: outside the auto-fix candidate gate (critical/high only)"
  - stable_id: ed298275d659ab26
    coupling_id: ffe4b0a15759144a
    severity: medium
    category: comprehensive
    file: src-tauri/src/callbacks/tests.rs
    line: 1227
    title: "AC-1/AC-6 tests construct the real NotifyRustSink, so cargo test dispatches real desktop notifications - contrary to SPEC TS1/TS4/NFR4's headless requirement - while the worker body stays untested"
    description: |
      sink_send_never_blocks_the_caller_even_past_queue_capacity (tests.rs:1227) builds a real
      NotifyRustSink::new() and sends NOTIFY_QUEUE_CAPACITY * 4 = 32 items;
      dropping_the_sink_after_sending_returns_within_the_shutdown_deadline (tests.rs:1247) sends 3
      more. The spawned notify_worker genuinely drains the queue and calls
      notify_rust::get_capabilities() + Notification::show(), so on any developer box with a running
      notification daemon cargo test now pops roughly a dozen real desktop notifications per run.
      This is newly introduced: no test in the pre-task tree constructed the sink (it was a unit
      struct), and the only production construction site is app/mod.rs:574. SPEC is explicit that
      this layer is to be headless: TS1 requires the queue abstraction be verified decoupled from
      the notify-rust transport, TS4 marks the shutdown scenario headless, and NFR4 requires queue
      behavior be unit-testable without a D-Bus connection. The same rigidity - notify_worker calls
      notify_rust directly with no injectable dispatch step - is why task0001.tests.yaml records
      AC-5 with tests: [] and red_confirmed: false.
    suggestion: |
      Make the worker's dispatch step injectable without touching the NotificationSink trait
      (FR2/AC2 constrain only the trait declaration, not the sink's internals): extract notify_worker
      into a form taking a dispatch closure, pass the notify-rust closure in production and a
      recording fake in tests. That turns AC-5 into real coverage of call order and frequency, and
      lets AC-1/AC-6 exercise send/Drop without any D-Bus traffic, satisfying TS1/TS4/NFR4. If the
      injection is judged out of task scope, the bounded stopgap is to mark the three real-sink
      tests #[ignore] and rebuild AC-1/AC-6 on NotifyQueue plus an explicitly spawned test worker,
      so no unit test constructs the production sink.
    sources: [claude:comprehensive]
    confidence: 80
    resolution: unresolved
    resolution_reason: "medium severity: outside the auto-fix candidate gate (critical/high only)"
