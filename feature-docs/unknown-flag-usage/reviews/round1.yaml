    description: >-
      classify(&args[1..]) はスライスのレンジ index なので args.len() == 0 のとき
      panic し exit code 101 になる。std::env::args() は argc==0（空 argv で
      execve された場合）に空のイテレータを返すため、この経路は到達可能。直前の
      subcommand dispatch は args.get(1) を使っていて空 argv でも安全だったので、
      この diff で新しく panic 経路が entry point に入った。実害は usage を出して
      終わるはずの場面で panic メッセージが出るだけだが、修正は 1 行で済む。
    suggestion: >-
      レンジ index をやめて args.get(1..).unwrap_or_default() で安全に取得する
      （&[T]: Default により空スライスが返る）。
