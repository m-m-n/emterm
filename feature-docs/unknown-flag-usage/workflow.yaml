project:
  license: MIT
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: ""
      e2e_test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --test cli_subcommands"
    cli:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib --no-default-features"
      format_command: ""
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: 3cbfd169e5b73a3283f3f0a1876540df591b5bbb
  - id: design
    artifacts: [DESIGN.md, design/]
    status: skipped
    skipped_reason: "可視 UI が無く、出力は stdout / stderr のテキストのみ"
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: completed
  - id: implement
    status: completed
    completed_at_commit: 896c9a5889bd0a2dddbc1655e3496970ee852351
    base_commit: a1671802820c74c025f36683292ac1029a261e89
  - id: review
    status: completed
    completed_at_commit: c1689a0a78ee6adbb5e05e4196d74c2d4944c6d5
  - id: verify
    status: completed
    result: pass
    failed_items: []
    notes: >-
      TS-1..TS-10 / TS-12 は arg_dispatch のユニットテストで pass（gui 10 件 /
      CLI-only 9 件）。TS-11 は cli_subcommands 21 件 pass。TS-13 は実装テストが
      guidance 行のみを assert する部分実装だったため usage_text() の内容を直接
      照合して pass を確認（全サブコマンド名・`-h, --help` 行・5 つの
      child-window フラグ・guidance 行がいずれも存在）。テスト側の不足は review
      round1 の findings eeb1ad1c8abe0975 / b0eb4d32b06cd81c として記録済み。
      SC-1..SC-4 pass、SC-5 は main.rs の classify 呼び出しが logging::init() と
      全ウィンドウ生成より前にあることをコード照合で確認。
      cargo check は default / --no-default-features の双方 pass。
      full --lib は tabs::tests 7 件が失敗するが、同一の 7 件が変更前の main
      作業ツリー（aad6e6e）でも --test-threads=1 で同様に失敗するため本 feature の
      回帰ではない（diff は arg_dispatch.rs / lib.rs / main.rs のみで tabs.rs に
      触れていない）。MT-1..MT-4 はリリースビルドでの人手確認のため本 run の
      対象外。
  - id: retrospect
    status: pending

