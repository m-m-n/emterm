schema_version: 1
feature: sftp-send-scan-crlf
created: 2026-09-25
base_branch: main
goal: |
  SFTP send-site 構造検査が CRLF 作業コピーで MissingBoundary になる

  ## 現象 (必須)
  `src-tauri/src/sftp/service.rs` の構造検査テスト `every_progress_and_result_send_site_routes_through_the_wake_helpers` が、CRLF 改行の作業コピーでは正しいコードでも panic する。
  `find_mod_tests_boundary` は `"#[cfg(test)]" + "\n" + "mod tests"` を連結した文字列を `src.find` で探している。テストは `std::fs::read_to_string` で自分のソースを読むため、CRLF の作業コピーでは `#[cfg(test)]\r\nmod tests` になって一致せず、`MissingBoundary` になる。
  変更前の実装（`split("#[cfg(test)]")`）は改行コードに依存していなかったので、feature `test-seam-serialization` で入った後退になる。
  ## 再現手順 (必須)
  1. リポジトリに `.gitattributes` が無い状態で、`core.autocrlf=true`（Git for Windows の既定）でチェックアウトする
  2. `cargo test --lib` を実行する
  3. `every_progress_and_result_send_site_routes_through_the_wake_helpers` が `MissingBoundary` で panic する
  ## 期待する挙動 (必須)
  改行コードが LF でも CRLF でも `mod tests` の境界を検出し、bare send が無ければテストが通る。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `src-tauri/src/sftp/service.rs:1013`（`find_mod_tests_boundary` の検索条件）
  - 対処案: `scan_for_bare_send_sites` の先頭で `src.replace("\r\n", "\n")` で改行を正規化してから境界を探して走査する（オフセットは正規化後の文字列に対して取る）。`send_site_scan_detection_routine_red_cases` に CRLF の合成テキストのケースを追加し、境界が見つかることと境界より前の bare send を検出することを固定する
  ## 実害・発生条件 (任意)
  Windows 上で `cargo test --lib` を実行すると、無関係な変更でも赤が出続ける。失敗はテストが赤になる形で表に出るため、誤って通ってしまう危険は無い。
  em-workflow feature `test-seam-serialization` の review round 1 で残った medium 指摘（stable_id `4efb8bedd4409a07`）。記録は `feature-docs/test-seam-serialization/reviews/round1.yaml`（ブランチ `em-workflow/test-seam-serialization/integration`）。
