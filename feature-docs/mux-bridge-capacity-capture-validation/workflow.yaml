schema_version: 1
feature: mux-bridge-capacity-capture-validation
created: '2026-09-28'
base_branch: main
goal: '# mux bridge が長さ不正の ClientScrollbackCapacity 本体でも再接続用の保持値を上書きする


  ## 現象

  mux bridge の `capture_if_capacity` はメッセージ種別だけを確認し、ClientScrollbackCapacity のフレーム本体を長さ検証なしで再接続用の保持値（`last_capacity`）に保存する。デーモン側は長さ不正のペイロードを無視して直前の有効値を使い続けるため、正しい通知の後に長さ不正の通知が届くと、bridge
  の保持値とデーモンが使っている値が食い違う。この状態でアップグレード通知による再接続（`reconnect_and_reattach`）が起きると不正な本体だけが再送され、新しい接続は未通知扱いで既定の
  10,000 行に戻る。

  ## 再現手順

  1. bridge 経由で mux に接続し、正しい 4 バイトの ClientScrollbackCapacity（例: 0 や 5）を送る

  2. 続けて長さ不正（4 バイト以外）の ClientScrollbackCapacity を送る

  3. デーモンのアップグレード通知で bridge を再接続させる

  4. 再接続後の接続のプローブ容量が既定の 10,000 に戻っている

  ## 期待する挙動

  再接続後も、直前に受け付けた有効な容量が再送される。

  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある（有効通知 → 長さ不正の通知 → 再接続の順で、有効な本体が再送されることを `src-tauri/src/mux/bridge/tests.rs`
  で確認する）

  ## 該当箇所

  - `src-tauri/src/mux/bridge/forward.rs:294` 付近

  - `src-tauri/src/mux/bridge/mod.rs` の `capture_if_capacity`

  - 修正案: `ClientScrollbackCapacityPayload::from_payload(&msg.payload).is_some()` のときだけ保持値を更新する。フレームの転送自体は今のまま残す

  - 検出元: mux-probe-scrollback-capacity の review round 1

  ## 実害・発生条件

  - ツリー内の唯一の送信元 `send_client_scrollback_capacity` は常にちょうど 4 バイトを送るため、改ざんされた送信元か想定外の送信元がある場合に限って起きる

  - 起きた場合の影響は、再接続後にリング一周後の復元でカーソル行がずれる旧来の動作に戻ること


  Notion task: https://www.notion.so/3e83509ec8ee8156a62eeb6e20fa1237

  '
