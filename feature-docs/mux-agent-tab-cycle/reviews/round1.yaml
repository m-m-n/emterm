  - stable_id: c4a1f0d2b8e37596
    severity: high
    category: comprehensive
    file: src-tauri/src/app.rs
    line: 3183
    title: "自窓が唯一の qualifying のとき同一ペインへ SwitchWindow + スナップショット再生が走る"
    description: >-
      next_qualifying_index は current 自身を最後に走査するため、アクティブ窓が唯一の
      qualifying 窓のとき Some(current) を返す。dispatch 側はその値をそのまま switch_to に
      渡すので、既にアクティブなペインへ SwitchWindow を送り request_pane_snapshot を発行し、
      MuxActionOutcome::Changed を返して needs_full_redraw と record_mux_window_switch まで
      発火する。daemon は画面ダンプ + 最大 2MiB の scrollback を返し、クライアントは
      TerminalCore を build_from_snapshot し直す (64KiB 超は off-thread replay + core swap の
      重い経路)。「エージェント窓が1つだけ」という最も普通の使い方でキーを押すたびに、
      何も変わらないのに端末の全面再構築が起きる。
    suggestion: >-
      NextAgentWindow アームで target == Some(current) の場合は switch_to を呼ばず
      MuxActionOutcome::None を返す。純関数 next_qualifying_index の契約は変更しない。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: fixed
    resolution_reason: "auto-applied loop 1 (ガード追加 + 既存テストに outcome assert 追加)。cargo check 通過、feature テスト9件 green"
  - stable_id: 7b2e91a4c0d5f318
    severity: medium
    category: comprehensive
    file: src-tauri/src/mux/prefix.rs
    line: 241
    title: "デフォルト chord Ctrl+A は prefix=Ctrl+A のユーザーで到達不能になる"
    description: >-
      Latch::observe は Armed 状態でまず chord.matches(input) を見て PrefixAction::Literal を
      返し、その後でしか decode_follow_up を呼ばない。mux.prefix が Ctrl+A のとき
      prefix→Ctrl+A は常に prefix パススルーになり、next-agent-window のデフォルトバインドは
      一度も発火しない。Ctrl+A は tmux ユーザーの定番 prefix で、本プロジェクトの tmux.conf
      インポータも `set -g prefix C-a` を Ctrl+A に変換する。keybind と prefix の衝突を
      検出する検証も警告も無いため、該当ユーザーには「設定画面に行が出ているのに何も起きない
      キー」が黙って残る。
    suggestion: >-
      (a) デフォルト chord を prefix に採用されにくいキー (例 Ctrl+G) に変える、または
      (b) 設定ロード時にアクション chord が prefix chord と一致したら log::warn! を出す
      (他アクションにも同じ潜在的衝突があるため横断的に効く)。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: "medium のため R4 の auto-fix 候補ゲート (critical/high) に該当せず"
