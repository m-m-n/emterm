schema_version: 1
feature: mux-agent-tab-cycle
created: 2026-08-06
base_branch: main
parent_branch: em-workflow/mux-agent-tab-cycle/integration

project:
  license: MIT
  design_system:
    kind: project_native
    paths:
      - doc/UI-DESIGN-GUIDELINES.yaml
      - src-tauri/src/ui/md3.rs
      - src-tauri/web-shared/styles.css
  components:
    rust-native:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml --check"
      e2e_test_command: ""
    webview-typescript:
      language: typescript
      build_command: "bun run build:viewer && bun run build:settings"
      test_command: "bun run typecheck && bun test"
      format_command: "bunx biome check ."
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: 1ceff4cc4a09bdb6d5ab95371eac51df37f9de88
  - id: design
    artifacts: [DESIGN.md, design/]
    status: skipped
    skipped_reason: >-
      本機能は既存のタブ切り替え・キー入力機構への挙動追加で、新規 UI 表面を持たない
      ため design ステップは不要。gate create-spec.design-step の batch policy
      (decide_autonomously) により analyst の推奨 skip をそのまま採用した。
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: completed
    completed_at_commit: dae848b4e31d9f040306c7d30ba9bafbea2b615c
  - id: implement
    status: in_progress
    base_commit: 37dc21bbbed5f02a918950166c6271769fd79605
  - id: review
    status: pending
  - id: verify
    status: pending
    result: null
    failed_items: []
  - id: retrospect
    status: pending

