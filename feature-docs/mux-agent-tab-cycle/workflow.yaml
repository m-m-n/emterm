      巡回対象となる agent 状態集合が未確定（gate create-spec.requirement-clarification の
      Codex 相談が利用上限で不成立となり record_tbd を適用。create-plan の tbd-resolution で
      確定する）。analyst 推奨: any-reported-state — clear されていない agent-status を持つ
      ペインを含む mux タブ全て（idle/working/blocked/done を問わない）を対象とする。
    excluded_reason: null
