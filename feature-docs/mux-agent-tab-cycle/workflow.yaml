  FR1:
    title: Agent tab cycle key operation
    status: tbd
    tbd_reason: >-
      キーバインド未確定（gate create-spec.requirement-clarification の Codex 相談が
      利用上限で不成立となり record_tbd を適用。create-plan の tbd-resolution で確定する）。
      analyst 推奨: planning-default-configurable — 計画時に既存キーマップと衝突しない
      既定バインドを定め、設定で変更可能にする。
    excluded_reason: null
    tasks: []
    tests: [TS-1, TS-4]
  FR2:
