    resolution_note: >-
      gate create-spec.design-step の policy option_id は
      decide_autonomously。worker のパケットは option_id を skip / run で
      提示しており canonical な decide_autonomously を含まなかった
      (worker 側の option-id 逸脱)。decide_autonomously の意味は
      「analyst の自律的推奨をそのまま採る」であり、worker の
      design_step_recommendation.value は skip、recommended option も skip
      で一致するため skip として解決した。フェーズ中断はしていない。
