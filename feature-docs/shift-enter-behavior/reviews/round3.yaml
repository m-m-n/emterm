findings:
  - stable_id: rd3-save-path-sentinel
    severity: medium
    category: comprehensive
    file: src-tauri/src/settings_window/commands.rs
    line: 264
    title: "save_settings serializes AppSettings without apply_migrations (Unresolved sentinel can fail the save)"
    description: >-
      load_settings_from_path resolves the deserialize-time Unresolved
      sentinel via apply_migrations before re-serializing, but
      save_settings_to_path deserializes the incoming payload and
      immediately re-serializes without that call. A payload omitting
      shift_enter_behavior would leave the serde-skipped sentinel in place
      and fail the entire save with a serialize error. Unreachable today
      (the TS type requires the field, so the panel always sends it) but it
      violates the sentinel's documented invariant and is a robustness
      regression versus the plain-bool field for any future non-UI caller.
    suggestion: >-
      Call apply_migrations on the deserialized payload in the save path
      (mirroring the load path) so the sentinel can never survive to
      serialization; keeps save/load symmetric.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: null
