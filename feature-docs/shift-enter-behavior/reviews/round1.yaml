findings:
  - stable_id: rd1-app-settings-schema
    severity: critical
    category: comprehensive
    file: crates/app_settings/src/settings.rs
    line: 403
    title: "settings panel can't persist/display shift_enter_behavior (app_settings schema not updated)"
    description: >-
      The settings window's load_settings/save_settings round-trip through
      app_settings::AppSettings, which still models only the legacy
      shift_enter_as_alt_enter bool and has no catch-all. serde drops the new
      shift_enter_behavior key on both load and save: the panel select never
      shows the persisted value, and selecting none/kitty_csi_u is silently
      discarded (save re-emits shift_enter_as_alt_enter: true, the schema
      default). The AC-5 round-trip test bypasses the save_settings path and
      gives false confidence. Note: file is outside the reviewed diff
      (confidence capped; claude:spec finding at the same site was
      category-forced to comprehensive per protocol R3 rule 7).
    suggestion: >-
      Add shift_enter_behavior (wire values none/alt_enter/kitty_csi_u,
      default alt_enter) to app_settings::AppSettings with serde default;
      fold the legacy boolean into it during migration (true -> alt_enter,
      false -> none) and stop serializing the legacy key. Add a test driving
      the real save_settings/load_settings command path proving none and
      kitty_csi_u survive the round-trip.
    sources: [claude:comprehensive, claude:spec]
    confidence: 50
    resolution: fixed
    resolution_reason: "rework task0003 (merge 8e25a1fcc520d61324dea7c9388cb9f43b1e8533)"
