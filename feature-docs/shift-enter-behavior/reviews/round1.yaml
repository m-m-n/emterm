  - stable_id: rd1-null-legacy-precedence
    severity: medium
    category: spec
    file: src-tauri/src/settings.rs
    line: 1688
    title: "A null new key incorrectly allows the legacy key to win"
    description: >-
      RawSettings represents shift_enter_behavior as an optional string, so
      an explicit null collapses to absent and the legacy branch applies:
      {"shift_enter_behavior": null, "shift_enter_as_alt_enter": false}
      resolves to none, although FR5 says a present-but-null new key follows
      the default (alt_enter) and wins over the legacy key.
    suggestion: >-
      Track presence of shift_enter_behavior separately from its nullable
      value; resolve present null to the default before considering the
      legacy field. Add tests covering a null new key with each legacy
      boolean value.
    sources: [codex:spec]
    confidence: 50
    resolution: fixed
