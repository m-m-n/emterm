    title: "dim フェード中の request_redraw にレートリミットが無く、200ms 間フル速度でスピンする"
    description: >-
      about_to_wait は App::mux_sidebar_dim_due が真の間、無条件に host.window().request_redraw() を
      呼ぶ。mux_sidebar_dim_due (app.rs:2682) はフェード中 elapsed < OVERLAY_DIM_FADE (200ms) の間
      true を返し続けるため、request_redraw → RedrawRequested → about_to_wait → request_redraw の
      サイクルがブレーキ無しで回る。これは同じ関数内の toast 用コメント (window_host.rs:4269-4276) が
      明記している失敗モードそのもので、toast 側は toast_redraw_due + last_toast_redraw +
      TOAST_POLL_MS(16ms) で対処済み。dim フェードには対応する last_*_redraw フィールドが無い。
      さらに next_mux_sidebar_dim_deadline (app.rs:2664) はフェード中に started + OVERLAY_DIM_FADE の
      単発 deadline しか返さないので WaitUntil タイマーも律速しない。スピン中のフレームは安価では
      なく、mux_sidebar_animating が overlay_work に入るため should_skip_frame が必ず否定され、毎フレーム
      egui パス全体 + wgpu present が走る。加えて render::draw_terminal (render/mod.rs:311-328) は毎フレーム
      Vec<SidebarEntry> (エントリごとに String name / public_pane_id) を確保する。task0001 のデフォルト
      反転と task0002 の初期 open により mux アタッチ中はカードが常時表示されるので、「window 切替 →
      3 秒 hold → 200ms フル速度スピン」が主要操作ごと、加えてポインタがカード境界を出るたびに発生する。
      本プロジェクトは ControlFlow::Wait 化で idle CPU 10-15% を削った経緯があり、その方針に逆行する。
    suggestion: >-
      toast のパターンを踏襲する。(a) WindowHost に last_mux_sidebar_dim_redraw: Option<Instant> を
      持たせ、toast_redraw_due と同形の純関数 (例 mux_sidebar_dim_redraw_due(dim_due, last_redraw, now))
      でポーリング周期 (TOAST_POLL_MS 相当の 16ms、または新設の OVERLAY_DIM_POLL_MS) を下回る再要求を
      抑止し、要求時に last_mux_sidebar_dim_redraw を更新する。(b) 併せて
      App::next_mux_sidebar_dim_deadline のフェード中の戻り値を単発ではなく next_toast_deadline と同じ
      bounded poll (now + poll_interval、フェード終了時刻でクランプ) にして、WaitUntil 側も周期で駆動する。
      既存の next_wait_deadline / should_skip_frame テストと同様、純関数として切り出せば単体テスト可能。
