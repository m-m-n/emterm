lessons_candidates:
  - "litellm(vertex-deepseek-v3.2) の spec レビュアーが「違反なし」の確認を finding として 4 件返し、うち 1 件に severity: critical を付けた。本文と severity が矛盾する出力は R5 の completion gate（residual_critical_high > 0）を誤って塞ぎうる。観点スキルまたはレビュアー契約側で「準拠確認は finding として返さない」を明示する余地がある"
  - "同じ litellm ハーネスの performance レビュアーはトークン枯渇で出力が `{` 1 文字に切断され、findings ゼロ・skipped=false で返った。retryable な skip_reason が付かないため R2b のチェーン前進が効かず、クロスモデル検証が実質空振りする。切断検出を skip_reason（例: output_truncated）として扱えるとフォールバックが機能する"
  - "実装者が最初のテスト/ビルドを worktree ではなくメインツリーで実行しかけた（Bash ツールの既定 cwd がプロジェクトルートのため）。本人が commit 前に自己検出して再実行したが、worktree-task-workflow 側で cwd の明示を強めると再発を防げる"
  - "新規 worktree では gitignore 済みの bundled フォントが存在せず、build.rs が panic して build コマンドが落ちる。verify/implement の両方で同じ回避（メインツリーからのコピー）が必要になった。fetch-fonts を含む承認済みコマンド列を verify の build に使うか、worktree 作成時に配置する手順があると素直"
  - "レビュー結果として medium 1 件（EL/ED 4 箇所のコピペと各コピーの片側が構造的に死に枝）が deferred になった。Notion タスクが元々スコープ外に挙げていた『相方掃除プリミティブの共通化・chokepoint 化』と同一主題で、レビューが独立に同じ結論へ到達している"
