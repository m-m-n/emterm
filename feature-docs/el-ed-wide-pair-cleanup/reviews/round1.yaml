  - stable_id: b5faa9d564cbcfa6
    severity: medium
    category: comprehensive
    file: crates/term_core/src/csi_screen.rs
    line: 21
    title: "ED/EL に追加したパートナー処理は 4 箇所コピペで、各コピーの半分が到達不能"
    description: >-
      ECH と同形の相方掃除ブロックが ED 0 / ED 1 / EL 0 / EL 1 の 4 箇所へ複製されたが、
      ED/EL では範囲端が固定なので各コピーの片側が構造的に発火しない。mode 0 は
      end == self.cols 固定のため blank_wide_pair_split(end, row) が cell_index の
      col < cols 判定で必ず no-op になり、右パートナー処理は決して動かない。mode 1 は
      start がリテラル 0 のため start_is_spacer && start > 0 が常に false で、直前の
      get_cell_width(0, row) 計算ごと死んでいる。動作は正しい（mode 0 は左のみ、
      mode 1 は右のみが実在するケース）が、境界に敏感な同一ロジックが ECH を含め
      5 箇所に散り、しかも半分が死に枝のため、将来ガードを直す際の追随漏れと
      「ED 0 は右パートナーも見ている」という誤読を招く。ECH だけが持つ end-1
      アンダーフロー保護が複製先に無い点も、コピー間の差異が既に生じている例
      （ただし cols >= 1 が clamp_resize_dims で保証されるため実害は無い）。
    suggestion: >-
      (a) 各サイトで実際に発火し得る側だけを残し、なぜ片側で十分かをコメントに書く。
      (b) csi_screen.rs に private ヘルパを 1 本切り出して ECH と ED/EL の 4 サイトから
      呼ぶ（clear_line_range 自体には畳み込まないという既存コメントの意図は、別名の
      ラッパを挟む形なら維持できる）。加えて ED 0/ED 1 のカーソル行処理は EL 0/EL 1 と
      完全に同一なので、ED 側を handle_erase_in_line への委譲にすればコピーは 4→2 に減る。
    sources: [claude:comprehensive]
    confidence: 65
