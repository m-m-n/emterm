  - stable_id: sid-probe-stdout-pipe-deadlock
    severity: medium
    category: performance
    file: src-tauri/src/mux/daemon.rs
    line: 1106
    title: "Loop 2's probe rewrite (Command::spawn + poll) lost Command::output()'s concurrent stdout draining, risking a pipe deadlock and unbounded post-exit read"
    description: "Regression introduced by the loop-2 fix for sid-probe-timeout-leaks-subprocess: stdout is only read after the child exits, so a candidate writing more than the pipe buffer (64KiB) blocks the child from exiting, defeating try_wait until the deadline kills it; separately, the try_wait-error branch returns without killing/reaping, and the post-exit read_to_end has no deadline of its own if a grandchild inherits the write end."
    suggestion: "Read stdout concurrently on a separate thread (or via non-blocking I/O) while polling for exit, joining/receiving with a bound tied to the same deadline; also kill+reap on the try_wait-error path."
