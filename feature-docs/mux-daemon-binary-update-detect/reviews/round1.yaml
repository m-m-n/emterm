  - stable_id: sid-probe-client-timeout-mismatch-false-success
    severity: high
    category: comprehensive
    file: src-tauri/src/mux/daemon.rs
    line: 1228
    title: "Loop 2's probe timeout (10s) exceeded the client's upgrade-response read timeout (5s), letting a refused/hung upgrade be misreported as a successful in-place replacement"
    description: "If the probe took longer than the client's 5s read timeout, the client's read_upgrade_response fell into ProceededOrUnknown before the daemon's actual refusal arrived, and the subsequent reachability poll then succeeded trivially against the SAME unmodified daemon -- printing a false 'upgraded' notice. This broke an existing invariant documented elsewhere in the codebase (cli.rs's AC-10 comment) that a same-daemon reachability success must not be read as an upgrade success."
    suggestion: "Reduce UPGRADE_PROBE_TIMEOUT below the client's 5s read timeout so a refusal is always observed in time."
    sources: [claude:comprehensive]
    confidence: 70
    resolution: fixed
    resolution_reason: "loop 3: UPGRADE_PROBE_TIMEOUT reduced from 10s to 3s with a documenting comment. This substantially reduces (but per spec:claude/spec:codex round 3, does not structurally eliminate) the false-success window described in sid-notification-without-proof-of-replacement below -- that finding is deferred to rework since it requires positive post-upgrade evidence (e.g. an identity re-check), not just a timing adjustment."

  - stable_id: sid-upgrade-candidate-exec-without-validation
    severity: high
    category: spec
    file: src-tauri/src/mux/daemon.rs
    line: 1691
    title: "Upgrade candidate binary is exec'd without ownership/writability validation, violating SPEC NFR3"
    description: "The daemon resolves the upgrade candidate from its own recorded identity (a genuine improvement over client-supplied input) but never validates that the CURRENT file at that path is owner-controlled, non-symlinked, and not group/world-writable before executing it (first via the handoff-schema probe, then via the final execve). SPEC NFR3 requires 'a path writable by others ... is never exec'd unverified.' Recorded-path resolution is necessarily stale relative to exec time (that staleness is exactly what this feature detects and reacts to), so an attacker who can write to that path in a shared/misconfigured install location could have their binary exec'd with daemon privileges."
    suggestion: "Before the handoff probe and the final exec, validate the candidate as a regular, non-symlink, owner-controlled, non-group/world-writable file (and its parent directory), refusing the upgrade through the existing refusal path on failure."
    sources: [codex:spec]
    confidence: 70
    resolution: deferred
    resolution_reason: "category:spec is excluded from this phase's mechanical auto-fix loop by design (spec-level changes require judgment, not mechanical patching). Confirmed unaddressed and unchanged across rounds 1-3 by spec:codex. Routed to rework via the review.residual-critical-high batch path."

  - stable_id: sid-notification-without-proof-of-replacement
    severity: high
    category: spec
    file: src-tauri/src/mux/daemon.rs
    line: 934
    title: "The 'daemon upgraded' notice is emitted on reachability alone, without positive proof the daemon was actually replaced (SPEC FR2/AC-6/AC-8)"
    description: "wait_for_daemon_reachable_at_current_version succeeding only proves SOME current-protocol daemon answered -- it cannot distinguish a genuinely-replaced new image from the original, unmodified daemon that refused or ignored the upgrade and kept serving. Loop 3's probe-timeout reduction (10s -> 3s, see sid-probe-client-timeout-mismatch-false-success) substantially narrows the race window that made this likely, but does not structurally close it: the SPEC requires proof of replacement, not merely a reduced-probability absence of false positives."
    suggestion: "After reconnecting, re-run identity::check (or equivalent) and require Unchanged against the newly-recorded on-disk identity before emitting the success notice; treat continued Updated/Undecidable as refusal/unknown, never success."
    sources: [claude:spec, codex:spec, codex:architecture]
    confidence: 90
    resolution: deferred
    resolution_reason: "category:spec is excluded from this phase's mechanical auto-fix loop. Severity confirmed high and unchanged across rounds 2-3 by both claude:spec and codex:spec even after loop 3's timeout fix (which addresses a contributing timing factor but not the underlying missing-positive-evidence design gap). Routed to rework."

  - stable_id: sid-failed-upgrade-not-suppressed
    severity: high
    category: performance
    file: src-tauri/src/mux/daemon.rs
    line: 917
    title: "A rejected/timed-out automatic upgrade is never suppressed, so every subsequent client launch repeats the same costly attempt"
    description: "Identity stays Updated after a failed automatic-upgrade attempt (the identity file only changes at daemon start), so every later emterm mux / mux attach / mux script repeats the full Upgrade round-trip, a daemon-side candidate probe (bounded but still real cost), and a client-side reachability poll (up to ~20s), against a candidate that is structurally guaranteed to fail again (e.g. an incompatible handoff schema, or no recorded identity to serve as an exec target)."
    suggestion: "Add single-flight/backoff suppression keyed by the candidate's (device, inode): e.g. daemon-side state recording a recently-rejected candidate identity, or a client-side 'already attempted' marker, cleared automatically when the candidate identity changes or an upgrade succeeds."
    sources: [claude:comprehensive, claude:performance, codex:performance]
    confidence: 90
    resolution: deferred
    resolution_reason: "Escalated to high by codex:performance in round 3 (previously medium in rounds 1-2). Deliberately NOT attempted as a loop-3 mechanical auto-fix: a correct fix requires new persistent/shared state (single-flight + backoff) whose design (cache key, TTL, invalidation, concurrency) is better scoped as a proper implementation task with its own tests than a single-file review-editor patch in the final allowed auto-fix loop. Routed to rework alongside the two spec findings above."

