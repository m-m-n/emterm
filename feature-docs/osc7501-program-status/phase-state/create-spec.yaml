  requirement.store-integration:
    packet_id: create-spec-q0001
    answered_at: '2026-10-10T01:14:20+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - separate_store_merged_view
    freeform: null
    normalized_answer: OSC 777 のエントリーは残し、ペインごとに OSC 7501 のレコード表（階層 id・上限・追い出し・寿命）を別に持つ。バッジ・サイドバー・通知・mux API は両ソースを優先順位で集約した結果を使う。mux wire に 7501 用の項目またはメッセージを追加する。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation, record_as_assumption); Codex (run_codex_exec.sh readonly, codex harness, 2 turns, converged) consulted; Opus
      escalation: not run; options: separate_store_merged_view [chosen] / unify_single_slot / separate_store_7501_wins [not chosen]; key points: 現行は 1 ペイン 1 状態(agent_status_model.rs:175)で 7501 の階層レコード・完全置換・個別消去を表せない。保持と寿命管理を分け表示時に集約すれば
      777 の挙動を変えない'
  requirement.error-state:
    packet_id: create-spec-q0001
    answered_at: '2026-10-10T01:14:20+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - distinct_state_done_toggle
    freeform: null
    normalized_answer: AgentState に Error を追加し専用の絵文字と md3 error 系の色を割り当てる。既読・未読は done と同じ。集約順位は blocked > 未読 error > 未読 done > working > 既読 error > 既読 done > idle。error への遷移は agent_notify_on_done のトグルで通知し、設定は追加しない。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation, record_as_assumption); Codex (run_codex_exec.sh readonly, codex harness, 2 turns, converged) consulted; Opus
      escalation: not run; options: distinct_state_done_toggle [chosen] / distinct_state_new_toggle / map_to_done [not chosen]; key points: 仕様は error を失敗として区別し寿命は done と同じ。既存の完了通知設定(notifications.rs:282)を共有し表示と集約順位では独立させる。wire/handoff
      の変更は既存の版管理(mux_ipc protocol.rs:33, handoff.rs:28)に従う'
  requirement.optional-keys-display:
    packet_id: create-spec-q0001
    answered_at: '2026-10-10T01:14:20+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - minimal_title_only
    freeform: null
    normalized_answer: 無害化済みの title を OSC 777 の name 相当として通知本文の名前に使い、title が無ければ祖先から継承した app を使う。kind・progress・msg は解析と保持だけで表示しない。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation, record_as_assumption); Codex (run_codex_exec.sh readonly, codex harness, 2 turns, converged) consulted; Opus
      escalation: not run; options: minimal_title_only [chosen] / medium_notify_detail / full_with_progress [not chosen]; key points: 現行の通知本文は名前・タブ名・状態で構成(notifications.rs:405)。表示方法は仕様が端末に委ねている'
  requirement.hierarchical-id:
