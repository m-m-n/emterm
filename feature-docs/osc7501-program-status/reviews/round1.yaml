  - stable_id: 64d9b877882a6d3f
    severity: medium
    category: security
    file: src-tauri/src/program_status.rs
    line: 208
    title: "OSC番号の先頭ゼロで、列全体4096バイトの制限が効かない（TM-1）"
    description: "term_core は OSC 番号の先頭ゼロをバッファに残さず、parse_bytes は導入部を INTRODUCER_BYTES=7 の固定値で数えるため、4096個の0を前置した4115バイトの列も19バイトと判定されて受理される。資源消費や権限の上積みは無く、影響は脅威モデルの制限が仕様どおりに効かない点にとどまる。不正UTF-8を U+FFFD に置換して長く数える逆向きのずれもあり、通常タブとmuxで判定が分かれる。"
    suggestion: "受信した列そのもののバイト数（導入部の実際の桁数と置換前の本文バイト数）で4096バイト判定を行う。先頭ゼロと不正UTF-8を含む境界テストを GUI の解析経路で追加する。"
    reproduction: "1. 状態レコードのない通常タブで、python3 -c 'import sys; sys.stdout.buffer.write(b\"\\x1b]\" + b\"0\" * 4096 + b\"7501;state=error\\x07\")' を実行する。2. 入力はTerminalCoreからThemeColorResponder::respond_program_status、program_status::parse_bytesへ進む。3. 実際の列は4115バイトあるが長さ判定は19バイトとなり、破棄されずerrorレコードが登録される。"
    reproduction_alternates: []
    reproduction_overflow: false
