  title: K60/K61 omit single cuts 20-29, contrary to the literal FR4/AC3 'every single cut' requirement; IMPLEMENTATION.md D5 open question left unanswered
  description: SPEC FR4 says the mux/plain-tab match holds in every delivery a row specifies, 'including every single-cut position and one-byte reads', and AC3 lists 'M2 + h-form + l-form' among the rows. The SC-1z rows K60 and K61 (sc1z_rows in daemon/tests.rs, M2 C1h|C7h C1l A BEL) deliberately leave out cuts 20..=29 (IMPLEMENTATION.md D5, whose Open Questions ask review to confirm this reading). With a cut at 20, read 1 is a detection read ending client_alt=true; read 2 (C1l A BEL) starts in a matched state so the l-form is not detected (FR1 keeps predecessor A2); the post-read cross-check adopts main, and the unchanged fallback (FR8) gives no live bytes, so the mark is dropped while the plain tab clears it. Cuts 21..29 reach the same result via the kept partial or CSI carry. Not a regression (base tracker behaves the same). It is an internal SPEC conflict (FR1/A2 + FR8 vs FR4/AC3/Objective) no SPEC-conforming tracker can satisfy. The second IMPLEMENTATION.md open question (M1 + l-form
    | C7h and M2 + h-form | C7l) has the same cause.
  suggestion: 'Explicit human decision rather than a code change: either (a) amend SPEC FR4/AC3 and the Objective to exclude deliveries where a later compound lands, in a matched state, in a read that has detected nothing, recording K60/K61 cuts 20..29 and the M1 l-form|C7h / M2 h-form|C7l splits as an accepted limitation; or (b) file a follow-up feature to close that gap. Do not change the tracker under the current FR1/FR8.'
  reproduction: null
