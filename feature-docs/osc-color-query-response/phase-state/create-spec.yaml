  requirement.osc110-111-reset-target:
    packet_id: create-spec-q0001
    answered_at: '2026-09-13T04:06:41+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - reset_to_scheme
    freeform: null
    normalized_answer: OSC 110 / 111 も、ハードコード定数ではなくアクティブなカラースキームの値へ リセットする。scheme_cursor_fg に倣って scheme_fg
      / scheme_bg を Theme に 追加し、リセット先をそこにする。照会はリセット後にスキームの値を返す。
    resolution_note: 'gate: create-spec.requirement-clarification; policy action: codex_consultation;
      codex_consulted: true (turns 1-2 timed out with provider errors, turn 3 answered via fallback entry
      2 litellm/vertex-glm-5.2); codex chose reset_to_scheme and the orchestrator judged it maps onto
      that option_id. Codex reasoning: xterm / VTE / Ghostty / WezTerm all define OSC 110/111 "reset to
      default" as restoring the user-configured color, not a hard-coded constant; the bright-green fallback
      (0x40ff40) is a latent on-screen rendering bug that exists independently of the query feature; OSC
      112 already restores scheme_cursor_fg, so 110/111 resetting to constants is an internal inconsistency
      rather than a deliberate semantic. record_as_assumption: true.'
  requirement.osc104-palette16-residue:
    packet_id: create-spec-q0001
    answered_at: '2026-09-13T04:06:41+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - restore_scheme_palette
    freeform: null
    normalized_answer: OSC 104 は palette256 のオーバーレイを消すだけでなく、palette16 も アクティブなカラースキームから復元する。インデックス 0-15
      の照会は リセット後にスキームの値を返す。
    resolution_note: 'gate: create-spec.requirement-clarification; policy action: codex_consultation;
      codex_consulted: true (same consultation as requirement.osc110-111-reset-target — one batched consultation
      for the packet); codex chose restore_scheme_palette and the orchestrator judged it maps onto that
      option_id. Codex reasoning: xterm defines OSC 104 as resetting the palette to default resource values;
      because OSC 4 writes into palette16[i] as well as palette256[i], clearing only the overlay leaves
      palette16 permanently polluted, so index 5 renders wrong forever after "set 5, reset" — already
      a latent on-screen bug, not only a query-answer discrepancy. record_as_assumption: true.'
