    check --manifest-path src-tauri/Cargo.toml --no-default-features; [6] bun run build:viewer && bun
    run build:settings; [7] bun test. ORCHESTRATOR DECISION recorded here for the human evaluator: requirements-analyst
    detected ''make build'' as the rust build command from .claude/rules/core-commands.md, and it is NOT
    on the approval list. It was deliberately NOT auto-recorded and NOT used as a build_command. Reason:
    ''make build'' writes the release binary to src-tauri/target-host/release/emterm, which .claude/rules/core-build-location.md
    designates as the single source of truth for the binary the user launches; running it from this feature''s
    integration worktree during an unattended verify would replace the user''s running binary with unreviewed
    feature code. The non-destructive ''cargo check'' forms above are used for build verification instead.
    The release build and the manual Codex TUI acceptance check (SPEC TS14) remain the user''s own step.'
