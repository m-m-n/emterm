  - question_id: requirement.osc110-111-reset-target
    packet_id: create-spec-q0001
    answered_at: "2026-09-13T04:06:48+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [reset_to_scheme]
    freeform: null
    normalized_answer: "OSC 110/111 reset to the active color scheme via new scheme_fg / scheme_bg fields"
    resolution_note: >-
      gate: create-spec.requirement-clarification (listed in
      batch-policies.yaml with action: codex_consultation);
      options: reset_to_scheme / report_as_is; choice: reset_to_scheme;
      codex_consulted: true; fallback provider answered: yes (stderr
      CODEX_FALLBACK: entry 2 litellm/vertex-glm-5.2); opus escalation: not
      run; consultation turns: 3 (turns 1 and 2 returned CODEX_TIMEOUT after
      600 s with repeated provider model-refresh errors, turn 3 answered).
      Key points of the discussion: xterm / VTE / Ghostty / WezTerm define
      OSC 110/111 "reset to default" as restoring the user-configured color,
      not a hard-coded constant; the current bright-green DEFAULT_TERMINAL_FG
      (0x40ff40) fallback is a latent on-screen rendering bug independent of
      the query feature; OSC 112 already restores scheme_cursor_fg, making
      the 110/111 constants an internal inconsistency rather than an
      intentional semantic. The analyst's own tentative position was the
      same option.
  - question_id: requirement.osc104-palette16-residue
    packet_id: create-spec-q0001
    answered_at: "2026-09-13T04:06:48+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [restore_scheme_palette]
    freeform: null
    normalized_answer: "OSC 104 also restores palette16 from the active color scheme"
    resolution_note: >-
      gate: create-spec.requirement-clarification (listed in
      batch-policies.yaml with action: codex_consultation);
      options: restore_scheme_palette / clear_overlay_only; choice:
      restore_scheme_palette; codex_consulted: true (same single batched
      consultation as requirement.osc110-111-reset-target); fallback
      provider answered: yes (litellm/vertex-glm-5.2); opus escalation: not
      run. Key points of the discussion: xterm defines OSC 104 as resetting
      the palette to its default resource values; since OSC 4 writes into
      palette16[i] as well as palette256[i] for i < 16, clearing only the
      palette256 overlay leaves palette16 permanently polluted, so after
      "set index 5, then OSC 104" index 5 renders wrong forever — a latent
      on-screen bug, not merely a query-answer discrepancy. The analyst's
      own tentative position was the same option.
