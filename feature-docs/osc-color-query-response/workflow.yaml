schema_version: 1
feature: osc-color-query-response
created: 2026-09-13
base_branch: main
goal: |
  # OSC カラー照会 (4/10/11/12) に応答しないため Codex TUI の入力欄背景が塗られない

  種別: バグ
  Notion: https://www.notion.so/3d93509ec8ee81dc8fa3c31cc698e212

  ## 現象 (必須)
  eMterm は OSC 4 / 10 / 11 / 12 のカラー照会 (`?`) に応答を返さない。照会を読み捨てるだけで、応答生成の経路が存在しない。
  このため、端末の配色を照会して自分の配色を決めるアプリが機能縮退する。実例として Codex TUI (codex-cli 0.154.0) は起動時に `ESC]10;?ESC\` と `ESC]11;?ESC\` を 1 回ずつ送り、その応答からテキスト入力欄の背景色を派生させている。eMterm では応答が返らないため入力欄が塗られず、地の背景色 (既定は純黒) がそのまま出る。Ghostty では応答が返るので入力欄とチャットログの背景色が別になる。

  生 PTY で Codex を起動し、照会への応答だけを変えた対照実験の結果:

  | 応答で返した背景色 | Codex が入力欄に使う背景色 |
  | --- | --- |
  | `#1e1e1e` (30,30,30) | (57,57,57) |
  | `#000000` (0,0,0) | (30,30,30) |
  | `#f0f0f0` (240,240,240) | (230,230,230) |
  | 応答を返さない (現在の eMterm) | 塗らない |

  暗い背景なら白へ約 12%、明るい背景なら黒へ寄せる派生をしている。応答が無いと背景色を判断できず、塗る処理そのものを行わない。

  ## 再現手順 (必須)
  1. eMterm で `codex` を起動する (codex-cli 0.154.0 で確認)。
  2. ホーム画面のテキスト入力欄 (`❯ Ask Codex to do anything` の周辺) の背景色を見る。
  3. 入力欄がチャットログ部分と同じ背景色 (既定では黒) になっている。Ghostty で同じ操作をすると入力欄だけ明るい背景になる。

  プロトコルレベルの再現は `tmp/codex-osc-probe.py` で行える。

  ```
  python3 tmp/codex-osc-probe.py tmp/out-full.bin full 14      # 照会に全応答
  python3 tmp/codex-osc-probe.py tmp/out-nocolor.bin nocolor 14 # カラー照会だけ無応答
  ```

  取得したバイト列から `48;2;r;g;b` を数えると、full では 8 件、nocolor では 0 件になる。

  ## 期待する挙動 (必須)
  OSC 4 / 10 / 11 / 12 の照会 (`?`) に xterm 互換の応答を返す。

  - `ESC]10;?ESC\` → `ESC]10;rgb:RRRR/GGGG/BBBBESC\` (デフォルト前景色)
  - `ESC]11;?ESC\` → `ESC]11;rgb:RRRR/GGGG/BBBBESC\` (デフォルト背景色)
  - `ESC]12;?ESC\` → `ESC]12;rgb:RRRR/GGGG/BBBBESC\` (カーソル色)
  - `ESC]4;N;?ESC\` → `ESC]4;N;rgb:RRRR/GGGG/BBBBESC\` (パレット N 番)

  応答する値は、OSC で上書きされていればその値、されていなければ現在のカラースキームの値。終端は照会側が使った終端 (BEL / ST) に合わせる。

  ## 完了の定義 (必須)
  - [ ] OSC 10 / 11 / 12 の照会に現在のテーマ値で応答する
  - [ ] OSC 4 の単一インデックス照会に応答する
  - [ ] OSC 4 の複数インデックス連結照会 (`4;1;?;2;?`) に応答する
  - [ ] OSC 10 の連結照会 (`10;?;?;?` で 10/11/12 を順に返す形式) に応答する
  - [ ] 照会の終端が BEL でも ST でも、応答の終端をそれに合わせる
  - [ ] OSC で色を上書きした後の照会が、上書き後の値を返す
  - [ ] OSC 110 / 111 / 112 / 104 でリセットした後の照会が、スキームの値に戻る
  - [ ] 応答が PTY へ実際に書き戻される (`take_response` 相当の drain 経路に載る)
  - [ ] mux 経由 (daemon 越し) でも応答が PTY に届く
  - [ ] 上記を覆うユニットテストがある
  - [ ] eMterm 実機で Codex TUI を起動し、入力欄の背景色がチャットログと別になることを確認する

  ## 該当箇所 (任意)
  - `src-tauri/src/render/theme.rs:339` — `apply_default_color_set` が `?` を「Query responses are handled elsewhere」というコメント付きで読み捨てている。この "elsewhere" が存在しない。
  - `src-tauri/src/render/theme.rs:325` — `apply_palette_set` も同様に `?` を読み捨てている。
  - `crates/term_core/src/color_spec.rs:89` — `format_color_response` は 16bit 形式の応答フォーマッタだが、**呼び出し元がゼロ**のデッドコード。テストからのみ参照されている。
  - `crates/term_core/src/osc_handler.rs:74-86` — OSC 番号のディスパッチ表。照会かどうかの判別をここで行っていない。
  - 応答の書き戻し経路は DSR 応答と同じ仕組みを使えるはず。`project_native_poc_dsr_response_drain` で `tabs.rs` の `take_response` → PTY write を入れた実績がある。

  ## 実害・発生条件 (任意)
  - Codex TUI で入力欄とチャットログの区別が付かない。eMterm は Claude Code / Codex との親和性を掲げているので直接影響する。
  - 端末の配色を照会して自分の配色を決めるアプリ全般が対象。Codex 以外にも同じ手法を使う TUI がある。
  - 背景色が明るいスキームを使っている場合、アプリ側が「暗い背景」と誤判定して読めない配色になる可能性がある。
  - 発生条件に特別なものは無い。照会を投げるアプリを起動すれば常に再現する。

  ## 参考
  - 調査スクリプト: `tmp/codex-osc-probe.py`
  - キャプチャ: `tmp/codex-full-mode.bin`, `tmp/codex-nocolor-mode.bin`, `tmp/codex-bg-black.bin`, `tmp/codex-bg-light.bin`
  - 関連する別タスク: Codex TUI の会話履歴を端末スクロールバックで遡れるようにする (Ghostty 互換のリージョン転写)。原因も修正箇所も独立している。
parent_branch: em-workflow/osc-color-query-response/integration

