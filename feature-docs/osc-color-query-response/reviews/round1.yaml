- stable_id: ecb0d586e27282de
  severity: medium
  category: security
  file: src-tauri/src/render/theme.rs
  line: 481
  title: Chained OSC 4 queries amplify untrusted PTY input into unbounded response allocation
  description: '`MAX_OSC_LEN` is 16 MiB (crates/term_core/src/parser/mod.rs:15) and `Theme::apply_palette_set`
    pushes one freshly allocated `Vec<u8>` response per `?` token with no per-dispatch cap (src-tauri/src/render/theme.rs:478-486).
    Those vectors are returned through `ThemeColorResponder::respond` and appended to `response_queue`
    by `consult_osc_responder` (crates/term_core/src/osc_handler.rs:42-50); nothing drains the queue until
    the whole parse pass finishes. A crafted 16 MiB OSC 4 string of repeated `0;?;` pairs yields roughly
    4.2M query tokens, each producing a ~26-byte response plus Vec header plus allocator overhead, then
    copied again into `response_queue` - several hundred MB of transient allocation and a long UI-thread
    stall from a single sequence any process writing to the PTY (including a remote host over SSH) can
    emit. Newly reachable: before this diff `?` tokens for OSC 4 were skipped and only small fixed-size
    device replies could accumulate. Medium rather than high because it is a transient resource spike
    with no state corruption or privilege effect, and real terminals do answer each chained query.'
  suggestion: 'Cap the fan-out where the responses are produced: stop emitting after N query tokens within
    a single `apply_osc` dispatch (and/or a total response byte budget), dropping the remainder before
    allocating rather than after. Bound `response_queue` growth in `consult_osc_responder` as a second
    line of defence so a payload split across frames cannot bypass the per-dispatch cap, and add a test
    that a pathological chained OSC 4 payload yields a bounded response.'
  sources:
  - codex:security
  confidence: 65
  resolution: unresolved
  resolution_reason: severity medium - outside the Phase R4 auto-fix candidate gate; carried into rework
