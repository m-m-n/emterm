- stable_id: 4d2f818d6a5b35f9
  severity: high
  category: comprehensive
  file: src-tauri/src/tabs/replay.rs
  line: 547
  title: Off-thread history swap drops osc_responder, silently killing OSC 4/10/11/12 query AND set for
    that tab
  description: '`Tab::apply_offthread_swap` (src-tauri/src/tabs/replay.rs:544-552) replaces the live core
    wholesale (`*live = new_core`) and transplants only `callbacks` plus the mux inband OSC param onto
    the worker-built core. The worker-built core comes from `TerminalCore::build_from_snapshot`, whose
    snapshot constructors set `osc_responder: None` (crates/term_core/src/snapshot.rs:339, :486). The
    theme-backed responder has exactly one production registration site (src-tauri/src/tabs/mod.rs:725).
    After any off-thread swap (large snapshot / many-segment mux window switch or reattach) the live core
    has `osc_responder == None` and `consult_osc_responder` early-returns forever after. Impact exceeds
    the new feature: this same diff removed OSC 4/10/11/12 from `NativeCallbacks::on_osc`''s `handle_theme`
    routing and replaced it with a no-op arm (src-tauri/src/callbacks.rs:640-655) because the responder
    is now the sole caller of `Theme::apply_osc` for those codes. `callbacks` IS transplanted, so after
    the swap the no-op arm stays live while the responder is gone - color SET (pre-existing behavior)
    as well as the new color QUERY silently stop working for that tab. The synchronous replay path is
    unaffected (in-place `reset_frame_for_replay`, never a core replacement). The doc comment above the
    transplant claims the swapped-in core is behaviorally identical to a never-swapped tab core; that
    invariant is now false. Same failure class as the previously fixed off-thread callbacks/OSC-registration
    loss. New tests do not cover it: src-tauri/src/tabs/tests/replay.rs:656 only asserts stale device
    responses are discarded across the swap.'
  suggestion: 'In `apply_offthread_swap`, transplant the responder alongside `callbacks`, under the same
    lock and before `*live = new_core`: `new_core.osc_responder = live.osc_responder.take();` (a `None`
    source is already the constructor default, so no panic path is added). Add a regression test in src-tauri/src/tabs/tests/replay.rs
    next to `ac1_offthread_swap_transplants_the_preswap_callbacks_instance` that drives a large payload
    through the off-thread swap, then feeds `ESC ] 11 ; ? BEL` plus an `ESC ] 4 ; 1 ; rgb:... BEL` set,
    asserting exactly one correctly terminated response is drained and that the set mutates `Theme`.'
  sources:
