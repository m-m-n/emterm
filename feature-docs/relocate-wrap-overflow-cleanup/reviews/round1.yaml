    confidence: 65
    resolution: declined
    resolution_reason: >-
      事実誤認。FR1 が参照する write_grapheme_to_grid の該当箇所は
      print_handler.rs:166 で `} else if !self.overflow.is_empty() {` であり、
      指摘が主張する「ガード無しの無条件 remove」ではない。新規の 493 行は
      同一ファイルの既存削除サイト（166 / 198 / 357 / 416 / 456）と完全に同型。
      さらに `!is_empty() && remove(..).is_some()` は `remove(..).is_some()` と
      意味的に等価（空マップからの remove は None を返すため、どちらの経路でも
      overflow_ridx_remove は呼ばれない）。claude:spec は同一サイトを指摘して
      おらず、FR1/FR3 は充足していると独立に判定している。
