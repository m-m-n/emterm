        - {command: "cargo fmt --manifest-path crates/term_core/Cargo.toml --check", result: pass_with_preexisting_drift, detail: "drift at print_handler/tests.rs:1131 and terminal_dispatch.rs:517/565 — all outside this feature's added ranges (tests.rs:1432-1600, terminal_dispatch.rs:155-166). Per VERIFICATION.md's note this is not a failure of this feature."}
