    title: "ASCII 高速パスに 1 バイトごとの HashMap プローブが入った（overflow 非空時）"
    description: >-
      追加された overflow テーブル掃除のガードが !self.overflow.is_empty() の
      ため、リング内のどこか 1 セルでも 16 バイト超のクラスタ（ZWJ 絵文字等）を
      保持している間は、印字可能 ASCII バイト 1 個ごとに viewport_abs() +
      HashMap<(u32,u32),String>（SipHash）のプローブを払う。高速パスの既存
      per-byte コストはセル書き込み＋mark_row_dirty 程度なので相対影響が大きい。
      NFR1 の性能予算（常道ケースは resident field 読み＋分岐のみ）に抵触する。
    suggestion: >-
      old_width と同じセルレコード（同一キャッシュライン）から
      cell.is_overflow() を読み、そのセルが overflow だったときだけテーブル操作を
      行う。overflow エントリは is_overflow() が真のセルにしか insert されない
      ため挙動は等価。FR3 のパリティを厳密に保つなら handle_print_ascii 側にも
      同じガードを入れる。
    sources: [claude:performance]
