    title: "新ゲートが依存する「エントリ存在 ⟹ セルにマーカー」不変条件が未文書で、既に破っている経路がある"
    description: >-
      task0004 の was_overflow ゲートは「(col, abs) に overflow エントリが存在するのは
      その位置のセルが char_len == 0xFF のときだけ」という不変条件に暗黙依存するように
      なったが、その依存がコード上に記されていない。旧ゲート !self.overflow.is_empty() は
      マーカーの有無に関わらず書き込み位置のエントリを削除していたため、不変条件が
      破れていても自己修復していた。実際に破る経路が既に存在する:
      relocate_widened_base_via_wrap（print_handler.rs:468-480）は移送先 (0, new_abs)
      へ書く際、内容が 16 バイトに収まる場合 set_char がマーカーを落とすだけで既存
      エントリを削除せず、続く spacer 書き込み（:484-493）も (1, new_abs) のエントリを
      削除しない。影響は overflow の String がその行の clear / evict / reflow まで
      回収されないメモリ保持に留まり、読み出し側は全て cell.is_overflow() ゲート済み
      なので表示は壊れない。security(claude) と spec(claude) が同じ欠落を独立に指摘。
    suggestion: >-
      (a) 両 ASCII writer の if was_overflow ブロックに依存する不変条件を 1 行明記し、
      relocate_widened_base_via_wrap の 2 箇所に write_grapheme_to_grid
      （print_handler.rs:166-170）と同形の削除を足して不変条件を実際に成立させる。
      (b) 成立させない方針なら両 writer のゲートを自己修復形に戻す。
    sources: [claude:comprehensive]
