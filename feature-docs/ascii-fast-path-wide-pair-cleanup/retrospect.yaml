      cross-model 指摘は「指摘の骨子」と「挙げられた根拠」を分けて扱い、
      オーケストレーター側で実ファイル検証してから rework に回す価値がある。
  - id: L2
    note: >-
      IMPLEMENTATION.md の D-2 のような「両タスクが実装対象とする権威的列挙」を
      planner が起こすと、その列挙自体の誤りが両タスクに同時に伝播し、
      タスクの検証記録（tests.yaml）にも誤りが引き継がれる。今回まさに
      IMPLEMENTATION.md の Risk Assessment が「Doc enumeration and code drift apart
      again」を挙げていたのに、その列挙自身がドリフト元になった。
      権威的列挙を書く planner には、コード実測（grep）で列挙を裏取りする手順を
      課すと再発を防げる。
  - id: L3
    note: >-
      rework-planner への dispatch で write_policy.targets を空にしたため、
      IMPLEMENTATION.md / VERIFICATION.md の記述が rework 後の実装と食い違う状態が
      残り、planner が warnings W3/W4 で報告してオーケストレーターが手当てした。
      rework が既存の設計判断（D-2 等）を覆す場合、IMPLEMENTATION.md を
      write_policy.targets に含めて planner 側で直せるようにするほうが自然。
  - id: L4
