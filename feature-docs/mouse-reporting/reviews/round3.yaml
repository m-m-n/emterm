  file: src-tauri/src/window_host/mouse_report.rs
  line: 863
  title: SC-8 rejection suppresses the event's LOCAL behaviour too, not just the report — wheel over the
    status bar / scrollbar overlay / title bar / CSD resize band is now dead (AC12, FR10)
  description: '`decide_wheel_event` returns `SequenceOutcome::nothing()` when `point_belongs_to_grid`
    is false (mouse_report.rs:863-865); `handle_mouse_wheel`''s perform step then takes the `None => {}`
    arm (pointer_routing.rs:983) and runs NO local arm. The base commit 1d5af0d''s `handle_mouse_wheel`
    had exactly three early-return guards — profile selector, tab-bar band, mux sidebar — and every other
    position fell through to the alt-scroll / scrollback paths. `GridOwnershipInputs` rejects four regions
    the base wheel path never guarded: the bottom status strip, the right-edge scrollbar overlay, the
    CSD resize hot zone on all four edges, and the CSD title-bar band below TITLE_BAR_HEIGHT. In all four
    the wheel now does nothing at all, and this happens with NO tracking mode active because SC-8 is consulted
    before the tracking-active read. SPEC AC12 requires a guarded-region event to emit no report and retain
    its current local behaviour; IMPLEMENTATION SC-8''s own Post says the same. The press path has the
    same shape: the base bottom-strip / scrollbar / sidebar guards were `button == Left && state == Pressed`,
    so a middle press over those regions used to reach the PRIMARY-paste arm; SC-8 is button-identity-independent
    and now swallows it. No test pins the wheel-over-status-bar / wheel-over-scrollbar local behaviour.'
  suggestion: 'Make SC-8''s false answer decide reporting only, never local behaviour. Either (a) have
    `decide_wheel_event`''s rejection arm return `Disposition::Local(LocalArm::ScrollScrollback)` and
    the press path''s rejection return the local disposition with no gesture record, or (b) add a fourth
    `Disposition::NotGridOwned` that the handlers route into the pre-task0006 local path unchanged. Pin
    the result with regression tests: wheel over the status bar, over the scrollbar overlay, over the
    CSD title-bar band and inside the edge-resize band each move the scrollback; middle press over the
    status bar still pastes PRIMARY.'
  sources:
