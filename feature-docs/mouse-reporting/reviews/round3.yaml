  file: src-tauri/src/window_host/mouse_report.rs
  line: 31
  title: Module dependency cycle between mouse_report (window-free decision layer) and input_translate
    (translation layer)
  description: 'mouse_report.rs:31 has `use super::input_translate::{WheelConsumer, wheel_consumer};`
    while input_translate.rs:11 has `use super::mouse_report::MouseButtonId;`. The gather/decide/apply/perform
    seam did land at the type level — `decide_button_event` / `decide_motion_event` / `decide_wheel_event`
    take plain bundles and return a plain `SequenceOutcome` with no winit or host references. The defect
    is module-level: `mouse_report`''s own header asserts it is the layer where nothing reaches back into
    the routing side, yet it reaches into `input_translate` for `wheel_consumer`, which is itself a pure
    winit-free decision function in the wrong module. No functional impact; it weakens the isolation invariant
    the seam was built to establish.'
  suggestion: Move `WheelConsumer` and `wheel_consumer` (plus their tests) into `mouse_report.rs`, leaving
    `input_translate -> mouse_report` as the single dependency direction. `input_translate` keeps only
    the genuinely winit-coupled helpers.
  sources:
  - litellm:vertex-glm-5.2:architecture
