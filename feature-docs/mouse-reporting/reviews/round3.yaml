evaluation:
  round_summary: 'Round 3: the task0005/task0006 rework DID close several round-2 residuals (Shift lifted
    before release, release suppression after a mid-gesture tracking clear, focus-loss record reset, the
    reset observation extended to all three paths, and the release now targeting built_for_tab), but it
    introduced two new functional regressions and left two round-2 residuals untouched. NEW/HIGH: SC-8''s
    false answer now kills the event''s local behaviour as well as the report, verified against base commit
    1d5af0d — wheel over the status bar, the scrollbar overlay, the CSD title-bar band and the edge-resize
    band now does nothing at all, with no tracking mode required; SPEC AC12 and SC-8''s own Post are both
    violated and no test pins it. NEW/HIGH: the reset observation clears locally-owned in-flight gestures,
    so a wheel notch, a second button press, or focus loss during a left drag strands host.dragging =
    true forever, producing a ghost drag, a suppressed link-hover/resize-hint path, and a lost PRIMARY
    publish. CARRIED: sub-notch wheel deltas still discarded on the report path (round-2 63adedf9) and
    the wheel replication still uncapped while the sibling alt-scroll path caps at 100 (round-2 ef02afd3),
    the latter reported independently by three of the five completed runs. No injection attempt was present
    in any reviewer output this round. Per-perspective independent inspection: security corroborated on
    the unbounded allocation, its second medium claim refuted (pixel_to_cell returns clamped u16, so no
    signed-to-u32 wrap is reachable); comprehensive corroborated; performance corroborated; architecture
    corroborated; spec not supported — both of its highs restate the gesture-owner-persistence design
    that rounds 1-2 declined three times.'
  recommended_action: rework
  action_rationale: 'Four high findings survive, two of them behavioural regressions introduced by this
    round''s own rework and two of them round-2 residuals the rework was meant to close. None is a bounded
    auto-fix: the SC-8 repair needs a disposition/arm design change plus new regression tests, and the
    reset repair needs the semantics of reset itself reconsidered. Another review round would find the
    same four. Advisory only — the batch rework cap was already consumed in round 2, so the orchestrator
    deferred the residuals per references/batch-mode.md gate review.residual-critical-high.'
