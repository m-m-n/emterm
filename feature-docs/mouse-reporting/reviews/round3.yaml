- stable_id: c58af8662ff258af
  severity: medium
  category: performance
  file: src-tauri/src/window_host/pointer_routing.rs
  line: 258
  title: Every PointerMoved pays two core mutex locks and the full chrome hit-test set before the tracking-active
    check
  description: 'The mouse-reporting block in `handle_pointer_moved` (pointer_routing.rs:258-292) runs
    unconditionally on every raw winit motion event: `TrackingState::read(&tab.core.lock())`, `host.pixel_to_cell`,
    then `grid_ownership_inputs` which takes a second `tab.core.lock()` for `get_scrollback_length()`
    / `rows()`, plus `surface_size()`, the scrollbar-overlay test, `ui::mux_sidebar::point_in_sidebar`
    and `host.resize_direction_at`. Several of these duplicate work the same handler already did above
    — `point_in_sidebar` at :201 and `resize_direction_at` inside `update_resize_hint` at :219. When no
    tracking mode is active and no Report-owned gesture is held, `decide_motion_event` can only return
    `Nothing`, so all of it is discarded. SPEC NFR1 names `handle_pointer_moved` as a path the project
    already optimised for CPU.'
  suggestion: Read `TrackingState` first and skip `pixel_to_cell` plus `grid_ownership_inputs` when no
    tracking mode is active and no Report-owned gesture is held, preserving whatever record bookkeeping
    that path still owes. Where the full path is taken, thread the already-computed `point_in_sidebar`
    / resize-direction results into `grid_ownership_inputs` instead of recomputing them, and take the
