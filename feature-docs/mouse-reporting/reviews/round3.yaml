- stable_id: 6b3c1982776dd091
  severity: medium
  category: comprehensive
  file: src-tauri/src/window_host/mouse_report.rs
  line: 698
  title: A release is targeted at built_for_tab but decided with the ACTIVE tab's tracking bits and encoding;
    owned motion targets active_tab instead (round-2 deferred 4135f94e residual)
  description: '`decide_release` honours D12 correction #2 by sending to `inputs.records.built_for_tab.unwrap_or(inputs.active_tab)`
    (mouse_report.rs:704), but `mode_1000/1002/1003` and `encoding` in the same bundle were gathered by
    `run_button_decision` from `app.active_tab()` (pointer_routing.rs:626-629, 646-650). If the active
    tab changes between press and release: the new tab having no tracking mode suppresses the release
    destined for the old tab, leaving that application with an unbalanced press and a stuck drag; and
    the new tab having 1006 while the old one is X10 writes an SGR-form release into an X10-speaking application.
    `report_motion` compounds the split — under `Some(GestureOwner::Report)` it ignores `tab_changed`
    entirely and sends to `inputs.active_tab` (mouse_report.rs:797), so within one drag the motions go
    to tab B while the release goes to tab A. This is the residual of round 2''s deferred finding 4135f94ec9964b5b
    and also covers prior stable_id 6e36e1d10dc4e599.'
  suggestion: 'Make the decision inputs and the destination come from the same tab. Preferred: record
    the press-time `TrackingState` (mode bits plus encoding) in the `GestureOwnership` slot alongside
    the owner, and decide the release from that snapshot. Alternatives: gather from `records.built_for_tab`''s
    core when it is `Some`, or discard the SC-9 record outright the moment the active tab changes while
    a gesture is owned. Whichever is chosen, route owned motion to the same tab the matching release will
    target.'
  sources:
  - claude:comprehensive
  confidence: 85
  resolution: unresolved
  resolution_reason: 'medium severity: below the Phase R4 auto-fix candidate gate (critical/high only).'
