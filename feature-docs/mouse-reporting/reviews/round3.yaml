  run_id: security#1
  reason: 'False positive, refuted by independent inspection of the gather sites. WindowHost::pixel_to_cell
    (resize_layout.rs:314-323) returns (u16, u16): it applies .max(0.0) to both pixel offsets before the
    division and clamps with .min((cols-1) as u32) / .min((rows-1) as u32). `col as u32 + 1` and `screen_row
    as u32 + 1` therefore always yield at least 1 and at most 65535 — no negative input, no u32 wraparound.
    The claimed wrapped SGR output is unreachable.'
