- stable_id: 3d92ef44b051ecc0
  severity: high
  category: comprehensive
  file: src-tauri/src/window_host/pointer_routing.rs
  line: 913
  title: Sub-notch wheel deltas are silently discarded on the report path — touchpad scrolling is dead
    while tracking is active (round-2 residual 63adedf9 still open)
  description: 'The report path''s volume is decided solely by `wheel_report_notches(lines)` (input_translate.rs:452),
    a stateless `lines.abs().floor() as i32`. If it returns 0 the `if notches != 0` guard at pointer_routing.rs:915
    writes nothing and no local arm runs either, so the event vanishes. On the `MouseScrollDelta::PixelDelta`
    path `lines = p.y / cell_h`, which on a high-resolution touchpad is typically 0.1-0.3 per event; nothing
    accumulates the remainder, so the wheel is permanently unresponsive inside any mouse-aware TUI. Both
    sibling paths do better: the alternate-scroll arm carries the fraction through `accumulate_alt_scroll_lines`,
    and the tracking-inactive scrollback arm tests `lines > 0.0` so even a fraction moves one step. This
    is round 2''s unresolved finding 63adedf9fb56b452 carried forward unchanged through the task0005/task0006
    rework, and it undermines SPEC TS10.'
  suggestion: 'Give the report path its own fractional accumulator on the host (`wheel_report_accum: f32`
    in mod.rs), consumed exactly like `alt_scroll_accum`: take `(whole, frac)`, emit bytes only when `whole
    != 0`, store `frac` back. Reset it on active-tab change and when the tracking mode is cleared, so
    a carried fraction cannot leak across gestures.'
  sources:
  - claude:comprehensive
  confidence: 100
  resolution: deferred
