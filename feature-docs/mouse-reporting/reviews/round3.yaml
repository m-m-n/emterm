- stable_id: 1ac64f41111531a6
  severity: high
  category: comprehensive
  file: src-tauri/src/window_host/mouse_report.rs
  line: 912
  title: The reset observation clears LOCALLY-owned in-flight gestures, permanently latching host.dragging
    and losing the PRIMARY publish (ghost drag)
  description: '`apply_outcome` runs `records.gesture_owner.clear_all()` whenever `updates.reset` is set
    (mouse_report.rs:912-915), and `reset = !tracking_active || tab_changed` is raised by `decide_press`,
    `decide_wheel_event` and `decide_release`''s no-owner branch. With no tracking mode active — the common
    case — reset is true on every press and every wheel notch. A left press over the grid records `Left
    = Local` and `begin_selection_drag` sets `host.dragging = true` (pointer_routing.rs:330); any wheel
    notch or second button press during that drag then fires reset and wipes the Left slot; the matching
    left release finds `peek(Left) == None`, returns `Disposition::Nothing`, and `complete_selection_and_publish_to_primary`
    never runs. `host.dragging` is assigned in exactly two places crate-wide (pointer_routing.rs:330 true,
    :353 false) and nothing else clears it, so it latches true forever. The same latch is reachable via
    focus loss: event_loop.rs:249 calls `mouse_report::clear_all` on `Focused(false)` but touches neither
    `host.dragging` nor `app.pending_selection_anchor`. Consequences: every subsequent PointerMoved extends
    the selection with no button held, `update_resize_hint` / `refresh_link_hover` are permanently skipped,
    and the selection is never published to PRIMARY. The base code''s unconditional `(Left, Released)
    => host.dragging = false` arm made this unreachable, so it is a task0005/task0006 regression.'
  suggestion: 'Make the left-release teardown unconditional on ownership: even with no recorded owner,
    clear `host.dragging` and consume `app.pending_selection_anchor`. Additionally exclude currently-held
    buttons from what `reset` clears — reset exists to invalidate the cell cache and stale gesture records,
    not to abandon a gesture that is physically still in progress — and have the focus-loss path clear
    `host.dragging` plus the pending anchor alongside `mouse_report::clear_all`. Add regression tests
    for wheel-during-left-drag, second-button-during-left-drag and focus-loss-during-left-drag, each ending
    with `dragging == false` and the selection published.'
  sources:
  - claude:comprehensive
  confidence: 85
  resolution: deferred
  resolution_reason: 'batch mode: rework cap reached — auto-fix skipped at the Phase R4 conflict gate:
    the prescription spans 2-3 files while the review-editor is strictly single-file, and the suggestion
    offers mutually exclusive designs. Codex (muse-spark via LiteLLM) was consulted and judged skipping
