- stable_id: 7063d53b08e160d8
  severity: high
  category: security
  file: src-tauri/src/window_host/pointer_routing.rs
  line: 917
  title: 'Wheel-report replication is unbounded: one wheel event can request a multi-GB allocation and
    flood the PTY (round-2 residual ef02afd3 still open)'
  description: 'Reported independently by three of the five completed runs this round (security#1 at :920
    high, performance#0 at :917 high, comprehensive#fallback at :917 medium). `wheel_report_notches` (input_translate.rs:452)
    rejects only non-finite input and then does `lines.abs().floor() as i32`, which saturates a large
    finite f32 to i32::MAX. pointer_routing.rs:917-921 then does `Vec::with_capacity(bytes.len() * notches.unsigned_abs()
    as usize)` followed by that many `extend_from_slice` copies and one `tab.write_input(buf)`. With an
    SGR payload of ~10 bytes and a saturated notch count this is a ~21 GB reservation, and short of that
    a single inertial or synthetic pixel burst turns one input event into a multi-megabyte PTY write plus
    an event-loop stall. The codebase already decided this class needs a bound: the sibling alternate-scroll
    path caps at `MAX_ALT_SCROLL_NOTCHES = 100` (input_translate.rs:373). This is round 2''s unresolved
    finding ef02afd34f1da70f, unchanged by the rework.'
  suggestion: 'Clamp at the converter so no caller can be surprised: `wheel_report_notches` saturates
    to a small bound (reuse `MAX_ALT_SCROLL_NOTCHES`, or add a dedicated report cap) before the `as i32`
    cast. Additionally bound the replication loop and the `with_capacity` argument at the call site. Add
    unit tests for `f32::INFINITY`, `f32::NAN` and a very large finite value asserting the clamped result.'
  sources:
  - litellm:muse-spark:security
  - litellm:muse-spark:performance
  - claude:comprehensive
