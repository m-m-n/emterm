- stable_id: b6f106806d26b55e
  severity: medium
  category: spec
  file: src-tauri/src/window_host/pointer_routing.rs
  line: 410
  title: "Release suppression beyond Shift sole override"
  description: >-
    SPEC FR7 states that holding Shift suppresses mouse reporting entirely for
    that event and that no other modifier, key, setting or menu suppresses
    reporting. The loop-1 auto-fix suppressed a non-Shift release based on prior
    drag state, which contradicts per-event Shift-only suppression and dropped a
    release report FR2 requires.
  suggestion: >-
    No action against the current tree: the construct this describes was
    reverted. Any rework fix for 97676659aa15db37 must keep FR7's sole-override
    rule intact.
  sources: [litellm:muse-spark:spec]
  confidence: 60
  resolution: declined
  resolution_reason: >-
    Artefact of the loop-1 auto-fix (commit b1244629), reverted at ae47aa35.
    Recorded as a constraint on the rework fix for 97676659aa15db37.
evaluation:
  round_summary: >-
    Round 1, diff mode, cross_validation on. Six runs dispatched, five completed
    (architecture#0 skipped: rate_limited; the architecture perspective is still
    covered by architecture#1, so no perspective is unreviewed). Eleven reviewer
    findings in, six carried out after dedupe and re-ranking: three high (all
    verified by the evaluator reading the code itself) and three medium. The
    dominant theme is one root cause with three faces — the report path was added
    to three handlers that do not share guard precedence, so FR10/AC12 fail for
    non-left presses in guarded chrome, for presses in the CSD resize gutter, and
    for motion everywhere outside the grid; the second independent high is a
    press/release ownership split that leaves the terminal permanently stuck in
    selection-drag after a Shift+drag whose Shift is released first. No injection
    attempt, role override or embedded-instruction pattern was present in any
    reviewer output. Per-perspective independent inspection (read budget 10
    files): security corroborated (reports are numeric and bounded, X10 button
    byte peaks at 121, coordinates clamped by pixel_to_cell and rejected above
    223, no new input channel, write_input is the pre-existing transport);
    performance corroborated (the motion path adds one core.lock() per raw
    PointerMoved, but refresh_link_hover already locks the same core on that
    path, so this is not a new class of per-event cost); comprehensive, spec and
    architecture produced the findings above. One cross-cutting observation: the
    L3 routing tests (tests.rs:1592-1690) are source-scanning tests that pin only
    the ORDER of the blocks, so they should not be read as behavioural coverage
    of the routing layer.
  recommended_action: "rework"
  action_rationale: >-
    Three high findings remain, none cosmetic: two are explicit SPEC FR10/AC12
    conformance failures and one is a state-lifecycle defect that leaves the
    terminal permanently stuck in selection-drag. The fixes span two handlers
    plus the focus-loss arm in event_loop.rs and need new behavioural tests,
    which is past what a bounded auto-fix should attempt.
