      language: rust
      build_command: bash scripts/fetch-fonts.sh && bun install && bun run build:viewer && bun run build:settings && CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml
      test_command: bash scripts/fetch-fonts.sh && bun install && bun run build:viewer && bun run build:settings && CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      format_command: ''
      e2e_test_command: ''
    term_core:
      language: rust
      build_command: CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path crates/term_core/Cargo.toml
      test_command: CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path crates/term_core/Cargo.toml --lib
      format_command: ''
      e2e_test_command: ''
    cli_only:
      language: rust
      build_command: CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features
      test_command: ''
      format_command: ''
      e2e_test_command: ''
    web:
      language: typescript
      build_command: bun run build:viewer && bun run build:settings
      test_command: bun test
      format_command: ''
      e2e_test_command: ''
workflow:
- id: create-spec
  artifacts:
  - REQUIREMENTS.md
  - SPEC.md
  status: completed
  completed_at_commit: 70b31f71a94f9dc221b1fefb2d4d9d0a1d8d5dc6
- id: design
  artifacts:
  - DESIGN.md
  - design/
  status: skipped
  skipped_reason: 'The feature adds no user-visible UI surface: it changes how existing pointer events are routed and introduces a byte encoding on the PTY input path. It touches none of the three Material Design 3 mirror layers (doc/UI-DESIGN-GUIDELINES.yaml, src-tauri/src/ui/md3.rs, src-tauri/web-shared/styles.css), adds no widget, dialog or panel, and renders nothing new. With requirement.settings-gate resolved to no_setting, the one branch that could have introduced a settings-panel row is closed. The task description confirms this: its acceptance criteria are all protocol-level and its constraints section names no UI concern. Accepted at gate create-spec.design-step via option decide_autonomously.'
- id: create-plan
  artifacts:
  - IMPLEMENTATION.md
  - VERIFICATION.md
  - tasks/
  status: completed
  completed_at_commit: 23906ac661365375fb2b32df87528d5f0bea530f
- id: implement
  status: completed
  base_commit: 1d5af0d319021e901aa843398fd558e5a65893dc
  completed_at_commit: c4d862dc6b1b98f3fc1336efc511bd8d3a4c8731
- id: review
  status: completed
  completed_at_commit: e8ae8d68b1caf91cd200f26e434ff20906a3062d
- id: verify
  status: failed
  result: fail
  failed_items:
  - id: TS-19
    category: comprehensive
    note: >-
      VERIFICATION.md は「(region, event kind, button identity) の表駆動で、拒否域上の
      middle / right の押下・解放、および bottom strip / scrollbar overlay 上のホイール
      ノッチが no bytes になること」を求めているが、実処理（handle_pointer_button /
      handle_mouse_wheel）に対する振る舞い検証は存在しない。実装されているのは
      point_belongs_to_grid の純粋関数表テストと、pointer_routing.rs のソース文字列に
      対する出現順アサーション（include_str! + 部分文字列位置比較）のみで、配線の
      正しさ（実際にバイトが出ないこと）は確認されていない。
  - id: TS-20
    category: comprehensive
    note: >-
      VERIFICATION.md は「press → shift 状態変化 → release の系列」を求め、Shift 押下中の
      press を Shift 解放後に release したとき「バイトが出ず、drag フラグが解除され、
      pending selection anchor が消費され、選択が PRIMARY に届く」ことを要求している。
      実装されているのは gesture_ownership_* の純粋関数テスト（press/release のルーティング
      判定のみ）と release 短絡のソース出現順アサーションで、系列としての振る舞い、
      drag フラグ、PRIMARY 到達はどこでもアサートされていない。
  - id: TS-21
    category: comprehensive
    note: >-
      VERIFICATION.md は「抑止されたモーションがキャッシュ済み最終報告セルを進めないことを、
      バイト不在ではなくキャッシュ状態に対してアサートする」ことを求めている。実装は
      belongs_pos < gate_pos / belongs_pos < filter_pos というソース文字列の出現順
      アサーションのみで、mouse_report_cell_cache の状態は一切観測していない。
- id: retrospect
  status: pending
