goal: |
  # マウスレポート（DECSET 1000/1002/1003/1006）の実装

  Notion task: https://www.notion.so/3dc3509ec8ee813d97fcde5a03d4d99c
  種別: 機能

  ## やりたいこと (必須)
  マウスレポート（DECSET 1000 / 1002 / 1003 / 1006）を実装し、マウス操作に対応した
  TUI アプリを eMterm 上で操作できるようにする。

  ## 背景・なぜ (必須)
  マウス操作をサポートする TUI アプリを eMterm 上で動かしても、マウスが反応しない。
  設定で無効化しているわけではなく、マウスレポート自体が未実装になっている。
  調査時点の状況:
  - `crates/term_core/src/csi_modes.rs:112` — DECSET 1000 / 1002 / 1003 / 1005 / 1006 は
    `MODE_ACTION_TS_FALLBACK` を返すだけで、ホスト側に解釈する経路が無い（旧 WebView
    実装で TS 側にフォールバックしていた頃の残骸）
  - `src-tauri/src/window_host/pointer_routing.rs` — クリック / ホイールの処理はテキスト
    選択・スクロール・DECSET 1007（alternate scroll）の矢印変換のみで、マウスイベントを
    PTY に書く経路が無い
  - `crates/app_settings` にマウス関連の設定項目が無い

  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] DECSET 1000 / 1002 / 1003 を core 側でモードビットとして保持し、ホストから参照できる
  - [ ] DECSET 1006（SGR 拡張レポート）に対応し、有効時は `CSI < b ; x ; y M`（解放は `m`）形式で PTY に送る
  - [ ] 1006 が無効なときは X10 互換形式（`CSI M` + 32 オフセットの 3 バイト）で送る
  - [ ] ボタン押下・解放・移動・ホイールを、有効になっているモードに応じてレポートする
  - [ ] 修飾キー（Alt / Ctrl）のビットをレポートに載せる
  - [ ] マウスレポート有効中でも、Shift 押下中のマウス操作は PTY に送らず eMterm 側のテキスト選択に使う
  - [ ] レポートのバイト列生成に単体テストがある

  ## スコープ外 (任意)
  - DECSET 1005（UTF-8 拡張レポート）、1015（urxvt 形式）への対応

  ## 制約・前提 (任意)
  - Linux / Windows の両対応
  - 既存のテキスト選択と DECSET 1007（alternate scroll）の挙動を壊さない
