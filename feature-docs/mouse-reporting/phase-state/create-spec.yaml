  requirement.wheel-routing:
    packet_id: create-spec-q0001
    answered_at: "2026-09-18T23:53:40+09:00"
    source: batch-codex-consultation
    answer_mode: select
    selected_option_ids: [report_always]
    freeform: null
    normalized_answer: report_always
    resolution_note: >-
      gate: create-spec.requirement-clarification;
      policy action: codex_consultation;
      codex_consulted: true (via LiteLLM-routed codex harness after the default wrapper returned a usage-limit error);
      Codex chose report_always and the orchestrator confirmed it maps onto a declared option_id. Rationale adopted: xterm convention reports the wheel as buttons 64/65 on BOTH main and alternate screen whenever a tracking mode is on;
      the DECSET 1007 arrow translation and eMterm scrollback scroll apply only when tracking is off, which keeps the three wheel consumers mutually exclusive behind one check. recorded_as_assumption: true;
  requirement.settings-gate:
    packet_id: create-spec-q0001
    answered_at: "2026-09-18T23:53:40+09:00"
    source: batch-codex-consultation
    answer_mode: select
    selected_option_ids: [no_setting]
    freeform: null
    normalized_answer: no_setting
    resolution_note: >-
      gate: create-spec.requirement-clarification;
      policy action: codex_consultation;
      codex_consulted: true;
      Codex chose no_setting. Rationale adopted: no acceptance criterion asks for a setting;
      xterm default is to follow the application's DECSET request;
      a default-off setting would leave mouse support inert out of the box and a default-on setting adds a Rust struct field, the TypeScript AppSettings mirror and a settings-panel row for no behavioural gain. The Shift override remains the user's escape hatch. crates/app_settings stays untouched. recorded_as_assumption: true;
  requirement.modifier-click-override:
    packet_id: create-spec-q0001
    answered_at: "2026-09-18T23:53:40+09:00"
    source: batch-codex-consultation
    answer_mode: select
    selected_option_ids: [shift_only_override]
    freeform: null
    normalized_answer: shift_only_override
    resolution_note: >-
      gate: create-spec.requirement-clarification;
      policy action: codex_consultation;
      codex_consulted: true;
      Codex chose shift_only_override. Rationale adopted: this is the only option that satisfies the task's own acceptance criterion requiring the Ctrl modifier bit in reports - keep_local_ctrl_and_middle would make bit 16 unreachable for the left button. Existing behaviour is preserved behind Shift: Shift+Ctrl+click opens a link, Shift+middle-click pastes PRIMARY, Shift+drag selects text. recorded_as_assumption: true;
  edge.x10-coordinate-overflow:
    packet_id: create-spec-q0001
    answered_at: "2026-09-18T23:53:40+09:00"
    source: batch-codex-consultation
    answer_mode: select
    selected_option_ids: [suppress]
    freeform: null
    normalized_answer: suppress
    resolution_note: >-
      gate: create-spec.requirement-clarification;
      policy action: codex_consultation;
      codex_consulted: true;
      Codex chose suppress. Rationale adopted: clamping collapses every column beyond 223 onto one cell, so a wide window would deliver confidently wrong click coordinates to the application;
      suppressing an unencodable event fails safe and is directly testable without extra mapping logic. Applications needing wide coordinates are expected to enable SGR 1006. recorded_as_assumption: true;
  nfr.motion-granularity:
    packet_id: create-spec-q0001
    answered_at: "2026-09-18T23:53:40+09:00"
    source: batch-codex-consultation
