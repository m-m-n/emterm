    freeform: null
    normalized_answer: cell_change_only
    resolution_note: >-
      gate: create-spec.requirement-clarification;
      policy action: codex_consultation;
      codex_consulted: true;
      Codex chose cell_change_only. Rationale adopted: handle_pointer_moved runs per raw winit event on a path the project already had to optimise for CPU;
      caching the last reported cell caps report volume at grid resolution with no compatibility loss, since applications only resolve to cell granularity anyway. recorded_as_assumption: true;
