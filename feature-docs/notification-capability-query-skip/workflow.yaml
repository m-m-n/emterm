schema_version: 1
feature: notification-capability-query-skip
created: '2026-09-25'
base_branch: main
goal: |+
  # 通知 1 件ごとの同期 D-Bus 往復が 2 回に倍増している

  ## やりたいこと（必須）
  通知 1 件あたりの同期 D-Bus 往復が 1 回増えている状態を解消する。`get_capabilities()` を毎送信・無条件に発行するのをやめる。
  ## 背景・なぜ（必須）
  `NotifyRustSink::send` は 2 つのホットパスから同期的に呼ばれる。
  1. `NativeCallbacks::handle_notify`（`src-tauri/src/callbacks.rs:458`）は `TerminalCore::process_pty_data` の中の OSC コールバックなので、PTY 読み取りスレッドが往復ぶん停止する
  2. `App::notify`（`src-tauri/src/app/mod.rs:827`）は `App::pump_all` のフレーム内ループ（`:1328`）と agent_status / link_hover から呼ばれるため、winit の UI スレッドがフレーム中に停止する
  そこへ PR #35 が `notify_rust::get_capabilities()` を毎送信・無条件に追加した。notify-rust 4.12 の zbus バックエンドでは `get_capabilities()` は `zbus::Connection::session()`（ソケット接続 + SASL 認証 + Hello ハンドシェイク）を新規に張ってから GetCapabilities を 1 往復し、それを `block_on` する。`.show()` も同様に接続を張るため、1 通知あたりのブロッキング D-Bus コストが接続 1 + 往復 1 から接続 2 + 往復 2 へ倍増する。
  `NotificationRateLimiter` は同一 (title, body) を 1 秒抑止するだけなので、body が異なる OSC 9 を連続で吐くスクリプトでは抑止が効かず、倍増分がそのままレンダースレッドの停止時間として積み上がる。
  なお `pending_notifications` のドキュメントコメント（`src-tauri/src/callbacks.rs:279-281`）は「バッファリングによって process_pty_data 内で D-Bus 往復をしない」と述べているが、実装は既にインラインで送っており、PR #35 でその乖離がさらに広がっている。
  - 該当箇所: `src-tauri/src/callbacks.rs:157`
  - 検出元: PR https://github.com/m-m-n/emterm/pull/35 のレビュー round1、finding `c1b7251a310b62cc`（severity medium / category performance / confidence 100）および `ba32033b6ad194af`（comprehensive）
  - Claude と vertex-deepseek-v3.2 が独立に同一箇所を指摘しており、クロスモデル合意あり
  - 記録: `feature-docs/notification-body-markup-escape/reviews/round1.yaml`
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] 対処方針を選ぶ: (a) メタ文字ショートサーキット（body に `&` `<` `>` が無ければ結果は入力と同一なので capability 問い合わせ自体を省く。IMPLEMENTATION.md D2 の「キャッシュしない」判断と両立する）、(b) capability を短時間キャッシュする（`OnceLock<bool>` または TTL 付き。D2 の決定を覆す形になるので明示的に判断する）、(c) `send` 自体を `pending_notifications` のドレイン経路に寄せて PTY 処理スレッドと UI フレームから同期 D-Bus を外す
  - [ ] いずれも取らない場合は `src-tauri/src/callbacks.rs:279-281` のドキュメントコメントを実態（コールバック内で同期 D-Bus 往復が 2 回起きる）に合わせて更新する
  - [ ] `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` が通る
  ## スコープ外（任意）
  - 通知経路そのものの完全な非同期化（(c) を選ぶ場合を除く）
  - エスケープ処理の内容変更
  ## 制約・前提（任意）
  - PR #35 がマージされた後の状態を前提に着手すること
  - (a) と (b) は併用可能

