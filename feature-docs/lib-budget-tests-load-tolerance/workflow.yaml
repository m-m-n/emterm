schema_version: 1
feature: lib-budget-tests-load-tolerance
created: '2026-10-04'
base_branch: main
goal: |
  # --lib 全体で経過時間 assert（BUDGET 10s）の 2 テストが高負荷環境で恒常的に失敗する

  Notion task: https://www.notion.so/3ee3509ec8ee81d496bae3ce55906c6b
  種別: バグ

  ## 現象 (必須)
  `--lib` 全体の実行で、経過時間 assert（BUDGET 10s）を持つ次の 2 テストが恒常的に失敗する。
  - `round4_chain::the_ring_at_a_cut_replays_like_the_raw_stream_over_the_token_corpus`（実測 24s）
  - `strip_concat_query::strip_concat_alternations_and_chains_finish_within_the_budget`（実測 35-43s）
  負荷平均 10-20 の環境で、base main `0c3a2c06` でも同じく失敗する。mux-vt100-del-closing の verify で検出した（その feature の変更起因ではない）。
  ## 再現手順 (必須)
  1. 負荷平均 10-20 程度の環境で `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` を実行する
  2. 上記 2 テストが経過時間 assert で失敗する
  ## 期待する挙動 (必須)
  `--lib` 全体の実行で、環境の負荷によって上記 2 テストが失敗しない。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `src-tauri/src/mux/ipc/pty_spawn/tests.rs` 配下の `round4_chain` / `strip_concat_query` モジュール
  ## 実害・発生条件 (任意)
  高負荷環境で `--lib` 全体が失敗扱いになり、em-workflow の verify が既存失敗の判定を毎回要する。
