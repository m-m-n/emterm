    freeform: null
    normalized_answer: Windows では windows-sys に Win32_System_Threading を追加し、GetThreadTimes による現在スレッドの kernel+user 時間で計測する。Linux は clock_gettime(CLOCK_THREAD_CPUTIME_ID)。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation, record_as_assumption); Codex (run_codex_exec.sh readonly, codex harness, 1 turn, converged) consulted; Opus
      escalation: not run; options: windows_get_thread_times [chosen] / unix_cpu_windows_wall / budget_unix_only [not chosen]; key points: analyst 推奨は unix_cpu_windows_wall だったが、Codex は Windows にも負荷による待ち時間の除外を適用できる点で
      GetThreadTimes を推奨。既存の windows-sys の feature 追加のみで新規クレートは不要(Cargo.toml:246)。orchestrator は両プラットフォームで同じ判定になる点を比較優位と判断して採用'
