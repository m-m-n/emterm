    - cpu_time_code_under_test
    freeform: null
    normalized_answer: strip_concat_alternations_and_chains_finish_within_the_budget は、strip・snapshot strip・write filter 呼び出しのスレッド CPU 時間の合計を 10 秒の予算と比較する。入力生成・期待値生成・比較・テスト側の出力連結は計測に含めない。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation, record_as_assumption); Codex (run_codex_exec.sh readonly, codex harness, 1 turn, converged) consulted; Opus
      escalation: not run; options: cpu_time_code_under_test [chosen] / scaling_ratio / operation_count / ignore_bench [not chosen]; key points: 100k 反復の線形性検証(AC-7)を残す。filter 呼び出しは同期処理で現在のスレッドを測れる(write_filter.rs:303,480)。Linux
      は CLOCK_THREAD_CPUTIME_ID。orchestrator 実測: 無負荷 debug ビルドで試験全体 3.71s wall / 3.68s user（round4_chain 試験は 2.60s）で 10 秒予算に余裕がある'
