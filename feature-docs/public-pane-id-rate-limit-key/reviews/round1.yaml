  - stable_id: 0247047963c1c329
    severity: medium
    category: security
    file: src-tauri/src/app/agent_status.rs
    line: 120
    line_end: 120
    title: "Daemon-controlled IDs can still bypass and grow the rate limiter"
    description: >-
      The new prefix prevents cross-namespace collisions, but the learned-ID branch still
      uses mutable daemon-controlled data as the bucket identity. The ingest path overwrites
      the learned ID on every update (lines 321-322), so a malicious mux peer can rotate
      `public_pane_id` for one pane to obtain a fresh bucket for every qualifying transition,
      bypassing the per-pane notification limit. Each fired key remains in the rate limiter's
      non-pruning `HashMap`; pane closure discards only the currently mapped key, allowing
      stale entries and memory growth. Duplicate IDs can also make learned panes in the same
      scope share a bucket.
    suggestion: >-
      Key the limiter with a code-owned structured identity such as `(ConnectionScope,
      pane_id)`. If public IDs must remain part of the identity, enforce an immutable,
      one-to-one association at ingestion and remove the old limiter entry whenever an
      accepted ID changes. Add tests for duplicate and rotating public IDs.
    sources: [codex:security]
    confidence: 65
    resolution: unresolved
    resolution_reason: "medium severity — auto-fix gate is critical/high only; filed as a follow-up task (same site as 0810c3130449c0dc)"
