    title: "learned-id ブランチは同一スコープ内での daemon 由来キー衝突を防げていない"
    description: >-
      今回の変更は tab キー (AC-2) と未学習フォールバックキー (AC-3) との衝突は塞いだが、
      learned 同士の衝突は残っている。キーは `muxpub:<scope>:<learned>` なので、同じ mux
      接続 (同一 scope) の 2 つの pane に対して daemon が同一の `public_pane_id` を返すと、
      両 pane が同一の rate-limit バケットを共有する。最も現実的なのは空文字列のケースで、
      doc 自身が "An empty learned string still takes this branch" と認めているとおり、
      空 id を送る daemon では当該接続の全 pane が `muxpub:<scope>:` という単一キーに潰れ、
      片方の blocked/done 通知が他方の直近通知で抑止され、片方の pane クローズ時の discard
      が他方の限流状態まで消す。`mux_public_pane_ids` は (scope, pane_id) でキーされた
      マップなので、learned 文字列は (scope, pane_id) 以上の同一性を足していない。
      副作用として、daemon 再起動 + 再接続で incarnation が変わると同一 pane のキーが
      生存中に変化し、arm 済みの旧 `muxpub:<scope>:<old>` エントリはどの discard サイト
      からも参照されず `last_fired` に残留する。テストも同一 scope での learned 重複 /
      空文字列のケースを一切カバーしていない。
    suggestion: >-
      いずれか。(a) mux pane のキーを learned id に依存させず常に `mux:<scope>:<pane_id>`
      にする — 導出元マップが既に (scope, pane_id) キーなので同一性の情報量は変わらず、
      キーは完全にコード所有・単射になり、上記の衝突も生存中のキー変化による残留も同時に
      消える。(b) learned id を残すなら wire pane_id を learned の前に入れて
      `muxpub:<scope>:<pane_id>:<learned>` とし、1 接続内の 2 pane が決してエイリアス
      しないようにする。どちらを採る場合も「同一 scope・異なる pane_id で daemon が同じ
      learned id (および空文字列) を返しても導出キーが異なる」ケースをテストに追加する。
