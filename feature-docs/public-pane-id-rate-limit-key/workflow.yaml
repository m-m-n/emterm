schema_version: 1
feature: public-pane-id-rate-limit-key
created: 2026-09-05
base_branch: main
goal: |
  # daemon 由来の public_pane_id を無検証で通知レート制限キーに使っている

  種別: バグ
  Notion: https://www.notion.so/3cf3509ec8ee8143bdaff4b6f96a83c7

  ## 現象（必須）
  mux daemon から届いた `public_pane_id` を、形式検証を通さずそのまま通知のレート制限キーと
  して使っている。この文字列は SSH 越しのリモートホスト上で動く外部プロセス（信頼境界の
  向こう側）が完全に制御できる。
  レート制限キー空間は全タブ・全接続で共有された単一の `String` 空間で、プレーンタブは
  `"tab:<stable_id>"`、未学習の mux ペインは `"mux:<scope>:<pane_id>"` という予約形を使う。
  daemon が `public_pane_id` に `"tab:5"` や `"mux:1:7"` を入れて送ると、被害側のタブ／接続と
  レート制限バケットを共有できてしまう。
  PR https://github.com/m-m-n/emterm/pull/49 の
  review round 1 で検出された medium finding（`b0b18cfdd15773d2`、security 観点、confidence 60）。

  ## 再現手順（必須）
  1. 改変した（あるいは侵害された）mux daemon を用意し、`AgentStatusUpdate` の
     `public_pane_id` に `"tab:<被害タブの stable_id>"` を入れて送るようにする
  2. eMterm のタブ 1 でその daemon に attach し、タブ 2 では通常のプレーンタブを使う
  3. 攻撃側パネルでエージェント通知を連発する
  4. タブ 2 の Blocked / Done 通知が抑止されることを確認する
  5. 攻撃側パネルを閉じ、`discard_agent_notification_state("tab:5")` が被害側のレート制限
     状態を消すことを確認する

  ## 期待する挙動（必須）
  daemon 由来の `public_pane_id` は、レート制限キーとして使う前に形式検証を通す。あるいは
  GUI 側の名前空間で包み、他タブ／他接続のキーと構造的に衝突しない形にする。

  ## 完了の定義（必須）
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所（任意）
  - `src-tauri/src/app/agent_status.rs:108-111` — `agent_notification_rate_limit_key` が
    `update.public_pane_id` をそのまま返している
  - `src-tauri/src/app/agent_status.rs:310` — `mux_public_pane_ids.insert`。ここで検証せずに
    学習している
  - `src-tauri/src/app/mod.rs:439` — `App::agent_notification_rate_limiter`。全タブ・全接続で
    共有された単一のキー空間
  - `crates/mux_ipc/src/protocol.rs` — `PublicPaneId::parse` が既にあるが、この経路では
    通っていない
  - `src-tauri/src/app/agent_status.rs:88-95` — 「`"mux:"` 接頭辞により `"tab:"` と衝突しない」
    と述べる doc コメント。成り立つのは fallback 分岐だけで、学習済み ID 分岐には当てはまらない

  ## 実害・発生条件（任意）
  発生条件: 改変された、あるいは侵害された mux daemon に attach すること。信頼できる自分の
  サーバーだけに接続している限りは発生しない。
  想定される修正方針は 2 つ。
  - (a) 受信時に検証する: `apply_agent_status_batch` で `mux_public_pane_ids` に入れる前に
    `mux_ipc::protocol::PublicPaneId::parse` を通し、失敗したら学習せず fallback キーを使う。
    parse は incarnation が小文字 hex であること・`-` 区切り・数値の pane 番号を要求するので、
    `"tab:5"` / `"mux:1:7"` のような予約形はそもそも作れなくなる
  - (b) 学習済み ID も名前空間で隔離する: `agent_notification_rate_limit_key` の MuxPane 分岐で
    daemon 文字列を生のまま返さず、`format!("muxpub:{}:{}", scope.0, id)` のようにスコープ込みで
    包む。レート制限キーは内部専用なので互換性の影響なしに適用できる
parent_branch: em-workflow/public-pane-id-rate-limit-key/integration

