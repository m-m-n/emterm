    freeform: null
    normalized_answer: >-
      Moot under the chosen fix approach. This question is conditional on
      validate_on_ingest, which was not chosen, so App::mux_public_pane_id's
      behaviour is unchanged by this feature and no malformed-id drop occurs.
      Recorded answer applies only if ingest validation is added later.
    resolution_note: >-
      gate create-spec.requirement-clarification -> codex_consultation.
      depends_on requirement.fix-approach, which resolved to
      namespace_learned_key, so the precondition of this question does not
      hold. Codex suggested drop_unparseable; it maps onto an existing
      option_id and is recorded for the conditional case only. Non-blocking
      question; it constrains no requirement in this feature.
