  requirement.fix-approach:
    packet_id: create-spec-q0001
    answered_at: "2026-09-05T10:35:06+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [namespace_learned_key]
    freeform: null
    normalized_answer: >-
      Namespace the derived key. In the MuxPane branch of
      agent_notification_rate_limit_key, return format!("muxpub:{}:{}", scope.0, id)
      instead of the raw daemon string. Learning at ingest is left untouched;
      no ingest-time PublicPaneId::parse validation is required by this feature.
    resolution_note: >-
      gate create-spec.requirement-clarification -> batch-policies.yaml
      action: codex_consultation (record_as_assumption: true). One Codex turn
      (run_codex_exec.sh readonly). Codex suggested namespace_learned_key,
      which maps onto an existing option_id; the orchestrator judged the
      mapping and adopted it. Rationale carried forward: a "muxpub:<scope>:"
      prefix is structurally disjoint from both reserved forms "tab:" and
      "mux:" and from other scopes, so it closes the reported cross-victim
      collision without changing App::mux_public_pane_id's observable value
      and without invalidating the five existing fixtures whose
      public_pane_id values fail PublicPaneId::parse.
  requirement.sidebar-public-id:
    packet_id: create-spec-q0001
    answered_at: "2026-09-05T10:35:06+09:00"
