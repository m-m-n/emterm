goal: '設定画面のプロファイルから「起動」機能を削除する


  Notion タスク: https://www.notion.so/3ed3509ec8ee812bb4a6d308747ec56f

  種別: 改善


  ## やりたいこと (必須)

  設定画面のプロファイルにある「起動」機能を削除する。

  ## 背景・なぜ (必須)

  Windows / Linux 環境において、設定画面のプロファイルから「起動」ができない。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 設定画面のプロファイルに「起動」の操作が表示されない

  - [ ] 「起動」機能に関するコードが削除されている

  ## スコープ外 (任意)

  \<今回やらないこと。あれば\>

  ## 制約・前提 (任意)

  対象は Windows / Linux。

  '
