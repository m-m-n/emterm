feature: mux-strip-concat-budget-overrun
created: 2026-11-08
base_branch: main
goal: '# mux の CPU 時間予算テスト strip_concat_alternations_and_chains_finish_within_the_budget が単独でも予算超過で失敗する


  種別: バグ


  ## 現象

  `mux::ipc::pty_spawn::tests::strip_concat_query::strip_concat_alternations_and_chains_finish_within_the_budget`
  が、debug ビルドの単独実行（`--test-threads=1`）でも失敗する。


  ```

  the measured calls exceeded the budget: thread CPU time 27.186514794s against the budget 10s

  ```


  並列の `cargo test --lib` では、`mux::ipc::pty_spawn` の次のテストも失敗する。`mux::ipc::pty_spawn::tests` を直列で再実行すると、これらは通る。

  - `escape_state_carry::escape_carry_alternating_written_escapes_and_strip_targets_finish_within_the_budget`

  - `post_strip_cut_csi::post_strip_alternating_strip_targets_and_open_csis_finish_within_the_budget`

  - `strip_open_string_body_closure::open_body_closure_a_dcs_or_apc_body_left_open_by_an_overflow_flush_is_closed_at_the_next_removal`

  - `visible_reattach_redelivers_alt_screen_and_main_screen_color_queries_once`（Timeout）


  ## 再現手順

  1. `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib strip_concat_alternations_and_chains_finish_within_the_budget
  -- --test-threads=1` を実行する

  2. 予算超過で失敗する


  ## 期待する挙動

  単独・直列の実行で安定して通る。CPU に負荷をかけずに判定できる。


  ## 完了の定義

  - 再現手順で現象が起きない

  - 再発を検出するテストがある


  ## 該当箇所

  - `src-tauri/src/mux/ipc/pty_spawn/tests/strip_concat_query.rs:1085`

  - osc52-clipboard-write-drain の verify で検出した。mux のコードは main と同一で、その機能の変更範囲外


  ## 実害・発生条件

  - `cargo test --lib` 全体が常に失敗し、verify で既存の失敗と新しい失敗を見分ける手間がかかる'
