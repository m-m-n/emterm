    で Ground に戻り OSC は Unterminated 通知(osc.rs:17,52; dcs.rs:8,29; apc.rs:8,29; escape.rs:54)。vte 0.15.0 では Escape 内の CAN が Ground に戻し DEL は状態を変えないため、ESC+CAN は vt100_replay_copy の DEL→CAN 書き換え(scrollback_filter.rs:389)に依存しない。注意:
    両案とも除去対象の開始にも ST にも一致しない(scrollback_filter.rs:674,733,764,788; write_filter.rs:1012,1070)。共有側 DCS/APC 探索が後続 ST まで走る既存の範囲問題は本修正で解消しない。EscDispatch の final_byte は CAN と DEL で異なる'
