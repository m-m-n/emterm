  file: src-tauri/src/mux/scrollback_filter.rs
  line: 807
  title: "ST 終端探索が見つけた ST の位置を記録せず、非 SIXEL DCS の反復で strip の処理量が入力長の二乗になる（既存挙動）"
  description: "find_st_terminator は ST が見つからなかったときだけ st_search_from を末尾へ進め、見つけたときは記録しない。strip_pass の DCS 分岐は非 SIXEL の DCS でも開始のたびに find_st_terminator を呼ぶため、『ESC P x』を N 回並べて末尾に ESC \\ を 1 つ置いた出力では処理量が O(N²) になる。スナップショット生成を長時間止められる可能性がある。この経路は 475a97e4（2026-06-19）からの既存挙動で、今回の差分は find_st_terminator にも DCS 分岐にも触れていない。除去を含まない入力でも再現する。SPEC A4 は DCS/APC の ST 探索を範囲外としている。TM-3 の検証テストは OSC 本文しか使っておらず、strip のドキュメントコメントの『single O(n) pass』はこの入力では成り立たない。"
  suggestion: "範囲外の既存問題として別フィーチャーで扱う。直すなら、見つけた ST の開始位置を strip_pass の中で記録し、次の開始位置がその ST 以前なら走査せずに同じ終端を返す。『ESC P x』×N + ESC \\（除去あり・なし）で処理時間が入力長に比例する回帰テストを追加し、ドキュメントコメントの O(n) の記述も合わせる。"
  sources: [codex:security]
  confidence: 70
  resolution: unresolved
  resolution_reason: "既存挙動・SPEC A4 で範囲外。medium のため完了ゲートに影響しない。Notion に別タスクとして起票する"
