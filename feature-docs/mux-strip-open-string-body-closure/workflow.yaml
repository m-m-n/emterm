schema_version: 1
feature: mux-strip-open-string-body-closure
created: '2026-10-04'
base_branch: main
goal: '# mux: 保持した未終了の OSC/DCS/APC 本文の中で除去が起きると後続バイトが本文に結合し OSC 11 色照会が成立する


  Notion task: https://www.notion.so/3ee3509ec8ee81fcbac5cf94e354df11

  種別: セキュリティ


  ## 脆弱性の概要 (必須)

  共有 strip（`strip_pass`）は、保持した未終了の OSC/DCS/APC 本文の中で除去対象を除去しても閉じるバイトを書かない。書き込み済み状態（`WrittenState`）が文字列本文を Ground として扱うため、除去後ろのバイトが本文に結合し、元の出力が作らなかった文字列照会（例: OSC 11 `?`）がリングに成立する。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: low

  - 該当パッケージ: 該当なし

  - 現在のバージョン: main（0c3a2c06 時点）

  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  細工した出力を表示させる（例: 細工したファイルを `cat`）だけで成立する。

  1. `ESC]11;` + 除去対象（例: `ESC]777;emterm;markdown;x BEL` や `ESC[6n`）+ `?BEL` を cut 無しで与えると、リングが `ESC]11;?BEL` になる。スナップショット strip も保持し、term_core は OSC 11 `?` を BEL 終端で処理して色応答（ThemeColorResponder）が返る。生の入力では除去対象の
  `ESC` で OSC 11 が未終了として打ち切られ、応答は無い。

  2. スナップショット再生中の応答はクライアントが破棄する（`src-tauri/src/tabs/replay.rs:96-105`）。一方、リングが `ESC]11;` + 除去対象で終わり、主画面の復帰スナップショットが末尾に何も足さない場合、再生後のパーサーが OSC 本文の中に残り、後から届くライブの `?BEL` に応答する。

  ## 影響範囲 (必須)

  再生側の端末が定型の OSC 色応答（OSC 4/10/11/12）をその時点の前景プログラムの PTY 入力へ書き込む。応答の形式は固定。履歴の折り返し時は `append_wrapped_dump_block_if_applicable`（`src-tauri/src/mux/snapshot_bytes.rs:490`）が画面復元データを末尾に足すため、ライブ継続の経路はその場合に成立しない。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] `ESC]11;` + 除去対象 + `?BEL` を cut 無しの 1 回の feed で与えたとき、再生で色応答が出ないことを検出するテストがある

  ## 該当箇所 (任意)

  - `src-tauri/src/mux/scrollback_filter.rs:315`（`Written::close_before_removal` は Csi / Escape 状態でだけ閉鎖を書く）

  - `src-tauri/src/mux/scrollback_filter.rs:207-247`（`WrittenState` が文字列本文を Ground として扱う）

  - `crates/term_core/src/parser/osc.rs:51`（生の入力では ESC + `\` 以外で OSC を Unterminated として送出）

  - 固定済み期待値: `scrollback_filter::tests::strip_concat_a_construct_removed_in_ground_adds_no_closing` の `ESC]0;t` 行、`strip_concat_query::strip_concat_a_construct_removed_in_ground_or_a_kept_string_adds_no_closing`
  の body_head ループ（変更時は決定記録が必要）

  - 経緯: feature mux-strip-join-escape-closure の create-spec で範囲外として残件化（`feature-docs/mux-strip-join-escape-closure/DECISIONS.md` に記録予定）

  ## 暫定緩和策 (任意)

  修正候補: 書き込み済み状態で保持中の未終了 OSC/DCS/APC 本文を追跡し、本文内で除去が起きたら、term_core が除去対象の `ESC` で行う打ち切りと同じ結果になる閉鎖（例: `ESC` + DEL）を書く。位置補正（remap）は閉鎖バイトを含める。

  '
