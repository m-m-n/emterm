schema_version: 1
feature: restored-pane-read-flake-fix
created: '2026-10-29'
base_branch: main
goal: '# mux pane の from_restored_pane_can_write_and_read_through_its_adopted_master
  が PTY エコーの短い read で間欠的に失敗する


  種別: バグ


  ## 現象 (必須)


  `mux::session::pane::tests::from_restored_pane_can_write_and_read_through_its_adopted_master`
  が `--lib` 全体の実行で間欠的に失敗する（未変更の `--lib` 全体で 37 回中 5 回、13.5 %）。失敗は `src-tauri/src/mux/session/pane/tests.rs:3284:5`
  の assert で、メッセージには読み取ったバイト列が出ない。


  原因は CPU 競合下での PTY エコーの短い read。テストは `restored-write\n` を 1 回書き（`pane/tests.rs:3278`）、64
  バイトまでの blocking `read` を 1 回だけ行う（`pane/tests.rs:3281-3283`）。エコー `restored-write\r\n`（16
  バイト）が一度に届かず、最初の read が 14 バイト未満の先頭部分だけを返すとマーカー `restored-write` を含まず失敗する。残りは 0.025-0.591
  ms 後に届く。


  ## 再現手順 (必須)


  1. 24 本の busy-loop スレッドで論理 CPU 24 個をすべて埋める

  2. 対象テストを単体で 150 回実行する（修正前は 28 回失敗、18.7 %）


  ## 期待する挙動 (必須)


  最初の read が先頭部分だけを返しても、期限内にマーカーが揃えば成功する。失敗時は読み取ったバイト列をメッセージに出す。


  ## 完了の定義 (必須)


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)


  - `src-tauri/src/mux/session/pane/tests.rs:3253-3291`

  - `src-tauri/src/mux/upgrade/tests.rs:295-299` のコメント（この read を決定的と記述している）

  - 参考になる既存の形: `src-tauri/src/pty/mod.rs:680-703`（期限まで読み足し、集めた文字列をメッセージに出す）


  ## 実害・発生条件 (任意)


  `--lib` 全体の検証結果が読めなくなる。修正の形（マーカーが揃うか期限切れまで読み足す）は再現プログラムで 19 992 回中 0 失敗（短い初回 read
  631 回を含む）と計測済み。blocking reader にはタイムアウトが無いため、期限には master fd の `poll` かヘルパースレッドが要る。根拠は調査
  feature restored-pane-read-flake-investigation の INVESTIGATION.md 1・3・5・8 節。

  '
