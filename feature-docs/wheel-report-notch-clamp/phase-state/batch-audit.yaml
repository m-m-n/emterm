      起動時の明示指示「不明点は Codex に相談し、比較的優れると判断した案を採用する」に従い、
      クランプ設計の 4 論点を Codex CLI (readonly) に相談した。採用結論:
      (1) 専用定数 MAX_WHEEL_REPORT_NOTCHES = 100 を新設（MAX_ALT_SCROLL_NOTCHES は再利用しない）、
      (2) 変換側と消費側の 2 層クランプ（defense in depth）、
      (3) 上限 100 を採用（他端末に明示上限は確認できず、互換性より資源消費の確実な制限を優先）、
      (4) 複製処理を純粋関数へ切り出して境界値を単体テストする。
      相談内容は Notion タスクページにコメントとして記録済み。
