lessons_candidates:
  - >-
    CI ワークフローの shell 展開に外部入力（タグ名 / workflow_dispatch 入力）が
    入る変更は、review の security / comprehensive が同一サイトに別々の処方を
    出して conflict グループになりやすい。batch では site skip → rework 委譲に
    なるため、round 数を 1 つ余分に消費した。
  - >-
    `always()` を含むジョブゲートは round 1 の修正で導入され、round 2 で
    「キャンセルを無視する」として medium 指摘に化けた。auto-fix が入れた
    ゲート条件は次ラウンドの重点確認対象にする価値がある。
  - >-
    lockfile のようなワークスペース構造依存のパスは、計画段階で実ファイルの
    所在を確認しないと files 予測を外す（task0002）。
