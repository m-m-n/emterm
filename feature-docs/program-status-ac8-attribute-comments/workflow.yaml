schema_version: 1
feature: program-status-ac8-attribute-comments
created: '2026-10-11'
base_branch: main
goal: |
  # program_status の ac8 許可リスト検査で、属性内のコメントが属性の開閉判定を狂わせ以降の use 行を見逃す

  Notion task: https://www.notion.so/3f63509ec8ee813a8510e178bdbd3511 (種別: 改善)

  ## やりたいこと
  `program_status` の ac8 許可リスト検査（`src-tauri/src/program_status/tests.rs`）で、属性の中のコメントが属性の開閉判定に影響しないようにする。

  ## 背景・なぜ
  em-workflow program-status-ac8-use-line-forms の review round 1 で残った medium 指摘（stable_id `50aab977c776b600`）。
  複数行属性の状態を次の行へ持ち越すようにした結果、`ac8_scan_attribute`（`tests.rs:1579-1609` 付近）が属性内のコメント（`//`、`/* */`）にある `[` や `"` も構文として数える。閉じている属性を開いたままと判定し、`ac8_check_allowlist` がその状態を持ち越すため、以降の行がすべて use ルートの検査から外れる。
  再現例（コード読みで確認済み）:
  ```
  #[allow(dead_code /* [ */)]
  struct X;
  use winit::event::Event;
  ```
  結果は空の Vec。変更前は 3 行目を winit 違反として 1 件報告していた。`/* [ */` を `/* " */` にしても同じく見逃す。
  現行の `program_status.rs` の属性はすべて同じ行で閉じるため、今の `ac8_the_module_uses_only_always_built_crates` がすり抜けて合格しているわけではない。

  ## 受け入れ条件 / 完了の定義
  - 属性内の行コメント・ブロックコメントの中の `[` `]` `"` が属性の開閉判定に影響しない
  - ソース末尾で属性が閉じないまま終わった場合は違反として報告する
  - 上の再現例と、引用符を使った版が winit 違反を返す自己テストがある
  - 既存の許可リスト・自己テストの期待は変わらない

  ## 制約・前提
  変更はテスト専用の検査（`src-tauri/src/program_status/tests.rs`）に限る。
