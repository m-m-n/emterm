  description: "実装（ac8_scan_attribute が Open に block_comment を載せて返す箇所、1656-1660 行）は FR2 どおり深さを持ち越している。ただし、持ち越しを落とした変異（例: `Open(Ac8OpenAttribute { depth, in_string, block_comment: 0 })`）でも新規テストは全部通る。(1) ac8_comments_ac3_a_bracket_in_a_block_comment_spanning_lines_does_not_hide_a_use_line: 変異版では 2 行目の先頭 `]` で属性が閉じ、3 行目は通常の use 行として winit 違反になり、テストは通る。(2) ac8_comments_ac5_a_source_ending_inside_a_block_comment_returns_one_end_of_source_violation: 2 行目に括弧も引用符も無く、変異版でも末尾違反がちょうど 1 件出て通る。(3) ほかの ac8_comments_* は 1 行内のコメントだけを扱う。結果として FR2 の行またぎ持ち越しを固定しているテストが無い。task0001.tests.yaml の AC-3 red_reason と tasks/task0001.md の Test Notes の主張は事実と合わない。テスト専用チェッカーで本番挙動は正しいため medium。"
  suggestion: "行またぎのブロックコメントに `]` を含め、閉じ行に use を置く判別テストを 1 本足す（例: `#[cfg(all( /* ]\\n] */ unix))] use winit::event::Event;` — 持ち越しありなら winit 違反、なしなら違反ゼロ）。引用符版 `#[allow(x /*\\n\\\" */)]\\nuse winit::event::Event;` も判別できる。合わせて task0001.tests.yaml の AC-3 tests に追加テスト名を加え、red_reason の記述を実際に回帰ガードを担うテストを指す形に直す。"
