      `NotificationRateLimiter` は同一 (title, body) を 1 秒抑止するだけなので、body が異なる
      OSC 9 を連続で吐くスクリプトでは抑止が効かない。
      Claude と litellm(vertex-deepseek-v3.2) が独立に同一箇所を指摘（クロスモデル合意）。
      IMPLEMENTATION.md D2 の「キャッシュしない」判断は、この毎回のブロッキング IPC コストを
      前提にしていない。
    suggestion: |
      (a) メタ文字ショートサーキット: body に `&` `<` `>` が無ければ結果は入力と同一なので
      capability 問い合わせ自体を省く（D2 と両立）。または (b) capability を短時間キャッシュする
      （D2 の決定を覆す形になる点は明示的に判断すること）。
