    title: "get_capabilities() 失敗時は fail-open でマークアップが素通りする"
    description: |
      `body_markup_confirmed` は `Err(_)`（capability 取得失敗）を「未確認」として扱い、
      送信側はエスケープを行わずに生の body を `.show()` に渡す。`get_capabilities()` は
      `.show()` とは別の D-Bus 往復なので、GetCapabilities だけがタイムアウト・サービス
      起動レース・ポータル経由のエラーで失敗し、直後の `Notify` が成功する窓がありうる。
      その窓では body-markup 対応サーバ（GNOME Shell / dunst）に対して OSC 9 由来の
      `<a href>` / `<img src>` がそのまま渡り、本タスクが塞ごうとした通知内フィッシング
      経路が残る。逆側の誤り（非対応サーバへの過剰エスケープ）は `&amp;lt;` がリテラル
      表示される表示劣化にとどまるため、失敗コストは非対称。
      Claude と Codex が独立に同一箇所を指摘（クロスモデル合意）。
    suggestion: |
      判定を「成功したリストが body-markup を含まないと明示したときだけ素通し、それ以外
      （取得失敗を含む）はエスケープ」に変える。ただし SPEC.md FR3 が現状の挙動を
      明文化しているため、FR3 を fail-closed に改めるか、リスク受容として明記するかの
      仕様判断が要る。
    sources: [claude:security, codex:security]
    confidence: 100
