    title: "D2 で ring に書く DEL を vt100 (vte) 側の ring 消費者は CSI の取り消しとして扱わず、後続バイトを最終バイトとして飲み込む"
    description: "D2 (Written::push, scrollback_filter.rs:284-294) は、読み込み境界で分割された応答対象の問い合わせの最終バイトを DEL に置き換えて ring に書く (例: ESC[6 | n が ESC[6 DEL になる)。DEL で CSI が取り消されるのは term_core だけの前提になっている。ring は vt100 0.16.2 / vte 0.15.0 にも渡される。渡し先は agent_api.rs:110-117 の render_scrollback_rows (mux read の ReadPane) と、session/pane/mod.rs:878-884 の from_restored で行う shadow parser の再生の 2 か所。evaluator が vt100 =0.16.2 で実測: 変更前の ring の形 ESC[6n + Hello は 1 行目に Hello、変更後の形 ESC[6 DEL Hello は 6 行目に ello と表示された (CUP 6 として解釈)。変更前は分割された問い合わせが ESC[6n のまま ring に残り、vt100 は無害な DSR として無視していた。D2 によって、通常の読み込み分割だけで mux read の描画と復元後の shadow 画面が崩れる。D1 と既存の cut の closing (D3) も同じ DEL を使うが、vt100 には変更前から ESC[6 に後続バイトが連結された形で渡っていたので、悪化するのは D2 の経路だけ。"
    suggestion: "案 (a): vt100 に ring を渡す 2 か所 (agent_api::render_scrollback_rows と MuxPane::from_restored の parser.process) の直前で、0x7F を CAN (0x18) に置き換えたコピーを渡す (vt100 で ESC[6 CAN Hello が 1 行目に Hello と出ることは実測済み)。案 (b): closing を DEL + CAN の 2 バイトにする (SPEC A1 と 1 対 1 置換の前提から外れる)。CAN 単独は term_core が CSI 内の CAN で取り消さないため使えない。どちらの案でも、ESC[6 + 閉じバイト + Hello を vt100 で描画して 1 行目に Hello が出るテストを追加する。"
