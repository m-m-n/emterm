    title: "ST 探索が見つけた終端位置をキャッシュしないため、SIXEL でない DCS を反復すると strip が二乗時間になる"
    description: "find_st_terminator (scrollback_filter.rs:669-683) がキャッシュするのは ST が見つからなかった場合だけで、見つかった ST の位置は再利用されない。SIXEL でない DCS は fallback に落ちて ESC を 1 バイト書くだけで先に進む (scrollback_filter.rs:597-608)。(ESC P x) を N 回繰り返して最後に ESC \\ を置くと、走査量は約 N^2 x 3/2 バイト。書き込み経路では pending 上限 512 KiB の範囲で約 3.8e10 回、スナップショット経路は 2 MiB の ring 全体で約 7e11 回になる。今回の差分で変更された関数ではない既存の問題だが、モジュール doc の single O(n) pass、THREAT-MODEL.md TB-1/TM-3、SPEC NFR1 と矛盾する。"
    suggestion: "見つけた ST の位置をキャッシュする（from は単調増加なので、from が直前に見つけた ST の ESC 位置以下ならその終端を返す。strip 対象の判定は変わらず FR5 を保てる）。ESC P x の反復と末尾 ST を、書き込み経路とスナップショット経路の両方の時間予算テスト (TS-9 / TM-3) に追加する。"
