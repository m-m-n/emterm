    [chosen] / close_at_snapshot_end [not chosen]; key points: 除去位置で閉鎖すれば除去由来の未完 CSI は snapshot 前に解消し、末尾閉鎖では同一入力内で完成済みの偽照会を防げない(scrollback_filter.rs:422)。主画面 visibility-resume は末尾制御列を付けず(snapshot_bytes.rs:231)、一律閉鎖はアプリの継続中
