goal: |
  # get_capabilities() 失敗を log::warn! で可視化する
  
  Notion: https://www.notion.so/3ba3509ec8ee810fbd81fb5684e7c61e (種別: 改善)
  
  ## やりたいこと（必須）
  `get_capabilities()` の失敗時に `log::warn!` を出し、body-markup エスケープが無効化された状態をログから切り分けられるようにする。
  
  ## 背景・なぜ（必須）
  `body_markup_confirmed` は `Err(_)` を `false` に畳み込むだけで、呼び出し側も含めてどこにもログが出ない。fail-safe 側（エスケープしない）に倒す設計判断自体は SPEC.md の FR3 として文書化されているが、その結果として「body-markup をサポートするサーバに未エスケープの本文が流れ続ける」状態に入っても痕跡が一切残らない。
  本プロジェクトは DevTools が使えず調査経路が `emterm.log` に限定されている（`.claude/rules/debugging-constraints.md`）ため、ユーザーが「通知に HTML がそのまま出る」と報告してきたときに、能力取得が失敗しているのか・サーバが body-markup 非対応なのか・エスケープ側のバグなのかをログから切り分ける手段がない。
  `.show()` 側は `Err` を `log::warn!` しており（`src-tauri/src/callbacks.rs:171`）、同じ D-Bus 呼び出しである能力取得だけ無言なのは一貫性も欠く。
  - 該当箇所: `src-tauri/src/callbacks.rs:157`
  - 検出元: PR https://github.com/m-m-n/emterm/pull/35 のレビュー round1、finding `69160887e00fe870`（severity medium / category comprehensive / confidence 80）
  - 記録: `feature-docs/notification-body-markup-escape/reviews/round1.yaml`
  
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] 能力取得結果を一度束縛し、`Err` のときに `log::warn!` を出す
  - [ ] 毎送信でログが冗長になるなら、直前の結果と異なるとき（状態遷移時）のみ出す形にする
  - [ ] `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` が通る
  
  ## スコープ外（任意）
  - fail-open / fail-closed の方針変更（別タスク）
  - 通知経路の非同期化
  
  ## 制約・前提（任意）
  - リリースビルドでは `warn` 以上しか残らないので `log::debug!` / `log::info!` は使わない
  - PR #35 がマージされた後の状態を前提に着手すること
