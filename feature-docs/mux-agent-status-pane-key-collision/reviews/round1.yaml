      『scope の供給元差し替え』が起きた時、6 箇所すべてを漏れなく直す必要があり、1 箇所でも漏らすと
      キーが静かに食い違う。(2) 型の緩さ: pub struct ConnectionScope(pub u64) はフィールドが公開タプル
      なので任意の u64 を包める。特に render/mod.rs:316-319 は表示層でありながらモデルキーの同一性規則を
      自前で知ることになっており、この漏れの中で最も層をまたいでいる。
    suggestion: |
      (a) impl Tab { pub fn connection_scope(&self) -> ConnectionScope } を用意し、生成 5 箇所と
      app/agent_status.rs:78 の照合をすべてそれ経由にする。同時に ConnectionScope(pub u64) の
      フィールドを非公開にしてコンストラクタを 1 本に絞れば、任意の u64 の混入もコンパイル時に止まる。
