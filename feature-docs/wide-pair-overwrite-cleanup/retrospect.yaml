lessons_candidates:
  - >-
    verify フェーズが spec 観点レビューの medium 指摘（stable_id 4b0dfdcc426d75aa）を
    独立に拾い直して failed_items にできた。auto-fix ゲートが critical/high 限定のため
    medium は review では動かないが、SPEC の Success Criteria に紐づく medium は
    verify で拾える。review と verify の役割分担が機能した実例。
  - >-
    GUI ビルド確認（cargo check --manifest-path src-tauri/Cargo.toml）が worktree で
    build.rs パニックする。src-tauri/assets/fonts/ が gitignored で worktree に
    複製されないため。implementer 2 本が同じ壁に当たり、どちらも「環境ギャップなので
    スキップ」と報告した。worktree 作成時にフォントを main ツリーからコピーする
    ステップがあれば、build コマンドが実際に検証として機能する。
  - >-
    stable_id はカテゴリを含まないため、architecture と comprehensive が同じ物理バグを
    別タイトルで指摘したケースで、日本語タイトルの正規化（非 ASCII が空白化される）により
    偶然同一 stable_id になった。設計意図どおりの挙動だが、日本語タイトルでは
    正規化後に残るのが英数字トークン（関数名など）だけになる点は留意。
  - >-
    Vertex の spec レビューが返した 4 件の候補をレビュアーエージェントが diff 突合で
    全件棄却した。うち 2 件は「FR5 の status: tbd」を「実装してはいけない」と誤読した
    もので、プロンプトで明示的に指摘しないよう指示していたにもかかわらず発生した。
