  - question_id: create-plan.worker-digest-selffill
    packet_id: null
    answered_at: "2026-09-21T00:24:13+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [orchestrator_fills_digests]
    freeform: null
    normalized_answer: "orchestrator computes and fills written_artifacts[].sha256; proceed"
    resolution_note: >-
      gate: create-plan phase, no gate_id — orchestrator-raised process question.
      implementation-planner が Bash を持たず written_artifacts[].sha256 を 3 件とも null で返した。
      選択肢 A（orchestrator が declared path から sha256 を計算して補完し、警告を記録して続行）と
      選択肢 B（契約違反として再ディスパッチ／フェーズ中断）を Codex に諮り、A を採用。
      codex_consulted: true / harness: codex / opus_escalation: false。
      Codex の理由: 変更範囲はレイヤー 4 で独立に確認済み（ディスパッチ前後の worktree 全ファイル一覧を
      diff し、新規は宣言どおりの 3 件のみ・他の変更なし）。成果物は実行も配布もされない計画文書（Markdown）であり、
      存在確認とハッシュ計算は orchestrator 側で実施できるため、計算主体を明記した例外として進めるのが妥当。
      不採用の B: 純粋なツール制約に対する再ディスパッチ／中断はコストに見合わず、無人実行では停止の実害が大きい。
      Codex が挙げた残存リスク: 補完したハッシュは検証時点の内容を示すだけで、ワーカーが書いた時点の内容との
      一致は証明しない。文書内容の誤りもこの補完では検出できない。
      orchestrator 側の受け入れ: レイヤー 5 の digest 照合はこの run では orchestrator の自己申告であり、
      独立クロスチェックではない旨を planner-output.json の warnings にも記録した。
  - question_id: null
    packet_id: null
    answered_at: "2026-09-21T00:42:00+09:00"
    source: unlisted-gate-fallback
    answer_mode: single_select
    selected_option_ids: [muse_spark_standard]
    freeform: null
    normalized_answer: "review R2 の litellm 観点 (performance / spec) は muse-spark (Standard) で dispatch した"
    resolution_note: >-
      gate: review R2 の muse-spark contributor-tier read-mapping (gate_id なし。
      references/batch-mode.md の unlisted-gate fallback = Codex 相談 → 最小副作用オプション)。
      争点: references/reviewers.yaml は performance / spec / architecture に literal `muse-spark` を割り当て
      「渡された名前をそのまま流す・自分でモデルを選ばない」と定める一方、
      references/review-phase.md は "Contributor-tier pre-dispatch criteria" を満たす場合に限り
      `muse-spark` を contributor tier と読み替えることを許可している。
      これに対し harness SSOT (vertex-review の litellm-harness スキル) は
      「レビューはプライベートなコードを送るため muse-spark (Standard) を使う。
      muse-spark-contributor をレビューに使ってはいけない」と無条件に禁止しており、文言が衝突していた。
      選択肢: (A) muse_spark_standard = レジストリの literal 値をそのまま渡す /
      (B) muse_spark_contributor = contributor tier 読み替えを行使する。
      事前条件の機械判定はいずれも成立: consent store
      (~/.claude/em-workflow/muse-consent.json) に本プロジェクト
      (/home/sakura/src/my_projects/tauri/emterm/.git) のエントリあり、
      リポジトリは public (github.com/m-m-n/emterm)・MIT、
      diff に secret・third-party コード・未公開の差別化アイデアは無し。
      Codex 相談 (codex-harness second-opinion, gpt-5.6-sol, read-only, 1 ターン) の結論は (B)。
      理由: レジストリの verbatim 規則は一般則であり review-phase の carve-out は
      `muse-spark` にスコープを限定した特則である・harness SSOT はモデルの同一性と課金/学習条件に対する
      権威であって dispatch 時の選択条件に対する権威ではない・特則が効かないなら
      Contributor-tier pre-dispatch criteria が死文になる・公開済み MIT コードなので
      学習提供コストは低く単価は約 1/10。
      Codex が付けた留保: 学習に使われるのは diff だけでなくレビュー入力全体と生成されたレビュー出力でもある。
      orchestrator は一旦 (B) を採用して dispatch したが、Claude Code の auto mode 分類器が
      2 本とも拒否した (performance = Data Exfiltration、spec = Traffic Redirection)。
      これは skip_reason を伴わない harness レベルの拒否であり、references/review-phase.md の
      retryable chain-walk 表の対象外。拒否メッセージが明示的に許す
      "first try a safer method" に従い、学習提供を伴わないぶん厳密に副作用の小さい (A) に切り替えて再 dispatch し、
      2 本とも受理された。よって最終採用は (A) muse_spark_standard。
      不採用となった (B) の扱い: 分類器の拒否を迂回する再試行は行っていない。
      切り替えは権限をより広げる方向ではなく狭める方向であり、
      結果として harness SSOT の禁止規定と leaf の literal レジストリ値の双方に一致する。
      Opus エスカレーションは実施していない (Codex 相談 1 ターンで論点が出揃い、
      分類器の拒否が選択を機械的に確定させたため)。
  - question_id: null
    packet_id: null
    answered_at: "2026-09-21T00:52:00+09:00"
    source: unlisted-gate-fallback
    answer_mode: single_select
    selected_option_ids: [stop_at_once_boundary]
    freeform: null
    normalized_answer: "verify を completed にした時点で --once のフェーズ境界として終了し、retrospect と Step C (PR 作成) は次回起動に委ねる"
    resolution_note: >-
      gate: --once のフェーズ境界と、起動時の自由記述（「実装が終わったら integration ブランチを
      push して gh pr create で PR を作る」）との緊張関係。gate_id なし。
      references/batch-mode.md の unlisted-gate fallback（Codex 相談 → 最小副作用オプション）に従った。
      選択肢: (A) verify completed のコミット時点で --once の停止条件 7 により終了し、
      retrospect と Step C / PR 作成を後続起動に残す /
      (B) --once を上書きして retrospect + Step C まで走り切り PR を作る。
      Codex 相談 (codex-harness second-opinion, read-only, 1 ターン, harness: codex) の結論は (A)。
      採用: (A)。Codex の理由: verify を completed にしてコミットした時点で --once の停止条件 7 が
      成立するのでターンを終える。自由記述の依頼は --once を上書きするものではなく、
      「最終的な完了処理をどう扱うか」の要望であって、起動ごとのフラグ意味論を飛ばす承認ではない。
      --pr は Step C を実行する起動でのみ有効で起動間で継承されないため、
      次に Step C へ到達する起動で改めて --pr を渡す必要がある。
      不採用 (B) の最も強い根拠（Codex が明示）: 利用者は実装完了後の PR 作成を明示的かつ
      一義的に要求しており、機械的な --once 境界より述べられた最終目的を優先するほうが
      実際の意図に忠実だとも読める。
      orchestrator の受け入れ: (A) は副作用が最小（push も PR 作成も行わない）であり、
      skill SSOT の明文（「Step C に到達しない起動では --pr が付いていても PR は作られない」）と
      一致する。PR は次回以降 `--batch --once --pr` を Step C に到達する起動で渡すことで作成される。
      opus_escalation: false。
  - question_id: null
    packet_id: null
    answered_at: "2026-09-21T01:10:00+09:00"
    source: unlisted-gate-fallback
    answer_mode: single_select
    selected_option_ids: [stop_at_once_boundary]
    freeform: null
    normalized_answer: "retrospect を completed にした時点で --once のフェーズ境界として終了し、Step C (push + gh pr create) は次回起動に委ねる"
    resolution_note: >-
      gate: --once のフェーズ境界と、起動時の自由記述（「実装が終わったら integration ブランチを
      push して gh pr create で PR を作る」）との緊張関係の再発。gate_id なし。
      references/batch-mode.md の unlisted-gate fallback（Codex 相談 → 最小副作用オプション）に従った。
      前回起動（verify 境界）で同じ論点を (A) で解決済みだが、2 回目の先送りになるため改めて相談した。
      選択肢: (A) stop_at_once_boundary = retrospect completed のコミット時点で --once の停止条件 7 により終了し、
      Step C / PR 作成を後続起動に残す /
      (B) override_once_and_open_pr = --once を上書きして Step C まで走り切り push + PR 作成まで行う。
      採用: (A)。codex_consulted: true / harness: codex（codex-harness second-opinion, read-only, 1 ターン）/
      opus_escalation: false。
      Codex の理由: skill SSOT は「retrospect が completed になりコミットされた時点」を --once の境界と明記し、
      Step C を独立した 1 フェーズとして次回起動に持ち越すと定めている。前回起動が batch-audit.yaml に
      記録した決定とも整合する。state=phase_done は外部サービスに同一フィーチャーの再起動を促すため、
      先送りしても最終目的（PR 作成）は失われない。
      不採用 (B) の最も強い根拠（Codex が明示）: 利用者は「実装が終わったら push + PR」を一義的に要求しており、
      これは 2 回目の先送りになる。次回起動で --pr が渡されなければ PR が永久に作られない運用リスクがある。
      orchestrator の受け入れ: (A) は push も PR 作成も行わないため副作用が最小であり、
      skill SSOT の明文（「Step C に到達しない起動では --pr が付いていても PR は作られない」「--pr は
      起動ごとの設定で前の起動からは引き継がれない」）と一致する。
      次回 `--batch --once --pr example-font-absolute-path` を渡せば Step C に到達し PR が作成される。
