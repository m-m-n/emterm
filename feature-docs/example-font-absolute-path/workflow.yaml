schema_version: 1
feature: example-font-absolute-path
created: 2026-09-21
base_branch: main
goal: |
  example が Inconsolata を個人環境の絶対パスから読むため作者以外の環境で動かない

  ## 現象 (必須)
  `src-tauri/examples/bold_raster_probe.rs` と `src-tauri/examples/m_placement_probe.rs`
  が、Inconsolata を個人環境の絶対パスから読んでいる。
  ```plain text
  /home/sakura/workspace/Inconsolata/fonts/otf/Inconsolata-Regular.otf
  /home/sakura/workspace/Inconsolata/fonts/otf/Inconsolata-Bold.otf
  ```
  このパスは他のマシンには存在しないため、クリーンなチェックアウトで
  `bash scripts/fetch-fonts.sh` を実行したあとでも、この 2 つの example は実行時に
  落ちる（`bold_raster_probe.rs` は `.expect("font file")`、`m_placement_probe.rs` は
  `.unwrap()`）。コンパイルは通るので `cargo test` は壊れない。
  同じ 2 ファイル（および `font_select_probe.rs`）の実行手順コメントが、
  `7935cba5 refactor: promote native-poc to main implementation` で削除された
  `native-poc/` レイアウトを今も指している。
  ```plain text
  CARGO_TARGET_DIR=native-poc/target ... --manifest-path native-poc/Cargo.toml
  ```
  なお Inconsolata-Regular.otf / Inconsolata-Bold.otf はどちらも
  `scripts/fetch-fonts.sh` が `src-tauri/assets/fonts/` に取得済みで、
  `src-tauri/src/render/font/resolver.rs:50,58` が
  `include_bytes!("../../../assets/fonts/Inconsolata-{Regular,Bold}.otf")` で
  参照している。つまり絶対パス参照は不要。

  ## 再現手順 (必須)
  1. `/home/sakura/workspace/Inconsolata/` が存在しない環境でチェックアウトする
  2. `bash scripts/fetch-fonts.sh` を実行する（成功する）
  3. `CARGO_TARGET_DIR=src-tauri/target cargo run --manifest-path src-tauri/Cargo.toml --example bold_raster_probe` を実行する
  4. フォント読み込みで panic する。`m_placement_probe` も同様

  ## 期待する挙動 (必須)
  `bash scripts/fetch-fonts.sh` のあとは、`src-tauri/examples/` 配下の example が
  どれもそのまま実行できること。フォントは `CARGO_MANIFEST_DIR` 起点で
  `src-tauri/assets/fonts/` から解決し、個人環境の絶対パスに依存しないこと。
  実行手順コメントも現在のディレクトリ構成に合わせること。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  - `src-tauri/examples/bold_raster_probe.rs:22` — Inconsolata-Regular.otf の絶対パス
  - `src-tauri/examples/bold_raster_probe.rs:26` — Inconsolata-Bold.otf の絶対パス
  - `src-tauri/examples/m_placement_probe.rs:8` — Inconsolata-Regular.otf の絶対パス
  - `src-tauri/examples/bold_raster_probe.rs:5-6` — 古い `native-poc/` 実行手順
  - `src-tauri/examples/font_select_probe.rs:6-7` — 古い `native-poc/` 実行手順
  - 参考: `src-tauri/src/render/font/resolver.rs:50,58` — 同じフォントの正しい参照方法
  - 参考: `scripts/fetch-fonts.sh:161,165` — 両フォントの取得エントリ
  `font_select_probe.rs` は `fontdb::Database::load_system_fonts()` だけを使い、
  バンドルアセットに依存しない。修正対象は実行手順コメントのみ。

  ## 実害・発生条件 (任意)
  - 作者以外の開発者・CI・無人ワークフローでは、この 2 つの example が最初から動かない。
  - コンパイルは通るため `cargo test` は落ちず、気付きにくい。
  - 発生条件は「`/home/sakura/workspace/Inconsolata/` が無いこと」。作者の環境では再現しない。

  ## 由来
  em-workflow の `fetch-fonts-noto-color-emoji` フィーチャー（Notion タスク
  `https://www.notion.so/3db3509ec8ee81859c85ca94adb01dbc` 、
  `fetch-fonts.sh` が `NotoColorEmoji.ttf` を取得しない件）の create-spec フェーズで、
  example の資産依存を調べている最中に検出した。同フィーチャーは `cargo test` の
  コンパイル失敗だけを対象とするため、Codex 相談のうえこの件はスコープ外と判断し、
  別タスクとして切り出した。判断の記録は
  `feature-docs/fetch-fonts-noto-color-emoji/phase-state/create-spec.yaml` の
  `answers.other-examples-scope`。
parent_branch: em-workflow/example-font-absolute-path/integration

