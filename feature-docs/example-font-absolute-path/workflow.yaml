    kind: project_native
    paths:
      - doc/UI-DESIGN-GUIDELINES.yaml
      - src-tauri/src/ui/md3.rs
      - src-tauri/web-shared/styles.css
  components:
    main:
      language: rust
      build_command: "bash scripts/fetch-fonts.sh && bun install && bun run build:viewer && bun run build:settings && CARGO_TARGET_DIR=src-tauri/target cargo build --manifest-path src-tauri/Cargo.toml --examples"
      test_command: "bash scripts/fetch-fonts.sh && bun install && bun run build:viewer && bun run build:settings && CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml -- --check"
      e2e_test_command: ""

