goal: |
  # 可視ペイン通知の新挙動と agent_notify_visible_pane をドキュメントに反映する
  
  ## やりたいこと（必須）
  `doc/SPECIFICATION.md` と `doc/AGENT-STATUS.md` を可視ペイン通知の現行挙動に合わせて更新し、新設定キー `agent_notify_visible_pane` を記載する。
  ## 背景・なぜ（必須）
  `doc/SPECIFICATION.md:1195-1196` と `doc/AGENT-STATUS.md:190,199-201` が「non-visible pane のみ通知」という旧挙動を記述したままで、active-window-agent-notification（PR: [https://github.com/m-m-n/emterm/pull/29](https://github.com/m-m-n/emterm/pull/29)）で追加された新キー `agent_notify_visible_pane`（既定 ON）も列挙されていない。姉妹機能 agent-desktop-notification は設定追加時に SPECIFICATION.md を更新しており、リポジトリの慣行としてもドキュメント更新が期待される。
  - レビュー finding: `3a1451892c226760`（severity medium / category comprehensive / confidence 50）
  - 記録: `feature-docs/active-window-agent-notification/reviews/round1.yaml`
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] `doc/SPECIFICATION.md:1195` を「可視ペインは `agent_notify_visible_pane`（既定 on）で制御し、OFF のときのみ抑止」に書き換える
  - [ ] `doc/SPECIFICATION.md:1196` の設定キー列挙に `agent_notify_visible_pane` を追加する
  - [ ] `doc/AGENT-STATUS.md` の Notifications 節を同じ内容に合わせる
  ## スコープ外（任意）
  - コードの挙動変更（ドキュメントのみ）
  - 通知本文のサニタイズ・D-Bus 非同期化（それぞれ別タスク）
  ## 制約・前提（任意）
  - 本 finding は `em-workflow/active-window-agent-notification/integration` ブランチ（PR #29、main 未マージ）に対するレビューで検出された。PR #29 がマージ済みかを先に確認し、実際にコードに入っている挙動を記述すること。
  - confidence 50 は対象ファイルが changed_files 外だったための丸め。指摘内容自体は行番号込みで具体。
