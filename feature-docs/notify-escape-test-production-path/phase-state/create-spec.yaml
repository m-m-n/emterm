    normalized_answer: notify_worker の呼び出し箇所から escape_for_send を外す変異も単体テストで検出できるようにする。notify_worker
      を、capability 取得と送出（Notification::new().summary().body().show()）をクロージャ（または同等の注入点）として受け取る形にし、本番は現在と同じ
      get_capabilities() と notify-rust 送出を渡す。テストは notify_worker 本体に有限個の通知を流し、capability
      取得を『body-markup あり / なし / 取得失敗』に差し替え、送出クロージャが受け取る summary / body を期待値と完全一致で比較する。D-Bus
      自体の模擬実装・.show() の検証・非同期化はしない（スコープ外を維持）。redaction の位置、通知ごとに capability を 1 回だけ取得すること、ログ文言、Windows
      の送出フロー（capability 取得・エスケープなし）は変えない。escape_for_send は残し、tests.rs の 3 箇所はその呼び出しに置き換える。
    resolution_note: 'gate: create-spec.requirement-clarification (orchestrator-raised
      unclear point: analyst assumption A-3 left the call-site-removal mutation undetected).
      Options: A=known limitation, B=source-text static test, C=inject capability
      query + dispatch into notify_worker, D=other. Codex consulted (readonly): chose
      C — A fails the AC that removing the escape call must turn a test red; B only
      checks text presence/order, not that the escaped values reach .summary()/.body();
      C follows existing injection idiom (NotificationSink, injected clock) and verifies
      real arguments without D-Bus mocking. Adding only a pure prepare_notification()
      would just move the hole. Orchestrator adopted C. Opus escalation: not run.'
