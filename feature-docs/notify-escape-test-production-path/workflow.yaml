goal: |
  # NotifyRustSink::send の body 決定を純関数に切り出してテストが本番経路を通るようにする
  
  Notion: https://www.notion.so/3ba3509ec8ee81f0baf7c955232d3371 (種別: 改善)
  
  ## やりたいこと（必須）
  `NotifyRustSink::send` の body 決定ロジックを純関数に切り出し、テストが本番と同一の分岐を通るようにする。
  
  ## 背景・なぜ（必須）
  `send` が `notify_rust::get_capabilities()`（実 D-Bus 接続が必要）を直接呼び、その結果でエスケープ有無を決めているため、`send` 自体を検証するテストが書けない。結果として `src-tauri/src/callbacks/tests.rs` は `if body_markup_confirmed(&caps) { escape_body_markup(x) } else { x.to_string() }` という送信側と同じ分岐を 3 箇所で自前に再実装しており、PR #35 の AC-1〜AC-5 が検証しているのは本番の判断ではなくテスト内のコピーになっている。
  具体的な損失として、`send` の条件を反転しても、`let body = body_owned.as_str();` の shadowing を消して未エスケープの引数を `.body()` に渡してしまっても、8 本の新規テストは全てグリーンのまま通る。SPEC.md の TS5 が主張する「単一チョークポイントが両プロデューサをカバーする」という性質も、実際には `send` ではなくテスト内のコピーについて証明しているだけになっている。
  - 該当箇所: `src-tauri/src/callbacks.rs:156`、`src-tauri/src/callbacks/tests.rs:754` / `:768`
  - 検出元: PR https://github.com/m-m-n/emterm/pull/35 のレビュー round1、findings `f51da7aab1499d43`（architecture）/ `409f4a029ce8169d`（spec）/ `e587c1b6f27875e4`（comprehensive）— 3 観点が独立に同根を指摘
  - 記録: `feature-docs/notification-body-markup-escape/reviews/round1.yaml`
  
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] capability 取得（I/O）と body 決定（純粋ロジック）の境界を関数として切り出す（例: `body_for_send(body, &capabilities) -> String`）
  - [ ] `NotifyRustSink::send` はその関数を呼ぶだけにする
  - [ ] `callbacks/tests.rs` の 3 箇所の inline な if/else を切り出した関数の呼び出しに置き換える
  - [ ] `send` からエスケープ呼び出しを外す・条件を反転すると、いずれかのテストが赤になることを確認する
  - [ ] `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` が通る
  
  ## スコープ外（任意）
  - `send` 全体（`.show()` を含む）の D-Bus モック化
  - 通知経路の非同期化
  
  ## 制約・前提（任意）
  - PR #35 がマージされた後の状態を前提に着手すること
  - 切り出す関数は `#[cfg(unix)]` 配下に置き、Windows 側の送出フローを変更しないこと
