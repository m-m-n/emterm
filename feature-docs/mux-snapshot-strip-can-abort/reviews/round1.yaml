findings:
- stable_id: 483c527d84decb6b
  severity: medium
  category: security
  file: src-tauri/src/mux/scrollback_filter.rs
  line: 708
  title: "文字列本体の中で構文を除去すると前後のバイトがつながり、書き込み時と snapshot 時の 2 回の strip を経て OSC 777 起動命令が再生へ漏れる"
  description: >-
    Written::close_before_removal（355 行付近）は書き込み済み状態が OscBody / StBody のとき何も書かないため、
    開いた文字列本体の中で構文を除去すると前後のバイトがつながる。書き込み時の strip と snapshot 時の strip は冪等でなく、
    O=ESC]777;emterm;markdown;、K=ESC_Gi=1,a=d;AAAA、Q=ESC[6n として入力
    O+ESC_+K+Q+"Gi=1,a=d;BBBB"+O+K+Q+"inner"BEL"outer"BEL は 2 回の strip 後に
    ESC]777;emterm;markdown;outer BEL となり、完全な OSC 777 起動命令が再生に残る（evaluator が HEAD をビルドして実行確認）。
    同じ種類の漏れは base 0b8bc248 でも完全な Kitty APC だけで再現する既存の問題で、この feature は中断した本体を除去対象に加えたことで漏れの起点を増やした。
  suggestion: >-
    除去する構文の開始 ESC が開いた文字列本体（WrittenState::OscBody / StBody）を中断していた場合、除去の前に本体を閉じるバイト（例: ESC + CAN）を書く。
    FR5 が維持を求める D1（本体の中では何も書かない）を変える変更で、完全な対象の除去にも影響するため後続 feature で扱う。
    回帰試験: 上記の中断版・完全版の入力を書き込み経路から snapshot まで通し、OSC 777 が残らないことと strip(strip(x)) == strip(x) を確かめる。
  sources: [codex:security]
  confidence: 90
  resolution: deferred
  resolution_reason: >-
    medium（completion gate 対象外）。既存の問題クラスで、修正は FR5 が維持を求める D1 を変えるため本 feature の範囲外。
    残件の扱いは Codex に相談し、既存 Notion タスク「mux: 保持した未終了の OSC/DCS/APC 本文の中で除去が起きると後続バイトが本文に結合し OSC 11 色照会が成立する」
