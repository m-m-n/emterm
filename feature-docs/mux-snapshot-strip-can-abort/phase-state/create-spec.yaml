      stay kept; BEL is body data; SIXEL detection uses only the pre-abort range (a
      DCS that never reached q is kept). Keep existing remap rules and O(n). Existing
      AC-8 kitty/sixel expectation and strip_unterminated_introducers_complete_in_single_pass
      expectation change accordingly.
    resolution_note: 'gate: create-spec.requirement-clarification; batch-policies.yaml
