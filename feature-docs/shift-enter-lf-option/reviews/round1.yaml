findings:
  - stable_id: lf1-grandfather-stale-option
    severity: medium
    category: spec
    file: src-tauri/web-shared/settings/sections/terminal-behavior-section.ts
    line: 252
    title: "Grandfathered kitty option remains offered after selecting another value"
    description: >-
      FR3 says the kitty_csi_u option is no longer offered once another
      value is saved. Options are computed at render time from the loaded
      value, and the change handler only saves; within the same
      still-rendered select, the grandfathered option therefore remains
      present (and re-selectable) until the section re-renders. claude:spec
      read the same code as FR3-compliant under the D2 render-time-only
      design; codex:spec reads FR3 strictly. Practical impact is minimal:
      re-selecting it just saves the still-functional hidden value.
    suggestion: >-
      Rebuild the select's options (or remove the kitty_csi_u option) after
      a successful save of a different value, and add a section test
      covering select-another-value-then-reopen.
    sources: [codex:spec]
    confidence: 50
    resolution: deferred
    resolution_reason: >-
      D2 (render-time-only grandfathering) の設計判断通りで、残存期間は
      同一描画中のみ・再選択しても隠し値として正常動作するため実害なし。
      厳密即時反映が必要になったら follow-up とする。
