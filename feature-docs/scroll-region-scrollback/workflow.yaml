goal: |
  Codex TUI の会話履歴を端末スクロールバックで遡れるようにする (Ghostty 互換のリージョン転写)

  ## やりたいこと (必須)
  Codex TUI の会話履歴を eMterm の端末スクロールバックで遡れるようにする。Ghostty と同じく、DECSTBM スクロールリージョン内で上に転落した行を scrollback へ転写する。

  ## 背景・なぜ (必須)
  Codex TUI (v0.153.4) は代替画面を使わず、主画面 + DECSTBM スクロールリージョン + 絶対カーソル配置での再描画で会話 UI を描く。eMterm は xterm 準拠で、リージョン内スクロールでは scrollback に行を退避しない (`crates/term_core/src/ring_buffer.rs` の `scroll_up_internal` の region パスは `shift_rows_up` のみ)。このため Codex の会話履歴が scrollback に残らず、Shift+PageUp・ホイール・スクロールバーのどれでも遡れない。
  同じ Codex のバイト列 (TERM を `xterm-256color` / `xterm-ghostty` で比較して同一と確認済み) を Ghostty に流すと、リージョン転落行も scrollback に入り時系列の会話として読める (実機確認済み)。つまり差は Codex 側ではなく端末側の scrollback 格納意味論にある。
  Codex はマウス追跡 (`1000`/`1002`/`1006`) を要求しないため、ホイールは常に端末側処理になる。メイン transcript には `PgUp`/`PgDn` も未割当て (openai/codex #34716) で、Codex 側の操作でも遡れない。
  調査レポート全文: `tmp/codex-tui-scrollback-investigation-2026-09-10.md`

  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] Ghostty の実装方針を先に調査し、eMterm が取る仕様を確定させる (ベンチマーク参照方針に従い、コード転用はせず公式ドキュメント・設定・issue/changelog を参照)
  	- [ ] Ghostty がリージョン転写を行う条件 (スクロールリージョンが最上行から始まるときのみか、任意リージョンでもか)
  	- [ ] 左右マージン (DECLRMM) がある場合の扱い
  	- [ ] `SU` (CSI S) / `RI` (ESC M) / 行末 `LF` のどの経路が対象か
  	- [ ] 設定項目の有無と既定値
  - [ ] 上記で確定した仕様を SPEC として書き起こす
  - [ ] `scroll_up_internal` の region 分岐で、転落する先頭 `count` 行を `ring_push_blank` 相当の圧縮で scrollback へ退避する
  - [ ] 代替画面 (`MODE_ALT_SCREEN`) では転写しない
  - [ ] `shift_rows_up` を直接呼ぶ IL/DL 経路には適用しない
  - [ ] 転写の有効・無効を設定で切り替えられる
  - [ ] Codex TUI を実機で起動し、Shift+PageUp・ホイール・スクロールバーで会話履歴が時系列に遡れることを確認する
  - [ ] Claude Code (代替画面 + alternate scroll) の既存挙動が変わっていないことを確認する
  - [ ] vim・less などリージョンを使う既存 TUI で二重表示・順序崩れが起きないことを確認する

  ## スコープ外 (任意)
  - `SD` (下方向の転落) の scrollback 転写。順序が崩れるため対象外。
  - インライン TUI 向けの wheel → キー変換 (Codex 検出時にホイールを Up/Down 化する案)。アプリ判定の誤爆リスクが高く、ホイール本来の scrollback 操作を奪うため採らない。
  - FR2 key-resume の挙動変更。scrollback 位置でキーを押すと Live に引き戻される仕様はそのまま。
  - `Ctrl+T` ページャーの出力整形。別件。

  ## 制約・前提 (任意)
  - リージョン転写は xterm 非準拠。既定で有効にするかどうかは Ghostty 調査の結果を見て決める。
  - 既存の scrollback 機構 (`ring_push_blank` の圧縮形式、`OffsetFromLive` の auto-follow) は変えない。
  - 対象ファイル: `crates/term_core/src/ring_buffer.rs` (`scroll_up_internal`)、`crates/term_core/src/csi_scroll.rs` (`handle_scroll_up`/`handle_decstbm`)。
  - 調査時点: Codex CLI 0.153.4、eMterm HEAD `6e03b806`。

