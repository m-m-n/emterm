- stable_id: f627594191c902e2
  severity: medium
  category: performance
  file: crates/term_core/src/ring_buffer.rs
  line: 413
  title: Region transcription allocates tail snapshot per scroll
  description: >-
    `scroll_up_region_transcribing` は ring 回転の前に下マージンより下の全行を退避する
    ため、1 スクロールごとに tail 行 1 行につき `Vec<Cell>` を 1 本 (`to_vec()`)、
    overflow があれば `String` の clone を確保し、復元時にもう一度コピーする。従来の
    `shift_rows_up` はその場入れ替えで確保ゼロだった。確保量はビューポート寸法
    (`(rows - bottom - 1) * cols`) で上限が付くため重大ではないが、tail が大きい構成で
    領域スクロールが高頻度に走る TUI ではアロケータ負荷が乗る。
  suggestion: >-
    tail 退避用のスクラッチバッファを再利用する、または overflow エントリを clone せず
    取り出して戻す。tail が大きい構成での領域スクロール連続実行のベンチを 1 本足すと
    劣化を検出できる。
  sources: ["litellm:muse-spark:performance"]
  confidence: 60
  resolution: unresolved
  resolution_reason: >-
    auto-fix の候補ゲート (severity ∈ {critical, high}) を満たさないため未適用。
