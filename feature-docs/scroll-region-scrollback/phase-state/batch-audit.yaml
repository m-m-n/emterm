    resolution_note: >-
      gate: なし (orchestrator が verify 中に解決した、非 gate_id の判断)。
      codex_consulted: true。既定 OpenAI provider は usage limit で失敗したため
      fallback provider (LiteLLM 経由 muse-spark) が回答。Opus エスカレーションは未実行。
      選ばなかった選択肢: 未実施を failed_items に入れて verify を failed にする案。
      判断の要点は 3 点 — (1) TS-8/9/10 はリリースビルドの GUI 端末を人間が操作する
      必要があり無人実行では原理的に実施不能、(2) 同じ転写・除外・クランプ挙動は
      バイト列ユニットテスト TS-1..TS-3 が緑で担保済み、(3) failed にしても rework は
      GUI 確認を代行できず、系譜 cap / hard cap を消費して failed に戻るだけで
      新しい情報が得られない。残った実機確認は PR 上でユーザーが実施する。
