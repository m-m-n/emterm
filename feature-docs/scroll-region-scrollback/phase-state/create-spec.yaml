  requirement.mux-scope:
    packet_id: create-spec-q0001
    answered_at: "2026-09-13T01:13:59+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [local_tabs_only]
    freeform: null
    normalized_answer: "GUI ローカルタブのみを対象とし、mux ペインは SPEC でスコープ外と明記する"
    resolution_note: >-
      gate: create-spec.requirement-clarification (policy action: codex_consultation,
      record_as_assumption: true); codex_consulted: true; Codex は local_tabs_only を選択。
      理由: 本番の TerminalCore 生成点が 1 か所で追いやすい、mux は複数 core への伝搬と
      off-thread swap での設定喪失実績があり確認範囲が広がる、xterm 非準拠の挙動を既定 on に
      する変更では対象を絞るべき。orchestrator が option_id へのマッピングを判定して採用。
  requirement.setting-surface:
    packet_id: create-spec-q0001
    answered_at: "2026-09-13T01:13:59+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [json_and_panel_toggle]
    freeform: null
    normalized_answer: "settings.json のキーに加えて設定パネル (ターミナル動作セクション) のトグルも用意する"
    resolution_note: >-
      gate: create-spec.requirement-clarification; codex_consulted: true;
      Codex は json_and_panel_toggle を選択。理由: alternate_scroll_enabled に完全な配線前例が
      あり構成を踏襲できる、xterm 非準拠の挙動が既定 on になるため GUI から無効化できることを
      優先すべき、既存セクションへのトグル 1 件追加で独自の設定手段を増やさずに済む。
  requirement.apply-timing:
    packet_id: create-spec-q0001
    answered_at: "2026-09-13T01:13:59+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [live_apply_all_tabs]
    freeform: null
    normalized_answer: "設定保存時に既存タブの TerminalCore にも即時反映する (cursor_blink / fold_enabled と同じ扱い)"
    resolution_note: >-
      gate: create-spec.requirement-clarification; codex_consulted: true;
      Codex は live_apply_all_tabs を選択し、analyst の推奨 (new_tabs_only) と割れた。
      orchestrator は Codex の理由 — xterm 非準拠の転写で問題が出たときにタブを再起動せず
      止められることを優先すべき、cursor_blink / fold_enabled に即時反映の前例がある —
      の方が、scrollback_lines を新規タブのみにしている理由 (既存 scrollback の破棄を伴う)
      より本件に合致すると判定し、live_apply_all_tabs を採用した。
  testing.tui-regression-evidence:
    packet_id: create-spec-q0001
