    freeform: null
    normalized_answer: 代表シーケンスを process_pty_data に流す --lib テストで内容と順序を固定し、実機確認で補う
    resolution_note: 'gate: create-spec.requirement-clarification; codex_consulted: true; Codex は manual_plus_unit_byte_stream を選択。理由: E2E 基盤を新設せず既存の バイト列ユニットテスト方式で入力処理から転写まで固定できる、DECSTBM+LF / 代替画面切替 / IL/DL / SU の内容と順序を固定すれば対象外操作への波及も検出できる。'
