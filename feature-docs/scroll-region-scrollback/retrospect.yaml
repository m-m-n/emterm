lessons_candidates:
  - >-
    並列 implementer が同一ファイル (terminal_core.rs / snapshot.rs) の同じ
    メンバーを別タスクで追加し、merge-task.sh の自動マージは通ったのに
    コンパイル不能な木が残った。3 件の critical はすべてこの 1 つのマージ事故に
    由来する。タスク分割時に「同一構造体へのフィールド追加」を 2 タスクに
    分けない、あるいはマージ後に必ず build を回す価値がある。
  - >-
    loop 1 後の in-loop 再レビュー 5 観点は snapshot.rs の E0062 を 1 件も
    報告せず、architecture#loop1 は逆に「全 5 構築サイトが更新済み」と事実に
    反する主張をした。レビュアー出力だけを根拠にすると偽の成功で通る。
    review 完了前に承認済みビルドコマンドを 1 回回す規律が効いた。
  - >-
    same_site dedupe が +/-5 行のため、同一欠陥が 48 行離れたアンカーで
    2 つの finding として残った (4631f8a0 / ac24ffbc)。ファイル+シンボル単位の
    dedupe 補助があると重複が減る。
  - >-
    実機 GUI が要る検証シナリオ (TS-8/9/10) は無人実行では原理的に実施不能で、
    verify の failed_items にも入れられない。計画段階で「無人実行で緑にできる
    シナリオ」と「人間に残すシナリオ」を VERIFICATION.md 上で分けておくと、
    verify フェーズでの判断が不要になる。
  - >-
    Codex CLI が usage limit で応答せず、2 つのゲート解決が fallback provider
    (LiteLLM 経由 muse-spark) の回答で確定した。Codex 相談を前提にした
    ゲートは fallback の可用性に依存している。
