  - stable_id: b6c3c6a098d5f811
    severity: medium
    category: spec
    file: src-tauri/viewer/web/index.html
    line: 12
    title: "Front matter block ignores light theme (NFR2: 'follows the viewer's theme (light/dark)')"
    description: "SPEC.md NFR2 requires the collapsible block to use MD3 --md-sys-* tokens AND follow the viewer's light/dark theme. frontmatter.css draws every color from --md-sys-* tokens, but those tokens are supplied only by the hardcoded :root block in index.html whose values mirror the dark theme. The viewer resolves light/dark via applyMarkdownColorTheme, which writes only --markdown-*/--terminal-* variables and never --md-sys-*. In light theme the body renders light while the front matter block stays dark. The token-usage half of NFR2 is satisfied; the theme-following half is unmet."
    suggestion: "Make the --md-sys-* tokens theme-aware: (a) have applyMarkdownColorTheme also write light/dark --md-sys-* values, (b) define both token sets in index.html gated on a theme class/attribute, or (c) restyle frontmatter.css onto the existing theme-aware --markdown-* variables."
    sources: [claude:spec]
    confidence: 75
    resolution: fixed
    resolution_reason: "task0006 rework (2e531f06) で修正"
  - stable_id: edbac6878f16083c
