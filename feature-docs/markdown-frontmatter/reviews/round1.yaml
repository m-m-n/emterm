    file: src-tauri/viewer/web/index.html
    line: 12
    title: "Front matter block ignores light theme (hardcoded dark --md-sys-* tokens)"
    description: "frontmatter.css references --md-sys-* tokens without fallbacks; the only definitions the viewer sees are the hardcoded dark values in index.html (no light override, no prefers-color-scheme switch). applyMarkdownColorTheme flips the page background light via --markdown-bg but never updates --md-sys-*, so in light theme the block renders as a dark box on a light page — contradicting frontmatter.css's own docstring and NFR2. The AC-7 test is a static grep and never exercises theme switching, giving false assurance."
    suggestion: "Make the tokens follow the resolved theme (applier writes --md-sys-*, or data-theme-gated token sets in index.html) and extend the AC-7-style test to verify resolved colors/token switching after applying the light theme."
