    title: "MD3 design tokens duplicated into index.html — contract drift from the token SSOT"
    description: "index.html hardcodes a private dark-only copy of the --md-sys-* token values because the viewer page does not load web-shared/styles.css. That copy is a fourth hand-maintained instance of tokens whose SSOT is doc/UI-DESIGN-GUIDELINES.yaml (mirrored by web-shared/styles.css and src/ui/md3.rs). Costs: (1) silent drift — no test guards index.html's values against the SSOT; (2) the block is locked to the dark palette."
    suggestion: "Avoid re-copying the token layer: import the shared --md-sys-* definitions, or drive frontmatter.css from the theme-aware --markdown-* variables, or add a drift check failing when index.html diverges from styles.css."
