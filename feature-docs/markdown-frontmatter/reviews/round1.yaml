  - stable_id: c04fd0d740767b2a
    severity: medium
    category: architecture
    file: src-tauri/web-shared/markdown/frontmatter/parser.ts
    line: 104
    title: "Untrusted YAML aliases can drive recursive normalization into a UI-thread DoS"
    description: "normalizeValue recursively walks parsed YAML/TOML values with no seen-set, memoization, alias rejection, or node budget. The yaml parser accepts anchors/aliases and can return cyclic or heavily shared object graphs; normalization follows those references until stack exhaustion or duplicates aliased subtrees before rendering. Runs synchronously during viewer rendering. Note: claude:security assessed that a RangeError from deep recursion is caught by the parser's try/catch and degrades to a parse failure, and the yaml library's default maxAliasCount bounds alias amplification — so exploitability may be limited; flagged for a bounded-normalization hardening decision."
    suggestion: "Reject YAML aliases/anchors for front matter, or add a WeakSet cycle guard in normalization and enforce a maximum normalized node count before building the tree."
    sources: [codex:architecture]
    confidence: 50
    resolution: fixed
    resolution_reason: "task0006 rework (2e531f06) で修正"
  - stable_id: 8cab75d1f97687ce
    severity: medium
    category: security
    file: src-tauri/web-shared/markdown/frontmatter/view.ts
    line: 54
    title: "Untrusted frontmatter can force eager unbounded DOM construction"
    description: "On a successful parse, buildFrontMatterBlock immediately calls buildTree and buildTreeView while the block is still hidden, appending a row for every parsed node. tree-builder.ts caps only recursion depth (MAX_DEPTH=128), not total node/entry count, so hostile front matter with a very large number of shallow entries forces the child WebView to allocate a matching number of DOM rows before the user ever expands the block — a renderer-side DoS path from terminal-controlled content."
    suggestion: "Cap parsed node count / entry count in tree-builder.ts and render a truncated state past the cap; or defer buildTree/buildTreeView until the block is actually expanded (lazy construction)."
    sources: [codex:security]
    confidence: 50
    resolution: fixed
    resolution_reason: "task0006 rework (2e531f06) で修正"
