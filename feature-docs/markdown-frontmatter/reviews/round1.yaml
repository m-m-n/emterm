  - stable_id: a150c4341971d1b4
    severity: medium
    category: architecture
    file: src-tauri/web-shared/markdown/renderer.ts
    line: 206
    title: "Front-matter extraction duplicated across the shared renderer and the viewer entry"
    description: "The same source is run through extractFrontMatter twice: once in entry.ts (to build the block) and again inside MarkdownRenderer.render() (to strip the body). The caller cannot obtain the body the renderer actually used, so it re-derives it independently, and the shared renderer now silently strips leading ---/+++/{...} from ANY markdown it is handed. The two call sites must stay in agreement; future reuse of MarkdownRenderer on a snippet legitimately starting with '{' or '---' would lose leading content with no signal."
    suggestion: "Extract once at the boundary: call extractFrontMatter in entry.ts and pass the stripped body to render(), keeping MarkdownRenderer a pure markdown renderer; or have render() accept/return the extraction so the caller reuses the same result."
    sources: [claude:architecture]
    confidence: 60
