    title: "buildErrorView renders unbounded raw front matter into the DOM"
    description: "task0009 のサイズガードはパーサーを守るが、1 MiB 超の raw は FR6 エラー経路に流れ、buildErrorView(parse.error, extraction.raw) が raw を上限なしで <pre> に描画する (pre.textContent = raw; .fm-raw は高さ/内容クランプ無し)。端末制御下の front matter は Rust 側 100 MiB 上限まで巨大化できるため、パースは省略されても巨大な <pre> のレイアウトで WebView をフリーズ/OOM させられる — DoS ベクタがパースから DOM レイアウトへ移っただけ。さらに task0009 以前は巨大 valid スカラー front matter は空ツリー表示 (raw 非描画) だったのに、ガードにより同じ入力が強制的に raw 全量描画のエラー経路へ回る新規の悪化面もある。"
    suggestion: "エラー表示に渡す raw を描画前に上限クランプする (例: 64 KiB + 省略マーカー)。'端末制御下の巨大 raw を無制限に DOM へ流さない' 不変条件をエラー経路にも適用する。"
