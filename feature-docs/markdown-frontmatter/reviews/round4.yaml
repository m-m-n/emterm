    title: "Frontmatter node/depth caps apply only after the untrusted content is fully parsed"
    description: "parseFrontMatter は MAX_NODES/MAX_DEPTH が normalizeValue で効く前に、raw のフロントマターを yaml / smol-toml / JSON.parse へそのまま渡す。予算は正規化後のツリーのみを制限し、パーサーライブラリ自身のパース作業・アロケーションは制限しない。入力全体は Rust 側 OSC セッション上限 (MAX_SESSION_DATA_SIZE = 100 MiB) で有界だが、その規模の raw を同期フルパースすれば WebView は長時間ブロックされる。alias 増幅は yaml の maxAliasCount で防御済み・パースは概ね線形で、本文 (marked) 経路にも同種の特性はあるが、パース前の raw サイズガードで防御の一貫性を上げられる。"
    suggestion: "parseByFormat 呼び出し前に raw サイズ上限を設け、超過時はパーサーを呼ばず既存 FR6 エラー経路の bounded parse failure として扱う。"
