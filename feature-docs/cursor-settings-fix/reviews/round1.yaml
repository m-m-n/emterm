    title: "DECSCUSR default form CSI q is not dispatched"
    description: >-
      SPEC の「CSI q / CSI 0 q で設定値に戻る」記述を根拠に、intermediate
      なしの CSI q が dispatch されないという指摘（codex 単独）。
    suggestion: "(None, b'q') を handle_decscusr(0) に配線する。"
    sources: [codex:spec]
    confidence: 50
    resolution: declined
    resolution_reason: >-
      DECSCUSR は VT 仕様上 `CSI Ps SP q`（space intermediate 必須）であり、
      intermediate なしの `CSI q` は別シーケンス DECLL（Load LEDs）。これを
      DECSCUSR reset に振ると誤解釈になる。実装が正しく、SPEC.md 側の略記
      （`CSI q`）が曖昧だったため SPEC.md の表記を `CSI SP q` に修正済み。
