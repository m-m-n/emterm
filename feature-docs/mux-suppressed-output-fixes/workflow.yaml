schema_version: 1
feature: mux-suppressed-output-fixes
created: '2026-09-28'
base_branch: em-workflow/mux-snapshot-output-boundary/integration
goal: |
  # mux: 抑止チャンクの副作用処理（suppressed_output.rs）の未解決 medium 指摘の対応

  Notion: https://www.notion.so/3e83509ec8ee81d7bffbf4e006270ffc (種別: バグ)

  ## 現象 (必須)
  mux-snapshot-output-boundary（PR https://github.com/m-m-n/emterm/pull/107 ）の review round 1 で、medium 指摘が `unresolved` のまま残っている。多くは抑止したチャンクの副作用処理（`suppressed_output.rs`）の端の条件に関するもの。
  - 前のチャンクから続く CSI・UTF-8 の解析状態を、抑止したチャンクの走査に引き継いでいない（3bc1e21fdd8702ef）
  - 前の読み取りから続く問い合わせを再送できない（30ee5a7036a7fc6e）
  - 中断された OSC を抱えた pending から、応答済みの問い合わせと表示済みの文字を再送する（66170217dc5057ce）
  - pending から求めた走査の上限が、リングに書かないチャンク後半の問い合わせまで除外する（c8aa5052b1a02acd）
  - pending の一括再送で、完結したビューア起動を転送する（c8aa5052b1a02acd）
  - チャンク末尾の ESC で OSC を中断扱いにし、色問い合わせの本体を失う（19209420de72b144 / 61d33252f22b6fd2）
  - 未完了 CSI の尾部に含まれる実行済みの C0 制御文字を再送している（001161ab9fa3c20b）
  - 問い合わせの再送位置が変わり、カーソル位置の応答が誤る（9a548939524b405a）
  - 文字集合指定の内部から問い合わせを誤って抽出する（TM-1、8d069c589dc21784）
  - 独自の OSC 番号判定が、共有パーサーの数値解析と一致しない可能性がある（66d05376ff960d53）
  - ResumeWithSnapshot 分岐では、snapshot の挿入より先に置換出力が届きうる（29ff65b6c01032dc）
  - 復帰時の出力抑制で、代替画面への切り替えが失われる（830f950f39e499fa）
  - 抑止された画像やビューア起動命令が一度も届かない（9e6a468b3a45ceeb。仕様上は既知の欠落として明記済み）
  - テストが次の停止点を準備する前に読み取りスレッドを再開している（39267160fcf1bb2a）
  ## 再現手順 (必須)
  1. mux の pane に出力を流し続ける
  2. 上記の条件を含むチャンクの途中で snapshot 取得（タブ切替 / reattach）が走り、そのチャンクが抑止される
  3. 問い合わせ応答・表示・モード状態が上記のとおりずれる
  ## 期待する挙動 (必須)
  抑止したチャンクの副作用処理が、抑止しなかった場合と同じ解析状態・同じ順序で行われる。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] 各 stable_id について、対応済みか・対応不要かを判断して記録する
  ## 該当箇所 (任意)
  - `src-tauri/src/mux/ipc/pty_spawn/suppressed_output.rs`
  - `src-tauri/src/mux/ipc/pty_spawn/mod.rs`
  - `src-tauri/src/mux/session/pane/output_target.rs`
  - `src-tauri/src/mux/ipc/pty_spawn/tests.rs`
  - 詳細: integration ブランチ `em-workflow/mux-snapshot-output-boundary/integration` の `feature-docs/mux-snapshot-output-boundary/reviews/round1.yaml`
  - 次の 4 件は verify の rework（task0002 / task0003）で対応済みの可能性が高い。確認のうえ閉じる: 692921cdd030612d、9a7dc7697c6af992、aca2b1d612ab97e0、5988c2406aa06a7b
  ## 実害・発生条件 (任意)
  snapshot 取得と 1 チャンクが重なったときにだけ起きる。窓は 1 チャンク。
