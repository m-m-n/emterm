    で screen は空、snapshot_bytes.rs の main 分岐は切り替えなし）。reset_and_replay_segments の後もパーサーの状態は残るので、snapshot
    適用後のクライアントは既に尾部の途中にいる。else 分岐はその尾部をさらに再送する。`ESC (` の場合、再送した ESC が指定文字として消費され、`(` と後続の `B` が文字として表示される（AC-2
    違反）。UTF-8 の先頭バイトが重なる場合も置換文字が出る可能性がある（term_core の UTF-8 処理は未確認）。CSI は ESC で打ち切られるので実害はない。既存テスト cut_utf8_character_tail_is_redelivered_verbatim
    は、リング区間内の尾部を再送することを期待値にしている。AC-2 の参照比較テスト replacement_matches_client_reference_for_transition_corpus
    は ring_written_ranges が空（代替画面）の場合だけを扱い、snapshot を通していない。
  suggestion: snapshot が尾部を含むか（主画面かつリングが一周していないか）を境界と一緒に記録し、置換出力の組み立てに渡す。含む場合は尾部を再送しない。別案として、snapshot
    側で末尾の未完了シーケンスを取り除く。可視化復帰で、`ESC (` と指定文字の間や UTF-8 の途中で分割し、snapshot → 置換出力 → 後続チャンクを term_core に流した結果が生のストリームと一致することを確かめる統合テストを追加する。
