  description: 前の読み取りで始まった OSC 777 emterm markdown / OSC 9999 emterm-md が、抑止チャンクで完結する場合を考える。ScrollbackWriteFilter
    は保留していた pending ごと完結した OSC を排出し、strip がビューア起動を除くので、リングには残らない。run_suppressed_pipeline が渡すのは feed 後の
