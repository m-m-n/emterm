  title: 保持窓の再開位置として、文字集合指定の指定文字スロットにある ESC を選び、存在しない問い合わせを作る（TM-1）
  description: '窓が満杯（256 バイト）のとき、derive_prefix_start が判定不能として除外する ESC は 2 つだけ。offset 0 の ESC と、window[0]
    が `(` / `)` のときの offset 1 の ESC。window[0]=ESC かつ window[1]=''('' のときは offset 2 の ESC を再開位置に選ぶ。しかし
    window[0] の ESC が本物なら、offset 2 の ESC は FR2 (d) により指定文字として消費され、制御シーケンスを始めない。例1（security#0）: 窓 = `\x1b(\x1b]10;`
    + 空白 249 個、次の抑止チャンク = `?\x07`。OSC 10 の問い合わせとして置換出力に入り、クライアントがテーマ色の応答を子プロセスの入力へ書く。例2（comprehensive#0
    が同じ根本原因を独立に報告）: 窓 = `\x1b(\x1b[` + NUL 252 個、チャンク = `c`。DA 問い合わせを作り出す。NFR4 / AC-3 に反する。応答の中身は端末自身の固定状態で、攻撃者は制御できない。攻撃者は本物の問い合わせを直接出すこともできるため、影響は
    medium にとどまる。既存テスト full_window_leading_esc_at_offset_zero_is_excluded_as_undecidable は offset 0 しか確かめていない。'
  suggestion: i >= 2 で window[i-1] が `(` / `)` かつ window[i-2] が ESC の場合も判定不能として除外する。`ESC ( ESC ( ...`
    の連鎖も同じ規則で順に除外され、見逃しにはなっても捏造にはならない。上の 2 つの 256 バイト境界例で、置換出力と端末の応答が空になる回帰テストを追加する。
  sources:
