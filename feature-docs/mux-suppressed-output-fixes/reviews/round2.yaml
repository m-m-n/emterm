  description: assemble_items は、ring_written_ranges と重なる OSC 色問い合わせを置換出力から外す（suppressed_output.rs:130-135）。理由は『snapshot にバイト列が残る』こと。しかしクライアントは snapshot の再生中に出た応答をすべて捨てる。同期経路では reset_frame_for_replay の take_response() で捨てる（tabs/replay.rs:96-105）。off-thread 経路では、応答者を持たないコアを差し替えた後の take_response() で捨てる（tabs/replay.rs:559-583）。このため、主画面で抑止された `ESC ]11;?` と BEL には応答が一度も返らず、問い合わせたプログラムはタイムアウトまで待つ。AC-3（抑止したチャンクの問い合わせは snapshot の後にちょうど 1 回届く）に反する。単体テスト osc_color_query_inside_ring_written_ranges_is_not_redelivered が、この誤った前提を固定している。comprehensive#0 は high、architecture#1 は medium で報告した。抑止チャンクが生じるのは snapshot 境界の競合のときだけ。結果は応答待ちのタイムアウトで、データの損失もセキュリティへの影響も無い。このため round 1 と同じ medium にする。
  suggestion: 色問い合わせも CSI の問い合わせと同じく、領域を問わず置換出力に含める。再生中の応答は捨てられるので、二重に応答することはない。誤った前提のテストを書き換える。snapshot を reset_frame_for_replay と同じ手順で適用し、その後に置換出力を流して、応答数が 1 になることを確かめる。この修正で overlaps_ranges の二重ループも不要になる。
