  description: derive_prefix_start が判定不能として除外する ESC は 2 つだけ。offset 0 の ESC と、window[0] が ( / ) のときの offset 1 の ESC。window が満杯（256 バイト）で `ESC ( ESC ]10;` と空白 249 個のとき、offset 2 の ESC を再開位置に選ぶ。window[0] の ESC が本物なら、offset 2 の ESC は FR2 (d) により指定文字として消費され、制御シーケンスを始めない。次の抑止チャンクが `?` と BEL なら、OSC 10 の問い合わせとして置換出力に入り、クライアントの応答が子プロセスの入力に書かれる。`ESC ( ESC [` と NUL 252 個の後にチャンク `c` が来る組では、DA 問い合わせを作る。`ESC ( ESC ( …` と連なる場合も同じ。NFR4 と AC-3 に反する。コードは round 1 から変わっておらず、security#0・comprehensive#0・architecture#1・spec#1 の 4 run がそれぞれ再報告した。応答の中身は端末の固定状態で、攻撃者は本物の問い合わせを直接出せる。このため影響は medium にとどまる。
