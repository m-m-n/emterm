goal: |
  # benign-edit-test-token-rewrite: anchor_scan が未対応構文で誤った範囲を成功として返す（末尾リテラル引数の数え落とし / 文字・生文字列 / 関数探索深度）

  ## 現象 (必須)
  `benign-edit-test-token-rewrite` で追加されたテスト専用モジュール `anchor_scan`
  （`src-tauri/src/window_host/tests.rs`）は、未対応の構文や探索条件に遭遇したとき、
  エラーを返さずに **誤った範囲を正常な結果として返す**。`locate_call` が自ら掲げる
  「静かに誤った範囲を返す経路は許容しない」という不変条件に反する。
  具体的な経路は 3 つある。いずれも同じ不変条件の違反で、現在の
  `src-tauri/src/window_host/pointer_routing.rs` では発現しない。
  ### 1. 末尾のリテラル引数が引数カウントから落ちる（最も影響が大きい）
  `anchor_scan::scan` が数値リテラルと素の文字列リテラルをトークンを一切吐かずに
  消費する。`count_top_level_args` は深さ 0 のカンマを数え、最後の 1 区間を
  `seg_start < end` のときだけ足す。そのため `probe_call(a, b, c, d, 0)` の
  トークン列は `a , b , c , d ,` となり、カンマ 4 個・`seg_start` が `close_idx`
  と一致するので引数 4 個と報告される。5 引数の呼び出しが `expected_arg_count` 4 を
  満たし、`locate_call` が `Ok` を返す。末尾が素の文字列引数でも同じで、
  `probe_call(0, 1, 2, 3)` は 3 と数えられる。
  これは SPEC FR4c / AC-6 のトークン形状ガードを直接弱める。held 対応の呼び出しに
  リテラル値の引数を 1 個足すリファクタリングが、この機能がまさに追加したはずの
  ガードをすり抜ける。
  ### 2. 文字リテラル・生文字列が不透明スパンとして扱われない
  `scan` は行コメント・入れ子ブロックコメント・素のダブルクォート文字列は扱うが、
  文字リテラルと生文字列を扱わない。`probe_call(a, b, c, ')')` では `'` が Punct
  になり、内側の `)` が構造上の Punct として扱われるため、括弧深さの走査がそこで
  終端する。続く引数カウントは truncate された範囲に対して `a , b , c , '` = 4 と
  なり、`locate_call` は本当の閉じ括弧より手前で止まった範囲を持って `Ok` を返す。
  同様に `r#"contains a " quote"#` は文字列スキップを脱同期させ、後続のテキストが
  コードとして走査される。
  ### 3. `locate_call` の関数探索に波括弧深さのゲートが無い
  `anchor_scan::locate_call` の step 1 はブレース深さを追わずに全トークンを走査して
  `fn` + `fn_name` を探すが、対になる `call_site_scan::extract_function` は同じ照合を
  `depth == 0` に限定している。2 つは対で使われる（`locate_call` が差し替える
  バイト範囲を選び、`extract_function` が編集結果を再抽出する）ため、同名メソッドが
  `impl` や入れ子ブロック内にファイルの先頭寄りで現れると、両者が別の定義に解決する。
  ## 再現手順 (必須)
  1. `src-tauri/src/window_host/tests.rs` の `anchor_scan` に対して、
  `probe_call(a, b, c, d, 0)` を 4 引数期待で `locate_call` に通す単体テストを
  追加する
  1. `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` を実行する
  2. 5 引数の呼び出しが `Err` ではなく `Ok` で返り、テストが（落ちてほしいのに）
  通ることを確認する
  1. 同様に `probe_call(a, b, c, ')')` を通すと、閉じ括弧より手前で truncate された
  範囲が `Ok` で返ることを確認する
  ## 期待する挙動 (必須)
  `anchor_scan` が、対象を正しく処理するか、明示的に失敗（`Err`）するかのどちらかで
  あり、**誤った範囲を成功として返さない**こと。各構文形式を網羅的にサポートすること
  自体は目的ではない。
  ## 完了の定義 (必須)
  - [ ] 末尾の数値・文字列リテラル引数が引数カウントに含まれる（あるいは明示的に
  `Err` になる）。`probe_call(a, b, c, d, 0)` が 4 引数期待で拒否される負の
  テストがある
  - [ ] 文字リテラル・生文字列が不透明スパンとして扱われる（あるいは明示的に `Err`
  になる）。末尾引数が `')'` の負のテストがある。ライフタイム注釈 `'a` を
  巻き込まないこと
  - [ ] `locate_call` の step 1 が `extract_function` と同じ深さゲートを持つ
  （あるいは明示的に `Err` になる）。同名の入れ子メソッドが対象より前に現れる
  負のテストがある
  - [ ] 既存の 4 本の良性編集テストが緑のままである
  ## 該当箇所 (任意)
  - `src-tauri/src/window_host/tests.rs:6885-6899` — 文字列リテラルの消費
  - `src-tauri/src/window_host/tests.rs:6914-6922` — 数値リテラルの消費
  - `src-tauri/src/window_host/tests.rs:7005-7026` — `count_top_level_args`
  - `src-tauri/src/window_host/tests.rs:7063-7079` — `locate_call` step 1
  - `src-tauri/src/window_host/tests.rs:7118-7137` — 括弧深さの走査
  - `src-tauri/src/window_host/tests.rs:5619-5637` — `call_site_scan::extract_function`（深さゲートの参照実装）
  - `src-tauri/src/window_host/pointer_routing.rs:793, 850` — 現在の実呼び出し側
  ## 実害・発生条件 (任意)
  **現在は未発現。** 優先度は低い。`anchor_scan` は `#[cfg(test)]` ゲート下にあり
  本番コードは一切通らない。実際の呼び出し側 `pointer_routing.rs:850` は識別子・式の
  4 引数で、文字リテラルも生文字列も含まず、`run_button_decision` はトップレベルに
  1 回だけ定義されている。
  一方で、単なる将来互換性の話ではない。失敗が「落ちる」ではなく「誤って成功する」
  形で出るため、ガードが効かなくなったことに気づけない。良性編集耐性を主張する
  テストが、主張している保証を静かに失う経路になる。
  出典: em-workflow `benign-edit-test-token-rewrite` review round 1。
  comprehensive レビュアー（codex）が medium 3 件として報告し、評価者が 1 件を
  medium（stable_id `5ca53d4f98ce3d6f`、confidence 85）、2 件を low に格下げした。
  3 件を 1 チケットに統合する判断は Codex への相談結果による（同一の不変条件に属し、
  完了条件も 1 つにまとまるため）。
  対象ブランチ: `em-workflow/benign-edit-test-token-rewrite/integration`
