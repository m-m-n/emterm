    normalized_answer: 'Codex consulted (1 turn, codex harness). Facts: term_core
      dispatches Unterminated for ESC+non-backslash (osc.rs:68) and still fires callbacks
      for OSC 777/133 (osc_handler.rs:202,275; callbacks.rs:1375); only OSC 7501 drops
      Unterminated (callbacks.rs:1459). Chosen all_and_align_unterminated: abort on
      any non-backslash byte after ESC for every OSC kind; 7501 cut strings are discarded,
      777/133 cut strings are applied as term_core does, then the byte is processed
      as an escape. Not chosen: all_osc_kinds (would make mux drop 777/133 the plain
      tab applies = new divergence), osc7501_only (leaves other Unterminated divergences).
      Opus escalation not run. Recorded as assumption.'
