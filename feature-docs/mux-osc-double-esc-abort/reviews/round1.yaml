  description: "extract_main_buffer は画面切り替えを読み取りごとの完全一致でしか検出しない（write_filter.rs:1197-1202, 1332-1345）。ESC [?1049 / l ESC]133;A のように終了シーケンスが読み取りをまたぐと、pty_reader_loop の代替画面フォールバック（mod.rs:544-563）で live_spans が空になり、本文途中で読み取りが終わると tail_live=false が記録される。次の読み取り ESC ESC \\ では cut_live=false となり（1579-1580）PromptStart が出ない。旧実装は \\ で ST として確定し PromptStart を出していた。通常タブは打ち切り時に PromptStart を出すため、7501 記録と OSC 777 の D→A ラッチが mux ペインとずれる（FR7）。発生には終了シーケンスの途中分割・同じ読み取りへの 133 本文・本文と本文中 ESC の間の追加の読み取り境界がすべて要る。根本原因は FR8 で維持された既存フォールバック。追加の分割テストは全ストリームから求めた区間を切り分けるため、この経路を検出できない。"
  suggestion: "前の読み取りが代替画面絡みのフォールバックに入ったとき、本文最後のバイトの live 判定を「不明」として持ち越し打ち切り側の位置で判定する、または読み取り間で切り替えシーケンスの途中状態を引き継ぐ。drive_reads に [\\x1b[?1049h, \\x1b[?1049, l\\x1b]133;A, \\x1b\\x1b\\\\] を渡し通常タブの一括処理と同じ表になる回帰テストを追加する。"
