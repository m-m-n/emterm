lessons_candidates:
  - id: preexisting-failures-mislabeled-as-flaky
    note: >-
      3 人の implementer がいずれも tabs.rs の 7 件の失敗を「flaky / 並列実行由来の非決定性」と
      報告したが、verify で同じテストを 2 回単独実行したところ決定的に失敗し、実装前 baseline でも
      同一に失敗した。既存の失敗を「flaky」と分類すると baseline との差分照合が形骸化する。
      implementer には「baseline failure を flaky と呼ぶ前に 2 回走らせて決定性を確かめる」旨を
      求めるとよさそう。なおこの 7 件は main に元からある実バグの可能性があり、別タスク候補。
  - id: single-file-editor-cannot-fix-cross-file-findings
    note: >-
      review round 1 の high は修正が app.rs と window_host.rs に跨り、review-editor が単一ファイル
      専用のため R4 の auto-fix が構造的に適用不能だった。batch の needs-judgment 既定
      (Apply as-is) をそのまま踏むと部分適用が統合ブランチにコミットされる恐れがあり、
      orchestrator 判断で rework に回した。finding に「修正が跨るファイル数」の見積もりがあると
      auto-fix 可否を機械的に判定できる。
  - id: worktree-missing-gitignored-build-assets
    note: >-
      新規 worktree には gitignored の src-tauri/assets/fonts/ が無く、GUI feature のビルドが
      build_rs.font_missing で失敗する。3 タスク中 3 タスク + verify が同じ壁に当たり、各自が
      scripts/fetch-fonts.sh を実行して回避した。implement フェーズの worktree 作成直後に
      一度だけ流すか、タスクプロンプトに定型で載せると重複が消える。
  - id: cross-model-reviewer-availability
    note: >-
      round 1 で vertex/architecture が出力打ち切り (finish_reason: length)、round 2 で codex が
      利用上限、vertex/spec が HTTP 429 (同時リクエスト過多) を返した。vertex を複数同時に
      投げたことが 429 の一因の可能性がある。cross-model の fan-out はプロバイダ単位で
      直列化する余地がある。
