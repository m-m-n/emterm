    title: "活性化時の reconcile が「切り替え前のタブ用」の cell_size を使うため、mux タブ⇔ローカルタブの切替で誤サイズの余分な PTY resize が 1 回増える"
    description: >-
      `reconcile_active_tab_size` は `self.cell_size` を目標寸法に使うが、`cell_size`
      はアクティブタブに依存する量である。`App::mux_sidebar_visibility()` は
      `active_tab_mux_attached()` を見るため、persistent サイドバーの幅 inset は
      「どのタブがアクティブか」で変わる。`window_host::render` の順序は
      refresh_status_bar_insets(1530) → refresh_mux_sidebar_inset(1537) →
      apply_pending_resize(1547) → egui パス内の apply_tab_event(1803, ここで
      switch_to_tab) なので、reconcile が走る時点の `cell_size` は *出ていく側* の
      タブ用に算出された値である。結果、mux タブ ⇔ ローカルタブの切替で incoming
      タブは (1) 活性化時に誤幅へリサイズ、(2) 次フレームの set_grid_size で正幅へ
      再リサイズ、と 2 回リサイズされる。mux タブなら pane Resize 制御フレームも
      誤幅→正幅の 2 セットが daemon 側へ届く。変更前は切替時にリサイズが無く次
      フレームで 1 回だったため、可視タブに届く SIGWINCH が 1→2 に増える回帰でも
      ある。
    suggestion: >-
      reconcile の目標寸法を新アクティブタブ基準で再計算した値にする。switch_to_tab /
      close_tab / pump_all reap では reconcile 要求フラグだけを立て、
      `window_host::render` が refresh_status_bar_insets /
      refresh_mux_sidebar_inset / apply_pending_resize で新アクティブタブ用の
      cell_size を確定させた後に reconcile を実行する。FR3 の「サイズが一致して
      いればリサイズを発行しない」性質は維持すること。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: fixed
    resolution_reason: "task0003 の request/execute 分割で解消。round 2 で再確認済み（reviews/round2.yaml 参照）"
