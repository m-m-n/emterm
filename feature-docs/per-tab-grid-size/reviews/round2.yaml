    title: "同一 mux セッションに複数タブが attach していると、daemon 側 pane サイズがアクティブタブにのみ追随して非アクティブ側の core と食い違う"
    description: >-
      set_grid_size が全タブループをやめた結果、Tab::resize から送られる pane Resize
      制御フレームもアクティブタブ由来のものだけになった。daemon 側の pane はクライアント
      単位ではなくセッション単位の実体であり（mux/ipc/connection.rs:1224 の handle_resize は
      session_manager の pane を直接リサイズする）、Tab::apply_mux_message は Welcome を
      受けた各タブが独立に mux_session_name を持てる。したがって 2 枚のタブが同じ
      セッションに attach していると、片方をアクティブにした時点で共有 pane の PTY が
      そのタブの dims にリサイズされ、非アクティブ側のタブの core は古い dims のまま
      新 dims 前提で折り返された出力を受け取り続ける。旧実装では全タブが常に同一の
      cell_size だったためこの乖離は起き得なかった。
    suggestion: >-
      (a) 同一 mux_session_name に attach しているタブが他にも存在する場合だけ従来どおり
      全タブ同一サイズに揃える tmux 的ポリシーを入れる、(b) daemon 側から全クライアントへ
      resize 通知を配り非アクティブ側の core を追随させる、(c) 同一セッションへの重複
      attach を禁止/警告し SPEC.md に但し書きを明記する、のいずれか。採用方針を
      SPEC/IMPLEMENTATION に残し、2 タブ同一セッションのケースをテストで固定すること。
    sources: [claude:comprehensive]
    confidence: 65
