findings:
  - stable_id: 25f95cc4b7b5ac28
    severity: medium
    category: comprehensive
    file: src-tauri/src/window_host.rs
    line: 1812
    title: "タブバー経由のアクティブ化は reconcile が1フレーム遅れ、切替直後の1フレームが旧サイズで描画される"
    description: >-
      `execute_pending_reconcile()` の唯一の呼び出し点は render 冒頭
      (window_host.rs:1563) だが、マウス由来のアクティブ化（タブバークリック / タブの × /
      mux サイドバー行クリック → TabEvent::Switch / Close / MuxSwitch）は egui パスの後、
      同一 render の 1812 行で適用される。つまり request がセットされるのは executor が
      走った後で、消費は次フレームになる。このフレームは 1812 行以降も続行し、グリッド
      パスは切り替わった新アクティブタブを stale な core dims で描画して present する。
      旧実装では全タブが常に cell_size に揃っていたためこの経路も正しいサイズで描けて
      いた。結果、ウィンドウリサイズ後にタブバーからタブを切り替えると 1 フレームだけ
      旧グリッドサイズで描かれ、次フレームで広がる（視認できるちらつき）。mux タブでは
      Resize 制御フレームの送出も 1 フレーム遅れる。キーボード切替はこの経路を通らない
      ため、症状はマウス操作時のみ。
    suggestion: >-
      (a) apply_tab_event の適用直後（1826 の request_redraw の前）に
      refresh_mux_sidebar_inset → apply_pending_resize → execute_pending_reconcile を
      もう一度回す（surface acquire は 1950 行なので呼び出し順を壊さない）。または
      (b) タブ切替/クローズを実際に適用したフレームは present せず早期 return して次
      フレームに委ねる。いずれにせよ消費点を「アクティブ index が動き得る最後の地点の
      直後」に置く意図をコメントで明示すること。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: >-
      severity medium のため auto-fix 候補外（候補ゲートは critical/high）。
      batch の rework 上限（review_rework_count: 1）に到達済みのため 2 回目の rework は
      行わない。residual_critical_high は 0 なので完了ゲートは満たしている。
      フォローアップタスクとして人間の評価者に申し送る。
  - stable_id: 212e3e2a251aaffa
    severity: medium
    category: comprehensive
    file: src-tauri/src/app.rs
    line: 9956
    title: "round-1 欠陥の回帰テスト AC-1 が executor をまったく検証していない"
    description: >-
      `switch_to_tab_reconciles_to_incoming_dims_never_outgoing_when_insets_differ_per_tab`
      は switch_to_tab(0) の後に set_grid_size(90, 30) を「render パスが新アクティブタブ
      向けに inset を settle させる」代役として呼ぶが、switch_to_tab(0) により
      self.active == 0 なのでこの set_grid_size 自体が apply_tab_resize(0, 90, 30) で
      tab0 をリサイズしてしまう。続く execute_pending_reconcile() は dims 一致で no-op に
      なり、最終アサーション (90, 30) は executor の実装に一切依存しない。executor を
      空にしてもテストは緑のままで、名前が主張する性質を検出できない。task0003.tests.yaml
      の AC-1 が記録する red は rustc E0599（メソッド不在によるコンパイルエラー）であり、
      振る舞い上の red ではない。switch 直後に 80x24 のままであることを見る前半の
      アサーションだけが有効。
    suggestion: >-
      executor が実際に仕事をする形に組み替える。例えば tab1 がアクティブなうちに
      cell_size を 90x30 に settle させ、switch 後は set_grid_size を挟まず
      execute_pending_reconcile() だけを呼んで tab0 が 80x24 → 90x30 に変わることを見る。
      「120x40 を経由しない」ことは Tab::test_resize_frames() でフレーム列を直接検査すると
      最終値ではなく遷移そのものを押さえられる。あわせて task0003.tests.yaml の AC-1 の
      red_reason を実際の red 根拠に合わせて更新すること。
    sources: [claude:comprehensive]
    confidence: 65
