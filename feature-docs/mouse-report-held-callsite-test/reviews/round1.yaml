findings:
  - stable_id: a12c34983f2f0797
    severity: medium
    category: comprehensive
    file: src-tauri/src/window_host/tests.rs
    line: 5874
    title: "Rule 3b match-arm shadow detection silently skips every arm after a block-bodied arm with no trailing comma"
    description: |
      Verified by tracing `is_rebound_before` (tests.rs:5856-5881). `in_pattern` is set
      false at each top-level `=>` and is restored to true only by the
      `Tok::Punct(",") if nest == 0 && !in_pattern` branch at line 5874. A block-bodied
      arm written `None => {}` (no trailing comma -- the rustfmt-normal form, and the
      form used in this very file at pointer_routing.rs:859-880) leaves `in_pattern`
      false permanently, so every later arm's pattern is never scanned. Token trace for
      `match owner { None => {} Some(host) => { ... } }`: `=>` clears in_pattern, `{`/`}`
      move nest 1->0, `Some`/`(`/`host`/`)` are skipped, and the second `=>` fails its
      `in_pattern` guard. The delivered regression test
      `judge_call_rejects_a_match_arm_pattern_shadow_of_the_receiver_before_the_call`
      (tests.rs:6372) passes only because its binding sits in the FIRST arm
      (`match owner { Some(ctx) => {} None => {} }`), so the suite gives false
      confidence that match-arm shadowing is covered. Impact is bounded: rule 3b is
      defence-in-depth beyond SPEC FR1/FR2 (the three-token argument shape is still
      pinned), and no such shadow exists before either real call site today -- but a
      future `host`-binding arm placed before the call would pass undetected.
    suggestion: |
      Restore `in_pattern = true` after an arm whose body is a brace block terminates
      (nest returns to 0 at its closing `}`), not only on a following comma, and add a
      negative case whose binding is in a later arm:
      `match owner { None => {} Some(ctx) => {} } svc::apply_with_held(a, ctx.held_flag);`.
    sources: [codex:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity: below the Phase R4 auto-fix candidate gate (critical/high only); carried forward for the human evaluator"
  - stable_id: e879433ad6c94644
    severity: medium
    category: comprehensive
    file: src-tauri/src/window_host/tests.rs
    line: 6717
    title: "Benign-edit tolerance test hard-codes six identifiers outside NFR8's closed name set, creating a false-red trigger"
    description: |
      Verified by inspection. `button_path_benign_edits_to_the_real_source_are_still_accepted`
      (tests.rs:6717-6775) performs its edits by literal string replacement against the
      embedded production source: `real_call` (line 6719) is the verbatim single-line
      text of pointer_routing.rs:850, and `stmt_a`/`stmt_b` (lines 6746-6747) are the
      verbatim texts of pointer_routing.rs:816-817
      (`let hovered_link = !host.hover.link_cells.is_empty();` /
      `let middle_click_paste_enabled = app.settings.middle_click_paste;`). Each is
      guarded by a `sanity: ... must match ... verbatim` assert, so the test goes RED on
      any cosmetic reformat of the call (rustfmt rewrapping it across lines, a trailing
      comma added at the source) and on any unrelated rename of `hovered_link`,
      `middle_click_paste_enabled`, `host.hover.link_cells`, or
      `app.settings.middle_click_paste`. This is exactly the false red SPEC NFR8
      forbids: NFR8 declares the coupled-name set closed at the two function names, the
      three callee names, and `mouse_report_held`; this test adds six identifiers
      outside that set, and the failure is unrelated to the held pass-through the suite
      exists to pin. It is also self-undermining: the test asserting "benign edits stay
      green" is itself the most benign-edit-fragile test in the batch. Test-only impact,
      fails loudly, no production risk.
    suggestion: |
      Derive the rewrite site from the token stream instead of literal text: locate the
      call via `find_calls` on the tokenized source and splice at token indices (the
      mechanism `splice_tokens` already provides and that the AC-6 mutation tests
      already use), or drive the reorder from `split_arg_spans`/statement token spans
      rather than naming two unrelated locals. If a source-text edit must stay, drop the
      two unrelated-statement literals entirely and keep only the reorder expressed over
      tokens.
    sources: [codex:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity: below the Phase R4 auto-fix candidate gate (critical/high only); carried forward for the human evaluator"
