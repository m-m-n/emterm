schema_version: 1
feature: asset-manifest-scanner-hardening
created: '2026-09-21'
base_branch: main
goal: |
  asset_manifest.rs のスキャナに 2 件の堅牢性ギャップ（target プレフィックス除外 / include_bytes! のマクロ境界）

  ## 現象 (必須)
  `src-tauri/tests/asset_manifest.rs`（PR #77 で追加したフォントアセットの
  リグレッションガード）に、ガード自体を弱める堅牢性ギャップが 2 件ある。
  どちらも現状のツリーでは誤検出も見逃しも起きていないが、将来のパス追加で
  静かに壊れる。
  1. `asset_manifest.rs:179` — ビルド成果物の除外が `target` プレフィックス規則を
  ディレクトリだけでなくパス構成要素すべてに適用している。`target` で始まる
  名前の通常ファイル（例: `target_resolver.rs`）がスキャン対象から落ちる。
  1. `asset_manifest.rs:87` — `include_bytes!` のスキャナが固定部分文字列に
  マッチした後、マクロの境界を見ずに次の `"` を探す。マクロ呼び出しの外まで
  走って別の文字列リテラルを拾いうる。同じ形の実例が
  `src-tauri/build.rs:160` にある。
  ## 再現手順 (必須)
  1. `src-tauri/` 配下に `target` で始まる名前の `.rs` ファイルを置き、その中で
  `include_bytes!("../assets/fonts/<未取得のフォント>.ttf")` を書く
  1. `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --test asset_manifest` を実行する
  2. ガードが検出しないまま通る（1 の経路）
  ## 期待する挙動 (必須)
  - `target` プレフィックスによる除外はディレクトリ構成要素だけに適用する
  - `include_bytes!` の引数抽出をマクロ呼び出しの括弧内に限定する
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `src-tauri/tests/asset_manifest.rs:179`
  - `src-tauri/tests/asset_manifest.rs:87`
  - `src-tauri/build.rs:160`（2 の同型の実例）
  ## 実害・発生条件 (任意)
  現状のツリーでは発現しない。フォント埋め込みパスが増えたとき、または
  `target` で始まる名前のソースが増えたときに、ガードが静かに素通りする。
  ## 由来
  em-workflow フィーチャー `fetch-fonts-noto-color-emoji`（PR #77）の
  レビューラウンド 1。comprehensive レビュアーが検出し、評価者が独立に裏取り
  したうえで severity を low に降格したため、severity ゲートで落ちて
  auto-fix ループに乗らなかった。評価者の `recommended_action` は `auto_fix`
  だった。記録は
  `feature-docs/fetch-fonts-noto-color-emoji/reviews/round1.yaml` の
  `findings_dropped_by_severity_gate`。
parent_branch: em-workflow/asset-manifest-scanner-hardening/integration
