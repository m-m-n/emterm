    result objects. Independent Inspection Duty — per-perspective coverage
    (5 files inspected under project_root, within the 10-file read budget:
    src-tauri/tests/asset_manifest.rs, SPEC.md, IMPLEMENTATION.md,
    tasks/task0001.md, test-docs/.../task0001.tests.yaml, plus a read-only git
    diff of the full change set): comprehensive = corroborated (traced
    embedded_font_names' new depth counter for loop progress — rest advances by
    at least NEEDLE.len()+1 each iteration, so no infinite loop; all slice
    indices land on ASCII '"' / ')' / the ASCII needle, so no UTF-8 boundary
    panic; the no-closing-paren path breaks deliberately and is pinned by a
    test); security = corroborated (test-only diff, no new dependency, no
    filesystem write, no process execution; the is_excluded_path narrowing does
    not widen traversal into build output because collect_rust_source still
    gates directories with is_build_output_dir at asset_manifest.rs:261, and the
    tempdir tests use tempfile::tempdir rather than fixed paths); performance =
    corroborated (the per-call depth scans cover disjoint spans because scanning
    resumes at region_end+1, so the whole pass stays O(n); the one added
    allocation is a per-directory-entry Vec<Component> in is_excluded_path,
    confined to the test walk and immaterial); spec = corroborated
    (FR1/FR2/FR4/FR5 map onto the two changed pure functions; NFR1 purity and
    NFR5 containment hold — src-tauri/tests/asset_manifest.rs is the only
    non-doc file changed, with src-tauri/build.rs and
    src-tauri/src/render/font/resolver.rs untouched; NFR2/AC7 hold with no
    Cargo.toml diff; FR6/TS1-TS6 are covered by six added tests and the
    pre-existing tests are unmodified). FR3/AC5 was verified empirically rather
    than by reading alone: the evaluator re-implemented both the pre-change and
    post-change scanner over the real tree read-only and both walk exactly 287
    .rs files and yield exactly the same 7 fonts from
    src-tauri/src/render/font/resolver.rs (NotoSansCJKjp-Regular.otf,
    NotoSansCJKjp-Bold.otf, Noto-COLRv1.ttf, NotoEmoji-Regular.ttf,
    Inconsolata-Regular.otf, Inconsolata-Bold.otf,
    NotoSansSymbols2-Regular.ttf), with src-tauri/build.rs contributing the empty
    set under both — the guard's verdict on the current tree is unchanged, as FR3
    requires. Two non-finding observations for the record, neither actionable:
    (1) the deliberate 'no closing parenthesis ends the whole scan' branch means a
    stray literal 'include_bytes!(' inside a comment or string, followed by
    paren-balanced text, would silently skip later embeds in that one file — this
