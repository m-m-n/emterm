goal: '# mux: 抑止チャンクの副作用処理の round2-fixes review で残った medium 指摘 8 件の対応


  Notion: https://www.notion.so/3ea3509ec8ee8129b657c2bb0eaa0f4b  種別: バグ


  ## 現象 (必須)

  mux-suppressed-output-round2-fixes（PR https://github.com/m-m-n/emterm/pull/111 ）の review round 1 で、medium
  指摘 8 件が `unresolved` のまま残っている。

  - 削除された画面切り替えで閉じた OSC が未終端のまま ring に書かれ、スナップショット再生後の BEL で色問い合わせが成立する（973af79f520bdaa5）

  - 指定文字待ちの状態が strip に渡らないので、分割位置で出力が変わる（FR3 の分割不変条件違反、195916fd94088018）

  - 削除側の走査が指定文字として消費される ESC を OSC の開始と誤認し、FR7 の識別拡張で先頭ゼロ付き表記の表示文字列まで消す（76342d8d941e6416）

  - 切り替えが読み込み境界をまたぐ代替経路で pending が閉じず、FR6 の持ち越し完了として存在しない OSC 問い合わせを配送する（2a9d929f4fafb7cb）

  - 保持窓に判定できる ESC が無いときの as-05 フォールバックが、末尾の ESC ( による指定文字待ちを無視して問い合わせを捏造する（eaf83fe08869d5e6）

  - 被覆判定で得た construct を排他の解放後に使うので、後続のスナップショットで末尾を省略する判断が古くなる（6230e66b979e312e）

  - 同じ境界で construct が食い違うと None になり、最後に適用されたスナップショットの末尾状態が失われる（240031761bfdf695）

  - 通常の書き込み経路で、OSC ごとに本文全体を複製して UTF-8 検証するようになった（性能、b3e644c5e2d31809）

  ## 再現手順 (必須)

  1. mux の pane に出力を流し続ける

  2. 上記の条件を含むチャンクの途中で snapshot 取得（タブ切替 / reattach）が走り、そのチャンクが抑止される

  3. 問い合わせ応答・ビューア起動・表示が上記のとおりずれる

  ## 期待する挙動 (必須)

  抑止したチャンクの副作用処理が、抑止しなかった場合と同じ解析状態・同じ順序で行われる。通常の書き込み経路に余計な複製・検証の負荷が無い。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] 各 stable_id について、対応済みか・対応不要かを判断して記録する

  ## 該当箇所 (任意)

  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:304` / `:323`

  - `src-tauri/src/mux/scrollback_filter.rs:309` / `:310`

  - `src-tauri/src/mux/ipc/pty_spawn/mod.rs:525` / `:647`

  - `src-tauri/src/mux/ipc/pty_spawn/client_parity_scan.rs:169`

  - `src-tauri/src/mux/session/pane/output_capture.rs:311`

  - 詳細: ブランチ `em-workflow/mux-suppressed-output-round2-fixes/integration` の `feature-docs/mux-suppressed-output-round2-fixes/reviews/round1.yaml`

  ## 実害・発生条件 (任意)

  snapshot 取得と 1 チャンクが重なったときにだけ起きる（b3e644c5e2d31809 は通常経路の性能）。


  ## 追加指示（起動引数）

  - 実装完了後、integration ブランチを remote に push し gh pr create で base_branch への PR を作る。integration ブランチはローカル・リモート両方に残す（base_branch
  へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した案を採用する。その議論内容を Notion に記録する

  '
