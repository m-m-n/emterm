    freeform: (a) 境界記録に世代を付け、送信直前に再確認する
    normalized_answer: FR6 は境界記録に世代（または同等の識別）を付け、置換出力の送信では排他の外で送信枠を確保した後、output_target
      → 境界排他の順で取り直して記録を再確認し、末尾省略を決めて permit.send まで保持する。走査や通知処理は排他の外に置く。同じ境界の再記録にも世代を付け、置換出力が空になる場合も再確認の対象にする。
