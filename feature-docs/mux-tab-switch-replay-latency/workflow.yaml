  task0003:
    title: "Pane-switch race resilience: target-mismatch bypass drop and duplicate snapshot fetch"
    plan: tasks/task0003.md
    files:
      - src-tauri/src/tabs.rs
    skills: [backend-impl]
    domains: [concurrency]
    complexity: high
    requirements: [FR7, FR8]
    status: merged
    notes: >-
      Implementer deviation on FR7: engaging bypass across a genuine
      post-resize target mismatch was found unsafe (violates term_core's
      documented row-growth/rewrap-during-bypass invariant). Implemented
      instead as coalescing same-pane redispatches so an intermediate,
      already-superseded target is never wastefully rebuilt — the final
      replay for a genuinely mismatched target still falls back to
      non-bypass by design. Flag for the review phase's spec-compliance
      check against SPEC.md FR7's wording.
    branch: em-workflow/mux-tab-switch-replay-latency/task0003
  task0004:
    title: "term_core bypass split gate: fix D7 rescue direction, restore pre-D7 fallback, tighten bench ceiling"
