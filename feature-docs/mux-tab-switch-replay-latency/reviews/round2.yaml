    title: "D8 head fold with an empty MIDDLE (h == k) returns a core at the HEAD's dims, not the caller's target"
    description: >-
      task0004's D8 lets the HEAD run be at any uniform (cols, R) with R >= rows.
      When the whole pre-suffix region is that one uniform run, h == k, so the
      MIDDLE is empty and replay_segments's empty-segments early return skips
      the final "resize back to target" step — the built core stays at
      head_rows. Empirically confirmed by the reviewer against this worktree's
      crate: requested (80,24), got (80,30), scrollback_populated=false vs the
      reference build's (80,24)/true. apply_offthread_swap installs this
      wrong-sized core as the live core; nothing corrects it in the unraced
      case.
