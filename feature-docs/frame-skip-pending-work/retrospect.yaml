  - id: L2
    note: >-
      A fresh integration worktree lacks gitignored build assets
      (src-tauri/assets/fonts/, viewer/dist, settings/dist) that build.rs
      requires, so neither the implementer nor the verify phase can run cargo
      at all until they are copied in from the main worktree. Both had to
      discover and work around this independently. A documented pre-step (or
      a project-level bootstrap command in workflow.yaml components) would
      remove the duplicated discovery.
  - id: L3
    note: >-
      The Bash tool's persistent cwd silently reset mid-verify, so two check
      commands ran against the MAIN working tree instead of the integration
      worktree and reported a meaningless pass. Caught only by adding `pwd`
      to the command. Verify-phase commands that must run in the integration
      worktree should carry their own cd (or an explicit pwd assertion) in
      every invocation rather than relying on a cwd set in an earlier turn.
  - id: L4
    note: >-
      cargo fmt --check is crate-wide and this repo carries pre-existing drift
      in 7 unrelated files, so the format_command in workflow.yaml can never
      exit 0 regardless of what the feature does. The verify phase had to
      interpret the result by hand (drift confined to untouched files). A
      changed-files-scoped format check would give a mechanically usable
      signal.
