    kind: project_native
    paths:
      - doc/UI-DESIGN-GUIDELINES.yaml
      - src-tauri/src/ui/md3.rs
      - src-tauri/web-shared/styles.css
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1"
      format_command: "cargo fmt --manifest-path src-tauri/Cargo.toml --check"
      e2e_test_command: ""
    cli_feature_gate:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features"
      test_command: ""
      format_command: ""
      e2e_test_command: ""
    windows_cross:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target-win cargo xwin check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib --tests"
      test_command: ""
      format_command: ""
      e2e_test_command: ""

