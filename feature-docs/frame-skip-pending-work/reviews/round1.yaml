    description: >-
      test_set_restart_required の導入で、プロセス全体に 1 つしかない RESTART_REQUIRED を
      7 本のテストが直列化なしに読み書きする状態になった。既存の
      pump_toasts_runs_both_pumps_unconditionally（restart_required() が swap で消費）と
      next_toast_deadline_none_when_no_toast_active を巻き込んで flaky になる。
      self_exec.rs のドックコメント「The suite runs single-threaded」はプロジェクトの
      既定 cargo test コマンドと一致していない。加えてフラグ復元が成功パス上にしか
      無いため、途中の assert が panic すると raised のまま後続テストへ波及する。
    suggestion: >-
      test-only の Mutex + Drop でフラグを必ず戻す RAII ガードを self_exec に置き、
      フラグに触れる全テストをそれ経由にする。あるいは serial_test を dev-dependency に
      追加して #[serial(restart_flag)] を付ける。いずれの場合も self_exec.rs の
      「The suite runs single-threaded」記述を実際の直列化手段の説明に差し替える。
    sources: [claude:comprehensive]
