findings:
  - stable_id: cc9fd2586bd2b1e0
    severity: medium
    category: comprehensive
    file: .github/workflows/ci.yml
    line: 21
    title: "The reproducibility gate itself runs on an unpinned Bun toolchain"
    description: >-
      Independently verified at .github/workflows/ci.yml:21 (`bun-version: latest`)
      and .github/workflows/ci.yml:13 (`runs-on: ubuntu-latest`). The feature's
      stated objective is that `bun install` resolve an identical dependency graph
      in every environment (SPEC Objectives, NFR4), and `--frozen-lockfile`
      delivers that for package versions — but the resolver, runtime and test
      runner executing that lockfile are re-selected on every run. A Bun release
      landing between a green CI run and a release build means the same commit was
      tested and packaged by different toolchains with no reviewed repository
      change; release.yml's two build jobs select their Bun independently of
      ci.yml, so they can also disagree with each other. ci-workflows.test.ts
      asserts only the presence and ordering of the frozen-lockfile install steps
      and never asserts `bun-version: latest`, so pinning breaks no test.
    suggestion: >-
      Set one exact Bun version (e.g. `bun-version: 1.3.5`, matching the
      `bun-types` entry already locked at bun.lock:147) in ci.yml and in both
      release.yml build jobs, and bump it deliberately in the same commit that
      regenerates bun.lock.
    sources: [codex:comprehensive]
    confidence: 80
    resolution: unresolved
    resolution_reason: >-
      Below the Phase R4 candidate gate (severity medium). Same site as round-1
      finding 14fd0bd36f883ab0, re-reported with a rewritten title so the
      recomputed stable_id differs.
  - stable_id: e7bbf92f7fdf623c
    severity: medium
    category: comprehensive
    file: .github/workflows/ci.yml
    line: 16
    title: "New workflow runs movable action tags with inherited token scope and persisted credentials"
    description: >-
      Independently verified: the new workflow uses `actions/checkout@v4` (line 16)
      and `oven-sh/setup-bun@v2` (line 19), declares no `permissions:` block, and
      does not disable checkout's credential persistence. Both tags are mutable, so
      a retagged upstream release executes on the next push to main without any
      repository change; the frozen lockfile constrains npm packages only and gives
      no coverage over the actions themselves. With no `permissions:` block the job
      token inherits the repository default, and the persisted `.git` credential
      remains available to every subsequent step — including `bun install`'s
      postinstall scripts. The security perspective returned empty this round,
      framing its scope as regressions rather than newly introduced surface; this
      is a new workflow file, so the surface is new even though the pattern matches
      the existing release.yml.
    suggestion: >-
      Add `permissions: { contents: read }` at the job or workflow level, set
      `with: { persist-credentials: false }` on the checkout step, and pin both
      actions to reviewed commit SHAs (keeping the version as a trailing comment).
      Applying the same treatment to release.yml keeps the two workflows
      consistent rather than leaving ci.yml as the sole hardened file.
    sources: [codex:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: >-
      Below the Phase R4 candidate gate (severity medium). Same site as round-1
      finding 743171602af23c63.
  - stable_id: 9c13251e970fe4c0
    severity: medium
    category: comprehensive
    file: bun.lock
    line: 59
    title: "The now-sole lockfile carries an empty integrity digest for a runtime dependency"
    description: >-
      Independently verified by scanning bun.lock: exactly 9 entries have an empty
      trailing integrity field. Eight are dev-only (@types/node:135,
      @types/whatwg-mimetype:139, bun-types:147, typescript:287, undici-types:289,
      whatwg-mimetype:293, @types/ws/@types/node:305, and its undici-types:317),
      but line 59 — `"@tauri-apps/api": ["@tauri-apps/api@2.9.1", "", {}, ""]` — is
      a declared runtime dependency of package.json. Every other resolved entry
      does carry a sha512, so the gap is entry-specific rather than a format-wide
      property. SPEC Security Considerations justifies FR1/FR2 on the grounds that
      committing bun.lock makes the resolved graph a single reviewable source of
      truth, and package-lock.json — the previous second opinion on package bytes —
      is deleted by this same diff. For these 9 entries the committed lockfile pins
      the version string but not the content.
    suggestion: >-
      Regenerate the lockfile against a cold Bun cache (`bun pm cache rm` then a
      fresh install), confirm the 9 entries gain sha512 digests and that no version
      string moves, and commit the regenerated file. If an entry legitimately
      cannot carry a digest, record why alongside the FR4 finding in
      doc/dompurify-h1-sanitization.md. Not a safe mechanical auto-fix — it needs a
      human-reviewed lockfile diff.
    sources: [codex:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: >-
      Below the Phase R4 candidate gate (severity medium). Same site as round-1
      finding 3abf55bdac5196d3. The evaluator explicitly excluded it from bounded
      auto-fix as requiring a human-reviewed lockfile diff.
