schema_version: 1
feature: bun-install-reproducibility
created: 2026-09-05
base_branch: main
goal: |-
  bun install の依存解決ぶれで viewer entry テストがクリーン環境だけ落ちる（dompurify 3.4.14）

  ## 現象（必須）
  `package.json` は `dompurify` を `^3.3.1` で宣言していて、リポジトリには bun のロック
  ファイルがコミットされていない（`bun install` は `package-lock.json` からの移行を毎回
  行い、生成した `bun.lock` は gitignore 済み）。このため新しい worktree や CI のような
  クリーンな環境で `bun install` すると `dompurify` が 3.4.14 に解決され、
  `src-tauri/viewer/web/entry.test.ts` の 2 件が落ちる。
  ```plain text
  (fail) viewer entry > renders an injected sample into the fullscreen content structure
  (fail) viewer entry > parses the shared Rust/TS payload fixture with all fields
  error: Received value must be an array type, or both received and expected values must be strings.
    at src-tauri/viewer/web/entry.test.ts:128:54
  ```
  `128` 行目は `expect(content.querySelector("h1")?.textContent).toContain("Hi")` で、
  `h1` が見つからず `textContent` が `undefined` になっている。サニタイズ結果が
  dompurify のバージョン差で変わっている。
  メイン作業ツリーは既存のインストール済み `node_modules` に 3.3.1 を保持しているため、
  そこでは再現しない。`marked` と `happy-dom` のバージョン差は無関係であることを
  個別にピン留めして切り分け済み。
  ## 再現手順（必須）
  1. `git worktree add <path> <任意のブランチ>` でクリーンな作業ツリーを作る
  2. その作業ツリーで `bun install` を実行する（`dompurify` が 3.4.14 に解決される）
  3. `bun test src-tauri/viewer/web/entry.test.ts` を実行する → 2 件 fail
  4. `bun add dompurify@3.3.1` してから同じテストを実行する → 14 pass / 0 fail
  ## 期待する挙動（必須）
  どの環境で `bun install` しても同じ依存バージョンに解決され、`bun test` の結果が
  作業ツリーによって変わらない。あるいは、viewer entry のテストが dompurify のパッチ
  バージョン差でサニタイズ結果が変わっても壊れない書き方になっている。
  ## 完了の定義（必須）
  - [ ] クリーンな作業ツリーで `bun install` → `bun test` したとき、viewer entry の
  2 件が pass する
  - [ ] 依存の解決が環境間で再現するようになっている（ロックファイルのコミット、
  または該当依存のバージョン固定）
  - [ ] 再発を検出するテストがある（既存の viewer entry テストで足りるなら、それが
  クリーン環境の CI で走ることを確認する）
  ## 該当箇所（任意）
  `src-tauri/viewer/web/entry.test.ts:128`（`h1` の textContent を検証している行）
  `package.json`（`dompurify` の `^3.3.1` 宣言、および bun ロックファイルの非コミット）
  ## 実害・発生条件（任意）
  em-workflow の integration worktree のように、クリーンな環境で `bun install` してから
  `bun test` を回す経路すべてで発生する。verify フェーズがこの 2 件を毎回「変更と無関係な
  失敗」として切り分ける必要があり、本物の退行を見落とすリスクになる。CI をクリーン
  インストールで回している場合も同じ形で落ちる。
  なお、同じ `bun test` で落ちる
  `plugin/marketplace version regression guard (task0002 AC-9)` の 2 件は `main` でも
  落ちる別件で、この起票の対象ではない。
parent_branch: em-workflow/bun-install-reproducibility/integration

