      Question: the ticket prescribed Fix A (any closing bracket `}`/`)`/`]` that
      returns nest to 0 re-enters pattern scanning) for rule 3b's match-arm
      splitting loop in src-tauri/src/window_host/tests.rs; alternatives were
      Fix B (only `}`) and Fix C (track whether the arm body started with `{`).
      Options NOT chosen: Fix A — rejected because Fix B fixes the same
      under-detection while newly over-rejecting nothing; Fix A additionally
      over-rejects non-block arm bodies whose checked name appears after a
      top-level closing bracket (`make().with(target)`, `make().target()`,
      `factory()(target)`, `make()[target]`, `make() + target`). Fix C —
      rejected because the start-token flag trades over-rejection for new
      under-detection (`None => if cond { a() } else { b() }`, trailing-comma-less
      nested `match` bodies).
      Chosen: Fix B. Codex also corrected the ticket's stated over-rejection
      example — `Some(x) => foo(bar), None => {}` is NOT over-rejected under
      Fix A. Residual limitation shared by all three options (inner `}` of a
      struct literal / if / nested match misread as an arm terminator) is
      accepted here because it falls on the conservative reject side, and is
      now documented in TASK.md's Change section.
      No Opus escalation ran. TASK.md was rewritten to prescribe Fix B before
      implement started; create-plan's registered task0001 points at TASK.md,
      so the plan document stays authoritative.
