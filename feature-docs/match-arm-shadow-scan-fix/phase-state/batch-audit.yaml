      Question: the round-1 evaluator raised one severity `low` finding — AC-7 in
      test-docs/match-arm-shadow-scan-fix/task0001.tests.yaml records
      `red_confirmed: true` although its own red_reason prose describes only a
      post-implementation GREEN full-suite run, while AC-4/AC-5/AC-6 honestly
