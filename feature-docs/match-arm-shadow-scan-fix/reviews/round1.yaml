    nit of the evaluator''s own (see below). security#0 = corroborated.


    Independent verification of the fix in `is_rebound_before` (src-tauri/src/window_host/tests.rs:5871-5877):
    the new `}`-at-nest-0-while-not-in-pattern reset is monotone in the safe direction. Hand-traced block-bodied-arm
    cases (with and without trailing comma, one and two prior arms, nested `(`/`[` inside a prior block
    body), struct-pattern patterns (`Foo { a } => ...`, where the `{` is opened inside `(` or at pattern
    level with in_pattern still true, so the reset correctly does not fire), non-block bodies containing
    struct literals, `if/else` blocks, and nested `match` blocks. In every traced shape the reset either
    lands on the true arm separator or moves `seg_start` EARLIER than the pre-fix `,` branch would have,
    so the scanned pattern span is always a superset of the pre-fix span -- an over-rejection (red), never
    a newly silent miss. That matches the new comment''s own claim; a concrete over-rejection shape exists,
    e.g. `A => if c { 1 } else { ctx.f }, B => {}`. A `=>` cannot appear at nest 0 inside an arm body,
    so the reset cannot cause a real arm''s pattern to be consumed as a body. The `nest -= 1` underflow
    exposure on malformed input predates this change and is unchanged.


    The six new tests are consistent with the diff: `fake_params()` contains only `ctx` (tests.rs:6141)
    and `FAKE_FORBIDDEN = ["svc", "apply"]` does not token-match `svc::apply_with_held`, so both `is_ok()`
    cases (AC-5, AC-6) genuinely exercise the rebinding path rather than passing for an unrelated reason.
    The yaml''s test names all resolve to real `#[test]` fns in the diff.


    Security: the whole change is inside `#[cfg(test)] mod tests;` (src-tauri/src/window_host/mod.rs:866-867)
    plus a workflow record yaml with no build/CI consumer. The added Rust source strings are inert literals
    fed to an in-process tokenizer; no production path, no I/O, no untrusted-input surface.


    No prompt-injection attempt was present in either reviewer output or in the reviewed diff.


