    normalized_answer: vt100 にリングを渡す 2 か所（render_scrollback_rows / MuxPane::from_restored のシャドー再生）の直前で、書き込み済みストリームが CSI 内または単独 ESC 直後にある位置の DEL だけを CAN に置き換えたコピーを渡す。状態の遷移は置換前のバイトで進める。通常状態と OSC/DCS/APC 本文の
      DEL は保持する。リングと term_core 経路のバイトは変えない。単独 ESC 直後の DEL（D1）も同じ変換の対象にする（assumption a3 を採用）。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation, record_as_assumption); Codex (codex harness, 1 turn) consulted; Opus escalation: not run; options: consumer_copy_state_aware
      [chosen] / consumer_copy_all_del [not chosen] / ring_two_byte_closing [not chosen]; key points: vte は CSI 内の DEL を無視し CAN で通常状態へ戻る(vte-0.15.0 lib.rs:251,:440)ため消費側変換が適する。変換は ReadPane の scratch.process(agent_api.rs:117)と復元時の
      parser.process(pane/mod.rs:884)の直前、共有関数は scrollback_filter.rs に置き WrittenState の遷移(scrollback_filter.rs:222)を利用、O(n)。単一バイト CSI_CLOSING と D2 の 1 対 1 置換(scrollback_filter.rs:53,:287)を維持できる。全 DEL 置換は保持された
      OSC/DCS 本文を CAN で終了させる(vte lib.rs:320,:414)ため不採用。注意: 状態判定は置換前のバイトで進める(term_core は CAN で CSI を閉じない: csi.rs:77)。ReadPane の末尾切り出し(agent_api.rs:188)とリングの先頭破棄で失われた状態は復元できない。a3(ESC 直後の DEL)も同じ変換に含める(scrollback_filter.rs:316,
      vte lib.rs:347,:383,:388)。D3 の ESC 用終端は既に CAN なので変更不要(write_filter.rs:160)'
