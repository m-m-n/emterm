schema_version: 1
feature: mux-vt100-del-closing
created: '2026-10-04'
base_branch: main
goal: '# mux: 分割照会の最終バイトを DEL に置き換えたリングを vt100 側の消費者（mux read / 復元時の shadow parser）が CSI の取り消しとして扱わず後続バイトを飲み込む


  Notion: https://www.notion.so/3ee3509ec8ee8127acacf958ffd70efb (種別: バグ)


  ## 現象 (必須)

  mux-strip-concat-query-closure（ブランチ `em-workflow/mux-strip-concat-query-closure/integration`）の review round 1 で残った medium 指摘 `f5176c335e8e18f8`。本 feature が持ち込んだ退行。

  D2（`src-tauri/src/mux/scrollback_filter.rs:284` の `Written::push`）は、読み込み境界で分割された応答対象の問い合わせの最終バイトを DEL に置き換えてリングに書く（`ESC[6` | `n` → `ESC[6 DEL`）。DEL で CSI が取り消されるのは term_core だけの前提になっている。

  リングは vt100 0.16.2 / vte 0.15.0 にも渡される。渡し先は次の 2 か所。

  - `agent_api.rs` の `render_scrollback_rows`（mux read の ReadPane）

  - `session/pane/mod.rs` の `from_restored`（復元時の shadow parser の再生）

  vt100 では DEL が CSI を取り消さない。変更前の形 `ESC[6n` + `Hello` は 1 行目に `Hello` と出ていたが、変更後の形 `ESC[6 DEL Hello` は CUP 6 と解釈され 6 行目に `ello` と表示される（evaluator が vt100 =0.16.2 で実測）。通常の読み込み分割だけで、mux read の描画と復元後の shadow
  画面が崩れる。

  D1 と既存の cut の closing（D3）も同じ DEL を使うが、vt100 には変更前から `ESC[6` に後続バイトが連結された形で渡っていたので、悪化するのは D2 の経路だけ。


  ## 再現手順 (必須)

  1. mux の pane に `ESC[6` を出力し、別の読み込みで `n` + `Hello` を出力する

  2. mux read（ReadPane）でその pane を読む、または復元して shadow 画面を見る

  3. `Hello` が 1 行目ではなく 6 行目に `ello` として現れる


  ## 期待する挙動 (必須)

  vt100 側の消費者でも、閉じた CSI の後続バイトが正しく描画される。


  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)

  - `src-tauri/src/mux/scrollback_filter.rs:284`（`Written::push`）

  - `agent_api.rs` の `render_scrollback_rows`

  - `session/pane/mod.rs` の `MuxPane::from_restored`


  review での修正案:

  - 案 (a): vt100 にリングを渡す 2 か所の直前で、0x7F を CAN (0x18) に置き換えたコピーを渡す（vt100 で `ESC[6 CAN Hello` が 1 行目に `Hello` と出ることは実測済み）

  - 案 (b): closing を DEL + CAN の 2 バイトにする（SPEC A1 と 1 対 1 置換の前提から外れる）

  - CAN 単独は term_core が CSI 内の CAN で取り消さないため使えない

  - どちらの案でも、`ESC[6` + 閉じバイト + `Hello` を vt100 で描画して 1 行目に `Hello` が出るテストを追加する


  ## 実害・発生条件 (任意)

  応答対象の CSI 照会が読み込み境界で分割されたときに発生する。mux read の結果と、復元後の shadow 画面が崩れる。


  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較して良いと判断した案を採用する

  - 相談内容は Notion に記録する

  '
