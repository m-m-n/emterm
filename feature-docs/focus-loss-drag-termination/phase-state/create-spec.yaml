    normalized_answer: Narrow FR3 to apply only when the left button is not physically
      held; while held, publish nothing and keep host.dragging + the pending anchor,
      delegating termination to the release path's drag_in_flight no-owner fallback.
      This SPEC supersedes the prior feature's FR3 / AC-3 / state-table row.
    resolution_note: 'Codex consultation (2 turns, harness entry `codex`) mapped to
      narrow_fr3_skip_when_held. Recorded as assumption per batch-policies.yaml record_as_assumption:
      true. Codex caveat carried forward: mouse_report_held is an event-derived record,
      not a physical-state query.'
  edge-case.release-never-arrives:
    packet_id: create-spec-q0001
    answered_at: '2026-09-20T16:51:52+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - rely_on_release_only
    freeform: null
    normalized_answer: Add no extra terminator. The release path's no-owner drag_in_flight
      fallback is the guaranteed terminator. The residual lost-release leak is filed
      as a separate follow-up task rather than closed by an event-derived check.
    resolution_note: Codex returned NO_MAPPING; the single per-packet Opus escalation
      decided rely_on_release_only. Both terminate_on_* options would read a mouse_report_held
      record that clear_all has already zeroed, degrading to unconditional termination
      and reintroducing the bug. Follow-up task to be filed for a non-event-derived
      terminator.
