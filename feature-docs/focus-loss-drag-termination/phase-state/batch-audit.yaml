- question_id: verify.manual-scenario-unexecutable
  packet_id: null
  answered_at: '2026-09-20T17:45:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - pass_with_ts7_recorded_as_not_executed
  freeform: null
  normalized_answer: Record verify as pass over the automatable verification surface, and state explicitly that TS-7 is NOT passed but NOT EXECUTED (no GUI in the unattended batch environment). SC-4 therefore remains pending the human's manual confirmation against a release build. No failed_items entry is added, because a manual-only scenario is not a failure an implement rework can resolve.
  resolution_note: 'gate: verify.manual-scenario-unexecutable (unlisted gate; no gate_id at its originating site, resolved via the batch-mode unlisted-gate fallback procedure); chosen: pass_with_ts7_recorded_as_not_executed (option A plus the stronger annotation requirement Codex added); not chosen: fail_and_rework (option B), pass_with_ts7_in_failed_items (option C); codex_consulted: true (codex-harness second-opinion-agent, readonly sandbox, default provider); opus_escalation: no; key points: TS-7 did not fail, it was not executed - the unattended batch environment has no GUI and no E2E automation exists in this project (SPEC assumption A6); routing it to rework is unresolvable by construction, so any number of rework rounds would leave it unchanged and the verdict would lose meaning; explicitly distinguishing "not executed" from "passed" satisfies the constraint of never recording something as verified that was not verified, without collapsing the whole automated verification surface into a failure; Codex additionally required that the word pass be scoped in prose to the automatable surface rather than presented as an unqualified SC-4 pass, and that the human be asked to run TS-7a/b/c against a release build. Codex also reviewed the production diff and reported no defect and no spec divergence: reading the held record before clear_all, narrowing termination behind a pure predicate, and delegating the held drag termination to the existing release path are all consistent with the SPEC and its acceptance criteria.'
  follow_up: TS-7a/b/c stay unchecked in VERIFICATION.md's Manual Testing section; the human runs them against a release build before merging the PR.
