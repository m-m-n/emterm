schema_version: 1
feature: focus-loss-drag-termination
records:
  - question_id: requirement.fr3-termination-scope
    packet_id: create-spec-q0001
    answered_at: "2026-09-20T16:51:45+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [narrow_fr3_skip_when_held]
    freeform: null
    normalized_answer: "Narrow FR3 to apply only when the left button is not physically held; while held, publish nothing and keep host.dragging + the pending anchor, delegating termination to the release path's drag_in_flight no-owner fallback. This SPEC supersedes the prior FR3 / AC-3 / state-table row."
    resolution_note: >-
      gate: create-spec.requirement-clarification (policy action codex_consultation);
      chosen: narrow_fr3_skip_when_held;
      not chosen: publish_but_keep_dragging, keep_unconditional;
      codex_consulted: true (harness entry , 2 turns);
      opus_escalation: no;
      key points: Focused(false) is keyboard-focus loss only and is not a valid basis for
      ending a drag; option A preserves the in-flight selection and anchor so only the
      completed selection is published at release; publish_but_keep_dragging's intermediate
      PRIMARY/CLIPBOARD write is observable by paste targets and clipboard history and cannot
      be retracted by a later overwrite, and it does not solve state retention when the
      release never arrives. Codex additionally warned that mouse_report_held is an
      event-derived record, not a physical-state query, so a stale true causes missed
      termination and a false one causes premature termination; it recommended keeping the
      selection-side press record separate from the report-side held record that clear_all
      zeroes.
  - question_id: edge-case.release-never-arrives
    packet_id: create-spec-q0001
    answered_at: "2026-09-20T16:51:45+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [rely_on_release_only]
    freeform: null
    normalized_answer: "Add no extra terminator; the release path's no-owner drag_in_flight fallback is the terminator. The residual lost-release leak is recorded as a follow-up task rather than closed by an event-derived check."
    resolution_note: >-
      gate: create-spec.requirement-clarification (policy action codex_consultation);
      chosen: rely_on_release_only;
      not chosen: terminate_on_focus_regain, terminate_on_unheld_motion;
      codex_consulted: true (harness entry , 2 turns) -> Codex returned NO_MAPPING;
      opus_escalation: yes (one dispatch for this packet);
      escalation reasoning: mouse_report::clear_all zeroes mouse_report_held inside the same
      Focused(false) arm and winit synthesizes no press on focus regain or motion, so
      "left observed NOT held" reads false regardless of physical state -- both
      terminate_on_focus_regain and terminate_on_unheld_motion would degrade to unconditional
      termination and reintroduce the original bug, merely deferred. A separate
      selection-side press record makes the guard meaningful but vacuous on the target path,
      because a missed release leaves it held forever. The blast radius of relying on the
      release path is bounded and self-healing: decide_release's no-owner fallback fires on
      the next complete left click, so the degradation (no resize-hint / link-hover refresh,
      sticky selection extension) recovers with one click. Zero new state, smallest diff,
      strictly reversible. SPEC Objective 2 is satisfied in the sense the narrowing assumes:
      the release path IS the terminator; the residual is a platform-level guarantee gap.
      follow_up: file a separate task for a non-event-derived terminator that probes the real
      physical button state on Focused(true) (X11 XQueryPointer / Wayland equivalent) and
      clears host.dragging when the left button is genuinely up.
  - question_id: testing.window-free-termination-predicate
    packet_id: create-spec-q0001
    answered_at: "2026-09-20T16:51:45+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [extract_pure_predicate]
    freeform: null
    normalized_answer: "Extract the termination decision as a pure, winit-free predicate over plain bools, cover its truth table with bare #[test], and extend the existing source-text structural assertion to the new composed form."
    resolution_note: >-
      gate: create-spec.requirement-clarification (policy action codex_consultation);
      chosen: extract_pure_predicate;
      not chosen: structural_source_test_only;
      codex_consulted: true (harness entry , 2 turns);
      opus_escalation: no;
      key points: a pure-predicate truth table pins the held x drag_in_flight decision
      behaviourally, which the source-text assertion alone cannot do (the existing structural
      test does not detect whether the arm is conditional); the structural test is still
      updated so it confirms the predicate is the thing the Focused(false) arm uses.
