goal: |
  マウスレポート: フォーカス喪失がまだ生きている左ドラッグを途中で打ち切る

  ## 現象 (必須)
  キーボードフォーカスを失っただけで、まだ物理的に続いている左ドラッグが途中で打ち切られる。
  winit の `WindowEvent::Focused(false)` は「キーボードフォーカス喪失」であって、ポインタの implicit grab は維持される。左ボタンが押されたままなら `PointerMoved` も `PointerButton(Released)` もこのウィンドウに届き続ける。
  にもかかわらず `src-tauri/src/window_host/event_loop.rs:253-255` の arm は `local_drag_in_flight` が真なら無条件で `publish_local_drag` を実行し、`host.dragging = false` にして pending anchor を取り上げる。結果:
  1. その時点までの**部分選択**が PRIMARY に書き込まれる（`copy_on_select` が有効なら CLIPBOARD にも）
  2. `handle_pointer_moved` の `if host.dragging` ガードにより、フォーカスが戻ってボタンを押したままでも選択が伸びなくなる
  3. 後から届く release は gesture slot が `mouse_report::clear_all` で消され `drag_in_flight` も偽になっているため `Disposition::Nothing` になり、ドラッグが静かに切り捨てられる
  本アプリでは PTY 出力由来の OSC で子 WebView（markdown / data viewer）が非同期に開いてフォーカスを奪うため、ドラッグ中のフォーカス喪失は現実に到達しうる経路。

  ## 再現手順 (必須)
  1. PR #72 マージ後の eMterm を起動する
  2. グリッド上で左ボタンを押したままドラッグして選択を始める
  3. ボタンを離さないまま、別ウィンドウにフォーカスを移す（または PTY 出力で子 WebView を開かせる）
  4. 元のウィンドウへフォーカスを戻し、押したままのポインタを動かす
  選択が伸びない。PRIMARY にはフォーカス喪失時点の部分選択だけが入っている。

  ## 期待する挙動 (必須)
  release がもう来ないケースだけを、この arm が終端する。release が届くケースは、今回同時に入った `decide_release` の no-owner フォールバック（`drag_in_flight` が真なら `CompleteSelectionAndPublishToPrimary`）が既にカバーしている。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（フォーカス喪失時に左が押下中なら終端しないこと、押下中でなければ従来どおり終端すること）
  - [ ] FR3 が無条件終端を意図していたのかを SPEC 側で確認し、意図どおりなら仕様の側を明示する

  ## 該当箇所 (任意)
  - `src-tauri/src/window_host/event_loop.rs:253` — `Focused(false)` の arm
  - `src-tauri/src/window_host/pointer_routing.rs:392` — `publish_local_drag`

  ## 対応案
  `mouse_report::clear_all` より前（held 記録がまだ生きているうち）に左ボタンの物理状態を見て、押されたままなら release 経路の `drag_in_flight` フォールバックへ終端を任せる。例:
  `if !host.mouse_report_held.left && local_drag_in_flight(host, &self.app)`
  `host.mouse_report_held` は同 arm の 264 行目で既に触っているのでアクセス可能。
  代案として、publish はするが `host.dragging` は落とさずフォーカス復帰後もドラッグを継続させる形もある。その場合は release 時に完全な選択で再 publish される点を許容する設計判断が要る。

  ## 実害・発生条件 (任意)
  レビュー round 1 の未解決 medium `f8102391ba47175c`（comprehensive 観点、confidence 60）。auto-fix ゲートが critical / high 限定のためスキップされた。
  FR3 がこの無条件終端を明示要求している可能性が残るため、修正前に仕様側の意図確認が要る。
