    - closed_set_text_anchor
    freeform: null
    normalized_answer: Split the four benign edits by tokenizer visibility. Class B (trailing comma, statement
      reorder) is reproduced at token level via find_calls / split_arg_spans / splice_tokens. Class A
      (re-wrap, comment insertion) stays a source-TEXT edit whose site is located structurally by a two-stage
      anchor - first the enclosing function name, then the callee name after it, then a paren-depth scan
      for the call's byte span - and the edited source is built by SLICING the original bytes so the argument
      text is carried through verbatim and never re-typed. No span-carrying tokenizer is added to the
      scan module.
