- question_id: requirement.class-n-benign-edit-coverage
  packet_id: benign-edit-test-token-rewrite-q0001
  answered_at: '2026-09-22T02:50:39+09:00'
  source: codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - closed_set_text_anchor
  freeform: null
  normalized_answer: Two-stage closed-set text anchor for Class A; token-level splice for Class B.
  resolution_note: "gate: create-spec.requirement-clarification\nbatch policy action: codex_consultation,\
    \ record_as_assumption: true\ncodex_consulted: true (two rounds, via scripts/run_codex_exec.sh readonly)\n\
    opus_escalation: not run (Codex reached a decision)\n\nOptions offered: closed_set_text_anchor (CHOSEN)\
    \ / span_carrying_tokenizer /\ndrop_class_n.\n\nRound 1 framed the choice as D1 pure-token / D2 span-carrying\
    \ tokenizer /\nD3 reconstruct-the-call-text-from-closed-set-names. Codex recommended D2 and\nrejected\
    \ D3, because reconstructing the call text from closed-set names alone\ncannot reproduce the real\
    \ argument text or its whitespace. Round 1 also had\nCodex confirm from the source that the Tok enum\
    \ is Ident|Punct|Literal with no\nbyte spans, and that the Literal variant discards its content, so\
    \ a token vector\ncannot be rendered back into source text.\n\nRound 2 re-put the decision with the\
    \ ACTUAL option 1, which round 1 had\nmis-framed: the real proposal SLICES the original bytes, carrying\
    \ the argument\ntext through verbatim, rather than reconstructing them. Codex's D3 objection\ntherefore\
    \ did not apply to it. Codex reversed its recommendation to option 1,\nand independently verified\
    \ the new fact the analyst had surfaced: the production\nfile holds exactly two occurrences of the\
    \ callee path (the motion path at line\n293, and the target at line 850 inside the enclosing function\
    \ that begins at\nline 793), so a single-stage text anchor would bind to the wrong call.\n\nCodex's\
    \ comparative judgement: option 1's edit routine needs no argument count,\nno existing indentation\
    \ width and no receiver identifier, so it introduces no\ncoupling outside the closed set. Option 2\
    \ would have to convert Vec<char>\nindices into UTF-8 byte offsets and map body-relative token indices\
    \ back into\nthe original token vector, adding shared-code maintenance burden for the sake of\na single\
    \ test, against a scan module whose own SPEC excludes building a\ngeneral-purpose Rust parser.\n\n\
    Refinement Codex added: searching for the fully-qualified callee path couples to\nthe module segment\
    \ as well; anchoring on the bare function-name segment avoids\nthat extra name. Noted in response\
    \ that the existing callee constant already\ncarries the module prefix, so this is a refinement of\
    \ existing practice rather\nthan a defect introduced by either option.\n\nRisks Codex accepted, carried\
    \ forward into this feature's edge cases:\n(1) inserting a block comment between the fn keyword and\
    \ the function name\n    defeats option 1's function-name anchor, where option 2 would survive it;\n\
    (2) a block comment containing an unbalanced close-paren inside the argument\n    list defeats a naive\
    \ paren-depth scan;\n(3) the three assertions (text changed / token stream unchanged / judgment still\n\
    \    Ok) do not by themselves prove the edit landed at the intended call site, so\n    the located\
    \ span must additionally be checked to have the expected\n    callee-path-plus-N-arguments token shape.\n\
    \nRationale for adopting: option 1 keeps every benign edit in the merged SPEC's\nAC-5 covered against\
    \ the real embedded source, binds only to closed-set names,\nrequires no new scan API, and is the\
    \ better cost/benefit for test-only code.\n"
