  - question_id: requirement.class-n-benign-edit-coverage
    packet_id: benign-edit-test-token-rewrite-q0001
    answered_at: "2026-09-22T02:50:39+09:00"
    source: codex-consultation
    answer_mode: single_select
    selected_option_ids: [closed_set_text_anchor]
    freeform: null
    normalized_answer: "Two-stage closed-set text anchor for Class A; token-level splice for Class B."
    resolution_note: |
      gate: create-spec.requirement-clarification
      batch policy action: codex_consultation, record_as_assumption: true
      codex_consulted: true (two rounds, via scripts/run_codex_exec.sh readonly)
      opus_escalation: not run (Codex reached a decision)

      Options offered: closed_set_text_anchor (CHOSEN) / span_carrying_tokenizer /
      drop_class_n.

      Round 1 framed the choice as D1 pure-token / D2 span-carrying tokenizer /
      D3 reconstruct-the-call-text-from-closed-set-names. Codex recommended D2 and
      rejected D3, because reconstructing the call text from closed-set names alone
      cannot reproduce the real argument text or its whitespace. Round 1 also had
      Codex confirm from the source that the Tok enum is Ident|Punct|Literal with no
      byte spans, and that the Literal variant discards its content, so a token vector
      cannot be rendered back into source text.

      Round 2 re-put the decision with the ACTUAL option 1, which round 1 had
      mis-framed: the real proposal SLICES the original bytes, carrying the argument
      text through verbatim, rather than reconstructing them. Codex's D3 objection
      therefore did not apply to it. Codex reversed its recommendation to option 1,
      and independently verified the new fact the analyst had surfaced: the production
      file holds exactly two occurrences of the callee path (the motion path at line
      293, and the target at line 850 inside the enclosing function that begins at
      line 793), so a single-stage text anchor would bind to the wrong call.

      Codex's comparative judgement: option 1's edit routine needs no argument count,
      no existing indentation width and no receiver identifier, so it introduces no
      coupling outside the closed set. Option 2 would have to convert Vec<char>
      indices into UTF-8 byte offsets and map body-relative token indices back into
      the original token vector, adding shared-code maintenance burden for the sake of
      a single test, against a scan module whose own SPEC excludes building a
      general-purpose Rust parser.

      Refinement Codex added: searching for the fully-qualified callee path couples to
      the module segment as well; anchoring on the bare function-name segment avoids
      that extra name. Noted in response that the existing callee constant already
      carries the module prefix, so this is a refinement of existing practice rather
      than a defect introduced by either option.

      Risks Codex accepted, carried forward into this feature's edge cases:
      (1) inserting a block comment between the fn keyword and the function name
          defeats option 1's function-name anchor, where option 2 would survive it;
      (2) a block comment containing an unbalanced close-paren inside the argument
          list defeats a naive paren-depth scan;
      (3) the three assertions (text changed / token stream unchanged / judgment still
          Ok) do not by themselves prove the edit landed at the intended call site, so
          the located span must additionally be checked to have the expected
          callee-path-plus-N-arguments token shape.

      Rationale for adopting: option 1 keeps every benign edit in the merged SPEC's
      AC-5 covered against the real embedded source, binds only to closed-set names,
      requires no new scan API, and is the better cost/benefit for test-only code.
