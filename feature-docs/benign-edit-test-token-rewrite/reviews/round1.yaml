  file: src-tauri/src/window_host/tests.rs
  line: 6914
  title: count_top_level_args undercounts trailing literal arguments, weakening the FR4c mislocation guard
  description: '`anchor_scan::scan` (tests.rs:6914-6922) consumes numeric literals and (tests.rs:6885-6899)
    string literals without emitting any PosTok. `count_top_level_args` (tests.rs:7005-7026) counts depth-0
    commas and then adds one final segment only when `seg_start < end`. For `probe_call(a, b, c, d, 0)`
    the token range is `a , b , c , d ,` — 4 commas, and `seg_start` lands exactly on `close_idx`, so
    `seg_start < end` is false and the count is reported as 4. A 5-argument call therefore satisfies an
    `expected_arg_count` of 4 and `locate_call` returns Ok. The same holds for a trailing plain-string
    argument, and `probe_call(0, 1, 2, 3)` is counted as 3. This degrades the token-shape check that SPEC
    FR4c / AC-6 exists to provide: a future refactor that appends a literal-valued argument to the held-aware
    call would slip past the guard the feature was written to add. No production impact — the routine
    is `#[cfg(test)]`-gated and the real call site (`pointer_routing.rs:850`) passes four identifier/expression
    arguments, so the guard is correct today.'
  suggestion: Emit an opaque positional PosTok for numeric and string literals (kind irrelevant, only
    the position matters for counting) so every argument contributes at least one token, and add a negative
    test asserting that `probe_call(a, b, c, d, 0)` is rejected when 4 arguments are expected.
  sources:
  - codex:comprehensive
  confidence: 85
  resolution: unresolved
  resolution_reason: medium severity — outside Phase R4's critical/high auto-fix candidate gate. Filed
    as a follow-up task; see the run report.
