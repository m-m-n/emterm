    file: src-tauri/src/notifications.rs
    line: 372
    title: "エージェント通知本文がタブタイトルを未サニタイズのまま OS 通知へ渡す（本変更で到達経路が拡大）"
    description: >
      agent_notification_body は tab_title を format! でそのまま埋め込み、
      notify_rust::Notification::body 経由で D-Bus に送出する。タブタイトルは子プロセスが
      OSC 0/2 で任意に設定できる非信頼入力で、姉妹経路のタブアクティビティ通知が
      sanitize_title を必ず通しているのに対し、エージェント通知経路だけがこれを欠く。
      body-markup 対応の通知サーバでは限定 HTML として解釈され得るほか、長さ上限も無い。
      欠落自体は task0009 由来の既存問題で本 diff が作り込んだものではないが、本 diff は
      可視ペイン抑止を既定 ON で外したため到達条件が実質的に広がっている。
    suggestion: >
      agent_notification_body の中で既存の sanitize_title を通す（両呼び出し元を一箇所で塞げる
      choke point）。CSI/制御文字入りタイトルが本文に残らないことを固定する単体テストを
      notifications::tests に追加する。
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
    resolution_reason: >
      severity が medium のため Phase R4 の auto-fix 候補ゲート（critical/high のみ）に
      該当せず、このラウンドでは修正していない。既存欠落の切り出し修正として別タスク化が妥当
  - stable_id: 4f3d5c66b7ca025e
    severity: medium
    category: performance
    file: src-tauri/src/app/agent_status.rs
    line: 191
    title: "可視ペイン通知の解禁で、同期 D-Bus 呼び出しがフォーカス中フレームのイベントループを塞ぐ"
    description: >
      App::notify → NotifyRustSink::send → notify_rust::Notification::show() は Linux で
      同期 D-Bus RPC を呼び出しスレッドで実行し、この経路は winit イベントループの
      about_to_wait から走る。可視ペイン通知を既定 ON にしたことで、ユーザーが操作中の
      フレームでも同期ラウンドトリップが発生するようになった。発火頻度はペインあたり
      30 秒の rate limit で上限が付くため critical/high ではないが、hot path の
      ブロッキング I/O として修正価値がある。
    suggestion: >
      NotifyRustSink::send を専用ワーカースレッド + bounded channel で非同期化する
      （チャネル満杯時は drop — 既存の「抑止された通知は捨てる」方針と一致）。
      NotificationSink トレイト境界を変えずに済み、TestSink を使う既存テストにも影響しない。
    sources: [claude:performance]
    confidence: 60
    resolution: unresolved
    resolution_reason: >
      severity が medium のため Phase R4 の auto-fix 候補ゲートに該当せず、このラウンドでは
      修正していない。通知経路の非同期化は本 feature のスコープ外の構造変更
