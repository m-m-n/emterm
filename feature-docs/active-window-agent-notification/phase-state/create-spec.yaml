    normalized_answer: >
      Agent セクションに「表示中のペインでも通知する」トグルを 1 つ追加し、既存 3 トグルと同じ
      renderToggle / serde パターンで実装する
    resolution_note: >
      gate create-spec.requirement-clarification は batch-policies.yaml で codex_consultation。
      Codex 相談 1 ターンで new-toggle を提示し、既存 option_id に一致したため採用。
      record_as_assumption: true のため assumption として SPEC に記録する
