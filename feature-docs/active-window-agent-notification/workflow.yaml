      - src-tauri/web-shared/styles/status-bar.css
      - src-tauri/web-shared/styles/data-viewer.css
  components:
    rust:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: ""
      e2e_test_command: ""
    app_settings:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path crates/app_settings/Cargo.toml --lib"
      format_command: ""
      e2e_test_command: ""
    typescript:
      language: typescript
      build_command: "bun run build:viewer && bun run build:settings"
      test_command: "bun test"
      format_command: ""
      e2e_test_command: ""
    typescript_types:
      language: typescript
      build_command: ""
      test_command: "bun run typecheck"
      format_command: ""
      e2e_test_command: ""

