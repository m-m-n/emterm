project:
  license: MIT
  design_system:
    kind: project_native
    paths:
      - doc/UI-DESIGN-GUIDELINES.yaml
      - src-tauri/web-shared/styles.css
      - src-tauri/web-shared/components/md3-select.css
      - src-tauri/web-shared/components/md3-select.ts
      - src-tauri/web-shared/settings/ui-theme-presets.ts
