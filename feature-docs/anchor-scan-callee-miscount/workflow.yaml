goal: |
  # anchor_scan: locate_call の一意性チェックが生識別子 r#callee と数値リテラル内の callee を数え落とし、呼び出しが 2 つでも Ok を返す

  ## 現象 (必須)
  `src-tauri/src/window_host/tests.rs` のテスト専用モジュール `anchor_scan` で、`locate_call` の step 2（呼び出しの一意性チェック）が callee の呼び出しを数え落とす経路が 2 つ残っている。呼び出しが 2 つある本体でも hits が 1 件になり、`locate_call` が `Err` ではなく `Ok` を返す。「誤った範囲を成功として返さない」という不変条件（anchor-scan-false-success の SPEC FR4）の残り経路。
  ### 1. 生識別子の callee を数えない
  生識別子の分岐は `r#` 接頭辞込みのテキスト（例: `r#probe_call`）を `Kind::Ident` として持つ。step 2 は `ident_text(&toks[j]) == Some(callee_last_segment)` の完全一致で呼び出しを探すため、`r#probe_call(...)` を `probe_call` の呼び出しとして数えない。Rust では両者は同じ名前。anchor-scan-false-success の変更前は `r` / `#` / `probe_call` が別トークンだったため hits が 2 件になり `Err` だった。この変更で `Err` から `Ok` に変わった入力。
  ### 2. 数値リテラル走査が `.` の後ろの識別子を飲み込む
  数値リテラル走査は ASCII 数字から始まり、英数字・`_`・`.` が続くかぎりを 1 個の不透明トークンにする。`0..probe_call(k)` の `0..probe_call` や `self.0.probe_call(x)` の `0.probe_call` が 1 個のリテラルになり、callee の識別子トークンが消える。こちらは変更前からある経路。
  ## 再現手順 (必須)
  1. `anchor_scan::locate_call` に、本体が `r#probe_call(w, x, y, z); probe_call(a, b, c, d);` の関数を 4 引数期待で通す
  2. `Err` ではなく `Ok` が返ることを確認する
  3. 同様に本体が `let r = 0..probe_call(k); probe_call(a, b, c, d);` の関数を通すと `Ok` が返ることを確認する
  ## 期待する挙動 (必須)
  どちらの本体でも `locate_call` が `Err` を返す。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `r#probe_call(...)` と `probe_call(...)` を両方含む本体で `Err` を期待する負のテストがある
  - [ ] `0..probe_call(k)` と `probe_call(a, b, c, d)` を両方含む本体で `Err` を期待する負のテストがある
  - [ ] 既存の良性編集テストと anchor_scan の負のテストが緑のまま
  ## 該当箇所 (任意)
  - `src-tauri/src/window_host/tests.rs:7117-7134` — 生識別子の分岐
  - `src-tauri/src/window_host/tests.rs:7434` — `locate_call` step 2 の名前比較
  - `src-tauri/src/window_host/tests.rs:7196-7209` — 数値リテラルの走査
  - 行番号は `em-workflow/anchor-scan-false-success/integration` ブランチ時点
  修正案:
  - 1 は、名前を比較する前に `r#` 接頭辞を取り除く（`ident_text` が `r#` を除いた名前を返す、または step 1 / step 2 で比較前に `strip_prefix("r#")` を適用する）
  - 2 は、`.` の直後が `.` または識別子開始文字のときに数値リテラルの走査を止める（`1.5` や `1.0f32` は続け、`0..x` や `0.method` はそこで区切る）。あるいは数値リテラルの中に `.` と英字が続いたら `Err` にする
  ## 実害・発生条件 (任意)
  現在は未発現。`anchor_scan` は `#[cfg(test)]` 下で本番コードは通らない。実際の呼び出し側 `pointer_routing.rs` に生識別子は無く、`0..capped` の `capped` は callee ではない。
