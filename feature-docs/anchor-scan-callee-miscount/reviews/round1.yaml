findings:
  - stable_id: 2504a44086ff5f89
    severity: medium
    category: comprehensive
    file: src-tauri/src/window_host/tests.rs
    line: 7379
    title: "The turbofish balancing walk treats a `>` inside a const-generic block as the list's closing `>`, so a body with two calls can still return a false Ok"
    description: "`find_balancing_angle_close` (7375-7390) counts every `<` / `>` punctuation token, including ones nested inside `{...}` / `[...]` within the generic-argument list. (1) False success: in `probe_call::<{ 1 > 0 }>(w, x, y, z); probe_call(a, b, c, d);`, the walk stops at the `>` inside the const block; the token after it is `0`, not `(`, so the turbofish call is not counted, step 2 finds exactly 1 hit and `locate_call` returns Ok with the plain call's range. The same happens with `{ N >> 1 }` or `[u8; 1 << 2]`. (2) False rejection: `let f = probe_call::<{ 1 > (0) }>; probe_call(a, b, c, d);` counts the non-call reference as a turbofish call and returns Err (fails closed). The `->` form is explicitly Out of Scope in tasks/task0001.md; the const-block and array-length forms are not listed there."
    suggestion: "In `find_balancing_angle_close`, track a nesting depth for `(` / `[` / `{` and adjust the angle depth only for `<` / `>` at nesting depth 0. Add an `anchor_locate_call_*` test expecting Err for `probe_call::<{ 1 > 0 }>(w, x, y, z); probe_call(a, b, c, d);` and one expecting Ok with `a, b, c, d` for `let f = probe_call::<{ 1 > (0) }>; probe_call(a, b, c, d);`."
    sources: ["codex:comprehensive"]
    confidence: 85
    resolution: deferred
    resolution_reason: "medium severity is outside the Phase R4 auto-fix candidate gate (critical/high only); filed as a follow-up task"
