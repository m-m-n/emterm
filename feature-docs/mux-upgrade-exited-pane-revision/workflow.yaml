goal: '# mux hot-upgrade: 終了済みペインの OSC 7501 記録だけが更新され、更新番号が古いまま引き継がれる


  種別: バグ

  Notion: https://www.notion.so/3f53509ec8ee81ba8d3bc86c0d1e48a5


  ## 現象 (必須)

  mux hot-upgrade の `refresh_live_agent_state` は、終了済みペイン（master_fd なし、または exited）について OSC 7501 の program_records だけを書き直し、agent_state・agent_name・agent_revision はスナップショット時点の値のまま残す。スナップショット後に報告が適用されると、新しい記録と古い更新番号が並んで引き継がれる。古い番号が 0 なら復元後の再同期で記録が GUI に届かず、0 より大きい場合も after_revision を指定した待機が満たされないことがある。

  em-workflow osc7501-program-status の review round 1 で medium として残った指摘（stable_id 1eaacd07af1745fb）。コードは統合ブランチ `em-workflow/osc7501-program-status/integration` 上にある。

  ## 再現手順 (必須)

  1. 更新番号 0 の管理中ペインをスナップショットする

  2. OSC 7501 の error 報告を適用して番号を 1 にした後、ペインを終了させて refresh_live_agent_state を実行する

  3. 復元される記録は error だが更新番号は 0 のまま

  ## 期待する挙動 (必須)

  終了状態にかかわらず、記録・OSC 777 の状態と名前・更新番号を同じ agent_status ロック内で取得して引き継ぐ。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある（実際の報告の適用を挟んだ引き継ぎと再同期）

  ## 該当箇所 (任意)

  - `src-tauri/src/mux/upgrade.rs:466`

  ## 実害・発生条件 (任意)

  hot-upgrade 中に終了済みペインへ最後の報告が届いたときだけ起きる。


  Once the implementation is finished, push the integration branch to the remote and create a Pull Request against base_branch with gh pr create. Keep the integration branch both locally and on the remote (do not auto-merge it into base_branch).

  Consult Codex on any unclear points and adopt the option judged to be comparatively better.

  Record the content of that discussion in Notion.

  '
