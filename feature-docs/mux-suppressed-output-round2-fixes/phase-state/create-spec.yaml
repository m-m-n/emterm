    freeform: FR6 の重複排除の単位と配送順序を明記する
    normalized_answer: FR6 で書き込みフィルタから完結列を渡すときは、元チャンク上の位置も渡す。重複排除は『保持窓による同じ列の再検出』だけを除き、同じ内容の別々の起動は消さない。代替画面区間の問い合わせ・起動列との順序は元のストリームの順を保つ。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation,
