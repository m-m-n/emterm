        reason: >-
          Typed "Manual" in VERIFICATION.md; SC-B itself designates TS-9 as
          user-executed. Requires a human at a real terminal window (PRIMARY
          selection, middle-click paste, link hover, resize cursor). Carried to
          the human reviewer in the PR body rather than recorded as a failure —
          recorded as batch-audit-0004.
