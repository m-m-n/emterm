          note: "3446 passed; 0 failed; 3 ignored."
      format:
        result: skipped
        note: >-
          workflow.yaml declares format_command: "" — no format gate is
          configured for this workflow. Measured separately: the crate-wide
          cargo fmt --check reports 57 hunks, most in files byte-identical to
          main, so main itself does not pass that gate. Running it would
          attribute pre-existing repo-wide drift to this feature. Recorded as
