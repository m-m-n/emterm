    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: 0959c36ecec36857429f01c2e6bc22ae83099bc8
  - id: design
    artifacts: [DESIGN.md, design/]
    status: skipped
    skipped_reason: >-
      No user-visible surface changes. The repair is confined to pointer-state bookkeeping in three GU
      I-internal Rust modules; it introduces no new UI element, no new design token, no layout, copy,
      colour or interaction-affordance change. The only observable difference is the restoration of be
      haviour the base code already had. doc/UI-DESIGN-GUIDELINES.yaml and its two mirrors are untouch
      ed, so the design-system drift tests in ui::dialog::tests are unaffected.
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: pending
  - id: implement
    status: pending
    base_commit: null
