schema_version: 1
feature: mouse-report-reset-active-gesture
created: 2026-09-20
base_branch: main
goal: |
  --batch --once --pr https://www.notion.so/3e03509ec8ee81e88c3bf708727c41bf

  Once the implementation is finished, push the integration branch to the remote and create a Pull Request against base_branch with gh pr create. Keep the integration branch both locally and on the remote (do not auto-merge it into base_branch).
  Consult Codex on any unclear points and adopt the option judged to be comparatively better.
  Record the content of that discussion in Notion.

parent_branch: em-workflow/mouse-report-reset-active-gesture/integration

project:
  license: MIT
  design_system:
    kind: project_native
    paths:
      - doc/UI-DESIGN-GUIDELINES.yaml
      - src-tauri/src/ui/md3.rs
      - src-tauri/web-shared/styles.css
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1"
      format_command: ""
      e2e_test_command: ""

workflow:
