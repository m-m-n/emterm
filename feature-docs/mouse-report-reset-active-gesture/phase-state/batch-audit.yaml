    resolution_note: >-
      TS-9 は VERIFICATION.md 上で type=Manual と宣言され、同文書の SC-B 自身が "TS-9 is user-executed" と書いている。TS-9a..TS-9f は実ウィンドウ上の PRIMARY 選択・middle-click 貼り付け・link hover・resize カーソルを人間が確かめる項目で、無人実行では 原理的に実行できない。B はどの実装タスクでも解消できない失敗を記録することになり、rework が既レビュー済みコードを非欠陥に対して書き換えて無人サイクルを浪費する。C はゲート時点でのスコープ拡大で、レビュー後に未レビューのテストコードを足すうえ、headless では PRIMARY vs CLIPBOARD の区別も hover も正直には代替できない。自動側の証拠（両 feature 構成の cargo check 緑、--test-threads=1 で 3446 件全通過、reset カーブアウト / 無条件左解放ターミネータ / focus-loss 真理値表 / decide_* 純粋性 / 構造 delegate アサーションを覆う新規テスト 13 件）は TS-1..TS-8 と TS-10..TS-14 を満たす。よって pass とし、TS-9a..TS-9f 全 6 項目を PR 本文と実行レポートに未実行残件として明記する。
      なお Codex 本体は usage limit、LiteLLM フォールバックは全モデル 429 で
      相談ターンを 1 度も実行できなかったため、question-resolution.md の
      Codex consultation procedure に従い Opus エスカレーションが Codex の
      代わりに 1 回だけ走り、この判断を返した。option_id へのマッピング判断は
      オーケストレーター側で行っている。
    outcome: adopted
