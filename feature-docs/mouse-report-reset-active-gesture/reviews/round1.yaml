findings:
  - stable_id: 592613773b46218d
    severity: medium
    category: architecture
    file: src-tauri/src/window_host/mouse_report.rs
    line: 1078
    title: "SC-11 apply seam split into two entry points; the legacy one is production-dead, unguarded, and encodes the pre-fix behaviour"
    description: >-
      The SC-11 apply seam now has two entry points, apply_outcome (mouse_report.rs:1078) and
      apply_outcome_with_held. apply_outcome has zero production callers - the three sites in
      pointer_routing.rs (294 / 721 / 983) all moved to apply_outcome_with_held (verified by
      the orchestrator via grep), leaving only the ~30 call sites inside mouse_report.rs's own
      test module. That apply_outcome passes a fixed HeldButtons::default() (no button held),
      which reduces the new exclusion logic to clear_all - the pre-fix ghost-drag behaviour this
      task repaired. The ~30 existing reset tests therefore assert the semantics of a path
      production no longer takes, and a future production caller reaching for the shorter name
      would silently reintroduce the bug. The structural guard
      pointer_routing_handlers_hold_no_decision_only_delegate_to_the_seam (tests.rs:1782-1798)
      only swapped its needle to the new name and does not forbid the old one. Contract drift
      also noted - apply_outcome_with_held's doc describes held as the value at event arrival,
      but for a release pointer_routing.rs:524-532 clears the button before run_button_decision;
      and mod.rs:491's doc still names apply_outcome.
    suggestion: >-
      Either (a) fix structurally - add held to ButtonEventInputs / WheelEventInputs and replace
      RecordUpdates' two bools with a decided scope (e.g. reset: Option<GestureResetScope> with
      All / Unheld(HeldButtons)), so the decision layer owns the reset scope, apply collapses
      back to a single apply_outcome, and the existing ~30 tests cover the production path; or
      (b) minimally - delete apply_outcome and repoint the test callers (or move it behind
      #[cfg(test)]), and if it stays, add "mouse_report::apply_outcome(" to the forbidden array
      at tests.rs:1769-1781 so no production caller can return to the clear-all default. Also
      update mod.rs:491's doc and apply_outcome_with_held's held description.
    sources: [claude:architecture]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity; below the auto-fix candidate gate (critical/high only)"
