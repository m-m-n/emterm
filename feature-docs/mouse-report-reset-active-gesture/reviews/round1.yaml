findings:
  - stable_id: 90789b40eb78ad7f
    severity: medium
    category: comprehensive
    file: src-tauri/src/window_host/pointer_routing.rs
    line: 121
    title: "Focus-loss path clears local_drag but leaves held_buttons populated"
    description: >-
      on_focus_lost() calls state.clear_local_drag() but does not clear held_buttons.
      If focus is lost while a button is physically down and the release happens while
      unfocused, that button stays in held_buttons indefinitely: note_press for the same
      button is a no-op on an already-present entry, and reset_for_mode_change retains
      active records whose button is in held_buttons. After focus loss with a swallowed
      release, a subsequent mode change would preserve an active gesture record whose
      button is no longer held - exactly what FR1/FR6 aim to prevent. Outside the SPEC's
      explicit scope (FR3 mandates only clearing the local drag on focus loss) and no test
      covers it (TS-4/TS-9 assert only the local_drag side), so it is a gap, not a contradiction.
    suggestion: >-
      Prune held_buttons in the same focus-loss path that clears local_drag - the window
      cannot observe releases while unfocused, so the physical-hold set should not outlive
      focus. Add a clear_held_buttons() invoked from on_focus_lost, plus a test asserting
      that a mode change after focus loss drops an active record for a button whose release
      was swallowed.
    sources: [claude:comprehensive]
    confidence: 55
    resolution: unresolved
    resolution_reason: "medium severity; below the auto-fix candidate gate (critical/high only)"
  - stable_id: 96b080dbe73a42f1
    severity: medium
    category: architecture
    file: src-tauri/src/window_host/mouse_report.rs
    line: 198
    title: "PointerGestureState bundles physical hold set, report-mode records, and local drag in one struct"
    description: >-
      PointerGestureState owns held_buttons (physical truth, outlives any report mode),
      active (report-mode gesture records), and local_drag (only meaningful when no report
      mode owns the button). The three have different lifetimes and different writers:
      note_press/note_release mutate held_buttons and local_drag while decide_* reads active.
      The invariant that held_buttons is authoritative over active is enforced only by
      convention inside reset_for_mode_change's retain filter. A cohesion observation on a
      3-field struct in a single module with no cross-module coupling; it does not produce
      incorrect behaviour on any constructed path, and NFR1 (window-free decision layer) holds.
    suggestion: >-
      If this area grows further, consider extracting the physical hold set into its own small
      type that PointerGestureState composes, so the reset rule ("keep records whose button is
      still physically held") becomes a method on that type rather than an inline retain filter.
    sources: [claude:architecture]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity; below the auto-fix candidate gate (critical/high only)"
  - stable_id: 592613773b46218d
    severity: medium
    category: architecture
    file: src-tauri/src/window_host/mouse_report.rs
    line: 1078
    title: "SC-11 apply seam split into two entry points; the legacy one is production-dead, unguarded, and encodes the pre-fix behaviour"
    description: >-
      The SC-11 apply seam now has two entry points, apply_outcome and
      apply_outcome_with_held. apply_outcome has zero production callers - the three sites in
      pointer_routing.rs (294 / 721 / 983) all moved to apply_outcome_with_held, leaving only
      the ~30 call sites inside mouse_report.rs's own test module. That apply_outcome passes a
      fixed HeldButtons::default() (no button held), which reduces the new exclusion logic to
      clear_all - the pre-fix ghost-drag behaviour this task repaired. The ~30 existing reset
      tests therefore assert the semantics of a path production no longer takes, and a future
      production caller reaching for the shorter name would silently reintroduce the bug. The
      structural guard pointer_routing_handlers_hold_no_decision_only_delegate_to_the_seam
      (tests.rs:1782-1798) only swapped its needle to the new name and does not forbid the old
      one. Contract drift also noted: apply_outcome_with_held's doc describes held as the value
      at event arrival, but for a release pointer_routing.rs:524-532 clears the button before
      run_button_decision; and mod.rs:491's doc still names apply_outcome.
    suggestion: >-
      Either (a) fix structurally - add held to ButtonEventInputs / WheelEventInputs and replace
      RecordUpdates' two bools with a decided scope (e.g. reset: Option<GestureResetScope> with
      All / Unheld(HeldButtons)), so the decision layer owns the reset scope, apply collapses
      back to a single apply_outcome, and the existing ~30 tests cover the production path; or
      (b) minimally - delete apply_outcome and repoint the test callers (or move it behind
      #[cfg(test)]), and if it stays, add "mouse_report::apply_outcome(" to the forbidden array
      at tests.rs:1769-1781 so no production caller can return to the clear-all default. Also
      update mod.rs:491's doc and apply_outcome_with_held's held description.
    sources: [claude:architecture]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity; below the auto-fix candidate gate (critical/high only)"
  - stable_id: 79f4847088dad493
    severity: medium
    category: spec
    file: src-tauri/src/window_host/pointer_routing.rs
    line: 392
    title: "TS-4 の焦点喪失クリーンアップ検証が未実装（状態変更が window-free に切り出されていない）"
    description: >-
      SPEC の Test Scenarios TS-4 は、焦点喪失クリーンアップの入口を live な左ドラッグ付きで
      駆動し、dragging がクリアされること・pending anchor が消費されること・選択が publish される
      ことを assert するよう要求し、winit ウィンドウ無しで到達可能な形（NFR1）に切り出すことまで
      指定している。実装が切り出した window-free な部品は述語 drag_in_flight
      (pointer_routing.rs:365) だけで、状態変更側の publish_local_drag (pointer_routing.rs:392)
      は &mut WindowHost を取り host.set_primary / host.set_clipboard を呼ぶため、ウィンドウ無し
      では駆動できない。結果として TS-4 が名指しする 3 つのアサーションを検証するテストはツリー上に
      存在しない。FR3 / AC-3 に対して唯一存在する tests.rs:1912 の
      focus_loss_arm_never_calls_the_fold_click_toggle は include_str! に対する文字列検査であり、
      振る舞いを実行しない。そのため SPEC AC-9 の AC-3 分と Success Criteria の TS-4 分が実質未充足で、
      publish_local_drag 本体（アンカー消費順序・copy_on_select ミラー・selection 無しで何も書かない
      こと）がリグレッションに無防備。
    suggestion: >-
      TS-4 の条件どおり、状態変更の core を window-free なヘルパーに分離してテストする。例:
      take_local_drag_state(dragging: &mut bool, pending: &mut Option<Pos>) -> Option<Pos> を
      pointer_routing.rs に置き、publish_local_drag はそれを呼んだうえで PRIMARY / CLIPBOARD 書き込み
      だけを担当する形にする。そのうえで dragging == false / pending == None / 返り値が元の anchor を
      assert するユニットテストを追加する。PRIMARY publish 側も
      (selection.is_some(), copy_on_select, text.is_empty()) を取る純関数に切り出せば bare #[test] で
      網羅できる。既存のソーステキスト検査は fold-toggle 排他ガードとして残してよいが、TS-4 の代替とはしない。
    sources: [claude:spec]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity; the auto-fix candidate gate excludes category spec unconditionally"
evaluation:
  round_summary: >-
    Round 1 ran with every harness reviewer rate-limited: all three chain entries for
    comprehensive, both for security, all three for architecture, and all three for spec
    returned skip_reason rate_limited, so every one of the four perspectives was reviewed by
    its Claude fallback alone. That is a real coverage reduction for a cross_validation: true
    round - no independent model corroborated any finding, and the usual "two perspectives
    flagged the same site" confidence signal is unavailable by construction. The evaluator read
    the four changed source files and the SPEC directly rather than relying on the reviewer text.
    Of the three reviewer findings it received, it kept two and dropped one. The dropped finding
    (comprehensive#fallback, mouse_report.rs:253, "reset_for_mode_change drops held_buttons for
    non-active buttons") is factually wrong about the code: decide_release looks up the active
    record first and returns no report when there is none, so held_buttons membership alone never
    produces a report. It was dismissed as a misreading rather than listed in dismissed_sites,
    since dismissed_sites is for critical/high sites and this was medium. The two kept findings
    are both medium and both genuine but narrow. spec#fallback and security#fallback both
    returned clean at the time of evaluation. No injection attempts, no suspicious content in any
    reviewer output.
  recommended_action: "complete"
  action_rationale: >-
    Zero critical/high findings from any perspective, and the kept medium findings are a narrow
    uncovered edge case and a design-preference note - neither blocks the completion gate
    (residual_critical_high == 0). The honest caveat is coverage: every harness reviewer was
    rate-limited, so this round rests entirely on Claude fallbacks with no cross-model
    corroboration. If the rate limits clear, a second round would be worth running before merge.
