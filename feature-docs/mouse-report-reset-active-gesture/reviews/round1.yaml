  - stable_id: f8102391ba47175c
    severity: medium
    category: comprehensive
    file: src-tauri/src/window_host/event_loop.rs
    line: 253
    title: "focus-loss の drag 終端が、まだ生きているドラッグを途中で打ち切る"
    description: >-
      winit の WindowEvent::Focused(false) は「キーボードフォーカス喪失」であって、ポインタの
      implicit grab は維持されるため、左ボタンが物理的に押されたままなら PointerMoved も
      PointerButton(Released) もこのウィンドウに届き続ける。にもかかわらず event_loop.rs:253-255 の
      arm は local_drag_in_flight が真なら無条件で publish_local_drag を実行し、host.dragging = false
      にして pending anchor を取り上げる（オーケストレーターが該当行を読んで確認済み）。結果として
      (1) その時点までの部分選択が PRIMARY に、copy_on_select が有効なら CLIPBOARD にも書き込まれる、
      (2) handle_pointer_moved の if host.dragging ガードにより、フォーカスが戻ってボタンを押したままでも
      選択が伸びなくなる、(3) 後から届く release は gesture slot が mouse_report::clear_all で消され
      drag_in_flight も偽になっているため Disposition::Nothing になり、ドラッグが静かに切り捨てられる。
      本アプリでは PTY 出力由来の OSC で子 WebView（markdown / data viewer）が非同期に開いてフォーカスを
      奪うため、ドラッグ中のフォーカス喪失は現実に到達しうる経路。さらに今回同時に入った decide_release の
      no-owner フォールバック（drag_in_flight が真なら CompleteSelectionAndPublishToPrimary）が
      「release が届くケース」を既にカバーしているので、この arm が必要なのは release が本当に来ない
      ケースだけ。なお FR3 がこの無条件終端を明示要求している可能性は残るため、仕様側の意図確認が要る。
    suggestion: >-
      「release がもう来ない」ケースだけに絞るのが素直。mouse_report::clear_all より前（held 記録が
      まだ生きているうち）に左ボタンの物理状態を見て、押されたままなら release 経路の drag_in_flight
      フォールバックに終端を任せる - 例えば条件を
      `if !host.mouse_report_held.left && local_drag_in_flight(host, &self.app)` にする
      （host.mouse_report_held は同 arm の 264 行目で既に触っているのでアクセス可能）。代案として、
      publish はするが host.dragging は落とさない形にしてフォーカス復帰後もドラッグを継続させる手もあるが、
      その場合 release 時に完全な選択で再 publish される点を許容する設計判断が要る。
    sources: [claude:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity; below the auto-fix candidate gate (critical/high only)"
