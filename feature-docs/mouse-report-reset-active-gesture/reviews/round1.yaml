evaluator_low_items:
  note: >-
    Recorded for disclosure only. R3b step 2 drops any finding whose severity is not
    critical / high / medium, so this evaluator-origin item is not in `findings` and is not an
    auto-fix candidate. It is kept here so the human evaluator can see it.
  items:
    - file: src-tauri/src/window_host/mouse_report.rs
      line: 1109
      severity: low
      sources: [claude:evaluator]
      confidence: 62
      title: "A Report-owned slot preserved across a tracking-inactive reset can emit a release report if the application re-enables tracking mid-hold"
      description: >-
        clear_unheld() (mouse_report.rs:1109) preserves the gesture slot of any physically-held
        button on a !tracking_active reset, including a slot whose owner is GestureOwner::Report.
        Sequence: press Left while a tracking mode is on (slot = Report, press reported) -> the
        application turns tracking off -> any motion/wheel/press raises reset_tracking_inactive,
        which previously ran clear_all() and dropped the Report slot but now preserves it because
        Left is held -> the application turns tracking back on -> release Left. decide_release
        (mouse_report.rs:839) finds peek(Left) == Some(Report), re-checks tracking_active (now true)
        and emits release bytes. At the pre-task0001 revision the slot was gone by then, so the
        release decided Disposition::Nothing and no bytes were emitted. SPEC's edge-case list covers
        only the tracking-disabled-at-release variant, which still holds; the disable-then-re-enable
        variant is a behaviour delta against FR4's byte-for-byte invariance claim and is not covered
        by any test in task0001.tests.yaml. Impact is low - the emitted release matches a press the
        application genuinely saw, so the new behaviour is arguably the more correct one, and it
        requires the application to toggle DECSET 1000/1002/1003 off and on while a button is
        physically down.
      suggestion: >-
        Either accept this as an intentional (and arguably more correct) consequence of FR1 and
        record it as an edge case in the SPEC / VERIFICATION notes, or, if strict FR4 byte-for-byte
        invariance is required, restrict the held-button exclusion in clear_unheld() to
        GestureOwner::Local slots. No change is needed for correctness of the ghost-drag repair.
