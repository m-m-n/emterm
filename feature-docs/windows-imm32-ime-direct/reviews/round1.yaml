  - stable_id: keygate-diverges-during-held-detach
    severity: medium
    category: comprehensive
    file: src-tauri/src/ime/winit_bridge.rs
    line: 538
    title: "detach を hold している間、Windows のキー抑止ゲートだけが composition を「閉じた」と見なす"
    description: >-
      notify_focus(false) は ime_enabled を false にするが composition_alive は Ime::Disabled まで
      true のままで、Windows では flush が detach を hold するため IM サーバは接続されたまま・
      composition も生きたままになる。この状態で dispatch_key_event は
      should_suppress_key(has_preedit, ime_enabled=false, true) を評価して Passthrough を返すため、
      フォーカスが戻った直後の打鍵が IME 側と PTY の双方に流れる（名前付きキーの二重入力）。
      モジュールドキュメントが「受容された失敗モード」とする期間中ずっとゲートが開きっぱなしになる。
    suggestion: >-
      hold 中はキー抑止も維持する。key_gate_open(ime_enabled, composition_alive, pending_allow,
      windows_gate) 相当のヘルパを should_suppress_key と同じく windows_gate 実行時引数の形で切り出し、
      真理値表テストを付ける。非 Windows は hold_pending_detach が常に false なので現行挙動が保たれる。
    sources: [claude:comprehensive, claude:architecture]
    confidence: 80
    resolution: unresolved
    resolution_reason: "medium は auto-fix の severity ゲート未満。ラウンド 1・2 の両方で報告"
