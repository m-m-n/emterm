    file: src-tauri/src/ime/winit_bridge.rs
    line: 553
    title: "deferred detach が全ターゲットに適用され、X11 では解除条件が原理的に成立しない"
    description: >-
      flush の hold 判定 `!allowed && self.composition_alive` に cfg!(windows) 相当の
      ゲートが無く、X11 / Wayland にも無条件で適用されていた。winit-x11 0.31.0-beta.2 では
      Ime::Disabled を送出する経路が set_ime_allowed(window, false) -> remove_context ->
      create_context(false) しか無いため、保留中の Disable リクエストの結果としてしか
      Disabled が届かない。一方 composition_alive は初回 flush の set_ime_allowed(true) 由来の
      Ime::Enabled で true になり以後固定されるため、X11 ではフォーカス喪失時の detach が
      永久に配送されない。Wayland は TextInputEvent::Leave 由来の Disabled で解消するが
      X11 は解消しない。
    suggestion: >-
      hold 判定を純関数 hold_pending_detach(allowed, composition_alive, windows_gate) に
      切り出し、flush から cfg!(windows) を渡す。既存の should_suppress_key と同じ設計。
      非 Windows で detach が同一 flush で配送されることを固定する回帰テストを追加する。
    sources: [claude:comprehensive]
    confidence: 80
    resolution: fixed
    resolution_reason: "auto-applied loop 1 (commit b1e80c1c); round 2 の comprehensive / spec 双方が解消を確認"
