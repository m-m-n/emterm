    title: "新ルールは pristine 起動パスでは no-op — FR2 の真因を潰せていない可能性"
    description: >
      comprehensive レビューが3ラウンド連続で指摘: mux_sidebar_overlay_open を
      false にできる本番経路は user toggle (app.rs:3107) と detach ガード
      (app.rs:3990) の2箇所のみで、コンストラクタは無条件 true。真に一度も
      attach していない pristine 起動では、attach 時点で既に true のため
      None→Some ルールは値を変えない no-op になる、という指摘。
    suggestion: >
      (a) 実機ログで detach ガード発火の裏取りをする、(b) 裏取りできない場合は
      本ルールを reattach 専用として扱い FR2 は unresolved のまま残す。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: declined
    resolution_reason: >
      REQUIREMENTS.md/SPEC.md が「確定事実」として記録する2経路閉鎖性
      （mux_sidebar_overlay_open を false にできるのは user toggle と
      detach ガードの2箇所のみ）から、ユーザーが実際に false 状態を観測した
      （ctrl+s で表示された = 押す前は false だった）以上、detach ガードが
      最低1回発火していたことは論理的に必然。detach ガードの発火条件
      （active_mux_attached_prev_pump == Some(active) かつ現在 not-attached）
      は、その前に一度 attach が成立して bookkeeping が Some になっていた
      ことを要求する。したがって観測されたバグの前提そのものが
      「起動 → 一度 attach 成立 → detach ガード発火(flag=false) →
      再 attach(None→Some、今回の修正ルールが発火して flag=true)」という
      順序を必然的に含む。mux セッションは最終的に必ず attach 成立する
      （でなければアプリが使用不能）ため、この再 attach は必ず発生し、
      修正のルールは必ず発火する。reviewer が懸念する「一度も attach して
      いない pristine 起動での no-op」というシナリオは、バグが観測された
      という前提（false 状態の観測）と論理的に両立しない —
      そのシナリオでは flag は終始 true のままでバグ自体が発生しないため。
      よって FR2 の充足はこの2経路閉鎖性という確定事実から論理的に導出でき、
      別途の実機ログ裏取りを R4 の auto-fix ループで追加要求する必要はないと
      判断した。TS4（手動起動確認）は引き続き VERIFICATION.md の受け入れ
      ゲートとして残る。
