  title: 属性内のコメントで属性が未終了と判定され、以降の行の use 検査が止まる
  description: 'ac8_scan_attribute（1579-1609行）は、属性の中にあるコメント（`//`、`/* */`）の `[` や `"` も構文として数えてしまう。範囲外とした
    raw 文字列と文字リテラルの中の文字も同じ扱いになる。そのため、閉じている属性を開いたままと判定することがある。ac8_check_allowlist（1725-1728行）はその開いた状態を次の行へ持ち越す。閉じる
    `]` が来ない限り、以降のすべての行が Rule B（use ルートの検査）から外れる。例: `#[allow(dead_code /* [ */)]`、`struct X;`、`use winit::event::Event;`
    の3行は結果が空の Vec になる。変更前は3行目を winit 違反として1件報告していた。`/* [ */` を `/* " */` にしても in_string が持ち越されて同じように見逃す。現行の
    program_status.rs の属性はすべて同じ行で閉じるため、現在の ac8_the_module_uses_only_always_built_crates がすり抜けて合格しているわけではない。'
  suggestion: '属性の走査で、`//` から行末まで、および `/* */` の中を、括弧と引用符の判定から外す。さらに、ソースの末尾で open_attribute が残っている場合は違反として報告する。回帰テストを追加する:
    `#[allow(dead_code /* [ */)]\nstruct X;\nuse winit::event::Event;` と、引用符を使った版が winit 違反を返すこと。'
