schema_version: 1
feature: program-status-ac8-use-line-forms
created: '2026-10-11'
base_branch: main
goal: '# program_status の ac8 許可リスト検査で、複数属性・use 直後の :: / {・属性内の ]・複数行属性の use 行を検出する


  Notion: <redacted-notion-url>


  ## やりたいこと (必須)

  `program_status` の ac8 許可リスト検査（`src-tauri/src/program_status/tests.rs`）が use 行として認識しない残りの書き方を塞ぐ。

  ## 背景・なぜ (必須)

  em-workflow program-status-ac8-allowlist-gaps（PR https://github.com/m-m-n/emterm/pull/142 ）で、`pub (crate) use`・`use<TAB>`・`pub(..)use`・`use` だけの行・同じ行の先頭 `#[..]` 属性 1 個を塞いだ。次の形は task0001 でスコープ外としたため、まだ検出されない。

  1. 同じ行に先頭属性が複数ある形（`#[cfg(a)] #[allow(b)] use winit::...;`）

  2. `use` の直後に `::` や `{` が続く形（`use ::winit::...;`、`use {winit::event::Event};`）

  3. 属性内の文字列リテラルに `]` を含む形（`#[cfg(feature = "]")] use winit::...;`）

  4. 複数行にまたがる属性のあとに続く use 行

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 上の 4 形それぞれについて、ac8 検査が違反として拒否する自己テストがある

  - [ ] 既存の許可リスト・自己テストの期待は変わらない

  ## スコープ外 (任意)

  \<今回やらないこと。あれば\>

  ## 制約・前提 (任意)

  変更はテスト専用の検査（`src-tauri/src/program_status/tests.rs`）に限る。

  '
