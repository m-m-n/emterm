answers:
  requirement.test-threads-vs-literal-repro:
    packet_id: create-spec-q0001
    answered_at: "2026-09-22T13:16:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [classification_only]
    freeform: >-
      Codex (run_codex_exec.sh readonly) compared "add -- --test-threads=1 to the
      un-fetched scenario", "add it to every cargo-test scenario" and "do not add
      it, rely on the PASS-with-warning classification". It chose the third:
      worktree-font-bootstrap FR6 pins the literal reproduction command including
      its default parallelism, only scenario_unfetched runs `cargo test` at all
      (lines 252 / 307 run `cargo check`), and once executed>0 with a non-zero
      exit is a warning rather than a failure the known flakes can no longer turn
      the job red by themselves.
    normalized_answer: >-
      Keep the literal reproduction command unchanged. Do not add
      `-- --test-threads=1`. Flake absorption comes from the classification
      change (executed>0 + non-zero status = warning + PASS), not from changing
      the command.
    resolution_note: >-
      gate: create-spec.requirement-clarification; codex_consulted: true;
      Codex chose option C of three (no flag); mapped to the packet's
      `classification_only` option. Options not chosen: add_flag_and_document,
      add_flag_and_amend_prior_spec, rerun_serially_on_failure. Recorded as an
      assumption per batch-policies.yaml (record_as_assumption: true).
  requirement.prior-spec-amendment:
    packet_id: create-spec-q0001
    answered_at: "2026-09-22T13:17:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [no_prior_spec_edit]
    freeform: >-
      Codex (run_codex_exec.sh readonly) read feature-docs/worktree-font-bootstrap/SPEC.md
      and chose "leave the prior SPEC untouched": AC1 (line 447) already requires
      only a non-zero executed count and FR6 (line 133) already makes only
      non-execution a failure, so no wording there is wrong. The Declared Change
      Set section (line 350, with line 372 stating that not every declared path
      must change) does not oblige an edit. The actual inconsistency is in
      scripts/verify-font-bootstrap.sh:208, not in the prior SPEC.
    normalized_answer: >-
      Do not edit feature-docs/worktree-font-bootstrap/SPEC.md. Record the AC1/FR6
      reading in this feature's own SPEC and in the script's comments.
    resolution_note: >-
