goal: |
  Notion task 3e33509ec8ee816f980dcd0bf458fd2e —
  verify-font-bootstrap.sh の un-fetched 判定が「ビルド停止」と「テスト失敗」を区別せず CI が偽陽性で赤くなる

  ## 現象 (必須)
  `scripts/verify-font-bootstrap.sh` の un-fetched シナリオが、「ビルドスクリプトがビルドを止めた」場合と
  「テストは実行されたが一部が落ちた」場合を区別しない。判定が `status -ne 0` を
  `executed -eq 0` より先に見るため、`cargo test --lib` が実際に走って 1 件落ちただけ
  （status=101, executed>0）でも、`the build script stopped the build (exit $status), 0 tests executed`
  という事実と違う固定文言で FAIL する。
  SPEC (feature-docs/worktree-font-bootstrap/SPEC.md) の AC1 / FR6 が要求しているのは
  「実行テスト件数が非ゼロであること」であって全テストの成功ではないため、この gate は
  AC1 より厳しい方に逸脱している。
  さらに本プロジェクトは `cargo test --lib` を既定の並列度で回すと非決定的に落ちるテストを
  実際に抱えている（`src-tauri/src/tabs/` の replay 系、`src-tauri/src/tmux_sockets.rs` の
  `discover_returns_only_the_live_socket`）。そのため `.github/workflows/ci.yml` で新設した
  `verify-font-bootstrap` ジョブが font-bootstrap とは無関係な理由で間欠的に赤くなり、
  しかも原因がフォント取得だと誤って表示される。

  ## 再現手順 (必須)
  1. `verify-font-bootstrap` ジョブ、または `bash scripts/verify-font-bootstrap.sh` をローカルで実行する
  2. un-fetched シナリオの `cargo test --lib` で、並列実行由来のフレークが 1 件でも発生する状況を作る
  3. スクリプトが「ビルドが止まった／0 件実行」と報告して FAIL することを確認する
  （実際にはテストが実行されており、executed > 0 である）

  ## 期待する挙動 (必須)
  - `executed -eq 0` の判定を `status -ne 0` より先に置く
  - (a) executed=0 かつ status!=0 → 「ビルドが止まった」と報告
  - (b) executed>0 かつ status!=0 → 「テストは実行されたが失敗した」と報告し、AC1 に忠実にするなら
  un-fetched シナリオの PASS 条件は満たす扱いにする（別途 warning として出す）
  - 少なくとも `--test-threads=1` を付けて既知のフレーク源を潰す

  ## 完了の定義 (必須)
  - [ ] テスト実行済みの失敗とビルド停止が別の文言で報告される
  - [ ] 既知のフレークで `verify-font-bootstrap` ジョブが偽陽性で赤くならない
  - [ ] 再発を検出するテストが `test-docs/` 側にある

  ## 該当箇所 (任意)
  - `scripts/verify-font-bootstrap.sh` — un-fetched シナリオの判定順序（208 行付近）
  - `.github/workflows/ci.yml` — `verify-font-bootstrap` ジョブ
  - `feature-docs/worktree-font-bootstrap/SPEC.md` — AC1 / FR6

  ## 実害・発生条件 (任意)
  このタスクは worktree-font-bootstrap の PR がマージされた直後から効き始める。
  新設 CI ジョブが無関係な理由で間欠的に赤くなるため、PR マージ前の解消を推奨する。
  出典: em-workflow の worktree-font-bootstrap review round 1（stable_id: a7b9b3b29c8ec135、severity medium、
  Phase R4 の候補ゲートが critical/high 限定のため自動修正の対象外）。
  Codex 相談の結論（option A）により、この run 内では修正せず別タスクとして起票した。
