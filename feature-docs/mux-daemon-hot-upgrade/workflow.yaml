schema_version: 1
feature: mux-daemon-hot-upgrade
created: 2026-07-29
base_branch: main
parent_branch: em-workflow/mux-daemon-hot-upgrade/integration

project:
  license: MIT
  components:
    main:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib"
      format_command: ""
      e2e_test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --test mux_hot_upgrade -- --test-threads=1"
    mux_ipc:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path crates/mux_ipc/Cargo.toml"
      test_command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path crates/mux_ipc/Cargo.toml --lib"
      format_command: ""
      e2e_test_command: ""
    cli_only:
      language: rust
      build_command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml --no-default-features"
      test_command: ""
      format_command: ""
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: 951c81fcc57501c1eb95a8e6eb0f1b609768258a
  - id: design
    artifacts: [DESIGN.md, design/]
    status: skipped
    skipped_reason: "GUI の変更が無く、CLI 出力と log のみのため視覚デザイン判断が不要"
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: completed
  - id: implement
    status: completed
    base_commit: 9c9db29321b43c7433f161e243e19ccc35162c74
    completed_at_commit: 204e94ae6b546c116b245aa27ce5c8a9fbf22e9a
  - id: review
    status: completed
  - id: verify
    status: completed
    result: pass
    failed_items:
      - id: VF-2
        note: "未解消だが本 feature に起因しない既存のフレーク。cargo test --lib は tabs::tests（off-thread replay タイムアウト 15-17 件）と tmux_sockets::tests（18 回中 2 回）の失敗で非ゼロ終了し続ける。ベースコミット 9c9db29 を別 worktree に切って 6 回測ったところ tabs::tests は毎回同数再現し、tmux_sockets も本 feature の changed_files に含まれない。本 feature に帰属するシナリオは全て pass のため verify は pass と判定した。"
      - id: VF-1
        note: "解消済み。task0011 で修正し、cargo test --lib を 18 回実行して SIGABRT はゼロ（修正前は 12 回中 2 回）。真因は inherited_pty.rs ではなく daemon.rs の 2 テスト間の HANDOFF_ENV_VAR レースで、同一 listener fd の二重 adopt を招いていた。"
  - id: retrospect
    status: completed

