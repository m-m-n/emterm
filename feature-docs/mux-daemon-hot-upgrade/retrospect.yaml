lessons_candidates:
  - id: L1
    note: |
      並列実装で「両側が同時に着地する結線」が誰の担当でもなくなった。task0003 が
      mux::upgrade の snapshot/restore を実装し、task0004 が daemon 側の呼び出し口を
      作ったが、両者が同時期にマージされたため配線が残らず、round 1 の critical に
      なった。plan-writing の「Integration wiring must have an owner」ルールは
      placeholder を置く場合を想定しているが、今回は「両タスクとも自分の側は完成させた
      が接続は誰も持っていない」形で、既存ルールの網にかからなかった。
      rework では upgrade 経路（daemon.rs / upgrade.rs / cli.rs）を 1 タスクに
      まとめることで解消した。相互に噛み合う変更は分割しない方が速い、という判断材料。
  - id: L2
    note: |
      worktree 間で refs/stash が共有されることを実装者が知らず、task0005 の
      git stash が task0004 の未コミット作業を巻き込んだ。両者とも自力で復旧したが、
      オーケストレーター側で dangling commit を ref に固定して gc から守る必要があった。
      rework 投入時にプロンプトへ「git stash を使わない」と明示したところ再発しなかった。
      implementer のプロンプトか worktree-task-workflow スキルに恒久的に入れる候補。
  - id: L3
    note: |
      verify の失敗原因を「abort 直前に完了していたテスト」の時間的近接から
      inherited_pty.rs と診断して task0011 の plan に書いたが、これは 12 回サンプルの
      相関に過ぎず誤りだった。真因は daemon.rs の 2 テスト間の HANDOFF_ENV_VAR レース
      （同一 listener fd の二重 adopt）で、実装者が strace -f の 2 回の独立再現で
      特定した。プロセス全体に及ぶ fd レースは、テストの完了順から局所化できない。
      オーケストレーターが plan に書く診断は仮説として明示し、実装者が反証できる
      余地を残すべき（今回は Out of Scope に inherited_pty 以外を書いていたため、
      実装者は逸脱として申告する必要があった）。
  - id: L4
    note: |
      round 1 の critical/high 13 件に対し auto-fix を 1 件も実行しなかった。処方が
      いずれも複数ファイルにまたがり、単一ファイル限定の review-editor 契約では
      構造的に適用できないため。review-phase.md の R4 分類は shape（diff/prose）を
      見るが、「処方が単一ファイルで完結するか」は見ていない。この判定軸を
      classification に足すと、適用不能な候補を dispatch する前に落とせる。
  - id: L5
    note: |
      codex CLI が不在だったため codex_cross_validation が全観点でスキップされたが、
      review-rules.yaml の判定では complexity: high により true のままだった。
      round 1・2 とも Claude 単独で critical を検出できたので実害は無かったが、
      cross-validation ありの前提で confidence を算出している（claude+codex=95 /
      claude-only=60）ため、codex 不在時は confidence の意味が変わる点は記録しておく。
  - id: L6
    note: |
      pane の scrollback を含む handoff ファイルがディスクに落ちる設計を SPEC の
      Assumptions（A1）で選んだが、round 2 の security が「削除経路が production に
      無いため恒久的に残りうる」「同 uid のプロセスが先にファイルを作るだけで
      upgrade を恒久的に殺せる」と指摘した。batch の create-spec で Codex 相談も
      できない状況で単独決定した設計判断が、後段のレビューで穴を指摘された例。
      Assumptions として記録していたことでレビュアーが要件として扱えた。
