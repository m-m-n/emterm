  - file: src-tauri/src/window_host/event_loop.rs
    line: 513
    severity: low
    title: "Enter pressed mid-press also drops the not-yet-upgraded drag anchor, a consequence SPEC EC1 does not enumerate"
    note: >-
      EC1 names only the fold-click consumer of pending_selection_anchor
      (pointer_routing.rs:355). A second consumer exists at pointer_routing.rs:131, which
      upgrades a held press into a Selection on first motion. Press, then Enter, then drag
      produces no selection until the button is re-pressed. This sits inside the FR5/AC7
      anchor-drop trade-off, so it is not a spec violation. Documentation-only suggestion.
  - file: src-tauri/src/window_host/input_translate.rs
    line: 253
    severity: low
    title: "should_clear_selection_on_forward's two bool params are positionally interchangeable; neither SPEC nor the truth-table test pins the order"
    note: >-
      SPEC prose declares (is_enter, forwarded); the implementation takes (forwarded, is_enter).
      Harmless today because the body is a commutative AND and the truth table is symmetric.
      Latent risk only if the body ever becomes non-commutative. Lowest-cost fix - correct the
      SPEC's declared parameter order.
