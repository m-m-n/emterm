    resolution_note: >-
      gate: user-instructed Codex consultation on the accepted side effect ASM5
      (pressing Enter while the left button is held also drops
      `pending_selection_anchor`, so the fold-click decision on release does not
      hold). codex_consulted: true (OpenAI provider was over its usage limit and
      the first litellm attempt timed out at 600s; a second litellm attempt with
