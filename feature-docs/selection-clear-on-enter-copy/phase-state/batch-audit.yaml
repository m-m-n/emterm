      the anchor makes the release-side fold guard `pending.is_some()` false, so
      the fold toggle does NOT fire (a skipped toggle, not a spurious one); B
      violates the user's explicit acceptance criterion and leaves the anchor at
      the press position, which produces a genuinely spurious fold toggle on
      release; C violates the same criterion while dragging and adds a second
      side effect (selection surviving Enter mid-drag) plus extra complexity.
      Adopted A - no plan change. Doc-accuracy note raised by Codex: the task
      plan and IMPLEMENTATION.md word the side effect as the fold toggle
      "misfiring" (誤爆), while the code path shows it is skipped instead. Wording
      only; no behavioural difference.
