    normalized_answer: "Enter (logical_key == Named(Enter)) のときだけクリアする。forwarded 分岐の内側で is_enter を条件にする。"
    resolution_note: >-
      gate: create-spec.requirement-clarification (policy action: codex_consultation).
      options considered: enter_only / all_forwarded_keys. chosen: enter_only.
      codex_consulted: true (turn 1 timed out at 600s after repository exploration;
      turn 2 with inlined code answered). fallback provider answered:
      litellm/vertex-glm-5.2 (CODEX_FALLBACK entry 2). opus_escalation: not run
      (suggestion mapped onto an existing option_id). key points: `forwarded` is true
      for any key producing PTY bytes including printable characters, so
      all_forwarded_keys contradicts the ticket's explicit out-of-scope statement
      ("clearing on general character input breaks select-to-read-while-typing");
      `is_enter` already exists in the same scope; bare modifiers never reach the
      branch (winit_key_to_bytes returns None) and IME-commit Enter early-returns.
      recorded as assumption per batch policy record_as_assumption: true.
