    normalized_answer: "純粋関数への切り出し + App 状態遷移テストに加えて、Enter 側クリア呼び出しの配置を include_str! のソース走査アサーションで固定する。"
    resolution_note: >-
      gate: create-spec.requirement-clarification (policy action: codex_consultation).
      options considered: pure_helper / source_scan / both. chosen: both (the worker's
      tentative position was pure_helper; Codex argued for both and the orchestrator
      judged it the better option). codex_consulted: true. fallback provider answered:
      litellm/vertex-glm-5.2. opus_escalation: not run. key points: the copy site is
      directly callable from a test (key_routing takes &mut App plus a host trait
      object, so a fake host works), but the Enter-side clear sits inside the winit
      event-handler body which no test can drive; a source-scan placement assertion is
      the only guard for it, and both styles already exist in
      src-tauri/src/window_host/tests.rs.
