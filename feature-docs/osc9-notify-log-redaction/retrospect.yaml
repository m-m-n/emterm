lessons_candidates:
  - >-
    litellm ハーネス経由の spec レビュアーが、欠陥ではなく「準拠確認」6 件を
    severity: critical の finding として返した。R3 のサニタイズは category と
    severity の機械照合しか行わないため素通りし、R5 の完了ゲート
    (residual_critical_high == 0) を誤って塞ぎかけた。オーケストレーター側で
    「description と suggestion の双方が準拠を述べている」と判断して declined に
    したが、これは判断が要る処理であり自動化されていない。同じ観点で再発するなら
    review-spec スキル側に「findings は欠陥のみ。準拠確認は summary に書く」を
    明記するのが筋。
  - >-
    fresh worktree では gitignored のバンドルフォントが無く GUI ビルドが
    build.rs で panic する。implementer にも verify にも毎回 scripts/fetch-fonts.sh の
    前置が要る。notification-body-markup-escape でも同じことが起きており、2 回連続。
    implement-phase の worktree 作成手順に組み込むか、build.rs 側で自動取得する
    余地がある。
  - >-
    --lib の既定並列実行で app::tests::timing::frame_work_pending_* が
    非決定的に落ちる。--test-threads=1 では 3248 全通過。tabs.rs replay と
    tmux_sockets discover に続く 3 件目の並列フレークで、verify のたびに
    「feature 起因か」を人手で切り分けている。
  - >-
    前回 run が create-spec の phase-state 初期化直後に中断しており、同じ Notion
    タスクの再実行で feature 名なしの引数だったため develop Step A の規約では
    「常に新規 feature」になるところだった。既存ブランチの phase-state が同一
    タスクのものだと確認できたので再開したが、Notion URL 起点の batch では
    「同じタスクの再発火」が構造的に起こりうる。タスク URL と feature 名の
    対応を残す仕組みがあると迷わない。
