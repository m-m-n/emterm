  - stable_id: b50fa1dc89231b4d
    severity: medium
    category: comprehensive
    file: src-tauri/src/callbacks.rs
    line: 563
    title: "`pending_notifications` に raw title/body が無限に積まれ続ける（drain が存在せず、本機能がログから消した文字列をメモリに永続保持する）"
    description: >-
      `handle_notify` の emit 側分岐が OSC 9 通知ごとに
      `state.pending_notifications.push((title.clone(), body.clone()))` を実行するが、
      production コードに drain が一つも存在しない（出現は宣言・この push・テスト 2 箇所のみ）。
      実配送は同関数の `sink.send` でインライン完結しているため、このバッファは二重経路の残骸。
      結果として (1) 互いに異なる (title, body) はレートリミットを通過するため、PTY 出力から
      OSC 9 を連続送出するとプロセス生存期間中ヒープが単調増加する、(2) 本 feature が
      emterm.log から消した生文字列とまったく同じものがプロセスメモリに無期限保持され、
      コアダンプ・メモリスキャン経由で同じ情報が残る。加えて callbacks.rs:388-390 の doc
      コメントは「drained by `Tab::pump`」と書いているが、その drain は存在せず、実装と乖離している。
    suggestion: >-
      (a) push とフィールドと doc コメントを削除する（実配送は既に sink.send で完結。ただし
      callbacks/tests.rs:135/:316 がこのフィールドを観測フックに使っているので書き換えが要る）、
      (b) doc コメントどおり `Tab::pump` 側で `std::mem::take` して drain し、インラインの
      sink.send を外す、(c) 最小対処として doc コメントを実態に直し Vec に上限を設ける。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: deferred
    resolution_reason: >-
      本 feature のスコープ外。SPEC NFR1 が `pending_notifications` buffering を明示的に
      不変対象として宣言しており、この push は本 diff の変更行でもない（レビュアー自身も
      「scope 外と判断するなら decline で問題ない」と付記）。実在する欠陥のため別タスクとして
      Notion に起票する。
