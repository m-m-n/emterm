  - stable_id: bdb26038d1d70661
    severity: medium
    category: performance
    file: src-tauri/src/callbacks.rs
    line: 132
    title: "Per-notification allocation overhead in hot path"
    description: >-
      notification_diagnostic_id が呼び出しごとに hasher と format 文字列を確保している、
      という指摘。
    suggestion: "hasher の thread-local 化、または (title, body) ペアの diag ID キャッシュ"
    sources: [litellm:vertex-deepseek-v3.2:performance]
    confidence: 50
    resolution: declined
    resolution_reason: >-
      前提が誤り。この経路は hot path ではなく、人間操作レートの通知経路（レートリミットの
      抑止分岐と D-Bus dispatch 成功分岐）に限られる。直後の blocking な D-Bus `.show()` の
      コストに比べ無視できる差で、claude:performance も同じ結論。キャッシュ導入は (title, body)
      を保持することになり本 feature の目的（生テキストを持たない）と衝突する。
