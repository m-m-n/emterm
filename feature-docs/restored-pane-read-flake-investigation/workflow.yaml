created: '2026-10-29'
base_branch: main
goal: |
  # mux pane の from_restored_pane_can_write_and_read_through_its_adopted_master が --lib 全体で間欠的に失敗する原因を調べる
  
  種別: 調査
  
  ## 知りたいこと (必須)
  
  `mux::session::pane::tests::from_restored_pane_can_write_and_read_through_its_adopted_master` が `--lib` 全体の実行で間欠的に失敗する原因は何か（短い read、順序の影響、その他）。
  
  ## なぜ知りたいか (必須)
  
  `--lib` 全体の実行で約 22% の確率で失敗し、無関係な変更の検証結果が読めなくなる。
  
  ## 調査範囲 (必須)
  
  対象: 上記テストと、その書き込み・読み戻しの待ち合わせ設計。対象外: mux 本体の挙動変更。
  
  ## 完了の定義 (必須)
  
  - [ ] 問いに結論が出ている
  - [ ] 根拠が file:line や実測値で示されている
  - [ ] コードは変更しない（直すべき点は別タスクとして起票）
  
  ## 手がかり (任意)
  
  - 該当箇所: `src-tauri/src/mux/session/pane/tests.rs:3253-3290`（失敗は PTY から読み戻したバイト列の assert、`tests.rs:3284`）
  - pty-reattach-timeout-investigation の計測で、`--lib` 全体 51 回中 11 回失敗
  - テストは 1 回の書き込みのあと 1 回だけ `read` している
