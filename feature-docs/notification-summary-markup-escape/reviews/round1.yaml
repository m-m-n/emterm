      なので、Notion に別タスクとして起票して追跡する。
  - stable_id: 102ae64a012ea0ae
    severity: medium
    category: comprehensive
    file: src-tauri/src/callbacks.rs
    line: 158
    title: >-
      summary を body-markup capability で判定してエスケープするため、summary を
      プレーンテキスト描画するサーバ（GNOME Shell / Plasma）でエンティティが
      literal 表示される
    description: >-
      エスケープ判定に使う `body_markup_confirmed` は freedesktop の `body-markup`
      capability、すなわち body のマークアップ可否しか見ていない。GNOME Shell も
      KDE Plasma も `body-markup` を広告するが summary はプレーンテキストとして
      描画するため、title に `&` `<` `>` が含まれるとこれらのデスクトップで
      `Build &amp; deploy done` のようにエンティティ参照がそのまま見える表示劣化に
      なる。`&` は動的タブタイトルや OSC 9 の任意文言に十分現れるため机上の懸念では
      ない。SPEC.md の assume.approach-a-escape-at-sink はこの劣化を受容済みの
      トレードオフとして記録しているが、その記録は `&lt;` の例のみで `&` の頻度に
      触れておらず、判断自体も batch モードの Codex consultation による自動解決
      （reversible な assumption）である。
    suggestion: >-
      (a) 現状維持（SPEC の受容済みトレードオフ）。(b) summary 側だけエンティティ化
      ではなくマークアップとして解釈されない無害化に変える（`<` `>` の除去や
      非マークアップ文字への置換）。(c) `get_server_information()` でサーバを判定し
      summary にマークアップを適用する実装に限ってエスケープする（ホワイトリスト
      保守コストあり）。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: declined
    resolution_reason: >-
      SPEC.md の assume.approach-a-escape-at-sink が受容済みのトレードオフとして
      記録しており、この feature の実装は SPEC どおり。ただし方針 (a)/(b) の選択は
      batch モードで Codex 相談により自動決定した reversible な assumption であり、
      `&` の literal 表示という実挙動は人間の確認に値するため、Notion に別タスクとして
      起票して再検討の余地を残す。
