  - stable_id: 3d75840c8f7bd928
    severity: medium
    category: security
    file: src-tauri/src/callbacks.rs
    line: 194
    title: Capability lookup errors leave attacker-controlled markup unescaped
    description: >-
      `get_capabilities()` の `Err` 分岐が `escape_for_send` の非エスケープ経路に
      到達し、title / body の両方が素通しで転送される。OSC 9 の title/body と
      OSC 0/2 由来のフォールバックタブタイトルは端末制御下の値なので、markup 対応
      デーモンが GetCapabilities を正しく実装していない場合や、Notify は成功する
      一方でその呼び出しが一時的に失敗した場合に、`<a>` や `<font>` が生のまま
      デーモンへ届き、通知内のなりすましが成立しうる。
    suggestion: >-
      capability 取得失敗と「成功したが body-markup を持たない応答」を区別し、
      `Err` では fail-closed（両フィールドをエスケープする、または通知を抑止する）
      にする。生テキストのまま送るのは、マークアップ非解釈が capability 応答で
      確認できたときだけにする。
    sources: [codex:security]
    confidence: 50
    resolution: declined
    resolution_reason: >-
      SPEC.md の Out of Scope に「capability 取得失敗時の fail-open（別タスク）」
      として明示的に除外されている項目で、この feature の変更が新たに作り込んだ
      ものではない（PR #35 の body 側から引き継いだ既定挙動）。本ラウンドでは
      対処せず、Notion に別タスクとして起票する。
  - stable_id: 5de8188253e559b0
    severity: medium
    category: comprehensive
    file: src-tauri/src/callbacks/tests.rs
    line: 832
    title: >-
      confirmed 経路の body エスケープを検証するテストが無く、FR3 の
      リグレッションゲートが実際には効いていない
    description: >-
      `escape_for_send` の confirmed 分岐は `(escape_body_markup(title),
      escape_body_markup(body))` を返すが、confirmed でこのヘルパを呼ぶ新規テストは
      いずれも返り値の body を `_` で捨てている。body を検証している唯一のテストは
      unconfirmed 分岐のみ。既存の PR #35 の body テストは
      `if body_markup_confirmed(..) { escape_body_markup(..) }` をテスト側で
      インライン再実装しているため、`escape_for_send` の中身が変わっても素通りする。
      結果として confirmed 分岐を `(escape_body_markup(title), body.to_string())`
      に書き換えても全テストが green のままになり、PR #35 の body 無害化が黙って
      退行しうる。task0001.tests.yaml の AC-5 が既存 body テストを regression gate
      と宣言している点と実態が食い違っている。
    suggestion: >-
      confirmed 分岐で body も実際にエスケープされることを `escape_for_send` 経由で
      1 本ピン留めする。併せて既存テストの分岐インライン再実装を
      `escape_for_send` 呼び出しに置き換えると、ロジックの二重実装が解消されて
      regression gate が実際に機能する。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: deferred
    resolution_reason: >-
      severity medium のため R4 の auto-fix 候補ゲート（critical/high のみ）に
