goal: |
  # term_core: EL / ED / ECH の相方掃除ブロック重複と到達不能な片側処理を整理する
  
  ## やりたいこと（必須）
  EL / ED / ECH に 5 箇所コピペされた wide ペア相方掃除ブロックを整理し、各サイトで構造的に到達不能な片側処理を解消する。
  ## 背景・なぜ（必須）
  feature `el-ed-wide-pair-cleanup`（PR: [https://github.com/m-m-n/emterm/pull/34](https://github.com/m-m-n/emterm/pull/34)）で、ECH と同形の「pre-capture → `clear_line_range` → 両端の `blank_wide_pair_split`」ブロックを EL 0 / EL 1 / ED 0 / ED 1 の 4 箇所へ複製した。動作は正しいが、ED / EL では消去範囲の端が固定のため各コピーの片側が構造的に発火しない。
  - mode 0（EL 0 / ED 0）: `end == self.cols` 固定のため `blank_wide_pair_split(end, row)` は `cell_index` の `col < cols` 判定で必ず no-op になり、右パートナー処理は決して動かない
  - mode 1（EL 1 / ED 1）: `start` がリテラル 0 のため `start_is_spacer && start > 0` が常に false で、直前の `get_cell_width(0, row)` の計算ごと死んでいる
  境界に敏感な同一ロジックが ECH を含め 5 箇所に散り、しかも半分が死に枝のため、将来ガードを直す際の追随漏れと「ED 0 は右パートナーも見ている」という誤読を招く。ECH だけが持つ `end - 1` アンダーフロー保護が複製先に無い点も、コピー間の差異が既に生じている例（`cols >= 1` が `clamp_resize_dims` で保証されるため現時点で実害は無い）。
  レビュー round1 の finding `b5faa9d564cbcfa6`（severity: medium / category: comprehensive / confidence: 65）として検出され、auto-fix ゲート（critical / high のみ）に乗らないため deferred となった。元タスク（[https://www.notion.so/3b93509ec8ee810dae61fbedf196beb0](https://www.notion.so/3b93509ec8ee810dae61fbedf196beb0)）がスコープ外に挙げていた「相方掃除プリミティブの共通化・chokepoint 化」（finding `b8a62feaf016ef08` / `931abe859e23fa5d`）と同一主題であり、レビューが独立に同じ結論へ到達している。
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] EL 0 / ED 0 の右パートナー処理と EL 1 / ED 1 の左パートナー処理（いずれも到達不能な側）が解消される
  - [ ] ECH / EL / ED の相方掃除ロジックの重複が削減される
  - [ ] 行全体クリア（`clear_line` / EL 2 / ED 2）に相方掃除の挙動が持ち込まれない
  - [ ] 既存の term_core ユニットテストが無変更で通り、EL / ED / ECH の相方掃除の振る舞いが変わっていないことが確認される
  ## スコープ外（任意）
  - `clear_line_range` 自体への相方掃除の畳み込み（`pub` な全呼び出し元へ影響が及ぶため。別名ラッパを挟む形なら可）
  - overflow 経路のテスト追加（finding `06ef78e20e9b9f0b`、別タスク）
  ## 制約・前提（任意）
  - PR #34 のマージが前提
  - 該当コード: `crates/term_core/src/csi_screen.rs` の `handle_erase_in_display` / `handle_erase_in_line` / `handle_erase_characters`
  - 共通ヘルパー `blank_wide_pair_split` は `crates/term_core/src/csi_edit.rs`（`pub(crate)`）
  - レビュー finding の実装案: (a) 各サイトで実際に発火し得る側だけを残し、なぜ片側で十分かをコメントに書く。(b) `csi_screen.rs` に private ヘルパを 1 本切り出して ECH と ED / EL の 4 サイトから呼ぶ。加えて ED 0 / ED 1 のカーソル行処理は EL 0 / EL 1 と完全に同一なので、ED 側を `handle_erase_in_line` への委譲にすればコピーは 4 → 2 に減る
  - finding の記録: `feature-docs/el-ed-wide-pair-cleanup/reviews/round1.yaml`（ブランチ `em-workflow/el-ed-wide-pair-cleanup/integration`）
