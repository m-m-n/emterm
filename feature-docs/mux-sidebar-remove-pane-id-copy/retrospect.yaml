      worktree ベースのワークフローを持つプロジェクトでは「gitignore されたビルド前提
      アセットの worktree への持ち込み」を手順として持つと、実装・検証の両方で
      1 ステップ減る。
  - note: >-
      medium finding が 4 件出たが R4 の auto-fix 候補ゲート（critical/high のみ）に
      該当せず、すべて unresolved で記録された。うち 2 件（doc/AGENT-STATUS.md の
      契約ドリフト、app.rs の孤児アクセサ + 削除済み AC 参照）は changed_files 外の
      ファイルを指しており、「削除タスクは削除対象を参照する周辺ドキュメント／
      アクセサも棚卸し対象に含める」を planner 側の規則にできる余地がある。
  - note: >-
