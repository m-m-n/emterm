schema_version: 1
feature: test-docs-rename-tracking
created: 2026-09-29
base_branch: main
goal: |
  # テスト改名で前 feature の test-docs 記録が参照切れになる

  Notion: https://www.notion.so/3ba3509ec8ee814e9e7aecc7314689ac
  種別: 改善

  ## やりたいこと（必須）
  テスト改名で参照切れになった前 feature の test-docs 記録を追随させ、feature をまたぐテスト名変更時に記録を更新する運用を決める。

  ## 背景・なぜ（必須）
  fail-closed 化（PR https://github.com/m-m-n/emterm/pull/39 ）でテスト名を改名した結果、`test-docs/notification-summary-markup-escape/task0001.tests.yaml` が挙げる 4 件のテストパスが存在しなくなった。
  - AC-2 の `summary_markup_escape::failed_capability_fetch_leaves_the_title_unchanged`（14 行目）
  - AC-5 の `body_markup_escape::body_markup_confirmed_is_true_only_for_a_successful_list_containing_it` / `..._is_false_when_absent_from_a_successful_list` / `..._is_false_on_fetch_failure`（33〜35 行目）
  この記録で verify を再実行すると該当テストが 0 件マッチになりトレーサビリティが切れる。加えて AC-2 の記述内容（失敗フェッチ → title 据え置き）は新 SPEC の FR1 が意図的に反転させた旧仕様であり、記録側にその旨が無いため、後から読むと現行コードが AC-2 に違反しているように見える。
  - 検出元: PR #39 のレビュー round1、finding `03533374d9cc5821`（severity medium / category comprehensive）
  - 記録: `feature-docs/notification-markup-fail-closed/reviews/round1.yaml`

  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] test-docs 記録を「時点スナップショットとして凍結する」か「現行名へ追随させる」かの方針を決める
  - [ ] 追随させる場合、旧 yaml のテストパスを現行名へ更新し、AC-2 に supersede 注記を追加する
  - [ ] 凍結する場合、新 yaml 側に旧 feature の AC-2 / AC-5 テスト名の対応表を残して参照切れを追跡可能にする
  - [ ] 決めた方針を今後の feature でも適用できる形（ルールまたはテンプレート）に落とす

  ## スコープ外（任意）
  - テストコード自体の変更
  - test-docs のスキーマ変更

  ## 制約・前提（任意）
  - PR #39 がマージされた後の状態を前提に着手すること

  ## 追加指示（起動引数）
  - 実装完了後、integration ブランチを remote へ push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモート両方に残す（自動マージしない）
  - 不明点は Codex に相談し、比較して良いと判断した案を採用する
  - その議論内容を Notion に記録する
