schema_version: 1
feature: focus-loss-drag-cleanup-test
created: '2026-09-20'
base_branch: main
goal: |
  マウスレポート: TS-4 フォーカス喪失クリーンアップの振る舞いテストが未実装

  ## やりたいこと (必須)
  TS-4（フォーカス喪失クリーンアップ）の振る舞いテストを、winit ウィンドウ無しで駆動できる形で実装する。
  ## 背景・なぜ (必須)
  PR #72（`em-workflow/mouse-report-reset-active-gesture/integration`）の SPEC は Test Scenarios TS-4 で、フォーカス喪失クリーンアップの入口を live な左ドラッグ付きで駆動し、次の 3 点を assert するよう要求している。
  1. `dragging` がクリアされる
  2. pending anchor が消費される
  3. 選択が publish される
  さらに NFR1 として、winit ウィンドウ無しで到達できる形に切り出すことまで指定している。
  実装が window-free に切り出したのは述語 `drag_in_flight`（`src-tauri/src/window_host/pointer_routing.rs:365`）だけで、状態変更側の `publish_local_drag`（`pointer_routing.rs:392`）は `&mut WindowHost` を取り `host.set_primary` / `host.set_clipboard` を呼ぶため、ウィンドウ無しでは駆動できない。
  結果、TS-4 が名指しする 3 つのアサーションを検証するテストはツリー上に存在しない。FR3 / AC-3 に対して唯一あるのは `tests.rs:1912` の `focus_loss_arm_never_calls_the_fold_click_toggle` で、これは `include_str!` に対する文字列検査であり振る舞いを実行しない。
  そのため SPEC の AC-9 のうち AC-3 分と Success Criteria の TS-4 分が実質未充足で、`publish_local_drag` 本体（アンカー消費順序・`copy_on_select` ミラー・selection 無しで何も書かないこと）がリグレッションに無防備。
  レビュー round 1 の未解決 medium `79f4847088dad493`（spec 観点）。
  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] 状態変更の core が window-free なヘルパーに分離されている
  - [ ] `dragging == false` / `pending == None` / 返り値が元の anchor であることを assert するユニットテストがある
  - [ ] PRIMARY publish 側の判定が純関数として bare `#[test]` で網羅されている
  ## 対応案
  - `take_local_drag_state(dragging: &mut bool, pending: &mut Option<Pos>) -> Option<Pos>` を `pointer_routing.rs` に置き、`publish_local_drag` はそれを呼んだうえで PRIMARY / CLIPBOARD 書き込みだけを担当する形にする
  - PRIMARY publish 側は `(selection.is_some(), copy_on_select, text.is_empty())` を取る純関数に切り出す
  ## スコープ外 (任意)
  既存のソーステキスト検査（`focus_loss_arm_never_calls_the_fold_click_toggle`）は fold-toggle 排他ガードとして残してよい。ただし TS-4 の代替とはしない。
  ## 制約・前提 (任意)
  - NFR1（winit ウィンドウ無しで到達できること）と NFR2（`decide_*` の純粋性）を守ること
  - ベースは PR #72 マージ後の main
