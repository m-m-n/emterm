    freeform: null
    normalized_answer: "sink_seam"
    resolution_note: >-
      gate: create-spec.requirement-clarification; policy action codex_consultation;
      codex_consulted: true (1 turn, harness entry 'codex', readonly sandbox);
      opus_escalation: not run (suggestion mapped on turn 1).
      Options not chosen: pure_predicate_only (worker's tentative position) and
      predicate_plus_text_resolution. Codex's key point: with a pure predicate alone the
      production write calls could be deleted and every test would still pass, so TS-4's
      third assertion ("the selection is published") stays unverified as a behaviour;
      predicate_plus_text_resolution asserts the payload but not that it reached the right
      destination. Codex also required that the seam keep the existing write rule intact.
      Orchestrator's own mapping judgement: sink_seam is a superset of pure_predicate_only,
      so all three of the task's stated acceptance conditions are still met.
