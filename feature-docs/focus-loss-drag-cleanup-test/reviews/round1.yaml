  file: src-tauri/src/window_host/tests.rs
  line: 4681
  title: '`focus_loss_cleanup_with_no_selection_publishes_nothing` is vacuous — its publish call sits
    in a statically dead branch, so it constrains nothing'
  description: 'The test body routes its publish through `if let Some(text) = None::<&str> { publish_to_targets(&mut
    sink, targets, text); }`, which can never match, so `publish_to_targets` is never called and the closing
    `assert!(sink.calls.is_empty())` is tautologically true. `targets` is bound but never examined: the
    test passes unchanged even if `consume_drag_termination(.., None, true)` started returning `SelectionPublishTargets
    { primary: true, clipboard: true }`. It provides zero regression protection for the no-selection case
    it is named after, yet task0001.tests.yaml lists it as one of the two tests backing AC-4. Real coverage
    of that case is not lost — the four `selection_publish_targets_no_selection_*` truth-table tests do
    pin it — so the harm is an inflated evidence claim rather than a coverage hole. (Orchestrator independently
    confirmed the dead branch in the diff.)'
  suggestion: 'Assert the decision directly instead of routing it through a dead branch: `assert_eq!(targets,
    SelectionPublishTargets { primary: false, clipboard: false }, ...)`, then keep the `sink.calls.is_empty()`
    assertion only if the publish is driven unconditionally (e.g. mirror the adapter with `if let Some(text)
    = resolved_text` where `resolved_text: Option<&str>` is a real variable bound to `None`, so the guard
    is data-driven rather than a literal).'
  sources:
