  title: AC-5/AC-6 evidence record cites a full-suite pass count from a command that cannot compile in
    this worktree; the sibling task record contradicts it
  description: 'task0001.tests.yaml AC-6 records: "Baseline (before any change): `cargo test --manifest-path
    src-tauri/Cargo.toml` = 3470 passed, 0 failed, 3 ignored. After implementation: 3486 passed (3470
    + 16 new tests), 0 failed, 3 ignored". That exact command cannot produce that output here. `src-tauri/Cargo.toml:269`
    declares `[[example]] name = "swash_emoji"` with `required-features = ["gui"]` (satisfied by the default
    feature set), and `src-tauri/examples/swash_emoji.rs:22` does `include_bytes!("../assets/fonts/NotoColorEmoji.ttf")`.
    `src-tauri/assets/fonts/` in this worktree contains only `.gitignore`, `LICENSE`, `README.md` — no
    `NotoColorEmoji.ttf`. So a plain `cargo test --manifest-path src-tauri/Cargo.toml` fails at compile
    time and never reaches a pass count. task0002.tests.yaml (lines 17-20, same feature, same worktree)
    records exactly that: `baseline_failures` and `final_failures` both carry "BUILD: cargo test (default
    features) fails to compile — examples/swash_emoji.rs: couldn''t read .../NotoColorEmoji.ttf". The
    two records in the same feature directly contradict each other, and the filesystem evidence says task0001''s
    is the false one (the implementer almost certainly ran `--lib`, which is the command SPEC NFR1 names,
    but wrote down the unqualified command and a full-suite framing). SPEC AC-5 ("The full Rust suite
    passes unmodified apart from additions", naming that exact command) and the Success Criteria line
    are gated on this record, so AC-5 is recorded as satisfied on evidence that does not exist. The internal
    arithmetic is at least self-consistent (16 new tests: 3 `consume_drag_termination_*` + 8 `selection_publish_targets_*`
    + 3 `publish_to_targets_*` + 2 `focus_loss_cleanup_*`), so the underlying suite is probably genuinely
    green under `--lib`; the defect is the evidence record, not (on the evidence available) the code.
    NOTE (orchestrator, independently verified): `src-tauri/assets/fonts/` was listed and contains no
    NotoColorEmoji.ttf; `src-tauri/Cargo.toml` does declare the `swash_emoji` example with `required-features
    = ["gui"]`; task0002.tests.yaml does carry the contradicting compile-failure record. Additionally,
    workflow.yaml''s `project.components.main.test_command` is that same unqualified command, so the verify
    phase will hit the identical compile failure.'
  suggestion: Re-run the suite with the command that actually runs in this worktree (`CARGO_TARGET_DIR=src-tauri/target
    cargo test --manifest-path src-tauri/Cargo.toml --lib`) and rewrite task0001.tests.yaml's AC-6 red_reason
    with the command actually used and its real counts. Add the pre-existing `examples/swash_emoji.rs`
    / missing-`NotoColorEmoji.ttf` compile failure to task0001's `baseline_failures` and `final_failures`
    exactly as task0002 records it, so the two task records agree. If SPEC AC-5's unqualified full-suite
    command is to stay as the acceptance bar, note explicitly that it is blocked by a pre-existing, unrelated
    missing font asset rather than leaving it recorded as passed.
