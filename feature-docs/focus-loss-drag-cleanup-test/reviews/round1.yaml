    so the approved default-feature test command would compile; that deviation was reviewed and DECLINED
    for change-set addition only (the paths are gitignored build assets), not disputed as untrue. So the
    unqualified full-suite command did compile and run in task0001''s worktree, and 3470/3486 are most
