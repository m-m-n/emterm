  title: FR8/AC-6 backfill claims the new test "exercises the focus-loss cleanup entry point" with "a
    materialized selection"; it does neither, and the adapter it names has no test at all
  description: 'The backfilled prior-feature SPEC.md TS-4 row says the new test "exercises the focus-loss
    cleanup entry point with a live left drag", and VERIFICATION.md''s TS-4 row says it exercises "the
    focus-loss path with a live drag and a materialized selection". `focus_loss_cleanup_publishes_selection_without_a_window`
    does neither: it never calls the entry point `publish_local_drag` nor the event_loop arm, and it never
    materializes a selection — there is no `Selection`, no `TerminalCore`, no `Selection::resolve`; it
    hard-codes "selected text" and hand-rolls the composition from `consume_drag_termination` + `publish_to_targets`,
    the same two calls the adapter makes. Consequence: the adapter''s wiring is entirely unverified —
    delete the `publish_to_targets(host, targets, text)` call from `publish_local_drag`, or swap the two
    destination flags at the gather step, and all 16 new tests still pass; no source-scan test pins the
    adapter''s body either. This is inherent to the SPEC''s own design — NFR1 forbids constructing a `WindowHost`,
    and FR5 asks only that the test drive "the FR1 core and the FR4 recording sink" — so the implementation
    does not deviate from FR5. But FR8''s whole point (and BO-3) is that the backfilled rows must state
    what is actually verified rather than overclaim, and this feature exists precisely because the previous
    version of this row overclaimed. Replacing one inaccurate row with a differently inaccurate one misses
    AC-6.'
  suggestion: 'Reword both rows to describe what the test actually drives: the window-free state core
    plus the recording sink composed the same way the adapter composes them, with no `WindowHost` and
    no resolved `Selection`. State plainly that `publish_local_drag`''s own gather/adapt wiring remains
    covered only by the two `include_str!` call-site literals in tests.rs, so the composition is verified
    at the seam and not through the production entry point. Then decide the prior feature''s TS-4 checkbox
    deliberately — tick it if the reworded claim is now met, or leave it unticked with a one-line reason.'
  sources:
