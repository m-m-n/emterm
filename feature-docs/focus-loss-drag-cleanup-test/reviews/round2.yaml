  file: src-tauri/src/window_host/tests.rs
  line: 4699
  title: 'Round-1 item 3623270de026dc88 only partially resolved: no test drives publish_to_targets with
    primary == false, and the test''s own doc comment claims the opposite'
  description: 'The round-1 rework (task0003) fixed half of finding 3623270de026dc88 and left the other
    half. focus_loss_cleanup_with_no_selection_publishes_nothing now asserts the destination decision
    directly (assert_eq!(targets, SelectionPublishTargets { primary: false, clipboard: false }) at tests.rs:4690-4697),
    which has real force over selection_publish_targets. But resolved_text is bound to None at tests.rs:4683,
    so the `if let Some(text) = resolved_text` at tests.rs:4700 never executes, publish_to_targets is
    never called, and the closing assert!(sink.calls.is_empty()) at tests.rs:4703-4706 holds regardless
    of what publish_to_targets does. Every other call site driving publish_to_targets passes targets with
    primary == true (tests.rs:4577, 4596, 4612, 4651), so the `if targets.primary` false arm at pointer_routing.rs:472
    is exercised by no test at all: deleting that guard and always writing PRIMARY leaves the whole suite
    green. Additionally, the doc comment added at tests.rs:4674-4678 states that the publish step ''is
    driven by resolved_text, a value-carrying Option<&str> binding, not by a literal the compiler can
    fold away, so the closing sink-emptiness assertion constrains the publish path instead of restating
    a tautology.'' That claim is false as written: the binding is a statically-known None in the same
    function body, the branch is dead, and the assertion is still a tautology with respect to the publish
    path. The same wording was carried into the AC-4 evidence record at test-docs/focus-loss-drag-cleanup-test/task0001.tests.yaml
    (AC-4 red_reason), so the evidence record overstates what the test constrains, which is the class
    of defect this whole feature exists to remove.'
  suggestion: 'Keep the direct targets assertion, then call publish_to_targets(&mut sink, targets, "unused")
    unconditionally (drop the `if let`) before asserting sink.calls is empty, so the primary == false
    arm of pointer_routing.rs:472 is actually executed. Verify by mutation: deleting the `if targets.primary`
    guard must make the test fail. Then correct the doc comment at tests.rs:4674-4678 and the matching
    AC-4 red_reason sentence in test-docs/focus-loss-drag-cleanup-test/task0001.tests.yaml to describe
    what the test does after the change (the publish is invoked with the no-selection targets and records
    nothing) rather than the dead-branch framing.'
