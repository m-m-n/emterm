schema_version: 1
feature: mux-strip-escape-state-carry
created: '2026-10-03'
base_branch: main
goal: |
  # mux: post-strip-closure review で残った medium 指摘 a879a02de382209f（strip の終端状態 Escape が引き継がれず分割位置でカット閉鎖が変わる）の対応

  Notion: https://www.notion.so/3ee3509ec8ee81b7bbd0dc35a37ee3bc

  ## 現象 (必須)
  mux-cut-csi-post-strip-closure の review round 1 で、medium 指摘 `a879a02de382209f`（security、evaluator 起点）が `unresolved` のまま残った。
  `strip_pty_output_for_scrollback_write_with_csi_state`（`src-tauri/src/mux/scrollback_filter.rs:280`）は strip の終端状態を `state.csi()` で `Option<CsiPhase>` に縮める。このため、strip が ESC を書いた直後の構文を除去したときの終端状態 `WrittenState::Escape` は `None` になり、`self.csi` に入って（`src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:554`）次の呼び出しの strip は Ground から始まる。
  結果として、同じバイト列でも読み取りの分割位置によってカット時の閉鎖（DEL）の有無が変わる。1 回で渡すと `Some(Param)` になり DEL が書かれるが、分割して渡すと DEL が書かれず、リングとスナップショットが `ESC[6` で終わる。後続の `n` で `ESC[6n` が成立し、生ストリームには無い CPR 応答をクライアントが返す。
  また、そのような呼び出しの直後がカットだと、リングは書かれた単独の ESC で終わり、閉じられない。リプレイではカット後の最初のバイトがエスケープを作る（例: `[6n` は照会、`c` は RIS）。旧来の scan ベースの状態にも同じ欠落があった。
  ## 再現手順 (必須)
  1. 書き込みフィルタの呼び出し 1 に `ESC ESC]777;emterm;markdown;begin;id=x BEL` をカット無しで渡す（`ESC` が書かれ、引き継ぐ状態は `None` になる）
  2. 呼び出し 2 に `[6` を末尾カット付きで渡す（`[6` が書かれ、DEL は書かれない）
  3. 後続の出力で `n` が届くと、クライアントが開始していない CPR 応答（`ESC[row;colR`）を返す
  `ESC` + `ESC[6n`、`ESC` + Kitty APC、`ESC` + SIXEL DCS でも同じ。
  ## 期待する挙動 (必須)
  strip の終端状態を Ground / Escape / Csi(phase) を区別できる形で引き継ぎ、分割位置によらず出力と状態が 1 回で渡した結果と等しくなる（AC-3 / FR1 / FR2）。書かれたストリームが Escape で終わる位置でカットするときは、エスケープを無害に完了させる閉鎖を書く。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`post_strip_cut_csi.rs` の分割不変性コーパスに `ESC ESC`+各除去対象（+`[6`）を加え、同一呼び出しのカットとフォールバック閉鎖の両方のケースを追加）
  - [ ] stable_id `a879a02de382209f` について、対応済みか・対応不要かを判断して記録する
  ## 該当箇所 (任意)
  - `src-tauri/src/mux/scrollback_filter.rs:280`（`strip_pty_output_for_scrollback_write_with_csi_state` が終端状態を `Option<CsiPhase>` に縮める）
  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:554`（`self.csi = csi_after`）
  - `src-tauri/src/mux/ipc/pty_spawn/tests/post_strip_cut_csi.rs`（分割不変性コーパス）
  - 詳細: ブランチ `em-workflow/mux-cut-csi-post-strip-closure/integration` の `feature-docs/mux-cut-csi-post-strip-closure/reviews/round1.yaml`
  ## 実害・発生条件 (任意)
  ESC の直後に strip 対象の完全な構文が続き、その直後で PTY 読み取りの分割が起き、さらに snapshot 取得のカットが重なったときにだけ起きる。
