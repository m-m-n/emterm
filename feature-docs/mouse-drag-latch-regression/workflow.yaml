schema_version: 1
feature: mouse-drag-latch-regression
created: '2026-09-21'
base_branch: main
goal: |
  マウスレポート: ドラッグ中の reset で host.dragging がラッチしゴーストドラッグになる

  ## 現象 (必須)
  マウスレポート実装（ブランチ `em-workflow/mouse-reporting/integration`）の rework で入ったリグレッション。
  `apply_outcome` は `updates.reset` が立つたびに `records.gesture_owner.clear_all()` を実行する。`reset = !tracking_active || tab_changed` は `decide_press` / `decide_wheel_event` / `decide_release`（no-owner 分岐）から立つため、**トラッキングモードが無効な通常状態では、押下のたび・ホイールノッチのたびに reset が true** になる。
  左ボタン押下でグリッド上に `Left = Local` が記録され `begin_selection_drag` が `host.dragging = true` にする。そのドラッグ中にホイールを回すか別のボタンを押すと reset が発火して Left スロットが消える。対応する左解放時に `peek(Left) == None` となり `Disposition::Nothing` が返り、`complete_selection_and_publish_to_primary` が呼ばれない。
  `host.dragging` はクレート全体で 2 箇所（`pointer_routing.rs:330` で true、`:353` で false）にしか代入が無く、他に落とす経路が無いため **true のままラッチする**。
  フォーカス喪失経路でも同じラッチに到達する。`event_loop.rs:249` は `Focused(false)` で `mouse_report::clear_all` を呼ぶが、`host.dragging` も `app.pending_selection_anchor` も触らない。
  結果:
  - 以降のすべての PointerMoved がボタンを押していないのに選択範囲を伸ばす
  - `update_resize_hint` / `refresh_link_hover` が恒久的にスキップされる
  - 選択が PRIMARY に publish されない
  ベースコミットには無条件の `(Left, Released) => host.dragging = false` があり、この経路は到達不能だった。task0005 / task0006 のリグレッション。

  ## 再現手順 (必須)
  1. eMterm を起動する（マウスレポート対応 TUI は不要）
  2. グリッド上で左ボタンを押したままドラッグして選択を始める
  3. ドラッグ中にホイールを 1 ノッチ回す（または別のボタンを押す）
  4. 左ボタンを離す
  5. ボタンを押していないのにポインタ移動で選択範囲が伸び続ける。選択が PRIMARY にも入らない
  別経路: 手順 3 の代わりにウィンドウのフォーカスを外しても同じ状態になる。

  ## 期待する挙動 (必須)
  - 左解放時は、ジェスチャ所有権の記録が残っているかどうかに関わらず `host.dragging` を落とし、`app.pending_selection_anchor` を消費する
  - reset はセルキャッシュと陳腐化したジェスチャ記録の無効化のためにあり、物理的に押下継続中のジェスチャを破棄しない
  - フォーカス喪失時は `mouse_report::clear_all` と併せて `host.dragging` と pending anchor も落とす

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  （左ドラッグ中のホイール / 左ドラッグ中の第 2 ボタン押下 / 左ドラッグ中のフォーカス喪失 の 3 ケースで、最終的に `dragging == false` かつ選択が publish されること）

  ## 該当箇所 (任意)
  - `src-tauri/src/window_host/mouse_report.rs:912` — `apply_outcome` の `updates.reset` 分岐
  - `src-tauri/src/window_host/pointer_routing.rs:330` / `:353` — `host.dragging` の唯一の代入箇所
  - `src-tauri/src/window_host/event_loop.rs:249` — `Focused(false)` 時の `clear_all`

  ## 実害・発生条件 (任意)
  マウスレポートの有効・無効を問わず発生する。一度踏むとウィンドウを作り直すまで選択機能が壊れたままになるため、影響は大きい。
  レビュー由来: em-workflow review round 3 / stable_id `1ac64f41111531a6` / severity high / category comprehensive。batch モードの review rework cap 到達により deferred として残った。修正が `mouse_report.rs` / `pointer_routing.rs` / `event_loop.rs` の 3 ファイルにまたがるため、single-file の auto-fix editor では適用できなかった。
