  - question_id: develop.scope-already-fixed
    packet_id: null
    answered_at: "2026-09-21T00:05:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [proceed_new_feature]
    freeform: "proceed_new_feature"
    normalized_answer: "Start the feature: the reported defect's first three mechanisms are already fixed on main, but the definition of done is not yet met."
    resolution_note: >-
      gate: orchestrator-opened scope question raised before Step A's create-spec,
      because the reported defect appeared to be already fixed on main (8c3b4cce).
      Options: proceed_new_feature / stop_already_fixed.
      codex_consulted: true (harness entry `codex`, turn 1 of the consultation).
      Codex verified five checks against the repository and reported items 1-3
      satisfied (apply_outcome_with_held clears only unheld slots at
      mouse_report.rs:1164; the held-aware entry point is reached from
      pointer_routing.rs:850 and mouse_report.rs:1235; the no-owner left release is
      gated on drag_in_flight at mouse_report.rs:935 / pointer_routing.rs:364) and
      items 4-5 unsatisfied (the focus-loss arm does not terminate a drag whose left
      button is held; no regression test covers the three named cases end to end).
      Chosen: proceed_new_feature. Not chosen: stop_already_fixed — rejected because
      the definition of done's regression-test requirement is demonstrably unmet.
      opus_escalation: not run (Codex's suggestion mapped onto an offered option).
  - question_id: develop.scope-focus-loss-semantics
    packet_id: null
    answered_at: "2026-09-21T00:12:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [scope_to_regression_tests_only]
    freeform: "scope_to_regression_tests_only"
    normalized_answer: >-
      Keep the deliberate `!left_held` focus-loss gate and scope the feature to the
      missing regression tests, asserting the current intended semantics.
    resolution_note: >-
      gate: orchestrator-opened scope question, turn 2 of the same Codex consultation.
      Options: terminate_on_focus_loss_unconditionally / keep_held_gate_add_focus_loss_release_path /
      scope_to_regression_tests_only.
      codex_consulted: true (harness entry `codex`).
      Crux settled by Codex: after focus loss with the left button still physically
      held, the window still receives the matching release (event_loop.rs:583 handles
      button notifications without conditioning on focus state; clear_all at
      mouse_report.rs:1249 clears only the ownership and held records, not OS event
      delivery), so the release reaches decide_release's "left release while a drag is
      in flight" branch (mouse_report.rs:935) and publish_local_drag
      (pointer_routing.rs:564 -> :426) clears host.dragging, consumes
      app.pending_selection_anchor and publishes the selection. No latch remains.
      Ordering fact recorded: host.mouse_report_held is zeroed on focus loss AFTER the
      termination predicate is evaluated (event_loop.rs:259 reads the left-held record,
      :260 evaluates, :269 calls clear_all).
      The `!left_held` gate is deliberate, pinned by
      tests.rs:1938 should_terminate_drag_terminates_only_when_in_flight_and_left_not_held
      and documented as out of scope in
      feature-docs/focus-loss-drag-termination/tasks/task0001.md:151.
      Chosen: scope_to_regression_tests_only. Not chosen:
      terminate_on_focus_loss_unconditionally and keep_held_gate_add_focus_loss_release_path
      — both overturn the existing held-drag-preservation behaviour and its pinning test.
      Consequence recorded as a feature assumption: the task's "期待する挙動" bullet asking
      for unconditional drag termination on focus loss is intentionally not adopted.
      opus_escalation: not run (Codex's suggestion mapped onto an offered option).
