    title: "遅延フラッシュ不変条件の唯一の例外 (Drop) が、その doc-comment 自身が想定する使い方でイベントディスパッチ内から走る"
    description: >-
      遅延フラッシュの不変条件（BridgeWindow 副作用は flush と Drop のみ）の
      うち Drop は「teardown はイベントディスパッチの一部ではない」を根拠に
      直接呼び出しを許しているが、バックエンド差し替えの唯一の経路
      App::set_ime_backend は can_create_surfaces（winit イベント
      ディスパッチ内）から呼ばれる。現状 drop されるのは NullBackend
      （Drop 無し）なので実害はないが、Drop コメント自身が挙げる
      「settings 変更で NullBackend に切替」の将来経路が実装されると、
      wndproc 内から ImmAssociateContextEx への同期呼び出しが復活する。
      不変条件がコメントと一回限りの grep でしか守られていない。
    suggestion: >-
      (a) ImeBackend に detach()（デフォルト no-op）を追加して teardown も
      drain 経路に載せ、window_host は about_to_wait 内で detach → 差し替え
      の順に呼ぶ（Drop は二重呼び出しガード付きの best-effort に格下げ）。
      または (b) App::set_ime_backend の doc に「about_to_wait からのみ
      呼ぶこと」を明記し winit_bridge の Deferred flush 節と相互参照させ、
      Drop コメントの "replaced mid-session" 記述を安全な呼び出し位置と
      矛盾しない表現に直す。
    sources: [claude:architecture]
    confidence: 60
