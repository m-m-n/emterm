    title: "IME disable→enable をまたいで cursor-area の dedup が無効化されず、再フォーカス後に候補ウィンドウがプレースホルダ位置 (0,0) に残る"
    description: >-
      last_cursor_area と App 側 ime_last_cursor_cell は disable/enable を
      またいでもリセットされない。一方 Enable リクエストは cursor_area を
      (0,0)/(1,1) プレースホルダで再シードするため、「フォーカスアウト →
      フォーカスイン、カーソルセル不動」の後は二段 dedup が両方ヒットして
      Update が飛ばず、候補ウィンドウがウィンドウ左上に出たままになる。
      diff 以前から存在する挙動だが、本 diff が dedup 不変条件を再定義・
      明文化しているためその穴として指摘。新しい flush 順序（allow →
      cursor 固定）では同一ターンの Disable + rect 更新が必ず NotEnabled で
      捨てられ、それでも last_cursor_area は更新済みになる。
    suggestion: >-
      allow-state の記録・フラッシュ時に cursor 側キャッシュを無効化する
      （pending_allow 遷移時に last_cursor_area = None、App 側
      ime_last_cursor_cell も notify_ime_focus 等でクリア）。flush で
      allow=false → allow=true の後、同一 rect の notify_cursor_rect が
      再度 set_ime_cursor_area を呼ぶことを検証する単体テストを足す。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: null
