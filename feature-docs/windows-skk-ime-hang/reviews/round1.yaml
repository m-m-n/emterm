  - stable_id: 87571f53ecd89037
    severity: medium
    category: comprehensive
    file: src-tauri/src/ime/winit_bridge.rs
    line: 272
    title: "FR4 の Disabled アノマリー警告が Wayland/X11 の通常フォーカスアウトで誤発火し、ラッチで本物の異常を握り潰す"
    description: >-
      notify_focus(false) は ime_enabled をローカルで落とし、直後の flush が
      ImeRequest::Disable を発行する。winit-wayland / winit-x11 は同
      リクエストから Ime::Disabled を合成して返すため、Linux では
      「ime_enabled == false の状態で Disabled が来る」のが毎回の正常
      フォーカスアウト経路になる。新設の異常判定はこの正常系にマッチし、
      (a) release ログに恒常的にミスリードな warn が 1 本残り、
      (b) ラッチが誤検知で立って以後の本物の unpaired Disabled を記録
      できなくなる — FR4 の診断価値が Linux で無効化される。テストも
      notify_focus(false) → Disabled の並びをカバーしていない。
    suggestion: >-
      自分で落としたクローズと IM サーバー由来のクローズを区別する。
      notify_focus(false) で expect_synthetic_disable フラグを立て、
      Disabled 到着時にフラグがあれば消費するだけで warn しない
      （フラグ無しで !ime_enabled なら真の異常として warn + latch）。
      notify_focus(false) → Disabled で warn が立たないことを検証する
      単体テストを追加する。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: null
