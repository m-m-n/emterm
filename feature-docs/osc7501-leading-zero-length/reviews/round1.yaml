findings:
  - stable_id: f058cb65aba2c3a1
    severity: medium
    category: comprehensive
    file: src-tauri/src/mux/ipc/pty_spawn/write_filter.rs
    line: 1556
    title: "連続ESCで打ち切られたOSC 7501を、mux側だけがSTで終わった報告として取り込む"
    description: "AgentStatusFeedScanner::step は、InsideOscPendingSt で2つ目の ESC を受けても何もせず状態を保つ（1556行の `0x1b => {}`）。そのため続く `\\` で commit(Terminator::St) が呼ばれ、1610行の新しい判定で番号 7501 の ProgramStatus 項目として出力される。term_core 側の osc_escape（crates/term_core/src/parser/osc.rs 63-71行）は、ESC の直後が `\\` でなければ OscTerminator::Unterminated で dispatch し、その ESC を新しいエスケープの開始として処理し直す。このため `ESC ] 07501;state=clear ESC ESC \\` を流すと、平タブでは working の記録が残り、mux ペインでは消える。FR4 に反する。正規の綴り `ESC ] 7501;... ESC ESC \\` でも変更前から同じずれがあり、今回の変更で先頭ゼロ等の綴りにも広がった。"
    suggestion: "InsideOscPendingSt で 0x1b を受けたら、組み立て中の本体を捨てて SeenEsc に移す。`7501;` と `07501;` の両方を ST の前で ESC を2回続けて終える入力と、2つの ESC の間で受信が分かれる入力について、平タブと mux ペインの記録表が一致することを確かめるテストを追加する。"
    reproduction: null
    reproduction_alternates: []
    reproduction_overflow: false
    sources: [codex:comprehensive]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium のため auto-fix 候補外（critical/high のみ対象）。別タスクとして起票"
