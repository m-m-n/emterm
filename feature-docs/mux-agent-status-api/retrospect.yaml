lessons_candidates:
  # Raw memos — analysis and rule-table promotion deferred to /em-workflow:retrospect
  - "Integration-owner gap: task0005 (AgentStatusModel) built the transition queue + drain API; task0007 (notifications) built the notification helpers. Neither task's plan explicitly OWNED the wiring in pump_all — each assumed the other would connect them. This produced the exact 'Integration wiring must have an owner' failure the plan-writing skill warns about (evidence: braille-ar-overlay 2026-07-11). 5 reviewers independently flagged it. Consider making the planner audit for producer/consumer pairs explicitly."
  - "Planner file-prediction accuracy was middling: 4 of 8 original tasks had at least one file outside expected_files. Reworks were cleaner (0 of 5). Possible cause: the original planner made file predictions per-task in isolation, without accounting for cross-cutting integration files (render/mod.rs, connection.rs, pty_spawn.rs) that any task involving mux IPC will inevitably touch."
  - "Two batch-retry consumptions this run (task0004 user-stop, task0006 background-poll-wait). Both succeeded on retry. The background-poll-wait failure mode (implementer waits for an external dependency that never notifies) is worth flagging as a specific implementer failure pattern — subagents should not indefinitely poll; the parent branch already contains all dependencies."
  - "Font-assets prerequisite: every fresh worktree (task and integration) had to manually copy src-tauri/assets/fonts/*.ttf/*.otf from the main tree before cargo check/test could pass, because build.rs hard-fails without them and the assets are gitignored. Every implementer independently discovered and worked around this. Consider either: (a) documenting this as a mandatory environment step in worktree-task-workflow skill, or (b) making build.rs auto-fetch them (via scripts/fetch-fonts.sh) on first miss."
  - "Codex CLI cross-contamination between concurrent sessions: architecture (codex) round 2 failed 6/6 attempts (4 returned spec-perspective content from a parallel session, 2 timed out). The scratchpad directory is shared across concurrent subagents; naming reviewer output files by perspective (as some agents did) mitigated but did not eliminate the issue. Worth investigating whether codex CLI --session-id or a per-invocation working dir is needed."
  - "Review found 3 new high issues in round 2 that were caused by the round 1 rework (mux_double_notify: the drain-wiring fix created a new double-processing path; send_watermark_race: the send_text lock-release fix introduced a race by decoupling revision-sample from write). Reworks can introduce fresh issues; a third-round review after rework would have caught them, but batch mode's cap-1 policy makes that a manual step. The batch cap-1 policy is defensible for cost but leaves a real quality gap when reworks change concurrency shape."
