<!doctype html>
<!-- Design spec mockup — NOT implementation. Token values mirror
     src-tauri/src/ui/md3.rs PALETTE_PURPLE (dark). Implementers use the
     md3.rs role accessors, never these hex values. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>mux-agent-status-api — tab badges</title>
<style>
  :root {
    --color-surface: #141218;
    --color-surface-container: #211F26;
    --color-surface-container-high: #2B2930;
    --color-on-surface: #E6E0E9;
    --color-on-surface-variant: #CAC4D0;
    --color-outline-variant: #49454F;
    --color-primary: #D0BCFF;
    --color-on-secondary-container: #E8DEF8;
    --color-on-error-container: #F9DEDC;
  }
  body { background: var(--color-surface); color: var(--color-on-surface);
         font-family: sans-serif; margin: 24px; }
  h2 { font-size: 14px; color: var(--color-on-surface-variant); font-weight: 500; }
  .tabbar { display: flex; gap: 2px; background: var(--color-surface-container);
            border-bottom: 1px solid var(--color-outline-variant); padding: 0 8px; }
  .tab { display: inline-flex; align-items: center; gap: 6px;
         padding: 8px 16px; font-size: 14px; color: var(--color-on-surface-variant); }
  .tab.active { color: var(--color-on-surface);
                box-shadow: inset 0 -2px 0 var(--color-primary); }
  /* Agent state badge: 8px dot before the tab title.
     Unseen (attention not yet acknowledged): filled dot.
     Seen: 1.5px ring, no fill (same role color).
     No animation (project constraint: no open/close or attention animation). */
  .dot { width: 8px; height: 8px; border-radius: 9999px; flex: none; }
  .dot.blocked  { background: var(--color-on-error-container); }
  .dot.working  { background: var(--color-primary); }
  .dot.done     { background: var(--color-on-secondary-container); }
  .dot.idle     { background: var(--color-on-surface-variant); }
  .dot.seen     { background: transparent; border: 1.5px solid; }
  .dot.seen.blocked { border-color: var(--color-on-error-container); }
  .dot.seen.done    { border-color: var(--color-on-secondary-container); }
  section { margin-bottom: 28px; }
</style>
</head>
<body>

<section data-state="default">
  <h2>Tab bar — aggregated agent-state badges (priority: blocked &gt; unseen done &gt; working &gt; seen done &gt; idle)</h2>
  <div class="tabbar">
    <div class="tab active"><span class="dot working"></span>claude-a</div>
    <div class="tab"><span class="dot blocked"></span>claude-b</div>
    <div class="tab"><span class="dot done"></span>codex</div>
    <div class="tab"><span class="dot seen done"></span>builds</div>
    <div class="tab"><span class="dot idle"></span>agent-idle</div>
    <div class="tab">shell</div><!-- no reported state: no badge, unchanged layout -->
  </div>
</section>

<section data-state="empty">
  <h2>Empty — no pane reports a state: tab bar unchanged from today</h2>
  <div class="tabbar">
    <div class="tab active">shell</div>
    <div class="tab">logs</div>
  </div>
</section>

</body>
</html>
