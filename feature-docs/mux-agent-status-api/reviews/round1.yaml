  - stable_id: mux_read_render_missing
    severity: high
    category: spec
    file: src-tauri/src/mux/ipc/handlers.rs
    line: 898
    title: "mux read does not return rendered tail rows"
    description: "SPEC FR10 requires the tail N rendered rows from current screen plus scrollback. The scrollback path merely removes escape bytes and calls str::lines(); terminal wrapping, carriage returns, cursor movement, erasure, and overwritten cells are not rendered. Byte-cap truncate keeps the oldest prefix and removes the newest suffix, so the result is no longer the tail."
    suggestion: "Maintain or reconstruct scrollback as rendered terminal rows, select the final N rows, and enforce the byte cap by retaining the UTF-8-safe suffix containing the newest output."
