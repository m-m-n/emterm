    title: "Replay synchronization cannot communicate a cleared state"
    description: "SPEC FR4 says current states are synchronized after a snapshot through replay-derived FR5 messages; FR5 allows the message state to be none/cleared. The synchronization loop skips every pane whose current state is None. If the GUI previously knew a non-empty state but missed a clear while detached, reattach cannot clear the stale badge or summary."
