  - stable_id: send_text_lock_held
    severity: high
    category: performance
    file: src-tauri/src/mux/ipc/handlers.rs
    line: 969
    title: "Blocking PTY write holds the global session-manager lock"
    description: "handle_send_text keeps the session_manager mutex guard alive while pane.write_input performs synchronous write_all + flush. A 1 MiB payload against a non-consuming child can block; during that time every task needing the manager stalls, while a Tokio worker is also blocked. handle_read_pane already drops the lock before scrollback work — SendText should too."
    suggestion: "Clone per-pane writer/status handles under the manager lock, then release it. Serialize writes through a bounded per-pane writer task/channel, or use spawn_blocking after dropping the manager guard; obtain the revision watermark within the same per-pane serialized operation."
