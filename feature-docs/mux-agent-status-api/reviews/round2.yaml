  - stable_id: mux_double_notify
    severity: high
    category: comprehensive
    file: src-tauri/src/callbacks.rs
    line: 508
    title: "Mux-attached tabs process each agent-status OSC twice → duplicate desktop notifications"
    description: "For mux-attached tabs, the same agent-status OSC 777 report is applied to App::agent_status under two different keys (PaneKey::MuxPane via daemon broadcast + PaneKey::Tab via client's local vt100 OSC parse). Each application drives an independent notification with a different rate-limit key, so the per-pane rate limiter cannot suppress the duplicate. Users get two OS notifications per blocked/done transition, and tab-bar / sidebar aggregate is inflated."
    suggestion: "Gate NativeCallbacks::on_osc's agent-status arm on whether the tab is mux-attached (daemon-owned) and skip local-OSC application when so. Alternative: strip agent-status OSC from bytes forwarded to the client (pty_spawn.rs), or drop plain-tab events for mux tabs in pump_all."
    sources: [claude:comprehensive]
    confidence: 65
    resolution: deferred
    resolution_reason: "batch mode: rework cap reached (batch.review_rework_count already 1)"
  - stable_id: send_watermark_race
    severity: high
    category: spec
    file: src-tauri/src/mux/ipc/handlers.rs
    line: 984
    title: "Send watermark sampled before an unbounded scheduling gap (FR11 linearization break)"
    description: "SPEC FR11: returned watermark is 'the revision from just before the successful write'. The code reads the revision, then separately schedules the PTY write with spawn_blocking. If a report increments revision 5→6 during that gap, the write succeeds and returns watermark 5; wait --after 5 then immediately accepts revision 6 even though that report preceded the input write."
    suggestion: "Serialize report acceptance with the watermark-and-write operation via a per-pane actor or coordination lock that drains prior reports, samples the revision, and performs the write without allowing another report to be accepted between those steps."
    sources: [codex:spec]
    confidence: 70
    resolution: deferred
    resolution_reason: "batch mode: rework cap reached"
  - stable_id: replay_sync_regress
    severity: high
    category: spec
    file: src-tauri/src/mux/daemon.rs
    line: 1020
    title: "Replay sync can overwrite a newer live state with an older revision (FR3 monotonicity break)"
    description: "SPEC FR3 requires monotonically increasing per-pane revisions. sync_agent_status_after_snapshot snapshots revisions under the manager lock, drops the lock, then broadcasts them. A live report can acquire the lock and broadcast revision r+1 in that gap; this loop then broadcasts captured revision r. The GUI model stores incoming revision/state unconditionally and regresses to stale state."
    suggestion: "Publish replay updates in the same serialized order as live updates (retain the manager/per-pane sequencing guard), and defensively have the GUI ignore updates whose revision is lower than the pane's current revision."
    sources: [codex:spec]
    confidence: 70
    resolution: deferred
    resolution_reason: "batch mode: rework cap reached"
