    normalized_answer: >-
      ガード領域ごとに、退行前 (base 1d5af0d) の挙動をそのまま再現する。Codex 相談
      (readonly) と実コード読み取りで到達関係を確定した結果、次が事実として確認された。
      handle_mouse_wheel の早期 return は SC-8 より前に (1) profile_selector.visible、
      (2) タブバー帯 (TITLE_BAR_HEIGHT <= y < top_strip_h)、(3) mux サイドバー の
      3 つを egui へ流している。したがってホイールで SC-8 拒否アームに実際に到達して
      被害が出ているのは CSD タイトルバー帯 (y < TITLE_BAR_HEIGHT) / 下端ストリップ /
      スクロールバーオーバーレイ / リサイズ帯 の 4 つだけである。
      押下側の早期 return は構造が異なり、上部帯 (タイトルバー + タブバー) と
      profile_selector はボタン非依存で return、下端 / スクロールバー / サイドバー /
      リサイズは左押下のみ return する。よって退行前に中押下が PRIMARY ペーストへ
      到達していたガード領域は 下端ストリップ / スクロールバーオーバーレイ /
      mux サイドバー / 上部帯と重ならないリサイズ帯 の 4 つであり、CSD タイトルバー帯と
      タブバー帯は退行前も到達していない。
      実装方式は Codex 推奨の (ii) 領域別分岐を採る。すなわち GridOwnershipInputs の
      in_top_strip を「CSD タイトルバー帯」と「タブバー帯」に分解し、decide_* が
      領域ごとに返すアームを変える。早期 return の到達不能性に依存する (i) 案は、
      将来ガード順序が変わった時にタブバーの横スクロールやサイドバー一覧スクロールが
      端末スクロールへ誤分類されるため採らない。
