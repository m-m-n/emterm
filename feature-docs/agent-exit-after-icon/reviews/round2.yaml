  - stable_id: b58e0d47f3c2916a
    severity: high
    category: architecture
    file: src-tauri/src/mux/upgrade.rs
    line: 432
    line_end: 441
    title: "rewrite_handoff_file が『部分書き込みを残さない』不変条件を持たない二重ライタで、失敗時に有効な handoff 文書を破壊する"
    description: >-
      handoff ファイルの書き込みはこれまで write_handoff_file → create_handoff_file
      (create_new + 0600 + O_NOFOLLOW) → write_bytes_or_remove (部分書き込み時は
      ファイルを削除) の 1 経路に集約され、その不変条件は
      write_bytes_or_remove_cleans_up_the_file_when_the_write_itself_fails で
      テストまで固定されていた。task0006 が追加した rewrite_handoff_file は
      同じ成果物に対する 2 本目のライタで、OpenOptions::write(true).truncate(true) で
      先に中身を捨て、write_all が失敗しても復旧・削除をしない
      (加えて O_CREAT なしの .mode(0o600) は無効指定)。呼び出し側 daemon.rs は
      Err を log::warn するだけで exec に進むため、ENOSPC/EIO 等で途中失敗すると
      切り詰められた handoff ファイルを後継プロセスへ引き継ぐ。後継は
      decode_handoff_document で Malformed を受け取り bind_fresh_listener に
      フォールバックするため、latch どころかセッションツリー全体
      (全 pane のシェル、継承済み master fd、scrollback) を失う。
      rework 前はこの書き戻し経路自体が存在せず、snapshot 失敗時は
      prepare_upgrade が Err を返して upgrade を中止していたので、
      task0006 が持ち込んだ純粋な退行。
    suggestion: >-
      in-place truncate をやめ、同一ディレクトリの一時ファイル
      (既存 create_handoff_file と同じ 0600 / O_NOFOLLOW / create_new) に
      書き切ってから rename(2) で原子的に差し替える。rename 成功まで元の
      (stale だが decode 可能な) 文書が無傷で残るため、呼び出し側の
      warn 継続がそのまま安全になる。
    sources: [claude:architecture, codex:architecture, claude:comprehensive, claude:spec, codex:spec]
    confidence: 100
    resolution: fixed
    resolution_reason: >-
      auto-applied round 2 loop 1。既存ヘルパ (create_handoff_file /
      write_bytes_or_remove) を再利用した temp + rename(2) 方式に置換し、
      「書き込み失敗時に既存文書がバイト単位で無傷に残る」ことを固定する
      回帰テストを追加。再レビュー (claude:architecture / claude:comprehensive /
      codex:architecture) で修正の成立と副作用なしを確認済み。

  # ── 残存 critical/high (batch rework cap 到達により deferred) ────────
  - stable_id: 2e6f18b4dc0a7593
    severity: high
    category: spec
    file: src-tauri/src/mux/upgrade.rs
    line: 365
    line_end: 376
    title: "hot-upgrade の refresh 後〜exec 間に sub-second のイベント取りこぼし窓が残る (FR6)"
    description: >-
      task0006 は prepare_upgrade の return 直前で live 状態を再読込して handoff を
      書き直すことで、支配的な窓 (UPGRADE_ANNOUNCE_ACK_TIMEOUT = 最大 2 秒の
      ack 待ち) を閉じた。ただし pane reader スレッドは async runtime 外の
      std::thread で、prepare_upgrade が返った後も exec まで PTY バイトを読み続け、
      run_agent_status_task にマークを送り続ける。そこで live D が適用されると
      pane の latch は command_ended=true になるが、handoff 文書は refresh 時点の
      armed かつ !command_ended のまま。後継プロセスはその古い latch を復元し、
      次に届く A では発火しない — SPEC FR6 が名指しする
      「live D と対の A の間の upgrade で pending な推論 Clear が黙って落ちる」
      挙動そのもの。残る窓は async unwind + 最大 500ms の shutdown 猶予で
      sub-second、発生確率は低い。
      なお claude:spec は同じ経路を medium と評価し
      「受容するなら SPEC の Known Limitations に明記すべき残件」と判定しており、
      codex:spec の high 評価と実質の指摘内容は一致、重大度の見立てだけが割れている。
      task0006 の実装者自身も、完全な解決には mux::ipc::pty_spawn の
      reader スレッド quiesce が必要でタスクの単一ファイル範囲を超えると
      自己申告している。
    suggestion: >-
      (a) 受容する場合: SPEC の Known Limitations に
      「hot-upgrade の最終 sub-second 窓に届いた D/A は引き継がれない
      (安全側に倒れる = アイコンが残る)」を追記する。
      (b) 閉じる場合: pane reader に協調的な quiesce フラグを追加し、
      prepare_upgrade が (1) reader 静止 → (2) refresh_live_agent_state →
      (3) rewrite_handoff_file → (4) return の順で実行する。
      静止は exec までなのでスループット影響はない。
    sources: [codex:spec, claude:spec]
    confidence: 65
    resolution: deferred
    resolution_reason: >-
      batch mode: rework cap reached (batch.review_rework_count == 1)。
      category が spec のため R4 auto-fix の候補ゲート (category != spec) にも
      掛からない。失敗側に倒れず「アイコンが残る」= この feature 以前の挙動に
      戻るだけなので、劣化ではなく改善の取りこぼし。人間評価者の判断に委ねる。

