    file: src-tauri/src/mux/daemon.rs
    line: 1066
    line_end: 1076
    title: "prepare_upgrade の注入シーム (probe / snapshot) を task0006 の後追い書き込みだけがバイパスしている"
    description: >-
      prepare_upgrade は probe / snapshot を関数パラメータとして注入する設計で、
      「実バイナリや実セッションツリー内部なしに全分岐をテストできる」ことが
      設計上の売りになっている。task0006 が追加した refresh_live_agent_state /
      rewrite_handoff_file 呼び出しはこのシームを通らず具象関数を直接呼ぶ。
      実害として、既存の prepare_upgrade 系ユニットテストは
      ファイルを書かないフェイク snapshot を渡すため、新しい rewrite_handoff_file は
      必ず ENOENT で失敗して warn ログを出す失敗分岐しか通らない。
      本番クリティカルな「exec 直前の再書き込み」経路がこの関数のテストから
      一切カバーされない。
    suggestion: >-
