schema_version: 1
feature: osc52-clipboard-write-drain
created: '2026-11-08'
base_branch: main
goal: |
  # OSC 52 の書き込みがシステムのクリップボードに反映されない

  種別: バグ

  ## 現象
  OSC 52 の書き込み（`ESC ] 52 ; c ; <base64> ST`）を受け取っても、システムのクリップボードに反映されない。

  `handle_clipboard` は解析・サイズ制限まで行い、結果を `pending_clipboard_writes` に積む。このキューを取り出して `set_clipboard` に渡す処理がどこにも無い。取り出されないため、書き込みのたびにキューが伸び続ける。

  Claude Code（2.1.319 で確認）は全画面モードでドラッグ選択した文字列を自動コピーし、その際に OSC 52 を出力する。SSH 先では wl-copy / xclip 等が使えず OSC 52 だけが経路になるため、コピーされない。Claude Code 側は「sent N chars via OSC 52」と表示するので、コピーできたように見える。

  ## 再現手順
  1. eMterm で SSH 先に入る（または wl-copy / xclip が無い環境）
  2. `printf '\e]52;c;%s\a' "$(printf hello | base64)"` を実行する
  3. クリップボードを貼り付ける → `hello` にならない

  ## 期待する挙動
  OSC 52 の書き込みがシステムのクリップボードに反映される。OSC 52 のクリア（空ペイロード）も反映される。

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所
  - `src-tauri/src/callbacks.rs:1160` `handle_clipboard`（キューに積むだけ）
  - `src-tauri/src/callbacks.rs:966` `pending_clipboard_writes`
  - `src-tauri/src/window_host/mod.rs:732` `set_clipboard`
  - `f1f46b30`（native-poc Phase 6）で導入されて以来、取り出し処理が無い
  - 同じく取り出されなかった OSC 9 のバッファは `c40699d3` で削除済み
  - `pending_clipboard_reads`（OSC 52 の読み取り照会）も取り出されていない
  - mux 経由で OSC 52 が届くかは未確認

  ## 実害・発生条件
  - SSH 先で動く Claude Code のドラッグ選択コピーが効かない
  - ローカルでは Claude Code が wl-copy / xclip で直接コピーするため、現状は動いて見える

  ## 追加指示
  - 不明点は Codex に相談し、比較してより良いと判断した選択肢を採用する
