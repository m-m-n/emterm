    title: "lookup_group_by_gid が gr_mem の非 NULL を検証せず null 参照しうる"
    description: >-
      `let mut cursor = grp.gr_mem;` の直後に `while !(*cursor).is_null()` で無条件参照している。
      glibc の files/sss バックエンドは成功時に必ず配列を返すが、gr_mem 自体の非 NULL 性は POSIX の
      保証ではなく、サードパーティ NSS バックエンドが NULL を残すとこの unsafe ブロックは NULL
      デリファレンスになる。この関数は execve ゲートの同期パス上にあるため、失敗は daemon クラッシュ
      = 全ペイン喪失に直結する。同ファイルの他経路はすべて None を返して fail-closed に倒している。
    suggestion: >-
      cursor が NULL のとき None を返す早期リターンを追加する（NFR2 の fail-closed に揃える。
      「メンバ無し」として読むと FR1 の免除がより緩くなるため、lookup 失敗と同じ扱いにする）。
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium severity; auto-fix gate は critical/high のみ。修正 diff は finding に添付済み"
