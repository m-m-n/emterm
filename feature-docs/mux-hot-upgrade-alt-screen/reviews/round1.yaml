    title: "復元された alt_screen=true がスクロールバックゲートを恒久的に閉じうる（refresh→exec 間の alt 離脱レース）"
    description: >-
      refresh_live_agent_state が exec 直前に capture_alt_state() を再読した後、exec までの間に
      子プロセスが ESC[?1049l を出して旧 daemon の reader がそのバイトを消費すると、その状態は
      書き出し済みの handoff document に反映されない。exec 後の新 daemon は document どおり
      alt=true で shadow parser を復元し、?1049l バイトは二度と届かないため、
      pty_spawn.rs の extract_main_buffer_bytes に渡る alt_before が true のまま固着する。
      結果としてそのペインの main-buffer 出力は以後すべてスクロールバックから黙って捨てられ、
      reattach スナップショットも alt ブランチを取り続ける。次に TUI が ?1049h/?1049l を出すまで
      自然回復しない。本変更前は復元後の parser が常に main だったためこの固着状態は存在しなかった。
    suggestion: >-
      (a) 復元した alt 状態を暫定として扱い、from_restored 後の最初のライブバイト処理までは
      スクロールバックゲートを alt で閉じない。(b) refresh_live_agent_state の直前に reader スレッドを
      定義されたバイト境界で停止させる。(c) 最低限、無言のデータ損失を検知可能にする警告ログを入れる。
    sources: [claude:comprehensive]
