  - stable_id: r1-p1
    severity: high
    category: performance
    file: src-tauri/src/render/cursor.rs
    line: 421
    title: "per-frame ColorImage / pixel Vec allocations even on TextureHandle cache hit break NFR1"
    description: >-
      paint_overlay_glyph builds egui::ColorImage::from_rgba_unmultiplied
      unconditionally before get_or_create_overlay_texture checks the cache.
      resolve_overlay_glyph also always calls extract_region_rgba, allocating
      a fresh Vec<u8>. Both are discarded on cache hit — hundreds of KB/s
      churn at 60fps for the blinking cursor.
    suggestion: >-
      Split resolve_overlay_glyph into (a) meta-only lookup returning the
      GlyphKey and geometry, and (b) pixel extraction called only on cache
      miss inside the loader closure. Add a regression test that
      extract_region_rgba (or its allocation) is not invoked on the second
      call for the same glyph.
    sources: [claude:performance]
    confidence: 60
    resolution: fixed
    resolution_reason: "routed to task0002 rework"
