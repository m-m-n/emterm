    suggestion: >-
      Extract the tint-selection step into a pure helper
      overlay_tint_for_cell(...) that mirrors paint_overlay_glyph's branch and
      have both draw_block_cursor and the tests call it.
    sources: [claude:comprehensive]
    confidence: 60
