- question_id: create-plan.ac3-extraction-condition
  packet_id: null
  answered_at: '2026-09-21T12:05:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - adopt_d2_and_correct_ac3_wording
  freeform: null
  normalized_answer: adopt decision D2 and apply a minimal orchestrator post-validation correction to AC-3's Check wording in SPEC.md and REQUIREMENTS.md
  resolution_note: >-
    Unlisted-gate fallback (no gate_id at the originating site; the planner
    returned it as a warning, not a question packet). Raised by the
    orchestrator during create-plan validation, per the user's standing
    instruction for this run to consult Codex on unclear points and adopt the
    option judged comparatively better. codex_consulted: true; harness entry:
    codex (run_codex_exec.sh readonly); turns used: 2; Opus escalation: not
    run. --- THE POINT: SPEC.md AC-3's Check text reads "a two-way set diff
    between the names extracted from the three documents and the 25 `fn` names
    in src-tauri/src/window_host/tests.rs between the `AC-3/TS-1` section
    marker (tests.rs:6000) and end of file (tests.rs:6776) is empty". Extracted
    literally, that span yields 31 `fn` names: the 25 carrying `#[test]` plus 6
    fixture/helper builders that do not (tests.rs:6127 fake_params, 6414
    default_held_value_tokens, 6424 shadow_host_prelude_tokens and three
    others). The criterion's own stated count (25) and its own stated subject
    ("the implementation's added test set") therefore contradict its
    mechanical Check text. The planner resolved this one-sidedly as decision
    D2 ("the `#[test]`-annotated functions in that span") and left AC-3
    unchanged. --- TURN 1 asked Codex to choose between A (adopt D2, leave
    AC-3 as written) and B (amend AC-3 before planning completes). Codex
    picked B: the count 25 and the phrase "the implementation's added test
    set" already support D2's reading, but a Check that yields 31 when run
    verbatim leaves a later verifier free to compute a different set, and
    annotating some other document does not remove the discrepancy inside
    AC-3 itself. --- TURN 2 restated two constraints that turn 1 had
    understated: (i) the only defined transition back to create-spec in this
    workflow is the rework phase's specification-change transition, reachable
    from review and verify, so create-plan cannot legally enter it -- taking B
    as written would mean stopping the unattended run or inventing an
    undefined transition; (ii) the orchestrator has an established, recorded
    practice of minimal post-validation edits to phase artifacts (precedent:
    the previous feature's create-plan phase-state records orchestrator edits
    to the planner's IMPLEMENTATION.md, task plan and VERIFICATION.md). Given
    those, the options offered were A (unchanged), C (adopt D2 AND correct
    AC-3's Check wording in place, recorded in phase-state, no create-spec
    round trip), and B' (stop the run and hand AC-3 back to a human). Codex
    picked C: it preserves the count, the requirement set and AC-3's intent
    while making the extraction condition literally executable, and it
    resolves the discrepancy without an undefined transition or an
    interruption. --- ADOPTED: C. NOT ADOPTED: A (leaves SPEC wording and the
    operative check disagreeing); B/B' (no legal route from create-plan, and
    the cost is a stopped unattended run for a wording fix that changes no
    requirement). --- APPLIED: SPEC.md AC-3 and REQUIREMENTS.md's AC-3
    checklist entry now read "the names of the 25 `#[test]`-annotated
    functions in ..." and state explicitly that fixture and helper functions
    in the same span are excluded. IMPLEMENTATION.md's Open Questions entry is
    marked resolved and points here. No FR/NFR, no acceptance-criterion
    intent, and no count changed. --- RESIDUAL RISK Codex named: the cited
    precedent covers planning artifacts rather than SPEC.md, so applying it to
    SPEC.md is a judgment call; and a correct extraction condition still does
    not by itself guarantee the two-way set diff comes out empty -- that is
    what this feature's TS-3 checks.
- question_id: implement.once-boundary-vs-pr-instruction
  packet_id: null
  answered_at: '2026-09-21T12:14:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - stop_at_once_boundary_no_pr
  freeform: null
  normalized_answer: stop at the implement phase boundary per --once; do not push or open a PR in this launch
  resolution_note: >-
    Unlisted-gate fallback (no gate_id at the originating site; raised by the
    orchestrator, not by a worker packet). Consulted per the user's standing
    instruction for this run to consult Codex on unclear points and adopt the
    option judged comparatively better. codex_consulted: true; harness entry:
    codex (run_codex_exec.sh readonly); turns used: 1; Opus escalation: not
    run. --- THE POINT: this launch carried `--batch --once --pr` AND a
    free-text instruction "Once the implementation is finished, push the
    integration branch to the remote and create a Pull Request against
    base_branch with gh pr create." `--once` ends the turn at one phase
    boundary; `--pr` only takes effect in a launch that actually reaches Step
    C, and review / verify / retrospect had not run. Read one way the
    free-text asks for a PR immediately after implement; read the other way it
    merely describes the completion MODE that `--pr` already encodes. ---
    OPTIONS: (A) stop now at the implement boundary, create no PR, leave
    review / verify / retrospect to later launches; (B) treat the free-text as
    overriding `--once` and push + open the PR immediately, skipping review /
    verify / retrospect. --- ADOPTED: A. Codex judged A comparatively better
    on three grounds: `--once` is an explicit, unambiguous per-launch
    instruction and implement had just completed; the free-text reads
    naturally as the same completion mode `--pr` encodes ("no merge, open a
    PR, keep the branch") rather than as an instruction to skip defined
    phases; and merging three tasks into the integration branch does not by
    itself establish that the artifact is correct, which is what review and
    verify exist to check. B would publish an unverified artifact and skip
    defined phases. --- NOT ADOPTED: B. Reversibility was weighed both ways:
    a push and a PR are undoable, but cleanup after publication costs more
    than resuming from a preserved local branch. --- CONSEQUENCE: no push, no
    `gh pr create`, no merge in this launch. The PR is created in the launch
    that actually reaches Step C, which must itself carry `--pr` (the flag is
    per-launch and is not carried over).
- question_id: review.muse-spark-tier-read-mapping
  packet_id: null
  answered_at: '2026-09-21T12:21:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - contributor_tier
  freeform: null
  normalized_answer: dispatch the spec perspective's muse-spark chain entry as the contributor tier
  resolution_note: >-
    Autonomous fail-closed-route resolution (no gate_id at the originating
    site; raised by the orchestrator during review Phase R2 fan-out, not by a
    worker packet). Consulted per the user's standing instruction for this run
    to consult Codex on unclear points and adopt the option judged
    comparatively better. codex_consulted: true; harness entry: codex
    (run_codex_exec.sh readonly); turns used: 1; Opus escalation: not run.
    --- THE POINT: two SSOTs in the same rule set conflict on which LiteLLM
    tier a review dispatch may use. `references/reviewers.yaml` +
    `references/review-phase.md` define a "Contributor-tier read-mapping":
    when `muse-spark` is the chain entry the registry selected, reading it as
    the contributor tier is permitted after two checks pass -- consent
    recorded (mechanical, via the consent store) and a per-dispatch judgment,
    whose stated default is to USE the contributor tier. The vertex-review
    plugin's `litellm-harness` skill states the opposite as a flat
    prohibition: "レビューはプライベートなコードを送るため muse-spark
    (Standard) を使う。muse-spark-contributor をレビューに使ってはいけない"
    (contributor tier = the input may be used for model training).
    --- OPTIONS: (A) contributor tier -- reviewers.yaml is the more specific
    authority for which model each perspective gets, it defines the
    read-mapping explicitly, its per-dispatch default is "use", and every
    scope-exclusion clause is satisfied; (B) standard tier -- a flat
    prohibition should win over a permissive default.
    --- MECHANICAL CHECK (performed before dispatch): `muse_guard.py
    --project-dir <repo> --list` returned the project key, i.e. consent IS
    recorded for this repository.
    --- PER-DISPATCH JUDGMENT (performed before dispatch): the reviewed diff
    is documentation-only -- test-function names in three Markdown design
    documents realigned to test functions that exist in
    src-tauri/src/window_host/tests.rs. No secrets or credentials, no
    third-party or vendored code, no unpublished design idea that is the
    project's differentiator. None of the scope exclusions applies.
    --- ADOPTED: A. Codex judged A comparatively better: reviewers.yaml /
    review-phase.md are the more specific authority because they directly
    govern per-perspective model selection and the consent-plus-judgment
    read-mapping, so the harness skill's prohibition is better read as a
    general default that the consent mechanism overrides than as an absolute
    the registry cannot override. Codex attached one condition -- an MIT
    license does not by itself establish that the repository is public, and a
    private repository falls under the scope exclusion.
    --- CONDITION VERIFIED: `gh repo view --json visibility,licenseInfo`
    returned visibility PUBLIC and MIT License for m-m-n/emterm, so the
    exclusion does not apply and the condition holds. No correction needed
    going forward.
    --- NOT ADOPTED: B. It would have been the smaller-side-effect option in
    the abstract, but the consent store had already recorded the user's
    decision for this repository, so B would discard a decision the user
    made deliberately through the only interactive path that records it.
    --- CONSEQUENCE: run spec#0 was dispatched to
    vertex-review:vertex-reviewer with model muse-spark-contributor, recorded
    as such in reviews/round1.yaml `perspective_runs`. The acknowledged
    downside is that the submitted input may be used for model training; the
    input was three Markdown documents from a public MIT repository.
