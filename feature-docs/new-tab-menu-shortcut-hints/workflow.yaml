schema_version: 1
feature: new-tab-menu-shortcut-hints
created: '2026-10-03'
base_branch: main
goal: '+ アイコンのメニュー項目の右に、項目を開くショートカットを表示する


  ## やりたいこと (必須)

  メインウィンドウの + アイコンをクリックして表示されるメニューの項目の右側に、その項目を開くショートカットを表示する。

  - 「グローバル設定」の項目の右: グローバル設定を開くショートカット（現在の設定では Ctrl+Shift+G）

  - デフォルト項目の右: デフォルトを開くショートカット（現在の設定では Ctrl+Shift+T）

  ## 背景・なぜ (必須)

  - アイコンのメニューには「グローバル設定」とプロファイルで設定した項目が表示されるが、各項目に割り当てられたショートカットが表示されていない。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 「グローバル設定」の項目の右に、グローバル設定を開くショートカットが表示される

  - [ ] デフォルト項目の右に、デフォルトを開くショートカットが表示される

  - [ ] 表示されるショートカットは現在のキー設定の値に従う

  ## スコープ外 (任意)

  \<今回やらないこと。あれば\>

  ## 制約・前提 (任意)

  \<触ってほしくない箇所 / 使う技術 / 互換性など。あれば\>

  '
