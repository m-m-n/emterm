findings:
  - stable_id: afdb7bee655251a6
    severity: medium
    category: comprehensive
    file: src-tauri/src/ui/keybinds.rs
    line: 431
    title: "reachable_label ignores the fixed Shift+PageUp/PageDown/Home/End scrollback chords, so the chooser can show a hint that does not open anything"
    description: "KeybindTable::reachable_label hides a label only when collisions() shows a higher-priority KeybindTable action with the same chord. window_host/key_routing.rs::handle_special_chord runs before keybinds::dispatch and consumes Shift-only PageUp/PageDown/Home/End for scrollback without consulting the table. With keybinds.new_tab = \"Shift+Home\" (or new_tab_global set to any of the four), the chooser shows the label but pressing it scrolls and opens no tab. The code matches SPEC FR6's listed conditions but not FR6's general rule / US3. The mux prefix intercept (observe_mux_key) can hide a chord the same way (dynamic)."
    suggestion: "In reachable_label, also treat the chord as shadowed when it equals one of the four fixed Shift-only scrollback chords; define them once as a shared constant/helper also used by handle_special_chord; add tests for new_tab and new_tab_global bound to each of the four chords; narrow the doc comment."
    sources: [claude:comprehensive]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium severity: outside the auto-fix candidate gate (critical/high only); filed as a follow-up task"
