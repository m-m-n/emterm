schema_version: 1
feature: ring-push-blank-note-unconditional
created: 2026-09-04
base_branch: main
goal: |
  term_core: ring_push_blank テストの冗長性 NOTE がフィクスチャ依存だと誤記している

  ## 現象（必須）
  `test_ring_push_blank_clears_recycled_row_overflow_entries` に追加した冗長性 NOTE が、常に成立する性質を「このフィクスチャでは」と限定して書いている。
  ```rust
  // NOTE: removing only ONE of the two clearing sites inside
  // `ring_push_blank` (the eviction-time clear or the new-bottom-row
  // clear) still leaves this test green, because within a single push in
  // this 2-row, zero-scrollback fixture the new bottom absolute row
  // equals the evicted absolute row — the two clearing sites are
  // mutually redundant for this fixture, not independently pinned by it.
  ```
  実際には `crates/term_core/src/ring_buffer.rs` の Step 2/3 が
  ```rust
  self.ring_head = (self.ring_head + 1) % rows;
  let new_bottom_abs = (self.ring_head + rows - 1) % rows;
  ```
  の順で評価されるため、`new_bottom_abs` は代数的に回転前の `ring_head`（= `evicted_abs`）へ必ず戻る。`rows` と `scrollback_capacity` の値によらず一致するので、フィクスチャ条件は無関係。

  ## 再現手順（必須）
  1. `crates/term_core/src/ring_buffer/tests.rs` の `test_ring_push_blank_clears_recycled_row_overflow_entries` 末尾にある NOTE を読む
  2. `crates/term_core/src/ring_buffer.rs` の `ring_push_blank` の Step 2 / Step 3 と読み比べる

  ## 期待する挙動（必須）
  NOTE から「in this 2-row, zero-scrollback fixture」の限定句を外し、`new_bottom_abs = (ring_head + rows - 1) % rows` が `ring_head` の前進後に評価されるため常に回転前の `ring_head` へ戻ること、したがってどのビューポート高さ・どのスクロールバック容量でも 2 つの clear site は相互に冗長であり、いかなるフィクスチャでも個別には固定できないことを書く。

  ## 完了の定義（必須）
  - [ ] NOTE の限定句が外れ、無条件に成立する理由（評価順序）が書かれている
  - [ ] `feature-docs/ring-push-blank-row-scope-test/SPEC.md` の FR6、`VERIFICATION.md` の MT3、`test-docs/ring-push-blank-row-scope-test/task0001.tests.yaml` の AC-5 と記述が一致している
  - [ ] `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path crates/term_core/Cargo.toml --lib` が green
  - [ ] `cargo fmt --manifest-path crates/term_core/Cargo.toml --check` が clean

  ## 該当箇所（任意）
  `crates/term_core/src/ring_buffer/tests.rs:517-522`（NOTE）、`crates/term_core/src/ring_buffer.rs:203-224`（2 つの clear site）

  ## 実害・発生条件（任意）
  - 将来の読者が「行数を増やす／スクロールバックを付ければ 2 つの clear site を個別に固定できる」と誤解して、不可能な作業に着手する
  - `ring_buffer.rs` の new-bottom-row クリアが単一 push 内では常に no-op（実質デッドコード）であるという事実が NOTE の限定句に隠れる
  - SPEC FR6 / VERIFICATION MT3 / tests.yaml AC-5 はいずれも無条件の記述であり、コメントだけがドリフトしている

  由来: feature `ring-push-blank-row-scope-test`（PR: https://github.com/m-m-n/emterm/pull/48）のレビュー round 1、comprehensive 観点 finding `680d60eb138fc30b`（medium / confidence 65）。severity が medium で auto-fix ゲート（critical/high のみ）の対象外だったため deferred とした。記録は `feature-docs/ring-push-blank-row-scope-test/reviews/round1.yaml`。
