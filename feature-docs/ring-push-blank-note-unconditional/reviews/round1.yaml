    title: "NOTE の「new-bottom-row clear は常に no-op」は Step 3 ブロック全体には当てはまらない"
    description: |
      書き換えられた NOTE の結論文が、テストの感度に関する記述（片方を消してもグリーンのまま）から、
      製品コードに対する断定（The new-bottom-row clear is therefore always a no-op）へ踏み込んでいる。
      この断定が正しいのは Step 3 の overflow / overflow_ridx クリア対だけで、Step 3 ブロック全体では
      成り立たない。ring_buffer.rs の ring_push_blank Step 3 は (a) slice.fill(Cell::EMPTY / bce) による
      セル消去、(b) self.ring_wrapped[new_bottom_abs] = false、(c) overflow / overflow_ridx クリア、の
      3 つを行う。Step 1 の 3 分岐はいずれも overflow 側しかクリアせず、ring_wrapped への書き込みは
      関数内で 1 箇所のみ、セル消去も Step 3 のみ。つまり (a)(b) は eviction 側に対応物が存在せず
      no-op ではない。new_bottom_abs == evicted_abs という NOTE の中核主張自体は正しい。問題は、その
      正しい前提から the new-bottom-row clear is always a no-op という広すぎる結論を導いている点。
    suggestion: |
      結論文を overflow クリアに限定し、セル fill と ring_wrapped リセットには eviction 側の対応物が
      無く冗長ではない旨を 1-2 行追記する。
