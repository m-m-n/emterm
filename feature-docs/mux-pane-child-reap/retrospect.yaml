lessons_candidates:
  - note: >
      同一サイト (pty_spawn.rs の spawn 後・pane 登録前の中断パス) を
      architecture / spec / comprehensive の 3 観点が独立に medium で指摘した。
      3 観点合意にもかかわらず R4 の auto-fix ゲートは severity ∈ {critical, high}
      なので候補にならず、residual_critical_high == 0 で review が completed になる。
      「複数観点が独立合意した medium」を昇格させるか、少なくとも完了報告で
      強調する仕組みがあると、この種の不変条件の穴が素通りしにくい。
  - note: >
      指摘の性質が「この feature が確立しようとしている不変条件そのものの穴」
      （spawn した child は必ず reap される、が spawn 直後の中断パスで破れる）
      だった。severity 判定が「発生頻度」に引っ張られて medium になったが、
      feature の Success Criteria (「No pane-teardown path bypasses the reap」)
      への直接違反という軸で見ると評価が変わりうる。severity 判定基準に
      「SPEC の Success Criteria に直接違反するか」を加える余地がある。
  - note: >
      integration worktree / task worktree の双方で、gitignore 対象の
      src-tauri/assets/fonts/ にバンドルフォントが存在せず、承認済み test コマンド
      （examples/ をコンパイルする）が通らなかった。implementer も verify も
      個別にメインツリー / システムフォントからコピーして回避しており、同じ手戻りが
      2 回発生した。worktree 作成直後に gitignored なビルド前提物を同期する
      ステップがあると解消する。なお `cargo test --lib` は examples/ を
      ビルドしないため影響を受けない。
  - note: >
      codex CLI がこの環境に無いため、create-spec の Codex 相談ループと
      review の codex クロスバリデーション（complexity: high で発火条件は成立）が
      両方スキップされた。batch 実行の品質保証が Claude 単独になる点は、
      無人実行環境のプロビジョニング要件として記録しておく価値がある。
