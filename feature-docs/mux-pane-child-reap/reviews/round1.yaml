  - stable_id: 8cd4a69dd9cfd6a1
    severity: medium
    category: security
    file: src-tauri/src/mux/session/child_reaper.rs
    line: 71
    line_end: 89
    title: "try_wait() エラー時の無条件 kill escalation は他プロセスへ SIGKILL を撃ちうる"
    description: >
      `reap_child_blocking` は `child.try_wait()` が `Err` を返した瞬間に kill へエスカレート
      し、エラー種別を区別せず `child.kill()`（unix では SIGKILL）を発行する。`try_wait()` の
      `Err` で現実的に起きるのは `ECHILD`（その子はもう自分の子ではない＝既に誰かに回収済み）。
      std 側の pid 再利用ガードは std 自身が wait 済みの場合しか効かないため、外部で回収されて
      いた場合は保持している pid が既に別プロセスへ再利用されている可能性がある。成立条件は
      「daemon で SIGCHLD が SIG_IGN として継承されている／別経路で waitpid(-1) される」で、
      現行コードベースには SIGCHLD ハンドラも waitpid(-1) も無いため現行デプロイでは踏まない。
      ただし「状態を確認できなかった pid に SIGKILL を撃つ」は同一 uid の無関係プロセスを
      落としうる古典的アンチパターン。ログ出力は pane_id と io::Error のみで機密情報の混入は
      なく、攻撃者が任意プロセスの kill を誘発できる経路も無い。
    suggestion: >
      `Err(e)` アームで「子が既にいない」ことを示すエラーを kill 対象から外す。
      `#[cfg(unix)]` ガード下で `e.raw_os_error() == Some(libc::ECHILD)` なら warn を出して
      return し、それ以外の「判定不能」は SPEC どおり kill へ進める（`libc` は
      `[target.'cfg(unix)'.dependencies]` なので cfg ガード必須）。SPEC のエラー表が
      「判定不能 → kill」を要求している点との整合は、ECHILD が「判定不能」ではなく
      「対象が存在しない」であるとして SPEC 側に注記を足す。
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
