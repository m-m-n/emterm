    title: "reap スレッド spawn 失敗時に child handle が wait されずに落ち、ゾンビが恒久的に残る"
    description: >
      `spawn_reaper` は child を `move` クロージャに入れて `Builder::spawn` する。spawn が
      失敗すると `io::Result` は `Err` だけを返し、クロージャごと child handle がドロップ
      される（`Err` 側から handle を回収する手段がない）。portable-pty の Unix child は
      Drop で `wait()` しないため、そのプロセスは `<defunct>` として恒久的に残る。
      `MuxPane::mark_exited` は既に `take()` 済みで pane 側にも handle が残らず、後続の
      teardown でのリトライ余地もない。thread spawn の失敗（EAGAIN / ENOMEM）はスレッド・
      プロセス数が逼迫している時にこそ起きるため、リークが起きやすい状況とリークが増える
      方向が一致する。あわせて構造上の非効率が 1 点: 支配的な teardown 経路
      （PTY EOF → pane-exit task → handle_destroy_pane → mark_exited）では child は既に
      exit 済みで `try_wait()` 一回で回収できるにもかかわらず、必ず OS スレッドを 1 本立てて
      いる。
    suggestion: >
      (a) spawn 前に非ブロッキングの高速回収パスを置く: `spawn_reaper` の冒頭で
      `child.try_wait()` を一度呼び、`Ok(Some(_))` ならその場で回収完了として return する。
      ブロックしないので NFR1 を壊さず、スレッド生成を生きている child の場合だけに限定できる。
      (b) spawn 失敗時に handle を回収可能にする: child を
      `Arc<Mutex<Option<Box<dyn Child + Send + Sync>>>>` に入れてクロージャには Arc の
      クローンを渡し、`Err` 分岐では `take()` で handle を取り戻して非ブロッキングの
      フォールバック（`kill()` → `try_wait()`）を実行する。
