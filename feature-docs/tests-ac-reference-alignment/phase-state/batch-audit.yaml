schema_version: 1
feature: tests-ac-reference-alignment
records:
  - gate_id: create-spec.requirement-clarification
    raised_by: orchestrator
    question: >-
      完了の定義が二案を並記している。(A) tests.rs の AC 参照を SPEC.md の AC 番号へ
      付け替える / (B) 番号は据え置き、参照がタスクローカル番号である旨を明記する。
      どちらを採るか。
    options:
      - option_id: renumber_to_spec
        label: "(A) SPEC の AC 番号へ付け替える"
      - option_id: annotate_task_local
        label: "(B) タスクローカル番号である旨を明記する"
    chosen: annotate_task_local
    codex_consulted: true
    opus_escalation: false
    resolution_note: >-
      requirements-analyst は ASM-1 として (A) を仮置きしたが、run_codex_exec.sh readonly
      で Codex に実ファイル照合込みで比較させたところ (B) が comparatively better と判定
      された。理由: (1) tests.rs の 1 つの AC ラベルが SPEC の複数 AC に対応する箇所が
      ある（TS-1 は SPEC AC-2 と AC-3、TS-5 は AC-2/AC-3/AC-4）ため、単一の `AC-N` では
      対応を表現できず付け替えは機械的に成立しない。(2) `AC-6(a)(b)(c)` の小項目は
      task0001 にしか存在せず SPEC 側に対応が無い。(3) test-docs/mouse-report-held-
      callsite-test/task0001.tests.yaml がタスク AC 番号をキーにしているため、コード側
      だけ付け替えると既存の対応が切れる。(4) SPEC の AC 番号は将来の spec 改版で
      振り直されうるが、タスクローカル番号は凍結済み。
      引き換えに失うのは「SPEC の AC 番号で直接 grep できる」性質で、Codex もこれは
      (A) の優位点として明示している。
  - gate_id: create-spec.requirement-clarification
    raised_by: orchestrator
    question: >-
      (B) を採るとき、AC ラベルを含むアサーション診断文字列 31 箇所をどう扱うか。
    options:
      - option_id: annotate_each_diagnostic
        label: "(B1) 診断文字列ごとに直前へ出典コメントを追加（31 行増）"
      - option_id: group_banner_only
        label: "(B2) グループ冒頭に宣言を 1 つ置き、診断文字列には触れない"
    chosen: group_banner_only
    codex_consulted: true
    opus_escalation: false
    resolution_note: >-
      Codex 2 回目の相談で (B2) を推奨。失敗ログだけを見る読み手への誤誘導リスクは
      B1 でも解消しない（コメントはログに出ない）ため B1 に固有の優位性が無く、
      テスト本体の signal-to-noise・差分サイズ・レビュー負担で B2 が上回る。
      グループ内へのテスト追加を宣言が自動的に包含する点も B2 の利点。
      宣言の設置位置は tests.rs:5212 の `AC-1..AC-7` 範囲コメント直後。
  - gate_id: create-spec.design-step
    raised_by: requirements-analyst
    question: design ステップを実行するか
    chosen: decide_autonomously
    codex_consulted: false
    opus_escalation: false
    resolution_note: >-
      batch-policies.yaml の create-spec.design-step に従い analyst の推奨
      (skipped) を採用。UI 要素・デザイントークン・ユーザー可視面の変更が無い
      コメント限定変更のため。tier=minimal でも design は削減対象。
  - gate_id: create-spec.design-system
    raised_by: orchestrator
    question: project.design_system の kind と paths
    chosen: project_native
    codex_consulted: false
    opus_escalation: false
    resolution_note: >-
      batch-policies.yaml の create-spec.design-system に従い最上位候補
      doc/UI-DESIGN-GUIDELINES.yaml を採って project_native。
      .claude/rules/ui-design.md が同ファイルを single source of truth と明記。
  - gate_id: null
    question_id: develop.once-pr-conflict
    packet_id: null
    raised_by: orchestrator
    answered_at: "2026-09-21T23:40:00+09:00"
    source: codex-consultation
    answer_mode: select
    question: >-
      起動引数 `--batch --once --pr` と、ユーザー散文「実装完了後に integration
      ブランチを push して gh pr create で PR を作る」が衝突する。`--once` は
      1 フェーズで終了し、`--pr` は全 step 完了後の Step C でのみ効く。
      どちらの読みを採るか。
    options:
      - option_id: honor_once
        label: "(A) --once を字義どおり守る。create-plan のみ実行し PR は作らない"
      - option_id: prose_overrides
        label: "(B) 散文を優先し、retrospect と Step C まで一気に走らせて PR を作る"
    selected_option_ids: [honor_once]
    chosen: honor_once
    codex_consulted: true
    opus_escalation: false
    freeform: "run_codex_exec.sh readonly による比較判定で (A) を採用"
    normalized_answer: "--once を字義どおり守り、create-plan のフェーズ境界で終了する"
    resolution_note: >-
      run_codex_exec.sh readonly で Codex に両案を比較させたところ (A) が
      comparatively better と判定。理由は (1) `--once` は実行範囲の明示指定であり、
      散文は完了後処理を述べるだけで --once の解除を明示していない、(2) 無人実行で
      (B) を採ると明示された実行範囲を推測で拡大することになる。Codex は併せて
      「評価者が PR 作成済みと誤認する / PR 不在を失敗と誤判定する」リスクを挙げ、
      最終報告で「計画作成のみ完了」「Step C 未到達のため push・PR は未実行」
      「--pr は起動間で引き継がれないため Step C に到達する起動で再指定が必要」を
      明記するよう助言。本報告はこれに従っている。
  - gate_id: null
    question_id: implement.range-notation-annotation
    packet_id: null
    raised_by: orchestrator
    answered_at: "2026-09-22T00:00:00+09:00"
    source: codex-consultation
    answer_mode: select
    question: >-
      TASK.md 適用規則 2 の末尾「範囲表記も タスクローカル番号の範囲である旨が
      わかる形にする」を、implementer は範囲表記 `AC-1..AC-7.`（tests.rs:5212）
      自体に手を加えず、その直下 5213-5215 行に置いた規則 1 の宣言で満たしたと
      扱った。これで規則 2 を満たすか。
    options:
      - option_id: declaration_suffices
        label: "(A) 宣言が直下にあるため範囲表記は追記不要。現状で完了"
      - option_id: annotate_range_inline
        label: "(B) 範囲表記にも個別に出典を追記すべき。レビュー前に修正"
    selected_option_ids: [declaration_suffices]
    chosen: declaration_suffices
    codex_consulted: true
    opus_escalation: false
    freeform: "run_codex_exec.sh readonly による実ファイル照合込みの比較判定で (A) を採用"
    normalized_answer: "範囲表記への追記は行わず、直下の宣言で規則 2 を満たすとする"
    resolution_note: >-
      Codex 判定 (A)。根拠: (1) TASK.md 規則 2 は出典の明記と範囲の識別可能性を
      求めるが、同一行への追記までは指定していない。(2) 範囲表記 tests.rs:5212 の
      直下 5213-5215 行に宣言があり、区切り線は 5216 行。同一コメントブロックの
      続きとして出典を明記しており、規則 1 が指定する設置位置とも一致する。
      (3) 対象グループ 5207-6888 行を走査した結果、範囲表記は 5212 行の 1 箇所のみ
      で、未注記の範囲表記は他に無い。
      併せて注記漏れの独立検証も依頼した。`^\s*//.*AC-[0-9]+` で抽出した
      コメント/doc コメントの AC 参照 18 行を全件確認し、範囲表記以外の 17 行は
      15 行が同一行に出典を持ち、5975 行と 6503 行はそれぞれ直後の 5976 行・
      6504 行に出典がある。注記漏れは無い。診断文字列 31 箇所は規則 3 に従い
      対象外。
      (B) を採らなかった代償: 規則 2 が範囲への個別追記を要求するという読みが
      正しかった場合、5212 行への出典追記という手戻りが生じる。実行動作・テスト
      判定には影響しない。

  - phase: verify
    gate_id: null
    gate: "verify Expected Result 判定 — TASK.md の『変更ファイルは tests.rs のみ』条項の読み"
    at: "2026-09-22T00:00:00+09:00"
    options:
      - "PASS: 当該条項をコード変更のスコープ制約 + 別 feature の文書保護と読み、自 feature 固有の作業記録は対象外とする"
      - "FAIL: 当該条項をリポジトリ全体の網羅的な許可リストと読み、test-docs/ の新規ファイルを違反とする"
    chosen: PASS
    codex_consulted: true
    opus_escalation: false
    freeform: "run_codex_exec.sh readonly による比較判定"
    normalized_answer: "verify = pass。test-docs/tests-ac-reference-alignment/task0001.tests.yaml の追加は Expected Result に違反しない"
    resolution_note: >-
      事実確認: (1) 既定の 3 コマンドは全て成功 — cargo check (default) PASS、
      cargo test --lib 3523 passed / 0 failed / 3 ignored (ベースラインと同一)、
      cargo fmt --check PASS。TASK.md が追加で求める
      cargo check --no-default-features も PASS。
      (2) tests.rs の変更行は全て `//` / `///` のコメント行で、非コメント行の
      変更は 0 行。テスト関数名・属性・入力データ・診断文字列・アサーション式・
      走査処理はいずれも不変。
      (3) feature-docs/mouse-report-held-callsite-test/ 配下の変更は無い。
      (4) 自 feature の feature-docs/ 以外で変更されたファイルは 2 件 —
      src-tauri/src/window_host/tests.rs (意図した変更) と
      test-docs/tests-ac-reference-alignment/task0001.tests.yaml (新規)。
      Codex 判定 PASS。採用した読み: 当該条項はコード変更を tests.rs に限定し、
      別 feature の文書を保護する制約であり、自 feature 専用の作業記録は
      対象外とする。根拠: (a) test-docs/<feature>/ は main 上に約 77 件の
      同型ディレクトリを持つリポジトリ全体の既存慣例であり、追加分は本 feature
      自身の検証証跡 (ベースライン/最終のスイート実行結果) を記録する YAML で、
      本 feature のディレクトリ配下に閉じている。(b) 網羅的な許可リストと読むと、
      本ワークフローが必ず書き込む feature-docs/tests-ac-reference-alignment/**
      (workflow.yaml / TASK.md / phase-state/ / reviews/) も同条項に違反し、
      いかなる実行でも条項を満たせなくなる。
      (B) を採らなかった代償: 作業記録ファイルだけを理由に rework ラウンドを
      1 回消費する。確認済みのコード変更違反も文書保護違反も無い状態での手戻りで
      あり、実害に見合わない。
      残存リスク: 条項の文言には作業記録を除外する条件が明記されていない。

  - phase: verify
    gate_id: null
    gate: "verify build_command 実行 — worktree に bundled font が無くビルド前提が未充足"
    at: "2026-09-22T00:05:00+09:00"
    options:
      - "workflow.yaml の build_command を素で実行する（build.rs が font_missing で panic するため失敗）"
      - "同じ cargo check を含む承認済み複合コマンドを実行してフォント取得と web バンドル生成を先に済ませる"
      - "verify を fail として記録する"
    chosen: "承認済み複合コマンドを実行"
    codex_consulted: false
    opus_escalation: false
    freeform: "承認済みコマンド一覧との照合のみで決定。新規承認は発生していない"
    normalized_answer: >-
      `bash scripts/fetch-fonts.sh && bun install && bun run build:viewer &&
      bun run build:settings && CARGO_TARGET_DIR=src-tauri/target cargo check
      --manifest-path src-tauri/Cargo.toml` を実行した
    resolution_note: >-
      workflow.yaml の build_command を素で実行したところ build.rs が
      `build_rs.font_missing: bundled font missing at assets/fonts/Noto-COLRv1.ttf`
      で panic した。worktree に bundled font と web バンドルが未取得だったためで、
      実装内容とは無関係な環境要因。上記の複合コマンドは bash_guard.py --list に
      既に載っている承認済みリテラルであり、末尾は build_command と同一の
      cargo check。新規のコマンド承認は一切発生していない。実行後は
      cargo check / cargo test --lib / cargo fmt --check のいずれも成功。

  - phase: retrospect
    gate_id: null
    gate: "--once と --pr の相互作用 — retrospect 完了と同一ターンで Step C(push + gh pr create) を実行するか"
    at: "2026-09-22T00:20:00+09:00"
    options:
      - "(A) retrospect のみ実行し --once 境界で phase_done を返して終える。PR は Step C を実行する次回起動(--pr 付き)に委ねる"
      - "(B) 起動時の自由文指示を --once の上書きと解釈し、同一ターンで Step C まで進んで push + gh pr create する"
    chosen: "(A)"
    codex_consulted: true
    opus_escalation: false
    freeform: "run_codex_exec.sh readonly による比較判定で (A) を採用"
    normalized_answer: >-
      retrospect のみを実行し、state=phase_done の構造化結果でターンを終える。
      push と PR 作成は Step C を実行する次回起動に持ち越す。
    resolution_note: >-
      前提: 起動引数は --batch --once --pr。workflow.yaml は retrospect のみ pending で、
      他は completed / design は skipped、verify は result: pass。起動時の自由文は
      「実装完了後に integration ブランチを push して gh pr create で PR を作る」と述べている。
      skills/develop/SKILL.md は (a) --once の retrospect 境界について「Step C(完了処理)は
      ここでは実行せず、独立した 1 フェーズとして次の起動に持ち越す」と明記し、
      (b) --pr は Step C を実行する起動でのみ効く起動ごとの設定で、workflow.yaml にも
      phase-state にも記録しないと定めている。
      Codex 判定 (A)。理由: 自由文は PR 作成を要求しているが「今回の起動で --once を
      解除する」とは述べていないため、両方の指示を満たす解釈は「今回は retrospect のみ、
      PR は次回」になる。仕様忠実性では (A) が優れ、(B) は明記された Step C 持ち越し規定に反する。
      状態安全性でも (A) が優れる — 再開位置が Step C に保たれるため、外部サービスが
      Step C 未実行と判断して再起動しても完了処理の重複や PR 作成の再試行が起きない。
      予測可能性でも phase_done が「1 フェーズ完了」と一致し、外部サービスの解釈が崩れない。
      (B) を採らなかった代償: 呼び出し側が再起動しない場合、PR が未作成のまま残る。
      復旧には --pr を付けた次回起動が必要であり、--pr の自動引き継ぎは無い。
      残存リスク: 次回起動に --pr が付かないと Step C は「ブランチを残す」に倒れ、
      PR は作られない。

  - phase: develop-step-c
    gate_id: null
    gate: "Step C 完了処理 — ユーザー散文『integration ブランチをローカルとリモートの両方に残す』が worktree の保持まで要求するか"
    at: "2026-09-22T09:00:00+09:00"
    options:
      - "(A) スキルどおり: push + gh pr create のあと `git worktree remove` で integration worktree を削除し、ローカル/リモートのブランチは残す"
      - "(B) スキルから逸脱: push + gh pr create のあと integration worktree も残す"
    chosen: "(A)"
    codex_consulted: true
    opus_escalation: false
    freeform: "run_codex_exec.sh readonly による比較判定で (A) を採用"
    normalized_answer: >-
      worktree は削除し、ローカル/リモートの integration ブランチは残す。
      マージは行わない。
    resolution_note: >-
      Codex 判定 (A)。理由: (1) git において branch はコミットを指す参照、worktree は
      ファイルを展開する場所であり、「ブランチを残す」は worktree の保持まで要求しない。
      全変更がコミット済みの前提では worktree を削除しても実装成果は失われない。
      (2) (B) ではブランチが worktree に使用中のままとなり、主作業ツリーからの
      通常の `git switch` が拒否される。(A) はこの制約を解消する。
      (3) 無人実行では指示の対象を勝手に広げず、明示されたブランチ保持とスキルの
      後片付けを両立する判断が妥当。
      (B) を採らなかった代償: 既存の作業場所と worktree 固有の状態をそのまま使い続ける
      利便性を失う。ブランチもコミット履歴も失われず、`git worktree add <path> <branch>`
      で再作成できる。
