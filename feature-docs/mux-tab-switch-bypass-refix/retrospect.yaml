lessons_candidates:
  - >-
    An auto-fix that lands and passes its own tests can still be wrong in the
    direction that matters. Loop 1's cross-crate pin asserted `gate <= wire_cap`,
    which is true both before and after the exact regression it was named for;
    only the re-review caught it. The cheap check that would have caught it at
    write time is the one the orchestrator ran after loop 2: revert the constant
    to its buggy value and confirm the new test actually fails.
  - >-
    Two reviewers describing "the same defect" can be describing opposite failure
    directions. Round 2's architecture and comprehensive findings at
    terminal_core.rs:1266 share a site and a root cause, but one says the tier
    predicate is too permissive in principle and the other says it is too narrow
    in practice. Mechanical same-site dedupe would have merged them and lost half
    the information.
  - >-
    Task worktrees do not inherit gitignored build prerequisites. Three separate
    agents independently discovered that `src-tauri/assets/fonts/` is empty in a
    fresh worktree and that build.rs panics without it. A worktree-setup step
    that seeds gitignored build inputs (or a `make fetch-fonts` call in the
    implementer's preflight) would remove a recurring per-task cost.
  - >-
    A format gate that fails identically on the base branch carries no signal.
    `cargo fmt --check` reports drift in 17 files on `main`, so the feature's own
    run of it can only be interpreted by differencing against a baseline. Either
    the gate should be scoped to changed files, or the workflow should record
    the baseline once per feature rather than re-deriving it at verify time.
  - >-
    Batch mode's single rework round was spent well but was clearly the binding
    constraint: round 2 produced five medium findings that all had concrete,
    accepted fixes and were deferred purely on the cap. Two of them
    (dd25355006caa680 / 296b5bdf8ec5073d) would be settled by one change — keying
    the tier on "every MIDDLE segment is at target_cols" instead of on fold
    success.
