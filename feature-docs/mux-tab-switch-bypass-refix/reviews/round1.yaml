    title: "Duplicated constant creates hidden cross-crate contract with no synchronization mechanism"
    description: >-
      BYPASS_PREFIX_MAX_SEGMENTS is a literal that must mirror the daemon-side
      MAX_DIM_MARKERS / mux_ipc::protocol::MAX_SEGMENTS living in other crates.
      The feature's own bug was caused by exactly this duplication drifting
      (daemon cap moved 24 -> 62 while this gate stayed at 24), and updating the
      value alone leaves the hidden contract unenforced.
    suggestion: >-
      Introduce a shared constant both crates can depend on, or add a
      build-time / test-time assertion pinning the two values.
    sources: [vertex:architecture]
    confidence: 50
    resolution: fixed
    resolution_reason: >-
      Auto-fixed across loops 1 and 2. Loop 1 added a #[cfg(test)] pin against
      mux_ipc::protocol::MAX_SEGMENTS via term_core's existing dev-dependency,
      but with the inequality in the harmless direction. Loop 2 added the
      lower-bound assertion (BYPASS_PREFIX_MAX_SEGMENTS + WIRE_CAP_SLACK >=
      MAX_SEGMENTS). The orchestrator empirically verified the pin now FAILS
      when the constant is reverted to 24 and passes at 62. The architecture
      re-review confirms this finding resolved.

