  - stable_id: 0029db1c89ab226f
    severity: medium
    category: architecture
    file: src-tauri/src/window_host.rs
    line: 1311
    title: "inset 適用と settler 決定の分離が不完全: apply_pending_resize が settler 未確定の inset から PTY グリッドを算出する"
    description: >-
      Change 2 decoupled which events set pending_resize from the settler, but
      not which inset value the resize consumes. grid_size() still reads
      status_bar_bot_inset_logical, now updated immediately on any height change,
      and apply_pending_resize feeds that into App::set_grid_size and the
      group-wide Resize broadcast. When pending_resize is raised by something
      else — refresh_mux_sidebar_inset on mux attach, or a compositor
      Resized/ScaleFactorChanged — a transient, not-yet-settled status-bar height
      reaches the PTYs, which is the very path FR6's debounce exists to close.
      Before Change 2 the inset was only written on the settler's forward, so
      this could not happen. Also risks ResizeSettler::last_forwarded diverging
      from the size actually applied.
    suggestion: >-
      Split the drawing/pointer-routing inset from the grid-computation inset:
      keep status_bar_bot_inset_logical immediate for hit-testing, and have
      grid_size() read a separate field updated only when the settler forwards;
      or have apply_pending_resize apply the settler's forwarded (cols, rows)
      directly instead of recomputing from the inset. Add a regression test
      pinning that a non-settler pending_resize during the settling window does
      not broadcast a transient size.
    sources: [claude:architecture]
    confidence: 75
    resolution: unresolved
    resolution_reason: >-
      Below the auto-fix severity gate (medium). Needs a state-model change plus
      a regression test, so it belongs in a rework task rather than an editor
      patch.

