    title: "epsilon 許容をピン留めするはずのテストが恒真で、実際の inset 値域では許容幅がゼロに退化している"
    description: >-
      status_bar_insets_changed_false_within_epsilon passes 40.0 and
      40.0 + f32::EPSILON / 2.0, but 40.0's ULP is ~3.81e-6 while
      f32::EPSILON / 2 is ~5.96e-8, so the addition rounds back to exactly 40.0.
      The test therefore duplicates ..._false_when_identical and pins nothing;
      rewriting status_bar_insets_changed as a plain != comparison would keep it
      green. Relatedly, at real inset magnitudes (tens of logical px) the
      absolute-EPSILON threshold is equivalent to !=, so the doc's claimed
      float-noise-churn avoidance does not occur.
    suggestion: >-
      Test where the tolerance is actually representable — e.g.
      status_bar_insets_changed(0.5, 0.0, 0.5 + f32::EPSILON / 2.0, 0.0), since
      0.5's ULP is exactly f32::EPSILON / 2 — or accept that the tolerance is
      unreachable in this domain, switch to a plain != comparison, and drop the
      epsilon claim from the doc.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: >-
      Below the auto-fix severity gate (medium). Routed to rework alongside the
      other window_host.rs findings.

