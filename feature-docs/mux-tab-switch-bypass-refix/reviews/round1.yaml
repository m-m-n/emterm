  - stable_id: a1a06ed541045dd5
    severity: high
    category: spec
    file: crates/term_core/src/terminal_core.rs
    line: 2191
    title: "NFR1 の根拠（MIDDLE は常に same-width）が h == 0 縮退経路で成立せず、24→62 の緩和が正当化されていない"
    description: >-
      SPEC NFR1 and the Optimization Constraint forbid loosening gates without
      making the prefix side cheap to replay. The sole stated justification for
      raising BYPASS_PREFIX_MAX_SEGMENTS 24 -> 62 is the doc claim that every
      MIDDLE segment transition is a same-width resize by construction, because
      middle_is_row_bounded requires cols == target_cols and a column change
      degrades the HEAD fold instead of reaching this gate. That last clause is
      false: middle_is_row_bounded is evaluated only inside candidate_safe, and
      when it fails h falls back to 0, at which point MIDDLE == segments[0..k]
      — column-changing segments included — and reaches the gate unchecked.
      Those segments take resize_full_reflow (O(accumulated content)), not the
      row-delta-bounded resize_same_width path, so the round-10 evidence the doc
      cites does not apply. The worst case therefore loosens from 24 to 62 full
      reflows over a <= 64 KiB MIDDLE, and the split's prefix cost is paid twice
      (2nd-pass worker). No bench covers the column-changing shape: both the
      pre-existing segment_bounded_replay_bench_950kib_stays_bounded_at_the_daemon_cap
      and this feature's new measured_26_segment_middle_cluster_* fixtures hold
      cols fixed.
    suggestion: >-
      (a) Make the raised bound conditional on the fold having succeeded — 62
      when h > 0 (middle_is_row_bounded already verified same-width), the old 24
      on the h == 0 degradation path; or (b) add an explicit column-uniformity
      check to bypass_split so column-changing MIDDLEs never engage (verify FR6
      non-regression, since D9 deliberately rescues that shape today); or (c)
      keep 62 everywhere but add a release bench for the h == 0 column-changing
      shape (62 segments, MIDDLE packed to the BYPASS_PREFIX_MAX_BYTES limit,
      dominating suffix) asserting a ceiling relative to bypass-engaged cost, and
      replace the incorrect same-width-by-construction rationale with the
      measured numbers. In every case the doc sentence "a column change degrades
      the whole HEAD fold instead ... rather than reaching this gate with a
      column-changing MIDDLE" must be corrected — it states the opposite of what
      the code does.
    sources: [claude:spec]
    confidence: 70
    resolution: unresolved
    resolution_reason: >-
      category == spec is excluded from the auto-fix candidate gate by protocol,
      and the finding calls for either a gate redesign or a new bench — neither
      is a single-file editor change. Routed to rework.

