schema_version: 1
feature: status-bar-timer-test-flake
created: 2026-09-23
base_branch: main
goal: |
  Notion task 3e23509ec8ee818f97d8e9da4f959aa4 —
  status_bar::runtime::tests::runtime_time_provider_timer_fires_wake がタイミング依存で不安定に落ちる

  指示メモ: em-workflow のベースライン失敗として観測。window_host とは無関係

  ## 現象 (必須)
  `status_bar::runtime::tests::runtime_time_provider_timer_fires_wake` が実行ごとに
  結果が変わる。同一ツリー・同一コミットで、ベースライン実行と最終のフルスイート実行では
  赤、その間の 1 回は緑になった。タイマー発火待ちの実時間依存が原因と見られる。

  ## 再現手順 (必須)
  1. `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib` を複数回実行する
  2. 同一コミットで結果が緑と赤に振れることを確認する

  ## 期待する挙動 (必須)
  実時間の経過に依存せず決定的に判定すること。時刻源を注入可能にするか、待ち時間に
  十分な余裕を取るかのいずれか。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  - `status_bar::runtime::tests::runtime_time_provider_timer_fires_wake`

  ## 実害・発生条件 (任意)
  無関係な変更の検証時に false red を出し、原因調査の手間を生む。差分の良否を判定する
  ベースラインとして信用できなくなる。em-workflow の implementer は baseline_failures と
  final_failures の差分で退行を判定するため、振れるテストはその判定精度を直接下げる。
  出典: em-workflow の benign-edit-test-token-rewrite / task0001 実装中に、当該タスクとは
  無関係なベースライン失敗として観測。
