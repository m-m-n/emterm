    description: "new_with_manual_time_source (runtime.rs:110-122) は TimeProvider::with_manual_source を自前で呼び、生成済みの Arc<TimeProvider> を new_internal に渡している。時刻プロバイダの配線 (format, wake.clone(), refresh_rates[\"time\"] から interval への変換、runtime.rs:92-99) は本番の new にしか無く、書き直した runtime_time_provider_timer_fires_wake (runtime.rs:546) はテスト用ビルダー側の配線だけを検証する。new が何もしない wake を渡しても、refresh_rates[\"time\"] を無視しても、どのテストも落ちない。FR7 はテスト用ビルダー経由でしか満たされていない。ビルダーの doc コメント「swaps only the time provider's tick source」も実際の動作と合わない。"
    suggestion: "時刻プロバイダの生成を new_internal に移し、呼び出し側から変わるのは tick 源だけにする (例: new_internal に FnOnce(String, WakeFn, Duration) -> Arc<TimeProvider> のファクトリを渡し、format の clone・wake.clone()・refresh_rates[\"time\"].unwrap_or(1000) の解決は new_internal に置く)。StatusBarRuntime::new の公開シグネチャは変えない。doc コメントを実際の動作に合わせる。"
