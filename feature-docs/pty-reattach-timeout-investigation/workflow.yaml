schema_version: 1
feature: pty-reattach-timeout-investigation
created: '2026-10-27'
base_branch: main
goal: |
  # mux::ipc::pty_spawn の visible_reattach_redelivers_alt_screen_and_main_screen_color_queries_once が負荷下で読み取りタイムアウトにより失敗することがある

  種別: 調査

  ## 知りたいこと
  `mux::ipc::pty_spawn::tests::visible_reattach_redelivers_alt_screen_and_main_screen_color_queries_once` の読み取りタイムアウト失敗が、負荷由来の一時的なものか、テスト側のタイムアウト設計の問題か。

  ## なぜ知りたいか
  `--lib` 全体の実行で間欠的に失敗すると、無関係な変更の検証結果が読めなくなる。

  ## 調査範囲
  対象: 上記テストと、その待ち合わせ・タイムアウトの設計。対象外: mux 本体の挙動変更。

  ## 完了の定義
  - 問いに結論が出ている
  - 根拠が file:line や実測値で示されている
  - コードは変更しない（直すべき点は別タスクとして起票）

  ## 手がかり
  - test-notify-dbus-isolation の implement（task0001 の基準計測）で、変更前後とも同じ読み取りタイムアウト失敗が出た
  - 同じ feature の task0002 の計測では全件成功
  - 並行ビルドの負荷が原因の可能性
