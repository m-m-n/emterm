  title: notch 変換規則が 2 実装に重複し、AC-9 の回帰テストが本番経路を通らない関数を見ている
  description: 'wheel_report_notches は本番呼び出し元がゼロで #[allow(dead_code)] が付いている。残る参照は doc コメントとテスト (tests.rs:1500-1580)
