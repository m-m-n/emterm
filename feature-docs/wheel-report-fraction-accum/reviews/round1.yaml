  suggestion: '新実装へ委譲して 1 実装に畳む: pub(super) fn wheel_report_notches(lines: f32) -> i32 { accumulate_wheel_report_lines(0.0,
    lines).0 }。全入力で結果が同一なので AC-9 の既存テストは無編集のまま緑を保ち、かつ初めて本番の規則を検証するようになる。'
  sources:
