findings:
- stable_id: ae089e04bcb3fa0f
  severity: high
  category: comprehensive
  file: src-tauri/src/window_host/pointer_routing.rs
  line: 951
  title: handle_mouse_wheel が disposition を見ずに report_accum を無条件に更新し、AC-8/FR6 を本番経路で破っている
  description: 'handle_mouse_wheel は apply_outcome の直後に accumulate_wheel_report_lines(records.report_accum,
    lines) を無条件に実行し、set_mouse_report_records で永続化する (pointer_routing.rs:948-953)。lines 算出から 953 行まで早期
    return が無く、この 2 行は outcome の disposition を一切参照しない。(1) グリッド拒否イベント: decide_wheel_event は AC-8 のため RecordUpdates::default()
    を返すのに、ホスト側がアキュムレータを前進させる。SPEC FR6 / AC-8 に違反。(2) tracking 有効中の Shift+ホイール (Disposition::Local(ScrollScrollback)):
    reset=false かつ dest 空のため、スクロールバック操作の端数がレポート用アキュムレータに溜まり、消費された whole notch は黙って捨てられる。FR7 の経路分離が report
    側だけ片側崩れている。MouseReportRecords::report_accum の doc (mouse_report.rs:426-432) の「never written anywhere
    else」とも矛盾する。AC-8 のテストは decide/apply シームのみを検証しており、ホスト配線のこの違反を検出できない。spec / architecture / comprehensive
    の 3 ランが独立に high で報告し、評価者の独立検査でも確認済み。'
  suggestion: apply_outcome が dest に積むのは Disposition::Report のときだけなので、dest の空判定をレポート経路の門にする。dest が空なら
    notches = 0 とし report_accum に一切触れない。あわせて report_accum の doc コメントを実態に合わせ、拒否イベントと Local arm で report_accum
    が不変であることを固定するテストを追加する (fold を純関数に切り出せば NFR4 を満たしたまま張れる)。
  sources:
  - claude:evaluator
  confidence: 95
  resolution: unresolved
  resolution_reason: 'batch mode: sources == [claude:evaluator] forces the needs-judgment path, which
    batch always skips (review-phase.md Phase R4)'
- stable_id: 9d6f3c3e77ff8649
  severity: medium
  category: spec
  file: src-tauri/src/window_host/mouse_report.rs
  line: 1041
  title: became_active を共有 reset 式に畳み込んだため、cell_cache / gesture_owner までスコープ外で巻き込まれる
  description: '実装は共有の reset 式を !tracking_active || tab_changed || became_active に拡張した (mouse_report.rs:1041-1042)。reset
    は apply_outcome で cell_cache.reset() と gesture_owner.clear_all() も駆動する (mouse_report.rs:1086-1093)
    ため、拡張分はレポート用アキュムレータ以外の 2 レコードの挙動も変える。到達経路: press 時 tracking 有効で gesture_owner に Report が記録 → アプリが
    tracking を off → owner 確立済みの motion/release が last_tracking_active=Some(false) を記録 → tracking 再有効化
    → ドラッグ中のホイールで became_active が立ち gesture_owner.clear_all() が走る → 以降の release は owner 不在分岐で Disposition::Nothing
    になり、アプリはリリースレポートを受け取れない。SPEC がスコープ外と宣言した領域の挙動変更。'
  suggestion: 'became_active をレポート用アキュムレータ専用の破棄シグナルとして分離する。RecordUpdates に discard_report_accum: bool
    を追加し、reset = !tracking_active || tab_changed、discard_report_accum = reset || became_active とする。apply_outcome
    側は既存の reset 分岐をそのまま保ち、discard_report_accum を独立に適用する。'
  sources:
  - claude:evaluator
  confidence: 85
  resolution: unresolved
  resolution_reason: medium severity — outside Phase R4 の candidate gate (critical/high のみ)
- stable_id: 071c856f96b7b56d
  severity: medium
  category: comprehensive
  file: src-tauri/src/window_host/mouse_report.rs
  line: 1098
  title: became_active ラッチが間に挟まる任意の受理イベントに消費され、旧セッションの端数が残る (AC-7 の抜け)
  description: 'became_active は tracking_active && records.last_tracking_active == Some(false) という 1 回限りのラッチだが、last_tracking_active
    は apply_outcome (mouse_report.rs:1098) で受理された任意のポインタイベントが上書きする。到達経路: tracking 有効中に端数 0.9 を蓄積 → tracking
    無効化を owner 記録済み release が観測 (D10 により reset は立たない) → 再有効化 → 未所有 motion が tracking_active: Some(true)
    を返してラッチを消費 → 続くホイールで became_active=false、reset されず旧セッションの 0.9 が持ち越される。AC-7 に反する。既存テストは release の直後にホイールが来る順序しか張っていない。'
  suggestion: 「後で遷移を検出する」方式ではなく「非アクティブを観測した時点で捨てる」方式にする — apply_outcome の tracking_active 適用箇所で !active
    のとき records.report_accum = 0.0 とする。これなら became_active を共有 reset 式に足す必要がなくなり、9d6f3c3e77ff8649 も同時に解消する。あわせて
    release → 任意の motion/press → ホイールの順序を検証するテストを AC-7 に追加する。
  sources:
  - claude:evaluator
  confidence: 70
  resolution: unresolved
  resolution_reason: medium severity — outside Phase R4 の candidate gate (critical/high のみ)
