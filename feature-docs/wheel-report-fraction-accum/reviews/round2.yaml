- stable_id: 75e29a3b528d453b
  severity: medium
  category: architecture
  file: src-tauri/src/window_host/mouse_report.rs
  line: 558
  title: The tracking-active observation duty is spread over 9 optional write sites, and `..Default::default()`'s
    None makes 'not observed' indistinguishable from 'forgot to set it'
  description: 'Verified as accurate debt, not a live defect. `apply_outcome`''s FR5/D10 discard (mouse_report.rs:1128-1130,
    `if outcome.updates.tracking_active == Some(false)`) depends on every accepted decision branch populating
    `RecordUpdates.tracking_active` itself. All four decision paths were walked at HEAD: decide_press
    sets it on both accepted branches; decide_release sets it on the gesture-owned and the non-owned branch;
    decide_motion_event sets it on all four branches, two of them (lines 1006, 1015) as a post-hoc patch
    onto the value `report_motion` returns; decide_wheel_event has exactly one accepted return (line 1077)
    and sets it there, with the grid-rejection early return at 1032-1035 deliberately leaving `RecordUpdates::default()`.
    So today no branch is missing it. The structural risk is real, though: `RecordUpdates` is `Copy +
    Default` and every construction goes through `..Default::default()`, so a new accepted branch (or
    a third caller of `report_motion`, which returns an outcome with `tracking_active` still unset) that
    omits the field produces `None`, which is value- and type-identical to the grid-rejection path''s
    deliberate ''no observation''. That omission compiles, passes the existing suite, and silently disables
    the tracking-session fraction discard on that path — re-opening exactly the stale-session remainder
    D10 closed.'
  suggestion: 'Make the observation an input that cannot be forgotten rather than an optional output field:
    pass it into `report_motion` as an argument and delete the post-hoc assignments at mouse_report.rs:1006
    and 1015, or lift it out of `RecordUpdates` into an explicit parameter of `apply_outcome` / `apply_wheel_report_step`
    so a rejection path must name ''no observation'' rather than defaulting into it. If the shape is kept
    as is, the minimum is one test per decision path asserting every accepted branch returns `tracking_active:
    Some(_)`, so a future branch that omits it fails loudly.'
  sources:
  - claude:architecture
  confidence: 65
  resolution: unresolved
  resolution_reason: R4 の candidate gate は severity ∈ {critical, high} のみを対象とするため、medium の本件は auto-fix
    の 候補にならなかった。評価者も「現時点の欠陥ではなく設計上の負債」と判定している。
