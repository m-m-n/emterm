- stable_id: bfb7c163abf1137d
  severity: medium
  category: comprehensive
  file: src-tauri/src/window_host/input_translate.rs
  line: 492
  title: 'wheel_report_notches has zero production callers but no longer carries #[allow(dead_code)],
    so non-test builds gain a permanent `never used` warning'
  description: 'Independently verified at HEAD. `mod input_translate;` is private inside `window_host`
    (src-tauri/src/window_host/mod.rs:43) and `window_host` is `pub mod` only at lib.rs:239, so a `pub(super)`
    item in `input_translate` is unreachable from outside the crate and is subject to the dead_code lint.
    The only non-doc references to `wheel_report_notches` are in `src-tauri/src/window_host/tests.rs`,
    which is behind `#[cfg(test)] mod tests;` (mod.rs:852); task0002 removed the last production call
    site when `pointer_routing::handle_mouse_wheel` switched to `mouse_report::apply_wheel_report_step`
    (pointer_routing.rs:957). There is no module- or crate-level `#[allow(dead_code)]` (the only two allows
    in the file, at lines 389 and 415, are on unrelated functions and carry reason comments). The function''s
    own doc block now explicitly states no dead-code allowance remains, and tests.rs:3932 `wheel_report_notches_delegates_to_the_accumulating_unit_and_carries_no_dead_code_allowance`
    asserts (by scanning the source text from the doc anchor to the next item) that `#[allow(dead_code)]`
    is absent, so the warning is pinned in place. No `-D warnings` was found in CI, so this does not break
    the build; it adds one new warning to every `cargo check` / `cargo build` of the GUI feature. Cross-validation:
    comprehensive#fallback and architecture#fallback reported this identical site independently, at the
    same line, with the same diagnosis.'
  suggestion: Add `#[cfg(test)]` to the function rather than restoring an allow attribute. The AC-6 source-scanning
    test at tests.rs:3949-3958 asserts only on the literal string `#[allow(dead_code)]` inside the doc-anchor..next-item
    region and on the presence of `accumulate_wheel_report_lines(`, so `#[cfg(test)]` satisfies both assertions
    while removing the warning; tests.rs compiles under the same `cfg(test)` so the import at tests.rs:14
    keeps resolving. Deleting the function instead would require re-pointing the nine AC-9 `wheel_report_notches_*`
    expectations (tests.rs:1500-1580) at `accumulate_wheel_report_lines(0.0, x).0`, which weakens AC-9's
    stated no-edit regression evidence. Either way, the MAX_WHEEL_REPORT_NOTCHES doc at input_translate.rs:448-457
    still names `wheel_report_notches` as the conversion-side half of the cap and should be re-pointed
    at `accumulate_wheel_report_lines`, which is the actual production binding now.
  sources:
  - claude:comprehensive
  - claude:architecture
