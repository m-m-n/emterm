schema_version: 1
feature: wheel-report-fraction-accum
created: '2026-09-20'
base_branch: main
goal: |
  マウスレポート: ホイールの端数デルタが捨てられタッチパッドスクロールが効かない (3d92ef44)

  ## やりたいこと (必須)
  マウスレポート経路にホイールデルタの端数アキュムレータを入れて、タッチパッドの細かいスクロールがレポートされるようにする。

  ## 背景・なぜ (必須)
  マウスレポート実装（PR #69 / `em-workflow/mouse-reporting/integration`）のレポート経路は、送るノッチ数を `wheel_report_notches(lines)`（`input_translate.rs:452`）だけで決めている。この関数はステートレスな `lines.abs().floor() as i32` なので、0 を返すとイベントが完全に消える（`pointer_routing.rs:915` の `if notches != 0` に弾かれ、ローカルアームも走らない）。
  `MouseScrollDelta::PixelDelta` 経路では `lines = p.y / cell_h` であり、高解像度タッチパッドでは 1 イベントあたり 0.1〜0.3 程度になるのが普通。端数を持ち越す仕組みが無いため、**マウス対応 TUI の中ではタッチパッドスクロールが恒久的に無反応**になる。
  兄弟経路はどちらもこれを回避している。alternate-scroll アームは `accumulate_alt_scroll_lines` で端数を持ち越し、トラッキング無効時のスクロールバックアームは `lines > 0.0` で判定するので端数でも 1 ステップ動く。レポート経路だけが取りこぼす。
  SPEC の TS10 を損なう。

  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] ホスト側にレポート経路専用の端数アキュムレータ（`mod.rs` の `wheel_report_accum: f32`）を持つ
  - [ ] `alt_scroll_accum` と同じ形で消費する — `(whole, frac)` を取り、`whole != 0` のときだけバイト列を送り、`frac` を書き戻す
  - [ ] アクティブタブ変更時とトラッキングモード解除時にリセットし、持ち越した端数がジェスチャをまたいで漏れないようにする
  - [ ] タッチパッドの細かいスクロールがマウス対応 TUI に届くことを検証するテストがある

  ## スコープ外 (任意)
  alternate-scroll 経路とトラッキング無効時のスクロールバック経路の挙動変更。

  ## 制約・前提 (任意)
  - レビュー round 3 の deferred、stable_id `3d92ef44b051ecc0`（severity high / confidence 100）。round 2 の未解決指摘 `63adedf9fb56b452` が task0005 / task0006 の rework を経てもそのまま残ったもの
  - Codex の相談では優先度「中」と判定されたが、レビュー側の severity は high。判断が割れている点を明記しておく
  - 修正は `mod.rs`（新規フィールド）と `pointer_routing.rs`（消費側）にまたがるため、レビューの自動修正（単一ファイル限定）ではスキップされた
  - 該当箇所: `src-tauri/src/window_host/pointer_routing.rs:913`、`src-tauri/src/window_host/input_translate.rs:452`
