goal: |
  # テストシーム経由のプロセスグローバル状態を直列化する（RESTART_REQUIRED の無同期アクセス / SFTP bare send）

  ## やりたいこと（必須）
  `#[cfg(test)]` テストシーム経由で触るプロセスグローバル状態を直列化し、並列 `cargo test --lib` でも決定的にする。あわせて SFTP のテストシームを既存の送信ヘルパ経由に戻す。
  ## 背景・なぜ（必須）
  em-workflow（feature `frame-skip-pending-work`、PR [https://github.com/m-m-n/emterm/pull/33](https://github.com/m-m-n/emterm/pull/33)）のレビューで、Claude レビュアー 3 観点が独立に同じ根本原因へ到達した。いずれも severity medium で auto-fix ゲート（critical/high）に乗らず、未対応のまま残っている。記録は `feature-docs/frame-skip-pending-work/reviews/round1.yaml`。
  **1. \`RESTART_REQUIRED\` の無同期アクセス**（stable_id `e7d6f3a3da4d9ee2` / `19614e858f1d741b`）
  `src-tauri/src/self_exec.rs` に追加した `test_set_restart_required()` により、プロセス全体で 1 つしかない `RESTART_REQUIRED` を 7 本のテストがロック無しで読み書きする状態になった。
  - 書き手: `self_exec::tests::restart_pending_reports_true_across_consecutive_peeks` / `restart_required_still_consumes_once_after_peeks` / `app::tests::timing::frame_work_pending_*`（4 本）
  - 消費者: 既存の `app::tests::timing::pump_toasts_runs_both_pumps_unconditionally`（`pump_restart_toast` → `restart_required()` が swap で奪う）
  - 新たに依存するようになった読み手: 既存の `next_toast_deadline_none_when_no_toast_active` — FR5 の決定で `next_toast_deadline()` が `frame_work_pending()` 起点になったため
  SPEC.md の AC5 は `--test-threads=1` を伴わない `cargo test --lib` の全通過を要求しているが、Rust の既定ハーネスは並列実行なので、この条件では非決定的に落ちうる。`self_exec.rs:176` のドックコメント「The suite runs single-threaded」もプロジェクトの既定コマンドと一致していない。
  さらにフラグ復元（`test_set_restart_required(false)`）が成功パス上にしか無いため、途中の assert が panic すると raised のまま後続テストへ波及する。逐次実行でも順序依存が残る。
  **2. SFTP テストシームが bare send 禁止の不変条件を破っている**（stable_id `6c0ec12db00184a9`）
  `src-tauri/src/sftp/service.rs` の `send_progress` / `send_result` は doc コメントで「このモジュールの送信サイトはすべてこのヘルパを通す（`progress_tx` への bare `.send(` は禁止）」と明言しており、これが wake 漏れを防ぐ唯一の enforcement になっている（コンパイラでもテストでも強制されない純粋なコメント規約）。新規の `test_push_progress_event` / `test_push_result_event` はチャネルへ直接 `.send()` しており、この規約に対する反例をモジュール内に作った。
  `#[cfg(test)]` 限定なので production 挙動への影響は今は無いが、SSOT である doc コメントと実装が食い違い、以後この形をコピーした送信サイトが `wake()` 抜きで追加される足がかりになる。副次的に、このシームを使うテストは wake チェーンの回帰を検出できない。
  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] `RESTART_REQUIRED` を読む/書くテストが並列実行でも決定的に通る（新規 4 本 + `self_exec` の 2 本 + `next_toast_deadline` 系の既存テスト）
  - [ ] assert が panic してもフラグが raised のまま残らない（復元が panic 安全）
  - [ ] `self_exec.rs` の「The suite runs single-threaded」記述を、実際に採用した直列化手段の説明へ差し替える
  - [ ] `test_push_progress_event` / `test_push_result_event` が `send_progress` / `send_result` 経由になる。ヘルパ経由にできない事情があるなら、その例外を `send_progress` の doc に明記し、不変条件の記述を「production の送信サイトはすべて」に訂正する
  - [ ] `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib`（`--test-threads=1` **無し**）が全通過する
  - [ ] `cargo check` 3 構成（Linux GUI / `--no-default-features` / `cargo xwin check --lib --tests`）が警告ゼロ
  ## スコープ外（任意）
  - `frame_work_pending()` 述語そのものの式・3 消費者への配線（PR #33 で確定済み）
  - `restart_required()` の swap 消費セマンティクス
  - `src-tauri/` 全体に既存する rustfmt ドリフト（本件が触れていない 7 ファイル）
  ## 制約・前提（任意）
  - 直列化の手段は 2 案ある。`self_exec` に test-only の `Mutex` + Drop でフラグを必ず戻す RAII ガードを置いて全テストをガード経由にするか、`serial_test` を dev-dependency に追加して `#[serial(restart_flag)]` を付けるか。前者は依存を増やさない
  - 各テストへ `test_set_restart_required(false)` を足すだけでは順序依存しか塞げず、並列衝突は残る
  - 代替として SPEC.md AC5 のコマンドを `-- --test-threads=1` 付きに改める案もあるが、テスト側を直せば済むので優先度は低い
  - 前提ブランチ: `em-workflow/frame-skip-pending-work/integration`（PR #33）。マージ後に着手するのが前提

