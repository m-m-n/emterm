    normalized_answer: FR1 は、最後の未完構文の直前にある中断済み文字列と ESC ESC の先行 ESC の連鎖も pending に保持し、カット（および FR4 フォールバックの閉じ）では連鎖の先頭から落とすことで満たす。読み取りをまたぐ経路も直す。pending
      の事後条件を改め、carried-over 完了の報告と suppressed_output の末尾再配送を合わせる。連鎖の先頭と未完構文の開始位置を分けて持つ。512 KiB 上限超過経路での解析状態も定義する。終端は足さない。
    resolution_note: 'gate: create-spec.requirement-clarification (policy codex_consultation); Codex (codex harness, 1 turn)
      consulted; Opus escalation: not run; options: hold-chain [chosen] / within-run / neutral-close [not chosen]; key points:
      within-run は write_filter.rs:355 が通常読取りで連鎖の先頭を書くため読取りをまたぐ再現が残る。単独 ESC は term_core で Escape/OscEscape に入り中立にならないので neutral-close
      は不可。注意: CarriedCompletion と末尾再配送、上限超過経路の扱いを合わせて改める'
