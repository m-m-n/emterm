schema_version: 1
feature: mux-suppressed-output-round4-fixes
created: '2026-10-02'
base_branch: main
goal: |
  # mux: 抑止チャンクの副作用処理の round3-fixes review で残った medium 指摘 3 件の対応

  Notion: https://www.notion.so/3ed3509ec8ee81609e98dd3bf8dd7ab5

  ## 現象 (必須)
  mux-suppressed-output-round3-fixes（PR https://github.com/m-m-n/emterm/pull/112 ）の review round 1 で、medium 指摘 3 件が `unresolved` のまま残っている。いずれもスナップショット再生後にクライアントが開始していない問い合わせ（OSC 11 色照会など）が成立しうる。
  - `3e2024dce619ed9f` カット直前の未完了構文を落とす切り詰め（`run.truncate(scan.boundary)`）が、その開始 ESC で中断済みだった直前の文字列や ESC ESC の先行 ESC まで落とす。例: `ESC]11;? ESC]0;x` の直後に切り替えシーケンス → リングに `ESC]11;?` が残り、再生後の BEL で OSC 11 色照会が成立する（round3 の差分で生じた退行）
  - `989ec5c588abce06` as-05 フォールバックの指定文字（designator）不確定性をチャンク先頭バイトにしか適用せず、チャンク内の `ESC (` 連鎖の後ろでクエリを捏造する。例: `ESC ( ESC ( ESC ]11;? BEL`（FR5 未達）
  - `48caec6f5b0b5810` カット時に指定文字待ちの `ESC (` / `ESC )` が指定文字無しでリングに残り、再生時に後続バイトを指定文字として消費してパースがずれる。例: `X ESC ( ESC[?1049h ESC[?1049l ESC ( ESC ]11;? BEL` → リングで OSC 11 照会成立（round3 以前からの挙動。直すには round3 SPEC の as-02/EC-2 の見直しが要る）
  ## 再現手順 (必須)
  1. mux の pane に上記の各例のバイト列を含む出力を流す
  2. そのチャンクの途中で snapshot 取得（タブ切り替え / reattach）が走り、チャンクが抑止される
  3. 再生後に後続の BEL / `\` 等で、クライアントが開始していない問い合わせが成立する
  ## 期待する挙動 (必須)
  抑止したチャンクとリングへの書き込みが、ライブのクライアントと同じ解析状態を保ち、クライアントが開始していない問い合わせを再生や抽出で成立させない。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] 各 stable_id について、対応済みか・対応不要かを判断して記録する
  ## 該当箇所 (任意)
  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:333`（3e2024dce619ed9f）
  - `src-tauri/src/mux/ipc/pty_spawn/client_parity_scan.rs:138`（989ec5c588abce06）
  - `src-tauri/src/mux/ipc/pty_spawn/write_filter.rs:319`（48caec6f5b0b5810）
  - 詳細: ブランチ `em-workflow/mux-suppressed-output-round3-fixes/integration` の `feature-docs/mux-suppressed-output-round3-fixes/reviews/round1.yaml`
  ## 実害・発生条件 (任意)
  snapshot 取得と特定のバイト列を含む 1 チャンクが重なったときにだけ起きる。
