findings:
  - stable_id: 4c0ad9058a983648
    severity: medium
    category: architecture
    file: src-tauri/src/mux/ipc/pty_spawn/write_filter.rs
    line: 512
    title: "出力状態の契約に除去前の走査結果を使用している"
    description: "cut 経路（write_filter.rs 512-515 行）の FR4 閉鎖は、除去前の run を走査した scan.csi で判断している。scan_boundary は完了した OSC/APC/DCS や後続の完了 CSI の ESC で csi を None にするが、strip（scrollback_filter.rs の strip_rich_content_and_remap_with_designator）はその ESC を含む構文ごと除去する（OSC 777 ビューア起動列、OSC 9999、agent-status、Kitty APC、SIXEL DCS、ESC[6n 等の CSI 照会列）。このため ESC[6 + 除去対象の完全な構文の直後に cut が来ると、出力は ESC[6 で終わり CSI_CLOSING（DEL）が付かない。ESC[6 ESC[6n + cut も同じ。復元後に n が届くと、生ストリームには無い CPR 応答をクライアントが返す（NFR4/TM-1、FR4 に反する）。通常経路も self.csi = scan.csi（None）を引き継ぐため、後のフォールバック閉鎖も何も書かない。round4_cut_csi.rs の CLOSING_CASES は除去されない ESC]0;t BEL しか含まない。cut が無い場合も、リングが除去済み構文の直後の ESC[6 で終われば次のライブの n が完成させうる（以前からの strip の挙動だが、新しい csi フィールドの契約にも反する）。"
    suggestion: "cut の閉鎖と次の呼び出しへ引き継ぐ csi の両方を、除去後の出力の状態で決める。例: strip が開いた CSI を中断する ESC で始まる構文を除去するときに CSI_CLOSING を代わりに書く、または strip の出力末尾の CSI 状態を返させて書き込みフィルタがそれを使う。CLOSING_CASES と term_core 生ストリーム比較に、ESC[6 ESC]777;emterm;markdown;…BEL / ESC[6 ESC_G…ESC\\ / ESC[6 ESC[6n のそれぞれに cut と後続の n を続けた回帰テストを、同一呼び出しの cut とフォールバック閉鎖の両方で追加する。"
    sources: ["codex:architecture"]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium severity is outside the auto-fix candidate gate (critical/high only); filed as a follow-up task"
