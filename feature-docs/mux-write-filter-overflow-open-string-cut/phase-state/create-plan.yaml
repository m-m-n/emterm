    normalized_answer: 'cp-a1: 開いた文字列本体の書き込み状態は、オーバーフロー出力に限らず書き込んだ全バイトで追跡する (D3 を維持)。SPEC A3 の『オーバーフローだけが開いた本体を書き残す』は成立しない
      (反例: 上限未満の ESC]0;x ESC[6n — 境界走査が CSI で保留を解除し strip が ESC[6n を除去するので開いた ESC]0;x が書かれる。write_filter.rs:949,
      scrollback_filter.rs:433)。計画への反映: (1) IMPLEMENTATION.md で SPEC A3 / NFR3 の括弧書き『every non-overflow
      path』が成立しないことを既知の逸脱として明記し、NFR3 の受け入れは『開いた本体を書き残さない経路の出力は不変』に限定して扱う。(2) 非オーバーフローの strip 除去で開いた本体が書かれた後のカット
      (例: ESC]0;x ESC[6n の次の呼び出しでカット) が ESC + CAN を書く回帰テストを task0001 と VERIFICATION.md に追加する。(3) D3 のリプレイ一致の保証を『カット時に
      Ground へ戻り、カット後の文字が本体に吸い込まれない』ことに限定する。カット前に吸い込まれた文字や strip の連結で生じた表示差は復元対象外 (A4 と同じ扱い)'
    resolution_note: 'gate: create-plan.open-body-tracking-scope (unlisted, planner の非ブロッキング未解決事項 cp-a1);
      options: A) D3 を維持し全書き込みバイトで追跡 / B) オーバーフロー出力のバイトに限定し非オーバーフロー出力をバイト単位で不変に保つ / C) その他; codex_consulted:
      true (1 turn); opus_escalation: false; chose A. Codex: A3 は反例があり成立しない (write_filter.rs:949, scrollback_filter.rs:433)。A
      は書いた状態だけで全カット経路の closure を選ぶ FR1/FR2/FR5 と整合 (SPEC.md:83, :119)。B は同じ書き込み状態でもオーバーフロー履歴で closure
