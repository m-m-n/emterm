lessons_candidates:
  - >-
    プラットフォーム条件付きのゲートを導入すると、条件を持たない既存テストが
    暗黙に片側プラットフォームの契約を書いている状態になる。task0001 の計画は
    「既存テストを 1 本ずつ読み直して分類する」規律を明記していたが、
    実装者は empty_preedit_is_surfaced_for_overlay_clear（SPEC が名指ししていた
    1 本）だけを調整し、TS-winit-3 を見落とした。SPEC が個別に名指しした例が
    かえって「その 1 本だけ」という読みを誘発した可能性がある。
    計画側の書き方として、名指しの例を挙げるより「全テストの期待値を新ゲートの
    両分岐で評価せよ」と網羅を要求する形のほうが安全かもしれない。
  - >-
    SPEC の Test Scenarios に列挙した TS-n と、実装されたテスト関数の対応を
    機械的に突き合わせる手段が無い。task0001 は AC ベースでテストを書いたため、
    AC に対応が無い TS-5 が丸ごと落ちた。VERIFICATION.md 側で TS-n → テスト関数名の
    対応表を持たせるか、AC と TS を 1 対 1 に揃える運用を検討する余地がある。
  - >-
    batch の verify rework（cap 1）が期待どおり機能した。review の auto-fix 候補
    ゲートが critical/high 限定であるため、medium として報告されたテスト不備は
    review では拾われず verify の Success Criteria 評価で初めて fail になった。
    この経路が無ければ TS-5 欠落は deferred のまま残っていた。
  - >-
    実装者・レビュアーとも worktree に gitignore された前提物
    （bundled fonts / viewer・settings の dist）が無いためビルドできず、
    毎回 main ツリーからのコピーが必要だった。implement フェーズが
    worktree 作成時にこれらをプロビジョニングする仕組みがあると、
    タスクごとの立ち上がりコストが下がる。
  - >-
    verify の format_command に cargo fmt --check を採ったが、リポジトリに
    既存の整形ドリフトが 3 ファイルあるため常に非ゼロ終了する。
    feature が触ったファイルに限定して評価する手段が無いと、
    format の合否がノイズになる。
