    title: "notify_focus(false) が ime_enabled をリセットせず、Windows でキー入力が恒久的に握り潰されうる"
    description: >-
      Windows のキー抑止ゲートは ime_enabled 単独になり、解除経路は Ime::Disabled
      の 1 本だけになった（Ime::Commit はもう解除しない）。しかし notify_focus(false)
      は set_ime_allowed(false) を呼ぶだけで両フラグに触れない。winit-win32 の
      Window::request_ime_update は ImeRequest::Disable 分岐で ime_capabilities を
      None にし ImeContext::set_ime_allowed(hwnd, false) を呼んだ後 return し、
      Ime::Disabled を送出しない（winit-win32-0.31.0-beta.2/src/window.rs:1041-1044）。
      対して Wayland は同じ Disable 要求から Ime::Disabled を合成する
      （winit-wayland-0.31.0-beta.2/src/window/mod.rs:512）。合成中にフォーカスを
      失うと WM_IME_ENDCOMPOSITION が届かない場合 ime_enabled が true のまま残り、
      以後 dispatch_key_event が全キーに Consumed を返してキー入力が死ぬ。
      変更前は Ime::Commit でも解除されたため窓は狭かった。
      未確定: ImmAssociateContextEx による解離時に WM_IME_ENDCOMPOSITION が
      必ず飛ぶかは Windows 実機でしか確認できない。
    suggestion: >-
      notify_focus(false) で has_preedit / ime_enabled をローカルに落とす。
      Wayland/X11 では直後に Ime::Disabled 由来の FocusOut が来るが冪等。
