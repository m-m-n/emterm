    freeform: '案 A を採る: 抑止したチャンクは Detached 腕と同じ capture_passthrough を 1 回通す。OSC 9
      は「Detached と同じ通知処理を 1 回実行する」と書き、try_send 失敗時の既存の欠落までは保証しない。リッチコンテンツ（ビューア起動・画像）は
      snapshot の既存方針どおり再生せず、抑止した 1 チャンクだけに含まれるビューア起動・画像が届かないことを仕様上の既知の欠落として明記する。追加の注意:
      (1) DSR・DA 等の端末問い合わせ、タイトル・cwd・agent-status など、転送とは別に reader が行う既存処理は、転送の抑止によって飛ばさない。(2)
      番号だけでは整合しないので、shadow 更新・リング更新・番号確定と snapshot 側の採取を同じ排他で守る。共通の捕捉ロックを追加するなら reader・snapshot・resize
      で下位ロック（リング・shadow）より先に取り、reader はそれを解放してから output_target を取る。resize は現在リングロックを解放してから
      shadow ロックを取るので、既存コードに逆順の同時保持は無い。(3) 抑止境界は受信先と結び付け、blocking_send 待ちや送信延期（DeferredOutputQueue）で判定後に順序が変わる経路でも整合させる。(4)
      ScrollbackWriteFilter.pending の未完了列はリングに入っていないため、境界後の続きが文字として漏れない扱いを確認する。'
