    title: "子プロセス終了後の stdout 待ちが NFR1 の 300ms 上限を最大 500ms 超過しうる"
    description: >-
      SPEC NFR1 は「each socket's list-sessions call is bounded by a timeout of at
      most 300 ms. The bound holds regardless of how the tmux server behaves.」と
      無条件の上限を規定している。spawn_bounded の deadline ループ自体は 300ms
      (ENUMERATE_TIMEOUT) で正しく打ち切られるが、try_wait が終了を検知した経路では
      追加で rx.recv_timeout(500ms) を待つ。読み取りスレッドは stdout パイプの write 端が
      全て閉じるまで read_to_end でブロックするため、tmux が終了しても write 端を継承した
      子孫プロセスが残っているケースでは 1 ソケットあたり最大 800ms、chooser open が
      その分同期的に固着する（enumerate は UI スレッドから同期呼び出し）。PATH 上の tmux が
      ラッパースクリプトである等でパイプを継承する子孫が生じると再現し、SPEC が明示している
      「regardless of how the tmux server behaves」の上限保証が成り立たない。
    suggestion: >-
      spawn_bounded の先頭で deadline を取り、終了検知後の受信を
      rx.recv_timeout(deadline.saturating_duration_since(Instant::now())) にして
      残余待ちを全体 deadline の残りに収める。残り 0 なら空 stdout 扱い（＝そのソケットは
      fallback 行）で、SPEC の劣化方針と一致する。ローカルの healthy tmux では子プロセス
      終了時点で既に EOF に達しているため通常経路の挙動は変わらない。
    sources: [claude:spec]
