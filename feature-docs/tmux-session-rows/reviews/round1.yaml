    description: >-
      enumerate() は discover() が返した全ソケットに対して tmux -S <socket_path>
      list-sessions を実行する。呼び出し元は App::open_new_tab_chooser なので、ユーザーが
      タブバーの + を押した時点で各ソケットに tmux クライアントプロセスが自動接続する。
      ソケットパスの出所は resolve_socket_dir() で、$TMUX_TMPDIR 未設定時は /tmp/tmux-<uid>
      にフォールバックする。discover_in() はこのディレクトリの所有者・パーミッションを
      一切検証しない。tmux 本体はソケットディレクトリを自前で導出する経路で
      st_uid != getuid() または mode & S_IRWXO != 0 のとき EACCES で拒否するが、
      -S <path> で明示的にパスを渡された場合この検査は走らないため、本コードは tmux 自身の
      防御を迂回する形になる。マルチユーザーホストで victim がまだ tmux を起動しておらず
      /tmp/tmux-<victim-uid> が存在しないとき、別ユーザーが先にディレクトリを作って
      listening socket を置ける。本 diff 以前は行をクリックする操作を経て接続していたが、
      本 diff により chooser を開くだけで接続が起きるようになり、必要な操作が一段下がった。
    suggestion: >-
      ソケットディレクトリを信頼境界として扱い、tmux 自身と同じ規則で弾く。read_dir の前に
      symlink_metadata(dir) を取り、(a) ディレクトリであること、(b) uid が自分と一致すること、
      (c) mode & 0o077 == 0 であること、を満たさない場合は空 Vec を返す（この module の
      「失敗は not present に縮退する」契約と整合する）。symlink_metadata を使うのは
      ディレクトリ自体が攻撃者の張ったシンボリックリンクである場合も弾くため。所有者違い /
      other 権限ありのディレクトリが空リストになるテストを追加する。
