    title: "spawn_bounded の成功パスが 300ms バウンドを最大 500ms 超過しうる"
    description: >-
      spawn_bounded は try_wait() が終了を観測した時点で rx.recv_timeout(500ms) を実行する。
      この 500ms は timeout 引数（= ENUMERATE_TIMEOUT 300ms）と無関係な固定値なので、
      1 ソケットあたりの実測最悪値は 300ms ではなく最大 800ms になる。モジュール doc と
      SPEC NFR1/AC-3 は「1 ソケットあたり 300ms を超えない」と明言しており、実装がその契約を
      満たしていない。発火条件は「子の子孫が stdout パイプの write end を継承したまま生き残る」
      ケースで、そのとき read_to_end が EOF に到達せずリーダースレッドが send しないため
      丸ごと 500ms 待つ。この待ちは chooser を開く winit メインスレッド上で発生するため、
      描画も PTY 読み出しも止まる。あわせて TimedOut パスで返るときもリーダースレッドは
      join されず、パイプが開いたままなら関数戻り後も残存する。
    suggestion: >-
      残り時間で bound する。deadline.saturating_duration_since(Instant::now()) を
      小さな下限（例: 10ms）で clamp した値を recv_timeout に渡し、期限ぴったりに終了した子の
      出力を取りこぼさないようにしつつ全体を timeout 内に収める。
