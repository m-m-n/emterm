  description: "program_status.rs:28 で `use super::agent_status::AgentState;` が追加された。program_status はクレート直下のモジュールなので `super::` は `crate::` と同じものを指す。既存のガード `program_status::tests::ac8_the_module_uses_only_always_built_crates` は use のルートに `super` を許し `crate::` という文字列だけを拒否しており、拒否時のメッセージは \"the module must not reach into other project modules\" である。新しい import は他のプロジェクトモジュールへの依存だが `super::` と綴ったためにガードを通っている。依存そのものは SPEC が求めたもの（A2）で agent_status は常にビルドされるため、ビルド構成に依存しない性質（NFR2）は保たれている。問題は緑のテストが、コードがもう満たしていない不変条件を主張し続けている点にある。"
  suggestion: "依存はそのまま残す。SPEC NFR3 で ac8 テストは変更できないため、import 行に短いコメントを付ける。ac8 を変更できる後続作業では、`crate::` の文字列チェックを明示的な許可リスト（`super::agent_status`）に置き換え、メッセージを実際に守っている不変条件（gui feature 非依存）に合わせて書き直す。"
  reproduction: null
