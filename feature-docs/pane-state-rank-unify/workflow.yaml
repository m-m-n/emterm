schema_version: 1
feature: pane-state-rank-unify
created: '2026-10-11'
base_branch: main
goal: 'https://www.notion.so/3f53509ec8ee8125a0f7dfc026a0aebe


  ペイン内の状態順序（compose_rank / ProgramState::rank）の定義を一元化する


  ## やりたいこと (必須)

  ペイン内の状態の強さの順序（blocked > working > error > done > idle）を 1 か所で定義し、他のモジュールはそこから導く。または全 5 状態で順序が一致することを確かめるテストを追加する。

  ## 背景・なぜ (必須)

  `AgentState::compose_rank`（`src-tauri/src/agent_status.rs:95`）の説明は「ペイン内の順序を定義する唯一の場所」としているが、`program_status::ProgramState::rank`（`src-tauri/src/program_status.rs:104`）が同じ順序を独立に定義しており、`Table::summary` の決定記録の選出はこちらを使う。現時点の値は一致しているが、両者を結ぶ参照もテストも無く、片方だけを変えるとデーモンの集約状態と合成の判断が食い違う。

  em-workflow osc7501-program-status の review round 1 で medium として残った指摘（stable_id cff07107c1ef5662）。コードは統合ブランチ `em-workflow/osc7501-program-status/integration` 上にある。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 順序の定義が 1 か所にまとまっている、または全 5 状態で両者の順序が一致することを確かめるテストがある

  - [ ] `compose_rank` の説明が実態と一致している

  '
