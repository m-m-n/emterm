      どちらも remainder を空にする方針を取っており、admit_blocking だけが外れている。
    suggestion: >
      admit_blocking の送信失敗時に self.remainder.clear() してから Err を返し、
      他 2 経路と同じ「writer が消えたら保持を捨てる」方針に揃える。
