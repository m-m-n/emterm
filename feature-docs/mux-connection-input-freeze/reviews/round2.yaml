    description: >
      admit_blocking は先頭で pending_reserve = None にした後 tx.send().await の失敗で
      早期 return するため、remainder 非空かつ pending_reserve == None という
      OutboundAdmission の lockstep 不変条件に反する状態を残す。この状態では
      outbound_permit_result アーム（has_pending_reserve() が false）も drain / notify
      アーム（is_holding() が true）も無効になり、remainder を排出できる機構が
      1 つも残らない。さらに excludable_work が常に false になるため client アームが
      常時有効となり、biased 順で下にある writer_result アームが poll されず
      ループが break しない。到達経路は admit_blocking の Err を break に伝播しない
      呼び出し元 3 箇所（handle_create_window のエラー返信 2 つ、handle_attach の
      session-not-found 返信、handle_upgrade_request の全返信）。
