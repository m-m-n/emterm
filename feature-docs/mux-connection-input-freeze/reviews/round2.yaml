    title: "reply/reattach 経路の admit_blocking が select! ループ全体を停止させ、FR1 が未達のまま残る（task0003 で悪化）"
    description: >
      SPEC FR1（drain 側出力が pending の間も select! は framed.next() を有界遅延で
      poll し続ける）に対する残存違反。OutboundAdmission::admit_blocking は容量 2 の
      bounded mpsc に対して tx.send().await するが、これが handle_connection の
      client-message アーム本体（route_message 内）から呼ばれるため、await 中は
      client_reader.next() / kick_fut / writer_result / drain / notify のどのアームも
      poll されずタスク全体が停止する。クライアントがソケットを読まない限り writer は
      進めないので、この停止に内部的な上限は無い。さらに task0003 の rework で
      admit_blocking は「保持中の remainder を全て流してから自分のフレームを admit する」
      形になったため、ブロック時間は round 1 時点の「2 スロット空くまで」から
      「remainder 全体（doc 記載で最悪 ~4MB、send_reattach_data ではペイン数倍）を
      押し込むまで」に拡大している。到達経路は GUI の CreateWindow / Attach /
      Detach / Upgrade で実在する。FR5/TS1 の回帰テストは返信を伴わない PtyInput しか
      流さないため、この経路はピン留めされていない。performance 観点（88fb77d06c1adf66）、
      comprehensive 観点（e37794f998cbd7ac の前提）、architecture 観点
      （a10652d3307672fe）も同一の設計点を独立に指摘している。
      round 1 の f7fa656b26a25199（deferred）と同根で、順序の問題は解決した一方
      ブロック時間の問題は残っている。
    suggestion: >
      (a) 返信/reattach 経路も非ブロッキング形に寄せる — admit_blocking を廃し
      push_or_admit（remainder 末尾へ追加、FIFO 維持）に置き換える。
      send_reattach_data 用に複数フレームを一括で末尾追加するメソッドを用意すれば
      追い越し防止も保てる。remainder 増分は Attach 1 回あたりペイン数、
