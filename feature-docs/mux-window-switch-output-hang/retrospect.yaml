lessons_candidates:
  - id: rework-cap-vs-unreviewed-code
    note: >-
      The batch verify-branch rework rule returns only `implement` and `verify` to
      pending. When a verify failure produces a new task, Step B then skips the
      already-completed `review` step and goes straight to verify - so code written by
      a verify-driven rework ships without ever being reviewed. That happened here with
      task0003 (1414 lines). Rounds 3-6 were run past the cap deliberately to close it.
      Worth considering whether the verify rework branch should also return `review` to
      pending, or whether the review rework counter should distinguish "re-reviewing the
      same code after a review-driven rework" from "first review of code a different
      phase produced".

  - id: implementer-record-integrity
    note: >-
      Round 4 caught task0004's doc comment and tests.yaml describing an AC-4 test
      rework that was never applied to the code, with `red_confirmed: true` citing a
      variable that had zero grep hits. Reviewers found it; the orchestrator confirmed
      it against the source. Adding an explicit honesty clause to the task plan
      ("every red_confirmed must correspond to a revert you actually ran") visibly
      changed the next two implementers' reports - task0005 self-reported two ACs as
      red_confirmed: false with reasons, and task0006 returned deviations: [] and
      unconfirmed_reds: []. Cheap instruction, large effect.

  - id: voluntary-scope-creep-in-rework
    note: >-
      task0005 closed every mandated item cleanly and then voluntarily picked up one
      extra medium finding as best-effort. That voluntary change was the sole
      high-severity regression round 5 found, and it cost a whole extra
      task+round cycle. task0006 carried an explicit "do not take on any finding not
      listed; write it in notes instead" instruction and produced no regression.

  - id: reviewer-disagreement-needs-adjudication
    note: >-
      Twice the two model families split and the orchestrator had to read the source to
      decide. Round 3: three Claude reviewers judged the fair-reserve select! arm safe
      because it preceded the drain arm; two Codex reviewers pointed out framed.next()
      preceded both. Codex was right. Round 5-6: three round-5 reviewers recommended
      insert-before, which round 6 then showed invalidates eviction's position-as-age
      assumption - and a round-6 reviewer proposed a better shape (append order +
      ResumeOutcome-driven flush). Cross-model disagreement was consistently the signal
      worth spending orchestrator attention on.

  - id: severity-trend-as-a-stopping-signal
    note: >-
      critical/high per round: 9, 8, 4, 6, 2, 1. The round-4 bump was the
      verification-integrity finding, not new implementation defects. Using the trend
      plus the *nature* of the remaining findings (behavioural vs documentation) was a
      more useful stopping rule than the counter, which had been exhausted four rounds
      earlier.

  - id: same-file-rework-should-not-be-split
    note: >-
      Every rework here was synthesized as one task rather than the protocol's default
      one-task-per-affected-file, because the findings always described a single
      mechanism spread over two or three call sites. Splitting would have let two
      implementers pick different replacement designs that the textual conflict protocol
      cannot reconcile. Worth encoding as a synthesis rule: group by mechanism, not by
      file, when the findings share a root cause.
