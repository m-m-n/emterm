    rounds: 2
    commands_run:
      - command: "CARGO_TARGET_DIR=src-tauri/target cargo check --manifest-path src-tauri/Cargo.toml"
        exit_code: 0
      - command: "CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1"
        exit_code: 101
        result: "2955 passed / 7 failed / 3 ignored. The failure set is byte-identical to the pre-task0003 baseline: all 7 are tabs::tests::* and this feature touches neither tabs.rs nor app.rs. mux::* is 623/623 green (up from 613 before task0003 added its tests). No regression."
    passed_items:
      - "Build verification: cargo check exit 0"
      - "TS-1 / TS-2: now covered at the connection level — connection_level_deferred_snapshot_survives_sustained_saturation_and_input_keeps_flowing drives handle_connection's select! loop, saturates the channel, and asserts PtyInput for another pane is processed within a timeout (task0003 AC-3/AC-4, the finding that had survived both review rounds)"
      - "TS-3: ordering tests now call the production flush_deferred_output instead of an inline copy (AC-5), and SPEC FR3 was narrowed to the guarantee the implementation actually provides"
      - "TS-4: bound remains finite — chunks coalesce per pane and drop OLDEST at the cap; visibility resumes are de-duplicated by pane id and exempt from the cap (bounded by pane count, no payload)"
