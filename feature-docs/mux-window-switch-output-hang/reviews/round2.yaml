    line: 424
    line_end: 472
    title: "Deferred output can starve behind sustained PTY traffic"
    description: "The connection frees channel capacity while draining, but does not retry deferred items until after feeding the batch and awaiting framed.flush(). During that network wait, PTY reader threads can refill all freed slots via their blocking sends. Under sustained high output or a slow client, every subsequent flush_deferred_output can therefore observe a full channel and requeue the same head item indefinitely. The queue remains bounded, but recovery snapshots and visibility resumes may make no progress precisely during the saturation scenario that triggers deferral."
    suggestion: "Give deferred work a fair reservation before capacity is freed, such as a single connection-owned pending reserve_owned future polled by the event loop, or drain deferred chunks directly into the connection's local outgoing batch before awaiting socket I/O. Avoid relying on a post-network-write try_send that continually races already-waiting PTY producers."
