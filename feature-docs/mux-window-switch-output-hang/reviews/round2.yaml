    description: "round 1 の F4/F5（順序保証）は現コードでも閉じていない。むしろ「順序ずれ」から「飢餓」へ悪化している。(1) flush_deferred_output は try_send / try_reserve のみで再試行する。一方 mux/ipc/pty_spawn.rs:841 のリーダースレッドは同じ pane_output_tx に対して blocking_send で待機する。tokio の mpsc は内部 semaphore の waiter キューを持ち、permit が解放されると待機中の waiter に直接引き渡されるため、waiter が 1 本でも park していると try_send は永久に空き容量を観測できない。SPEC が対象にしている「大量出力中のウィンドウ切替」はまさにリーダースレッドが常時 park している状況であり、deferred な Snapshot チャンクは出力が止むまで送られない可能性がある。クライアント側 tabs.rs:3295 request_pane_snapshot は fire-and-forget（再送なし）なので、ユーザーから見た症状は「切替先ペインが空白/stale のまま」で、修正前の hang とほぼ同じ見え方になる。(2) 仮に送れても順序が壊れる。connection.rs の drain アームは drain → framed.feed().await / framed.flush().await → flush_deferred_output の順で、feed/flush の await 中にリーダースレッドが 64 スロット（DRAIN_BATCH_LIMIT=64, 容量 256）を容易に埋め戻す。結果として「スナップショット生成時刻 T より後に生成された PTY バイト」が先にクライアントへ届き、その後に T 時点のスナップショットが MessageType::Snapshot → build_from_snapshot でグリッド全体を再構築するため、後から来た出力が巻き戻って消える。DeferredOutputQueue の doc はこの残件を「capacity が空く瞬間の cross-thread race」と極小に記述しているが、実際には waiter 優先の permit 引き渡しにより恒常的に負ける構造であり、また doc の「task0001 以前も同等の形で存在した」という主張は誤り（send().await は waiter キューに並ぶので到着順に公平だった）。さらに task0002.tests.yaml の AC-2 が根拠として挙げるテストは、いずれも本番の drain アーム（feed/flush の await を挟む）ではなく明示的に flush_deferred_output を直後に呼ぶ形なので、本番コードが持たない順序性を pin している。"
