    title: "Visibility resumes can fan out into an unbounded task backlog"
    description: "When the channel is full, the loop spawns one waiting task for every candidate pane. Repeated false/true visibility edges can enqueue another complete set before existing tasks acquire permits, producing O(panes x edges) tasks. Once capacity returns, stale tasks sequentially reserve slots, acquire the global session-manager lock, and scan windows even when another task already resumed the pane, causing memory growth, CPU churn, and delayed PTY output."
