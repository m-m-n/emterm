    title: "Full-channel snapshots escape the channel's memory bound"
    description: "Every failed try_send spawns a task that retains the entire chunk until capacity becomes available. Snapshot chunks can approach 2 MiB, and the connection select loop prioritizes inbound messages over draining output. A slow outbound client issuing repeated snapshot requests can therefore accumulate an unbounded number of multi-megabyte buffers and tasks outside the nominal 256-item channel, eventually exhausting daemon memory."
    suggestion: "Keep overflow state bounded and connection-owned. For example, retain at most one pending snapshot per pane and coalesce newer requests, or use one dispatcher backed by a strictly bounded pending-byte budget. Reject, drop, or disconnect on excess work instead of spawning one task per chunk."
