workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: 67e31fd21a4f51280f0b472a6358ea45922e3145
  - id: design
    artifacts: [DESIGN.md, design/]
    status: skipped
    skipped_reason: >
      変更対象が Rust の内部状態フィールド・doc コメント・ユニットテストのみで、
      UI 表面・デザイントークン・WebView のいずれにも触れないため。採用した
      remove-buffer 方式は通知の配送タイミングを変えないため、設計検討を要する
      挙動変更も生じない。
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: completed
    completed_at_commit: 6f975543805fee8df00bfb04bc1f68e27a929311
  - id: implement
    status: completed
    completed_at_commit: 98ef32fa32a777470dd8862107cbad605078aee9
    base_commit: f7e9f98e4ae95649f25d9a8c5137ae87e4248122
  - id: review
    status: completed
    completed_at_commit: d187e35f187ec4984052180ff19f83d2b1c70dad
  - id: verify
    status: completed
    completed_at_commit: e26b7ce94ca69c462004b359ea2af8fc240eac18
    result: pass
    failed_items: []
    notes: >
      自動 8 / 手動 3 を実行し、AC1-AC8 すべて充足。
      TS5 の `--lib` 並列実行で app::tests::timing::frame_work_pending_true_when_restart_flag_raised_and_consumes_nothing
      が 1 件落ちるが、base commit の main (12cebc80) でも同一テストが同一条件で落ちることを
      実測で確認済みの pre-existing フレークであり、本 feature の変更面
      (src-tauri/src/callbacks.rs / callbacks/tests.rs) とは無関係。
      承認済みの `-- --test-threads=1` 変種では 3248 passed / 0 failed で完全にグリーン。
      NFR3 が変更面を 2 ファイルに限定しているため本タスクでは修正せず、別タスクとして起票する。
      M4（実機ランタイムスモーク）は GUI ビルドをユーザーが起動する必要があり無人実行では
      実施不能。VERIFICATION.md 自身が "not required for AC sign-off" と明記しているため未実施。
  - id: retrospect
    status: completed
    completed_at_commit: 378dbf0af5e7f7c5c3e3fceae5e4913ce985ef8d

