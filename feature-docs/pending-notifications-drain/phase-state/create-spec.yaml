  requirement.remediation-approach:
    packet_id: pending-notifications-drain-q0001
    answered_at: "2026-08-15T20:14:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [remove-buffer]
    freeform: null
    normalized_answer: >
      バッファを廃止する。`handle_notify` の push・`NativeCallbackState::pending_notifications`
      フィールド・callbacks.rs:388-390 の doc コメントを削除し、配送は既存のインライン
      `sink.send` のまま維持する。tests.rs:135 / :316 の観測フックは `TestSink` の
      受信記録に対するアサーションへ書き換える。
    resolution_note: >
      batch-policies.yaml の create-spec.requirement-clarification は
      action: codex_consultation。Codex は remove-buffer を選択し、その根拠
      (production consumer 不在 / 配送済みデータの重複保持 / 攻撃者影響下文字列の
      無期限保持) は analyst の confirmed_facts と一致する。option_id は packet の
      options に存在し、analyst の recommended とも一致するため採用した。
      record_as_assumption: true に従い、run report に記録する。
  design-step.recommendation:
    packet_id: pending-notifications-drain-q0001
    answered_at: "2026-08-15T20:14:00+09:00"
    source: batch-decision-table
    answer_mode: single_select
    selected_option_ids: [skip]
    freeform: null
    normalized_answer: >
      design ステップはスキップする。変更対象は Rust 内部状態フィールド・doc コメント・
      ユニットテストのみで、UI 表面・デザイントークン・WebView のいずれにも触れない。
    resolution_note: >
      batch-policies.yaml の create-spec.design-step は option_id: decide_autonomously
      (オーケストレーターが自律決定せよという指示であり、worker の options に列挙される
      値ではない)。analyst の design_step_recommendation.value = skip、かつ選択した
      remove-buffer 方式は配送タイミングを変えないため perform の根拠も消える。
      よって skip を採用した。
