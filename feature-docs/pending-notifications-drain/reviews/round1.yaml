    file: src-tauri/src/callbacks.rs
    line: 560
    line_end: 567
    title: "Potential blocking I/O introduced by removing notification buffer"
    description: >
      The pending_notifications buffer previously kept D-Bus calls out of the PTY
      processing hot path. Without buffering, each OSC 9 notification immediately
      triggers `self.sink.send(&title, &body)` which may involve synchronous D-Bus
      round-trips in process_pty_data. This could block terminal rendering if D-Bus
      is slow or congested.
    suggestion: >
      (reviewer supplied prose only — no diff)
    sources: [litellm:vertex-deepseek-v3.2:performance]
    confidence: 50
    resolution: declined
    resolution_reason: >
      前提が事実に反する。オーケストレーターが git で直接検証した:
      (1) `git show f7e9f98e:src-tauri/src/callbacks.rs` の handle_notify は変更前から
      `self.sink.send(&title, &body)` をインラインで同期実行しており、この呼び出しは
      本 diff で 1 バイトも動いていない。(2) 変更前ツリー全体を grep しても
      `pending_notifications` の drain は 1 箇所も存在せず（宣言・push・テスト 2 箇所の
      計 4 箇所のみ、app/mod.rs の同名ローカルは別型の無関係変数）、
      「バッファが D-Bus をホットパスの外に出していた」という前提そのものが成立しない。
      よって本 diff はブロッキング I/O を新規導入していない（削除したのは
      配送に寄与しない書き込み専用バッファだけ）。
      独立に claude:performance / claude:comprehensive / codex:security の 3 レビュアーが
      同じ結論に到達している。加えて、この指摘が示唆する唯一の是正
      （buffer-then-drain の再導入）は SPEC FR4「配送はインライン sink.send のまま維持」・
      NFR1「観測可能な挙動の不変性」・NFR2「代替バッファを導入しない」に正面から反するため、
      auto-fix の対象にしない。
  - stable_id: 540afd1119b3428c
    severity: medium
    category: spec
    file: src-tauri/src/callbacks.rs
    line: 316
    line_end: 368
    title: "AC2 / Data Flow の「配信後に生 title/body を保持する構造は残らない」がレートリミッタの dedupe マップにより満たされていない"
    description: >
      SPEC の Data Flow は「After the change, the raw title / body live only for the
      duration of the `handle_notify` call; no process-local structure retains them
      (NFR2, AC2)」と述べ、AC2 も同趣旨。しかし既存の
      `NotificationRateLimiter.last: Mutex<HashMap<(String, String), Instant>>`
      (callbacks.rs:316) が `should_emit` で `(title.to_string(), body.to_string())` を
      鍵として挿入し、GC は window の 4 倍（既定 4 秒）より古いエントリしか退避しない。
      よって配信後も生の title/body は最大約 4 秒プロセスメモリに残る。
      pending_notifications 除去で OBJ1（無限成長の停止）は達成されているが、
      OBJ2 / AC2 が字義どおりには成立しない。FR7 がレートリミッタ非改変を要求しているため
      実装側の逸脱ではなく、SPEC 記述と実コードの齟齬。
    suggestion: >
      (a) SPEC 側を実態に合わせ、AC2 / Data Flow を「新たな保持構造を導入しない（NFR2）」に
      限定し、dedupe マップが最大 4×window の間 (title, body) を保持する残存リスクを明記する。
      (b) OBJ2 を字義どおり満たすなら、NotificationRateLimiter の鍵を生文字列から
      ハッシュ等の不可逆値へ変更する案を別タスクとして起票する（FR7 の文言更新が要るため
      本タスク内では実施しない）。
    sources: [claude:spec]
    confidence: 60
    resolution: deferred
    resolution_reason: >
      severity medium のため完了ゲート（residual_critical_high）に掛からない。
      是正案 (a) は SPEC.md の書き換え＝仕様変更、(b) は FR7 の文言変更を伴う別スコープで、
