lessons_candidates:
  - >
    クロスモデルレビュアー（litellm:vertex-deepseek-v3.2）が、削除された doc コメントの記述を
    そのまま「変更前の実態」として読み、存在しなかった drain を前提に critical を 1 件出した。
    doc コメントと実装が乖離しているコードを削除する diff では、コメント側の主張がレビュアーの
    事実誤認を誘発しうる。オーケストレーター側で `git show <base>:<file>` による前提の実地検証が
    効いた。auto-fix の candidate gate は severity だけを見るため、前提が反証された critical を
    そのまま prose→needs-judgment→「Apply as-is」に流すと SPEC に反する修正が入りうる —
    R3/R4 の間に「前提が SPEC と矛盾する指摘は declined に落とす」判断点があると安全。
  - >
    リポジトリに pre-existing の並列実行フレーク（app::tests::timing）があり、
    verify の test_command が既定で並列実行のため毎回 1 件赤になる。
    implementer の baseline_failures と、base commit での実測比較の両方でしか
    「自分のせいではない」を証明できなかった。プロジェクト側で
    `-- --test-threads=1` を既定の test_command にするか、当該テストを修正する価値がある。
  - >
    integration worktree は src-tauri/assets/fonts/ と viewer/dist/ が空（どちらも gitignored）
    のため、verify の build/test 前に fetch-fonts + bun build の前処理が必須だった。
    承認済みの複合コマンド文字列が既にあったので詰まらなかったが、feature worktree を
    使うワークフローでは「gitignored な生成物は worktree 間で共有されない」が繰り返し効く。
