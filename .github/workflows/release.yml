name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract tag message
        id: tag-message
        run: |
          TAG_NAME="${{ steps.get-version.outputs.version }}"
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME")
          {
            echo 'message<<EOF'
            echo "$TAG_MESSAGE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: Release ${{ steps.get-version.outputs.version }}
          body: ${{ steps.tag-message.outputs.message }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            librsvg2-bin \
            libasound2-dev \
            patchelf \
            dpkg

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        run: bun install

      - name: Build GUI deb
        run: bash scripts/build-dpkg.sh

      - name: Upload GUI deb to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.version }}" \
            build/emterm_*.deb \
            --repo "${{ github.repository }}"

  build-cli:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION#v}"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build CLI deb package
        run: EMTERM_CLI_ONLY=1 bash scripts/build-dpkg.sh

      - name: Upload CLI deb to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.version }}" \
            build/emterm-cli_*.deb \
            --repo "${{ github.repository }}"

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        run: bun install

      - name: Build web bundles
        run: |
          bun run build:viewer
          bun run build:settings

      - name: Build Windows binary
        shell: bash
        env:
          CARGO_TARGET_DIR: src-tauri/target-win
        run: |
          cargo build --release \
            --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc

      - name: Upload Windows binary to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.version }}" \
            "src-tauri/target-win/x86_64-pc-windows-msvc/release/emterm.exe" \
            --repo "${{ github.repository }}"

  publish-release:
    needs: [create-release, build-linux, build-cli, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }} \
            --method PATCH \
            -f draft=false
