name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  sync-version:
    runs-on: ubuntu-latest
    # Only runs when a version is actually resolvable (workflow_dispatch
    # with a tag input, or an actual tag push); otherwise skip so
    # create-release below still proceeds (NFR2). `continue-on-error` is
    # deliberately not used here: a real failure (e.g. push rejected by
    # branch protection) must block the release (FR3), not be swallowed.
    if: ${{ github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version from tag
        id: get-version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF_VAR: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_VAR" != "${GITHUB_REF_VAR#refs/tags/}" ]; then
            echo "version=${GITHUB_REF_VAR#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag input is empty and $GITHUB_REF_VAR is not a tag ref"
            exit 1
          fi

      - name: Sync version into Cargo manifest and lockfile
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          # Anchored, full-string semver match (not a `case` prefix glob):
          # only a bare X.Y.Z, optionally followed by one `-`/`+` suffix of
          # alnum/dot/hyphen, may reach sed/awk below. The error message
          # intentionally omits the raw value.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::refusing to sync a non-semver version into main"
            exit 1
          fi
          echo "Syncing version to $VERSION"

          sed -i -E "/^\[package\]/,/^\[/ { /^version = / s/.*/version = \"$VERSION\"/; }" src-tauri/Cargo.toml
          TOML_VERSION=$(sed -n -E '/^\[package\]/,/^\[/{ /^version = "/ s/^version = "(.*)"$/\1/p }' src-tauri/Cargo.toml | head -n1)
          if [ "$TOML_VERSION" != "$VERSION" ]; then
            echo "::error::src-tauri/Cargo.toml version did not update to the expected value"
            exit 1
          fi

          # The workspace's single Cargo.lock lives at the repo root (this
          # workspace's manifest is ./Cargo.toml, members = ["src-tauri", ...]);
          # cargo never reads/writes a src-tauri/Cargo.lock, so that path is not
          # the file to rewrite here.
          awk -v ver="$VERSION" '
            /^\[\[package\]\]$/ { in_target = 0 }
            /^name = "emterm"$/ { in_target = 1 }
            in_target && /^version = / && !done { print "version = \"" ver "\""; done = 1; next }
            { print }
            END { if (!done) { print "no emterm [[package]] entry found in Cargo.lock" > "/dev/stderr"; exit 1 } }
          ' Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp Cargo.lock

          LOCK_VERSION=$(awk '
            /^\[\[package\]\]$/ { in_target = 0 }
            /^name = "emterm"$/ { in_target = 1 }
            in_target && /^version = "/ { gsub(/version = "|"/, ""); print; exit }
          ' Cargo.lock)
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.lock version did not update to the expected value"
            exit 1
          fi

      - name: Commit and push version bump
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "Version already matches $RELEASE_VERSION; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml Cargo.lock
          git commit -m "chore: sync version to ${RELEASE_VERSION#v}"
          git push origin HEAD:main

  create-release:
    needs: sync-version
    # Proceed when sync-version succeeded OR was skipped (no resolvable
    # version — NFR2 skip path); block when it actually failed or was
    # cancelled, so a real failure (e.g. push rejected) stops the release
    # instead of racing ahead of the version bump (FR3).
    if: ${{ always() && needs.sync-version.result != 'failure' && needs.sync-version.result != 'cancelled' }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get-version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF_VAR: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_VAR#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract tag message
        id: tag-message
        env:
          TAG_NAME: ${{ steps.get-version.outputs.version }}
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME")
          {
            echo 'message<<EOF'
            echo "$TAG_MESSAGE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: Release ${{ steps.get-version.outputs.version }}
          body: ${{ steps.tag-message.outputs.message }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            librsvg2-bin \
            libasound2-dev \
            patchelf \
            dpkg

      - name: Cache bundled fonts
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/fonts/*.ttf
            src-tauri/assets/fonts/*.otf
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}

      - name: Fetch bundled fonts
        run: bash scripts/fetch-fonts.sh

      - name: Set version from tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          echo "Setting version to $VERSION"
          sed -i.bak -E "/^\[package\]/,/^\[/ { /^version = / s/.*/version = \"$VERSION\"/; }" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build GUI deb
        run: bash scripts/build-dpkg.sh

      - name: Upload GUI deb to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_VERSION" \
            build/emterm_*.deb \
            --repo "$REPO"

  build-cli:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          sed -i -E "/^\[package\]/,/^\[/ { /^version = / s/.*/version = \"$VERSION\"/; }" src-tauri/Cargo.toml

      - name: Build CLI deb package
        run: EMTERM_CLI_ONLY=1 bash scripts/build-dpkg.sh

      - name: Upload CLI deb to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_VERSION" \
            build/emterm-cli_*.deb \
            --repo "$REPO"

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache bundled fonts
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/fonts/*.ttf
            src-tauri/assets/fonts/*.otf
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}

      - name: Fetch bundled fonts
        shell: bash
        run: bash scripts/fetch-fonts.sh

      - name: Set version from tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          echo "Setting version to $VERSION"
          sed -i.bak -E "/^\[package\]/,/^\[/ { /^version = / s/.*/version = \"$VERSION\"/; }" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundles
        run: |
          bun run build:viewer
          bun run build:settings

      - name: Build Windows binary
        shell: bash
        env:
          CARGO_TARGET_DIR: src-tauri/target-win
        run: |
          cargo build --release \
            --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc

      - name: Upload Windows binary to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_VERSION" \
            "src-tauri/target-win/x86_64-pc-windows-msvc/release/emterm.exe" \
            --repo "$REPO"

  publish-release:
    needs: [create-release, build-linux, build-cli, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            --method PATCH \
            -f draft=false \
            -f make_latest=true
