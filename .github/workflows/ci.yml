name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Frozen-lockfile install: a declaration committed without a
      # regenerated lockfile fails here instead of silently resolving a
      # different dependency graph.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run bun test suite
        run: bun test

  verify-font-bootstrap:
    runs-on: ubuntu-latest
    # Generous enough for real cargo builds plus one real font download,
    # so a hang fails the job instead of consuming the runner budget.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Mirrors release.yml's build-linux job: the GUI feature is on by
      # default, so the verification's real builds link the desktop stack.
      # Without these the job would fail for an unrelated linker reason.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            librsvg2-bin \
            libasound2-dev \
            patchelf \
            dpkg

      # Deliberately no font-cache step here: the un-fetched scenario's
      # whole value depends on starting from an empty font directory.
      - name: Run font bootstrap verification
        run: bash scripts/verify-font-bootstrap.sh
