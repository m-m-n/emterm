name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Frozen-lockfile install: a declaration committed without a
      # regenerated lockfile fails here instead of silently resolving a
      # different dependency graph.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run bun test suite
        run: bun test
