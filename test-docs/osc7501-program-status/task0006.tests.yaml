      - mux::osc_identify::tests::round3_ac4_a_number_of_one_million_digits_finishes_within_two_seconds_and_matches_the_reference
    red_confirmed: true
    red_reason: >-
      The `OscIdentity::ProgramStatus` variant did not exist, so a variant that
      neither identification path produced was put in to let the tests compile.
      Against it `osc7501_ac1_program_status_is_identified_in_all_forms` failed
      with `reference identity of "7501;?" left: NotIdentified` (right:
      ProgramStatus) and `round3_ac1_the_corpus_reaches_every_identity` failed
      with `no corpus body identifies as ProgramStatus`. The two neighbour
      tests (`numbers_next_to_7501_keep_their_identity`,
      `the_other_identities_are_unchanged`) and the corpus-equality,
      allocation-free and one-mebibyte tests passed against that variant (both
      identification paths agreed on NotIdentified); they guard the unchanged
      identities and the zero-allocation equality over the corpus extended with
      7501 cases and are not themselves reds.
  AC-2:
    tests:
      - mux::scrollback_filter::tests::osc7501_ring_write_strip_removes_reports_and_queries
      - mux::scrollback_filter::tests::osc7501_snapshot_strip_removes_reports_and_queries
      - mux::scrollback_filter::tests::osc7501_strip_and_remap_removes_reports_and_queries_and_remaps_offsets
      - mux::scrollback_filter::tests::osc7501_strip_leaves_every_previously_kept_sequence_unchanged
      - mux::scrollback_filter::tests::osc7501_replay_bytes_built_from_a_ring_that_saw_the_traffic_carry_no_osc_7501
      - mux::snapshot_bytes::tests::build_snapshot_bytes_strips_program_status_sequences_from_scrollback
      - mux::scrollback_filter::tests::strip_concat_every_entry_point_closes_an_open_csi_at_every_removed_construct
      - mux::scrollback_filter::tests::strip_concat_a_construct_removed_in_ground_adds_no_closing
      - mux::scrollback_filter::tests::open_body_closure_every_entry_point_closes_an_open_body_at_every_removed_construct
      - mux::scrollback_filter::tests::post_strip_state_form_reports_the_csi_state_of_the_written_bytes
      - mux::snapshot_bytes::tests::build_snapshot_bytes_segments_follow_a_construct_removed_inside_an_open_body
      - mux::scrollback_filter::tests::every_strip_entry_point_keeps_non_launch_and_overflowed_osc_bodies
      - mux::scrollback_filter::tests::every_strip_entry_point_keeps_a_designator_esc_and_what_follows_it
    red_confirmed: true
    red_reason: >-
      With the compile-only `ProgramStatus` variant in place (the strip treated
      it as not replayable), the new strip tests failed:
      `osc7501_ring_write_strip_removes_reports_and_queries` with `body "7501;?"
      must be stripped on ring write` (the output still held `ESC ] 7501 ; ?
      BEL`), the snapshot and strip-and-remap tests the same,
      `osc7501_strip_leaves_every_previously_kept_sequence_unchanged` with the
      7501 sequences still between the kept ones,
      `osc7501_replay_bytes_built_from_a_ring_that_saw_the_traffic_carry_no_osc_7501`
      with `the ring write path keeps no OSC 7501`, and
      `build_snapshot_bytes_strips_program_status_sequences_from_scrollback`
      with `snapshot must carry no OSC 7501 and keep every other byte`. The
      shared removal tables `CONCAT_TARGETS` and `POST_STRIP_REMOVED` were
      extended with an OSC 7501 query and report, which turned
      `strip_concat_every_entry_point_closes_an_open_csi_at_every_removed_construct`,
      `strip_concat_a_construct_removed_in_ground_adds_no_closing`,
      `open_body_closure_every_entry_point_closes_an_open_body_at_every_removed_construct`,
      `post_strip_state_form_reports_the_csi_state_of_the_written_bytes` and
      `build_snapshot_bytes_segments_follow_a_construct_removed_inside_an_open_body`
      red as well. `every_strip_entry_point_keeps_non_launch_and_overflowed_osc_bodies`
      (kept bodies 7500, 7502, 750, 17501, 75010) and
      `every_strip_entry_point_keeps_a_designator_esc_and_what_follows_it`
      (7501 after a designator ESC) passed before the change and guard that
      every sequence kept before stays kept; they are not reds.
