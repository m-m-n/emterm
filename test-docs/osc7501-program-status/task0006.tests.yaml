    red_confirmed: true
    red_reason: >-
      With a `ScanItemKind::ProgramStatusQuery` kind and an
      `is_program_status_query` that always answered false (nothing produced the
      item), the new delivery tests failed:
      `osc7501_query_predicate_selects_exactly_the_question_mark_query` with
      `body "7501;?"`, `osc7501_scan_reports_a_complete_query_as_one_item_with_its_own_terminator`
      with `left: []` (no item), `osc7501_scan_reports_a_query_split_across_window_and_chunk_once`
      with `left: 0` items, `osc7501_scan_keeps_stream_order_with_the_other_item_kinds`
      with the 7501 query missing between the CSI and color items, and in the
      replacement builder
      `osc7501_query_outside_ring_written_ranges_is_redelivered_with_its_own_terminator`
      with an empty replacement (`left: []`), plus the inside-ring, split,
      stream-order, carried-over and `is_deliverable_osc` tests. The report and
      near-miss tests (`osc7501_report_in_a_suppressed_chunk_is_not_carried`,
      `osc7501_near_misses_of_the_query_are_not_carried`,
      `osc7501_scan_reports_no_item_for_a_report_and_a_tail_for_an_incomplete_query`,
      `osc7501_is_neither_a_viewer_launch_nor_a_color_query`) and the existing
      viewer-launch and agent-status cases listed above passed before the
      change; they guard that a 7501 report is never carried and that the
      viewer-launch selection is unchanged, and are not reds.
