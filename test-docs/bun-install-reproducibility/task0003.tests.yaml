task_id: task0003
baseline_failures:
  - "plugin/marketplace version regression guard (task0002 AC-9) > plugin.json still reports version 0.1.0"
  - "plugin/marketplace version regression guard (task0002 AC-9) > marketplace.json still reports the emterm plugin entry as version 0.1.0"
  - "viewer entry > renders an injected sample into the fullscreen content structure"
  - "viewer entry > parses the shared Rust/TS payload fixture with all fields"
final_failures:
  - "plugin/marketplace version regression guard (task0002 AC-9) > plugin.json still reports version 0.1.0"
  - "plugin/marketplace version regression guard (task0002 AC-9) > marketplace.json still reports the emterm plugin entry as version 0.1.0"
  - "viewer entry > renders an injected sample into the fullscreen content structure"
  - "viewer entry > parses the shared Rust/TS payload fixture with all fields"
acceptance_tests:
  AC-1:
    tests:
      - "CI workflow: exactly one workflow runs the bun test suite (AC-1) > exactly one workflow file has a step running the bun test suite"
      - "CI workflow: exactly one workflow runs the bun test suite (AC-1) > that workflow's trigger covers push to main and pull_request targeting main"
    red_confirmed: true
    red_reason: >-
      Before ci.yml existed, the workflow directory had zero workflows whose
      steps ran the bun test suite: `withTestStep` resolved to length 0, so
      `expect(withTestStep).toHaveLength(1)` failed with "Expected length: 1,
      Received length: 0", and the trigger-coverage test failed identically
      (no matching workflow to inspect).
  AC-2:
    tests:
      - "CI workflow: frozen install precedes the test step, nothing before it touches deps (AC-2) > a frozen-lockfile install step exists in the same job, before the test step"
      - "CI workflow: frozen install precedes the test step, nothing before it touches deps (AC-2) > no step before the install step consumes the dependency graph"
    red_confirmed: true
    red_reason: >-
      Both tests depend on resolving the test-running workflow first
      (`resolveTestWorkflow()`), which itself asserts exactly one match; with
      no ci.yml present this failed the same "Expected length: 1, Received
      length: 0" assertion before any workflow-specific check ran.
  AC-3:
    tests:
      - "CI workflow: the test step covers the viewer entry tests (AC-3) > the test step's command runs the whole suite or names the viewer entry test path"
    red_confirmed: true
    red_reason: >-
      `findTestStep(doc)` on `withTestStep[0]` threw "TypeError: Cannot
      destructure property 'doc' from null or undefined value" because no
      workflow ran the test suite yet, failing the test before any assertion
      could run.
  AC-4:
    tests:
      - "Every CI install invocation is frozen-lockfile (AC-4) > no plain `bun install` remains in any workflow file"
      - "Every CI install invocation is frozen-lockfile (AC-4) > at least one frozen-lockfile install invocation exists (the guarantee is exercised)"
      - "release.yml still runs its bundle builds on both platforms, unmoved (AC-6) > both platform install steps are frozen-lockfile installs"
    red_confirmed: true
    red_reason: >-
      Against the base release.yml (only workflow file at the time), the
      offenders list was non-empty: ["release.yml:build-linux[8]: bun
      install", "release.yml:build-windows[7]: bun install"], failing
      `expect(offenders).toEqual([])`; the "at least one frozen install
      exists" test failed with "Expected: > 0, Received: 0"; and the
      release.yml-scoped check failed with "Expected: bun install
      --frozen-lockfile, Received: bun install" for both jobs.
  AC-5:
    tests:
      - "No workflow step generates, edits, or commits a lockfile (AC-5) > no step's run script mutates or commits bun.lock"
    red_confirmed: false
    red_reason: >-
      Preventative criterion (task0003.md Test Notes / IMPLEMENTATION.md
      error-handling policy): no workflow step in the base commit ever
      generated, edited, or committed a lockfile, so this assertion passed
      before this task touched any file and continues to pass after. There
      was no pre-existing violation to turn red; the test's value is
      guarding against a future regression, not proving this task changed
      behavior.
  AC-6:
    tests:
      - "release.yml still runs its bundle builds on both platforms, unmoved (AC-6) > build-linux job step sequence is unchanged (names, order, count)"
      - "release.yml still runs its bundle builds on both platforms, unmoved (AC-6) > build-linux delegates the bundle build to scripts/build-dpkg.sh, unchanged"
      - "release.yml still runs its bundle builds on both platforms, unmoved (AC-6) > build-windows job step sequence is unchanged (names, order, count)"
      - "release.yml still runs its bundle builds on both platforms, unmoved (AC-6) > build-windows still builds both the viewer and settings bundles"
    red_confirmed: false
    red_reason: >-
      AC-6 is a diff-shaped criterion (task0003.md Test Notes): the
      structural step-name/order assertions were derived from, and already
      true against, the base commit's release.yml before this task's own
      change (which only edits the two `run:` string values, not step
      names/order/count). They passed before and continue to pass after;
      their role is a regression guard against this task's install-form
      change disturbing the bundle-build steps, not a red-to-green proof.
  AC-7:
    tests: []
    red_confirmed: true
    red_reason: >-
      AC-7 is the meta-criterion that ci-workflows.test.ts asserts AC-1
      through AC-5 and passes. Before this task, ci-workflows.test.ts did
      not exist; after writing it, 8 of its assertions failed against the
      base workflow directory (see AC-1..AC-4 entries above) and all now
      pass against the implemented workflows (13 pass / 0 fail on
      `bun test ci-workflows.test.ts`).
