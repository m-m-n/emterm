  - "plugin/marketplace version regression guard (task0002 AC-9) > marketplace.json still reports the emterm plugin entry as version 0.1.0"
  - "viewer entry > renders an injected sample into the fullscreen content structure"
  - "viewer entry > parses the shared Rust/TS payload fixture with all fields"
acceptance_tests:
  AC-1:
    tests: []
    red_confirmed: true
    red_reason: >-
      `git check-ignore -v bun.lock` in the pre-fix worktree matched
      `.gitignore:42:bun.lock` (exit 0) and `git ls-files` did not list
      bun.lock as tracked. After removing the `.gitignore` rule and
      committing bun.lock, `git check-ignore -v bun.lock` exits 1 (no
      match) and `git ls-files --error-unmatch bun.lock` exits 0 (tracked).
  AC-2:
    tests: []
    red_confirmed: true
    red_reason: >-
      Before the fix, `git ls-files` listed package-lock.json as tracked
      and it existed on disk. After `git rm --cached package-lock.json`
      plus removing it from the working tree and committing, `git ls-files`
      no longer lists it, the file is absent from the working tree, and no
      other JS lockfile (yarn.lock/pnpm-lock.yaml/npm-shrinkwrap.json)
      exists at the repository root.
  AC-3:
    tests: []
    red_confirmed: true
    red_reason: >-
      In a scratch worktree checked out at the pre-fix commit (84d05dfd,
      no committed bun.lock), `bun install --frozen-lockfile` exited 1
      with "error: lockfile had changes, but lockfile is frozen" (it had
      to migrate package-lock.json first, which --frozen-lockfile
      disallows). In a fresh scratch worktree checked out at this task's
      commit (7a7fe1d5), the same command exited 0: "Checked 142 installs
      across 147 packages (no changes)".
  AC-4:
    tests: []
    red_confirmed: false
    red_reason: >-
      Not independently red/green-able as a failing-then-passing test:
      it is a cross-worktree comparison. Evidence: two separate scratch
      worktrees created from this task's commit (7a7fe1d5), each installed
      independently via `bun install --frozen-lockfile`, both resolved
      dompurify to node_modules/dompurify/package.json "version": "3.4.14".
  AC-5:
    tests: []
    red_confirmed: true
    red_reason: >-
      In a scratch worktree at this task's commit, mutating the
      package.json dompurify range from "^3.3.1" to the exact pin
      "3.4.0" (a real, published version not satisfied by the frozen
      "3.4.14" lock entry) and running `bun install --frozen-lockfile`
      exited 1 with "error: lockfile had changes, but lockfile is frozen".
      The mutation was made and observed only in the scratch worktree and
      was never committed or carried into this task's branch.
  AC-6:
    tests: []
    red_confirmed: true
    red_reason: >-
      The committed bun.lock is the direct, unedited output of `bun
      install` run against the declaration on this branch (generated by
      migrating package-lock.json once, then committed verbatim). The
      AC-3 positive run ("no changes") on a clean checkout is the
      mechanical proof: a frozen-lockfile install against the committed
      declaration requires zero lockfile changes, so nothing in bun.lock
      was hand-edited after generation.
