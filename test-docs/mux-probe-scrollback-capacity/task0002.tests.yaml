      - mux::ipc::reattach::tests::collect_reattach_data_visible_reattach_site_reach_uses_the_passed_probe_capacity
      - mux::session::pane::tests::test_evaluate_output_target_resume_site_reach_uses_the_passed_probe_capacity
      - mux::session::pane::tests::test_resume_pane_with_permit_site_reach_uses_the_passed_probe_capacity
    red_confirmed: true
    red_reason: >-
      Each of the 7 production call sites this AC covers (on-demand
      RequestPaneSnapshot, visibility-resume immediate path, both deferred
      visibility-resume flush paths, visible reattach, and both siblings of
      the resume SSOT — `evaluate_output_target`'s resume branch and
      `resume_pane_with_permit`) was temporarily hardcoded to pass the fixed
      10,000 cap to its inner builder call instead of its own
      `probe_capacity` parameter, simulating "the argument is accepted but
      never actually reaches the builder." All 7 corresponding site-reach
      tests failed as expected (0 passed, 7 failed) when run together
      (`cargo test ... site_reach`), each asserting equality against a
      directly-computed builder call at capacity 5 and divergence from the
      same at capacity 10,000 — with the hardcoding in place, every site
      degraded to the 10,000 shape and both assertions failed. Reverted
      immediately after the run; `mux::ipc::handlers` (55/55),
      `mux::ipc::reattach` (21/21), `mux::session::pane` (88/88), and the
      full lib suite were re-verified green afterward.
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      Documentation and log-level audit, not an executable check. Verified
      by direct inspection: `PROBE_SCROLLBACK_LINES`'s doc comment
      (dump_block.rs) states both known limits under a "Known limits of the
      cap (FR8)" heading — (a) a client-reported capacity above 10,000 still
      runs the probe at the cap, so a residual cursor-row mismatch can
      remain exactly as before this feature, and (b) a mixed old/new
      deployment falls back to the legacy 10,000 cap whenever nothing was
      reported — and explicitly states the cap does NOT change how long the
      daemon holds any lock while assembling a snapshot. `git diff` over
      every file this task touched shows exactly one new `log::` call (the
      malformed-payload diagnostic in `connection/dispatch.rs`), and it is
      `log::warn!`; no `log::debug!`/`log::info!`/`log::trace!` was added.
