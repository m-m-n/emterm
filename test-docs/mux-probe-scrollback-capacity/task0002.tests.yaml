acceptance_tests:
  AC-1:
    tests:
      - mux::snapshot_bytes::dump_block::tests::probe_replay_state_matches_the_oracle_at_capacity_zero_across_a_rows_only_grow_resize
      - mux::snapshot_bytes::dump_block::tests::probe_replay_state_matches_the_oracle_at_capacity_zero_across_a_rows_and_columns_grow_resize
      - mux::snapshot_bytes::dump_block::tests::probe_replay_state_matches_the_oracle_across_capacities_when_current_dims_exceeds_the_last_segment
    red_confirmed: true
    red_reason: >-
      Per the task plan's "Red first" instruction: `probe_replay_state`'s
      clamp line was temporarily forced to always use the fixed
      `PROBE_SCROLLBACK_LINES` cap regardless of the caller's
      `probe_capacity` (simulating "capacity never reaches the probe"), then
      all three tests (each looping capacity in [0, 5, 10_000]) were run.
      Only `...across_capacities_when_current_dims_exceeds_the_last_segment`
      failed, at capacity 0: "assertion `left == right` failed / left: 39 /
      right: 23" (dump_block.rs:810, probe cursor row vs the capacity-0
      oracle's). The two grow-resize shapes
      (`...at_capacity_zero_across_a_rows_only_grow_resize` and
      `...rows_and_columns_grow_resize`) did NOT diverge for their specific
      fixture shapes even under the forced fixed cap — recorded honestly,
      the same outcome already observed for the equivalent shapes in the
      sibling mux-snapshot-ring-wrap-restore feature's AC-5. The change was
      reverted immediately after the run; `dump_block::tests` (19/19) and
      the full lib suite were re-verified green afterward.
  AC-2:
    tests:
      - mux::snapshot_bytes::tests::resolve_probe_capacity_unreported_gives_the_legacy_ten_thousand_cap
      - mux::snapshot_bytes::tests::resolve_probe_capacity_an_explicit_zero_is_distinct_from_unreported
      - mux::snapshot_bytes::tests::resolve_probe_capacity_a_reported_value_below_the_cap_passes_through
      - mux::snapshot_bytes::tests::resolve_probe_capacity_a_reported_value_exactly_at_the_cap_passes_through
      - mux::snapshot_bytes::tests::resolve_probe_capacity_a_reported_value_one_above_the_cap_clamps_to_the_cap
      - mux::snapshot_bytes::tests::resolve_probe_capacity_the_maximum_u32_clamps_to_the_cap
      - mux::snapshot_bytes::dump_block::tests::probe_replay_state_clamps_a_capacity_far_above_the_cap_to_the_cap_itself
      - mux::snapshot_bytes::wrap_restore_tests::build_snapshot_bytes_for_ring_at_a_reported_capacity_above_the_cap_equals_the_output_at_the_cap
    red_confirmed: true
    red_reason: >-
      `resolve_probe_capacity` was temporarily replaced with a body that
      ignores its argument and always returns the fixed cap. 2 of the 6
      mapping-table unit tests failed as expected:
      `..._an_explicit_zero_is_distinct_from_unreported` ("left: 10000 /
      right: 0") and `..._a_reported_value_below_the_cap_passes_through`
      ("left: 10000 / right: 50"); the other 4 assert values that coincide
      with the fixed cap under that forcing (unreported, exactly-at-cap,
      one-above-cap, u32::MAX) and could not have diverged from it, so they
      stayed green by construction rather than by accident. The TM-1 clamp
      test (`probe_replay_state_clamps_a_capacity_far_above_the_cap...`) and
      the wrap_restore "above cap equals cap" test are structural equality
      guards between two direct calls at the SAME resolved capacity; they
      were not separately red-run (their fixture is only 90 lines, well
      short of triggering any capacity-dependent eviction difference even
      without clamping, so a forced-unclamped run would not have produced a
      meaningful failure) and are included here as regression guards for the
      same resolve_probe_capacity mapping. All temporary changes were
      reverted immediately after the run; `mux::snapshot_bytes` (64/64) and
      the full lib suite were re-verified green afterward.
  AC-3:
    tests:
      - mux::snapshot_bytes::wrap_restore_tests::build_snapshot_bytes_for_ring_output_at_capacity_ten_thousand_matches_the_pinned_golden_bytes
    red_confirmed: false
    red_reason: >-
      Byte-identity regression pin: the golden bytes were captured directly
      from the finished implementation (a temporary --nocapture print run,
      then hardcoded as the fixture and the temporary print removed), so by
      construction there is no prior-implementation red to observe — the
      fixture pins CURRENT, correct output at probe_capacity 10,000, not a
      behavior change. Sanity-checked instead by temporarily swapping the
      call under test to pass capacity 5 instead of 10,000 and confirming
      the assertion failed, then reverting to 10,000 and confirming it
      passed again, proving the pin is actually sensitive to the capacity
      argument rather than vacuously true. The AC's second half ("all
      pre-existing tests pass changed only by the added capacity argument")
      is proven by the full lib suite result (3694/3694 passed, 0 failed, 3
      ignored — every pre-existing dump_block / wrap_restore_tests / pty_spawn
      test call site needed only a trailing `, 10_000` to keep passing).
  AC-4:
    tests:
      - mux::snapshot_bytes::wrap_restore_tests::ac4_rows_only_grow_at_capacity_zero_matches_the_capacity_zero_oracle
      - mux::snapshot_bytes::wrap_restore_tests::ac4_rows_only_grow_at_a_small_nonzero_capacity_matches_the_same_capacity_oracle
      - mux::snapshot_bytes::wrap_restore_tests::ac4_rows_and_cols_grow_at_capacity_zero_matches_the_capacity_zero_oracle
      - mux::snapshot_bytes::wrap_restore_tests::ac4_rows_and_cols_grow_at_a_small_nonzero_capacity_matches_the_same_capacity_oracle
      - mux::snapshot_bytes::wrap_restore_tests::ac4_current_dims_exceeds_the_last_segment_at_capacity_zero_matches_the_capacity_zero_oracle
      - mux::snapshot_bytes::wrap_restore_tests::ac4_current_dims_exceeds_the_last_segment_at_a_small_nonzero_capacity_matches_the_same_capacity_oracle
    red_confirmed: true
    red_reason: >-
      Per the task plan's "Red first" instruction: the shared assertion
      helper (`assert_ac4_regression_case`) was temporarily changed to pass
      the literal `10_000` to `build_snapshot_bytes_for_ring` instead of the
      test's own `probe_capacity`, reproducing "the probe never sees the
      client's reported capacity." Both "current_dims exceeds the last
      segment" cases failed as anticipated: the capacity-zero case with
      "cursor row must match the capacity-C oracle: left: 39, right: 24",
      and the small-nonzero (C=5) case with "left: 39, right: 29" — both
      against BOTH replay paths (`reset_and_replay_segments` and
      `TerminalCore::build_from_snapshot`). The two grow-shape cases
      (rows-only, rows+cols) at both capacities passed unmodified even under
      the forced fixed-cap probe, i.e. did not diverge for their specific
      fixture shapes — recorded honestly, matching the Test Notes' own
      anticipation that not every shape necessarily reproduces ("If AC-5's
      rows-only case does not diverge... record that in the test record").
      Comparison is narrowed to cursor row/col and the marker row's text
      only (not a whole-screen diff): at low capacity the oracle's own
      delegated-payload-only reconstruction is itself an incomplete rebuild
      of history the ring evicted — exactly the gap the dump block exists to
      fix for the real client — so a whole-screen comparison would fail
      even under a correct implementation. Reverted immediately after the
      run; `wrap_restore_tests` (64/64 including these) and the full lib
      suite were re-verified green afterward.
  AC-5:
    tests:
      - mux::ipc::connection::tests::client_scrollback_capacity_malformed_payload_is_ignored_and_a_later_snapshot_still_uses_the_earlier_reported_value
      - mux::ipc::connection::tests::client_scrollback_capacity_two_connections_each_get_snapshots_at_their_own_value
    red_confirmed: true
    red_reason: >-
      The `MessageType::ClientScrollbackCapacity` dispatch arm was
      temporarily changed to always take the `None` (malformed) branch,
      simulating "the router never stores a reported capacity." Both live
      round-trip tests (through the real `handle_connection` loop) failed as
      expected: the malformed-payload test failed its "must not have
      overwritten the earlier valid report (5)" assertion (the returned
      snapshot bytes matched the never-reported/10,000 shape instead of the
      capacity-5 shape), and the two-connection test failed its "connection
      A (reported 0) must get its snapshot built at capacity 0" assertion
      the same way. Reverted immediately after the run;
      `mux::ipc::connection` (38/38) and the full lib suite were
      re-verified green afterward.
