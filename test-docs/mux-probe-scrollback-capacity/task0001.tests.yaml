acceptance_tests:
  AC-1:
    tests:
      - protocol::tests::test_client_scrollback_capacity_message_type
      - protocol::tests::test_client_scrollback_capacity_does_not_disturb_existing_discriminants
      - protocol::tests::test_client_scrollback_capacity_round_trips_through_frame_body
      - protocol::tests::test_client_scrollback_capacity_round_trips_through_apc
      - protocol::tests::test_client_scrollback_capacity_round_trips_through_osc
      - protocol::tests::test_client_scrollback_capacity_round_trips_through_plaintext
    red_confirmed: true
    red_reason: >-
      Compile-level red, actually observed: `git stash push --
      crates/mux_ipc/src/protocol.rs` (keeping protocol/tests.rs's new
      tests) then `cargo test --manifest-path crates/mux_ipc/Cargo.toml
      --lib --no-run` failed with 23 errors -- "no variant ...
      ClientScrollbackCapacity found for enum protocol::MessageType" and
      "cannot find type ClientScrollbackCapacityPayload in this scope" --
      because none of these tests could compile without the enum variant
      and payload struct this task adds. Stash popped immediately after to
      restore the implementation; the suite was green again afterward
      (confirmed by the reported final_failures run).
  AC-2:
    tests:
      - protocol::tests::test_client_scrollback_capacity_payload_decodes_exact_4_byte_values
      - protocol::tests::test_client_scrollback_capacity_payload_rejects_wrong_length
      - protocol::tests::test_client_scrollback_capacity_payload_encoder_emits_exactly_4_bytes
    red_confirmed: true
    red_reason: >-
      Same observed compile-level red as AC-1 (same stash/run): these
      tests reference `ClientScrollbackCapacityPayload`, which did not
      exist before this task's edit to protocol.rs, and failed to compile
      in the same `cargo test --no-run` run described there.
  AC-3:
    tests:
      - protocol::tests::test_message_type_round_trip
      - protocol::tests::test_agent_api_message_type_round_trip
      - protocol::tests::test_upgrade_message_type_round_trip
      - protocol::tests::test_from_frame_body_returns_none_for_byte_adjacent_to_new_upgrade_types
      - mux::ipc::codec::tests::test_codec_discards_byte_adjacent_to_client_scrollback_capacity
    red_confirmed: false
    red_reason: >-
      These five tests assert that byte 0x28 is unmapped and is discarded
      by the codec. That assertion was ALREADY true before this task:
      pre-task, 0x27 (not 0x28) was the first unmapped byte, which means
      0x28 was unmapped both before and after this task's addition of the
      0x27 discriminant -- moving the four existing boundary assertions
      from 0x27 to 0x28 is a bookkeeping update to keep the boundary
      accurate, not a behavior change these five tests detect, so they
      never went red. The part of AC-3 that genuinely IS red-first --
      "from_u8(0x27) now returns the new variant, where it previously
      returned None" -- is the same fact
      `protocol::tests::test_client_scrollback_capacity_message_type`
      (listed under AC-1) asserts and was empirically observed red for
      (see AC-1's red_reason).
  AC-4:
    tests:
      - tabs::tests::mux_link::client_scrollback_capacity_is_first_control_frame_at_capacity_zero
      - tabs::tests::mux_link::client_scrollback_capacity_is_first_control_frame_at_small_nondefault_capacity
    red_confirmed: true
    red_reason: >-
      Compile-level red, actually observed: `git stash push --
      src-tauri/src/tabs/mux_link.rs src-tauri/src/tabs/input.rs
      src-tauri/src/tabs/mod.rs` (keeping the new tests in
      tabs/tests/mux_link.rs) then `cargo test --manifest-path
      src-tauri/Cargo.toml --lib
      tabs::tests::mux_link::client_scrollback_capacity -- --test-threads=1`
      failed with 5 errors -- "no method named `test_control_frames` found
      for struct `tabs::Tab`" -- because the test-only accessor and the
      `send_client_scrollback_capacity` call this task adds did not exist.
      Stash popped immediately after; the suite was green again afterward.
  AC-5:
    tests:
      - tabs::tests::mux_link::client_scrollback_capacity_precedes_create_window_on_fresh_start
      - tabs::tests::mux_link::client_scrollback_capacity_not_resent_on_duplicate_welcome
    red_confirmed: true
    red_reason: >-
      Same observed compile-level red as AC-4 (same stash/run): both
      tests call `tab.test_control_frames()`, the accessor that did not
