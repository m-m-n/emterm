      `reconnect_and_reattach_resends_the_last_attach_after_reconnecting`
      is the pre-existing Attach-only-resend test, updated only for the
      new parameter and a `assert_no_more_frames_blocking` check that
      nothing else was resent; its own resend-only-Attach behavior was
      already covered pre-task and stays green.
  AC-8:
    tests: []
    red_confirmed: false
    red_reason: >-
      No existing or new test covers this criterion directly (searched
