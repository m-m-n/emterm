  AC-6:
    tests:
      - mux::bridge::tests::capture_if_capacity_captures_capacity_and_only_capacity
      - mux::bridge::tests::forward_loop_forwards_and_captures_capacity_frame_unchanged
      - mux::bridge::tests::forward_loop_capacity_capture_replaces_and_is_unaffected_by_other_messages
    red_confirmed: true
    red_reason: >-
      Compile-level red, actually observed: `git stash push --
      src-tauri/src/mux/bridge/forward.rs src-tauri/src/mux/bridge/mod.rs`
      (keeping the new tests in bridge/tests.rs) then `cargo test
      --manifest-path src-tauri/Cargo.toml --lib mux::bridge --no-run`
      failed with 30 errors -- "cannot find function `capture_if_capacity`
      in this scope" and "this function takes 6 arguments but 7 arguments
      were supplied" against `forward_loop` -- because `capture_if_capacity`
      and the `last_capacity` parameter this task adds did not exist.
      Stash popped immediately after; the suite was green again afterward.
      "Attach capture behaves as before" (part of this AC's text) is not a
      new red-first fact -- it is the pre-existing
      `capture_if_attach_captures_attach_and_only_attach` test, left
      unmodified, which was green in the Step 4a baseline and stayed green
      throughout.
  AC-7:
    tests:
      - mux::bridge::tests::reconnect_and_reattach_resends_capacity_then_attach_after_reconnecting
      - mux::bridge::tests::reconnect_and_reattach_resends_the_last_attach_after_reconnecting
      - mux::bridge::tests::reconnect_and_reattach_resends_only_capacity_when_no_attach_stored
    red_confirmed: true
    red_reason: >-
      Same observed compile-level red as AC-6 (same stash/run): all three
      tests call `reconnect_and_reattach(&sock_path, &last_capacity,
      &last_attach)`, the 3-argument form this task adds (previously 2
