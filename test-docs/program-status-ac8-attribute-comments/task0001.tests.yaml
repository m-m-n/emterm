      line-spanning block-comment test passed before and after: the old scanner already closed the
      attribute at the `]` inside the comment and the next line is a use line. It also passes under
      an implementation that does not carry the block-comment level (the end-of-text return of
      ac8_scan_attribute reporting level zero), because line 2's `]` closes the attribute there too
      and line 3 is still a winit use line. The guard against a dropped block-comment carry is the
      pair
      ac8_carry_ac1_a_bracket_in_a_block_comment_carried_to_the_next_line_does_not_hide_a_use_line
      and
      ac8_carry_ac2_a_quote_in_a_block_comment_carried_to_the_next_line_does_not_hide_a_use_line:
      both pass on the current scanner and both fail under that mutant (the first with "expected at
      least one violation for ... got none", the second with only the end-of-source violation for
      `#[allow(x /*` returned and no winit violation).
