      Three record tests that assert none (higher boundary without a
      construct, equal boundary with a different construct, boundary-only
      form) pass against the stub because the stub always yields none.
      The clause "the decider runs outside the capture exclusion and the
      lock order is unchanged" has no failing-first observation: the call
      already sat after the captured read at the record point when the
      three placement tests were first run, so they passed on the stub.
      They probe both exclusions from a test-only decider entry hook, and
      the existing concurrent stress test
      snapshot_paths_run_concurrently_with_reader_and_resize_without_deadlock
      passes unchanged.
