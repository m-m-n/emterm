      code (they are regression guards for display parity, as the plan
      states); their companions failed on the added "nothing re-sent"
      assertion (`left: [[228, 184], [173, 100, 101, 102, 13, 10]] right:
      [[173, 100, 101, 102, 13, 10]]`). The wrapped-ring-with-an-empty-dump
      test, driven through the assembly function and the builder because a
      production shadow dump is never empty, failed with `mid utf-8: a
      construct is decided` against the stubbed decider. The five builder
      tests failed with the tail still re-sent (`got [27, 40]`, `got
      [228, 184]`, `got [27, 91, 51]`).
