      the pre-fix files (cannot find function `chunk_end_of_fed_prefix`,
      cannot find struct `CarriedOverCompletion`, no method named
      `feed_with_cuts`). `short_launch_started_in_the_window_is_delivered_once_not_twice`
      also belongs to this criterion but passed on the pre-fix files (the
      scan already finds a window-started launch once), so it is not listed.
