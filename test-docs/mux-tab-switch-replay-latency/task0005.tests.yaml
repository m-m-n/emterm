acceptance_tests:
  AC-1:
    tests:
      - window_host::tests::resize_settler_forwards_at_most_once_for_a_render_driven_storm_matching_applied
    red_confirmed: true
    red_reason: >-
      Written against the new `ResizeSettler::observe(candidate, now)` /
      struct-literal-seeded `last_forwarded` API before it existed;
      `cargo test --lib --no-run` failed with E0061 ("this method takes 1
      argument but 2 arguments were supplied") and E0560 (no field
      `window_opened_at` / `stable_since` / `last_forwarded` on
      `ResizeSettler`) — the pre-fix `ResizeSettler` had neither wall-clock
      tracking nor an applied-value concept, so this test could not
      compile, let alone pass, against the old design.
  AC-2:
    tests:
      - window_host::tests::resize_settler_forwards_at_most_once_for_a_render_driven_storm_matching_applied
      - window_host::tests::resize_settler_settling_back_on_the_applied_value_is_a_no_op_but_closes_the_window
      - window_host::tests::resize_settler_backstop_forwards_after_max_duration_even_if_never_settled
    red_confirmed: true
    red_reason: >-
      Same compile-time red as AC-1 (new `observe`/`awaiting_decision`
      API/fields did not exist yet); once compiling, these three together
      prove the settled/backstop size always eventually reaches the
      caller — including the no-stale-pane case where the final value
      differs from applied (main AC-1 test), the no-op case where it
      matches applied but the window still closes cleanly (settling-back
      test), and the pathological non-settling stream (backstop test).
  AC-3:
    tests:
      - window_host::tests::resize_settler_forwards_immediately_once_closed
    red_confirmed: true
    red_reason: >-
      Adapted from task0002's original test to the new `observe(candidate,
      now)` signature; failed to compile (E0061, extra `t` argument) before
      the signature change landed.
  AC-4:
    tests: []
    red_confirmed: false
    red_reason: >-
      Out of scope for this task's `expected_files` (the one-time
      mux-attach seed lives in `Tab::apply_mux_message` /
      `tabs.rs::welcome_seeds_window_list_and_active_index`, untouched by
      this diff). Confirmed unaffected by: (1) `git diff --stat` showing
      only `src-tauri/src/window_host.rs` changed; (2)
      `welcome_seeds_window_list_and_active_index` passing in every full
      `cargo test --lib` run performed for this task (it never appears in
      any failure list); (3) `refresh_status_bar_insets`'s doc comment and
      code confirm the seed path does not go through `ResizeSettler` at
      all — the seed write happens inside `Tab::apply_mux_message`, a
      different call chain entirely.
  AC-5:
    tests:
      - window_host::tests::resize_settler_self_drives_to_settlement_without_any_external_wake
    red_confirmed: true
    red_reason: >-
      Written against `ResizeSettler::awaiting_decision`, which did not
      exist pre-fix; `cargo test --lib --no-run` failed with E0599 ("no
      method named `awaiting_decision` found"). Pre-fix, `observe`
      returning `None` had no way for the caller to distinguish "still
      debouncing, please request another redraw" from "steady state,
      nothing pending" — the self-wake gap this AC targets.
  AC-6:
    tests:
      - window_host::tests::resize_settler_absorbs_chaotic_multi_value_churn
      - window_host::tests::resize_settler_forwards_immediately_once_closed
      - window_host::tests::resize_settler_reset_reopens_a_closed_window
      - window_host::tests::resize_settler_backstop_forwards_after_max_duration_even_if_never_settled
      - window_host::tests::resize_settler_closed_mode_does_not_reforward_the_same_value_every_render
    red_confirmed: true
    red_reason: >-
      All four adapted task0002 tests (chaotic churn / forwards-once-closed
      / reset-reopens / backstop) failed to compile against the old
      `observe(candidate)` single-argument signature (E0061) before the
      `now: Instant` parameter was added; the new
      `resize_settler_closed_mode_does_not_reforward_the_same_value_every_render`
      test is new coverage for the 02546e5e10deb500-c fix (steady-state
      dedup) and failed the same way (E0061) since it also uses the new
      signature. Each test's documented INTENT (storm absorption /
      immediate post-settle forwarding / reopening on reattach / bounded
      backstop) is unchanged from task0002's originals — only the debounce
      mechanism (wall-clock instead of call-count) and the explicit
      steady-state no-op case are new.
