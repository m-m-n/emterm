acceptance_tests:
  AC-1:
    tests:
      - terminal_core::tests::head_plus_marker_cluster_engages_the_split_and_matches_reference
      - bench::benches::marker_cluster_tail_bench_2mib_matches_bypass_engaged_cost
    red_confirmed: true
    red_reason: >-
      Confirmed by forcing `h` to always 0 (the exact pre-D7 equivalent —
      `leading_target_run_len` is entirely new code, so `h == 0` always is a
      faithful stand-in for "before this implementation existed"). The
      deterministic test failed with "AC-1: the split must engage
      (scrollback_populated == false) ... got scrollback_populated == true
      (D7 did not rescue this shape)". The release-mode bench
      (`--release --include-ignored`) measured 1.44s for the marker-cluster
      shape against this same pre-fix state (bound 509ms), vs 72.9ms
      post-fix against a 76.9ms segment-free baseline.
  AC-2:
    tests:
      - bench::benches::snapshot_replay_bench_2mib_seq
    red_confirmed: false
    red_reason: >-
      Pre-existing, unmodified test (not touched by this task) verifying the
      segment-free path — `k == 0` unconditionally, so `h`/`middle_len` are
      never computed for it (see the `h` computation's own `bypass && k > 0`
      guard). There is no observable change for this criterion to prove via
      red-green; it is a non-regression check, confirmed still green
      (`cargo test --release ... --include-ignored`) after the change.
  AC-3:
    tests:
      - terminal_core::tests::bypass_split_matches_reference_viewport_and_cursor_for_ordinary_switch
      - bench::benches::ordinary_switch_bench_950kib_matches_segment_free_cost
    red_confirmed: false
    red_reason: >-
      Pre-existing, unmodified tests for the "ordinary switch" shape
      (spawn-size HEAD segment differs from target, so `h == 0` under D7 —
      mathematically identical to the pre-D7 computation). No observable
      change for this criterion; both remain green after the change
      (deterministic test in the normal `--lib` run; the release-mode bench
      re-measured at ~12-16ms ordinary-switch vs ~40-90ms segment-free,
      consistent with its pre-existing bound).
  AC-4:
    tests:
      - terminal_core::tests::head_plus_marker_cluster_engages_the_split_and_matches_reference
    red_confirmed: false
    red_reason: >-
      Same test function as AC-1; under the pre-fix simulation (`h` forced
      to 0) the test panics at the earlier AC-1 assertion
      (`scrollback_populated`) before ever reaching the grid_fingerprint /
      evicted_total equivalence assertions this criterion is about — when
      the split does not engage, both `build_from_snapshot` and
      `build_scrollback_only_from_snapshot` take the identical whole-drain
      path, so the equivalence claim is only non-vacuous once the split
      actually engages a bypass-affected code path, which by construction
      cannot happen pre-fix for this shape. Verified instead that the
      assertions pass post-fix against a genuinely-engaged split
      (`scrollback_populated == false` on the bypass side, `true` on the
      reference side, grids and `evicted_total` equal).
  AC-5:
    tests:
      - terminal_core::tests::prefix_at_the_segment_count_bound_with_a_dominating_suffix_engages_the_split_no_head
      - terminal_core::tests::prefix_with_too_many_segments_does_not_engage_the_split_regardless_of_byte_length
    red_confirmed: false
    red_reason: >-
      The new test's shape has `h == 0` (no HEAD — first segment already
      differs from target), so `middle_segment_count == k` and this reduces
      byte-for-byte to the pre-D7 computation; it was already true before
      any D7 code existed, so there is no meaningful pre-implementation red
      to observe for THIS criterion (preserving an existing boundary, not
      introducing new behavior). Instead confirmed the test is a real,
      non-vacuous regression guard by injecting a boundary-off-by-one
      mutation into the NEW gate (`middle_segment_count <=` →
      `middle_segment_count <` `BYPASS_PREFIX_MAX_SEGMENTS`) and observing
      it fail with "must still engage the split ... got ... true" before
      reverting the mutation. The companion pre-existing test (25 segments,
      no head, rejects) is unmodified and still passes.
  AC-6:
    tests:
      - terminal_core::tests::head_plus_large_content_heavy_middle_does_not_engage_the_split
    red_confirmed: true
    red_reason: >-
      Confirmed by injecting the exact NFR1 risk this test guards against —
      temporarily skipping the middle-length re-check whenever a HEAD is
      present (`h > 0 || middle_len <= BYPASS_PREFIX_MAX_BYTES` in place of
      `middle_len <= BYPASS_PREFIX_MAX_BYTES`) — and observing the test fail
      with "AC-6: a genuinely large, content-heavy MIDDLE behind a HEAD
      must NOT engage the split ... got scrollback_populated == false"
      before reverting the mutation. This is the direct code path D7
      introduces (folding a HEAD ahead of a MIDDLE); the mutation is the
      realistic implementation mistake (forgetting to re-scope the
      pre-existing byte-length gate to the narrower MIDDLE region) this
      criterion exists to catch.
