acceptance_tests:
  AC-1:
    tests: [tabs::tests::t6_ac1_resize_during_in_flight_switch_still_engages_bypass]
    red_confirmed: true
    red_reason: >-
      Pre-fix code rebuilt the in-flight worker at the NEW (post-resize)
      target directly inside dispatch_offthread_replay's coalesce
      re-dispatch, so stable_target_suffix_start found no trailing run
      matching the new target against segments recorded at the pre-resize
      target: bypass never engaged, so no 2nd-pass scrollback-restore worker
      spawned. Assertion `tab.test_has_pending_scrollback_restore()` failed.
      Verified via a temporary git-stash-based probe run directly against
      the pre-fix committed tabs.rs (not merely reasoned about).

  AC-2:
    tests: [tabs::tests::ac2_unraced_switch_engages_bypass]
    red_confirmed: false
    red_reason: >-
      Regression guard, not a new criterion: this is task0003's own
      pre-existing AC-2 test (unraced switch engages bypass), untouched by
      this task's diff. It passes identically before and after this task's
      implementation, confirming AC-1's fix introduced no regression for the
      unraced case (a resize never touches PendingSwitch::pending_resize
      when no resize occurs).

  AC-3:
    tests: [tabs::tests::t6_ac3_coalesced_snapshot_live_output_neither_lost_nor_duplicated]
    red_confirmed: true
    red_reason: >-
      Pre-fix code did not clear pending_switch.live_queue at coalesce time
      (dispatch_offthread_replay's same-pane branch only stashed
      pending_redispatch, never touching the queue). L1 survived the P2
      coalesce; the assertion "L1 was subsumed into P2's own content — the
      coalesce must clear it" failed (queue still held L1). This also
      confirms the deeper bug: at poll time round-1's `old.payload ==
      payload` guard (payloads differ) would have discarded the WHOLE
      queue including L2, which never got the chance to be queued
      correctly. Verified via a temporary git-stash-based probe run
      directly against the pre-fix committed tabs.rs.

  AC-4:
    tests: [tabs::tests::t6_ac4_resize_driven_case_preserves_live_queue_exactly_once]
    red_confirmed: true
    red_reason: >-
      Pre-fix code's Tab::resize redispatch branch DID coalesce a
      re-dispatch for a same-payload resize (task0006 removes that call
      entirely in favor of PendingSwitch::pending_resize) — assertion
      `!tab.test_has_pending_redispatch()` failed immediately after the
      resize call. Verified via a temporary git-stash-based probe run
      directly against the pre-fix committed tabs.rs.

  AC-5:
    tests: [tabs::tests::t6_ac5_chained_coalesce_across_resize_and_two_snapshots_attributes_live_output_correctly]
    red_confirmed: true
    red_reason: >-
      Same root cause as AC-3, traced across a 3-transition chain (resize,
      then two same-pane snapshots) — pre-fix code left L1 in the queue
      after P2's coalesce; assertion "L1 subsumed by P2's own content at
      THIS coalesce" failed. Verified via a temporary git-stash-based probe
      run directly against the pre-fix committed tabs.rs.

  AC-6:
    tests: [tabs::tests::t6_ac6_duplicate_same_pane_snapshot_still_decodes_twice_replay_build_dedup_only]
    red_confirmed: false
    red_reason: >-
      Documents pre-existing, UNCHANGED behavior: FR8's dedup was, and
      remains after this task, scoped to the replay-BUILD level only (no
      second worker spawn) — decode still runs for every incoming frame.
      This task prioritized FR7 and the live-queue lifecycle (both
      correctness-critical per the task plan) and did not add fetch/
      decode-level dedup (the task plan's own documented fallback for this
      medium-severity, secondary finding when time/complexity forces a
      choice). This test's outcome is identical before and after this
      task's diff — it exists to pin the narrower claim explicitly rather
      than leave FR8's SPEC wording ("does not fetch/decode the snapshot
      twice") silently unmet by the test suite. See the implementer report
      for the scope-narrowing note (feature-docs/SPEC.md and
      VERIFICATION.md are outside this task's write permission; the
      orchestrator/planner should reconcile FR8's wording with this
      decision).

  AC-7:
    tests:
      - tabs::tests::t6_ac7_resize_storm_performs_no_redispatch_hence_no_payload_clone
      - tabs::tests::ac1_resize_storm_during_pending_switch_collapses_to_one_redispatch
    red_confirmed: true
    red_reason: >-
      Pre-fix code's Tab::resize redispatch branch cloned
      pending.payload/.segments (or the pending_redispatch equivalent) and
      called dispatch_offthread_replay on EVERY resize event while a
      same-pane switch was in flight — assertion
      `!tab.test_has_pending_redispatch()` failed on the first resize event
      of the storm. Verified via a temporary git-stash-based probe run
      directly against the pre-fix committed tabs.rs. The adapted
      ac1_resize_storm_... test additionally pins test_offthread_spawn_count
      staying flat through the whole storm AND after the swap (0 extra
      spawns, vs. round-1's own +1), a strictly stronger property than
      task0003's original test asserted.

  AC-8:
    tests: [tabs::tests::t6_ac8_large_payload_coalesce_clears_queue_without_poll_time_comparison]
    red_confirmed: true
    red_reason: >-
      Pre-fix code left the queue populated at coalesce time (only
      compared/cleared later, at poll time, via the O(n) `old.payload ==
      payload` byte comparison this task removes) — assertion "the discard
      decision at coalesce time must not carry the stale queue forward"
      failed with the queue still holding the stale entry right after the
      second (large) snapshot's coalesce. Verified via a temporary
      git-stash-based probe run directly against the pre-fix committed
      tabs.rs. The O(n) comparison's removal itself is a structural/code
      property confirmed by inspection (poll_pending_switch's
      pending_redispatch-take branch now unconditionally inherits
      old.live_queue/queued_bytes behind a debug_assert_eq! on pane
      identity, replacing the byte comparison) rather than something a
      black-box unit test can time reliably.

  AC-9:
    tests:
      - tabs::tests::ts12_resize_supersedes_and_redispatches_at_new_grid
      - tabs::tests::ac1_resize_storm_during_pending_switch_collapses_to_one_redispatch
      - tabs::tests::ac3_duplicate_same_pane_snapshot_coalesces_before_spawning_again
      - tabs::tests::ac4_switch_to_different_pane_is_not_coalesced
      - tabs::tests::ac5_late_repeat_switch_to_same_pane_is_not_dropped
    red_confirmed: true
    red_reason: >-
      ts12_resize_supersedes_and_redispatches_at_new_grid and
      ac1_resize_storm_during_pending_switch_collapses_to_one_redispatch's
      ORIGINAL (task0003) assertions were run against this task's NEW
      implementation and failed (their mechanics genuinely changed — a
      resize no longer coalesces a re-dispatch at all) before being
      adapted, confirming the adaptation was necessary rather than a
      rubber-stamp. Both were rewritten to assert the new mechanics
      (PendingSwitch::pending_resize) while preserving their original
      intent (resize supersedes correctly; a resize storm collapses to
      minimal work) and now pass. The other three listed tests (task0003's
      FR8 same-pane-dedup tests, orthogonal to the resize-mechanics change)
      were re-run unchanged throughout this task's development and
      continued to pass, confirming FR8's replay-build dedup was not
      regressed.

