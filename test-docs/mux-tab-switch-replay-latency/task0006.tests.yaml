# Baseline established in Step 4a, BEFORE any implementation change, via three
# full `cargo test --lib -- --test-threads=1` runs. Two populations:
#  - a single deterministic failure unrelated to this task
#    (welcome_without_windows_leaves_group_none), reproduced in all 3 runs
#  - a large, NON-deterministic pool of "off-thread replay worker did not
#    complete in time" panics (test_poll_until_swapped's bounded spin,
#    tabs.rs) whose exact membership varied run to run — attributed to
#    worker-thread scheduling contention in this sandboxed environment, not
#    to any code path this task touches. The union observed across the 3
#    baseline runs is listed below; any subset of it reappearing after the
#    implementation is NOT a regression (see final_failures/notes).
baseline_failures:
