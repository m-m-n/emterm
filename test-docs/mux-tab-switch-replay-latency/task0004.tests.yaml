task_id: task0004
# Baseline recorded in 4a via the mandated project_commands.test
# (`cargo test --manifest-path src-tauri/Cargo.toml --lib`), on the
# unmodified worktree. The whole-workspace `tabs::tests` off-thread family
# plus `status_bar::runtime::tests::runtime_time_provider_timer_fires_wake`
# proved NON-DETERMINISTIC under this suite's ~20-85s full-parallel run —
# confirmed by re-running BOTH the implemented and the unmodified code
# (via `git stash`/reconstruction on `crates/term_core/src/{terminal_core.rs,
# bench.rs}` only) 7+ times across this task: every run showed a DIFFERENT
# subset of this same ~23-test pool, all failing with "off-thread replay
# worker did not complete in time" or an equivalent timing-sensitive
# assertion (`tab.mux_group.is_none()`, `supersede must clear the prior
# pending_scrollback_restore`), none touching `term_core`. This list is the
# UNION observed across all runs on both the original baseline and multiple
# confirmatory re-runs on unmodified code — the honest characterization
# given the demonstrated non-determinism (a single snapshot undercounts the
# pool). Matches task0001's own tests.yaml, which documented the same pool
# for the same reason.
