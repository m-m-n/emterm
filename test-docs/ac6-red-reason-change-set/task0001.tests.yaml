      (feature-docs/ac6-red-reason-change-set/** and
      test-docs/ac6-red-reason-change-set/**) are produced by the
      workflow and this test record itself, as declared in the task
      plan's Scope section; they are not additional modified source.
notes: >-
  Documentation-record task (task0001.md Design section "Blocking
  precondition"; IMPLEMENTATION.md decision D-3). No test harness,
  fixture or script file is committed by this task — all assertions
  above were run as ad-hoc python3 (PyYAML) and git commands against
  test-docs/ac7-red-confirmed-unobserved/task0001.tests.yaml, both
  before and after the edit, per the task plan's Test Notes. AC-2 and
  AC-4 are the red-to-green criteria the task plan calls out explicitly;
  AC-3 also had an observable pre-state (the naming and
  "YAML documentation only" phrasing were absent) and is recorded as
  red-confirmed accordingly, since the task plan's own Design section
  requires those exact assertions to be present. AC-1, AC-5, AC-6, AC-7
  and AC-9 are invariant guards verified to hold both before and after.
  AC-8 is the human-judgment check the task plan calls for; it has no
  mechanical form. project_commands.build/format were not run: this
  change touches no Rust or TypeScript source, and IMPLEMENTATION.md
  decision D-4 states the project's build/test commands are not part of
  this feature's acceptance gate. project_commands.test (cargo test
  --lib) was run before and after per the implementer workflow's
  baseline requirement; both runs fail identically at the build-script
  stage due to a pre-existing missing bundled font asset
  (assets/fonts/Noto-COLRv1.ttf), unrelated to this task.
