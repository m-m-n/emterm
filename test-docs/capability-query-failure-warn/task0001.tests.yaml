    red_confirmed: false
    red_reason: "Searched callbacks/tests.rs by both module path and filename before writing this: no existing worker-level test mixes metacharacter-bearing and metacharacter-free notifications in one run, so this test is new. To isolate it, I temporarily disabled the unrelated new capability_query_warn_decision test module (the only thing blocking compilation) and ran this test against the pre-task notify_worker: it already passed (2 queries, 3 sends, correct escape/unchanged fields, correct order). The query-count/order/escape-output assertions verify the pre-existing on-demand skip-gate wiring (notification-capability-query-skip D1), which D2 explicitly requires this task preserve byte-for-byte; only the fetch fake's error type (text vs the old unit type) is new to this task, and it does not affect this outcome. No red state occurred for this test, and the criterion has no other executable angle: the warn-count/log-emission side of this scenario is explicitly out of scope for this test per the task plan's own Test Notes (NFR5 bans log capture; AC-1/AC-2 cover the warn count)."
  AC-4:
    tests:
      - callbacks::tests::capability_query_warn_decision::marker_constant_value_equals_its_name
    red_confirmed: true
    red_reason: "The marker-equality assertion failed to compile before the constant existed: E0425 'cannot find value `LOG_NOTIFY_CAPABILITY_QUERY_FAILED` in this scope'. The criterion's other clause (the warn record references no title/body/escaped value/redacted rendering) has no executable check: log capture is disallowed (NFR5), and I found no existing log-capture test in callbacks/tests.rs (searched by module path and filename). That clause is verified structurally by review (TS-7/TS-10): the emission site `log::warn!(\"{LOG_NOTIFY_CAPABILITY_QUERY_FAILED}: {text}\")` interpolates only the marker constant and the helper's next-state text, never `title`, `body`, `summary`, or `redacted`."
