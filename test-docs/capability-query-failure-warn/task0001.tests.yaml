    red_confirmed: false
    red_reason: "Per the task plan's own Test Notes ('AC-6/AC-7: review checks on the diff plus the two build commands'), this criterion is structural (no static/global/thread-local storage, never read by an escape function) and is verified by reviewing the diff, not by an executable test. Searched callbacks/tests.rs for any existing test that inspects notify_worker's internal state; found none — the state is a local variable with no accessor. Diff review: `previous_capability_failure: Option<String>` is declared with `let mut` inside notify_worker's body (not `static`/thread-local), is read only via `.as_deref()` when passed to capability_query_warn_decision, and no capability result (Vec<String> or the Result itself) is stored anywhere across iterations."
