    red_reason: >-
      Observed before the production change: strip_unterminated_introducers_complete_in_single_pass
      failed at its updated assertion (the old strip returned the whole input, the expected output
      is the last `ESC P 1;0;0q` followed by `plain`); can_abort_aborted_bodies_in_bulk_are_one_bounded_pass
