acceptance_tests:
  AC-1:
    tests:
      - mux::scrollback_filter::tests::can_abort_a_long_body_closed_by_esc_can_keeps_the_text_written_after_it
    red_confirmed: true
    red_reason: >-
      Observed before the production change: the test failed at 'kitty apc: the body is removed up
      to the aborting ESC and nothing after it (got 11 bytes, expected 33)': the old strip ended
      the body at the OSC's ST and returned only the leading text. The loop stops at its first
      failing assertion, so the SIXEL DCS case was not observed red on its own.
  AC-2:
    tests:
      - mux::ipc::pty_spawn::tests::snapshot_strip_can_abort::snapshot_strip_can_abort_a_kitty_apc_closed_at_a_cut_leaves_the_text_after_it
      - mux::ipc::pty_spawn::tests::snapshot_strip_can_abort::snapshot_strip_can_abort_a_sixel_dcs_closed_at_a_cut_leaves_the_text_after_it
    red_confirmed: true
    red_reason: >-
      Observed before the production change: both tests failed at 'the snapshot strip gives ESC
      and CAN, the text and the OSC 0 (got 0 bytes)': the old strip removed the whole ring, the
      closure and the text with it. The write filter half (the cut writes ESC and CAN, then the
      text) passed before the change, as it is not what this feature changes. The term_core view
      comparisons behind the strip assertion were not observed red on their own.
  AC-3:
    tests:
      - mux::scrollback_filter::tests::can_abort_a_short_body_is_removed_up_to_the_aborting_esc_and_the_esc_is_judged
      - mux::ipc::pty_spawn::tests::round4_designator_cut::round4_cut_in_the_same_call_after_a_waiting_esc_brace_writes_one_esc
    red_confirmed: true
    red_reason: >-
      Observed before the production change for the first test: it failed at 'kitty apc: kept
      continuation "\u{1b}[31m"' (the old strip kept the unterminated Kitty body whole). The loop
      stops at its first failing assertion, so the other rows (SIXEL DCS, the other kept
      continuations and the strip-target continuations) were not observed red on their own. The
      second test is the existing write filter test whose `ESC P q 1 ESC (` row pinned the old
      kept-aborted-SIXEL behavior; it failed against the new strip with its old expectation
      ('"\u{1b}Pq1\u{1b}("', left ESC ( ESC, right ESC P q 1 ESC ( ESC) and was updated to the new
      expectation under its current name (the aborted SIXEL DCS is removed up to the aborting ESC;
      an added `ESC P x 1` row keeps the old kept-whole expectation for the non-SIXEL DCS). Its
      updated assertion itself was not watched red against the old strip.
  AC-4:
    tests:
      - mux::scrollback_filter::tests::can_abort_bodies_without_an_abort_and_non_targets_are_kept_byte_for_byte
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: a body with no ESC, a body ending in a lone ESC, a DCS whose
      pre-abort range is not SIXEL, a non-Kitty APC and a BEL-only body were all kept byte for
      byte by the old strip, and BEL followed by ST was removed whole. The test was green before
      the change and stays green; it pins that the new scan does not remove or keep more than
      FR3 and FR4 say.
  AC-5:
    tests:
      - mux::scrollback_filter::tests::can_abort_the_closing_before_an_aborted_body_follows_the_written_state
      - mux::scrollback_filter::tests::can_abort_remapped_offsets_around_an_aborted_body
    red_confirmed: true
    red_reason: >-
      Observed before the production change: the first test failed at 'inside a CSI: one DEL, then
      ESC and CAN' (the old strip kept the Kitty body whole and wrote no DEL); the second failed
      at the output assertion for the same reason, before its offset assertions. The lone-ESC and
      ground rows of the first test and the offset rows of the second were not observed red on
      their own.
  AC-6:
    tests:
      - mux::scrollback_filter::tests::can_abort_the_write_path_and_the_state_form_agree_with_the_snapshot_strip
      - mux::scrollback_filter::tests::post_strip_state_form_output_equals_the_write_path_strip
      - mux::scrollback_filter::tests::strip_pty_output_for_scrollback_write_matches_snapshot_strip_for_everything
      - mux::scrollback_filter::tests::the_state_taking_form_with_the_flag_clear_equals_the_existing_entry_points
