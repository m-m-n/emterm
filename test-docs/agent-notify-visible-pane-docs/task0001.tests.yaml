  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      File-scope check over the final diff, not a behavior with a prior red
      state. Verified post-edit: git status --short shows only
      doc/AGENT-STATUS.md modified (plus this test-docs record); the AC-5
