# Baseline recorded via `cargo test --lib -- --test-threads=1` BEFORE any
# implementation change. Even pinned to --test-threads=1, these tabs.rs
# tests are non-deterministic across runs (real background-thread timing
# races in the off-thread replay worker, plus one welcome/group-reap
# assertion) — three baseline runs produced different subsets of this
# union. None of them touch resize/reflow-invalidation code; all are
# pre-existing and unrelated to this task's change.
baseline_failures:
  - tabs::tests::ts11_restore_worker_panic_returns_failed_and_clears_state
  - tabs::tests::ts13_offthread_swap_installs_pending_scrollback_restore
  - tabs::tests::ts7_offthread_swap_then_restored_scrollback_matches_reference
  - tabs::tests::ts8_new_offthread_switch_supersedes_in_flight_restore
  - tabs::tests::ts9_concurrent_live_drain_trims_rebuilt_tail_no_duplicates
  - tabs::tests::welcome_without_windows_leaves_group_none
