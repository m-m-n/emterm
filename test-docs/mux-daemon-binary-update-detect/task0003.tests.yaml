acceptance_tests:
  AC-1:
    tests: [hot_upgrade_fires_on_binary_replacement_via_attach]
    red_confirmed: true
    red_reason: >-
      Observed: "timed out after 25s waiting for \"Mux daemon upgraded in
      place to the newly installed binary\" on the child's standard error
      (collected so far: \"\")" at src-tauri/tests/mux_hot_upgrade.rs:1062.
      task0001 (mux::identity) and task0002 (Compatible-arm trigger wiring)
      have not landed on this branch, so nothing detects the replaced
      binary or fires the upgrade yet. This is the task plan's own
      DESIGNED pre-merge red state ("expected to fail by timing out ...
      until the sibling tasks land ... must not be weakened to pass
      early"), not a defect in the test.
  AC-2:
    tests: [hot_upgrade_no_churn_when_binary_unchanged]
    red_confirmed: false
    red_reason: >-
      Absence assertion (no misfire on an unchanged binary). Nothing in the
      current codebase can misfire an upgrade at all yet (task0001/task0002
      not landed), so the assertion passes vacuously right now and could
      not be forced red without first implementing the out-of-scope
      production trigger it exists to guard against post-merge. Its value
      is as a regression guard once the identity check lands (per the task
      plan's Design section), not as a red-before-merge proof like AC-1/AC-3.
  AC-3:
    tests: [hot_upgrade_fires_on_binary_replacement_via_mux_start]
    red_confirmed: true
    red_reason: >-
      Observed: "timed out after 25s waiting for \"Mux daemon upgraded in
      place to the newly installed binary\" on the `mux script` vehicle's
      stderr (collected so far: \"\")" at
      src-tauri/tests/mux_hot_upgrade.rs:1062. Same missing-dependency
      reason as AC-1; expected, designed red state, not a defect.
  AC-4:
    tests: [hot_upgrade_no_misfire_when_identity_file_absent]
    red_confirmed: false
    red_reason: >-
      Same rationale as AC-2: an absence assertion (missing identity file
      -> no misfire even with a replaced binary) that cannot be forced red
      without the out-of-scope production trigger already existing.
  AC-5:
    tests:
      - hot_upgrade_fires_on_binary_replacement_via_attach
      - hot_upgrade_no_churn_when_binary_unchanged
      - hot_upgrade_fires_on_binary_replacement_via_mux_start
      - hot_upgrade_no_misfire_when_identity_file_absent
    red_confirmed: false
    red_reason: >-
      Cross-cutting structural property (every new wait is a bounded
      Instant::now()+timeout loop that panics naming the stuck step;
      every scenario uses an isolated unique_runtime_dir and RAII cleanup
      -- DaemonGuard plus the new ChildGuard -- that also terminates any
      spawned attach/script child on failure/drop), verified by
      construction / code review across all four new scenarios rather than
      by a single pass/fail assertion -- the same treatment the
      pre-existing file's own header note already gives this class of
      criterion (its AC-6/AC-7).
  AC-6:
    tests:
      - hot_upgrade_preserves_shell_pid_and_marker_file
      - hot_upgrade_logs_handoff_start_with_pane_count
      - hot_upgrade_succeeds_with_zero_panes
      - hot_upgrade_aborts_on_incompatible_schema_probe
    red_confirmed: false
    red_reason: >-
      Preservation criterion (nothing here should change), not new
      behavior -- there is no meaningful "red" state to observe. Verified
      by these four scenarios' source remaining byte-identical (this
      task's only edit was a pure append after the last pre-existing test)
      and by all four continuing to pass after the append
      (cargo test --test mux_hot_upgrade -- --test-threads=1).
