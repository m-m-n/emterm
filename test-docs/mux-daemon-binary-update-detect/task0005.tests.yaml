acceptance_tests:
  AC-1:
    tests:
      - mux::daemon::tests::recover_from_legacy_daemon_fires_upgrade_and_reports_notice_when_reachable_again
    red_confirmed: true
    red_reason: "assertion `left == right` failed: expected the identity-check provider to be consulted twice: once for the firing decision, once for the post-reachability re-check\n  left: 1\n right: 2 -- the pre-implementation code never re-checked identity after reachability succeeded"
  AC-2:
    tests:
      - mux::daemon::tests::recover_from_legacy_daemon_unconfirmed_replacement_warns_instead_of_notice
    red_confirmed: true
    red_reason: "assertion `left == right` failed: expected exactly the pinned unconfirmed-replacement warning, no success notice\n  left: [\"Mux daemon upgraded in place to the newly installed binary\"]\n right: [\"Warning: mux daemon is reachable but the binary replacement could not be confirmed; continuing with the existing daemon\"] -- the pre-implementation code emitted the success notice on reachability alone, regardless of the post-fire verdict"
  AC-3:
    tests:
      - mux::daemon::tests::recover_from_legacy_daemon_undecidable_post_check_warns_instead_of_notice
    red_confirmed: true
    red_reason: "assertion `left == right` failed: an Undecidable post-fire verdict must never be claimed as success\n  left: [\"Mux daemon upgraded in place to the newly installed binary\"]\n right: [\"Warning: mux daemon is reachable but the binary replacement could not be confirmed; continuing with the existing daemon\"] -- same root cause as AC-2: no post-fire re-check existed"
  AC-4:
    tests:
      - mux::daemon::tests::recover_from_legacy_daemon_timeout_does_not_re_check_identity
    red_confirmed: false
    red_reason: "This criterion's own test could not be made to fail first: the pre-implementation code never performed a post-reachability re-check on ANY path (timeout or success), so on the timeout path specifically the identity-check provider was already invoked exactly once even before this task's change -- confirmed by running this test against the pre-implementation code, where it passed. The criterion is genuinely a 'preserved, no re-check on this path' guarantee rather than new behavior; it is carried forward here as a regression guard against a future change accidentally adding a re-check on the timeout path too."
  AC-5:
    tests:
      - mux::daemon::tests::recover_from_legacy_daemon_production_entry_point_does_not_fire_against_the_stand_in
      - mux::daemon::tests::recover_from_legacy_daemon_unchanged_verdict_does_not_fire
      - mux::daemon::tests::recover_from_legacy_daemon_undecidable_verdict_does_not_fire
    red_confirmed: false
    red_reason: "These tests exercise paths this task's change does not touch: a pre-fire Unchanged/Undecidable verdict never reaches the post-reachability re-check code at all (no Upgrade frame is ever sent), so they were already green before this task's implementation and remain green after -- proving 'no new frame/connection/protocol element' and 'pre-fire Unchanged/Undecidable still sends nothing' by non-regression rather than by a red-to-green transition. The production call site reusing the SAME identity_check closure (no new parameter, no new connection) was verified by code inspection of the diff (identity_check(sock_path) is called a second time on the existing `impl Fn` parameter; no new function signature). NFR2 (Windows / CLI-only builds compile with zero behavior change) was verified via `cargo check --manifest-path src-tauri/Cargo.toml --no-default-features`, a build-level outcome rather than a test; Windows cross-compilation itself was not executed (no cargo-xwin target in this sandbox, and not part of project_commands)."
