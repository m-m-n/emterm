# --- Deviation note (see also the implementer report's `deviations`) ---
#
# Three pre-existing scenarios in src-tauri/tests/mux_hot_upgrade.rs
# (hot_upgrade_preserves_shell_pid_and_marker_file,
# hot_upgrade_logs_handoff_start_with_pane_count,
# hot_upgrade_succeeds_with_zero_panes) spawned the daemon directly from the
# shared `CARGO_BIN_EXE_emterm` cargo build artifact rather than a private
# copy. Under this environment's ambient umask (002), that shared build
# directory is group-writable (0o775), which correctly (per this task's own
# NFR3 rule) causes the new validation gate to refuse the daemon's own
# self-upgrade candidate -- and because these three scenarios only await the
# success-path `Upgrading` broadcast, a refusal manifests as a 20s timeout,
# not a clean assertion failure. Confirmed via `git stash` that these three
# scenarios pass cleanly on the pre-task0004 state (no validation gate to
# trip), i.e. this was a genuine regression introduced by this task's own
# validation logic, not pre-existing flakiness. Fixed by having all three
# scenarios copy the binary into their already-hardened `runtime_dir` first
# (via the file's own pre-existing `copy_daemon_binary` helper), exactly
# matching the pattern every OTHER scenario in this file already used before
# this task started. No assertion in any of the three scenarios was changed.
