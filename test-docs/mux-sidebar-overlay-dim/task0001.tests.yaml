task_id: task0001
# `src-tauri --lib` exercises a large pre-existing pool of timing-sensitive
# off-thread-replay-worker tests (`tabs::tests::*`, `tmux_sockets::tests::*`)
# that are independently flaky under parallel execution (documented in the
# project's own test-execution notes: "tabs.rs replay テストは並列で非決定的
# に落ちる"). Three baseline runs taken before any file was touched produced
# three different subsets of this same pool (17, 7, and 15 failing names,
# all sharing the identical panic site tabs.rs:3145 "off-thread replay
# worker did not complete in time", plus one assertion failure at
# tabs.rs:4520 and one ordering failure in tmux_sockets.rs). The list below
# is the union of every name observed across those three pre-touch runs
# plus post-implementation gate runs (whose only source of failures is the
# same shared pool — verified by identical panic site/message on every
# occurrence). None of these tests import or exercise `settings.rs`,
# `MuxSettings`, or the mux-sidebar app.rs tests this task touches.
baseline_failures:
  - tabs::tests::ac1_offthread_swap_transplants_the_preswap_callbacks_instance
  - tabs::tests::ac2_offthread_swap_preserves_osc_9999_app_param_registration
  - tabs::tests::ac3_offthread_swap_preserves_premux_welcome_osc_form_reaching_apply_mux_message
