acceptance_tests:
  AC-1:
    tests:
      - app_settings::settings::tests::test_mux_settings_window_sidebar_overlay_missing_defaults_overlay
      - emterm::settings::tests::loader_mux_window_sidebar_overlay_missing_defaults_overlay
    red_confirmed: true
    red_reason: >-
      Both asserted `settings.window_sidebar_overlay` / `s.mux.window_sidebar_overlay`
      truthy before the default flip; observed failures:
      "assertion failed: settings.window_sidebar_overlay" (crate) and
      "assertion failed: s.mux.window_sidebar_overlay" (app-side loader).
  AC-2:
    tests:
      - emterm::settings::tests::loader_mux_window_sidebar_overlay_null_resolves_overlay
    red_confirmed: true
    red_reason: >-
      Asserted truthy before the default flip; observed
      "assertion failed: s.mux.window_sidebar_overlay" (the loader path via
      RawMux's Option<bool>, which already treated null the same as absent —
      only the seeded Settings::default() value needed to flip).
  AC-3:
    tests:
      - app_settings::settings::tests::test_mux_settings_window_sidebar_overlay_explicit_false_is_persistent
      - emterm::settings::tests::loader_mux_window_sidebar_overlay_explicit_false_is_persistent
    red_confirmed: false
    red_reason: >-
      Explicit-value assignment in merge_into/serde was already correct
      before this task (only the absent/null default was wrong); these new
      tests passed immediately since AC-3 restates pre-existing explicit-value
      behavior (D3's compatibility guarantee) that this task must not break,
      not new behavior it introduces. Added as new tests (both files
      previously lacked explicit-false coverage) to pin the guarantee
      going forward.
  AC-4:
    tests:
      - app_settings::settings::tests::test_mux_settings_window_sidebar_overlay_explicit_true_is_overlay
      - emterm::settings::tests::loader_mux_window_sidebar_overlay_true
    red_confirmed: false
    red_reason: >-
      Pre-existing tests (renamed/re-commented for the new AC numbering);
      explicit `true` already deserialized to `true` before this task, so
      they were green both before and after. Renamed from
      test_mux_settings_window_sidebar_overlay_true / (AC-3 old numbering)
      to align with the current task plan's AC-4.
  AC-5:
    tests:
      - app_settings::settings::tests::test_mux_settings_window_sidebar_overlay_round_trips
    red_confirmed: true
    red_reason: >-
      The default-settings round-trip half of this test asserted the
      restored value truthy before the default flip; observed
      "assertion failed: restored.window_sidebar_overlay". The
      explicitly-persistent round-trip half was already correct (serde
      round-trips any explicit bool value regardless of default) and was
      reworded, not newly failing.
  AC-6:
    tests: []
    red_confirmed: false
    red_reason: >-
      Whole-suite outcome, not a single test. Verified via
      `cargo test --manifest-path crates/app_settings/Cargo.toml --lib`
      (28/28 pass, 0 baseline failures) and
      `cargo test --manifest-path src-tauri/Cargo.toml --lib` (final
      failures are a strict subset of the pre-existing, unrelated
      tabs.rs/tmux_sockets.rs flaky pool documented above; every
      settings::/app:: test is green). No existing test was deleted; three
      pre-existing tests had their asserted default value and comment
      updated (the task-mandated flip), and two pre-existing app.rs tests
      (outside expected_files) had an implicit default-dependent premise
      made explicit via the existing with_overlay_mode helper — see
      deviations in the implementer report.
