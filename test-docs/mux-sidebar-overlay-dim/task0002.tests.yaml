      - app::tests::mux_sidebar_dim_due_false_while_hovered
      - app::tests::mux_sidebar_dim_due_false_while_hold_pending
      - app::tests::mux_sidebar_dim_due_true_while_fade_in_flight
      - app::tests::mux_sidebar_dim_due_false_once_settled
    red_confirmed: true
    red_reason: "Verified via a temporary revert of resolve_mux_sidebar_dim_deadline to skip the hover/hold-pending early-returns: ac5_deadline_present_while_hold_pending failed (expected Some(switch + OVERLAY_BRIGHT_HOLD), got None). The other listed tests were not independently red-confirmed by that specific revert (ac5_deadline_absent_when_hovered's fade_started=None case still returned None coincidentally); mux_sidebar_dim_due_true_while_fade_in_flight was separately red-confirmed via the mux_sidebar_overlay_open default-flip revert below (it depends on the overlay actually being visible)."
  AC-6:
    tests:
      - app::tests::ac6_next_window_records_a_switch_timestamp
      - app::tests::ac6_prev_window_records_a_switch_timestamp
      - app::tests::ac6_select_window_by_digit_records_a_switch_timestamp
      - app::tests::ac6_new_window_does_not_record_a_switch_timestamp
      - app::tests::ac6_sidebar_row_click_via_apply_tab_event_records_a_switch_timestamp
    red_confirmed: true
    red_reason: "Verified via two temporary reverts: (1) disabling dispatch_mux_action's window_switch_committed branch made ac6_next_window_records_a_switch_timestamp, ac6_prev_window_records_a_switch_timestamp, and ac6_select_window_by_digit_records_a_switch_timestamp fail (mux_sidebar_last_switch stayed None); (2) removing apply_tab_event's MuxSwitch-arm record_mux_window_switch call made ac6_sidebar_row_click_via_apply_tab_event_records_a_switch_timestamp fail. ac6_new_window_does_not_record_a_switch_timestamp is a negative-control case (already satisfied when the positive-recording code is intact) and was not independently red-confirmed."
  AC-7:
    tests:
      - app::tests::ac7_mux_sidebar_overlay_open_on_a_freshly_constructed_app
    red_confirmed: true
    red_reason: "Verified via a temporary revert of the constructor's mux_sidebar_overlay_open initializer back to false: this test failed, along with ac2_toggle_round_trips_when_overlay_mode_enabled, ac3_toggle_is_strict_noop_when_overlay_mode_disabled, mux_sidebar_overlay_resets_when_focused_tabs_mux_group_tears_down, mux_sidebar_overlay_survives_switching_away_from_the_mux_tab, boundary_closing_overlay_mid_fade_then_reopening_resolves_to_a_defined_opacity, and mux_sidebar_dim_due_true_while_fade_in_flight (all of which construct via app_with_mux_windows/with_overlay_mode and assume the AC-7 default)."
  AC-8:
    tests:
      - ui::mux_sidebar::tests::ac8_overlay_opacity_multiplies_the_painted_cards_fill_alpha
      - ui::mux_sidebar::tests::ac8_persistent_placement_ignores_the_opacity_input_entirely
      - ui::mux_sidebar::tests::overlay_card_has_12px_corner_radius_and_92_percent_alpha_surface_container_high
    red_confirmed: true
    red_reason: "ac8_overlay_opacity_multiplies_the_painted_cards_fill_alpha was genuinely observed red twice: (1) during initial authoring, my helper ran only a single egui frame — the Area's first-ever frame is an invisible sizing pass whose shapes resolve to Shape::Noop, not real paint — so no card rect was found ('the card background rect must be painted' panic); fixed by adding the same priming-frame pattern the module's other real-paint tests already use. (2) After that fix, a temporary revert removing the `ui.set_opacity(opacity)` call from draw_overlay made the same test fail again, this time on the alpha-scaling assertion (alpha_half was not less than alpha_full) — confirming the test genuinely detects the feature's absence, not just the harness bug. ac8_persistent_placement_ignores_the_opacity_input_entirely and the pre-existing 12px/92%-alpha test were not independently red-confirmed (draw_persistent's signature never gained the parameter, so there was no code path to break in isolation for the former; the latter is a pre-existing pinned test whose expectations were kept intact per the task plan's Test Notes, not rewritten)."
  AC-9:
    tests:
      - app::tests::ac9_hover_changed_true_after_a_transition_false_once_snapshotted
      - window_host::tests::pointer_moved_hover_feed_shares_the_same_sidebar_hit_region_helper
    red_confirmed: false
    red_reason: "Not independently red-confirmed via a revert: ac9_hover_changed_true_after_a_transition_false_once_snapshotted exercises App::mux_sidebar_hover_changed/set_mux_sidebar_hovered/record_render_state_no_tab directly and would fail to compile before those methods existed (a genuine but unobserved red state, since implementation and test were written together). pointer_moved_hover_feed_shares_the_same_sidebar_hit_region_helper is a source-scan structural test; it was confirmed to pass against the final wiring but not deliberately reverted. The frame-skip-gate half of this AC (animating true during a fade / false once settled) is covered by the AC-2/AC-5 resolver tests above, which were red-confirmed."
  AC-10:
    tests: []
    red_reason: "Build/lint/full-suite outcomes, not a single test: (1) ui::mux_sidebar::tests::ac5_no_hardcoded_color_constructors_in_module_source is the pre-existing module-source-scan test, unmodified, still passing — the new opacity code path adds no raw color constructors (ui.set_opacity is not a color constructor). (2) Full `cargo test --lib` run: 2896-2898 passed depending on tabs.rs off-thread-replay timing flakiness (see baseline_failures — unrelated pre-existing module, no file in expected_files touches tabs.rs), 0 failures outside that known-flaky set across every run performed. (3) `cargo check --no-default-features` (CLI-only build) passes cleanly."
