    red_reason: "Same always-idle-stub revert as AC-1: ac2_resolver_midfade_value_strictly_between_idle_and_full and ac2_resolver_bright_state_is_immediate_no_interpolation failed. ac2_resolver_idle_exactly_after_hold_plus_fade_elapsed and the two boundary tests are negative-control / already-idle cases the stub also satisfies, not independently red-confirmed by that run."
  AC-3:
    tests:
      - app::tests::ac3_second_switch_extends_brightness_past_the_first_switchs_expiry
      - app::tests::ac3_releasing_hover_during_pending_hold_keeps_bright_until_hold_expires
    red_confirmed: true
    red_reason: "Same always-idle-stub revert: both tests failed (expected opacity 1.0, stub returned OVERLAY_IDLE_OPACITY)."
  AC-4:
    tests:
      - app::tests::ac4_resolver_output_always_in_range_for_future_and_far_past_origins
    red_confirmed: false
    red_reason: "Not independently red-confirmed: the always-idle stub used to verify AC-1/AC-2/AC-3 also satisfies this test's 0.0..=1.0 range assertion trivially (OVERLAY_IDLE_OPACITY is in range), so that revert could not distinguish a correct clamp from the stub. The real resolver's clamp path was read-reviewed (checked_duration_since + .clamp(0.0, 1.0)) rather than observed red first."
  AC-5:
    tests:
      - app::tests::ac5_deadline_absent_when_settled
      - app::tests::ac5_deadline_absent_when_hovered
      - app::tests::ac5_deadline_present_while_hold_pending
      - app::tests::ac5_deadline_present_while_fade_in_flight
