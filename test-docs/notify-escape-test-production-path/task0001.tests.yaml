acceptance_tests:
  AC-1:
    tests: []
    red_confirmed: false
    red_reason: >-
      AC-1 is a structural/build constraint (notify_worker takes the two
      injection points; no escape branch or direct escape call in
      notify_worker; escape_for_send is the sole decision point).
      Verified by `CARGO_TARGET_DIR=src-tauri/target cargo check
      --manifest-path src-tauri/Cargo.toml` (exit 0) and by code review of
      src-tauri/src/callbacks.rs (the unix notify_worker body calls only
      fetch_capabilities, escape_for_send and send; it never calls
      escape_body_markup or body_markup_absence_confirmed directly). The
      delegation is exercised indirectly by the AC-2/AC-3 tests below,
      which fail under every escape-bypassing mutation tried for AC-4.
  AC-2:
    tests:
      - callbacks::tests::worker_injection_points::confirmed_body_markup_capability_escapes_both_fields
      - callbacks::tests::worker_injection_points::absent_body_markup_capability_leaves_both_fields_unchanged
      - callbacks::tests::worker_injection_points::fetch_failure_escapes_both_fields
    red_confirmed: true
    red_reason: >-
      Verified by temporarily reverting only src-tauri/src/callbacks.rs to
      its pre-task state (via a scoped `git stash push -- src-tauri/src/callbacks.rs`)
      while keeping the new tests in src-tauri/src/callbacks/tests.rs, then
      running `cargo test --lib callbacks::tests::worker_injection_points`:
      "error[E0061]: this function takes 1 argument but 3 arguments were
      supplied" at callbacks/tests.rs:1360, against the old
      `fn notify_worker(rx: Receiver<(String, String)>)`. The stash was
      then re-applied (not popped) to restore the implementation, verified
      identical via `git diff --stat`.
  AC-3:
    tests:
      - callbacks::tests::worker_injection_points::worker_calls_fetch_and_send_once_per_notification_in_enqueue_order
    red_confirmed: true
    red_reason: >-
      Same compile-time red as AC-2 (single scoped revert covered all four
      new tests in the module at once): "error[E0061]: this function takes
      1 argument but 3 arguments were supplied".
  AC-4:
    tests: []
    red_confirmed: true
    red_reason: >-
      Manual mutation run (VERIFICATION TS-8), performed after the
      implementation was green, each mutation applied alone against
      escape_for_send/notify_worker, `cargo test --lib
      callbacks::tests::worker_injection_points` re-run, then reverted
      before the next mutation (none committed — confirmed via `git diff`
      after the final revert). Results:
        (a) invert the absence condition (`if !body_markup_absence_confirmed(...)`)
            -> 3 of 4 tests failed (confirmed_body_markup_capability_escapes_both_fields,
            absent_body_markup_capability_leaves_both_fields_unchanged,
            fetch_failure_escapes_both_fields).
        (b) skip escape_body_markup on the title only
            -> 2 failed (confirmed_body_markup_capability_escapes_both_fields,
            fetch_failure_escapes_both_fields).
        (b) skip escape_body_markup on the body only
            -> same 2 failed.
        (b) skip escape_body_markup on both
            -> same 2 failed.
        (c) remove the escape_for_send call from notify_worker, forward
            the received title/body unmodified
            -> 2 failed (confirmed_body_markup_capability_escapes_both_fields,
            fetch_failure_escapes_both_fields).
        (d) keep the escape_for_send call but forward the pre-escape
            title/body to send
            -> same 2 failed.
      Every mutation made at least one AC-2/AC-3 test fail, satisfying
      AC-4. `git diff` after the final revert showed no mutation-testing
      residue.
