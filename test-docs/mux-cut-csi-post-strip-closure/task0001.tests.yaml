acceptance_tests:
  AC-1:
    tests:
      - mux::ipc::pty_spawn::tests::round4_cut_csi::round4_fr4_the_closing_is_written_only_when_the_emitted_stream_ends_inside_a_csi
    red_confirmed: true
    red_reason: >-
      Observed on the pre-change write filter with the three new CLOSING_CASES rows in place:
      the test failed with 'fed "ESC[6 ESC]777;emterm;markdown;begin;id=x BEL", cut at the end'
      (left `ESC [ 6`, right `ESC [ 6 DEL`): the strip removed the launch together with its
      ESC, the written bytes still ended inside the CSI, and no DEL followed. The Kitty and
      CSI-query rows have the same cause and were not reached before the first row failed. The
      CSI-query row's byte-by-byte expectation (the fed bytes, no DEL) is stated explicitly in
      BYTE_BY_BYTE_EXPECTATIONS and holds before and after the change. Every pre-existing
      row keeps its expectation; the pre-existing rows pass before and after.
  AC-2:
    tests:
      - mux::ipc::pty_spawn::tests::round4_cut_csi::post_strip_a_cut_after_a_stripped_construct_replays_like_the_raw_stream
    red_confirmed: true
    red_reason: >-
      Observed on the pre-change write filter: the test failed with 'viewer launch, switch
      [?47h, continuation "n": cut at the end of the call, continuation in a later call' - the
      replayed ring answered `ESC [ 1 ; 1 R` (a cursor-position report) and displayed no `n`,
      where the raw-stream reference gives no response and displays `n` at column 1. The
      cut-in-the-same-call and fallback-closing layouts and the Kitty and CSI-query forms were
      not reached before the first layout failed; they share the cause (no DEL after
      `ESC[6`).
  AC-3:
    tests:
      - mux::ipc::pty_spawn::tests::post_strip_cut_csi::post_strip_the_closing_follows_the_stripped_output
    red_confirmed: true
    red_reason: >-
      Observed on the pre-change write filter: the test failed in its EC-2 part with
      'EC-2: cut at the end' (left `ESC [ 6`, right `ESC [ 6 DEL`). The test stops at its first
      failing assertion, so the EC-3 part (a stripped CSI device query embedding a C0 byte)
      and the EC-6 part were not observed red on their own; EC-3 has the same cause as
      EC-2 (the removed query's ESC cleared the pre-strip state). The EC-4 part (a CSI
      followed by a complete kept OSC, or by `ESC X`, then a cut writes no DEL) and the EC-6
      designator parts guard behavior that already held before the change (the pre-existing
      CLOSING_CASES rows with the same bytes pass before and after); they are regression
      guards, not reds.
  AC-4:
    tests:
      - mux::ipc::pty_spawn::tests::post_strip_cut_csi::post_strip_the_carried_csi_state_follows_the_stripped_output
    red_confirmed: true
    red_reason: >-
      Observed on the pre-change write filter: the test failed in its first part with '"ESC["
      then osc 777 launch: the written bytes end inside the CSI' (left `None`, right
      `Some(Entry)`): the filter carried the pre-strip state, cleared by the launch's ESC. The
      EC-1 part (the held target completing in a later call keeps the carried-in CSI) and the
      split-invariance corpus part were not observed red on their own because the test stops at
      the first failing assertion; the split corpus also compares the carried state with
      term_core's after every call, which the pre-change state fails by the same cause.
  AC-5:
    tests:
      - mux::ipc::pty_spawn::tests::post_strip_cut_csi::post_strip_an_overflow_flush_followed_by_a_cut_closes_an_open_csi
    red_confirmed: true
    red_reason: >-
      Observed on the pre-change write filter: the test failed with 'viewer launch: cut at the
      end of the flushing call' - the overflow flush wrote the stripped run without the DEL, so
      the written bytes differ from the stripped run followed by one DEL. The cut-with-`n`
      layout, the no-cut carried state and the other two forms were not reached before the
      first assertion failed; they share the cause (the flush used the pre-strip state).
  AC-6:
