  AC-3:
    tests: [ring_buffer::tests::test_ring_push_blank_clears_recycled_row_overflow_entries]
    red_confirmed: false
    red_reason: >-
      Structural/existence criterion for the new test itself — it exists in
      ring_buffer/tests.rs beside test_ring_push_blank_clears_ridx,
      pre-asserts both columns' overflow-table entries and the reverse-index
      row key are present, scrolls via a plain line feed with no relocation
      involved, post-asserts both entries and the row key are gone, and
      passes on unmodified code. The defect-pin red confirmation for this
      same test is recorded separately under AC-4.
  AC-4:
    tests: [ring_buffer::tests::test_ring_push_blank_clears_recycled_row_overflow_entries]
    red_confirmed: true
    red_reason: >-
      Confirmed by temporarily removing both of ring_push_blank's clearing
      sites together (the scrollback-disabled branch's clear at
      ring_buffer.rs:196-199 and the new-bottom clear at
      ring_buffer.rs:221-224), in a single mutation, then running the
      term_core test command: "assertion failed:
      !core.overflow.contains_key(&(0u32, abs0))" at
      ring_buffer/tests.rs:485 (the test's first post-assertion). The full
      suite under this mutation showed exactly one failure (823 passed, 1
      failed, 13 ignored). Production was restored byte-identically
      afterward (`git diff -- crates/term_core/src/ring_buffer.rs` returns
      empty) and the suite re-confirmed green (824 passed, 0 failed).

      Single-site redundancy (IMPLEMENTATION.md D3): removing only the
      scrollback-disabled branch's clear, or only the new-bottom clear
      (each verified separately, in its own temporary mutation, then
      restored), independently leaves this test green. The two sites
      target the same ring slot for a single push
      (`new_bottom_abs == evicted_abs` always) and are mutually redundant
      for this fixture; a single-site-only removal is not a failed red
      confirmation.

      Departure from IMPLEMENTATION.md D4's prediction: D4 expected the
      same both-sites mutation to also turn the pre-existing
      test_ring_push_blank_clears_ridx red ("very likely... two tests
      red"). Observed reality is otherwise — under the both-sites mutation
      only this new test failed; test_ring_push_blank_clears_ridx stayed
      green. Reason: that test constructs with scrollback capacity 2 (not
      0), so ring_push_blank takes the scrollback-capacity>0 compress
      branch (ring_buffer.rs:157-180), whose own overflow-table clear
      (ring_buffer.rs:177-179) is a third, distinct clearing site that this
      mutation never touched. Because Step 1 (the compress branch's clear)
      always runs before Step 3 (the new-bottom clear) within a single
      push, and both target the same row, the compress branch's untouched
      clear already removes the entry before Step 3 would matter — so
      test_ring_push_blank_clears_ridx is protected independently of the
      two sites this mutation disabled. This is recorded as an observed
      discrepancy with IMPLEMENTATION.md D4, not silently corrected in the
      plan text; it does not weaken this AC's own red confirmation, since
      AC-3's fixture (scrollback capacity 0) has no such independent third
      clearing site and its own test genuinely went red under the mutation.
  AC-5:
