      names) — confirmed red. After the edit: all 25 identifiers each match
      exactly one fn definition (grep -c "fn <name>(" == 1 for all) — confirmed
      green.
  AC-3:
    tests: []
    red_confirmed: true
    red_reason: >-
      Check: string search for "six new" over the document (expect zero matches)
      and read-back of the Test Verification Expected line's count. Base revision
      contained "the six new `window_host::tests` entries" — confirmed red (one
