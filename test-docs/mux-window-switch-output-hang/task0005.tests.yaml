      full implementation) = 2973 passed / 6 failed / 3 ignored — a STRICT
      SUBSET of baseline_failures (see final_failures above for the ts7
      flake explanation) plus 9 new passing tests from this task.
      final_failures ⊆ baseline_failures holds. Additionally ran the plain
      parallel (default --test-threads) `cargo test --lib` project_commands.
      test string verbatim: 2959 passed / 20 failed, all 20 tabs::tests::*
      (a larger, different subset consistent with this project's documented
      pre-existing tabs.rs parallel-execution flakiness) — none touch
      mux::ipc or mux::session::pane, the files this task changed.
notes: >-
  Scope note: this task's central deliverable was correcting a false
  verification record (task0004's AC-4 claimed a test rework that was never
  applied — see test-docs/mux-window-switch-output-hang/task0004.tests.yaml,
  corrected by this task) and closing 3 code-level review-round-4 findings
  (G2 hang-ordering, G3 SPEC/code wording contradiction, G4 starvation-signal
  gap), plus the quota-counter test-coverage gap (AC-5) and one additional
  medium-priority correctness fix taken up as best-effort
  (pane.rs:556 — defer_chunk now drops a redundant Chunk when a
  VisibilityResume for the same pane is already queued, closing the reverse-
  order case AC-5's task0004 fix did not cover; new test
  mux::session::pane::tests::deferred_output_queue_drops_redundant_chunk_when_visibility_resume_already_queued_for_same_pane,
  red-confirmed via revert: without the fix this test failed with
  `left: 2 right: 1` since the redundant Chunk was appended instead of
  dropped).

  Explicitly deferred (architecture, "acceptable to defer" per task0005.md):
  connection.rs:416 (no owning DeferredOutputScheduler type — queue +
  reservation + counter remain bare loop state), pane.rs:370 (DeferredOutputQueue
  lives in the session layer while its invariants live in ipc), and
  pty_spawn.rs:644 (the lock-before-blocking-send rule is honoured at all
  three sites but not enforced by a structural helper). Also consciously not
  touched: connection.rs:2281's medium finding to reduce the AC-2 test's
  thread/payload/deadline footprint — left the 8-thread/32KB saturation
  shape unchanged (this file's own doc explains that shape was empirically
  tuned to reliably reproduce saturation; retuning it without many repeated
  runs to validate risked reintroducing flakiness for a lower-priority,
  explicitly-optional finding).
