    tests:
      - callbacks::tests::ac1_an_osc_after_each_alt_screen_enable_is_reported_with_alt_true
      - callbacks::tests::ac1_an_osc_after_the_matching_disable_in_the_same_parse_call_is_reported_with_alt_false
