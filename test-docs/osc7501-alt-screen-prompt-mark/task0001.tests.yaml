      - osc_handler::tests::test_osc8_early_return_site_notifies_with_the_screen_state_current_at_dispatch
      - osc_handler::tests::test_general_site_notifies_after_the_responder_with_the_screen_state_at_dispatch
      - osc_handler::tests::test_osc133_screen_flag_agrees_with_the_live_mark_gate
    red_confirmed: true
    red_reason: >-
      Observed against a stub that already had the SC-1 provided method (forwarding default) but whose
      fire path passed a constant false for the alternate-screen state. Seven of the eight tests failed
      on the flag, for example ac1_an_osc_after_each_alt_screen_enable_is_reported_with_alt_true
      (left: [(2, "main", false), (2, "alt", false)], right: [(2, "main", false), (2, "alt", true)]),
      ac1_an_osc_after_a_ris_issued_on_the_alt_screen_is_reported_with_alt_false
      (left: [(2, "alt", false), (2, "after-ris", false)], right: [(2, "alt", true), (2, "after-ris", false)]),
      test_osc133_screen_flag_agrees_with_the_live_mark_gate
      (left: ["notify:133:A:false", "notify:133:A:false", "notify:133:B:false", "notify:133:C:false"],
      right: ["notify:133:A:false", "notify:133:A:true", "notify:133:B:true", "notify:133:C:false"]).
      ac1_no_installed_callbacks_means_no_notification_and_no_panic passed against the stub (it pins that a
      core without callbacks stays silent), so it has no red of its own. With the SC-1 method absent
      entirely, the term_core lib test target did not compile (E0407 "method on_osc_with_screen is not a
      member of trait TerminalCallbacks").
  AC-2:
    tests:
      - callbacks::tests::ac2_callbacks_implementing_only_on_osc_see_the_unchanged_sequence
      - callbacks::tests::ac2_the_default_screen_aware_notification_forwards_to_on_osc_regardless_of_the_flag
    red_confirmed: true
    red_reason: >-
      With the SC-1 method absent, the term_core lib test target failed to build: E0599 "no method named
      on_osc_with_screen found for struct callbacks::tests::Recorder" for
      ac2_the_default_screen_aware_notification_forwards_to_on_osc_regardless_of_the_flag (the same build
      failure covers every test in the target). ac2_callbacks_implementing_only_on_osc_see_the_unchanged_sequence
      is a preservation guard: against the forwarding stub it passed, so it has no behavioral red of its
      own. The existing tests of crates/term_core/src/callbacks.rs and crates/term_core/src/osc_handler.rs
      kept their names and bodies and pass in the term_core suite.
  AC-3:
    tests:
      - callbacks::tests::osc_133_a_on_the_alternate_screen_skips_the_7501_feed_and_keeps_the_latch_candidate
      - callbacks::tests::osc_133_a_on_the_main_screen_adds_exactly_one_item_to_each_feed
      - callbacks::tests::osc_133_a_through_the_existing_notification_counts_as_the_main_screen
      - callbacks::tests::osc_133_every_recognized_kind_follows_the_screen_rule_and_an_unrecognized_one_pushes_nothing
      - callbacks::tests::screen_aware_notifications_keep_true_order_in_both_feeds
      - callbacks::tests::screen_aware_notification_of_other_actions_matches_the_existing_notification
    red_confirmed: true
    red_reason: >-
      Observed before NativeCallbacks overrode SC-1 (the default forwards to on_osc, which pushed every
      OSC 133 candidate to the 7501 feed). Three tests failed:
      osc_133_a_on_the_alternate_screen_skips_the_7501_feed_and_keeps_the_latch_candidate
      ("an alternate-screen mark never enters the 7501 feed"),
      osc_133_every_recognized_kind_follows_the_screen_rule_and_an_unrecognized_one_pushes_nothing
      ("A: alternate screen, 7501 feed"), and screen_aware_notifications_keep_true_order_in_both_feeds
      (left held PromptMark(PromptStart) between the first Report and Reset; right did not).
      The other three tests passed before the override because the forwarding default already produced the
      main-screen result and the existing-notification result; they pin that the override keeps them
      (exactly one item per feed, and unchanged state for every non-OSC-133 action on either screen).
