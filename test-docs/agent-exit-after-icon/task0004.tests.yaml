acceptance_tests:
  AC-1:
    tests:
      - mux::upgrade::tests::armed_latch_with_no_d_or_a_yet_survives_restore_with_the_same_generation
    red_confirmed: true
    red_reason: >-
      Observed directly: with the struct fields/accessors in place but the
      restore-side installation line (`*pane.agent_status_exit_latch.lock().unwrap()
      = latch;`) temporarily neutralized, this test panicked with
      `assertion left == right failed: AC-1: an armed latch (Set observed, no
      D/A yet) must survive a hot-upgrade with the same generation
        left: AgentStatusExitLatch { armed: false, command_ended: false, generation: 0 }
       right: AgentStatusExitLatch { armed: true, command_ended: false, generation: 1 }`
      — the restored pane's latch was the fresh default, not the pre-upgrade
      armed value. Re-enabling the installation line turned it green.
  AC-2:
    tests:
      - mux::upgrade::tests::command_ended_latch_fires_exactly_once_on_the_first_live_a_after_restore
    red_confirmed: true
    red_reason: >-
      Observed directly with the same neutralization as AC-1: panicked with
      `assertion left == right failed: AC-2 setup: the restored latch must
      still record command_ended
        left: AgentStatusExitLatch { armed: false, command_ended: false, generation: 0 }
       right: AgentStatusExitLatch { armed: true, command_ended: true, generation: 1 }`
      — the restored pane's latch was disarmed (fresh default), so the
      pending command_ended state from before the upgrade was lost.
  AC-3:
    tests:
      - mux::upgrade::tests::disarmed_latch_stays_disarmed_after_restore_with_no_spurious_clear
    red_confirmed: true
    red_reason: >-
      Observed directly with the same neutralization as AC-1: panicked with
      `assertion left == right failed: AC-3: a disarmed latch must be
      transferred verbatim, not reset or re-derived
        left: AgentStatusExitLatch { armed: false, command_ended: false, generation: 0 }
       right: AgentStatusExitLatch { armed: false, command_ended: false, generation: 1 }`
      — the restored pane's latch lost its pre-upgrade generation (1),
      silently substituting a fresh default (generation 0) instead of the
      transferred value, even though both are behaviorally "disarmed".
# Supplementary (not a separate AC of this task, but strengthened existing
# task0003 coverage with a latch assertion, also observed red under the same
# neutralization before this fix, then green after):
