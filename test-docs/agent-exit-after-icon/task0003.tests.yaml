acceptance_tests:
  AC-1:
    tests:
      - mux::session::pane::tests::test_record_live_osc133_mark_set_then_d_then_a_fires_inferred_clear
      - mux::daemon::tests::test_apply_live_osc133_mark_set_then_d_then_a_fires_inferred_clear
    red_confirmed: true
    red_reason: >-
      Temporarily disabled the latch.record_set()/record_clear() calls in
      MuxPane::apply_agent_status_event. Pane-level test failed:
      "assertion `left == right` failed: D followed by A must fire exactly
      once — left: None right: Some(2)". Daemon-level test failed:
      "must receive AgentStatusUpdate: Elapsed(())" (broadcast never
      arrived). Reverted after confirming.
  AC-2:
    tests:
      - mux::session::pane::tests::test_record_live_osc133_mark_a_without_prior_d_is_a_noop
      - mux::daemon::tests::test_apply_live_osc133_mark_a_without_prior_d_leaves_state_unchanged
    red_confirmed: true
    red_reason: >-
      Temporarily forced MuxPane::record_live_osc133_mark to report "fired"
      on any PromptStart mark, bypassing the latch's own D-gate. Pane-level
      test failed: "left: Some(2) right: None". Daemon-level test failed:
      "an A with no prior D must not broadcast". Reverted after confirming.
  AC-3:
    tests:
      - mux::session::pane::tests::test_record_live_osc133_mark_after_explicit_clear_is_a_noop
      - mux::daemon::tests::test_apply_live_osc133_mark_after_explicit_clear_no_duplicate_clear
    red_confirmed: true
    red_reason: >-
      Temporarily wired only latch.record_set() in apply_agent_status_event
      (explicit Clear no longer called latch.record_clear()). Pane-level
      test failed: "left: Some(3) right: None". Daemon-level test failed:
      "D/A after an explicit Clear must not broadcast a second clear".
      Reverted after confirming.
  AC-4:
    tests:
      - mux::session::pane::tests::test_resume_snapshot_construction_with_osc133_bytes_in_scrollback_never_fires_latch
      - mux::ipc::pty_spawn::tests::pty_reader_loop_feeds_report_then_marks_from_the_same_read_in_order
    red_confirmed: true
    red_reason: >-
      Primary evidence: temporarily injected two
      MuxPane::record_live_osc133_mark calls into resume_pane_with_permit
      (simulating a regression where snapshot/reattach assembly reached the
      latch). Test failed: "snapshot/replay construction must never fire the
      inferred-clear latch — left: None right: Some(Working)". Reverted
      after confirming. The second test
      (pty_reader_loop_feeds_report_then_marks_from_the_same_read_in_order)
      corroborates the "live-only, not scrollback-derived" half of AC-4 by
      construction (pre-seeded scrollback D/A bytes are proven NOT
      re-counted — exactly 3 items reach the channel, not 5) but was not
      separately broken-and-restored; see notes.
  AC-5:
    tests:
      - mux::ipc::pty_spawn::tests::pty_reader_loop_suppresses_osc133_marks_emitted_on_the_alternate_screen
    red_confirmed: true
    red_reason: >-
      Temporarily fed the OSC 133 scanner the raw unfiltered PTY chunk
      (`data`) instead of the alt-screen-gated `to_write`. Test failed:
      "left: [CommandEnd, PromptStart, CommandEnd, PromptStart] right:
      [CommandEnd, PromptStart]" — the alternate-screen D/A pair leaked
      through. Reverted after confirming.
  AC-6:
    tests:
      - mux::daemon::tests::test_pane_without_osc133_marks_keeps_set_state_indefinitely
    red_confirmed: false
    red_reason: >-
      This test only exercises apply_agent_status_report's pre-existing
      Set-application logic, which this task did not change (the latch
      bookkeeping added is a side effect that never touches
      AgentStatus.state on a Set). No plausible revert of this task's own
      changes makes this specific test fail without AC-1/AC-2/AC-3's tests
      failing first, so a genuine red-before-green transition specific to
      this test was not observed. Kept as an explicit NFR3 regression-guard
      rather than a red-proven criterion.
  AC-7:
    tests:
      - mux::session::pane::tests::test_new_pane_has_disarmed_latch
    red_confirmed: true
    red_reason: >-
      The referenced field (MuxPane::agent_status_exit_latch) and type
      (AgentStatusExitLatch) do not exist prior to this task's pane.rs
      changes — before this task this test fails to compile (unresolved
      field / unresolved type), which was the actual failure mode observed
      while incrementally building the field onto MuxPane.
