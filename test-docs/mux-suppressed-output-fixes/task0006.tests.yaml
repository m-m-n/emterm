    red_confirmed: true
    red_reason: >-
      The test passes against the current, unmodified production code (the
      main-buffer resume branch reconstructs the whole scroll-region /
      cursor state from scrollback alone, which already worked). To confirm
      sensitivity, `resume_pane_with_permit` was temporarily edited to pass
