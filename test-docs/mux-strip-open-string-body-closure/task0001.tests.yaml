  AC-7:
    tests:
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_string_body_closing_is_defined_once_in_the_shared_strip
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_the_write_filter_constant_is_the_shared_one
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_the_shared_strip_does_not_depend_on_the_ipc_layer
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_the_doc_comments_state_the_closure_at_a_removal
      - mux::ipc::pty_spawn::tests::overflow_open_string_cut::overflow_open_string_cut_the_doc_comments_state_the_open_body_model
    red_confirmed: true
    red_reason: >-
      Observed before the production change: the definition test failed with `exactly one
