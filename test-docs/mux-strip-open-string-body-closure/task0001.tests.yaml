# Reds: observed on the code before the production change (the closure at a removal and the move
# of STRING_BODY_CLOSING into scrollback_filter.rs). Tests that held before the change by design
# are named in the red_reason of their criterion and are not part of the red evidence.
acceptance_tests:
  AC-1:
    tests:
      - mux::scrollback_filter::tests::open_body_closure_every_entry_point_closes_an_open_body_at_every_removed_construct
      - mux::scrollback_filter::tests::open_body_closure_several_constructs_in_one_body_write_one_closure
    red_confirmed: true
    red_reason: >-
      Observed before the production change: the first test failed with `"ESC]0;t" + osc 777
      launch (BEL) + "n": strip_replayable_rich_content wrote "ESC]0;tn", expected
      "ESC]0;t ESC CAN n"`; the second failed with `"ESC]0;t" + all + "n":
      strip_replayable_rich_content wrote "ESC]0;t CR n", expected "ESC]0;t ESC CAN CR n"`.
  AC-2:
    tests:
      - mux::scrollback_filter::tests::open_body_closure_a_carried_open_body_is_closed_at_every_removed_construct
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_an_osc_body_left_open_by_an_overflow_flush_is_closed_at_the_next_removal
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_dcs_or_apc_body_left_open_by_an_overflow_flush_is_closed_at_the_next_removal
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_held_lone_esc_joins_the_next_construct_and_the_body_is_closed
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_split_read_writes_the_same_bytes_as_one_call
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_split_csi_query_after_a_body_head_replays_like_the_raw_stream
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_no_split_position_lets_a_color_query_join_a_color_head
    red_confirmed: true
    red_reason: >-
      Observed before the production change, all seven failed. (a) the written-state form from
      OscBody wrote [110] (`n`), expected [27, 24, 110]. (b) the next call after the overflow
      flush wrote `?BEL plain text`, expected `ESC CAN ?BEL plain text` (the OSC body and the
      DCS / APC bodies). (c) the call after the held lone ESC wrote `?BEL plain text`, expected
      `ESC CAN ?BEL plain text`. (d) the one-call write of `ESC]0;t` + a held construct + `?BEL`
      was `ESC]0;t?BEL`, without the closure the test expects; the split CSI queries replayed
      with empty rows where the raw stream shows `?` (the tail was absorbed into the open body);
      the themed client answered the split `ESC]11;` + launch + `?BEL` with an OSC 11 color
      report (ring `ESC]11;?BEL`).
  AC-3:
    tests:
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_the_ring_of_a_color_head_and_a_removed_construct_is_closed_and_kept
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_snapshot_replay_of_a_removal_in_a_color_body_answers_nothing
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_snapshot_replay_of_a_removal_in_a_dcs_or_apc_body_matches_the_raw_stream
    red_confirmed: true
    red_reason: >-
      Observed before the production change: the ring test failed with `"ESC]11;" + osc 777
      launch (BEL): the ring holds "ESC]11;?BEL", expected "ESC]11;ESC CAN ?BEL"`; the color
      replay test failed with `"ESC]11;" + osc 777 launch (BEL): replaying the snapshot answers
      [27, 93, 49, 49, 59, 114, 103, 98, 58, ...]` (the OSC 11 color report); the DCS / APC
      replay test failed on the written state (`ESC Px` + launch: StBody, Ground expected). The
      control `open_body_closure_control_the_themed_client_answers_the_closure_less_join_and_every_color_head`
      passed before and after the change, as designed: it shows that the themed client answers
      the closure-less join `ESC]11;?BEL` and each color head + `?BEL`, so the empty response
      assertions above can fail.
  AC-4:
    tests:
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_live_question_mark_after_a_ring_ending_in_a_removal_answers_nothing
    red_confirmed: true
    red_reason: >-
      Observed before the production change: failed at its precondition on the written state,
      `"ESC]11;" + osc 777 launch (BEL)`, left OscBody, right Ground (the ring ended inside the
      open OSC body, so the live `?BEL` that follows would complete it). The control
      `open_body_closure_control_the_live_question_mark_is_answered_after_a_bare_color_head`
      passed before and after the change, as designed: with a ring of the head alone the same
      path answers the live `?BEL`.
  AC-5:
    tests:
      - mux::scrollback_filter::tests::open_body_closure_remap_offsets_around_a_construct_removed_inside_an_open_body
      - mux::snapshot_bytes::tests::build_snapshot_bytes_segments_follow_a_construct_removed_inside_an_open_body
    red_confirmed: true
    red_reason: >-
      Observed before the production change: the remap test failed with `"ESC]0;t" + osc 777
      launch (BEL): "ESC]0;txyz"` (no closure in the output); the segment test failed with
      `"ESC]0;t" + osc 777 launch (BEL), reattach: the construct is replaced by the closure and
      its C0 bytes: "ESC[3J ESC[H ESC[2J ESC]0;ttail ESC[?1049l"`.
  AC-6:
    tests:
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_a_cut_after_the_strips_closure_writes_nothing_more
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_neither_strip_reads_the_written_closure_as_a_target_or_as_st
      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_the_vt100_replay_copy_keeps_the_closure
    red_confirmed: true
    red_reason: >-
      Observed before the production change, two of the three failed: the cut test failed with
      `"ESC]0;t" + osc 777 launch (BEL): cut-free wrote "ESC]0;t"` (no closure to follow with a
      cut), and the vt100 replay copy test failed at its ring precondition (`"ESC]0;t" + osc 777
      launch (BEL)`, left OscBody, right Ground). The test
      `open_body_closure_neither_strip_reads_the_written_closure_as_a_target_or_as_st` passed
      before the change: its input already holds the closure bytes, which the strip never read
      as a target start or ST (the predecessor's cut closure is the same two bytes), so no red
