      - mux::ipc::pty_spawn::tests::strip_open_string_body_closure::open_body_closure_the_predecessor_record_lists_the_renamed_test_with_a_supersede_note
      - mux::scrollback_filter::tests::strip_concat_a_construct_removed_in_ground_adds_no_closing
      - mux::ipc::pty_spawn::tests::strip_concat_query::strip_concat_a_construct_removed_in_ground_or_a_kept_string_adds_no_closing
