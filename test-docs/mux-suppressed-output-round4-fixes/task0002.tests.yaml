      - mux::ipc::pty_spawn::tests
    red_confirmed: false
    red_reason: >-
      A dedicated new module is out of scope, but the existing `mux::ipc::pty_spawn::tests`
      module (found by searching the test directory for `write_filter.rs`, `write_filter` and
      `pty_spawn/mod.rs`, and for the bare filename `mod.rs` under pty_spawn) detects a
