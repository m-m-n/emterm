acceptance_tests:
  AC-1:
    tests:
      - mux::ipc::pty_spawn::tests::round4_as05::round4_989ec5c5_as05_fallback_never_fabricates_after_a_designator_chain_inside_the_chunk
      - mux::ipc::pty_spawn::tests::round4_as05::round4_as05_scan_reports_nothing_behind_a_designator_chain_in_the_chunk
      - mux::ipc::pty_spawn::tests::round4_as05::round4_as05_intersection_never_reports_more_than_the_true_parse_answers
      - mux::ipc::pty_spawn::tests::round4_as05::round4_as05_even_chain_never_answers_more_than_the_reference
    red_confirmed: true
    red_reason: >-
      Run against the pre-change scan. The registry test failed with `window
      ESC ( chain, chunk ESC ( chain: suppressed query: response bytes differ
      from the reference left: [27, 93, 49, 49, 59, 114, 103, 98, 58, 48, 48,
      48, 48, 47, ...] right: []` (the fabricated OSC 11 query was delivered and
      the client answered it). The scan-level test failed with `no item may be
      reported for the chunk, got [ScanItem { kind: ColorQuery, range: 4..11 }]`.
      The token-sequence oracle failed with `odd chain, chunk
      "\u{1b}(\u{1b}(\u{1b}[c": the items draw more DA1 responses than the raw
      stream`. The open-CSI half of the registry test sits after the query half,
      so on the pre-change code its first failure was hidden; it was observed
      separately with a one-off probe of the same reads (chunks: 129 `ESC (`,
      `ESC ( ESC ( ESC [`, `6n`) that was removed afterwards: the pre-change
      reader re-delivered the 2-byte `ESC [` tail and `6n` drew the DSR
      `[27, 91, 49, 59, 54, 55, 82]` while the reference answered nothing. The
      even-chain test is the accepted miss: it asserts only that no response is
      fabricated, so it passed before the change and is not a red.
  AC-2:
    tests:
      - mux::ipc::pty_spawn::tests::round4_as05::round4_as05_items_and_tails_both_readings_report_identically_are_kept
      - mux::ipc::pty_spawn::tests::round4_as05::round4_as05_plain_first_byte_then_a_color_query_is_still_delivered_once
      - mux::ipc::pty_spawn::client_parity_scan::tests::round3_as05_trailing_designator_introducer_keeps_constructs_that_start_later
      - mux::ipc::pty_spawn::client_parity_scan::tests::round3_as05_trailing_designator_introducer_keeps_an_incomplete_utf8_tail
    red_confirmed: false
    red_reason: >-
      These pin what the two readings agree on: a plain first byte followed by a
      query, a designator pair or ESC ESC before a query, an incomplete UTF-8
      character at the end of the view, and the control behind a ground window.
      The behavior pre-existed (the old rule kept all of it) and the new tests
      passed against the pre-change scan, so no red state occurred; the
      intersection only removes results, and these cases show it removes none
      of them. The existing round3_as05 tests run unchanged and are not edited.
