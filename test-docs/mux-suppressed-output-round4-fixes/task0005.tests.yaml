# Alternate-screen state per case, term_core against the vt100 shadow parser (the state that
# decides whether a residual falls outside the fix boundary):
#   ESC[?47h, ESC[?1049h in the slot: term_core prints text and stays on the main screen; the
#     shadow parser aborts on the ESC and enters the alternate screen (DIFFERS).
#   ESC[?47l, ESC[?1049l in the slot: term_core prints text; the shadow parser stays on the
#     main screen (same).
#   ESC[?1047h, ESC[?1047l in the slot: term_core prints text; the shadow parser takes no
#     action on 1047 (same).
# The differing case is the residual recorded in DECISIONS.md (FR5): after an `h` form that
# nothing closes the snapshot is laid out as an alternate-screen pane and the next read's
# extraction starts in the alternate screen. Both are outside the boundary (D4).
acceptance_tests:
  AC-1:
    tests:
      - mux::ipc::pty_spawn::tests::round4_designator_slot::round4_fr5_switch_in_the_designator_slot_matches_the_raw_stream_reference
    red_confirmed: true
    red_reason: >-
      Observed on the parent's extraction and capture step (write_filter.rs and mod.rs taken
      from the integration branch, plus a compile-only shim for the new extraction API, no
      behavior change): the registry test failed with 'leave, one read / "\u{1b}(" / [?47h /
      restore at read 0: the ring holds the designator-slot sequence as text' (left
      `pre ESC ( ESC TEXT later`, right `pre ESC ( ESC [?47l TEXT later`). So FR5 reproduced:
      the ring lacked the `[?47l` bytes that term_core prints as text after the designator
      ESC. That ring assertion is the first one in the test, so the run stopped there; the
      comparison of screen, cursor, responses and displayed characters with the raw-stream
      reference follows it and was not what failed in that run. An exploratory probe on the
      same pre-change code showed the client's rows and cursor differing from the reference at
      the restore points of the one-read and `ESC (`-ends-the-read layouts, and in one
      layout (a color query after the sequence) the responses too.
  AC-2:
