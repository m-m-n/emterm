baseline_failures: []          # refreshed after the parent (task0002, task0003, task0004 merged) was merged in: `--lib` on the parent's write_filter.rs with the `held_construct_start` accessor stubbed so this task's tests compile: 4062 passed, 18 failed, 3 ignored; the 18 are this task's new or updated tests, none is inherited
final_failures: []             # re-executed after FR1 was re-implemented on the updated parent (full `--lib` run): 4080 passed, 0 failed, 3 ignored
# Red observations were made against the parent's write_filter.rs (the new and
# updated tests present, the production file restored to the parent's; the
# `held_construct_start` accessor stubbed so the tests compile): 18 tests failed
# on the updated parent, 13 of them the first-round FR1 tests and 5 the tests
