acceptance_tests:
  AC-1:
    tests:
      - mux::ipc::pty_spawn::tests::round4_chain::round4_3e2024dc_a_chain_closed_by_a_cut_is_never_completed_by_a_later_read
    red_confirmed: true
    red_reason: >-
      Against the parent's write_filter.rs the registry test failed with "(a) one read, OSC
      aborted by OSC [?47h: the ring holds no OSC introducer from the chain" (left 1, right 0):
      the aborted `ESC ]11;?` was written to the ring when the read that opened the chain
      was fed, so the snapshot replay left an OSC open and the later BEL completed it.
  AC-2:
    tests:
      - mux::ipc::pty_spawn::tests::round4_chain::a_cut_at_or_after_the_chain_head_drops_the_whole_chain
      - mux::ipc::pty_spawn::tests::round4_chain::the_reader_fallback_drops_a_held_chain_from_its_head
    red_confirmed: true
    red_reason: >-
      Against the parent's write_filter.rs both failed. The filter-level test with "OSC aborted
      by OSC: cut at 10, [] after it: the settled bytes and the bytes after the cut, nothing
      from the chain head on" (left `ab ESC ]11;?`, right `ab`): the aborted OSC was already
      written. The reader-level fallback test with "[?47h: the held chain is not written to
      the ring" (left 1 OSC introducer in the ring, right 0).
  AC-3:
    tests:
      - mux::ipc::pty_spawn::tests::round4_chain::chain_corpus_is_split_invariant_and_pending_is_the_whole_chain_after_every_call
      - mux::ipc::pty_spawn::tests::round4_chain::the_read_that_opens_a_chain_does_not_write_its_head
      - mux::ipc::pty_spawn::tests::write_filter_boundaries_are_split_position_independent_and_match_term_core
    red_confirmed: true
    red_reason: >-
      Against the parent's write_filter.rs the first two failed: the corpus test with "OSC
      aborted by OSC + []: after feeding ab ESC ]11;? ESC ]0;x, pending must be exactly the
      chain that ends in the single incomplete construct" (left `ESC ]0;x`, right the whole
      chain), the second with "only the settled prefix is written" (left `ab ESC ]11;?`, right
      `ab`). `write_filter_boundaries_are_split_position_independent_and_match_term_core` was
      updated (its allowed pending shapes now include a chain that starts with a superseded
      ESC, and two such items joined its corpus); it passed on the parent's file too, because
      the parent also holds those two items from their last construct onward, so no red state
      occurred for that test.
  AC-4:
    tests:
      - mux::ipc::pty_spawn::tests::round4_chain::a_held_construct_that_completes_reports_only_its_own_bytes_and_settles_the_chain
      - mux::ipc::pty_spawn::tests::round4_chain::a_chain_that_settles_before_a_cut_is_written_and_the_next_construct_is_dropped
      - mux::ipc::pty_spawn::tests::round4_chain::a_suppressed_chunk_whose_pending_holds_a_chain_redelivers_it_once
    red_confirmed: true
    red_reason: >-
      Against the parent's write_filter.rs all three failed on the chain not being held: the
      first with left `ab ESC ]11;?` right `ab` (the first aborted link was written when the
      chain was fed), the second with the same left / right at its first assertion, the third
      with "the chain is held whole" (left `ESC ]0;x`, right `ESC ]11;? ESC ]0;x`). The
      third test's later assertions (the tail is the whole chain, no byte is both an item and
