  none of the seven Acceptance Criteria admit a genuine red-before-green
  cycle without fabricating a failing test, which the plan itself forbids.
  The honest sequence documented in the plan was followed instead: (1)
  rewrite the two test assertions onto the sink receive log and confirm
  they pass against the still-buffering code (characterization —
  confirmed both tests green pre-removal), (2) perform the production
  removal, (3) confirm the same assertions still pass post-removal and the
  crate compiles, (4) run the static absence checks for AC-1/AC-2/AC-3.
