acceptance_tests:
  AC-1:
    tests:
      - mux::tmux_import::tests::missing_file_creates_settings_with_latch_only
      - mux::tmux_import::tests::latch_skips_second_run
      - mux::tmux_import::tests::applies_conversion_and_sets_latch
      - mux::tmux_import::tests::preserves_unrelated_keys
      - mux::tmux_import::tests::keybinds_replaces_non_object_value
    red_confirmed: true
    red_reason: >-
      Before the fix, running `cargo test --lib mux::tmux_import::tests::`
      left /tmp/emterm-tmux-import-test-698110-{missing,latch,apply,preserve,
      keybinds_nonobject}/ on disk after all 6 tests passed (verified with
      `find /tmp -maxdepth 1 -name 'emterm-tmux-import-test-*'` immediately
      after the run). After adding `cleanup_tmp_settings_dir` calls at the
      end of each of the 5 tests, re-running the same command (and each of
      the 5 tests individually via `--exact`) left no new
      emterm-tmux-import-test-<this-run's-pid>-* directories under /tmp.
