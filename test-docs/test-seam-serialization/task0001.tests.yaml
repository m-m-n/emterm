acceptance_tests:
  AC-1:
    tests:
      - sftp::service::tests::test_push_progress_event_delivers_the_pinned_event_through_send_progress
      - sftp::service::tests::test_push_result_event_delivers_the_pinned_event_through_send_result
      - app::tests::timing::frame_work_pending_true_when_progress_channel_nonempty_and_consumes_nothing
      - app::tests::timing::frame_work_pending_true_when_result_channel_nonempty_and_consumes_nothing
      - app::tests::timing::next_toast_deadline_some_when_pretoast_progress_event_pending
    red_confirmed: false
    red_reason: >
      The two new content-pinning tests assert the same field values
      (session_id "test-pending" / file_name "test.txt" / bytes 0 / total 0
      / Uploading / no error; request_id 0 / Ok([])) the seams already
      produced via a bare `.send(` before this task. Routing through
      `send_progress` / `send_result` does not change what lands on the
      channel — only the call path — so this content assertion holds
      identically before and after Part A and has no observable red state
      of its own. The routing change itself IS proven red-then-green: see
      AC-3/AC-4 below, where the structural check fails against the
      not-yet-rerouted seams and passes once Part A routes them through
      the helpers. The three `timing.rs` seam-caller tests
      (TS-1, pre-existing, unmodified) were green at baseline and remain
      green — they exercise `frame_work_pending` /
      `next_toast_deadline`, not seam content, and needed no change.

  AC-2:
    tests: []
    red_confirmed: false
    red_reason: >
      Documentation-only criterion (inspection, not a test). Verified by
      reading the updated `#[cfg(test)] impl SftpService` doc comment
      (src-tauri/src/sftp/service.rs, seam block): it now says the
      synthetic events go through `send_progress` / `send_result` and no
      longer says they are placed on the channels directly; it still
      states the seams exist only in test builds and the production API
      is unchanged. `send_progress`'s own doc comment
      ("Every progress-channel send in this module goes through this
      helper...") was not touched — `git diff` confirms no change to
      those lines.

  AC-3:
    tests:
      - sftp::service::tests::every_progress_and_result_send_site_routes_through_the_wake_helpers
    red_confirmed: true
    red_reason: >
      After widening `find_mod_tests_boundary` to anchor specifically on
      the `#[cfg(test)]\nmod tests` pair (not the seam block's own
      `#[cfg(test)]`), this test failed against the real, not-yet-rerouted
      file: "found a bare progress_tx send — route it through
      send_progress instead" (panic at
      src-tauri/src/sftp/service.rs:1017, `cargo test --lib
      sftp::service::tests::`). The seam block's `self.progress_tx.send(`
      was now inside the scanned region for the first time. Went green
      immediately after Part A rerouted both seams through the helpers —
      rerun same command, 20/20 passed.

  AC-4:
    tests:
      - sftp::service::tests::send_site_scan_detection_routine_red_cases
    red_confirmed: true
    red_reason: >
      Observed against an intentionally naive/wrong `find_mod_tests_boundary`
      (`src.find("#[cfg(test)]")` — reproducing the exact D3 bug: cutting at
      ANY `#[cfg(test)]`, including the seam block's own attribute). Case
      (i) failed: "assertion failed: (i): a bare progress send before mod
      tests must be detected" (panic at
      src-tauri/src/sftp/service.rs:1046). With the naive boundary, the
      synthetic case (i)/(ii) inputs place their bare send inside a
      `#[cfg(test)] impl` block whose own attribute the naive finder
      matches first, producing an empty scanned region and hiding the
      violation. Fixed by anchoring to the `#[cfg(test)]\nmod tests` pair
      specifically; rerun after the fix: all four synthetic cases (i)-(iv)
      passed. Separately, and as required by the plan: the *real* check
      (`every_progress_and_result_send_site_routes_through_the_wake_helpers`,
      AC-3 above) failed against the actual pre-Part-A file once the scan
      region was correctly widened — that is the "widened check failed
      against the pre-change bare seams before Part A was applied"
      observation the plan asks this record to note.

  AC-5:
    tests: []
    red_confirmed: false
    red_reason: >
      FR7 audit, not a test — see `fr7_audit` below. Zero hits in the
      search scope, so no code change and no guard was needed; no file
      outside sftp/service.rs was modified.

  AC-6:
