      - self_exec::tests::restart_flag_test_guard_stays_usable_after_a_panicking_span
      - app::tests::timing::next_toast_deadline_none_when_no_toast_active
      - app::tests::timing::next_toast_deadline_some_when_restart_toast_active
      - app::tests::timing::next_toast_deadline_some_when_sftp_toast_active
      - app::tests::timing::pump_toasts_runs_both_pumps_unconditionally
      - app::tests::timing::frame_work_pending_false_on_fresh_app
      - app::tests::timing::frame_work_pending_true_when_progress_channel_nonempty_and_consumes_nothing
      - app::tests::timing::frame_work_pending_true_when_result_channel_nonempty_and_consumes_nothing
      - app::tests::timing::frame_work_pending_true_when_restart_flag_raised_and_consumes_nothing
      - app::tests::timing::next_toast_deadline_some_when_pretoast_progress_event_pending
      # + all 22 tests under sftp::service::tests (full module)
    red_confirmed: false
    red_reason: >
      Suite-level invariant, not a single test with a meaningful
