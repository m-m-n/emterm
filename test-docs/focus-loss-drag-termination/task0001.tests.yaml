      - mouse_report::tests::no_owner_left_release_completes_selection_only_when_drag_in_flight
      - window_host::tests::focus_loss_clear_all_empties_gesture_and_held_records_so_the_next_decision_starts_fresh
    red_confirmed: false
    red_reason: "Both tests already passed before this task (their covered behavior — the no-owner release fallback and clear_all's record-emptying — is unchanged by this task; AC-6 requires them to keep passing with only an explanatory comment added to the first). AC-6's full claim (whole suite passes, structural assertion is the only pre-existing test whose body changed) is verified by the complete `cargo test --lib -- --test-threads=1` run: 3471 passed, 0 failed, 3 ignored, identical to the 4a baseline plus exactly one new test."
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: "Build/format outcome, not a test. Verified by running all four declared commands and observing exit 0: `cargo check --manifest-path src-tauri/Cargo.toml` (default features), `cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1`, `cargo check --manifest-path src-tauri/Cargo.toml --no-default-features` (CLI-only), and `make fmt-check`. The new predicate's signature (`fn should_terminate_drag(bool, bool) -> bool`) and the arm's added `let left_held: bool` mention no windowing/GPU/PTY/terminal-mode type, confirmed by reading the diff."
