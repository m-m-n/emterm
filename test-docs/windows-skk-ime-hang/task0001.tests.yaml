acceptance_tests:
  AC-1:
    tests: []
    red_confirmed: true
    red_reason: >-
      Structural criterion, verified by grep, not a unit test.
      Before: `grep -n '\.set_ime_allowed(\|\.set_ime_cursor_area('
      src-tauri/src/ime/winit_bridge.rs` matched 3 production call
      sites reachable from event dispatch (with_handle at
      construction, notify_focus, notify_cursor_rect) plus Drop.
      After: the same grep matches only flush() (2 calls) and
      Drop::drop() (1 call) in production code; the remaining 2
      matches are the test-only SharedMock delegation shim.
  AC-2:
    tests:
      - ime::winit_bridge::tests::notify_focus_true_records_until_flush_then_calls_exactly_once
    red_confirmed: true
    red_reason: >-
      Failed pre-implementation (notify_focus called
      window.set_ime_allowed synchronously): "assertion `left == right`
      failed: notify_focus must not reach the window before flush
      left: 2 right: 1".
  AC-3:
    tests:
      - ime::winit_bridge::tests::cursor_rect_multiple_records_before_flush_coalesce_to_last
      - ime::winit_bridge::tests::cursor_rect_is_deduplicated_after_flush
    red_confirmed: true
    red_reason: >-
      cursor_rect_multiple_records_before_flush_coalesce_to_last
      failed pre-implementation: "left: [(10, 20, 9, 18), (11, 20, 9,
      18)] right: [(11, 20, 9, 18)]" (no coalescing without
      deferral). cursor_rect_is_deduplicated_after_flush covers the
      "same-rect dedup keeps working" clause of AC-3, which is
      pre-existing FR7 behavior carried forward with explicit flush()
      calls added (task plan's allowed deviation); it was green both
      before and after.
  AC-4:
    tests:
      - ime::winit_bridge::tests::flush_orders_allow_before_cursor_within_same_turn
    red_confirmed: true
    red_reason: >-
      A pure no-op-flush revert didn't discriminate this test (the
      reverted notify_focus/notify_cursor_rect's direct-call order
      coincidentally reproduced the same relative order). Confirmed
      red with a targeted revert instead: deferred recording kept
      intact, only flush()'s internal order swapped to
      cursor-before-allow -> "left: [Cursor, Allowed] right: [Allowed,
      Cursor]".
  AC-5:
    tests:
      - ime::winit_bridge::tests::flush_with_nothing_recorded_makes_no_calls
    red_confirmed: false
    red_reason: >-
      Not independently discriminated by the no-op-flush revert used
      for the other tests (a permanently no-op flush trivially makes
      "no new calls" true on every call, since nothing is ever queued
      under that revert either). No cheap revert isolates "flush
      emits nothing when nothing is recorded" from "flush does
      nothing at all" without reconstructing the real implementation.
      The assertion is still meaningful against the real flush() and
      is green post-implementation.
  AC-6:
    tests:
      - ime::winit_bridge::tests::drop_disables_ime
      - ime::winit_bridge::tests::drop_discards_pending_cursor_rect
    red_confirmed: true
    red_reason: >-
      Both failed pre-implementation ("left: [true, false] right:
      [false]") when with_handle/notify_focus called
      window.set_ime_allowed directly instead of deferring — Drop's
      own `false` call then followed a leaked `true` call instead of
      being the only call.
  AC-7:
    tests:
      - ime::winit_bridge::tests::init_records_allow_true_and_flushes_it_on_first_flush
    red_confirmed: true
    red_reason: >-
      Failed pre-implementation: "construction must only record the
      enable, not call the window yet" — the old with_handle called
      set_ime_allowed(true) synchronously at construction.
  AC-8:
    tests:
      - ime::winit_bridge::tests::should_suppress_key_truth_table_is_total_over_all_combinations
      - ime::winit_bridge::tests::preedit_starts_composition_and_dispatch_returns_consumed
      - ime::winit_bridge::tests::commit_clears_composition_and_unblocks_dispatch
      - ime::winit_bridge::tests::disabled_produces_focus_out_and_clears_composition
      - ime::winit_bridge::tests::x11_ambiguous_empty_preedit_start_and_end_toggles_dispatch
      - ime::winit_bridge::tests::notify_focus_propagates_to_set_ime_allowed_after_flush
      - ime::winit_bridge::tests::cursor_rect_is_deduplicated_after_flush
    red_confirmed: false
    red_reason: >-
      Regression-prevention criterion, not a new-behavior one: these
      are the existing gate-predicate / event-translation tests
      carried forward with no semantic change (two of them gained
      only explicit flush() calls, the task plan's allowed
      deviation). They were green before this task and remain green
      after — there is no red to observe.
  AC-9:
    tests:
      - ime::winit_bridge::tests::double_enabled_second_occurrence_warns_and_latches
      - ime::winit_bridge::tests::double_disabled_second_occurrence_warns_and_latches
    red_confirmed: true
    red_reason: >-
      Both failed pre-implementation with the latch-set statements
      removed: "second consecutive Enabled must warn and latch" /
      "second consecutive Disabled must warn and latch".
  AC-10:
    tests: []
    red_confirmed: false
    red_reason: >-
      Build/test gate, not a new-behavior red: `cargo check` and
      `cargo test --lib` already passed on the pre-task0001 code
      (flush() didn't exist yet, so nothing referenced it to fail).
      Verified green post-implementation: cargo check clean, ime::
      module 112/112 passing on every run, full-suite failures
      confined to the pre-existing tabs::tests flaky family (see
      baseline_failures / final_failures above).
