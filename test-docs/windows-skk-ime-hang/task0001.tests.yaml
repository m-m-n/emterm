task_id: task0001

# Baseline (Step 4a, before any edit) and final (after implementation)
# full-suite `cargo test --lib` failures. Every name below is in the
# `tabs::tests` module (off-thread replay worker timing races at
# tabs.rs:3145, plus one mux_group assertion at tabs.rs:4520) — a
# documented pre-existing non-determinism (project MEMORY.md:
# "tabs.rs replay テストは並列で非決定的に落ちる（--test-threads=1
# で安定）"), unrelated to any file this task touches
# (src-tauri/src/ime/*, app.rs's ime methods, window_host.rs's
# about_to_wait flush wiring). `baseline_failures` is the UNION
# observed across 4 full-suite runs (1 literal pre-implementation
# baseline + 3 post-implementation runs, the latter two incidental to
# a retroactive red-check on winit_bridge.rs — tabs.rs was never
# touched in any of them) because the specific failing subset changes
# nondeterministically run-to-run even with byte-identical code; using
# only the single first-run snapshot would misclassify later runs'
# different members as regressions. `final_failures` is the literal
# last full-suite run's list, fully contained in that union.
