acceptance_tests:
  AC-1:
    tests:
      - mux::inherited_pty::tests::dropping_the_adapter_closes_the_owned_descriptor
    red_confirmed: false
    red_reason: >-
      The test already existed under this name and passed before the change
      (the approved --lib baseline run listed it as ok); the failure it is
      meant to remove depends on another test thread reusing the freed
      descriptor number, which cannot be provoked deterministically (SPEC A1,
      NFR2), so no red state was observed for the rewritten closure check
      itself. The decision logic it now relies on is pinned by the AC-2 test,
      whose red run is recorded under AC-2 and AC-3.
  AC-2:
    tests:
      - mux::inherited_pty::tests::closure_judgment_distinguishes_other_pty_masters
    red_confirmed: true
    red_reason: >-
      The test was written first, against a closure judgment that still
      compared st_rdev. The approved --lib run reported it FAILED with
      "assertion `left == right` failed: B's master: fd 31, baseline pts 17,
      observed pts number 21 / left: true / right: false" at
      src-tauri/src/mux/inherited_pty.rs:542, i.e. the st_rdev judgment
      called B's master "original". After the judgment was switched to the
      pts number the same run reported it ok, with all six verdicts asserted
      (B's master, duplicate of B's master, duplicate of A's master, handle to
      A's slave, ordinary temporary file, CLOSED_FD).
  AC-3:
    tests:
      - mux::inherited_pty::tests::closure_judgment_distinguishes_other_pty_masters
    red_confirmed: true
    red_reason: >-
      Red run with the closure judgment replaced by an st_rdev equality check
      (the descriptor's st_rdev compared with the st_rdev of /dev/ptmx, which
      is the device number every PTY master reports on this host): the AC-2
      test failed at the first table row, the B-master case, with "B's master:
      fd 31, baseline pts 17, observed pts number 21" and left: true /
      right: false. Reason: every PTY master descriptor reports the same
      st_rdev, so an st_rdev check cannot tell master B (pts 21) from master
      A (pts 17). The st_rdev variant was temporary and is not kept in the
      final code; the recorded run is the only evidence of this red.
  AC-4:
