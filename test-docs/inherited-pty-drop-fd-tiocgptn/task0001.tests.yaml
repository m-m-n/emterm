      test reads inherited_pty.rs or asserts its message text (searched
      src-tauri/src and src-tauri/tests by the path
      src-tauri/src/mux/inherited_pty.rs and by the basename inherited_pty.rs
      and inherited_pty; the hits are module declarations, imports and
      comments, and the synthetic test-docs reader targets another record).
      The message is confirmed by reading the final diff:
      "fd {dup_fd}, baseline pts {baseline_pts}, observed after drop: {observed}"
      where observed is "pts number N" on success and "TIOCGPTN failed with
      errno E" on failure. No executable red exists, so none was observed.
