      - window_host::mouse_report::tests::ac6_button_and_wheel_paths_both_carry_the_two_reset_observations
    red_confirmed: true
    red_reason: >-
      Beyond the AC-1 block-removal compile-failure red, additionally
      verified the TS-23 tab-identity defect ac6_ts23 exists to catch:
      temporarily changed the Report-owned release branch to target
      `inputs.active_tab` (the tab active AT RELEASE) instead of
      `records.built_for_tab` (the tab the press recorded) — replicating "the
      release path ... writing to the tab active at release time instead of
