  AC-4:
    tests:
      - window_host::mouse_report::tests::ac4_ts20_shift_press_then_lift_then_release_completes_selection_locally
      - window_host::mouse_report::tests::ac4_ts20_no_shift_press_then_shift_arrives_release_still_reports_without_shift_bit
      - window_host::mouse_report::tests::ac4_press_rejected_by_grid_ownership_records_no_owner
      - window_host::mouse_report::tests::ac4_two_buttons_pressed_mid_gesture_are_owned_independently
    red_confirmed: true
    red_reason: >-
      Beyond the AC-1 block-removal compile-failure red (all four share it),
      additionally verified the specific D10 defect these two sequence-driven
      tests exist to catch: temporarily made decide_motion_event ignore the
      recorded gesture owner entirely (`let owner: Option<GestureOwner> =
      None;`, replicating "the motion path branching on the instantaneous
      Shift flag instead of the recorded gesture owner"). Re-ran
      `cargo test --lib window_host::mouse_report::tests::ac4`:
      ac4_ts20_no_shift_press_then_shift_arrives_release_still_reports_without_shift_bit
      panicked ("an owned Report gesture keeps reporting motion despite
      Shift" — motion returned Disposition::Nothing instead of Report) and
      ac4_ts20_shift_press_then_lift_then_release_completes_selection_locally
      panicked (`assertion left == right failed: left: Report{...}, right:
      Nothing` — the motion between press and release incorrectly reported
      once Shift was lifted). Restoring the owner-first logic made both pass.
  AC-5:
    tests:
      - window_host::mouse_report::tests::ac5_ts21_rejected_motion_leaves_cached_cell_unchanged_then_next_motion_still_reports
    red_confirmed: true
    red_reason: >-
      Beyond the AC-1 block-removal compile-failure red, additionally
      verified the exact TS-21 ordering defect this criterion exists to
      catch: temporarily restructured decide_motion_event so grid-ownership
      (SC-8) gated only the final disposition instead of running first,
      ahead of the cell-change filter (SC-4) — i.e. the filter's would-report
      check and the cache_cell update still happened for a rejected
      position, with only the byte-producing disposition suppressed
      afterward. Re-ran the test: panicked with "the cached cell must be
      exactly what it was before the rejected motion" (the rejected motion's
      cell got committed to the cache despite emitting no bytes) — proving a
      byte-emptiness-only assertion would have passed even with this defect,
      exactly as the task plan's Test Notes describe. Restoring the
      ownership-first order made the test pass.
  AC-6:
