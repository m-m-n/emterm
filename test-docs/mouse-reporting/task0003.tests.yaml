  AC-7:
    tests: []
    red_confirmed: true
    red_reason: >-
      Build/test outcome, not a test. Baseline (4a, before this task's own
      implementation existed) ran the main test command clean (3347 passed,
      0 failed, 3 ignored). This task's first implementation pass then built
      D3 stubs for SC-1 (csi_modes.rs), SC-2..SC-5 (mouse_report.rs) and
      SC-6 (input_translate.rs's wheel_consumer), since task0001/task0002
      had not yet merged into the parent at that point; that pass's own
      regression (adding modes 1000/1002/1003/1006 to csi_modes.rs broke two
      pre-existing csi_dispatch.rs tests hardcoding mode 1000 as a
      TS-fallback example) was caught and fixed by switching those two tests
      to mode 1005. Before this task's merge attempt, task0001 and task0002
      had already merged their real implementations into the parent
      (em-workflow/mouse-reporting/integration); `merge-task.sh` reported a
      conflict (exit 1) in the four stubbed files. Following the parent-
      side-adoption protocol: merged the parent in, ran `git checkout
      --theirs` for csi_dispatch.rs/csi_modes.rs/input_translate.rs/
      mouse_report.rs, committed the resolution, then re-ran the suite —
      this did not compile (pointer_routing.rs/mod.rs/tests.rs still
      referenced the D3 stubs' names/signatures, e.g.
      `ButtonIdentity`/`button_code`/`term_core::csi_modes::MODE_MOUSE_*`,
      which the adopted real contracts renamed/reshaped). This
      non-compiling state was caused entirely by this task's own now-stale
      code against the newly-adopted contract, not by anything inherited
      from the parent, so it is not treated as a new baseline (baseline_
      failures stays empty). Re-implemented pointer_routing.rs, mod.rs,
      input_translate.rs and tests.rs against the real
      term_core::terminal_core::MODE_MOUSE_*/MouseButtonId/MouseEventKind/
      MouseReportEncoding/compose_button_code/motion_gate contracts. After
      re-implementation: main build (cargo check) exit 0; main test command
      3389 passed, 0 failed, 3 ignored; core crate test command (cargo test
      --manifest-path crates/term_core/Cargo.toml --lib) 858 passed, 0
      failed, 13 ignored; CLI-only check (cargo check --no-default-features)
      exit 0. Inspection: `git status --porcelain` shows no file under a
      settings path touched, and `git diff | grep 'cfg(unix)\|cfg(windows)\
      |cfg(target_os'` finds nothing — confirming the "no settings field, no
      platform-conditional branch" half of this AC.
