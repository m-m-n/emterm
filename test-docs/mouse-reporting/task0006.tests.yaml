  AC-1:
    tests:
      - window_host::tests::pointer_routing_handlers_hold_no_decision_only_delegate_to_the_seam
    red_confirmed: true
    red_reason: >-
      This is the single retained source-scanning assertion (AC-5), re-aimed at
      AC-1's structural subject, against the CURRENT (post task0005-merge,
      post-rewrite) pointer_routing.rs. Confirmed red by temporarily inserting
