      mouse_report::motion_gate(` directly above `handle_pointer_moved`'s
      signature and re-running this test: it failed with "pointer_routing.rs
      must not call `mouse_report::motion_gate(` directly (AC-1) — every
      decision primitive runs exclusively inside mouse_report::decide_button_
      event / decide_motion_event / decide_wheel_event (task0005's SC-10)".
      Reverted immediately after observing the failure; a `grep -rn "TEMP
      MUTATION"` afterward found nothing and the full suite reproduced the
      same 3415/0/3 result. The other three forbidden markers
      (compose_button_code, encode_report, point_belongs_to_grid) use the
      identical `!src.contains(forbidden)` mechanism just exercised, as do the
      four required-marker and four required-delegate checks in the same
      test (identical `src.contains(marker)` mechanism, exercised indirectly:
      the current file genuinely contains `run_button_decision`, all four
      handler signatures and all four delegate calls — removing any one would
      fail the corresponding assertion by the same string-search logic) — not
      independently re-mutated in this pass to avoid repeatedly editing real
      call sites; the one direct mutation above establishes the scanning
      mechanism itself is live against the current file, not vacuously true.
  AC-2:
    tests: []
    red_confirmed: false
    red_reason: >-
      Untestable without a winit window / GPU surface / live PTY, which the
      task's Test Notes and Boundary both exclude from this task's test
      surface ("keep every new test free of a winit window, a GPU surface and
      a live PTY"): the perform step's tab dispatch
      (`for (tab_id, bytes) in dest { if let Some(tab) = app.tabs.get(tab_id)
      { tab.write_input(bytes); } }` in pointer_routing.rs) requires a real
      `App`/`Tab` with a live PTY to observe bytes actually reaching a tab.
      What IS covered: (1) that the outcome names the correct bytes and
      target tab is task0005's contract, exercised by their
      ac1_report_disposition_carries_bytes_and_target_tab /
      ac2_applier_appends_report_bytes_with_tab_and_applies_updates_once /
      ac6_ts23_release_after_active_tab_change_targets_the_tab_the_press_recorded
      (inherited, not authored by this task); (2) `tab.write_input` itself is
      untouched by this task (confirmed via `grep -rn "fn write_input"` —
      defined in tabs/input.rs, outside this task's file scope, not present
      in the task0006 diff) — "no new channel and no new transport state"
      holds by absence of change, not by a fresh assertion; (3) "a reported
      wheel notch leaves the scrollback offset untouched" holds by
      construction: `WheelEventInputs`/`decide_wheel_event` take no
      scroll-state parameter, so a `Disposition::Report` cannot name a
      scrollback mutation — only `LocalArm::ScrollScrollback` reaches the
      scrollback helpers, and AC-1's structural test already requires that
      arm be performed through the handler rather than decided inline. Left
      unconfirmed; reported in the final handback's `unconfirmed_reds`.
  AC-3:
    tests:
      - window_host::tests::focus_loss_clear_all_empties_gesture_and_held_records_so_the_next_decision_starts_fresh
    red_confirmed: true
    red_reason: >-
      Per the Test Notes ("AC-3 is testable at the record level: drive the
      clear-all the focus-loss path invokes and assert both records are
      empty, then assert the next decision is taken from empty records"):
      this test calls `mouse_report::clear_all` — the exact function
      `event_loop.rs`'s `WindowEvent::Focused(false)` arm invokes on
      `host.mouse_report_gesture_owner` / `host.mouse_report_held` alongside
      the existing `host.pointer_buttons_down = 0;` line — on a populated
      `GestureOwnership`/`HeldButtons` pair, asserts both are empty
      afterward, then feeds a `Release` with no matching press through
      `decide_button_event` against those now-empty records and asserts
      `Disposition::Nothing`. Confirmed red by temporarily commenting out the
      `clear_all(&mut gesture, &mut held);` call in the test body and
      re-running it: failed with "assertion `left == right` failed: focus
      loss must clear the gesture-ownership record (AC-3) / left:
      Some(Report) / right: None". Reverted immediately after observing the
      failure; the full suite was re-run afterward and reproduced 3415/0/3.
      The call site itself in `event_loop.rs` (`WindowEvent::Focused(false)`)
      cannot be driven in a test without a winit window, matching the Test
      Notes; it is visible in the diff alongside the existing
      `pointer_buttons_down = 0` zeroing it now sits next to.
  AC-4:
    tests:
      - window_host::tests::mouse_input_press_guard_queries_shared_sidebar_hit_region_before_selection_start
      - window_host::tests::press_and_wheel_guards_share_the_same_sidebar_hit_region_helper
      - window_host::tests::mouse_wheel_handler_routes_sidebar_hits_to_egui_before_the_terminal_scroll_path
      - window_host::tests::pointer_moved_hover_feed_shares_the_same_sidebar_hit_region_helper
      - window_host::tests::fr1_wheel_up_in_alt_screen_emits_three_arrow_up
      - window_host::tests::fr1_wheel_down_in_alt_screen_emits_three_arrow_down
      - window_host::tests::fr1_wheel_scales_with_notches
      - window_host::tests::fr1_wheel_suppressed_when_setting_off
      - window_host::tests::fr1_wheel_suppressed_when_mode_bit_off
      - window_host::tests::fr1_wheel_inert_outside_alt_screen
      - window_host::tests::fr1_wheel_sub_notch_pixel_delta_is_noop
      - window_host::tests::wheel_consumer_tracking_inactive_reproduces_todays_matrix_ignoring_shift
    red_confirmed: true
    red_reason: >-
      This is the regression guard the Test Notes name ("the existing tests
      for those paths must keep passing unmodified; changing one of them to
      accommodate the reduction is a plan deviation to report"), so its red
      evidence is a genuine, if unplanned, episode rather than a staged
      mutation: the first rewrite pass of `handle_pointer_button` deleted the
      standalone top-strip / bottom-strip-scrollbar-sidebar / profile-selector
      chrome guards, reasoning they were subsumed by SC-8 inside
      `decide_button_event`. Running the suite immediately after showed 2
      failures — `mouse_input_press_guard_queries_shared_sidebar_hit_region_
      before_selection_start` and `press_and_wheel_guards_share_the_same_
      sidebar_hit_region_helper` — both real, both against my own change, not
      staged. Per the task plan's own Boundary ("the existing chrome guards
      ... are not rewritten — they are inputs the gather step reads"), the
      fix was to restore the guards exactly as they were (never to touch the
      tests): PRESS events fall through the guards before reaching SC-10,
      RELEASE events are decided by SC-10 and return before the guards
      (D12's release fix). Restoring the guards took both tests back to
      green; a stale literal in
      mouse_input_press_guard_queries_shared_sidebar_hit_region_before_
      selection_start (`"(MouseButton::Left, ElementState::Pressed) => {"`,
      a match arm the rewrite's `LocalArm`-based dispatch no longer has) then
      needed its search target updated to `"LocalArm::BeginSelectionDrag"` —
      same ordering property (sidebar guard before selection-start), adapted
      literal, not a new assertion or a weakened one. The four wheel-matrix
      tests (fr1_wheel_* / wheel_consumer_tracking_inactive_reproduces_
      todays_matrix_ignoring_shift) exercise `alternate_scroll_wheel_bytes` /
      `accumulate_alt_scroll_lines` / `wheel_consumer` directly — none of
      those functions are touched by this task (confirmed unchanged against
      the task0005-integration diff) and none went red at any point; they
      are listed as the unmodified half of this regression guard, not as
      freshly-red evidence. `mouse_wheel_handler_routes_sidebar_hits_to_egui_
      before_the_terminal_scroll_path` and `pointer_moved_hover_feed_shares_
      the_same_sidebar_hit_region_helper` likewise never went red during this
      task's rewrite.
