    red_confirmed: true
    red_reason: >-
      Before editing, SPEC.md's TS-4 row said the cited test "exercises the
      focus-loss cleanup entry point"; VERIFICATION.md's TS-4 row said it was
      "exercising the focus-loss path with a live drag and a materialized
      selection" — both confirmed present by reading the original rows prior
      to any edit. After the rewrite, neither row (nor SC-C) makes any of
      the forbidden claims; confirmed by grep for "entry point",
      "materialized", and "exercis.*focus-loss" against both files.
  AC-2:
    tests: []
    red_confirmed: true
    red_reason: >-
      Before editing, none of the three rows stated that the cited test
      composes the window-free state core and the recording sink the way
      the adapter composes them, or that it constructs no window host and
      resolves no selection — confirmed absent by reading the originals.
      Read `src-tauri/src/window_host/tests.rs:4632-4668`
      (`focus_loss_cleanup_publishes_selection_without_a_window`) directly
      to confirm the test itself matches this description (plain
      `resolved_text` value, no `WindowHost` constructed) before writing the
      corrected wording.
  AC-3:
    tests: []
    red_confirmed: true
    red_reason: >-
      Before editing, none of the three rows mentioned that
      `publish_local_drag`'s own gather-and-adapt wiring is covered only by
      the source-scanning test's call-site literals — confirmed absent by
      reading the originals. Read
      `src-tauri/src/window_host/tests.rs:1935-1953`
      (`focus_loss_arm_never_calls_the_fold_click_toggle`) directly and
      confirmed it checks `event_loop_src.contains("publish_local_drag(host,
