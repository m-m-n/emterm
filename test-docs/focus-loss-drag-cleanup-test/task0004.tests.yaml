    red_confirmed: true
    red_reason: >-
      Before editing, the SPEC.md TS-4 row carried `- [ ]` with no reason
      sentence for that state, violating the requirement that the row state
      which was chosen and why. After editing, the row carries `- [x]` with
      a one-line reason ("the reworded claim below is met by the tests as
      they stand, confirmed by reading
      src-tauri/src/window_host/tests.rs directly"), decided because direct
      reading of the cited tests (see AC-2/AC-3 above) confirms the
