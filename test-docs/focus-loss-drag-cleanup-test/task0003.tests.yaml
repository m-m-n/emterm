acceptance_tests:
  AC-1:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: false
    red_reason: >-
      Structural criterion (absence of a compile-time-decidable-literal
      branch condition), verified by inspection rather than a discrete red
      observation: the rewritten test's publish step now scrutinizes
      `resolved_text`, a `let resolved_text: Option<&str> = None;` local
      binding, instead of the inline literal `None::<&str>` the prior
      version matched directly. Confirmed by reading the diff
      (`git diff -- src-tauri/src/window_host/tests.rs`) and by grepping
      the test body for `None::<&str>` (no match after the edit). AC-3's
      mutation below is the closest analogue to a red observation for a
      criterion shaped like this, and demonstrates the rewritten branch's
      assertions have force.
  AC-2:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: true
    red_reason: >-
      Confirmed via AC-3's mutation (same test, same run): with
      `selection_publish_targets`'s no-selection early-return arm
      temporarily altered to `SelectionPublishTargets { primary: true,
      clipboard: false }`, this test's
      `assert_eq!(targets, SelectionPublishTargets { primary: false,
      clipboard: false }, "AC-2: ...")` failed with "assertion `left ==
      right` failed: AC-2: a no-selection termination selects neither
      destination (FR6)\n  left: SelectionPublishTargets { primary: true,
      clipboard: false }\n right: SelectionPublishTargets { primary:
      false, clipboard: false }". Reverted the mutation, re-ran, passed.
      See AC-3 for the full command transcript.
  AC-3:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: true
    red_reason: >-
      Deliberate mutation check per Test Notes; never committed. Altered
      `selection_publish_targets`'s early-return arm in
      src-tauri/src/window_host/pointer_routing.rs from
      `SelectionPublishTargets { primary: false, clipboard: false }` to
      `SelectionPublishTargets { primary: true, clipboard: false }`. Ran
      `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path
      src-tauri/Cargo.toml --lib -- window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing`
      — observed FAILED (1 failed) with the assertion-mismatch message
      quoted under AC-2. Reverted the mutation
      (restored the original arm), re-ran the identical command —
      observed ok (1 passed). `git diff --stat -- src-tauri/src/window_host/pointer_routing.rs`
      after the revert showed no changes, confirming the mutation was
      never committed.
