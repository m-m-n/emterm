task_id: task0005
# Origin (AC-6): this task closes verify's failed item TS-10 (category
# `comprehensive`) and unresolved review finding `2a1ad49b9263cb95`
# (review round 2, MEDIUM, src-tauri/src/window_host/tests.rs), both
# pointing at focus_loss_cleanup_with_no_selection_publishes_nothing's
# publish call being gated by a dead branch so `publish_to_targets`'s
# no-PRIMARY path had no test anywhere in the suite. This task closes
# that one defect at that one site by making the publish call
# unconditional and proving it with two mutations (AC-3, AC-4). It does
# NOT close any other item TS-10 or the round-2 review might reference
# elsewhere; no other test, no other file, and no production behaviour
# is in scope (see the task plan's Out of Scope).
#
# baseline_failures/final_failures reflect
# `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path
# src-tauri/Cargo.toml` (project_commands.test, verbatim), run in this
# worktree BEFORE any edit and again AFTER. Both runs fail to compile at
# examples/swash_emoji.rs (missing src-tauri/assets/fonts/NotoColorEmoji.ttf)
# — the same pre-existing, unrelated environment gap
# test-docs/focus-loss-drag-cleanup-test/task0001.tests.yaml,
# task0002.tests.yaml and task0003.tests.yaml already record; out of this
# task's scope (see Out of Scope). Note on this worktree specifically:
# the very first run of this command (before that font gap was even
# reached) failed earlier, at the build script, because this worktree's
# assets/fonts/ directory had none of the seven fonts
# scripts/fetch-fonts.sh normally provides (a fresh worktree that had
# never had `make setup` / `fetch-fonts` run in it). `bash
# scripts/fetch-fonts.sh` was run once to fetch those seven pinned,
# gitignored, HTTPS+SHA256-verified fonts — the same idempotent step
# `make setup` performs — before any baseline was recorded; this is
# project-standard environment setup, not a source or doc change, and
# NotoColorEmoji.ttf (the one font this feature's Out of Scope forbids
# fetching) is not among the seven `fetch-fonts.sh` provides. The
# library test target (`--lib -- --test-threads=1`, the command AC-7
# names) ran to completion both before and after this task's edit: 3486
# passed, 0 failed, 3 ignored in both runs (the corrected test body
# replaces the prior one in place, so the count is unchanged; see AC-7).
baseline_failures:
  - "BUILD: cargo test (default features) fails to compile — examples/swash_emoji.rs: couldn't read src-tauri/examples/../assets/fonts/NotoColorEmoji.ttf: No such file or directory (pre-existing, unrelated to this task; same blocker task0001/task0002/task0003.tests.yaml record; verified present before any edit)"
final_failures:
  - "BUILD: cargo test (default features) fails to compile — examples/swash_emoji.rs: couldn't read src-tauri/examples/../assets/fonts/NotoColorEmoji.ttf: No such file or directory (unchanged after this task's edit; re-run reproduced the identical error)"
acceptance_tests:
  AC-1:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: false
    red_reason: >-
      Structural criterion (the direct destination assertion is
      unchanged): confirmed by reading the diff
      (`git diff -- src-tauri/src/window_host/tests.rs`), which shows
      `assert_eq!(targets, SelectionPublishTargets { primary: false,
      clipboard: false }, "AC-2: ...")` untouched byte-for-byte from the
      pre-task0005 version. This assertion is not new behaviour this
      task introduces, so there is no fresh red to observe on it in
      isolation; its force is what AC-4's mutation below demonstrates
      (altering `selection_publish_targets`'s no-selection arm to select
      PRIMARY makes this exact assertion fail).
  AC-2:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: true
    red_reason: >-
      Confirmed by an explicit before/after pair, not just inspection.
      BEFORE this task's edit (test body still wrapped the publish call
      in `if let Some(text) = resolved_text { ... }`): temporarily
      stashed this task's tests.rs change
      (`git stash push -- src-tauri/src/window_host/tests.rs`), deleted
      the `if targets.primary` guard in `publish_to_targets`
      (src-tauri/src/window_host/pointer_routing.rs), ran
      `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path
      src-tauri/Cargo.toml --lib -- --test-threads=1
      window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing`
      — observed `test ... ok` (1 passed): the pre-task0005 test could
      NOT detect the mutation, exactly the TS-10 gap. Reverted the
      pointer_routing.rs mutation, `git diff --stat` confirmed clean,
      then `git stash pop` restored this task's tests.rs change. AFTER
      this task's edit (publish call unconditional, no branch), the
      identical mutation-and-run sequence FAILS on the sink-emptiness
      assertion instead — see AC-3 for that transcript. This before/after
      pair is the direct evidence that removing the wrapper (AC-2) is
      what gives the closing assertion force, not the resolved_text
      binding by itself.
  AC-3:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: true
    red_reason: >-
      Deliberate mutation per Test Notes; never committed. Deleted the
      `if targets.primary` guard in `publish_to_targets`
      (src-tauri/src/window_host/pointer_routing.rs), changing
      `if targets.primary { sink.write_selection(SelectionDestination::Primary, text); }`
      to an unconditional `sink.write_selection(SelectionDestination::Primary, text);`.
      Ran `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path
      src-tauri/Cargo.toml --lib -- --test-threads=1
      window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing`
      — observed FAILED (1 failed), panic message: "thread
      'window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing'
      panicked at src-tauri/src/window_host/tests.rs:4708:5: no selection
      must publish to neither destination" — i.e. the closing
      sink-emptiness assertion, NOT the destination assertion (which sits
      earlier in the same test and did not fire). Reverted the mutation
      (restored the `if targets.primary` guard), re-ran the identical
      command — observed `ok` (1 passed).
      `git diff --stat -- src-tauri/src/window_host/pointer_routing.rs`
      after the revert showed no changes, confirming the mutation was
      never committed.
  AC-4:
    tests:
      - window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing
    red_confirmed: true
    red_reason: >-
      Deliberate mutation per Test Notes; never committed (reconfirms
      task0003 AC-3's finding against the corrected test body). Altered
      `selection_publish_targets`'s early-return arm in
      src-tauri/src/window_host/pointer_routing.rs from
      `SelectionPublishTargets { primary: false, clipboard: false }` to
      `SelectionPublishTargets { primary: true, clipboard: false }`. Ran
      `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path
      src-tauri/Cargo.toml --lib -- --test-threads=1
      window_host::tests::focus_loss_cleanup_with_no_selection_publishes_nothing`
      — observed FAILED (1 failed), panic message: "thread
      '...' panicked at src-tauri/src/window_host/tests.rs:4697:5:
      assertion `left == right` failed: AC-2: a no-selection termination
      selects neither destination (FR6)\n  left:
      SelectionPublishTargets { primary: true, clipboard: false }\n
      right: SelectionPublishTargets { primary: false, clipboard: false
      }" — the direct destination assertion, not the sink-emptiness
      assertion. Reverted the mutation (restored the original arm),
      re-ran the identical command — observed `ok` (1 passed).
      `git diff --stat -- src-tauri/src/window_host/pointer_routing.rs`
      after the revert showed no changes, confirming the mutation was
      never committed.
