# This task has no source or test changes (document-correction task; see
# task plan's Test Notes: "There is no automated test for this task: both
# deliverables are document corrections, so verification is by inspection
# of the two files"). baseline_failures reflects the state of
# `CARGO_TARGET_DIR=src-tauri/target cargo test --manifest-path
# src-tauri/Cargo.toml` in this worktree BEFORE any edit: the whole command
# fails to compile because `src-tauri/examples/swash_emoji.rs` (required-
# features = ["gui"], built by a plain `cargo test`) include_bytes!'s
# `assets/fonts/NotoColorEmoji.ttf`, which is absent from this worktree and
# from the main tree alike (it is not one of the fonts scripts/fetch-fonts.sh
# fetches). This is a pre-existing, unrelated environment/repo gap: no
# individual test name can be extracted because the compile step never
# reaches the test binary. Since this task touches zero Rust source, the
# post-implementation run reproduces byte-for-byte the same compile error
# (final_failures == baseline_failures), so no regression was introduced.
baseline_failures:
  - "BUILD: cargo test (default features) fails to compile — examples/swash_emoji.rs: couldn't read src-tauri/examples/../assets/fonts/NotoColorEmoji.ttf: No such file or directory (pre-existing, unrelated to this task; verified present before any edit)"
final_failures:
  - "BUILD: cargo test (default features) fails to compile — examples/swash_emoji.rs: couldn't read src-tauri/examples/../assets/fonts/NotoColorEmoji.ttf: No such file or directory (unchanged after this task's doc-only edits; re-run reproduced the identical error)"
