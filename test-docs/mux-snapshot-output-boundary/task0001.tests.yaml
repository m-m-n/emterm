  AC-7:
    tests:
      - mux::ipc::pty_spawn::tests::stress_reader_with_concurrent_resize_and_snapshot_paths_completes_within_budget
    red_confirmed: false
    red_reason: >-
      This stress test currently passes against the implementation
      (~0.02s; well inside its 30s budget). Its purpose is regression
      detection for a deadlock, not a red-then-green TDD cycle:
      deliberately reintroducing a deadlock in the implementation to
      observe this test fail was judged too risky to attempt (a real
      deadlock has no bounded failure mode other than this test's own
      30s panic-on-timeout, and confirming it would mean deliberately
      risking a hang in a shared test binary). The panic-on-timeout path
      itself WAS exercised live during this test's own development: an
      earlier draft (which drained the output channel only after joining
      all worker threads, rather than concurrently) genuinely hit the
      30s timeout and panicked with the expected message — that was a
      self-inflicted test-harness bug (the pane's own `output_target`
      Arc, returned via `resize_handle.join()`, kept a `Sender` clone
      alive so channel-closure-based drain-completion never fired), not
      an implementation defect, but it demonstrates the panic path is
      live and reachable. Fixed by switching the drain thread to an
      explicit stop-flag protocol. The existing pre-task0001 regression
      tests this AC also names (the EOF G1 test
      `eof_branch_does_not_hold_output_target_across_blocking_send`,
      connection fairness/starvation tests) all pass unmodified in the
      full suite.
