acceptance_tests:
  AC-1:
    tests:
      - mux::ipc::pty_spawn::tests::on_demand_snapshot_shaped_suppression_matches_a_reference_and_redelivers_the_query
    red_confirmed: true
    red_reason: >-
      Confirmed via targeted mutation: temporarily forced both
      `boundary.is_covered(&s, chunk_number)` call sites in
      pty_spawn/mod.rs's reader forward-decision to `false && ...` (the
      reader never treats a chunk as covered), reran this test, and it
      failed at tests.rs:1402 ("the paused chunk's raw bytes must never
      reach the destination after the snapshot") because the paused
      chunk's raw bytes then DID reach the destination after the
      snapshot. Reverted immediately after confirming; full suite
      reconfirmed green. Scope gap: AC-1 names three paths (visible
      reattach, resume_pane_with_permit, on-demand snapshot); only the
      on-demand-snapshot-shaped path got a dedicated new reader-level
      test this session. The other two paths' D3/D9 boundary-recording
      logic (output_target.rs, reattach.rs) was verified correct by
      direct code reading in the prior (pre-compaction) session, and
      both share the exact same reader-side suppression mechanism this
      test exercises, but that is not a dedicated red-confirmed test per
      path as the criterion's "Pre-change failure: each of the three
      tests fails" literally asks for.
  AC-2:
    tests:
      - mux::ipc::pty_spawn::tests::output_sequence_numbers_increment_once_per_non_empty_read_including_alt_screen_only_chunks
      - mux::ipc::pty_spawn::tests::snapshot_style_captured_read_waits_for_the_capture_step_to_finish
      - mux::session::pane::tests::test_resize_and_a_concurrent_captured_read_are_mutually_excluded
      - mux::session::pane::output_capture::tests::capture_assigns_sequential_numbers_starting_at_one
      - mux::session::pane::output_capture::tests::captured_read_does_not_advance_the_number
    red_confirmed: true
    red_reason: >-
      Confirmed via targeted mutation: temporarily commented out
      `*last += 1;` inside `OutputCapture::capture` (output_capture.rs).
      Reran the first two pty_spawn tests plus the pre-existing
      `capture_assigns_sequential_numbers_starting_at_one` unit test —
      all three failed with the captured number stuck at 0 instead of
      1/2/3. Reverted immediately after confirming.
      `test_resize_and_a_concurrent_captured_read_are_mutually_excluded`
      was NOT independently red-confirmed via mutation this session —
      mutual exclusion here is a structural property of `capture()` and
      `captured_read()` sharing one `std::sync::Mutex`, and reverting
      that sharing would require restructuring the exclusion's own field
      layout rather than a small, safely-reversible change; verified
      correct by code reading instead (mirrors the pre-existing,
      similarly-unconfirmed `test_resize_holds_scrollback_lock_...`
      pattern already in this file). No dedicated new test exists this
      session for "a chunk that triggers a shadow panic-reset still gets
      a number" — `capture()`'s number increment is unconditional
      regardless of what its `step` closure does internally (the
      pre-existing `catch_unwind` panic recovery lives INSIDE that
      closure), so this is a structural guarantee verified by code
      reading, not a dedicated test; manufacturing a real vt100-panicking
      byte sequence was judged disproportionate to the value added.
