# Reds: the tests were written first and run on the unchanged tree. AC-1, AC-2, AC-3 and AC-5 do
# not call the new function, so they failed on the pre-task code of the two vt100 hand-offs.
# AC-4's table test and the unmodified-input test were run against an identity stub of the
# function (the stub was removed before the implementation); AC-6 was observed failing at
# compile time with no function present.
acceptance_tests:
  AC-1:
    tests:
      - mux::ipc::handlers::tests::render_pane_tail_renders_the_text_after_a_closed_csi_parameter
    red_confirmed: true
    red_reason: >-
      Observed failing on the pre-task code: render_pane_tail of ESC [ 6 DEL H e l l o CR LF
      returned "\n\n\n\nello" where "Hello" is expected (vt100 ignored the DEL, so H became the
      cursor-position final byte and "ello" was written on the last row).
  AC-2:
    tests:
      - mux::ipc::handlers::tests::render_pane_tail_renders_the_text_after_a_closed_lone_escape
    red_confirmed: true
    red_reason: >-
      Observed failing on the pre-task code: render_pane_tail of ESC DEL H e l l o CR LF returned
      "ello" where "Hello" is expected (vt100 ignored the DEL, so H became the final byte of the
      escape).
  AC-3:
    tests:
      - mux::session::pane::tests::from_restored_replays_a_closed_csi_into_the_shadow_and_keeps_the_ring_bytes
    red_confirmed: true
    red_reason: >-
      Observed failing on the pre-task code: row 0 of the shadow screen was "" where "Hello" is
      expected (the cursor-position final moved the text off row 0). The ring assertion
      (read_all equals the input including 0x7F) is the NFR1 guard and held before and after.
  AC-4:
    tests:
      - mux::scrollback_filter::tests::vt100_replay_copy_replaces_del_by_the_scan_state_just_before_it
      - mux::scrollback_filter::tests::vt100_replay_copy_leaves_the_input_unmodified
    red_confirmed: true
    red_reason: >-
      Observed failing against an identity stub of vt100_replay_copy: the table row ESC [ DEL
      returned [27, 91, 127] where [27, 91, 24] is expected, and the unmodified-input test failed
      "the copy differs from the input at the DEL". With no function at all, both fail to compile
      (cannot find function `vt100_replay_copy`).
  AC-5:
    tests:
      - mux::ipc::handlers::tests::render_pane_tail_renders_the_text_after_a_strip_written_query_closing
    red_confirmed: true
    red_reason: >-
      Observed failing on the pre-task code: the strip output (ESC [ 6, then n H e l l o CR LF
      with the carried state, containing 0x7F in place of n) rendered through render_pane_tail
      as "\n\n\n\nello" where "Hello" is expected. The assertion that the concatenated strip
      output contains 0x7F passed, so the D2 closing was produced.
  AC-6:
    tests:
      - mux::scrollback_filter::tests::vt100_replay_copy_is_total_and_changes_only_del_into_can
    red_confirmed: true
    red_reason: >-
      Observed failing at compile time with no implementation: error[E0425] cannot find function
      `vt100_replay_copy` in this scope (scrollback_filter/tests.rs). The sweep asserts only the
      bound (no panic, equal length, an output byte differs from the input only as CAN at a DEL),
