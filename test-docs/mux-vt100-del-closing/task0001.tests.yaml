    red_reason: >-
      A dedicated new module is out of scope: AC-7 is a no-regression and build criterion, and the
      existing tests detect the behaviors it protects (strip_concat_a_cut_clears_the_carried_classification
      and build_snapshot_bytes_segments_follow_a_construct_removed_inside_an_open_csi pin the DEL
