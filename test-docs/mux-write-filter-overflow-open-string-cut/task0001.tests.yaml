acceptance_tests:
  AC-1:
    tests:
      - mux::scrollback_filter::tests::post_strip_state_form_reports_the_csi_state_of_the_written_bytes
      - mux::scrollback_filter::tests::post_strip_string_body_states_agree_with_term_core_on_every_short_string
      - mux::scrollback_filter::tests::post_strip_state_form_output_equals_the_write_path_strip
      - mux::scrollback_filter::tests::escape_carry_the_end_state_oracle_classifies_the_reference_streams
    red_confirmed: true
    red_reason: >-
      Observed with the two body states added to the enum but the strip not yet advancing into
      them: post_strip_state_form_reports_the_csi_state_of_the_written_bytes failed at 'state
      Ground, designator false, input "\u{1b}]": reported state' (reported Ground, the open OSC body
      expected); post_strip_string_body_states_agree_with_term_core_on_every_short_string failed at
      'end state of [27, 27, 27, 93]' (reported Ground, the oracle says the open OSC body). Each
      stops at its first failing assertion, so the later rows (DCS / APC bodies, BEL, the held
      Escape, the carried-in body state across removed constructs) were not observed red on their
      own. The other two tests were green before the change and stay green: the output-equals-the-
      write-path-strip test pins that the strip's output never reads the carried state (NFR2), and
      the oracle reference-table test pins that the existing reference streams keep their
      classification.
  AC-2:
    tests:
      - mux::ipc::pty_spawn::tests::overflow_open_string_cut::overflow_open_string_cut_the_fallback_closing_after_a_held_esc_writes_esc_can
