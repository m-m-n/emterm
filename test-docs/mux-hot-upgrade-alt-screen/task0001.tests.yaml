# NOTE on baseline/final_failures: this repo's `tabs::tests::*` off-thread
# replay-worker suite is documented as non-deterministic under this project's
# own test-execution conventions (project memory:
# "tabs.rs replay テストは並列で非決定的に落ちる"). Confirmed independently
# here: 4 full `cargo test --lib` runs (1 pre-implementation baseline + 3
# post-implementation) each failed a DIFFERENT ~20-test subset of the same
# `tabs::tests::*` pool, every failure panicking at one of exactly two sites
# ("off-thread replay worker did not complete in time" at tabs.rs:3476, or
# the `tab.mux_group.is_none()` assertion at tabs.rs:4895). This task's diff
# touches ONLY src-tauri/src/mux/identity.rs (`git diff --stat` confirms);
# `mux::identity::tests::*` (50 tests) was green in every run with zero
# flakiness. baseline_failures below is the literal run recorded in step 4a;
# final_failures is the literal final run. The set difference between them is
# membership churn within the same pre-existing flaky tabs.rs cluster, not a
# regression caused by this task -- see the implementer's report `notes` for
# the full run-by-run evidence.

