acceptance_tests:
  AC-1:
    tests:
      - handoff::tests::test_handoff_schema_version_is_3_with_supported_range_1_to_3
      - handoff::tests::test_alt_screen_flag_and_dump_round_trip_byte_for_byte
      - handoff::tests::test_handoff_document_round_trips_with_full_tree
    red_confirmed: false
    red_reason: >-
      Not observed as a genuine red-then-green: the two new HandoffPane
      fields, the version-2/version-3 struct freeze, and these tests were
      authored together in one edit to crates/mux_ipc/src/handoff.rs before
      the first compile, because a field added to HandoffPane forces every
      construction site in the same file to update simultaneously just to
      keep the crate compiling (an isolated "add tests against the old
      2-field-short shape and watch them fail" step was not taken). The
      criterion's behavior is genuinely new (schema version 3 did not exist
      before this task), so this is a process gap, not a criterion with no
      observable change.
  AC-2:
    tests:
      - handoff::tests::test_decode_handoff_document_upgrades_v2_document_with_no_alt_screen_state
      - handoff::tests::test_decode_handoff_document_upgrades_v1_document_with_disarmed_latch
    red_confirmed: false
    red_reason: >-
      Same reason as AC-1: the HandoffPaneV2 freeze, the V1->V2->current
      conversion chain, and these tests were authored together before the
      first compile.
  AC-3:
    tests:
      - mux::session::pane::tests::capture_alt_state_on_alt_screen_pane_returns_true_and_the_formatted_alt_contents
      - mux::session::pane::tests::capture_alt_state_on_main_buffer_pane_returns_false_and_empty_dump
      - mux::upgrade::tests::snapshot_records_alt_screen_state_for_an_alt_screen_pane
      - mux::upgrade::tests::snapshot_records_no_alt_screen_state_for_an_exited_pane
    red_confirmed: false
    red_reason: >-
      `MuxPane::capture_alt_state` did not exist before this task; these
      tests call it directly, so they were authored alongside the method
      itself rather than against a pre-existing (failing) call site.
  AC-4:
    tests:
      - mux::upgrade::tests::refresh_live_agent_state_pulls_in_alt_screen_entered_after_snapshot
      - mux::upgrade::tests::refresh_live_agent_state_pulls_in_alt_screen_left_after_snapshot
    red_confirmed: false
    red_reason: >-
      `refresh_live_agent_state`'s alt-state re-capture and these tests
      were authored together; the pre-task0002 function had no alt fields
      to assert on at all.
  AC-5:
    tests:
      - mux::session::pane::tests::from_restored_with_alt_screen_true_replays_dump_with_scrollback_beneath
      - mux::upgrade::tests::snapshot_then_restore_round_trips_alt_screen_state
    red_confirmed: false
    red_reason: >-
      `MuxPane::from_restored`'s two new parameters (`alt_screen`,
      `alt_screen_dump`) and the replay logic that consumes them were added
      in the same edit as these tests; the pre-task0002 signature could not
      even compile a call site passing them.
  AC-6:
    tests:
      - mux::session::pane::tests::from_restored_sets_attributes_and_scrollback_verbatim
      - mux::session::pane::tests::from_restored_with_alt_screen_true_and_empty_dump_yields_blank_active_alt_screen
    red_confirmed: false
    red_reason: >-
      The `alt_screen=false` byte-identical-to-today half of this criterion
      is a refactor-shaped assertion added onto a pre-existing test
      (`from_restored_sets_attributes_and_scrollback_verbatim` already
      passed before this task for its original assertions); the new
      `alternate_screen()` assertion added to it, and the dedicated
      empty-dump test, both depend on the new `from_restored` parameters
      authored in the same edit — same reason as AC-5.
  AC-7:
    tests:
      - mux::session::pane::tests::cap_alt_screen_dump_returns_the_dump_untouched_at_the_cap
      - mux::session::pane::tests::cap_alt_screen_dump_returns_empty_when_the_dump_exceeds_the_cap
    red_confirmed: false
    red_reason: >-
      `cap_alt_screen_dump` did not exist before this task; both tests call
      it directly and were authored alongside its implementation.
