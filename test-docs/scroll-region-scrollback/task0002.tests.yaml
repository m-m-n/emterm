deviations:
  - file: crates/term_core/src/snapshot.rs
    reason: >-
      Adding the pub(crate) scroll_region_scrollback_enabled field to
      TerminalCore's exhaustive struct literal broke two other exhaustive
      constructors outside the declared file scope (TerminalCore::from_snapshot
      V2 and the V1 legacy restore path). Both seed the field to `true`
      (fresh factory default), consistent with IMPLEMENTATION.md D5's
      documented known limitation that the off-thread snapshot-replay path
      does not carry this member across.
  - file: src-tauri/src/settings/tests.rs
    reason: >-
      AC-2's unit test ("assert both directions: key present, key absent")
      naturally belongs beside the existing window_sidebar_overlay loader
      tests in this file, which is wired via `#[cfg(test)] mod tests;` in
      src-tauri/src/settings/mod.rs. The task plan's Files to Modify listed
      only mod.rs and raw.rs for this module; this test file was not listed
      but is the only place `RawSettings::merge_into`'s behavior is unit
      tested in this codebase.
