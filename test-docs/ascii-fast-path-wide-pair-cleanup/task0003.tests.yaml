      surrounding sentence ("It is reached from exactly these call
      sites, and no others:") is unchanged.
  AC-4:
    tests: []
    red_confirmed: false
    red_reason: >-
      `git diff -- crates/term_core/src/terminal_cells.rs` confirms the
      change touches only the doc comment lines on blank_wide_pair_half
