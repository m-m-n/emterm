      pre-fix bound (24) so bypass_split stayed false and the whole non-bypass
      drain ran.
  AC-2:
    tests: [terminal_core::tests::measured_26_segment_middle_cluster_engages_the_split_and_matches_reference]
    red_confirmed: true
    red_reason: >-
      Same test function as AC-1 (a single test covers both criteria, per the
      file's existing precedent for this shape family). Pre-fix, the AC-1
      assertion (split must engage) panicked first, so the AC-2 equivalence
      assertions below it (grid_fingerprint / evicted_total match against
      build_scrollback_only_from_snapshot) never ran — direct evidence the
      shape never took the bypass path pre-fix, which is exactly what AC-2's
      equivalence claim depends on being exercised.
  AC-3:
