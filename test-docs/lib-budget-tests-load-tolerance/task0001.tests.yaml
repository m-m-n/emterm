    red_confirmed: true
    red_reason: >-
      With the zero stub the test failed: "the quadratic surrogate was judged within: thread CPU
      time 0ns against the budget 100ms". The judgment's boundary (strictly below the budget is
      within) and the verdict message are also covered by the tests
      the_judgment_is_within_exactly_when_the_total_is_strictly_below_the_budget and
      the_verdict_message_shows_the_total_and_the_budget in the same module; those are pure and
      were green from the start.
  AC-6:
    tests:
      - mux::ipc::pty_spawn::tests::strip_concat_query::strip_concat_alternations_and_chains_finish_within_the_budget
      - mux::ipc::pty_spawn::tests::thread_cpu_time::tests::the_meter_counts_only_the_measured_calls_and_returns_their_result_unchanged
    red_confirmed: true
    red_reason: >-
      The budget part of the criterion was observed to fail before the implementation: the named
      test failed in the Step 4a baseline run with its wall-clock budget ("took
      10.120477442s"). That failure depends on machine load and is not deterministic. The
      structural parts (no wall clock read in the test, only the listed calls summed through the
