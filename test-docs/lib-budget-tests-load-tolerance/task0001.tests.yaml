  AC-7:
    tests: []
    red_confirmed: true
    red_reason: >-
      The verifiable outcome is a build check. No existing test reads src-tauri/Cargo.toml (a
      search of src-tauri/tests, test/, ci-workflows.test.ts and src-tauri/src by the path and by
