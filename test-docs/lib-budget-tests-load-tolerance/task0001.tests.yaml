      - mux::ipc::pty_spawn::tests::thread_cpu_time::tests::thread_cpu_time_excludes_the_cpu_time_of_other_threads
    red_confirmed: true
    red_reason: >-
      With the zero stub the test failed: "the spawned thread reached 0ns of its own CPU time,
      not 200ms". With the wall-clock stub it failed: "the measuring thread's delta 200.372222ms
      while waiting in join is not below half of the spawned thread's 200.243661ms".
  AC-4:
    tests:
