    red_reason: >-
      With the status interpretation stubbed to do nothing both tests failed: "test did not panic
      as expected" and "a failure status did not panic". The second part of the criterion (no
      code path of the helper returns zero or a wall-clock reading on failure) has no executable
      check and is covered by review. The Windows branch of the status interpretation compiles
      in the Windows cross check and is not executed here.
  AC-5:
