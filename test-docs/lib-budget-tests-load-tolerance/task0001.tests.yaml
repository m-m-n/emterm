      With the clock reading stubbed to a wall-clock reading (time since first use) the test
      failed: "the CPU delta 300.06341ms across a 300ms sleep is not below 150ms". A stub that
      returns zero passes this test, so the red was taken with the wall-clock stub.
  AC-3:
