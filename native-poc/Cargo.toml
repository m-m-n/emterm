[package]
name = "emterm-native-poc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native terminal + Wry viewer hybrid PoC for eMterm restructuring"

[[bin]]
name = "emterm-native-poc"
path = "src/main.rs"

[dependencies]
# Window + event loop. Phase 4-G-2 redesign (2026-05-14) replaced
# tao 0.34 with winit 0.30.9. tao did not expose XKB keycodes, breaking
# self-built XIM; winit provides native IME via WindowEvent::Ime on
# X11 / Wayland / Windows. default-features=false drops Android/iOS;
# we keep rwh_06 (raw-window-handle 0.6) for wgpu surface integration
# and x11 + wayland for Linux platform support.
winit = { version = "0.30.9", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# GPU surface + egui rendering
wgpu = "22"
egui = "0.29"
egui-wgpu = "0.29"

# WebView for Markdown viewer (Phase 6) — matches workspace tauri 2.9.5 transitive
wry = "0.53"

# term_core (Phase 6: replaces native-poc's stand-in parser/grid)
term_core = { path = "../crates/term_core" }

# term_images (Phase 5: inline Kitty / SIXEL image decoders + APC/DCS parsers)
term_images = { path = "../crates/term_images" }

# mux_ipc (Phase 4-A): shared protocol types used by the legacy Tauri build
# and native-poc. Phase 4-C (APC redesign): native-poc consumes only the
# `protocol` module — APC payloads embedded in the PTY stream are decoded
# via `MuxMessage::from_apc` and applied to the active tab. The Unix socket
# segment of the protocol is owned by the legacy `emterm mux` bridge CLI
# (see `doc/tasks/mux-inband-protocol/SPEC.md`).
mux_ipc = { path = "../crates/mux_ipc" }

# PTY (Phase 2)
portable-pty = "0.8"

# Clipboard (Phase 4)
arboard = "3"

# OS notifications (Phase 6) — OSC 9. Linux uses D-Bus
# org.freedesktop.Notifications.
notify-rust = "4"

# Unicode (Phase 3)
unicode-width = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization (Phase 7)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
parking_lot = "0.12"
crossbeam-channel = "0.5"
pollster = "0.4"
raw-window-handle = "0.6"
bytes = "1"
base64 = "0.22"
once_cell = "1"

# Font rasterizer stack (Phase 4-H / font-swash-migration).
# swash is pinned at = 0.1.x per NFR3 (single-maintainer churn guard);
# zeno is its companion vector → bitmap rasterizer; fontdb enumerates the
# host font database and registers our bundled fonts as primary fallbacks.
swash = "=0.1.18"
zeno = "0.2"
fontdb = "0.21"

# ab_glyph is the legacy fallback rasterizer (FR5 escape hatch). It is
# already pulled in transitively through egui; the direct dep here pins
# the adapter against a known API surface.
ab_glyph = "0.2"

[dev-dependencies]
# PNG encoder used by examples/swash_emoji.rs (PoC PNG dump, FR1).
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Phase 4-G-1 redesign (2026-05-14): removed x11-dl / wayland-client /
# wayland-protocols / windows. The self-built XIM / zwp_text_input_v3 /
# IMM32 clients did not work in practice because tao 0.34 does not
# expose XKB keycodes; Phase 4-G-3 routes IME through winit instead.

# NOTE: dev/release profiles are managed at the workspace root Cargo.toml
# since Phase 6. Per-package profile sections produce warnings and are
# ignored by Cargo when a workspace root profile exists.
