[package]
name = "emterm-native-poc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native terminal + Wry viewer hybrid PoC for eMterm restructuring"

[[bin]]
name = "emterm-native-poc"
path = "src/main.rs"

[dependencies]
# Window + event loop (tao matches workspace tauri 2.9.5 transitive)
tao = "0.34"

# GPU surface + egui rendering
wgpu = "22"
egui = "0.29"
egui-wgpu = "0.29"

# WebView for Markdown viewer (Phase 6) — matches workspace tauri 2.9.5 transitive
wry = "0.53"

# term_core (Phase 6: replaces native-poc's stand-in parser/grid)
term_core = { path = "../crates/term_core" }

# term_images (Phase 5: inline Kitty / SIXEL image decoders + APC/DCS parsers)
term_images = { path = "../crates/term_images" }

# mux_ipc (Phase 4-A): shared protocol types used by the legacy Tauri build
# and native-poc. Phase 4-C (APC redesign): native-poc consumes only the
# `protocol` module — APC payloads embedded in the PTY stream are decoded
# via `MuxMessage::from_apc` and applied to the active tab. The Unix socket
# segment of the protocol is owned by the legacy `emterm mux` bridge CLI
# (see `doc/tasks/mux-inband-protocol/SPEC.md`).
mux_ipc = { path = "../crates/mux_ipc" }

# PTY (Phase 2)
portable-pty = "0.8"

# Clipboard (Phase 4)
arboard = "3"

# OS notifications (Phase 6) — OSC 9. Linux uses D-Bus
# org.freedesktop.Notifications.
notify-rust = "4"

# Unicode (Phase 3)
unicode-width = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization (Phase 7)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
parking_lot = "0.12"
crossbeam-channel = "0.5"
pollster = "0.4"
raw-window-handle = "0.6"
bytes = "1"
base64 = "0.22"
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Phase 4-G-B: XIM bindings (Linux X11 IME). Dynamic loading via x11-dl
# means a non-X11 host (pure Wayland with no Xlib runtime) does not fail
# at link time — the backend falls back to NullBackend at init() when
# the X server is unreachable.
# Phase 4-G-C: Wayland zwp_text_input_v3 bindings.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["unstable", "client"] }

# Phase 4-G-D: Windows IMM32 + window subclass for native IME.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Globalization",
] }

# NOTE: dev/release profiles are managed at the workspace root Cargo.toml
# since Phase 6. Per-package profile sections produce warnings and are
# ignored by Cargo when a workspace root profile exists.
