[package]
name = "emterm-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt: wasm-pack 0.12.x ships wasm-opt v111 which lacks
# --enable-bulk-memory support required by Rust 1.84+ wasm32 target.
# opt-level="z" + lto already handle size optimization.
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
