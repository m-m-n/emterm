[package]
name = "emterm-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WASM module for eMterm terminal emulator"
repository = "https://github.com/m-m-n/emterm"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bincode = "1.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt: bundled wasm-opt lacks --enable-bulk-memory support
# required by recent Rust wasm32 targets. opt-level="z" + lto already
# handle size optimization.
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
