[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/app_settings",
    "crates/term_core",
    "crates/term_images",
    "crates/mux_ipc",
]

# Workspace-level release profile. LTO benefits the native terminal
# release build (smaller binary, slightly better runtime).
[profile.release]
lto = true
