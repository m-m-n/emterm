<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eMterm Markdown Viewer</title>
    <style>
      /* The viewer page does not load web-shared/styles.css, so the MD3 system
         tokens the front matter block (frontmatter.css, no color fallbacks)
         references are provided here. Values mirror the dark-theme --md-sys-*
         tokens in web-shared/styles.css :root. */
      :root {
        --md-sys-color-primary: #d0bcff;
        --md-sys-color-secondary: #ccc2dc;
        --md-sys-color-secondary-container: #4a4458;
        --md-sys-color-on-secondary-container: #e8def8;
        --md-sys-color-surface-container: #211f26;
        --md-sys-color-surface-container-low: #1d1b20;
        --md-sys-color-surface-container-high: #2b2930;
        --md-sys-color-on-surface: #e6e0e9;
        --md-sys-color-on-surface-variant: #cac4d0;
        --md-sys-color-outline-variant: #49454f;
        --md-sys-color-error: #f2b8b5;
        --md-sys-shape-corner-small: 8px;
        --md-sys-shape-corner-medium: 12px;
        --md-sys-shape-corner-full: 9999px;
        --md-motion-duration-short2: 100ms;
        --md-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--markdown-bg, #1e1e1e);
      }
      /* The viewer root mirrors the WebView fullscreen overlay container so
         the reused fullscreen.css markdown styling applies unchanged. */
      #viewer-root {
        position: absolute;
        inset: 0;
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- entry.ts builds the markdown-fullscreen-overlay structure inside. -->
    <div id="viewer-root"></div>
    <script type="module" src="./entry.ts"></script>
  </body>
</html>
