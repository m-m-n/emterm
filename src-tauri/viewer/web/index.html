<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eMterm Markdown Viewer</title>
    <style>
      /* The viewer page does not load web-shared/styles.css, so the few
         theme-INDEPENDENT MD3 tokens the child WebView CSS references (shape
         and motion, shared by fullscreen.css and the front matter block) are
         mirrored here. Values must match web-shared/styles.css :root — an
         automated drift test (viewer/web/entry.test.ts) pins them to it.
         Color tokens are intentionally NOT copied: the front matter block draws
         its colors from the theme-aware --markdown-* variables the viewer sets
         per effective theme, so it follows light/dark instead of being locked
         to a hardcoded dark palette. */
      :root {
        --md-sys-shape-corner-small: 8px;
        --md-sys-shape-corner-medium: 12px;
        --md-sys-shape-corner-full: 9999px;
        --md-motion-duration-short2: 100ms;
        --md-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--markdown-bg, #1e1e1e);
      }
      /* The viewer root mirrors the WebView fullscreen overlay container so
         the reused fullscreen.css markdown styling applies unchanged. */
      #viewer-root {
        position: absolute;
        inset: 0;
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- entry.ts builds the markdown-fullscreen-overlay structure inside. -->
    <div id="viewer-root"></div>
    <script type="module" src="./entry.ts"></script>
  </body>
</html>
