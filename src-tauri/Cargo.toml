[package]
name = "emterm"
version = "1.9.0"
edition = "2024"
publish = false
description = "Native terminal emulator with rich rendering capabilities (Linux + Windows)"

[[bin]]
name = "emterm"
path = "src/main.rs"

# Library facade so integration tests can call `cli::run` in-process.
# The binary above still owns the full module tree; the library only
# re-exposes the subset required by `cli` (see `src/lib.rs`).
[lib]
name = "emterm"
path = "src/lib.rs"

[features]
default = ["gui"]

# `gui` enables the windowed terminal (winit + wgpu + egui + wry child
# WebViews). Disabling it (`--no-default-features`) yields a CLI build
# that still ships the mux daemon / bridge / CLI plus the
# `markdown` / `json` / `yaml` / `image` subcommands, but skips winit /
# wgpu / wry / GTK / WebKitGTK and the font rasterizer stack. That CLI
# build is what `EMTERM_CLI_ONLY=1 bash scripts/build-dpkg.sh` packages
# as `emterm-cli` (Depends: libc6) for headless SSH hosts.
gui = [
    "dep:winit",
    "dep:wgpu",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:wry",
    "dep:swash",
    "dep:zeno",
    "dep:fontdb",
    "dep:skrifa",
    "dep:tiny-skia",
    "dep:ab_glyph",
    "dep:resvg",
    "dep:rodio",
    "dep:arboard",
    "dep:notify-rust",
    "dep:raw-window-handle",
    "dep:pollster",
    "dep:term_images",
    "dep:regex",
    "dep:unicode-width",
    "dep:unicode-segmentation",
    # target-specific GUI deps; Cargo gracefully skips these on
    # non-matching targets even when `gui` is enabled.
    "dep:gtk",
    "dep:opener",
]

[dependencies]
# === CLI-shared dependencies (always built) ===

# app_settings: the shared settings.json schema. Used by both the GUI
# settings loader and `cli::active_locale` (the latter reads just the
# `language` field via `crate::settings::settings_path`).
app_settings = { path = "../crates/app_settings" }

# Logging
log = "0.4"
env_logger = "0.11"

# OS locale detection for `language = "auto"` (i18n.rs).
sys-locale = "0.3"

# Serialization. `serde_json` preserve_order keeps document order for
# the JSON/YAML data viewer outline (matches the WebView's JSON.parse).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.11"

# Utilities used by both GUI and CLI paths.
parking_lot = "0.12"
crossbeam-channel = "0.5"
bytes = "1"
base64 = "0.22"
once_cell = "1"

# CLI subcommand support (markdown / json / yaml / image).
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# Image codecs. Required by `cli::image` (decoding user-provided files)
# and `cli::protocols::kitty` (PNG encoding for the APC payload).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# === GUI-only dependencies (optional, enabled by the `gui` feature) ===

# Window + event loop. Phase 4-G-2 redesign (2026-05-14) replaced
# tao 0.34 with winit 0.30.9. tao did not expose XKB keycodes, breaking
# self-built XIM; winit provides native IME via WindowEvent::Ime on
# X11 / Wayland / Windows. default-features=false drops Android/iOS;
# x11 + wayland for Linux platform support (raw-window-handle 0.6 support
# is built in by default in 0.31, no separate feature flag needed).
# Pinned to the exact 0.31.0-beta.2 beta; bump to the plain version
# requirement once 0.31 stable is released.
winit = { version = "=0.31.0-beta.2", default-features = false, features = ["x11", "wayland", "wayland-dlopen"], optional = true }

# GPU surface + egui rendering
wgpu = { version = "22", optional = true }
egui = { version = "0.29", optional = true }
egui-wgpu = { version = "0.29", optional = true }

# WebView for the child Markdown / settings / data viewer windows.
wry = { version = "0.53", optional = true }

# term_core (Phase 6: replaces native-poc's stand-in parser/grid).
# Always built — the CLI-shared `mux` / `pty` modules depend on it.
term_core = { path = "../crates/term_core" }

# term_images (Phase 5: inline Kitty / SIXEL image decoders + APC/DCS parsers)
term_images = { path = "../crates/term_images", optional = true }

# mux_ipc (Phase 4-A): shared protocol types. Consumed by the mux daemon
# and bridge. APC payloads embedded in the PTY stream are decoded via
# `MuxMessage::from_apc` and applied to the active tab.
mux_ipc = { path = "../crates/mux_ipc" }

# PTY (Phase 2). Always built — `crate::pty` is part of the CLI-shared
# mux subsystem.
portable-pty = "0.8"

# Clipboard (Phase 4)
arboard = { version = "3", optional = true }

# OS notifications (Phase 6) — OSC 9. Linux uses D-Bus
# org.freedesktop.Notifications.
notify-rust = { version = "4", optional = true }

# Unicode (Phase 3) — used by GUI render and term_core consumers.
unicode-width = { version = "0.2", optional = true }
unicode-segmentation = { version = "1.12", optional = true }

# URL / file-path link detection (links.rs).
regex = { version = "1", optional = true }

# Utilities used only by the GUI event loop and renderer.
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# Font rasterizer stack (Phase 4-H / font-swash-migration).
# swash is pinned at = 0.1.x per NFR3 (single-maintainer churn guard);
# zeno is its companion vector → bitmap rasterizer; fontdb enumerates the
# host font database and registers our bundled fonts as primary fallbacks.
swash = { version = "=0.1.18", optional = true }
zeno = { version = "0.2", optional = true }
fontdb = { version = "0.21", optional = true }

# COLRv1 vector emoji rasterization (colrv1-emoji-vector-rendering).
# Both crates already link transitively via resvg 0.44; promoting them
# to direct GUI-only deps gates the new code path under `gui` without
# growing the CLI link footprint. skrifa walks the COLRv1 paint graph
# (`MetadataProvider::color_glyphs`); tiny-skia rasterizes it.
skrifa = { version = "0.20", optional = true }
tiny-skia = { version = "0.11", optional = true }

# ab_glyph is the legacy fallback rasterizer (FR5 escape hatch).
ab_glyph = { version = "0.2", optional = true }

# SVG rasterizer for the window-chrome app icon (render::app_icon).
resvg = { version = "0.44", default-features = false, optional = true }
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }

# === mux daemon / bridge / CLI dependencies (always built) ===
# The `emterm mux ...` CLI dispatch (daemon + bridge + session manager)
# ships in every build, including the CLI build, so headless SSH hosts
# can run `emterm mux --daemon` without pulling in GUI deps.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "io-util", "io-std", "signal", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
chrono = "0.4"
anyhow = "1"
hostname = "0.4"
vt100 = "0.16"

[build-dependencies]
# Windows resource compiler. Used by `build.rs` (Windows-target only) to
# embed `icons/icon.ico` into `emterm.exe`'s PE resource section so the
# taskbar, Alt+Tab, and Explorer all render the eMterm icon (FR1 / NFR1).
# Non-Windows builds never invoke the crate — `build.rs` gates the call
# behind `CARGO_CFG_TARGET_OS == "windows"`.
#
# Why this is NOT moved to `[target.'cfg(windows)'.build-dependencies]`
# even though it would skip the crate on native Linux builds: `build.rs`
# is compiled for the HOST, and `#[cfg(target_os = "windows")]` in
# `build.rs` source therefore evaluates the HOST OS, not the cargo
# target. `make win-build` cross-builds from a Linux host via
# `cargo xwin`, so any host-side cfg gate would suppress the embed step
# and `emterm.exe` would ship without an icon — defeating FR1. Until
# Cargo grows a build-script-side TARGET cfg, the cleanest correct shape
# is to keep `winresource` as an unconditional build-dep and gate the
# call at runtime via `CARGO_CFG_TARGET_OS`. The compile-time cost on
# Linux is one tiny crate that is never invoked.
winresource = "0.1"

[dev-dependencies]
# PNG encoder used by examples/swash_emoji.rs (PoC PNG dump, FR1).
png = "0.17"

# Temporary files for ported CLI subcommand unit tests.
tempfile = "3"

# Scoped env-var manipulation for mux daemon/bridge tests (HOME / XDG /
# EMTERM_MUX overrides without leaking into sibling tests). The crate
# is published as `temp-env` but exposes itself as `temp_env`.
temp_env = { package = "temp-env", version = "0.3" }

# Wire-protocol types + client-side terminal parser for the mux throughput
# integration test (tests/mux_throughput.rs). These are the same crates the
# GUI build links via the `gui` feature; depending on them as dev-deps lets the
# (feature-agnostic) test binary speak the daemon protocol and replay PtyOutput
# through the real client parser without enabling the whole GUI feature set.
mux_ipc = { path = "../crates/mux_ipc" }
term_core = { path = "../crates/term_core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: libc::localtime_s + libc::tm for chrono-free local-time
# decomposition (see `crate::localtime`). Without this, the non-unix
# fallback returns UTC, so the status bar `time` provider shows UTC and
# `emterm.log` lines carry `+00:00` regardless of the user's wall clock.
[target.'cfg(windows)'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK 3 — the child `--viewer` window host on Linux. Optional because the
# CLI-only build never spawns a viewer process and therefore does not need
# GTK/WebKitGTK at link time (CLI deb depends on libc6 only). Enabled by
# the `gui` feature in the workspace [features] section above.
gtk = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
# URL opener for Ctrl+click links (window_host::open_url). Uses
# ShellExecuteW, which takes the URL as a parameter and never routes it
# through cmd.exe parsing — `cmd /c start <url>` would let cmd
# metacharacters (`&`, `|`, `^`) in a PTY-supplied URL inject commands.
opener = { version = "0.7", optional = true }

# Win32 console mode control for the mux bridge stdin raw mode (see
# `src/mux/bridge.rs`). Always linked on Windows because the bridge is
# part of the CLI-shared build as well as the GUI build.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # IMM32 (task0001, windows-imm32-ime-direct): direct
    # ImmGetContext / ImmSetCompositionWindow / ImmSetCandidateWindow /
    # ImmReleaseContext calls from the Windows `BridgeWindow` cursor-area
    # sink in `src/ime/winit_bridge.rs`, bypassing winit's
    # `request_ime_update` for that one call.
    "Win32_UI_Input_Ime",
] }

# Phase 4-G-1 redesign (2026-05-14): removed x11-dl / wayland-client /
# wayland-protocols / windows. The self-built XIM / zwp_text_input_v3 /
# IMM32 clients did not work in practice because tao 0.34 does not
# expose XKB keycodes; Phase 4-G-3 routes IME through winit instead.

# NOTE: dev/release profiles are managed at the workspace root Cargo.toml
# (see top-level Cargo.toml). Per-package profile sections produce
# warnings and are ignored by Cargo when a workspace root profile exists.

[[example]]
name = "swash_emoji"
required-features = ["gui"]

[[example]]
name = "bold_raster_probe"
required-features = ["gui"]

[[example]]
name = "font_select_probe"
required-features = ["gui"]

[[example]]
name = "m_placement_probe"
required-features = ["gui"]
