[package]
name = "emterm"
version = "0.1.0"
description = "A cross-platform terminal emulator with rich rendering capabilities"
authors = ["m-m-n"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"

# PTY dependencies
portable-pty = "0.8"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
futures = "0.3"
anyhow = "1"

# Image processing dependencies
png = "0.17"
gif = "0.13"
base64 = "0.22"
flate2 = "1"
clap = { version = "4.5.54", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.24.0"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"

[[test]]
name = "markdown_tests"
path = "tests/integration/markdown_tests.rs"

[[test]]
name = "image_tests"
path = "tests/integration/image_tests.rs"

[[test]]
name = "sixel_tests"
path = "tests/integration/sixel_tests.rs"

[[bench]]
name = "command_benchmarks"
harness = false
