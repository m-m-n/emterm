[package]
name = "emterm"
version = "0.0.0"
description = "A terminal emulator for Linux and Windows with rich rendering capabilities"
authors = ["m-m-n"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["gui"]
gui = [
    "tauri",
    "tauri-plugin-clipboard-manager",
    "tauri-plugin-dialog",
    "tauri-plugin-notification",
    "tauri-plugin-shell",
    "portable-pty",
    "tokio",
    "futures",
    "font-kit",
    "tauri-build",
    "raw-window-handle",
    "windows",
]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
tauri = { version = "2.9.5", features = [], optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

# PTY dependencies
portable-pty = { version = "0.8", optional = true }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "io-util", "signal"], optional = true }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
futures = { version = "0.3", optional = true }
anyhow = "1"
bincode = "1.3"

# Image processing dependencies
png = "0.17"
gif = "0.13"
base64 = "0.22"
flate2 = "1"
clap = { version = "4.5.54", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rust-i18n = "3"
sys-locale = "0.3"
font-kit = { version = "0.14", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
]
optional = true

[dev-dependencies]
tempfile = "3.24.0"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"

[[test]]
name = "download_tests"
path = "tests/integration/download_tests.rs"

[[test]]
name = "markdown_tests"
path = "tests/integration/markdown_tests.rs"

[[test]]
name = "image_tests"
path = "tests/integration/image_tests.rs"

[[test]]
name = "sixel_tests"
path = "tests/integration/sixel_tests.rs"

[[bench]]
name = "command_benchmarks"
harness = false
